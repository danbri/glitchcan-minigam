<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple Hollow: Aslan Rising</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #0f0f1a 0%, #1a1025 50%, #0d1117 100%);
            color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #game-container {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(180deg, rgba(20, 20, 35, 0.98) 0%, rgba(15, 15, 25, 0.99) 100%);
            border-radius: 20px;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }
    
        #header {
            background: linear-gradient(180deg, rgba(30, 25, 45, 0.9) 0%, transparent 100%);
            padding: 20px 20px 0;
            text-align: center;
        }

        #title {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 50%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        #subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        #tabs {
            display: flex;
            justify-content: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 12px;
            margin: 0 auto;
            width: fit-content;
        }

        .tab {
            padding: 8px 24px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab:hover {
            color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
    
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        #video-container {
            position: relative;
            width: 100%;
            padding-bottom: 177.78%;
            background: linear-gradient(180deg, #0a0a12 0%, #000 100%);
            border-radius: 0;
        }

        #video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    
    #video-link-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.4) 70%, transparent 100%);
        padding: 12px 16px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: opacity 0.6s ease, transform 0.4s ease;
        opacity: 1;
    }

    #video-link-overlay.faded {
        opacity: 0;
        pointer-events: none;
        transform: translateY(100%);
    }

    #video-link-overlay.hover-reveal:hover {
        opacity: 1;
        transform: translateY(0);
    }

    .overlay-hint {
        color: rgba(255, 255, 255, 0.6);
        font-size: 11px;
        letter-spacing: 0.3px;
    }

    .watch-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        text-decoration: none;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        font-size: 12px;
        font-weight: 500;
        transition: all 0.25s ease;
        backdrop-filter: blur(10px);
    }

    .watch-button:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.5);
        transform: scale(1.03);
    }

    .watch-button svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
    }

    .watch-instruction {
        display: none;
    }
    
        #scene-info {
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.3) 0%, transparent 100%);
        }

        #scene-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        #scene-id {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            font-family: 'SF Mono', 'Consolas', monospace;
            letter-spacing: 0.5px;
        }

        #choices {
            padding: 8px 16px 20px;
        }

        .choice-button {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 450;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
            font-family: inherit;
            position: relative;
            gap: 12px;
        }

        .choice-button::before {
            content: '›';
            font-size: 18px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.15s ease;
        }

        .choice-button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .choice-button:hover::before {
            color: #a78bfa;
            transform: translateX(3px);
        }

        .choice-button:active {
            transform: translateY(0) scale(0.99);
            background: rgba(255, 255, 255, 0.06);
        }
    
        #map-container {
            width: 100%;
            height: 500px;
            background: linear-gradient(180deg, #0a0a14 0%, #0d0d18 100%);
            position: relative;
            overflow: hidden;
        }

        #story-map {
            width: 100%;
            height: 100%;
        }

        .map-node {
            cursor: pointer;
            transition: all 0.2s;
        }

        .map-node circle {
            stroke-width: 2px;
            transition: all 0.2s;
        }

        .map-node:hover circle {
            stroke-width: 3px;
            filter: brightness(1.2);
        }

        .map-node.visited circle {
            opacity: 1;
        }

        .map-node.unvisited circle {
            opacity: 0.35;
        }

        .map-node.current circle {
            stroke-width: 3px;
            filter: drop-shadow(0 0 10px currentColor);
            animation: pulse-node 2s infinite;
        }

        @keyframes pulse-node {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .map-node text {
            font-size: 9px;
            font-weight: 600;
            text-anchor: middle;
            fill: rgba(255, 255, 255, 0.9);
            pointer-events: none;
        }

        .map-link {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 1px;
            transition: all 0.2s;
        }

        .map-link.traveled {
            stroke: #a78bfa;
            stroke-width: 2px;
            opacity: 0.7;
        }

        .map-controls {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }

        .map-control-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.15s;
        }

        .map-control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .map-legend {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 10px;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 3px 0;
            color: rgba(255, 255, 255, 0.5);
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
        }
    
        #footer {
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        #progress {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'SF Mono', 'Consolas', monospace;
        }

        .footer-button {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .footer-button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    
        .end-screen {
            padding: 40px 24px;
            text-align: center;
        }

        .end-title {
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .end-message {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .end-stats {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 24px;
            display: inline-block;
        }

        .stat-line {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin: 6px 0;
            font-family: 'SF Mono', 'Consolas', monospace;
        }

        .restart-button {
            padding: 12px 32px;
            background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .restart-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(167, 139, 250, 0.4);
        }
    
        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            #game-container {
                max-width: 100%;
                border-radius: 0;
            }

            #title {
                font-size: 20px;
            }

            #scene-title {
                font-size: 16px;
            }

            .choice-button {
                font-size: 13px;
                padding: 12px 14px;
            }

            #video-link-overlay {
                padding: 10px 12px 8px;
            }

            .overlay-hint {
                font-size: 10px;
            }

            .watch-button {
                padding: 5px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header">
            <div id="title">Maple Hollow: Aslan Rising</div>
            <div id="subtitle">An Interactive Story</div>
            <div id="tabs">
                <button type="button" class="tab active" onclick="switchTab('story')">Story</button>
                <button type="button" class="tab" onclick="switchTab('map')">Map</button>
            </div>
        </div>

        <div id="story-content" class="tab-content active">
        <div id="video-container">
            <iframe id="video-player"
                    title="Story video player"
                    src="about:blank"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
            </iframe>
            <div id="video-link-overlay">
                <span class="overlay-hint">Video blocked? Open externally</span>
                <a id="external-link" href="#" target="_blank" rel="noopener noreferrer" class="watch-button">
                    <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                    YouTube
                </a>
            </div>
        </div>
        
        <div id="scene-info">
            <div id="scene-title"></div>
            <div id="scene-id"></div>
        </div>
        
        <div id="choices"></div>
    </div>
    
    <div id="map-content" class="tab-content">
        <div id="map-container">
            <svg id="story-map"></svg>
            <div class="map-controls">
                <button type="button" class="map-control-btn" onclick="resetMapView()">Reset View</button>
                <button type="button" class="map-control-btn" onclick="centerOnCurrent()">Center Current</button>
            </div>
            <div class="map-legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background: #10b981;"></div>
                    <span>Entry</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #8ab4f8;"></div>
                    <span>Current</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #fbbf24;"></div>
                    <span>Visited</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #4a5568; opacity: 0.4;"></div>
                    <span>Unvisited</span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="footer">
        <div id="progress"></div>
        <div>
            <button type="button" class="footer-button" onclick="toggleHistory()">History</button>
            <button type="button" class="footer-button" onclick="restartStory()">Restart</button>
        </div>
    </div>
</div>

<script>
    const storyData = {
        'scene-mh01': {

            clip: 'clip-mh01',

        },
        'scene-fp06': {
            title: 'Festival Preparations',
            clip: 'clip-fp06',
            url: 'https://youtube.com/embed/TBPoH_FyWLw',
            externalUrl: 'https://youtube.com/watch?v=TBPoH_FyWLw',
            choices: [
                { text: 'Keep hanging—hands brush again', target: 'scene-sr08' },
                { text: 'Ben calls Emma aside', target: 'scene-lp05' },
                { text: 'Power flickers—golden flare', target: 'scene-al10' }
            ]
        },
        'scene-sk07': {
            title: "A Stranger's Kindness",
            clip: 'clip-sk07',
            url: 'https://youtube.com/embed/5BT8jT16n88',
            externalUrl: 'https://youtube.com/watch?v=5BT8jT16n88',
            choices: [
                { text: 'Cocoa detour', target: 'scene-hc04' },
                { text: 'Back to the station', target: 'scene-mh01' },
                { text: 'Camera catches strange light', target: 'scene-al10' }
            ]
        },
        'scene-sr08': {
            title: 'The Song Returns',
            clip: 'clip-sr08',
            url: 'https://youtube.com/embed/LpjWnlA5Eus',

            choices: [
                { text: 'Smile—head to festival', target: 'scene-fp06' },
                { text: 'Change the subject—bakery', target: 'scene-hc04' },
                { text: 'Soft duet—snow intensifies', target: 'scene-al10' }
            ]
        },
        'scene-bo09': {
            title: 'Bake-Off Mishap',
            clip: 'clip-bo09',
            url: 'https://youtube.com/embed/gY0AynfJ3m8',
            externalUrl: 'https://youtube.com/watch?v=gY0AynfJ3m8',
            choices: [
                { text: 'Team up for the contest', target: 'scene-fp06' },
                { text: 'Flour war spills outside', target: 'scene-lp05' },
                { text: 'Grandma June taste-test', target: 'scene-al10' }
            ]
        },
        'scene-al10': {
            title: 'The Lights of Rising',
            clip: 'clip-al10',
            url: 'https://youtube.com/embed/mj1Dqod1MTA',
            externalUrl: 'https://youtube.com/watch?v=mj1Dqod1MTA',
            choices: [
                { text: 'Emma & Jake hold hands—soft end', target: 'END' },
                { text: "Lily's smile—loop back", target: 'scene-mh01' },
                { text: 'Lantern flares—new hook', target: 'scene-sk07' }
            ]
        }
    };

    let currentScene = 'scene-mh01';
    let storyHistory = [];
    let choiceCount = 0;
    let mapInitialized = false;
    let svgGroup, currentTransform;

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            if ((tabName === 'story' && tab.textContent === 'Story') ||
                (tabName === 'map' && tab.textContent === 'Map')) {
                tab.classList.add('active');
            }
        });
        
        if (tabName === 'story') {
            document.getElementById('story-content').classList.add('active');
        } else if (tabName === 'map') {
            document.getElementById('map-content').classList.add('active');
            if (!mapInitialized) {
                initializeMap();
                mapInitialized = true;
            }
            updateMap();
        }
    }

    function initializeMap() {
        const mapContainer = document.getElementById('story-map');
        const width = mapContainer.clientWidth || 900;
        const height = 600;
        
        mapContainer.setAttribute('width', width);
        mapContainer.setAttribute('height', height);
        
        svgGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        mapContainer.appendChild(svgGroup);
        
        let isPanning = false;
        let startPoint = { x: 0, y: 0 };
        currentTransform = { x: 0, y: 0, scale: 1 };
        
        const updateTransform = () => {
            svgGroup.setAttribute('transform', 
                `translate(${currentTransform.x},${currentTransform.y}) scale(${currentTransform.scale})`);
        };
        
        mapContainer.addEventListener('mousedown', (e) => {
            if (e.target.closest('.map-node')) return;
            isPanning = true;
            startPoint = { x: e.clientX - currentTransform.x, y: e.clientY - currentTransform.y };
        });
        
        mapContainer.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            currentTransform.x = e.clientX - startPoint.x;
            currentTransform.y = e.clientY - startPoint.y;
            updateTransform();
        });
        
        mapContainer.addEventListener('mouseup', () => {
            isPanning = false;
        });
        
        mapContainer.addEventListener('mouseleave', () => {
            isPanning = false;
        });
        
        mapContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            currentTransform.scale *= delta;
            currentTransform.scale = Math.max(0.5, Math.min(3, currentTransform.scale));
            updateTransform();
        });
        
        const nodes = [
            { id: 'scene-mh01', x: width/2, y: 50, label: 'mh01', color: '#10b981' },
            { id: 'scene-rj02', x: width/3, y: 150, label: 'rj02', color: '#6366f1' },
            { id: 'scene-hc04', x: width/2, y: 200, label: 'hc04', color: '#8ab4f8' },
            { id: 'scene-sk07', x: width*2/3, y: 150, label: 'sk07', color: '#6366f1' },
            { id: 'scene-tp03', x: width/4, y: 280, label: 'tp03', color: '#6366f1' },
            { id: 'scene-lp05', x: width/6, y: 380, label: 'lp05', color: '#6366f1' },
            { id: 'scene-fp06', x: width/2, y: 350, label: 'fp06', color: '#8ab4f8' },
            { id: 'scene-sr08', x: width*3/4, y: 280, label: 'sr08', color: '#6366f1' },
            { id: 'scene-bo09', x: width*3/5, y: 450, label: 'bo09', color: '#6366f1' },
            { id: 'scene-al10', x: width/2, y: 500, label: 'al10', color: '#f59e0b' },
            { id: 'END', x: width/2, y: 580, label: 'END', color: '#ef4444' }
        ];
        
        const links = [];
        Object.keys(storyData).forEach(sceneId => {
            const scene = storyData[sceneId];
            scene.choices.forEach(choice => {
                const source = nodes.find(n => n.id === sceneId);
                const target = nodes.find(n => n.id === choice.target);
                if (source && target) {
                    links.push({ source, target, sourceId: sceneId, targetId: choice.target });
                }
            });
        });
        
        links.forEach(link => {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const dx = link.target.x - link.source.x;
            const dy = link.target.y - link.source.y;
            const pathData = `M${link.source.x},${link.source.y} Q${(link.source.x + link.target.x)/2},${(link.source.y + link.target.y)/2 - 30} ${link.target.x},${link.target.y}`;
            path.setAttribute('d', pathData);
            path.setAttribute('class', 'map-link');
            path.dataset.source = link.sourceId;
            path.dataset.target = link.targetId;
            svgGroup.appendChild(path);
        });
        
        nodes.forEach(node => {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'map-node unvisited');
            g.setAttribute('transform', `translate(${node.x},${node.y})`);
            g.dataset.sceneId = node.id;
            
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('r', 18);
            circle.setAttribute('fill', node.color);
            circle.setAttribute('stroke', '#e8eaed');
            
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('dy', '0.35em');
            text.textContent = node.label;
            
            g.appendChild(circle);
            g.appendChild(text);
            
            const sceneData = storyData[node.id];
            if (sceneData) {
                const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                title.textContent = sceneData.title;
                g.appendChild(title);
            }
            
            svgGroup.appendChild(g);
            
            g.onclick = () => {
                if (node.id !== 'END') {
                    switchTab('story');
                    loadScene(node.id);
                }
            };
        });
    }
    
    function updateMap() {
        if (!mapInitialized) return;
        
        const visitedSet = new Set(storyHistory);
        
        document.querySelectorAll('.map-node').forEach(node => {
            const sceneId = node.dataset.sceneId;
            node.classList.remove('visited', 'unvisited', 'current');
            
            if (sceneId === currentScene) {
                node.classList.add('current');
            } else if (visitedSet.has(sceneId)) {
                node.classList.add('visited');
            } else {
                node.classList.add('unvisited');
            }
        });
        
        document.querySelectorAll('.map-link').forEach(link => {
            link.classList.remove('traveled');
            const source = link.dataset.source;
            const target = link.dataset.target;
            
            for (let i = 0; i < storyHistory.length - 1; i++) {
                if (storyHistory[i] === source && storyHistory[i + 1] === target) {
                    link.classList.add('traveled');
                    break;
                }
            }
        });
    }
    
    function resetMapView() {
        if (!mapInitialized || !currentTransform) return;
        currentTransform.x = 0;
        currentTransform.y = 0;
        currentTransform.scale = 1;
        svgGroup.setAttribute('transform', 'translate(0,0) scale(1)');
    }
    
    function centerOnCurrent() {
        if (!mapInitialized || !currentTransform) return;
        const currentNode = document.querySelector(`.map-node[data-scene-id="${currentScene}"]`);
        if (currentNode) {
            const transform = currentNode.getAttribute('transform');
            const match = transform.match(/translate\(([^,]+),([^)]+)\)/);
            if (match) {
                const x = parseFloat(match[1]);
                const y = parseFloat(match[2]);
                const mapContainer = document.getElementById('story-map');
                const width = mapContainer.clientWidth;
                const height = 600;
                currentTransform.scale = 1.5;
                currentTransform.x = width/2 - x * currentTransform.scale;
                currentTransform.y = height/2 - y * currentTransform.scale;
                svgGroup.setAttribute('transform', 
                    `translate(${currentTransform.x},${currentTransform.y}) scale(${currentTransform.scale})`);
            }
        }
    }

    function loadScene(sceneId) {
        if (sceneId === 'END') {
            showEndScreen();
            return;
        }

        const scene = storyData[sceneId];
        if (!scene) {
            console.error('Scene not found:', sceneId);
            return;
        }

        currentScene = sceneId;
        storyHistory.push(sceneId);
        choiceCount++;

        document.getElementById('video-player').src = scene.url;
        document.getElementById('external-link').href = scene.externalUrl;
        document.getElementById('scene-title').textContent = scene.title;
        document.getElementById('scene-id').textContent = scene.clip;

        // Reset and schedule overlay fade
        resetOverlay();
        scheduleOverlayFade();

        const choicesContainer = document.getElementById('choices');
        choicesContainer.innerHTML = '';

        scene.choices.forEach(choice => {
            const button = document.createElement('button');
            button.className = 'choice-button';
            button.textContent = choice.text;
            button.onclick = () => loadScene(choice.target);
            choicesContainer.appendChild(button);
        });

        updateProgress();
        updateMap();
    }

    function showEndScreen() {
        const container = document.getElementById('game-container');
        container.innerHTML = `
            <div id="header">
                <div id="title">Maple Hollow: Aslan Rising</div>
                <div id="subtitle">An Interactive Story</div>
            </div>
            <div class="end-screen">
                <div class="end-title">The End</div>
                <div class="end-message">
                    Emma and Jake's story has reached its conclusion.<br>
                    But in Maple Hollow, every ending is just a new beginning.
                </div>
                <div class="end-stats">
                    <div class="stat-line">Scenes visited: ${new Set(storyHistory).size}</div>
                    <div class="stat-line">Choices made: ${choiceCount}</div>
                    <div class="stat-line">Your path: ${storyHistory.slice(-3).join(' → ')}</div>
                </div>
                <button class="restart-button" onclick="restartStory()">Play Again</button>
            </div>
        `;
    }

    function updateProgress() {
        const uniqueScenes = new Set(storyHistory).size;
        const totalScenes = Object.keys(storyData).length;
        document.getElementById('progress').textContent = 
            `Scenes: ${uniqueScenes}/${totalScenes} | Choices: ${choiceCount}`;
    }

    function toggleHistory() {
        const recent = storyHistory.slice(-5).join(' → ');
        alert(`Recent path:\n${recent}`);
    }

    function restartStory() {
        location.reload();
    }

    // Overlay fade management - assumes video plays OK after brief delay
    let overlayFadeTimer = null;

    function resetOverlay() {
        const overlay = document.getElementById('video-link-overlay');
        if (overlay) {
            overlay.classList.remove('faded', 'hover-reveal');
        }
        if (overlayFadeTimer) {
            clearTimeout(overlayFadeTimer);
            overlayFadeTimer = null;
        }
    }

    function scheduleOverlayFade() {
        overlayFadeTimer = setTimeout(() => {
            const overlay = document.getElementById('video-link-overlay');
            if (overlay) {
                overlay.classList.add('faded', 'hover-reveal');
            }
        }, 3500); // Fade after 3.5s assuming video loaded OK
    }

    // Allow manual reveal on video container hover
    document.getElementById('video-container')?.addEventListener('mouseenter', () => {
        const overlay = document.getElementById('video-link-overlay');
        if (overlay?.classList.contains('faded')) {
            overlay.style.opacity = '1';
            overlay.style.transform = 'translateY(0)';
        }
    });

    document.getElementById('video-container')?.addEventListener('mouseleave', () => {
        const overlay = document.getElementById('video-link-overlay');
        if (overlay?.classList.contains('faded')) {
            overlay.style.opacity = '';
            overlay.style.transform = '';
        }
    });

    loadScene('scene-mh01');
</script>
</body>
</html>
