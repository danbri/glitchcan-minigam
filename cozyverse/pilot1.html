<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maple Hollow: Aslan Rising</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
        }

        #game-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        /* === CHOICES AT TOP === */
        #choices-bar {
            position: relative;
            z-index: 20;
            padding: 12px 12px 8px;
            background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 80%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #scene-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        #scene-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        #settings-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #settings-btn:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }

        #settings-btn svg {
            width: 18px;
            height: 18px;
        }

        .choice-button {
            position: relative;
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.15) 0%, rgba(96, 165, 250, 0.15) 100%);
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            overflow: hidden;
            transition: all 0.2s ease;
            animation: shimmer 3s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.3s);
        }

        .choice-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%);
            animation: shimmer-sweep 4s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.5s);
        }

        @keyframes shimmer {
            0%, 100% {
                border-color: rgba(167, 139, 250, 0.3);
                box-shadow: 0 0 0 0 rgba(167, 139, 250, 0);
            }
            50% {
                border-color: rgba(167, 139, 250, 0.6);
                box-shadow: 0 0 20px 0 rgba(167, 139, 250, 0.2);
            }
        }

        @keyframes shimmer-sweep {
            0% { transform: translateX(-100%); }
            50%, 100% { transform: translateX(100%); }
        }

        .choice-button:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.25) 0%, rgba(96, 165, 250, 0.25) 100%);
            border-color: rgba(167, 139, 250, 0.8);
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.4);
        }

        .choice-button:active {
            transform: scale(0.98);
        }

        /* === VIDEO AREA === */
        #video-area {
            flex: 1;
            position: relative;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }

        /* === YOUTUBE OVERLAY (discreet footer) === */
        #video-link-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding: 20px 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: opacity 0.5s ease;
        }

        #video-link-overlay.faded {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-hint {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
        }

        .watch-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .watch-button:hover {
            background: rgba(255,255,255,0.2);
        }

        .watch-button svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        /* === PROGRESS BAR === */
        #progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255,255,255,0.1);
            z-index: 15;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
            width: 10%;
            transition: width 0.5s ease;
        }

        /* === TRANSITION OVERLAY === */
        #transition-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #transition-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #transition-text {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            text-align: center;
            padding: 0 24px;
            max-width: 300px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease 0.2s;
        }

        #transition-overlay.active #transition-text {
            opacity: 1;
            transform: translateY(0);
        }

        /* === CONFETTI CANVAS === */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 90;
        }

        /* === SETTINGS MODAL === */
        #settings-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            display: none;
            flex-direction: column;
            padding: 20px;
        }

        #settings-modal.open {
            display: flex;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .settings-title {
            font-size: 20px;
            font-weight: 600;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .settings-section {
            margin-bottom: 20px;
        }

        .settings-section h3 {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .settings-btn {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
        }

        /* === MAP (in settings) === */
        #map-container {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            min-height: 300px;
        }

        #story-map {
            width: 100%;
            height: 100%;
        }

        .map-node circle {
            stroke-width: 2px;
            transition: all 0.2s;
        }

        .map-node.current circle {
            filter: drop-shadow(0 0 8px currentColor);
            animation: pulse-node 2s infinite;
        }

        .map-node.visited circle { opacity: 1; }
        .map-node.unvisited circle { opacity: 0.3; }

        @keyframes pulse-node {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .map-node text {
            font-size: 8px;
            font-weight: 600;
            text-anchor: middle;
            fill: #fff;
            pointer-events: none;
        }

        .map-link {
            fill: none;
            stroke: rgba(255,255,255,0.1);
            stroke-width: 1px;
        }

        .map-link.traveled {
            stroke: #a78bfa;
            stroke-width: 2px;
            opacity: 0.7;
        }

        /* === END SCREEN === */
        .end-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1025 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 50;
        }

        .end-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .end-message {
            font-size: 16px;
            color: rgba(255,255,255,0.7);
            line-height: 1.5;
            margin-bottom: 24px;
            max-width: 280px;
        }

        .restart-button {
            padding: 14px 40px;
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            border: none;
            border-radius: 24px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .restart-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(167, 139, 250, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Choices at top -->
        <div id="choices-bar">
            <div id="scene-header">
                <div id="scene-title">The Train Arrives</div>
                <button type="button" id="settings-btn" onclick="openSettings()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
            </div>
            <div id="choices"></div>
        </div>

        <!-- Video area -->
        <div id="video-area">
            <div id="video-container">
                <iframe id="video-player"
                        title="Story video"
                        src="about:blank"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen></iframe>
                <div id="video-link-overlay">
                    <span class="overlay-hint">Video blocked?</span>
                    <a id="external-link" href="#" target="_blank" rel="noopener noreferrer" class="watch-button">
                        <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                        YouTube
                    </a>
                </div>
            </div>
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- Transition overlay -->
    <div id="transition-overlay">
        <div id="transition-text"></div>
    </div>

    <!-- Confetti canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Settings modal -->
    <div id="settings-modal">
        <div class="settings-header">
            <div class="settings-title">Settings</div>
            <button type="button" class="close-btn" onclick="closeSettings()">&times;</button>
        </div>

        <div class="settings-section">
            <h3>Progress</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-scenes">1</div>
                    <div class="stat-label">Scenes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-choices">0</div>
                    <div class="stat-label">Choices</div>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <h3>Actions</h3>
            <button type="button" class="settings-btn" onclick="restartStory()">Restart Story</button>
            <button type="button" class="settings-btn" onclick="toggleHistory()">View History</button>
        </div>

        <div class="settings-section">
            <h3>Story Map</h3>
            <div id="map-container">
                <svg id="story-map"></svg>
            </div>
        </div>
    </div>

<script>
    const storyData = {
        'scene-mh01': {
            title: 'The Train Arrives',
            url: 'https://youtube.com/embed/R4ZGGJsho7I?autoplay=1',
            externalUrl: 'https://youtube.com/watch?v=R4ZGGJsho7I',
            choices: [
                { text: 'Spot Jake by the truck', target: 'scene-rj02' },
                { text: 'Go to the bakery', target: 'scene-hc04' },
                { text: 'Watch the snowflake', target: 'scene-sk07' }
            ]
        },
        'scene-rj02': {
            title: 'The Unexpected Reunion',
            url: 'https://youtube.com/embed/BlAGHcJsJio?autoplay=1',
            externalUrl: 'https://youtube.com/watch?v=BlAGHcJsJio',
            choices: [
                { text: 'Walk together toward town', target: 'scene-tp03' },
                { text: 'Keep moving alone', target: 'scene-hc04' },
                { text: 'Snowball ambush!', target: 'scene-lp05' }
            ]
        },
        'scene-tp03': {
            title: 'Old Friends, New Light',
            url: 'https://youtube.com/embed/q6mGKXTJdCw?autoplay=1',
            externalUrl: 'https://youtube.com/watch?v=q6mGKXTJdCw',
            choices: [
                { text: 'Ride to festival', target: 'scene-fp06' },
                { text: 'Hop out to walk', target: 'scene-hc04' },
                { text: 'Their song plays...', target: 'scene-sr08' }
            ]
        },
        'scene-hc04': {
            title: 'The Hearth & Crumb',
            url: 'https://youtube.com/embed/7Fs_xFCEegM?autoplay=1',
            externalUrl: 'https://youtube.com/watch?v=7Fs_xFCEegM',
            choices: [
                { text: 'Talk about staying', target: 'scene-fp06' },
                { text: 'Mention Jake', target: 'scene-tp03' },
                { text: 'Flour poof!', target: 'scene-bo09' }
            ]
        },
        'scene-lp05': {
            title: "Lily's Plan",
            url: 'https://youtube.com/embed/bFo5lWvD8Ms?autoplay=1',
            externalUrl: 'https://youtube.com/watch?v=bFo5lWvD8Ms',
            choices: [
                { text: 'Ben waves Emma over', target: 'scene-fp06' },
                { text: 'Hot cocoa break', target: 'scene-hc04' },
                { text: 'Grandma June overhears', target: 'scene-al10' }
            ]
        },
        'scene-fp06': {
            title: 'Festival Preparations',
            url: 'https://youtube.com/embed/TBPoH_FyWLw?autoplay=1',
            externalUrl: 'https://youtube.com/watch?v=TBPoH_FyWLw',
            choices: [
                { text: 'Hands brush again', target: 'scene-sr08' },
                { text: 'Ben calls Emma aside', target: 'scene-lp05' },
                { text: 'Golden flare!', target: 'scene-al10' }
            ]
        },
        'scene-sk07': {
            title: "A Stranger's Kindness",
            url: 'https://youtube.com/embed/5BT8jT16n88?autoplay=1',
            externalUrl: 'https://youtube.com/watch?v=5BT8jT16n88',
            choices: [
                { text: 'Cocoa detour', target: 'scene-hc04' },
                { text: 'Back to station', target: 'scene-mh01' },
                { text: 'Strange light...', target: 'scene-al10' }
            ]
        },
        'scene-sr08': {
            title: 'The Song Returns',
            url: 'https://youtube.com/embed/LpjWnlA5Eus?autoplay=1',
            externalUrl: 'https://youtube.com/watch?v=LpjWnlA5Eus',
            choices: [
                { text: 'Head to festival', target: 'scene-fp06' },
                { text: 'Bakery instead', target: 'scene-hc04' },
                { text: 'Soft duet...', target: 'scene-al10' }
            ]
        },
        'scene-bo09': {
            title: 'Bake-Off Mishap',
            url: 'https://youtube.com/embed/gY0AynfJ3m8?autoplay=1',
            externalUrl: 'https://youtube.com/watch?v=gY0AynfJ3m8',
            choices: [
                { text: 'Team up for contest', target: 'scene-fp06' },
                { text: 'Flour war outside', target: 'scene-lp05' },
                { text: 'Grandma taste-test', target: 'scene-al10' }
            ]
        },
        'scene-al10': {
            title: 'The Lights of Rising',
            url: 'https://youtube.com/embed/mj1Dqod1MTA?autoplay=1',
            externalUrl: 'https://youtube.com/watch?v=mj1Dqod1MTA',
            choices: [
                { text: 'Hold hands... The End', target: 'END' },
                { text: "Lily smiles... again?", target: 'scene-mh01' },
                { text: 'Lantern flares...', target: 'scene-sk07' }
            ]
        }
    };

    let currentScene = 'scene-mh01';
    let storyHistory = [];
    let choiceCount = 0;
    let mapInitialized = false;
    let overlayFadeTimer = null;

    // === CONFETTI SYSTEM ===
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [];

    function resizeConfetti() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
    }
    resizeConfetti();
    window.addEventListener('resize', resizeConfetti);

    function createHeartConfetti(x, y) {
        const colors = ['#ff6b9d', '#c44569', '#f8a5c2', '#ff4757', '#ff6348', '#ffa502'];
        for (let i = 0; i < 25; i++) {
            confettiParticles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.8) * 10,
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 15,
                scale: 0.5 + Math.random() * 0.8,
                color: colors[Math.floor(Math.random() * colors.length)],
                life: 1
            });
        }
        if (confettiParticles.length === 25) animateConfetti();
    }

    function drawHeart(ctx, x, y, size, rotation, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation * Math.PI / 180);
        ctx.scale(size, size);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -5);
        ctx.bezierCurveTo(-5, -12, -15, -8, -15, 0);
        ctx.bezierCurveTo(-15, 8, 0, 15, 0, 20);
        ctx.bezierCurveTo(0, 15, 15, 8, 15, 0);
        ctx.bezierCurveTo(15, -8, 5, -12, 0, -5);
        ctx.fill();
        ctx.restore();
    }

    function animateConfetti() {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

        confettiParticles = confettiParticles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3; // gravity
            p.rotation += p.rotationSpeed;
            p.life -= 0.015;

            if (p.life > 0) {
                confettiCtx.globalAlpha = p.life;
                drawHeart(confettiCtx, p.x, p.y, p.scale, p.rotation, p.color);
                return true;
            }
            return false;
        });

        confettiCtx.globalAlpha = 1;

        if (confettiParticles.length > 0) {
            requestAnimationFrame(animateConfetti);
        }
    }

    // === TRANSITION SYSTEM ===
    function transitionToScene(choiceText, targetScene) {
        const overlay = document.getElementById('transition-overlay');
        const text = document.getElementById('transition-text');

        // Launch confetti from center
        createHeartConfetti(window.innerWidth / 2, window.innerHeight / 3);

        // Show overlay with choice text
        text.textContent = choiceText;
        overlay.classList.add('active');

        // After fade in, load new scene
        setTimeout(() => {
            loadSceneImmediate(targetScene);

            // Fade out
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 600);
        }, 800);
    }

    // === SCENE LOADING ===
    function loadSceneImmediate(sceneId) {
        if (sceneId === 'END') {
            showEndScreen();
            return;
        }

        const scene = storyData[sceneId];
        if (!scene) return;

        currentScene = sceneId;
        storyHistory.push(sceneId);
        choiceCount++;

        document.getElementById('video-player').src = scene.url;
        document.getElementById('external-link').href = scene.externalUrl;
        document.getElementById('scene-title').textContent = scene.title;

        resetOverlay();
        scheduleOverlayFade();

        const choicesContainer = document.getElementById('choices');
        choicesContainer.innerHTML = '';

        scene.choices.forEach((choice, index) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'choice-button';
            button.textContent = choice.text;
            button.style.setProperty('--i', index);
            button.onclick = (e) => {
                const rect = e.target.getBoundingClientRect();
                createHeartConfetti(rect.left + rect.width / 2, rect.top);
                transitionToScene(choice.text, choice.target);
            };
            choicesContainer.appendChild(button);
        });

        updateProgress();
    }

    function loadScene(sceneId) {
        loadSceneImmediate(sceneId);
    }

    // === OVERLAY FADE ===
    function resetOverlay() {
        const overlay = document.getElementById('video-link-overlay');
        if (overlay) overlay.classList.remove('faded');
        if (overlayFadeTimer) clearTimeout(overlayFadeTimer);
    }

    function scheduleOverlayFade() {
        overlayFadeTimer = setTimeout(() => {
            const overlay = document.getElementById('video-link-overlay');
            if (overlay) overlay.classList.add('faded');
        }, 4000);
    }

    // === PROGRESS ===
    function updateProgress() {
        const uniqueScenes = new Set(storyHistory).size;
        const totalScenes = Object.keys(storyData).length;
        const percent = (uniqueScenes / totalScenes) * 100;

        document.getElementById('progress-fill').style.width = percent + '%';
        document.getElementById('stat-scenes').textContent = uniqueScenes;
        document.getElementById('stat-choices').textContent = choiceCount;
    }

    // === SETTINGS ===
    function openSettings() {
        document.getElementById('settings-modal').classList.add('open');
        if (!mapInitialized) {
            initializeMap();
            mapInitialized = true;
        }
        updateMap();
    }

    function closeSettings() {
        document.getElementById('settings-modal').classList.remove('open');
    }

    function toggleHistory() {
        const recent = storyHistory.slice(-5).map(s => storyData[s]?.title || s).join(' → ');
        alert('Recent path:\n' + recent);
    }

    function restartStory() {
        location.reload();
    }

    // === MAP ===
    function initializeMap() {
        const mapContainer = document.getElementById('story-map');
        const width = mapContainer.clientWidth || 300;
        const height = 280;

        mapContainer.setAttribute('width', width);
        mapContainer.setAttribute('height', height);

        const svgGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        mapContainer.appendChild(svgGroup);

        const nodes = [
            { id: 'scene-mh01', x: width/2, y: 30, label: 'Start', color: '#10b981' },
            { id: 'scene-rj02', x: width*0.25, y: 70, label: 'rj02', color: '#6366f1' },
            { id: 'scene-hc04', x: width/2, y: 90, label: 'hc04', color: '#8ab4f8' },
            { id: 'scene-sk07', x: width*0.75, y: 70, label: 'sk07', color: '#6366f1' },
            { id: 'scene-tp03', x: width*0.2, y: 130, label: 'tp03', color: '#6366f1' },
            { id: 'scene-lp05', x: width*0.15, y: 180, label: 'lp05', color: '#6366f1' },
            { id: 'scene-fp06', x: width/2, y: 160, label: 'fp06', color: '#8ab4f8' },
            { id: 'scene-sr08', x: width*0.8, y: 130, label: 'sr08', color: '#6366f1' },
            { id: 'scene-bo09', x: width*0.65, y: 200, label: 'bo09', color: '#6366f1' },
            { id: 'scene-al10', x: width/2, y: 230, label: 'Finale', color: '#f59e0b' },
            { id: 'END', x: width/2, y: 270, label: 'END', color: '#ef4444' }
        ];

        // Draw links
        Object.keys(storyData).forEach(sceneId => {
            const scene = storyData[sceneId];
            const source = nodes.find(n => n.id === sceneId);
            scene.choices.forEach(choice => {
                const target = nodes.find(n => n.id === choice.target);
                if (source && target) {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M${source.x},${source.y} L${target.x},${target.y}`);
                    path.setAttribute('class', 'map-link');
                    path.dataset.source = sceneId;
                    path.dataset.target = choice.target;
                    svgGroup.appendChild(path);
                }
            });
        });

        // Draw nodes
        nodes.forEach(node => {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'map-node unvisited');
            g.setAttribute('transform', `translate(${node.x},${node.y})`);
            g.dataset.sceneId = node.id;

            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('r', 12);
            circle.setAttribute('fill', node.color);
            circle.setAttribute('stroke', '#fff');

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('dy', '0.35em');
            text.textContent = node.label;

            g.appendChild(circle);
            g.appendChild(text);
            svgGroup.appendChild(g);

            g.onclick = () => {
                if (node.id !== 'END') {
                    closeSettings();
                    transitionToScene(storyData[node.id]?.title || 'Jump to scene', node.id);
                }
            };
        });
    }

    function updateMap() {
        if (!mapInitialized) return;
        const visitedSet = new Set(storyHistory);

        document.querySelectorAll('.map-node').forEach(node => {
            const sceneId = node.dataset.sceneId;
            node.classList.remove('visited', 'unvisited', 'current');

            if (sceneId === currentScene) node.classList.add('current');
            else if (visitedSet.has(sceneId)) node.classList.add('visited');
            else node.classList.add('unvisited');
        });

        document.querySelectorAll('.map-link').forEach(link => {
            link.classList.remove('traveled');
            for (let i = 0; i < storyHistory.length - 1; i++) {
                if (storyHistory[i] === link.dataset.source && storyHistory[i + 1] === link.dataset.target) {
                    link.classList.add('traveled');
                    break;
                }
            }
        });
    }

    // === END SCREEN ===
    function showEndScreen() {
        document.getElementById('game-container').innerHTML = `
            <div class="end-screen">
                <div class="end-title">The End</div>
                <div class="end-message">
                    Emma and Jake's story has reached its conclusion.
                    But in Maple Hollow, every ending is just a new beginning.
                </div>
                <div class="stats-grid" style="margin-bottom: 24px;">
                    <div class="stat-card">
                        <div class="stat-value">${new Set(storyHistory).size}</div>
                        <div class="stat-label">Scenes</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${choiceCount}</div>
                        <div class="stat-label">Choices</div>
                    </div>
                </div>
                <button type="button" class="restart-button" onclick="restartStory()">Play Again</button>
            </div>
        `;

        // Celebration confetti
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                createHeartConfetti(
                    Math.random() * window.innerWidth,
                    Math.random() * window.innerHeight * 0.5
                );
            }, i * 200);
        }
    }

    // Start the game
    loadScene('scene-mh01');
</script>
</body>
</html>
