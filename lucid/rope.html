<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucid — XPBD chain on clipclop (WebGPU)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#05080d; color:#cfe3ff; font:14px/1.5 ui-monospace, Menlo, monospace; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #boot b { color:#39c0ff; }
  #boot.err { color:#ff6b6b; }
</style>
</head>
<body>
<div id="boot">settling the chain and booting clipclop (WebGPU)…</div>

<!--
  Boots the clipclop engine TOP-LEVEL (document.write), not in a blob iframe, so
  one WebGPU device inits in the page context (reliable; the iframe path booted
  black intermittently). An XPBD chain settles to a catenary on the CPU, then
  folds through the exact culled edit-list field on the engine's real bake path.
-->
<script type="module">
  import { bootSplicedTopLevel } from './clipclop/splice-lib.js';
  import { defaultPhysicsConfig, buildChain, stepXPBD } from './core/gpu-physics.js';

  const boot = document.getElementById('boot');
  const cfg = defaultPhysicsConfig(); cfg.radius = 0.13; cfg.bound = 6;

  const chain = buildChain(16, [-2.4, 3.2, 0], [2.4, 3.2, 0], cfg);
  for (let i = 0; i < 500; i++) stepXPBD(chain.bodies, chain.constraints, cfg, 16);
  const N = chain.bodies.length;
  const children = chain.bodies.map((b, i) => ({
    type: 'sphere',
    params: { r: (i === 0 || i === N - 1) ? cfg.radius * 1.5 : cfg.radius,
      color: (i === 0 || i === N - 1) ? [0.9, 0.85, 0.3] : [0.35 + 0.5 * (i / N), 0.55, 0.9] },
    transform: { translate: b.p.slice() }
  }));
  let maxErr = 0;
  for (const c of chain.constraints) {
    const a = chain.bodies[c.a].p, b = chain.bodies[c.b].p;
    maxErr = Math.max(maxErr, Math.abs(Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) - c.rest));
  }
  // place the hanging chain where the clipclop camera looks (world is metres)
  const scene = { name: 'rope', root: { type: 'transform', transform: { translate: [0, 2.5, 5], scale: 1.6 },
    child: { type: 'smoothUnion', k: cfg.radius * 0.9, children } } };

  const overlay =
    `<div style="position:fixed;top:0;left:0;right:0;z-index:99;padding:6px 12px;` +
    `font:12px ui-monospace,monospace;color:#7c93ac;background:rgba(5,8,13,.55);pointer-events:none">` +
    `Lucid · XPBD chain — clipclop WebGPU · edit-list+cull · ${N} beads · max stretch ${maxErr.toFixed(4)}</div>`;

  try {
    const engineHtml = await fetch('./clipclop/index.html', { cache: 'no-store' }).then((r) => {
      if (!r.ok) throw new Error('cannot fetch clipclop engine (' + r.status + ')');
      return r.text();
    });
    bootSplicedTopLevel(engineHtml, scene, { mode: 'editlist', overlay });
  } catch (e) {
    boot.className = 'err';
    boot.textContent = 'error: ' + e.message;
  }
</script>
</body>
</html>
