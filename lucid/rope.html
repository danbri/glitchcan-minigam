<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucid — XPBD joints (hanging chain)</title>
<style>
  :root { color-scheme: dark; --bg:#0a0f16; --panel:#111925; --edge:#1e2c3d; --ink:#cfe3ff; --dim:#7c93ac; --acc:#39c0ff; --ok:#54e39a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.5 ui-monospace, Menlo, monospace; }
  header { padding:10px 14px; border-bottom:1px solid var(--edge); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  header .status { margin-left:auto; font-size:12px; color:var(--ok); }
  main { display:flex; flex-direction:column; height:calc(100% - 46px); }
  #canvas { width:100%; flex:1 1 auto; min-height:220px; display:block; background:#05080d; }
  .panel { border-top:1px solid var(--edge); padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--panel); }
  .panel button { background:#0b1420; color:var(--ink); border:1px solid var(--edge); border-radius:8px; padding:7px 14px; cursor:pointer; font:13px ui-monospace,monospace; }
  .panel button.go { border-color:var(--acc); color:var(--acc); }
  .panel .lbl { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Lucid · XPBD joints</h1>
  <span class="sub">a chain of bodies + distance constraints → a catenary that swings</span>
  <span class="status" id="status">booting…</span>
</header>
<main>
  <canvas id="canvas"></canvas>
  <div class="panel">
    <button type="button" class="go" id="nudge">nudge ⟿</button>
    <button type="button" id="reset">reset</button>
    <span class="lbl" id="info"></span>
  </div>
</main>

<script type="module">
  import { loadJsonScene } from './core/json-loader.js';
  import { generateGlslFromJson } from './core/json-codegen.js';
  import { SimpleRaymarcher } from './mayfly/raymarcher.js';
  import { defaultPhysicsConfig, buildChain, stepXPBD } from './core/gpu-physics.js';

  const $ = (id) => document.getElementById(id);
  const cfg = defaultPhysicsConfig(); cfg.radius = 0.13; cfg.bound = 6;
  let chain;
  function reset() {
    chain = buildChain(16, [-2.4, 3.2, 0], [2.4, 3.2, 0], cfg);
    // settle to the resting catenary before first paint (so it starts hanging)
    for (let i = 0; i < 400; i++) stepXPBD(chain.bodies, chain.constraints, cfg, 16);
  }
  reset();

  const canvas = $('canvas');
  let renderer;
  try { renderer = new SimpleRaymarcher(canvas); }
  catch (e) { $('status').textContent = 'WebGL unavailable'; throw e; }
  // chain hangs in the x-y plane (z=0); this 3/4 angle shows the vertical sag
  renderer.cameraDistance = 9;
  renderer.cameraTheta = 0.32;
  renderer.cameraPhi = 0.42;
  renderer.cameraTarget = [0, 2.1, 0];

  function fit() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    if (renderer.resize) renderer.resize(canvas.width, canvas.height);
  }
  window.addEventListener('resize', fit);

  $('reset').onclick = reset;
  $('nudge').onclick = () => { for (const b of chain.bodies) if (b.w > 0) b.v[2] += 6; };

  // drag to orbit
  let dr = null;
  canvas.addEventListener('pointerdown', (e) => { dr = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('pointermove', (e) => {
    if (!dr) return;
    renderer.cameraTheta -= (e.clientX - dr.x) * 0.01;
    renderer.cameraPhi = Math.max(-0.3, Math.min(1.3, renderer.cameraPhi + (e.clientY - dr.y) * 0.01));
    dr = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointerup', () => { dr = null; });

  function scene() {
    const n = chain.bodies.length;
    const children = chain.bodies.map((b, i) => ({
      type: 'sphere',
      params: { r: i === 0 || i === n - 1 ? cfg.radius * 1.5 : cfg.radius,
        color: i === 0 || i === n - 1 ? [0.9, 0.85, 0.3] : [0.35 + 0.5 * (i / n), 0.55, 0.9] },
      transform: { translate: b.p.slice() }
    }));
    return { name: 'rope', root: { type: 'smoothUnion', k: cfg.radius * 0.9, children } };
  }

  let frame = 0;
  function loop() {
    stepXPBD(chain.bodies, chain.constraints, cfg, 16);
    renderer.updateScene(generateGlslFromJson(loadJsonScene(scene()), {}));
    if (renderer.render) renderer.render();
    if ((frame++ % 20) === 0) {
      let maxErr = 0;
      for (const c of chain.constraints) {
        const a = chain.bodies[c.a].p, b = chain.bodies[c.b].p;
        maxErr = Math.max(maxErr, Math.abs(Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) - c.rest));
      }
      $('info').textContent = `${chain.constraints.length} joints · max stretch ${maxErr.toFixed(4)}`;
      $('status').textContent = 'hanging';
      window.__rope = { ok: true, joints: chain.constraints.length, maxErr };
    }
    requestAnimationFrame(loop);
  }
  fit(); loop();
</script>
</body>
</html>
