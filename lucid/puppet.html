<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucid — physics puppet (quadruped ragdoll)</title>
<style>
  :root { color-scheme: dark; --bg:#0a0f16; --panel:#111925; --edge:#1e2c3d; --ink:#cfe3ff; --dim:#7c93ac; --acc:#39c0ff; --ok:#54e39a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.5 ui-monospace, Menlo, monospace; }
  header { padding:10px 14px; border-bottom:1px solid var(--edge); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  header .status { margin-left:auto; font-size:12px; color:var(--ok); }
  main { display:flex; flex-direction:column; height:calc(100% - 46px); }
  #canvas { width:100%; flex:1 1 auto; min-height:220px; display:block; background:#05080d; }
  .panel { border-top:1px solid var(--edge); padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--panel); }
  .panel button { background:#0b1420; color:var(--ink); border:1px solid var(--edge); border-radius:8px; padding:7px 14px; cursor:pointer; font:13px ui-monospace,monospace; }
  .panel button.go { border-color:var(--acc); color:var(--acc); }
  .panel .lbl { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Lucid · physics puppet</h1>
  <span class="sub">a quadruped skeleton of XPBD bones — drop it, it flops</span>
  <span class="status" id="status">booting…</span>
</header>
<main>
  <canvas id="canvas"></canvas>
  <div class="panel">
    <button type="button" class="go" id="drop">drop ⤓</button>
    <button type="button" id="kick">kick ⤴</button>
    <span class="lbl" id="info"></span>
  </div>
</main>

<script type="module">
  import { loadJsonScene } from './core/json-loader.js';
  import { generateGlslFromJson } from './core/json-codegen.js';
  import { SimpleRaymarcher } from './mayfly/raymarcher.js';
  import { defaultPhysicsConfig, buildQuadrupedRig, stepXPBD } from './core/gpu-physics.js';

  const $ = (id) => document.getElementById(id);
  const cfg = defaultPhysicsConfig(); cfg.radius = 0.16; cfg.bound = 6;
  let rig;
  function drop(settle) {
    rig = buildQuadrupedRig();
    if (settle) for (let i = 0; i < 260; i++) stepXPBD(rig.bodies, rig.constraints, cfg, 20);
  }
  drop(true);   // start settled so the first frame shows a flopped puppet

  const canvas = $('canvas');
  let renderer;
  try { renderer = new SimpleRaymarcher(canvas); }
  catch (e) { $('status').textContent = 'WebGL unavailable'; throw e; }
  renderer.cameraDistance = 6.5;
  renderer.cameraTheta = 0.7;
  renderer.cameraPhi = 0.35;
  renderer.cameraTarget = [0, 0.6, 0];

  function fit() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    if (renderer.resize) renderer.resize(canvas.width, canvas.height);
  }
  window.addEventListener('resize', fit);

  $('drop').onclick = () => drop(false);
  $('kick').onclick = () => { for (const b of rig.bodies) { b.v[1] += 5; b.v[0] += (Math.abs(b.p[0]) > 0 ? Math.sign(b.p[0]) : 1) * 1.5; } };

  // drag to orbit
  let dr = null;
  canvas.addEventListener('pointerdown', (e) => { dr = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('pointermove', (e) => {
    if (!dr) return;
    renderer.cameraTheta -= (e.clientX - dr.x) * 0.01;
    renderer.cameraPhi = Math.max(-0.2, Math.min(1.3, renderer.cameraPhi + (e.clientY - dr.y) * 0.01));
    dr = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointerup', () => { dr = null; });

  // a bone drawn as a short string of beads (no rotation needed → loader-safe)
  function bone(A, B, r, color, out) {
    const steps = 4;
    for (let s = 1; s < steps; s++) {
      const t = s / steps;
      out.push({ type: 'sphere', params: { r, color },
        transform: { translate: [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t] } });
    }
  }

  function scene() {
    const children = [];
    // bones
    for (const [i, j] of rig.bones) bone(rig.bodies[i].p, rig.bodies[j].p, cfg.radius * 0.62, [0.55, 0.42, 0.3], children);
    // joints
    rig.bodies.forEach((b, i) => {
      const isFoot = rig.joints[i].startsWith('foot');
      const isHead = rig.joints[i] === 'head';
      children.push({ type: 'sphere',
        params: { r: cfg.radius * (isHead ? 1.3 : 1), color: isHead ? [0.85, 0.7, 0.5] : isFoot ? [0.3, 0.24, 0.2] : [0.7, 0.55, 0.4] },
        transform: { translate: b.p.slice() } });
    });
    // ground slab
    children.push({ type: 'box', params: { size: [cfg.bound, 0.05, cfg.bound], color: [0.16, 0.18, 0.22] }, transform: { translate: [0, -0.05, 0] } });
    return { name: 'puppet', root: { type: 'smoothUnion', k: cfg.radius * 0.6, children } };
  }

  let frame = 0;
  function loop() {
    stepXPBD(rig.bodies, rig.constraints, cfg, 20);
    renderer.updateScene(generateGlslFromJson(loadJsonScene(scene()), {}));
    if (renderer.render) renderer.render();
    if ((frame++ % 20) === 0) {
      const maxV = Math.max(...rig.bodies.map(b => Math.hypot(...b.v)));
      $('status').textContent = maxV < 0.1 ? 'settled' : 'moving…';
      $('info').textContent = `${rig.bones.length} bones · ${rig.joints.length} joints`;
      window.__puppet = { ok: true, bones: rig.bones.length, joints: rig.joints.length, maxV };
    }
    requestAnimationFrame(loop);
  }
  fit(); loop();
</script>
</body>
</html>
