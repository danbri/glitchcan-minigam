<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucid — physics puppet on clipclop (WebGPU)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#05080d; color:#cfe3ff; font:14px/1.5 ui-monospace, Menlo, monospace; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #boot b { color:#39c0ff; }
  #boot.err { color:#ff6b6b; }
</style>
</head>
<body>
<div id="boot">baking the quadruped and booting clipclop (WebGPU)…</div>

<!--
  Boots the clipclop engine TOP-LEVEL (document.write), not in a blob iframe.
  The engine is self-contained, so a top-level write inits one WebGPU device in
  the page context — this removes the fresh-device-per-iframe race that made the
  spliced demos boot black intermittently. The scene folds through the exact
  culled edit-list field on the engine's real bake path.
-->
<script type="module">
  import { bootSplicedTopLevel } from './clipclop/splice-lib.js';
  import { defaultPhysicsConfig, buildQuadrupedRig, stepXPBD } from './core/gpu-physics.js';
  import { poseQuadrupedFromRig, QUADRUPED_PRESETS } from './core/sdf-template.js';

  const boot = document.getElementById('boot');
  const params = new URLSearchParams(location.search);
  let species = params.get('sp');
  if (!QUADRUPED_PRESETS[species]) species = 'pig';

  // Build a standing, settled quadruped, placed where the clipclop camera looks
  // (world is metres; the view frames roughly (0,3.6,5)).
  const cfg = defaultPhysicsConfig(); cfg.radius = 0.16; cfg.bound = 6;
  const rig = buildQuadrupedRig({ stand: true });
  for (let i = 0; i < 220; i++) stepXPBD(rig.bodies, rig.constraints, cfg, 20);
  const posed = poseQuadrupedFromRig(rig, QUADRUPED_PRESETS[species]);
  const scene = { name: 'puppet', root: { type: 'transform', transform: { translate: [0, 2.6, 5], scale: 3 }, child: posed.root } };

  // Compact overlay: species switcher (each link reloads with ?sp=…).
  const links = Object.keys(QUADRUPED_PRESETS).map((s) => ({ label: s, href: `?sp=${s}`, on: s === species }));

  try {
    const engineHtml = await fetch('./clipclop/index.html', { cache: 'no-store' }).then((r) => {
      if (!r.ok) throw new Error('cannot fetch clipclop engine (' + r.status + ')');
      return r.text();
    });
    // Replaces this document with the booted engine. Nothing after this runs.
    bootSplicedTopLevel(engineHtml, scene, { mode: 'editlist', title: 'puppet', links });
  } catch (e) {
    boot.className = 'err';
    boot.textContent = 'error: ' + e.message;
  }
</script>
</body>
</html>
