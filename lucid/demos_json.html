<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JSON SDF Demos – Lucid</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #22d3ee;
      --accent-alt: #f472b6;
      --success: #3fb950;
      --error: #f85149;
      --code-bg: #1c2128;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }

    /* Main Layout */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .main-area {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* Render Panel */
    .render-panel {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* Editor Panel */
    .editor-panel {
      width: 0;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
      overflow: hidden;
    }

    .editor-panel.open {
      width: 400px;
    }

    @media (max-width: 768px) {
      .main-area {
        flex-direction: column;
      }
      .render-panel {
        height: 50%;
      }
      .editor-panel {
        width: 100%;
        height: 0;
        border-left: none;
        border-top: 1px solid var(--border);
      }
      .editor-panel.open {
        width: 100%;
        height: 50%;
      }
    }

    .editor-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .editor-header h3 {
      font-size: 0.875rem;
      color: var(--accent);
    }

    .editor-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .json-textarea {
      flex: 1;
      width: 100%;
      background: var(--code-bg);
      border: none;
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 1rem;
      resize: none;
      outline: none;
    }

    .editor-actions {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    /* Header Bar */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      font-weight: 700;
      color: var(--accent);
      font-size: 1rem;
    }

    .demo-info h1 {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }

    .demo-info p {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Buttons */
    .btn {
      background: var(--border);
      border: none;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn:hover {
      background: #3d4450;
    }

    .btn.primary {
      background: var(--accent);
      color: var(--bg);
    }

    .btn.primary:hover {
      opacity: 0.9;
    }

    .btn.success {
      background: var(--success);
      color: var(--bg);
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    /* Navigation */
    .nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 12px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-dot.active {
      background: var(--accent);
      transform: scale(1.3);
    }

    .nav-dot:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    /* Template Gallery */
    .template-gallery {
      position: fixed;
      top: 60px;
      left: 1rem;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      z-index: 90;
      max-width: 200px;
      display: none;
    }

    .template-gallery.open {
      display: block;
    }

    .template-item {
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: background 0.2s;
    }

    .template-item:hover {
      background: var(--border);
    }

    .template-item.active {
      background: var(--accent);
      color: var(--bg);
    }

    /* URL Input Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
      display: none;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 500px;
    }

    .modal h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .input-group input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Status Messages */
    .status {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .status.visible {
      opacity: 1;
    }

    .status.error {
      border-color: var(--error);
      color: var(--error);
    }

    .status.success {
      border-color: var(--success);
      color: var(--success);
    }

    /* Loading */
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1rem;
      color: var(--accent);
      z-index: 300;
    }

    /* Hidden file input */
    .hidden-input {
      display: none;
    }

    /* Debug Panel - slides up from bottom */
    .debug-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 150;
      max-height: 40vh;
      overflow-y: auto;
    }

    .debug-panel.open {
      transform: translateY(0);
    }

    .debug-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--panel-bg);
    }

    .debug-header h3 {
      font-size: 0.875rem;
      color: var(--accent);
    }

    .debug-content {
      padding: 1rem;
    }

    .debug-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .debug-row:last-child {
      border-bottom: none;
    }

    .debug-label {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background: var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle.active {
      background: var(--accent);
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle.active::after {
      transform: translateX(20px);
    }

    /* Debug toggle button */
    .debug-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
    }

    /* Edge indicators (visual feedback) */
    .edge-indicator {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 5%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 50;
    }

    .edge-indicator.left {
      left: 0;
      background: linear-gradient(to right, rgba(34, 211, 238, 0.3), transparent);
    }

    .edge-indicator.right {
      right: 0;
      background: linear-gradient(to left, rgba(34, 211, 238, 0.3), transparent);
    }

    .edge-indicator.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Loading...</div>

  <div class="app" id="app" style="display: none;">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <a href="README.html" class="logo">Lucid</a>
        <div class="demo-info">
          <h1 id="title">Loading...</h1>
          <p id="subtitle">JSON SDF Demo</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" id="btn-gallery" title="Template Gallery">Templates</button>
        <button class="btn" id="btn-load-url" title="Load from URL">URL</button>
        <button class="btn" id="btn-load-file" title="Load JSON File">File</button>
        <button class="btn btn-icon" id="btn-editor" title="Toggle Editor">{ }</button>
      </div>
    </header>

    <!-- Main Area -->
    <div class="main-area">
      <div class="render-panel">
        <canvas id="canvas"></canvas>
      </div>

      <div class="editor-panel" id="editor-panel">
        <div class="editor-header">
          <h3>JSON Editor</h3>
          <button class="btn" id="btn-format">Format</button>
        </div>
        <div class="editor-content">
          <textarea class="json-textarea" id="json-editor" spellcheck="false"></textarea>
        </div>
        <div class="editor-actions">
          <button class="btn primary" id="btn-apply">Apply Changes</button>
          <button class="btn" id="btn-copy">Copy JSON</button>
          <button class="btn" id="btn-download">Download</button>
        </div>
      </div>
    </div>

    <!-- Navigation Dots -->
    <div class="nav" id="nav"></div>
  </div>

  <!-- Template Gallery -->
  <div class="template-gallery" id="template-gallery">
    <!-- Populated by JS -->
  </div>

  <!-- URL Modal -->
  <div class="modal" id="url-modal">
    <div class="modal-content">
      <h2>Load JSON from URL</h2>
      <div class="input-group">
        <label>JSON URL</label>
        <input type="url" id="url-input" placeholder="https://example.com/scene.sdf.json" />
      </div>
      <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button class="btn" id="btn-modal-cancel">Cancel</button>
        <button class="btn primary" id="btn-modal-load">Load</button>
      </div>
    </div>
  </div>

  <!-- Hidden File Input -->
  <input type="file" class="hidden-input" id="file-input" accept=".json,.sdf.json" />

  <!-- Status Message -->
  <div class="status" id="status"></div>

  <!-- Debug Panel -->
  <div class="debug-panel" id="debug-panel">
    <div class="debug-header">
      <h3>Debug Options</h3>
      <button class="btn" id="btn-debug-close">Close</button>
    </div>
    <div class="debug-content">
      <div class="debug-row">
        <span class="debug-label">Volume Render Mode</span>
        <div class="toggle" id="toggle-volume"></div>
      </div>
      <div class="debug-row">
        <span class="debug-label">Show Ground Plane</span>
        <div class="toggle active" id="toggle-ground"></div>
      </div>
      <div class="debug-row">
        <span class="debug-label">Camera Distance</span>
        <input type="range" min="1" max="15" step="0.5" value="4" id="slider-distance" style="width: 120px;">
      </div>
      <div class="debug-row" style="border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 0.75rem;">
        <span class="debug-label">Version</span>
        <span id="version-display" style="font-size: 0.75rem; color: var(--text-dim); font-family: monospace;"></span>
      </div>
    </div>
  </div>

  <!-- Debug Toggle Button -->
  <button class="btn debug-toggle" id="btn-debug">Debug</button>

  <!-- Edge Indicators -->
  <div class="edge-indicator left" id="edge-left"></div>
  <div class="edge-indicator right" id="edge-right"></div>

  <script type="module">
    import { SimpleRaymarcher } from './ui/raymarcher.js';
    import { loadJsonScene } from './core/json-loader.js';
    import { generateGlslFromJson } from './core/json-codegen.js';

    // ============================================
    // VERSION INFO
    // ============================================
    // Best practice: Update VERSION on releases, tag with: git tag v0.2.0
    const VERSION = '0.2.0';
    const BUILD_DATE = '2025-11-28';

    // ============================================
    // DEMO TEMPLATES
    // ============================================
    const templates = [
      {
        title: "Pulsing Sphere",
        subtitle: "Animated radius with time expression",
        json: {
          "version": "1.0",
          "root": {
            "type": "sphere",
            "params": {
              "r": {
                "expr": "add",
                "args": [
                  1.0,
                  { "expr": "mul", "args": [0.3, { "expr": "sin", "args": [{ "var": "time" }] }] }
                ]
              },
              "color": [0.4, 0.8, 1.0]
            }
          }
        }
      },

      {
        title: "Smooth Union",
        subtitle: "Two spheres with smooth blending",
        json: {
          "version": "1.0",
          "root": {
            "type": "smoothUnion",
            "k": 0.3,
            "children": [
              {
                "type": "sphere",
                "params": { "r": 0.8, "color": [1.0, 0.7, 0.2] },
                "transform": {
                  "translate": [
                    { "expr": "mul", "args": [{ "expr": "sin", "args": [{ "var": "time" }] }, 0.5] },
                    0.3,
                    0.0
                  ]
                }
              },
              {
                "type": "sphere",
                "params": { "r": 0.8, "color": [0.5, 0.2, 1.0] },
                "transform": {
                  "translate": [
                    { "expr": "mul", "args": [{ "expr": "sin", "args": [{ "var": "time" }] }, -0.5] },
                    -0.3,
                    0.0
                  ]
                }
              }
            ]
          }
        }
      },

      {
        title: "Box & Torus Subtract",
        subtitle: "CSG subtraction operation",
        json: {
          "version": "1.0",
          "root": {
            "type": "subtract",
            "children": [
              {
                "type": "box",
                "params": { "size": [1.5, 1.5, 1.5], "color": [0.9, 0.6, 0.3] }
              },
              {
                "type": "torus",
                "params": { "major": 1.0, "minor": 0.3, "color": [0.2, 0.2, 0.2] }
              }
            ]
          }
        }
      },

      {
        title: "Space Invaders (Template)",
        subtitle: "Using defs/refs for instancing",
        json: {
          "version": "1.0",
          "defs": {
            "invader": {
              "type": "subtract",
              "children": [
                { "type": "box", "params": { "size": [0.5, 0.4, 0.3] } },
                { "type": "sphere", "params": { "r": 0.1 }, "transform": { "translate": [-0.12, 0.08, 0.2] } },
                { "type": "sphere", "params": { "r": 0.1 }, "transform": { "translate": [0.12, 0.08, 0.2] } }
              ]
            }
          },
          "root": {
            "type": "union",
            "children": [
              { "type": "material", "params": { "color": [0.0, 1.0, 0.5] }, "child": { "type": "transform", "transform": { "translate": [-1.5, 0.6, 0.0] }, "child": { "type": "ref", "id": "invader" } } },
              { "type": "material", "params": { "color": [0.0, 1.0, 0.5] }, "child": { "type": "transform", "transform": { "translate": [0.0, 0.6, 0.0] }, "child": { "type": "ref", "id": "invader" } } },
              { "type": "material", "params": { "color": [0.0, 1.0, 0.5] }, "child": { "type": "transform", "transform": { "translate": [1.5, 0.6, 0.0] }, "child": { "type": "ref", "id": "invader" } } },
              { "type": "material", "params": { "color": [1.0, 0.3, 0.8] }, "child": { "type": "transform", "transform": { "translate": [-1.5, -0.6, 0.0] }, "child": { "type": "ref", "id": "invader" } } },
              { "type": "material", "params": { "color": [1.0, 0.3, 0.8] }, "child": { "type": "transform", "transform": { "translate": [0.0, -0.6, 0.0] }, "child": { "type": "ref", "id": "invader" } } },
              { "type": "material", "params": { "color": [1.0, 0.3, 0.8] }, "child": { "type": "transform", "transform": { "translate": [1.5, -0.6, 0.0] }, "child": { "type": "ref", "id": "invader" } } }
            ]
          }
        }
      },

      {
        title: "Animated Invaders",
        subtitle: "Template reuse with time animation",
        json: {
          "version": "1.0",
          "defs": {
            "invader": {
              "type": "subtract",
              "children": [
                { "type": "box", "params": { "size": [0.5, 0.4, 0.3] } },
                { "type": "sphere", "params": { "r": 0.1 }, "transform": { "translate": [-0.12, 0.08, 0.2] } },
                { "type": "sphere", "params": { "r": 0.1 }, "transform": { "translate": [0.12, 0.08, 0.2] } }
              ]
            }
          },
          "root": {
            "type": "union",
            "children": [
              {
                "type": "material",
                "params": { "color": [0.0, 1.0, 0.5] },
                "child": {
                  "type": "transform",
                  "transform": {
                    "translate": [
                      { "expr": "add", "args": [-1.5, { "expr": "mul", "args": [{ "expr": "sin", "args": [{ "var": "time" }] }, 0.3] }] },
                      0.6,
                      0.0
                    ]
                  },
                  "child": { "type": "ref", "id": "invader" }
                }
              },
              {
                "type": "material",
                "params": { "color": [0.0, 1.0, 0.5] },
                "child": {
                  "type": "transform",
                  "transform": {
                    "translate": [
                      0.0,
                      { "expr": "add", "args": [0.6, { "expr": "mul", "args": [{ "expr": "sin", "args": [{ "expr": "add", "args": [{ "var": "time" }, 1.0] }] }, 0.2] }] },
                      0.0
                    ]
                  },
                  "child": { "type": "ref", "id": "invader" }
                }
              },
              {
                "type": "material",
                "params": { "color": [0.0, 1.0, 0.5] },
                "child": {
                  "type": "transform",
                  "transform": {
                    "translate": [
                      { "expr": "add", "args": [1.5, { "expr": "mul", "args": [{ "expr": "sin", "args": [{ "var": "time" }] }, 0.3] }] },
                      0.6,
                      0.0
                    ]
                  },
                  "child": { "type": "ref", "id": "invader" }
                }
              },
              { "type": "material", "params": { "color": [1.0, 0.3, 0.8] }, "child": { "type": "transform", "transform": { "translate": [-1.5, -0.6, 0.0] }, "child": { "type": "ref", "id": "invader" } } },
              {
                "type": "material",
                "params": { "color": [1.0, 0.3, 0.8] },
                "child": {
                  "type": "transform",
                  "transform": {
                    "translate": [
                      { "expr": "mul", "args": [{ "expr": "sin", "args": [{ "var": "time" }] }, 0.3] },
                      -0.6,
                      0.0
                    ]
                  },
                  "child": { "type": "ref", "id": "invader" }
                }
              },
              {
                "type": "material",
                "params": { "color": [1.0, 0.3, 0.8] },
                "child": {
                  "type": "transform",
                  "transform": {
                    "translate": [
                      1.5,
                      { "expr": "add", "args": [-0.6, { "expr": "mul", "args": [{ "expr": "sin", "args": [{ "expr": "add", "args": [{ "var": "time" }, 3.0] }] }, 0.2] }] },
                      0.0
                    ]
                  },
                  "child": { "type": "ref", "id": "invader" }
                }
              }
            ]
          }
        }
      },

      {
        title: "Nested CSG",
        subtitle: "Union of intersections",
        json: {
          "version": "1.0",
          "root": {
            "type": "union",
            "children": [
              {
                "type": "intersect",
                "children": [
                  { "type": "box", "params": { "size": [1.0, 1.0, 1.0], "color": [1.0, 0.4, 0.3] } },
                  { "type": "sphere", "params": { "r": 1.2, "color": [1.0, 0.4, 0.3] } }
                ],
                "transform": { "translate": [-1.2, 0.0, 0.0] }
              },
              {
                "type": "intersect",
                "children": [
                  { "type": "box", "params": { "size": [1.0, 1.0, 1.0], "color": [0.3, 0.8, 0.5] } },
                  { "type": "sphere", "params": { "r": 1.2, "color": [0.3, 0.8, 0.5] } }
                ],
                "transform": { "translate": [1.2, 0.0, 0.0] }
              }
            ]
          }
        }
      },

      {
        title: "Cylinder Array",
        subtitle: "Multiple cylinders in formation",
        json: {
          "version": "1.0",
          "defs": {
            "pillar": {
              "type": "cylinder",
              "params": { "h": 2.0, "r": 0.2 }
            }
          },
          "root": {
            "type": "union",
            "children": [
              { "type": "material", "params": { "color": [0.8, 0.6, 0.4] }, "child": { "type": "transform", "transform": { "translate": [-1.5, 0.0, -1.5] }, "child": { "type": "ref", "id": "pillar" } } },
              { "type": "material", "params": { "color": [0.8, 0.6, 0.4] }, "child": { "type": "transform", "transform": { "translate": [1.5, 0.0, -1.5] }, "child": { "type": "ref", "id": "pillar" } } },
              { "type": "material", "params": { "color": [0.8, 0.6, 0.4] }, "child": { "type": "transform", "transform": { "translate": [-1.5, 0.0, 1.5] }, "child": { "type": "ref", "id": "pillar" } } },
              { "type": "material", "params": { "color": [0.8, 0.6, 0.4] }, "child": { "type": "transform", "transform": { "translate": [1.5, 0.0, 1.5] }, "child": { "type": "ref", "id": "pillar" } } },
              {
                "type": "box",
                "params": { "size": [2.0, 0.1, 2.0], "color": [0.5, 0.5, 0.6] },
                "transform": { "translate": [0.0, 2.0, 0.0] }
              }
            ]
          }
        }
      },

      {
        title: "Breathing Torus",
        subtitle: "Animated minor radius",
        json: {
          "version": "1.0",
          "root": {
            "type": "torus",
            "params": {
              "major": 1.2,
              "minor": {
                "expr": "add",
                "args": [
                  0.25,
                  { "expr": "mul", "args": [0.1, { "expr": "sin", "args": [{ "expr": "mul", "args": [{ "var": "time" }, 2.0] }] }] }
                ]
              },
              "color": [0.9, 0.4, 0.6]
            }
          }
        }
      }
    ];

    // ============================================
    // STATE
    // ============================================
    let currentDemo = 0;
    let demos = [...templates]; // Copy templates as demos
    let renderer = null;
    let editorOpen = false;
    let galleryOpen = false;
    let debugOpen = false;

    // Camera orbit state
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let pinchStartDist = 0;

    // Debug settings (persisted)
    const debugSettings = {
      volumeRender: false,
      showGround: true,
      cameraDistance: 4
    };

    // ============================================
    // DOM REFERENCES
    // ============================================
    const $ = id => document.getElementById(id);
    const loadingEl = $('loading');
    const appEl = $('app');
    const titleEl = $('title');
    const subtitleEl = $('subtitle');
    const navEl = $('nav');
    const editorPanel = $('editor-panel');
    const jsonEditor = $('json-editor');
    const templateGallery = $('template-gallery');
    const urlModal = $('url-modal');
    const urlInput = $('url-input');
    const statusEl = $('status');
    const fileInput = $('file-input');
    const debugPanel = $('debug-panel');
    const edgeLeft = $('edge-left');
    const edgeRight = $('edge-right');

    // ============================================
    // INITIALIZATION
    // ============================================
    function init() {
      try {
        const canvas = $('canvas');
        renderer = new SimpleRaymarcher(canvas);

        // Build navigation dots
        buildNav();

        // Build template gallery
        buildGallery();

        // Load first demo
        switchDemo(0);

        // Render loop
        function renderLoop() {
          renderer.render();
          requestAnimationFrame(renderLoop);
        }
        renderLoop();

        // Hide loading, show app
        loadingEl.style.display = 'none';
        appEl.style.display = 'flex';

        // Setup event listeners
        setupEventListeners();

        // Display version
        $('version-display').textContent = `v${VERSION} (${BUILD_DATE})`;

        console.log(`Lucid JSON Demos v${VERSION} initialized`);
        console.log(`${demos.length} demos available`);

      } catch (error) {
        console.error('Init failed:', error);
        loadingEl.textContent = `Error: ${error.message}`;
        loadingEl.style.color = '#f85149';
      }
    }

    // ============================================
    // NAVIGATION
    // ============================================
    function buildNav() {
      navEl.innerHTML = '';
      demos.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'nav-dot' + (i === currentDemo ? ' active' : '');
        dot.addEventListener('click', () => switchDemo(i));
        navEl.appendChild(dot);
      });
    }

    function switchDemo(index) {
      try {
        currentDemo = index;
        const demo = demos[index];

        // Update UI
        titleEl.textContent = demo.title;
        subtitleEl.textContent = demo.subtitle;

        // Update nav dots
        navEl.querySelectorAll('.nav-dot').forEach((dot, i) => {
          dot.classList.toggle('active', i === index);
        });

        // Update editor
        jsonEditor.value = JSON.stringify(demo.json, null, 2);

        // Parse and render
        renderJson(demo.json);

        // Update gallery selection
        templateGallery.querySelectorAll('.template-item').forEach((item, i) => {
          item.classList.toggle('active', i === index);
        });

        console.log(`Loaded demo ${index + 1}/${demos.length}: ${demo.title}`);

      } catch (error) {
        console.error('Failed to switch demo:', error);
        showStatus(`Error: ${error.message}`, 'error');
      }
    }

    function renderJson(json) {
      const scene = loadJsonScene(json);
      const glsl = generateGlslFromJson(scene);
      renderer.updateScene(glsl);
    }

    // ============================================
    // TEMPLATE GALLERY
    // ============================================
    function buildGallery() {
      templateGallery.innerHTML = '';
      demos.forEach((demo, i) => {
        const item = document.createElement('div');
        item.className = 'template-item' + (i === currentDemo ? ' active' : '');
        item.textContent = demo.title;
        item.addEventListener('click', () => {
          switchDemo(i);
          galleryOpen = false;
          templateGallery.classList.remove('open');
        });
        templateGallery.appendChild(item);
      });
    }

    // ============================================
    // EDITOR FUNCTIONS
    // ============================================
    function applyEditorChanges() {
      try {
        const json = JSON.parse(jsonEditor.value);
        demos[currentDemo].json = json;
        renderJson(json);
        showStatus('Changes applied', 'success');
      } catch (error) {
        showStatus(`JSON Error: ${error.message}`, 'error');
      }
    }

    function formatJson() {
      try {
        const json = JSON.parse(jsonEditor.value);
        jsonEditor.value = JSON.stringify(json, null, 2);
        showStatus('Formatted', 'success');
      } catch (error) {
        showStatus(`JSON Error: ${error.message}`, 'error');
      }
    }

    function copyJson() {
      navigator.clipboard.writeText(jsonEditor.value).then(() => {
        showStatus('Copied to clipboard', 'success');
      });
    }

    function downloadJson() {
      const blob = new Blob([jsonEditor.value], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${demos[currentDemo].title.toLowerCase().replace(/\s+/g, '-')}.sdf.json`;
      a.click();
      URL.revokeObjectURL(url);
      showStatus('Downloaded', 'success');
    }

    // ============================================
    // EXTERNAL LOADING
    // ============================================
    async function loadFromUrl(url) {
      try {
        showStatus('Loading...', '');
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const json = await response.json();
        addExternalDemo(json, url);
        showStatus('Loaded from URL', 'success');
      } catch (error) {
        showStatus(`Load failed: ${error.message}`, 'error');
      }
    }

    function loadFromFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const json = JSON.parse(e.target.result);
          addExternalDemo(json, file.name);
          showStatus(`Loaded: ${file.name}`, 'success');
        } catch (error) {
          showStatus(`Parse error: ${error.message}`, 'error');
        }
      };
      reader.readAsText(file);
    }

    function addExternalDemo(json, source) {
      const title = json.title || source.split('/').pop() || 'Loaded Scene';
      const subtitle = json.description || 'External JSON';

      demos.push({ title, subtitle, json });
      buildNav();
      buildGallery();
      switchDemo(demos.length - 1);
    }

    // ============================================
    // UI HELPERS
    // ============================================
    function showStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status visible' + (type ? ` ${type}` : '');
      setTimeout(() => {
        statusEl.classList.remove('visible');
      }, 2500);
    }

    // ============================================
    // EDGE DETECTION (5% edges for navigation)
    // ============================================
    function isInEdge(x, side) {
      const width = window.innerWidth;
      const edgeWidth = width * 0.05;
      if (side === 'left') return x < edgeWidth;
      if (side === 'right') return x > width - edgeWidth;
      return false;
    }

    // ============================================
    // ORBIT CAMERA CONTROLS
    // ============================================
    function setupOrbitControls() {
      const canvas = $('canvas');

      // Mouse controls
      canvas.addEventListener('mousedown', (e) => {
        if (isInEdge(e.clientX, 'left') || isInEdge(e.clientX, 'right')) return;
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        canvas.style.cursor = 'grabbing';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;

        // Orbit camera
        renderer.camera.theta += dx * 0.01;
        renderer.camera.phi = Math.max(0.1, Math.min(Math.PI - 0.1, renderer.camera.phi - dy * 0.01));
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
        canvas.style.cursor = 'grab';
      });

      // Mouse wheel zoom
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSpeed = 0.001;
        renderer.camera.distance = Math.max(1, Math.min(15,
          renderer.camera.distance + e.deltaY * zoomSpeed * renderer.camera.distance));
        debugSettings.cameraDistance = renderer.camera.distance;
        $('slider-distance').value = renderer.camera.distance;
      }, { passive: false });

      // Set initial cursor
      canvas.style.cursor = 'grab';
    }

    // ============================================
    // TOUCH CONTROLS
    // ============================================
    function setupTouchControls() {
      const canvas = $('canvas');
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;
      let isEdgeSwipe = false;
      let activeTouches = 0;

      canvas.addEventListener('touchstart', (e) => {
        activeTouches = e.touches.length;
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        touchStartTime = Date.now();

        // Check if starting from edge
        isEdgeSwipe = isInEdge(touch.clientX, 'left') || isInEdge(touch.clientX, 'right');

        // Show edge indicator
        if (isInEdge(touch.clientX, 'left')) {
          edgeLeft.classList.add('active');
        } else if (isInEdge(touch.clientX, 'right')) {
          edgeRight.classList.add('active');
        }

        // Pinch zoom setup
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          pinchStartDist = Math.sqrt(dx * dx + dy * dy);
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        // Pinch zoom
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const scale = pinchStartDist / dist;

          renderer.camera.distance = Math.max(1, Math.min(15,
            debugSettings.cameraDistance * scale));
          return;
        }

        // Single touch - orbit or edge swipe
        if (e.touches.length === 1 && !isEdgeSwipe) {
          const touch = e.touches[0];
          const dx = touch.clientX - touchStartX;
          const dy = touch.clientY - touchStartY;

          // Orbit camera
          renderer.camera.theta += dx * 0.005;
          renderer.camera.phi = Math.max(0.1, Math.min(Math.PI - 0.1,
            renderer.camera.phi - dy * 0.005));

          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
        }
      }, { passive: true });

      canvas.addEventListener('touchend', (e) => {
        edgeLeft.classList.remove('active');
        edgeRight.classList.remove('active');

        // Update pinch end distance
        if (activeTouches === 2) {
          debugSettings.cameraDistance = renderer.camera.distance;
          $('slider-distance').value = renderer.camera.distance;
        }

        // Edge swipe navigation
        if (isEdgeSwipe && e.changedTouches.length > 0) {
          const touch = e.changedTouches[0];
          const dx = touch.clientX - touchStartX;
          const elapsed = Date.now() - touchStartTime;

          if (Math.abs(dx) > 50 && elapsed < 500) {
            if (dx > 0 && isInEdge(touchStartX, 'left')) {
              switchDemo((currentDemo - 1 + demos.length) % demos.length);
            } else if (dx < 0 && isInEdge(touchStartX, 'right')) {
              switchDemo((currentDemo + 1) % demos.length);
            }
          }
        }

        isEdgeSwipe = false;
        activeTouches = 0;
      }, { passive: true });
    }

    // ============================================
    // DEBUG PANEL
    // ============================================
    function setupDebugPanel() {
      // Toggle debug panel
      $('btn-debug').addEventListener('click', () => {
        debugOpen = !debugOpen;
        debugPanel.classList.toggle('open', debugOpen);
      });

      $('btn-debug-close').addEventListener('click', () => {
        debugOpen = false;
        debugPanel.classList.remove('open');
      });

      // Volume render toggle
      $('toggle-volume').addEventListener('click', function() {
        this.classList.toggle('active');
        debugSettings.volumeRender = this.classList.contains('active');
        renderer.volumeRender = debugSettings.volumeRender;
      });

      // Ground plane toggle
      $('toggle-ground').addEventListener('click', function() {
        this.classList.toggle('active');
        debugSettings.showGround = this.classList.contains('active');
        renderer.showGroundPlane = debugSettings.showGround;
      });

      // Camera distance slider
      $('slider-distance').addEventListener('input', function() {
        debugSettings.cameraDistance = parseFloat(this.value);
        renderer.camera.distance = debugSettings.cameraDistance;
      });
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    function setupEventListeners() {
      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.target === jsonEditor) return;

        if (e.key === 'ArrowRight' || e.key === ' ') {
          e.preventDefault();
          switchDemo((currentDemo + 1) % demos.length);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          switchDemo((currentDemo - 1 + demos.length) % demos.length);
        } else if (e.key === 'e' || e.key === 'E') {
          e.preventDefault();
          editorOpen = !editorOpen;
          editorPanel.classList.toggle('open', editorOpen);
        } else if (e.key === 'd' || e.key === 'D') {
          e.preventDefault();
          debugOpen = !debugOpen;
          debugPanel.classList.toggle('open', debugOpen);
        } else if (e.key === 'Escape') {
          urlModal.classList.remove('open');
          galleryOpen = false;
          templateGallery.classList.remove('open');
          debugOpen = false;
          debugPanel.classList.remove('open');
        }
      });

      // Setup orbit and touch controls
      setupOrbitControls();
      setupTouchControls();
      setupDebugPanel();

      // Editor toggle
      $('btn-editor').addEventListener('click', () => {
        editorOpen = !editorOpen;
        editorPanel.classList.toggle('open', editorOpen);
      });

      // Gallery toggle
      $('btn-gallery').addEventListener('click', () => {
        galleryOpen = !galleryOpen;
        templateGallery.classList.toggle('open', galleryOpen);
      });

      // Editor actions
      $('btn-apply').addEventListener('click', applyEditorChanges);
      $('btn-format').addEventListener('click', formatJson);
      $('btn-copy').addEventListener('click', copyJson);
      $('btn-download').addEventListener('click', downloadJson);

      // Ctrl+Enter to apply
      jsonEditor.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          applyEditorChanges();
        }
      });

      // URL modal
      $('btn-load-url').addEventListener('click', () => {
        urlModal.classList.add('open');
        urlInput.focus();
      });

      $('btn-modal-cancel').addEventListener('click', () => {
        urlModal.classList.remove('open');
      });

      $('btn-modal-load').addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (url) {
          loadFromUrl(url);
          urlModal.classList.remove('open');
          urlInput.value = '';
        }
      });

      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          $('btn-modal-load').click();
        } else if (e.key === 'Escape') {
          urlModal.classList.remove('open');
        }
      });

      // File loading
      $('btn-load-file').addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          loadFromFile(e.target.files[0]);
          e.target.value = '';
        }
      });

      // Click outside to close panels
      document.addEventListener('click', (e) => {
        if (galleryOpen && !templateGallery.contains(e.target) && e.target.id !== 'btn-gallery') {
          galleryOpen = false;
          templateGallery.classList.remove('open');
        }
      });
    }

    // ============================================
    // START
    // ============================================
    init();
  </script>
</body>
</html>
