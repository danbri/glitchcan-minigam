<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SDF JSON Demos</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #22d3ee;
      --accent-alt: #f472b6;
      --success: #3fb950;
      --error: #f85149;
      --code-bg: #1c2128;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }

    /* Main Layout */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .main-area {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* Render Panel */
    .render-panel {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* Editor Panel */
    .editor-panel {
      width: 0;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
      overflow: hidden;
    }

    .editor-panel.open {
      width: 400px;
    }

    @media (max-width: 768px) {
      .main-area {
        flex-direction: column;
      }
      .render-panel {
        height: 50%;
      }
      .editor-panel {
        width: 100%;
        height: 0;
        border-left: none;
        border-top: 1px solid var(--border);
      }
      .editor-panel.open {
        width: 100%;
        height: 50%;
      }
    }

    .editor-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .editor-header h3 {
      font-size: 0.875rem;
      color: var(--accent);
    }

    .editor-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .json-textarea {
      flex: 1;
      width: 100%;
      background: var(--code-bg);
      border: none;
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 1rem;
      resize: none;
      outline: none;
    }

    /* Scrubber Panel */
    .scrubber-panel {
      display: none;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.1), rgba(244, 114, 182, 0.1));
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .scrubber-panel.visible {
      display: flex;
    }

    .scrubber-label {
      font-size: 0.7rem;
      color: var(--text-dim);
      min-width: 4rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    #scrubber-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border);
      border-radius: 3px;
      cursor: pointer;
    }

    #scrubber-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.1s;
    }

    #scrubber-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    #scrubber-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    .scrubber-value {
      font-size: 0.75rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--accent);
      min-width: 4rem;
      text-align: right;
      font-weight: 600;
    }

    .scrubber-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 0.25rem;
      font-size: 1rem;
      line-height: 1;
    }

    .scrubber-close:hover {
      color: var(--error);
    }

    .editor-actions {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    /* Header Bar */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .demo-info h1 {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }

    .demo-info p {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Buttons */
    .btn {
      background: var(--border);
      border: none;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn:hover {
      background: #3d4450;
    }

    .btn.primary {
      background: var(--accent);
      color: var(--bg);
    }

    .btn.primary:hover {
      opacity: 0.9;
    }

    .btn.success {
      background: var(--success);
      color: var(--bg);
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    /* Navigation */
    .nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 12px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-dot.active {
      background: var(--accent);
      transform: scale(1.3);
    }

    .nav-dot:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    /* Template Gallery */
    .template-gallery {
      position: fixed;
      top: 60px;
      left: 1rem;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      z-index: 90;
      max-width: 200px;
      display: none;
    }

    .template-gallery.open {
      display: block;
    }

    .template-item {
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: background 0.2s;
    }

    .template-item:hover {
      background: var(--border);
    }

    .template-item.active {
      background: var(--accent);
      color: var(--bg);
    }

    /* URL Input Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
      display: none;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 500px;
    }

    .modal h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .input-group input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Status Messages */
    .status {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .status.visible {
      opacity: 1;
    }

    .status.error {
      border-color: var(--error);
      color: var(--error);
    }

    .status.success {
      border-color: var(--success);
      color: var(--success);
    }

    /* Loading */
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1rem;
      color: var(--accent);
      z-index: 300;
    }

    /* Hidden file input */
    .hidden-input {
      display: none;
    }

    /* Debug Panel - slides up from bottom */
    .debug-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 150;
      max-height: 40vh;
      overflow-y: auto;
    }

    .debug-panel.open {
      transform: translateY(0);
    }

    .debug-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--panel-bg);
    }

    .debug-header h3 {
      font-size: 0.875rem;
      color: var(--accent);
    }

    .debug-content {
      padding: 1rem;
    }

    .debug-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .debug-row:last-child {
      border-bottom: none;
    }

    .debug-label {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background: var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle.active {
      background: var(--accent);
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle.active::after {
      transform: translateX(20px);
    }

    /* Debug toggle button */
    .debug-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
    }

    /* Edge indicators (visual feedback) */
    .edge-indicator {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 5%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 50;
    }

    .edge-indicator.left {
      left: 0;
      background: linear-gradient(to right, rgba(34, 211, 238, 0.3), transparent);
    }

    .edge-indicator.right {
      right: 0;
      background: linear-gradient(to left, rgba(34, 211, 238, 0.3), transparent);
    }

    .edge-indicator.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Loading...</div>

  <div class="app" id="app" style="display: none;">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="demo-info">
          <h1 id="title">Loading...</h1>
          <p id="subtitle">JSON SDF Demo</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" id="btn-gallery" title="Template Gallery">☰</button>
        <button class="btn" id="btn-load-url" title="Load from URL">URL</button>
        <button class="btn" id="btn-load-file" title="Load JSON File">File</button>
        <button class="btn btn-icon" id="btn-editor" title="Toggle Editor">{ }</button>
      </div>
    </header>

    <!-- Main Area -->
    <div class="main-area">
      <div class="render-panel">
        <canvas id="canvas"></canvas>
      </div>

      <div class="editor-panel" id="editor-panel">
        <div class="editor-header">
          <h3>JSON Editor</h3>
          <div style="display: flex; gap: 0.25rem;">
            <button class="btn" id="btn-select-all" title="Select All (Ctrl+A)">All</button>
            <button class="btn" id="btn-cut" title="Cut (Ctrl+X)">Cut</button>
            <button class="btn" id="btn-copy-sel" title="Copy (Ctrl+C)">Copy</button>
            <button class="btn" id="btn-paste" title="Paste (Ctrl+V)">Paste</button>
            <button class="btn" id="btn-format">Format</button>
          </div>
        </div>
        <!-- Scalar Scrubber Panel -->
        <div class="scrubber-panel" id="scrubber-panel">
          <span class="scrubber-label" id="scrubber-label">value</span>
          <input type="range" id="scrubber-slider" min="0" max="1" step="0.01" value="0.5">
          <span class="scrubber-value" id="scrubber-value">0.5</span>
          <button class="scrubber-close" id="scrubber-close" title="Close scrubber">×</button>
        </div>
        <div class="editor-content">
          <textarea class="json-textarea" id="json-editor" spellcheck="false"></textarea>
        </div>
        <div class="editor-actions">
          <button class="btn primary" id="btn-apply">Apply Changes</button>
          <button class="btn" id="btn-copy">Copy JSON</button>
          <button class="btn" id="btn-download">Download</button>
        </div>
      </div>
    </div>

    <!-- Navigation Dots -->
    <div class="nav" id="nav"></div>
  </div>

  <!-- Template Gallery -->
  <div class="template-gallery" id="template-gallery">
    <!-- Populated by JS -->
  </div>

  <!-- URL Modal -->
  <div class="modal" id="url-modal">
    <div class="modal-content">
      <h2>Load JSON from URL</h2>
      <div class="input-group">
        <label>JSON URL</label>
        <input type="url" id="url-input" placeholder="https://example.com/scene.sdf.json" />
      </div>
      <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button class="btn" id="btn-modal-cancel">Cancel</button>
        <button class="btn primary" id="btn-modal-load">Load</button>
      </div>
    </div>
  </div>

  <!-- Hidden File Input -->
  <input type="file" class="hidden-input" id="file-input" accept=".json,.sdf.json" />

  <!-- Status Message -->
  <div class="status" id="status"></div>

  <!-- Debug Panel -->
  <div class="debug-panel" id="debug-panel">
    <div class="debug-header">
      <h3>Debug Options</h3>
      <button class="btn" id="btn-debug-close">Close</button>
    </div>
    <div class="debug-content">
      <div class="debug-row">
        <span class="debug-label">Volume Render Mode</span>
        <div class="toggle" id="toggle-volume"></div>
      </div>
      <div class="debug-row">
        <span class="debug-label">Show Ground Plane</span>
        <div class="toggle active" id="toggle-ground"></div>
      </div>
      <div class="debug-row">
        <span class="debug-label">Show Edges</span>
        <div class="toggle active" id="toggle-edges"></div>
      </div>
      <div class="debug-row">
        <span class="debug-label">Camera Distance</span>
        <input type="range" min="1" max="15" step="0.5" value="4" id="slider-distance" style="width: 120px;">
      </div>
      <div class="debug-row" id="volume-controls" style="display: none; flex-direction: column; gap: 0.5rem;">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
          <span class="debug-label">Step Size</span>
          <input type="range" min="0.01" max="0.15" step="0.01" value="0.05" id="slider-step-size" style="width: 100px;">
          <span id="step-size-val" style="font-size: 0.7rem; min-width: 3rem; text-align: right;">0.05</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
          <span class="debug-label">Density</span>
          <input type="range" min="1" max="20" step="1" value="8" id="slider-density" style="width: 100px;">
          <span id="density-val" style="font-size: 0.7rem; min-width: 3rem; text-align: right;">8</span>
        </div>
      </div>
      <div class="debug-row" style="border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 0.75rem;">
        <span class="debug-label">Version</span>
        <span id="version-display" style="font-size: 0.75rem; color: var(--text-dim); font-family: monospace;"></span>
      </div>
    </div>
  </div>

  <!-- Debug Toggle Button -->
  <button class="btn debug-toggle" id="btn-debug">Debug</button>

  <!-- Edge Indicators -->
  <div class="edge-indicator left" id="edge-left"></div>
  <div class="edge-indicator right" id="edge-right"></div>

  <script type="module">
    import { SimpleRaymarcher } from './ui/raymarcher.js';
    import { loadJsonScene } from './core/json-loader.js';
    import { generateGlslFromJson } from './core/json-codegen.js';

    // ============================================
    // VERSION INFO
    // ============================================
    // Best practice: Update VERSION on releases, tag with: git tag v0.5.0
    const VERSION = '0.5.0';
    const BUILD_DATE = '2025-11-28';

    // ============================================
    // DEMO TEMPLATES
    // ============================================
    const templates = [
      {
        title: "Primitives Catalogue",
        subtitle: "All 7 SDF primitives + smooth blend",
        json: {
          "version": "1.0",
          "root": {
            "type": "union",
            "children": [
              {
                "type": "sphere",
                "params": { "r": 0.35, "color": [1.0, 0.4, 0.4] },
                "transform": { "translate": [-1.8, 0.8, 0] }
              },
              {
                "type": "box",
                "params": { "size": [0.28, 0.28, 0.28], "color": [0.4, 1.0, 0.4] },
                "transform": { "translate": [-0.6, 0.8, 0] }
              },
              {
                "type": "cylinder",
                "params": { "h": 0.3, "r": 0.2, "color": [0.4, 0.6, 1.0] },
                "transform": { "translate": [0.6, 0.8, 0] }
              },
              {
                "type": "torus",
                "params": { "major": 0.25, "minor": 0.08, "color": [1.0, 0.9, 0.3] },
                "transform": { "translate": [1.8, 0.8, 0] }
              },
              {
                "type": "capsule",
                "params": { "h": 0.25, "r": 0.12, "color": [1.0, 0.5, 0.2] },
                "transform": { "translate": [-1.8, -0.2, 0] }
              },
              {
                "type": "ellipsoid",
                "params": { "radii": [0.4, 0.2, 0.2], "color": [0.8, 0.4, 1.0] },
                "transform": { "translate": [-0.6, -0.2, 0] }
              },
              {
                "type": "smoothUnion",
                "k": 0.2,
                "children": [
                  { "type": "sphere", "params": { "r": 0.22, "color": [0.3, 0.9, 0.8] } },
                  { "type": "box", "params": { "size": [0.18, 0.18, 0.18], "color": [0.9, 0.4, 0.8] }, "transform": { "translate": [0.25, 0, 0] } }
                ],
                "transform": { "translate": [0.6, -0.2, 0] }
              },
              {
                "type": "plane",
                "params": { "normal": [0, 1, 0], "h": 0.8, "color": [0.35, 0.35, 0.4] }
              }
            ]
          }
        }
      },

      {
        title: "Pulsing Sphere",
        subtitle: "Animated radius with time expression",
        json: {
          "version": "1.0",
          "root": {
            "type": "sphere",
            "params": {
              "r": {
                "expr": "add",
                "args": [
                  1.0,
                  { "expr": "mul", "args": [0.3, { "expr": "sin", "args": [{ "var": "time" }] }] }
                ]
              },
              "color": [0.4, 0.8, 1.0]
            }
          }
        }
      },

      {
        title: "Smooth Union",
        subtitle: "Two spheres with smooth blending",
        json: {
          "version": "1.0",
          "root": {
            "type": "smoothUnion",
            "k": 0.5,
            "children": [
              {
                "type": "sphere",
                "params": { "r": 0.8, "color": [1, 0.7, 0.2] },
                "transform": {
                  "translate": [
                    { "expr": "mul", "args": [{ "expr": "sin", "args": [{ "var": "time" }] }, 1.7] },
                    0.7,
                    0.5
                  ]
                }
              },
              {
                "type": "sphere",
                "params": { "r": 0.8, "color": [0.5, 0.2, 1] },
                "transform": {
                  "translate": [
                    { "expr": "mul", "args": [{ "expr": "sin", "args": [{ "var": "time" }] }, -0.5] },
                    -0.3,
                    0
                  ]
                }
              }
            ]
          }
        }
      },

      {
        title: "Box & Torus Subtract",
        subtitle: "CSG subtraction operation",
        json: {
          "version": "1.0",
          "root": {
            "type": "subtract",
            "children": [
              {
                "type": "box",
                "params": { "size": [1.5, 1.5, 1.5], "color": [0.9, 0.6, 0.3] }
              },
              {
                "type": "torus",
                "params": { "major": 1.0, "minor": 0.3, "color": [0.2, 0.2, 0.2] }

    // ============================================
    // INITIALIZATION
    // ============================================
    function init() {
      try {
        const canvas = $('canvas');
        renderer = new SimpleRaymarcher(canvas);

        // Build navigation dots
        buildNav();

        // Build template gallery
        buildGallery();

        // Load first demo
        switchDemo(0);

        // Render loop
        function renderLoop() {
          renderer.render();
          requestAnimationFrame(renderLoop);
        }
        renderLoop();

        // Hide loading, show app
        loadingEl.style.display = 'none';
        appEl.style.display = 'flex';

        // Setup event listeners
        setupEventListeners();

        // Display version
        $('version-display').textContent = `v${VERSION} (${BUILD_DATE})`;

        console.log(`SDF JSON Demos v${VERSION} initialized`);
        console.log(`${demos.length} demos available`);

      } catch (error) {
        console.error('Init failed:', error);
        loadingEl.textContent = `Error: ${error.message}`;
        loadingEl.style.color = '#f85149';
      }
    }

    // ============================================
    // NAVIGATION
    // ============================================
    function buildNav() {
      navEl.innerHTML = '';
      demos.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'nav-dot' + (i === currentDemo ? ' active' : '');
        dot.addEventListener('click', () => switchDemo(i));
        navEl.appendChild(dot);
      });
    }

    function switchDemo(index) {
      try {
        currentDemo = index;
        const demo = demos[index];

        // Update UI
        titleEl.textContent = demo.title;
        subtitleEl.textContent = demo.subtitle;

        // Update nav dots
        navEl.querySelectorAll('.nav-dot').forEach((dot, i) => {
          dot.classList.toggle('active', i === index);
        });

        // Update editor
        jsonEditor.value = JSON.stringify(demo.json, null, 2);

        // Parse and render
        renderJson(demo.json);

        // Update gallery selection
        templateGallery.querySelectorAll('.template-item').forEach((item, i) => {
          item.classList.toggle('active', i === index);
        });

        console.log(`Loaded demo ${index + 1}/${demos.length}: ${demo.title}`);

      } catch (error) {
        console.error('Failed to switch demo:', error);
        showStatus(`Error: ${error.message}`, 'error');
      }
    }

    function renderJson(json) {
      const scene = loadJsonScene(json);
      const glsl = generateGlslFromJson(scene);
      renderer.updateScene(glsl);
    }

    // ============================================
    // EDITOR BUTTON FUNCTIONS
    // ============================================
    function selectAllText() {
      jsonEditor.focus();
      jsonEditor.select();
    }

    function cutSelection() {
      const start = jsonEditor.selectionStart;
      const end = jsonEditor.selectionEnd;
      if (start !== end) {
        const selectedText = jsonEditor.value.substring(start, end);
        navigator.clipboard.writeText(selectedText).then(() => {
          jsonEditor.value = jsonEditor.value.substring(0, start) + jsonEditor.value.substring(end);
          jsonEditor.selectionStart = jsonEditor.selectionEnd = start;
          showStatus('Cut to clipboard', 'success');
        });
      }
    }

    function copySelection() {
      const start = jsonEditor.selectionStart;
      const end = jsonEditor.selectionEnd;
      if (start !== end) {
        const selectedText = jsonEditor.value.substring(start, end);
        navigator.clipboard.writeText(selectedText).then(() => {
          showStatus('Copied selection', 'success');
        });
      } else {
        copyJson(); // Copy all if nothing selected
      }
    }

    function pasteFromClipboard() {
      navigator.clipboard.readText().then(text => {
        const start = jsonEditor.selectionStart;
        const end = jsonEditor.selectionEnd;
        const before = jsonEditor.value.substring(0, start);
        const after = jsonEditor.value.substring(end);
        jsonEditor.value = before + text + after;
        jsonEditor.selectionStart = jsonEditor.selectionEnd = start + text.length;
        jsonEditor.focus();
        showStatus('Pasted from clipboard', 'success');
      }).catch(err => {
        showStatus('Paste failed - check permissions', 'error');
        console.error('Paste failed:', err);
      });
    }

    // ============================================
    // SCALAR SCRUBBER FUNCTIONS
    // ============================================
    function detectScalarSelection() {
      const start = jsonEditor.selectionStart;
      const end = jsonEditor.selectionEnd;

      if (start === end) {
        hideScrubber();
        return;
      }

      const selectedText = jsonEditor.value.substring(start, end).trim();

      // Check if selection is a valid number (integer or decimal)
      // Match: 0.5, -1.2, 3, -4, .5, -.3
      const numberRegex = /^-?\d*\.?\d+$/;
      if (!numberRegex.test(selectedText)) {
        hideScrubber();
        return;
      }

      const value = parseFloat(selectedText);
      if (isNaN(value)) {
        hideScrubber();
        return;
      }

      // Determine appropriate range based on value
      let min, max, step;
      const absValue = Math.abs(value);

      if (absValue <= 1 && value >= 0) {
        // 0 to 1 range (common for colors, blend factors)
        min = 0;
        max = 1;
        step = 0.01;
      } else if (absValue <= 1) {
        // -1 to 1 range (common for normalized values)
        min = -1;
        max = 1;
        step = 0.01;
      } else if (absValue <= 5) {
        // Smaller range for sizes/positions
        min = value < 0 ? -5 : 0;
        max = 5;
        step = 0.05;
      } else {
        // Larger values - scale range appropriately
        min = value < 0 ? value * 2 : 0;
        max = Math.max(absValue * 2, 10);
        step = 0.1;
      }

      // Store state
      scrubberState = {
        visible: true,
        selectionStart: start,
        selectionEnd: end,
        originalValue: value,
        min,
        max,
        step
      };

      // Update slider
      scrubberSlider.min = min;
      scrubberSlider.max = max;
      scrubberSlider.step = step;
      scrubberSlider.value = value;

      // Update display
      scrubberLabel.textContent = `[${min}, ${max}]`;
      scrubberValue.textContent = formatNumber(value);

      // Show panel
      scrubberPanel.classList.add('visible');
    }

    function formatNumber(num) {
      // Format to reasonable precision
      if (Number.isInteger(num)) return num.toString();
      const formatted = num.toFixed(3);
      // Remove trailing zeros but keep at least one decimal
      return formatted.replace(/\.?0+$/, '') || '0';
    }

    function updateScrubberValue(newValue) {
      const formatted = formatNumber(newValue);
      scrubberValue.textContent = formatted;

      // Update the text in the editor
      const text = jsonEditor.value;
      const before = text.substring(0, scrubberState.selectionStart);
      const after = text.substring(scrubberState.selectionEnd);

      jsonEditor.value = before + formatted + after;

      // Update selection to match new value length
      const newEnd = scrubberState.selectionStart + formatted.length;
      jsonEditor.selectionStart = scrubberState.selectionStart;
      jsonEditor.selectionEnd = newEnd;
      scrubberState.selectionEnd = newEnd;

      // Try to apply changes live
      try {
        const json = JSON.parse(jsonEditor.value);
        demos[currentDemo].json = json;
        renderJson(json);
      } catch (e) {
        // Invalid JSON during scrub - ignore
      }
    }

    function hideScrubber() {
      scrubberState.visible = false;
      scrubberPanel.classList.remove('visible');
    }

    // ============================================
    // EXTERNAL LOADING
    // ============================================
    async function loadFromUrl(url) {
      try {
        showStatus('Loading...', '');
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const json = await response.json();
        addExternalDemo(json, url);
        showStatus('Loaded from URL', 'success');
      } catch (error) {
        showStatus(`Load failed: ${error.message}`, 'error');
      }
    }

    function loadFromFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const json = JSON.parse(e.target.result);
          addExternalDemo(json, file.name);
          showStatus(`Loaded: ${file.name}`, 'success');
        } catch (error) {
          showStatus(`Parse error: ${error.message}`, 'error');
        }
      };
      reader.readAsText(file);
    }

    function addExternalDemo(json, source) {
      const title = json.title || source.split('/').pop() || 'Loaded Scene';
      const subtitle = json.description || 'External JSON';

      demos.push({ title, subtitle, json });
      buildNav();
      buildGallery();
      switchDemo(demos.length - 1);
    }

    // ============================================
    // EDGE DETECTION (5% edges for navigation)
    // ============================================
    function isInEdge(x, side) {
      const width = window.innerWidth;
      const edgeWidth = width * 0.05;
      if (side === 'left') return x < edgeWidth;
      if (side === 'right') return x > width - edgeWidth;
      return false;
    }

    // ============================================
    // ORBIT CAMERA CONTROLS
    // ============================================
    function setupOrbitControls() {
      const canvas = $('canvas');

      // Mouse controls
      canvas.addEventListener('mousedown', (e) => {
        if (isInEdge(e.clientX, 'left') || isInEdge(e.clientX, 'right')) return;
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        canvas.style.cursor = 'grabbing';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;

        // Orbit camera
        renderer.camera.theta += dx * 0.01;
        renderer.camera.phi = Math.max(0.1, Math.min(Math.PI - 0.1, renderer.camera.phi - dy * 0.01));
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
        canvas.style.cursor = 'grab';
      });

      // Mouse wheel zoom
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSpeed = 0.001;
        renderer.camera.distance = Math.max(1, Math.min(15,
          renderer.camera.distance + e.deltaY * zoomSpeed * renderer.camera.distance));
        debugSettings.cameraDistance = renderer.camera.distance;
        $('slider-distance').value = renderer.camera.distance;
      }, { passive: false });

      // Set initial cursor
      canvas.style.cursor = 'grab';
    }

    // ============================================
    // TOUCH CONTROLS
    // ============================================
    function setupTouchControls() {
      const canvas = $('canvas');
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;
      let isEdgeSwipe = false;
      let activeTouches = 0;

      canvas.addEventListener('touchstart', (e) => {
        activeTouches = e.touches.length;
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        touchStartTime = Date.now();

        // Check if starting from edge
        isEdgeSwipe = isInEdge(touch.clientX, 'left') || isInEdge(touch.clientX, 'right');

        // Show edge indicator
        if (isInEdge(touch.clientX, 'left')) {
          edgeLeft.classList.add('active');
        } else if (isInEdge(touch.clientX, 'right')) {
          edgeRight.classList.add('active');
        }

        // Pinch zoom setup
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          pinchStartDist = Math.sqrt(dx * dx + dy * dy);
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        // Pinch zoom
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const scale = pinchStartDist / dist;

          renderer.camera.distance = Math.max(1, Math.min(15,
            debugSettings.cameraDistance * scale));
          return;
        }

        // Single touch - orbit or edge swipe
        if (e.touches.length === 1 && !isEdgeSwipe) {
          const touch = e.touches[0];
          const dx = touch.clientX - touchStartX;
          const dy = touch.clientY - touchStartY;

          // Orbit camera
          renderer.camera.theta += dx * 0.005;
          renderer.camera.phi = Math.max(0.1, Math.min(Math.PI - 0.1,
            renderer.camera.phi - dy * 0.005));

          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
        }
      }, { passive: true });

      canvas.addEventListener('touchend', (e) => {
        edgeLeft.classList.remove('active');
        edgeRight.classList.remove('active');

        // Update pinch end distance
        if (activeTouches === 2) {
          debugSettings.cameraDistance = renderer.camera.distance;
          $('slider-distance').value = renderer.camera.distance;
        }

        // Swipe navigation - works anywhere on canvas
        if (e.changedTouches.length > 0 && activeTouches === 1) {
          const touch = e.changedTouches[0];
          const dx = touch.clientX - touchStartX;
          const dy = touch.clientY - touchStartY;
          const elapsed = Date.now() - touchStartTime;

          // Horizontal swipe detection: fast, mostly horizontal
          if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2 && elapsed < 400) {
            if (dx < 0) {
              // Swipe left = next demo
              switchDemo((currentDemo + 1) % demos.length);
            } else {
              // Swipe right = previous demo
              switchDemo((currentDemo - 1 + demos.length) % demos.length);
            }
          }
        }

        isEdgeSwipe = false;
        activeTouches = 0;
      }, { passive: true });
    }

    // ============================================
    // DEBUG PANEL
    // ============================================
    function setupDebugPanel() {
      // Toggle debug panel
      $('btn-debug').addEventListener('click', () => {
        debugOpen = !debugOpen;
        debugPanel.classList.toggle('open', debugOpen);
      });

      $('btn-debug-close').addEventListener('click', () => {
        debugOpen = false;
        debugPanel.classList.remove('open');
      });

      // Volume render toggle
      $('toggle-volume').addEventListener('click', function() {
        this.classList.toggle('active');
        debugSettings.volumeRender = this.classList.contains('active');
        renderer.volumeRender = debugSettings.volumeRender;
        // Show/hide volume controls
        $('volume-controls').style.display = debugSettings.volumeRender ? 'flex' : 'none';
        // Need to recompile shader when switching modes
        renderer.compileShaders();
      });

      // Ground plane toggle
      $('toggle-ground').addEventListener('click', function() {
        this.classList.toggle('active');
        debugSettings.showGround = this.classList.contains('active');
        renderer.showGroundPlane = debugSettings.showGround;
      });

      // Edge toggle
      $('toggle-edges').addEventListener('click', function() {
        this.classList.toggle('active');
        renderer.showEdges = this.classList.contains('active');
      });

      // Camera distance slider
      $('slider-distance').addEventListener('input', function() {
        debugSettings.cameraDistance = parseFloat(this.value);
        renderer.camera.distance = debugSettings.cameraDistance;
      });

      // Volume step size slider
      $('slider-step-size').addEventListener('input', function() {
        const val = parseFloat(this.value);
        renderer.volumeStepSize = val;
        $('step-size-val').textContent = val.toFixed(2);
      });

      // Volume density slider
      $('slider-density').addEventListener('input', function() {
        const val = parseFloat(this.value);
        renderer.volumeDensity = val;
        $('density-val').textContent = val;
      });
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    function setupEventListeners() {
      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.target === jsonEditor) return;

        if (e.key === 'ArrowRight' || e.key === ' ') {
          e.preventDefault();
          switchDemo((currentDemo + 1) % demos.length);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          switchDemo((currentDemo - 1 + demos.length) % demos.length);
        } else if (e.key === 'e' || e.key === 'E') {
          e.preventDefault();
          editorOpen = !editorOpen;
          editorPanel.classList.toggle('open', editorOpen);
        } else if (e.key === 'd' || e.key === 'D') {
          e.preventDefault();
          debugOpen = !debugOpen;
          debugPanel.classList.toggle('open', debugOpen);
        } else if (e.key === 'Escape') {
          urlModal.classList.remove('open');
          galleryOpen = false;
          templateGallery.classList.remove('open');
          debugOpen = false;
          debugPanel.classList.remove('open');
        }
      });

      // Setup orbit and touch controls
      setupOrbitControls();
      setupTouchControls();
      setupDebugPanel();

      // Editor toggle
      $('btn-editor').addEventListener('click', () => {
        editorOpen = !editorOpen;
        editorPanel.classList.toggle('open', editorOpen);
      });

      // Gallery toggle
      $('btn-gallery').addEventListener('click', () => {
        galleryOpen = !galleryOpen;
        templateGallery.classList.toggle('open', galleryOpen);
      });

      // Editor actions
      $('btn-apply').addEventListener('click', applyEditorChanges);
      $('btn-format').addEventListener('click', formatJson);
      $('btn-copy').addEventListener('click', copyJson);
      $('btn-download').addEventListener('click', downloadJson);

      // Editor header buttons
      $('btn-select-all').addEventListener('click', selectAllText);
      $('btn-cut').addEventListener('click', cutSelection);
      $('btn-copy-sel').addEventListener('click', copySelection);
      $('btn-paste').addEventListener('click', pasteFromClipboard);

      // Scrubber controls
      $('scrubber-close').addEventListener('click', hideScrubber);
      scrubberSlider.addEventListener('input', (e) => {
        updateScrubberValue(parseFloat(e.target.value));
      });

      // Detect scalar selection on selection change
      jsonEditor.addEventListener('mouseup', detectScalarSelection);
      jsonEditor.addEventListener('keyup', (e) => {
        // Only check on arrow keys, shift+arrow, or after typing
        if (e.shiftKey || ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
          detectScalarSelection();
        }
      });

      // Double-click to select number and show scrubber
      jsonEditor.addEventListener('dblclick', () => {
        // Small delay to let browser selection complete
        setTimeout(detectScalarSelection, 10);
      });

      // Ctrl+Enter to apply
      jsonEditor.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          applyEditorChanges();
        }
      });

      // URL modal
      $('btn-load-url').addEventListener('click', () => {
        urlModal.classList.add('open');
        urlInput.focus();
      });

      $('btn-modal-cancel').addEventListener('click', () => {
        urlModal.classList.remove('open');
      });

      $('btn-modal-load').addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (url) {
          loadFromUrl(url);
          urlModal.classList.remove('open');
          urlInput.value = '';
        }
      });

      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          $('btn-modal-load').click();
        } else if (e.key === 'Escape') {
          urlModal.classList.remove('open');
        }
      });

      // File loading
      $('btn-load-file').addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          loadFromFile(e.target.files[0]);
          e.target.value = '';
        }
      });

      // Click outside to close panels
      document.addEventListener('click', (e) => {
        if (galleryOpen && !templateGallery.contains(e.target) && e.target.id !== 'btn-gallery') {
          galleryOpen = false;
          templateGallery.classList.remove('open');
        }
      });
    }

    // ============================================
    // START
    // ============================================
    init();
  </script>
</body>
</html>
