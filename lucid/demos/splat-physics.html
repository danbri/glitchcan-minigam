<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splat Object Physics Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid #333;
    }
    h1 { font-size: 1.2rem; color: #00d9ff; }
    .subtitle { font-size: 0.8rem; color: #888; margin-top: 0.3rem; }

    .container {
      flex: 1;
      display: flex;
      gap: 1rem;
      padding: 1rem;
    }

    canvas {
      flex: 1;
      background: #0a0a12;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .controls {
      width: 280px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid #333;
    }

    .control-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #00d9ff;
    }

    .value {
      font-size: 0.8rem;
      color: #00d9ff;
      float: right;
    }

    button {
      width: 100%;
      padding: 0.7rem;
      background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.5rem;
    }

    button:hover { opacity: 0.9; }
    button.secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    button.danger {
      background: linear-gradient(135deg, #ff6b6b 0%, #cc4444 100%);
    }

    .stats {
      font-size: 0.75rem;
      color: #666;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #333;
    }

    .instructions {
      font-size: 0.8rem;
      color: #888;
      margin-top: 1rem;
      padding: 0.8rem;
      background: rgba(0,217,255,0.1);
      border-radius: 6px;
    }

    .legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Splat Object Physics</h1>
    <div class="subtitle">Rigid Body Simulation for Gaussian Splat Objects (LCD-047)</div>
  </header>

  <div class="container">
    <canvas id="canvas"></canvas>

    <div class="controls">
      <div class="control-group">
        <label>Gravity <span class="value" id="gravityVal">9.81</span></label>
        <input type="range" id="gravity" min="0" max="30" step="0.5" value="9.81">
      </div>

      <div class="control-group">
        <label>Restitution (Bounce) <span class="value" id="restVal">0.6</span></label>
        <input type="range" id="restitution" min="0" max="1" step="0.05" value="0.6">
      </div>

      <div class="control-group">
        <label>Friction <span class="value" id="frictionVal">0.3</span></label>
        <input type="range" id="friction" min="0" max="1" step="0.05" value="0.3">
      </div>

      <button id="addBallBtn">Add Ball</button>
      <button id="addCubeBtn" class="secondary">Add Cube</button>
      <button id="clearBtn" class="danger">Clear All</button>

      <div class="instructions">
        Click canvas to spawn objects at that position.
        Objects fall under gravity and bounce off ground.

        <div class="legend">
          <div class="legend-item">
            <div class="legend-color" style="background: #00d9ff;"></div>
            <span>Ball (rigid)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #ff6b6b;"></div>
            <span>Cube (rigid)</span>
          </div>
        </div>
      </div>

      <div class="stats">
        <div>Objects: <span id="statObjects">0</span></div>
        <div>Mode: <span id="statMode">rigid</span></div>
        <div>FPS: <span id="statFps">-</span></div>
        <div>Physics Time: <span id="statPhysics">-</span>ms</div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      SplatPhysicsWorld,
      SplatObject,
      quat
    } from '../core/physics/splat-physics.js';
    import { vec3 } from '../core/physics/xpbd.js';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Physics world
    const world = new SplatPhysicsWorld({
      gravity: [0, 9.81 * 50, 0],  // Scaled for pixels
      groundY: 0
    });

    // Parameters
    let restitution = 0.6;
    let friction = 0.3;
    let spawnType = 'ball';  // 'ball' or 'cube'

    // Scale factor for physics (pixels per meter)
    const SCALE = 50;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      // Update ground plane
      world.groundY = (canvas.height / window.devicePixelRatio - 50) / SCALE;
    }

    function spawnObject(x, y, type = 'ball') {
      const worldX = x / SCALE;
      const worldY = y / SCALE;

      const id = `${type}_${Date.now()}`;
      const radius = type === 'ball' ? 0.5 : 0.4;

      const obj = new SplatObject({
        id,
        mode: 'rigid',
        position: [worldX, worldY, 0],
        mass: type === 'ball' ? 1.0 : 2.0,
        bounds: {
          min: [-radius, -radius, -radius],
          max: [radius, radius, radius]
        }
      });

      // Store visual properties
      obj.visualType = type;
      obj.radius = radius * SCALE;
      obj.color = type === 'ball' ? '#00d9ff' : '#ff6b6b';

      // Apply physics properties
      obj.body.restitution = restitution;
      obj.body.friction = friction;
      obj.body.boundingRadius = radius;

      // Random initial velocity
      obj.body.velocity = [
        (Math.random() - 0.5) * 5,
        -Math.random() * 3,
        0
      ];

      // Random rotation for cubes
      if (type === 'cube') {
        obj.body.angularVelocity = [0, 0, (Math.random() - 0.5) * 5];
      }

      world.addObject(obj);
      updateStats();
    }

    function updateStats() {
      document.getElementById('statObjects').textContent = world.objects.size;
    }

    function render() {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;

      // Clear
      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, w, h);

      // Draw ground
      const groundY = world.groundY * SCALE;
      ctx.fillStyle = '#2a2a3e';
      ctx.fillRect(0, groundY, w, h - groundY);

      ctx.strokeStyle = '#444';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(w, groundY);
      ctx.stroke();

      // Draw objects
      for (const obj of world.objects.values()) {
        const x = obj.body.position[0] * SCALE;
        const y = obj.body.position[1] * SCALE;
        const r = obj.radius;

        ctx.save();
        ctx.translate(x, y);

        // Apply rotation for cubes
        if (obj.visualType === 'cube') {
          // Extract Z rotation from quaternion (simplified 2D)
          const q = obj.body.rotation;
          const angle = 2 * Math.atan2(q[2], q[3]);
          ctx.rotate(angle);
        }

        // Draw based on type
        if (obj.visualType === 'ball') {
          // Ball with gradient
          const gradient = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 0, 0, 0, r);
          gradient.addColorStop(0, '#66efff');
          gradient.addColorStop(1, obj.color);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fill();

          // Highlight
          ctx.fillStyle = 'rgba(255,255,255,0.3)';
          ctx.beginPath();
          ctx.arc(-r * 0.3, -r * 0.3, r * 0.3, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Cube
          ctx.fillStyle = obj.color;
          ctx.fillRect(-r, -r, r * 2, r * 2);

          // Edge highlight
          ctx.strokeStyle = 'rgba(255,255,255,0.3)';
          ctx.lineWidth = 2;
          ctx.strokeRect(-r, -r, r * 2, r * 2);
        }

        ctx.restore();

        // Draw velocity vector (debug)
        const vel = obj.body.velocity;
        const speed = vec3.length(vel);
        if (speed > 0.5) {
          ctx.strokeStyle = 'rgba(255,255,0,0.3)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + vel[0] * 5, y + vel[1] * 5);
          ctx.stroke();
        }
      }
    }

    let lastTime = 0;
    let frameCount = 0;
    let fpsTime = 0;

    function animate(time) {
      requestAnimationFrame(animate);

      // FPS counter
      frameCount++;
      if (time - fpsTime > 1000) {
        document.getElementById('statFps').textContent = frameCount;
        frameCount = 0;
        fpsTime = time;
      }

      // Physics step with timing
      const physicsStart = performance.now();
      const dt = Math.min((time - lastTime) / 1000, 1 / 30);
      if (dt > 0) {
        world.step(dt);
      }
      const physicsTime = performance.now() - physicsStart;
      document.getElementById('statPhysics').textContent = physicsTime.toFixed(2);

      // Remove objects that fell too far
      const maxY = (canvas.height / window.devicePixelRatio + 100) / SCALE;
      for (const [id, obj] of world.objects) {
        if (obj.body.position[1] > maxY) {
          world.removeObject(id);
        }
      }
      updateStats();

      render();
      lastTime = time;
    }

    // Event listeners
    function setupEvents() {
      document.getElementById('gravity').addEventListener('input', (e) => {
        const g = parseFloat(e.target.value);
        document.getElementById('gravityVal').textContent = g.toFixed(1);
        world.gravity = [0, g * SCALE, 0];
      });

      document.getElementById('restitution').addEventListener('input', (e) => {
        restitution = parseFloat(e.target.value);
        document.getElementById('restVal').textContent = restitution.toFixed(2);
        // Update existing objects
        for (const obj of world.objects.values()) {
          obj.body.restitution = restitution;
        }
      });

      document.getElementById('friction').addEventListener('input', (e) => {
        friction = parseFloat(e.target.value);
        document.getElementById('frictionVal').textContent = friction.toFixed(2);
        // Update existing objects
        for (const obj of world.objects.values()) {
          obj.body.friction = friction;
        }
      });

      document.getElementById('addBallBtn').addEventListener('click', () => {
        spawnType = 'ball';
        const w = canvas.width / window.devicePixelRatio;
        spawnObject(w / 2 + (Math.random() - 0.5) * 100, 100, 'ball');
      });

      document.getElementById('addCubeBtn').addEventListener('click', () => {
        spawnType = 'cube';
        const w = canvas.width / window.devicePixelRatio;
        spawnObject(w / 2 + (Math.random() - 0.5) * 100, 100, 'cube');
      });

      document.getElementById('clearBtn').addEventListener('click', () => {
        world.objects.clear();
        updateStats();
      });

      // Click to spawn
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        spawnObject(x, y, spawnType);
      });

      // Touch to spawn
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        spawnObject(x, y, spawnType);
      });

      window.addEventListener('resize', resize);
    }

    // Init
    resize();
    setupEvents();

    // Spawn initial objects
    const w = canvas.width / window.devicePixelRatio;
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        spawnObject(w * 0.3 + Math.random() * w * 0.4, 50 + Math.random() * 100,
          Math.random() > 0.5 ? 'ball' : 'cube');
      }, i * 200);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
