<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPBD Chain Physics Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid #333;
    }
    h1 { font-size: 1.2rem; color: #00d9ff; }
    .subtitle { font-size: 0.8rem; color: #888; margin-top: 0.3rem; }

    .container {
      flex: 1;
      display: flex;
      gap: 1rem;
      padding: 1rem;
    }

    canvas {
      flex: 1;
      background: #0a0a12;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .controls {
      width: 280px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid #333;
    }

    .control-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #00d9ff;
    }

    .value {
      font-size: 0.8rem;
      color: #00d9ff;
      float: right;
    }

    button {
      width: 100%;
      padding: 0.7rem;
      background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.5rem;
    }

    button:hover { opacity: 0.9; }
    button.secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .stats {
      font-size: 0.75rem;
      color: #666;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #333;
    }

    .instructions {
      font-size: 0.8rem;
      color: #888;
      margin-top: 1rem;
      padding: 0.8rem;
      background: rgba(0,217,255,0.1);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>XPBD Chain Physics</h1>
    <div class="subtitle">Extended Position-Based Dynamics (LCD-044)</div>
  </header>

  <div class="container">
    <canvas id="canvas"></canvas>

    <div class="controls">
      <div class="control-group">
        <label>Chain Length <span class="value" id="lengthVal">8</span></label>
        <input type="range" id="chainLength" min="3" max="20" value="8">
      </div>

      <div class="control-group">
        <label>Segment Length <span class="value" id="segmentVal">0.5</span></label>
        <input type="range" id="segmentLength" min="0.2" max="1.5" step="0.1" value="0.5">
      </div>

      <div class="control-group">
        <label>Gravity <span class="value" id="gravityVal">9.81</span></label>
        <input type="range" id="gravity" min="0" max="30" step="0.5" value="9.81">
      </div>

      <div class="control-group">
        <label>Solver Iterations <span class="value" id="iterVal">5</span></label>
        <input type="range" id="iterations" min="1" max="20" value="5">
      </div>

      <button id="resetBtn">Reset Chain</button>
      <button id="windBtn" class="secondary">Toggle Wind</button>

      <div class="instructions">
        Click and drag to move the anchor point.
        The chain uses Verlet integration with XPBD constraint solving.
      </div>

      <div class="stats">
        <div>Particles: <span id="statParticles">-</span></div>
        <div>Constraints: <span id="statConstraints">-</span></div>
        <div>FPS: <span id="statFps">-</span></div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      createChain,
      createParticle,
      createDistanceConstraint,
      simulationStep,
      vec3
    } from '../core/physics/xpbd.js';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    let constraints = [];
    let anchorPos = [0, 0, 0];
    let windEnabled = false;
    let isDragging = false;

    // Parameters
    let chainLength = 8;
    let segmentLength = 0.5;
    let gravity = 9.81;
    let iterations = 5;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    function createNewChain() {
      anchorPos = [canvas.width / window.devicePixelRatio / 2, 80, 0];
      const result = createChain(
        [anchorPos[0], anchorPos[1], 0],
        [0, 1, 0],  // Down
        segmentLength * 50,  // Scale for pixels
        chainLength
      );
      particles = result.particles;
      constraints = result.constraints;

      document.getElementById('statParticles').textContent = particles.length;
      document.getElementById('statConstraints').textContent = constraints.length;
    }

    function worldToScreen(pos) {
      return [pos[0], pos[1]];
    }

    function screenToWorld(x, y) {
      return [x, y, 0];
    }

    function render() {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;

      // Clear
      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, w, h);

      // Draw constraints (lines)
      ctx.strokeStyle = '#00d9ff';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';

      for (const c of constraints) {
        if (c.type === 'distance') {
          const [iA, iB] = c.particles;
          const pA = worldToScreen(particles[iA].pos);
          const pB = worldToScreen(particles[iB].pos);

          ctx.beginPath();
          ctx.moveTo(pA[0], pA[1]);
          ctx.lineTo(pB[0], pB[1]);
          ctx.stroke();
        }
      }

      // Draw particles
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const [x, y] = worldToScreen(p.pos);

        // Anchor is different color
        if (p.invMass === 0) {
          ctx.fillStyle = '#ff6b6b';
          ctx.beginPath();
          ctx.arc(x, y, 12, 0, Math.PI * 2);
          ctx.fill();

          // Anchor symbol
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x - 5, y - 5);
          ctx.lineTo(x + 5, y + 5);
          ctx.moveTo(x + 5, y - 5);
          ctx.lineTo(x - 5, y + 5);
          ctx.stroke();
        } else {
          // Regular particle - color by velocity
          const speed = vec3.length(p.velocity);
          const hue = Math.min(speed / 500 * 60, 60);
          ctx.fillStyle = `hsl(${180 - hue}, 80%, 60%)`;
          ctx.beginPath();
          ctx.arc(x, y, 8, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Draw wind indicator
      if (windEnabled) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.font = '24px sans-serif';
        ctx.fillText('Wind', w - 80, 40);
      }
    }

    let lastTime = 0;
    let frameCount = 0;
    let fpsTime = 0;

    function animate(time) {
      requestAnimationFrame(animate);

      // FPS counter
      frameCount++;
      if (time - fpsTime > 1000) {
        document.getElementById('statFps').textContent = frameCount;
        frameCount = 0;
        fpsTime = time;
      }

      // Fixed timestep
      const dt = 1 / 60;

      // Update anchor position (particle 0)
      particles[0].pos = [...anchorPos];
      particles[0].prevPos = [...anchorPos];

      // Apply wind
      if (windEnabled) {
        const windForce = [Math.sin(time / 500) * 0.3, 0, 0];
        for (const p of particles) {
          if (p.invMass > 0) {
            p.pos = vec3.add(p.pos, windForce);
          }
        }
      }

      // Physics step
      simulationStep(particles, constraints, dt, {
        iterations,
        gravity: [0, gravity * 50, 0]  // Scaled for pixels
      });

      render();
      lastTime = time;
    }

    // Event listeners
    function setupEvents() {
      // Sliders
      document.getElementById('chainLength').addEventListener('input', (e) => {
        chainLength = parseInt(e.target.value);
        document.getElementById('lengthVal').textContent = chainLength;
        createNewChain();
      });

      document.getElementById('segmentLength').addEventListener('input', (e) => {
        segmentLength = parseFloat(e.target.value);
        document.getElementById('segmentVal').textContent = segmentLength.toFixed(1);
        createNewChain();
      });

      document.getElementById('gravity').addEventListener('input', (e) => {
        gravity = parseFloat(e.target.value);
        document.getElementById('gravityVal').textContent = gravity.toFixed(1);
      });

      document.getElementById('iterations').addEventListener('input', (e) => {
        iterations = parseInt(e.target.value);
        document.getElementById('iterVal').textContent = iterations;
      });

      // Buttons
      document.getElementById('resetBtn').addEventListener('click', createNewChain);
      document.getElementById('windBtn').addEventListener('click', () => {
        windEnabled = !windEnabled;
        document.getElementById('windBtn').textContent =
          windEnabled ? 'Disable Wind' : 'Toggle Wind';
      });

      // Mouse drag
      canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Check if clicking near anchor
        const dx = x - anchorPos[0];
        const dy = y - anchorPos[1];
        if (Math.sqrt(dx * dx + dy * dy) < 30) {
          isDragging = true;
        }
      });

      canvas.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const rect = canvas.getBoundingClientRect();
        anchorPos[0] = e.clientX - rect.left;
        anchorPos[1] = e.clientY - rect.top;
      });

      canvas.addEventListener('mouseup', () => isDragging = false);
      canvas.addEventListener('mouseleave', () => isDragging = false);

      // Touch support
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        anchorPos[0] = touch.clientX - rect.left;
        anchorPos[1] = touch.clientY - rect.top;
        isDragging = true;
      });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!isDragging) return;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        anchorPos[0] = touch.clientX - rect.left;
        anchorPos[1] = touch.clientY - rect.top;
      });

      canvas.addEventListener('touchend', () => isDragging = false);

      window.addEventListener('resize', () => {
        resize();
        createNewChain();
      });
    }

    // Init
    resize();
    setupEvents();
    createNewChain();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
