  invaders:`(scene "Distance Field Invaders" :version "2.0" :subtitle "Parametric space invaders with animation controls" (params (moveSpeed :type scalar :value 1 :min 0.2 :max 3) (moveAmplitude :type scalar :value 0.3 :min 0.05 :max 0.8) (invaderScale :type scalar :value 1 :min 0.5 :max 2) (topRowColor :type color3 :value [0 1 0.5]) (bottomRowColor :type color3 :value [1 0.3 0.8])) (defs (invader (subtract (union (box :size [0.35 0.25 0.1]) (box :size [0.1 0.1 0.1] :translate [0.25 0.35 0]) (box :size [0.1 0.1 0.1] :translate [-0.25 0.35 0]) (box :size [0.05 0.15 0.1] :translate [0.4 0.05 0]) (box :size [0.05 0.15 0.1] :translate [-0.4 0.05 0]) (box :size [0.1 0.1 0.1] :translate [0.35 -0.35 0]) (box :size [0.1 0.1 0.1] :translate [-0.35 -0.35 0])) (union (box :size [0.08 0.08 0.2] :translate [0.15 0.1 0.05]) (box :size [0.08 0.08 0.2] :translate [-0.15 0.1 0.05]) (box :size [0.12 0.08 0.2] :translate [0 -0.25 0.05]))))) (root (union (material {"type":"material","params":{"color":{"var":"topRowColor"}},"child":{"type":"transform","transform":{"translate":[-1.5,0.6,0],"scale":{"var":"invaderScale"}},"child":{"type":"ref","id":"invader"}}}) (material {"type":"material","params":{"color":{"var":"bottomRowColor"}},"child":{"type":"transform","transform":{"translate":[0,-0.6,0],"scale":{"var":"invaderScale"}},"child":{"type":"ref","id":"invader"}}}))))`,

};
function tokenizeDSL(source){

function inIframe(){try{return window.self!==window.top}catch{return true}}

const mix=(a,b,t)=>a*(1-t)+b*t;

const v3=(x=0,y=0,z=0)=>({x,y,z});
const add=(a,b)=>v3(a.x+b.x,a.y+b.y,a.z+b.z),sub=(a,b)=>v3(a.x-b.x,a.y-b.y,a.z-b.z),mul=(a,s)=>v3(a.x*s,a.y*s,a.z*s),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,length3=a=>Math.hypot(a.x,a.y,a.z),normalize=a=>{const l=length3(a)||1;return v3(a.x/l,a.y/l,a.z/l)};
function rotateCameraJS(v,yaw,pitch){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const q=v3(v.x,cp*v.y+sp*v.z,-sp*v.y+cp*v.z);return v3(cy*q.x+sy*q.z,q.y,-sy*q.x+cy*q.z)}

function sceneSDFJS(p,demoId,cutOn){
  if(demoId===4){
    let d=p.y+0.8;
    d=Math.min(d,snowmanJS(p));
    d=Math.min(d,sdCapsuleJS(p,v3(0.55,0.35,0),v3(0.85,0.55,0),0.02));

  }
  if(demoId===1){
    let d=p.y-terrainHeightJS(p);

    d=Math.min(d,sdRoundBoxJS(sub(p,v3(-3.2,2.25,5)),v3(1.85,2.05,1.85),0.45));

    d=Math.min(d,sdCylinderJS(sub(p,v3(9.2,2.0,5)),1.55,2.0));

  }
  if(demoId===2){
    let d=p.y-terrainHeightJS(p);

fn refinedHit(ro:vec3<f32>,rd:vec3<f32>,guess:f32,cell:f32)->vec2<f32>{let radius=cell*1.20;var previousT=max(0.0,guess-radius);var previousD=sceneSDF(ro+rd*previousT,scene);var bestT=previousT;var bestAbs=abs(previousD);for(var i=1;i<=20;i=i+1){let currentT=max(0.0,guess-radius+(2.0*radius)*f32(i)/20.0);let currentD=sceneSDF(ro+rd*currentT,scene);if(abs(currentD)<bestAbs){bestAbs=abs(currentD);bestT=currentT;}if(previousD*currentD<=0.0){var lo=previousT;var hi=currentT;var dlo=previousD;for(var j=0;j<11;j=j+1){let mid=0.5*(lo+hi);let dm=sceneSDF(ro+rd*mid,scene);if(dlo*dm>0.0){lo=mid;dlo=dm;}else{hi=mid;}}let t=0.5*(lo+hi);return vec2<f32>(t,abs(sceneSDF(ro+rd*t,scene)));}previousT=currentT;previousD=currentD;}var t=bestT;for(var k=0;k<6;k=k+1){let e=0.025;let d=sceneSDF(ro+rd*t,scene);let deriv=(sceneSDF(ro+rd*(t+e),scene)-sceneSDF(ro+rd*(t-e),scene))/(2.0*e);if(abs(deriv)<0.08){break;}t-=clamp(d/deriv,-cell*0.28,cell*0.28);}return vec2<f32>(t,abs(sceneSDF(ro+rd*t,scene)));}
fn validHit(candidate:vec2<f32>,guess:f32,cell:f32)->bool{return candidate.y<0.012&&abs(candidate.x-guess)<cell*1.55;}
fn snowOverlay(p:vec3<f32>,rd:vec3<f32>)->vec3<f32>{if(i32(scene.params.z+0.5)!=4){return vec3<f32>(0.0);}let t=scene.params.y*0.5;var acc=0.0;for(var i=0;i<14;i=i+1){let fi=f32(i);let h=hash3(fi*13.1);let pos=vec3<f32>((h.x-0.5)*3.3,1.8-fract(t+h.y)*2.5,(h.z-0.5)*3.3);let q=p-pos;let flake=smoothstep(0.08,0.0,length(q));acc=max(acc,flake);}return vec3<f32>(acc*0.7);}
fn shade(p:vec3<f32>,n:vec3<f32>,rd:vec3<f32>,t:f32,steps:i32,worldBrick:vec3<i32>,level:i32)->vec4<f32>{let dbg=i32(camera.params.z+0.5);let light=normalize(vec3<f32>(-0.46,0.82,-0.34));let diff=max(dot(n,light),0.0);let hemi=0.5+0.5*n.y;let halfV=normalize(light-rd);let spec=pow(max(dot(n,halfV),0.0),56.0);let rim=pow(1.0-max(dot(n,-rd),0.0),3.0);var col=sceneColour(p)*(0.22+0.24*hemi+0.68*diff)+vec3<f32>(0.96,0.98,1.0)*spec*0.18+sceneColour(p)*rim*0.10+snowOverlay(p,rd);if(dbg==1){let brick=levelBrick(level);let local=(p-vec3<f32>(worldBrick)*brick)/brick;let edge=min(min(min(local.x,1.0-local.x),min(local.y,1.0-local.y)),min(local.z,1.0-local.z));let line=1.0-smoothstep(0.0,0.016,edge);col=mix(col,debugGridColour(),line*0.95);}if(dbg==2){if(level==0){col=vec3<f32>(0.08,0.78,0.88);}else if(level==1){col=vec3<f32>(0.55,0.32,0.92);}else{col=vec3<f32>(0.90,0.26,0.48);}}if(dbg==3){let u=clamp(f32(steps)/100.0,0.0,1.0);col=mix(vec3<f32>(0.03,0.18,0.55),vec3<f32>(0.95,0.12,0.10),u);}let fog=1.0-exp(-0.00105*t*t);return vec4<f32>(mix(col,sky(rd),fog),1.0);}

fn snowNormal(p:vec3<f32>)->vec3<f32>{let e=0.0015;return normalize(vec3<f32>(snowmanSample(p+vec3<f32>(e,0,0)).distance-snowmanSample(p-vec3<f32>(e,0,0)).distance,snowmanSample(p+vec3<f32>(0,e,0)).distance-snowmanSample(p-vec3<f32>(0,e,0)).distance,snowmanSample(p+vec3<f32>(0,0,e)).distance-snowmanSample(p-vec3<f32>(0,0,e)).distance));}

fn invaderSample(p:vec3<f32>,time:f32)->ProcSample{let a=0.30;var best=ProcSample(1e9,10u);let poses=array<vec3<f32>,6>(vec3<f32>(-1.5+sin(time)*a,0.6,0),vec3<f32>(0,0.6+sin(time+1.0)*a*0.7,0),vec3<f32>(1.5+sin(time)*a,0.6,0),vec3<f32>(-1.5,-0.6,0),vec3<f32>(sin(time)*a,-0.6,0),vec3<f32>(1.5,-0.6+sin(time+3.0)*a*0.7,0));for(var i=0;i<6;i=i+1){let d=invaderShape(p-poses[i]);if(d<best.distance){best=ProcSample(d,select(11u,10u,i<3));}}return best;}
