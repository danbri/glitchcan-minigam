<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucid Scene Catalog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; overflow: hidden; }

    .app { display: grid; grid-template-columns: 1fr auto; height: 100vh; }

    /* Main content - maximize for images */
    main { overflow-y: auto; padding: 12px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
    }
    .card-head {
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-head .path { font-weight: normal; color: #6e7681; font-family: monospace; font-size: 9px; }

    .renders { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 2px; }
    .render {
      aspect-ratio: 1;
      background: #0d1117;
      position: relative;
      border-radius: 2px;
      overflow: hidden;
    }
    .render img { width: 100%; height: 100%; object-fit: cover; }
    .render .lbl {
      position: absolute;
      bottom: 0;
      left: 0;
      font-size: 7px;
      color: #fff;
      background: rgba(0,0,0,0.7);
      padding: 1px 3px;
    }
    .render .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 9px;
      color: #484f58;
    }
    .render .placeholder.err { color: #f85149; }

    .backend-row {
      display: flex;
      gap: 2px;
      font-size: 8px;
      padding: 2px 4px;
      background: #21262d;
    }
    .backend-row span { padding: 1px 4px; border-radius: 2px; }
    .backend-row .mayfly { background: #1f6feb22; color: #58a6ff; }
    .backend-row .stinkyfish { background: #8957e522; color: #a371f7; }

    /* Collapsible sidebar */
    aside {
      width: 260px;
      background: #161b22;
      border-left: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      transition: width 0.2s, padding 0.2s;
      overflow: hidden;
    }
    aside.collapsed { width: 36px; }
    aside.collapsed .sidebar-content { display: none; }
    aside.collapsed .toggle-btn { transform: rotate(180deg); }

    .sidebar-header {
      padding: 10px;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
    }
    .sidebar-header h2 { font-size: 13px; font-weight: 600; white-space: nowrap; }
    .toggle-btn {
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: transform 0.2s;
    }
    .toggle-btn:hover { color: #c9d1d9; }

    .sidebar-content { padding: 12px; overflow-y: auto; flex: 1; }

    .ctrl-section { margin-bottom: 16px; }
    .ctrl-section h3 { font-size: 10px; text-transform: uppercase; color: #8b949e; margin-bottom: 8px; }

    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 6px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #c9d1d9;
      font-size: 11px;
      cursor: pointer;
      text-align: left;
    }
    .btn:hover { background: #30363d; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.primary { background: #238636; border-color: #238636; }
    .btn.primary:hover { background: #2ea043; }

    #progress { font-size: 10px; color: #8b949e; margin-top: 8px; min-height: 28px; }

    .stat { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px solid #21262d; }
    .stat:last-child { border: none; }
    .stat .val { color: #58a6ff; }

    .legend { font-size: 10px; color: #8b949e; }
    .legend div { margin: 4px 0; display: flex; align-items: center; gap: 6px; }
    .legend .dot { width: 8px; height: 8px; border-radius: 2px; }
    .legend .dot.m { background: #1f6feb; }
    .legend .dot.s { background: #8957e5; }

    @media print {
      aside { display: none; }
      body { background: #fff; color: #000; overflow: visible; height: auto; }
      .app { display: block; }
      main { padding: 10px; }
      .card { border-color: #ccc; break-inside: avoid; }
      .card-head { background: #f5f5f5; color: #333; }
      .renders { background: #fff; }
    }
  </style>
</head>
<body>
  <div class="app">
    <main>
      <div class="grid" id="catalog"></div>
    </main>

    <aside id="sidebar" class="collapsed">
      <div class="sidebar-header">
        <h2>Catalog</h2>
        <button class="toggle-btn" onclick="toggleSidebar()" title="Toggle sidebar">◀</button>
      </div>
      <div class="sidebar-content">
        <div class="ctrl-section">
          <h3>Actions</h3>
          <button class="btn primary" id="captureBtn" onclick="captureAll()">▶ Capture All</button>
          <button class="btn" onclick="window.print()">⎙ Print PDF</button>
          <div id="progress"></div>
        </div>

        <div class="ctrl-section">
          <h3>Stats</h3>
          <div class="stat"><span>Scenes</span><span class="val" id="statScenes">-</span></div>
          <div class="stat"><span>Categories</span><span class="val" id="statCats">-</span></div>
          <div class="stat"><span>WebGPU</span><span class="val" id="statGpu">-</span></div>
        </div>

        <div class="ctrl-section">
          <h3>Legend</h3>
          <div class="legend">
            <div><span class="dot m"></span> Mayfly (WebGL)</div>
            <div><span class="dot s"></span> Stinkyfish (WebGPU)</div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <canvas id="mayflyCanvas" width="300" height="300" style="display:none;"></canvas>
  <canvas id="stinkyfishCanvas" width="300" height="300" style="display:none;"></canvas>

  <script type="module">
    import { SimpleRaymarcher } from './mayfly/raymarcher.js';
    import { loadJsonScene } from './core/json-loader.js';
    import { generateGlslFromJson } from './core/json-codegen.js';
    import { generateWgslFromJson } from './core/wgsl-codegen.js';
    import { StinkyfishRenderer } from './stinkyfish/raymarcher.js';

    const ANGLES = [
      { n: 'F', theta: 0.3, phi: 0.5 },
      { n: 'S', theta: Math.PI/2, phi: 0.4 },
      { n: '↑', theta: 0.5, phi: 0.15 },
      { n: '↓', theta: -0.3, phi: 0.85 }
    ];

    const SKIP = ['recent', 'physics', 'anim', 'creatures', 'archive', 'nature', 'animation'];

    let toc, mayfly, stinkyfish, hasGpu = !!navigator.gpu;

    async function init() {
      document.getElementById('statGpu').textContent = hasGpu ? '✓' : '✗';

      const resp = await fetch('./scenes/toc.json');
      toc = await resp.json();
      buildCatalog();
    }

    function buildCatalog() {
      const el = document.getElementById('catalog');
      let html = '', sceneCount = 0, catCount = 0;

      for (const cat of toc.categories) {
        if (SKIP.includes(cat.id)) continue;
        catCount++;

        for (const s of cat.scenes) {
          sceneCount++;
          const shortPath = s.path.replace('prim/', '').replace('csg/', '').replace('transform/', '');
          html += `
            <div class="card" data-path="${s.path}">
              <div class="card-head">
                <span>${s.title}</span>
                <span class="path">${shortPath}</span>
              </div>
              <div class="backend-row">
                <span class="mayfly">M</span>
                <span class="stinkyfish">S</span>
              </div>
              <div class="renders mayfly-renders">
                ${ANGLES.map(a => `<div class="render"><div class="placeholder">·</div><span class="lbl">M${a.n}</span></div>`).join('')}
              </div>
              <div class="renders stinkyfish-renders">
                ${ANGLES.map(a => `<div class="render"><div class="placeholder">${hasGpu ? '·' : '-'}</div><span class="lbl">S${a.n}</span></div>`).join('')}
              </div>
            </div>
          `;
        }
      }

      el.innerHTML = html;
      document.getElementById('statScenes').textContent = sceneCount;
      document.getElementById('statCats').textContent = catCount;
    }

    async function initMayfly() {
      if (mayfly) return;
      mayfly = new SimpleRaymarcher(document.getElementById('mayflyCanvas'));
      mayfly.setQuality('high');
      mayfly.showGroundPlane = true;  // Enable ground for visual context
      mayfly.showAxes = false;
    }

    async function initStinkyfish() {
      if (stinkyfish || !hasGpu) return;
      try {
        stinkyfish = new StinkyfishRenderer(document.getElementById('stinkyfishCanvas'));
        await stinkyfish.init();
        stinkyfish.setQuality('high');
        stinkyfish.showGroundPlane = true;  // Enable ground for visual context
        stinkyfish.showAxes = false;
      } catch { hasGpu = false; }
    }

    async function capture(renderer, path, isGpu) {
      const resp = await fetch(`./scenes/${path}`);
      const json = await resp.json();
      const scene = loadJsonScene(json);

      if (isGpu) {
        const wgsl = generateWgslFromJson(scene, {});
        const { getAllParamNames } = await import('./core/rig-evaluator.js');
        const params = getAllParamNames(scene.params || {}, scene.rig);
        const layout = {};
        for (const [k, v] of Object.entries(params)) {
          layout[`u_${k}`] = ['color3','position3','radii3','direction3'].includes(v.type) ? 'vec3f' : 'f32';
        }
        await renderer.compileScene(wgsl, Object.keys(layout).length ? layout : null);
        if (scene.params) renderer.setSceneParams(scene.params);
      } else {
        const glsl = generateGlslFromJson(scene, {});
        renderer.updateScene(glsl, scene.params || {}, scene.rig || null, json);
      }

      const dist = json.camera?.distance || 6;
      const target = json.camera?.target || [0, 0.5, 0];

      return ANGLES.map(a => {
        // Use camera object for Mayfly, flat properties for Stinkyfish
        if (isGpu) {
          renderer.cameraDistance = dist;
          renderer.cameraTarget = target;
          renderer.cameraTheta = a.theta;
          renderer.cameraPhi = a.phi;
        } else {
          renderer.camera.distance = dist;
          renderer.camera.target = target;
          renderer.camera.theta = a.theta;
          renderer.camera.phi = a.phi;
        }
        renderer.render(isGpu ? 0 : undefined);
        return renderer.canvas.toDataURL('image/png');
      });
    }

    function setImages(renders, imgs) {
      renders.forEach((r, i) => {
        const lbl = r.querySelector('.lbl').textContent;
        r.innerHTML = `<img src="${imgs[i]}"><span class="lbl">${lbl}</span>`;
      });
    }

    function setError(renders, msg) {
      renders.forEach(r => {
        const lbl = r.querySelector('.lbl').textContent;
        r.innerHTML = `<div class="placeholder err">${msg}</div><span class="lbl">${lbl}</span>`;
      });
    }

    window.captureAll = async function() {
      const btn = document.getElementById('captureBtn');
      const prog = document.getElementById('progress');
      btn.disabled = true;

      const cards = document.querySelectorAll('.card');
      let done = 0;

      for (const card of cards) {
        const path = card.dataset.path;
        prog.textContent = `${++done}/${cards.length} ${path.split('/').pop()}`;

        const mRenders = card.querySelectorAll('.mayfly-renders .render');
        const sRenders = card.querySelectorAll('.stinkyfish-renders .render');

        try {
          await initMayfly();
          const imgs = await Promise.race([capture(mayfly, path, false), timeout(6000)]);
          setImages(mRenders, imgs);
        } catch (e) { setError(mRenders, '!'); }

        if (hasGpu) {
          try {
            await initStinkyfish();
            if (stinkyfish) {
              const imgs = await Promise.race([capture(stinkyfish, path, true), timeout(6000)]);
              setImages(sRenders, imgs);
            }
          } catch (e) { setError(sRenders, '!'); }
        }
      }

      prog.textContent = `✓ ${done} scenes captured`;
      btn.disabled = false;
    };

    function timeout(ms) { return new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms)); }

    window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('collapsed');

    init();
  </script>
</body>
</html>
