<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucid SDF Scene Catalog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fff;
      color: #1a1a1a;
      line-height: 1.4;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .controls {
      text-align: center;
      margin-bottom: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    .controls button {
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }

    .controls button:hover {
      background: #e8e8e8;
    }

    .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #progress {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }

    .category {
      margin-bottom: 30px;
      page-break-inside: avoid;
    }

    .category-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      padding-bottom: 5px;
      border-bottom: 2px solid #333;
    }

    .scene {
      margin-bottom: 25px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      page-break-inside: avoid;
    }

    .scene-header {
      margin-bottom: 10px;
    }

    .scene-title {
      font-size: 16px;
      font-weight: 600;
    }

    .scene-path {
      font-size: 11px;
      color: #888;
      font-family: monospace;
    }

    .scene-description {
      font-size: 13px;
      color: #555;
      margin-top: 5px;
    }

    .backends {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 10px;
    }

    .backend {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 8px;
      background: #fafafa;
    }

    .backend-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #444;
    }

    .backend-title.mayfly { color: #2563eb; }
    .backend-title.stinkyfish { color: #7c3aed; }

    .views {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .view {
      aspect-ratio: 1;
      background: #1a1a2e;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .view canvas {
      width: 100%;
      height: 100%;
    }

    .view-label {
      position: absolute;
      bottom: 1px;
      left: 1px;
      font-size: 8px;
      color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.6);
      padding: 1px 3px;
      border-radius: 2px;
    }

    .view img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 10px;
      height: 100%;
    }

    .placeholder.error { color: #e44; }
    .placeholder.na { color: #888; font-style: italic; }

    @media print {
      .controls { display: none; }
      body { padding: 10px; }
      .scene { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <h1>Lucid SDF Scene Catalog</h1>
  <p class="subtitle">Mayfly (WebGL) vs Stinkyfish (WebGPU) - 4 angles per backend</p>

  <div class="controls">
    <button id="captureBtn" onclick="captureAllScenes()">Capture All Scenes</button>
    <button id="printBtn" onclick="window.print()">Print / Save PDF</button>
    <div id="progress"></div>
  </div>

  <div id="catalog"></div>

  <!-- Hidden renderers for capturing -->
  <canvas id="mayflyCanvas" width="300" height="300" style="display:none;"></canvas>
  <canvas id="stinkyfishCanvas" width="300" height="300" style="display:none;"></canvas>

  <script type="module">
    import { SimpleRaymarcher } from './mayfly/raymarcher.js';
    import { loadJsonScene } from './core/json-loader.js';
    import { generateGlslFromJson } from './core/json-codegen.js';
    import { generateWgslFromJson } from './core/wgsl-codegen.js';
    import { StinkyfishRenderer } from './stinkyfish/raymarcher.js';

    // More interesting camera angles
    const CAMERA_ANGLES = [
      { name: 'Front', theta: 0.3, phi: 0.5 },
      { name: 'Side', theta: Math.PI/2, phi: 0.4 },
      { name: 'Above', theta: 0.5, phi: 0.15 },
      { name: 'Below', theta: -0.3, phi: 0.85 }
    ];

    let toc = null;
    let mayflyRenderer = null;
    let stinkyfishRenderer = null;
    let webgpuSupported = false;

    async function init() {
      // Check WebGPU support
      webgpuSupported = !!navigator.gpu;

      const resp = await fetch('./scenes/toc.json');
      toc = await resp.json();
      buildCatalogStructure();
    }

    function buildCatalogStructure() {
      const container = document.getElementById('catalog');
      container.innerHTML = '';

      // Categories to skip (complex/animated/physics scenes)
      const SKIP_CATEGORIES = ['recent', 'physics', 'anim', 'creatures', 'archive', 'nature', 'animation'];

      for (const category of toc.categories) {
        if (SKIP_CATEGORIES.includes(category.id)) continue;

        const catDiv = document.createElement('div');
        catDiv.className = 'category';
        catDiv.innerHTML = `<div class="category-title">${category.title}</div>`;

        for (const scene of category.scenes) {
          const sceneDiv = document.createElement('div');
          sceneDiv.className = 'scene';
          sceneDiv.dataset.path = scene.path;

          sceneDiv.innerHTML = `
            <div class="scene-header">
              <div class="scene-title">${scene.title}</div>
              <div class="scene-path">${scene.path}</div>
              <div class="scene-description">${scene.subtitle || ''}</div>
            </div>
            <div class="backends">
              <div class="backend">
                <div class="backend-title mayfly">Mayfly (WebGL)</div>
                <div class="views mayfly-views">
                  ${CAMERA_ANGLES.map((angle, i) => `
                    <div class="view" data-angle="${i}">
                      <div class="placeholder">...</div>
                      <span class="view-label">${angle.name}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
              <div class="backend">
                <div class="backend-title stinkyfish">Stinkyfish (WebGPU)</div>
                <div class="views stinkyfish-views">
                  ${CAMERA_ANGLES.map((angle, i) => `
                    <div class="view" data-angle="${i}">
                      <div class="placeholder ${webgpuSupported ? '' : 'na'}">${webgpuSupported ? '...' : 'N/A'}</div>
                      <span class="view-label">${angle.name}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          `;

          catDiv.appendChild(sceneDiv);
        }

        container.appendChild(catDiv);
      }
    }

    async function initMayfly() {
      if (mayflyRenderer) return;
      const canvas = document.getElementById('mayflyCanvas');
      mayflyRenderer = new SimpleRaymarcher(canvas);
      mayflyRenderer.setQuality('high');
    }

    async function initStinkyfish() {
      if (stinkyfishRenderer || !webgpuSupported) return;
      try {
        const canvas = document.getElementById('stinkyfishCanvas');
        stinkyfishRenderer = new StinkyfishRenderer(canvas);
        await stinkyfishRenderer.init();
        stinkyfishRenderer.setQuality('high');
      } catch (e) {
        console.warn('Stinkyfish init failed:', e);
        webgpuSupported = false;
      }
    }

    async function captureMayfly(scenePath) {
      await initMayfly();

      const resp = await fetch(`./scenes/${scenePath}`);
      const json = await resp.json();

      const scene = loadJsonScene(json);
      const glsl = generateGlslFromJson(scene, {});
      mayflyRenderer.updateScene(glsl, scene.params || {}, scene.rig || null, json);

      const camDist = json.camera?.distance || 6;
      const camTarget = json.camera?.target || [0, 0.5, 0];

      const images = [];
      for (const angle of CAMERA_ANGLES) {
        mayflyRenderer.cameraDistance = camDist;
        mayflyRenderer.cameraTarget = camTarget;
        mayflyRenderer.cameraTheta = angle.theta;
        mayflyRenderer.cameraPhi = angle.phi;
        mayflyRenderer.render();
        images.push(mayflyRenderer.canvas.toDataURL('image/png'));
      }
      return images;
    }

    async function captureStinkyfish(scenePath) {
      if (!webgpuSupported) return null;
      await initStinkyfish();
      if (!stinkyfishRenderer) return null;

      const resp = await fetch(`./scenes/${scenePath}`);
      const json = await resp.json();

      const scene = loadJsonScene(json);
      const wgsl = generateWgslFromJson(scene, {});

      // Build uniform layout
      const { getAllParamNames } = await import('./core/rig-evaluator.js');
      const allParams = getAllParamNames(scene.params || {}, scene.rig);
      const uniformLayout = {};
      for (const [name, paramInfo] of Object.entries(allParams)) {
        const type = paramInfo.type || 'scalar';
        uniformLayout[`u_${name}`] = (type === 'color3' || type === 'position3' || type === 'radii3' || type === 'direction3') ? 'vec3f' : 'f32';
      }

      await stinkyfishRenderer.compileScene(wgsl, Object.keys(uniformLayout).length > 0 ? uniformLayout : null);
      if (scene.params) stinkyfishRenderer.setSceneParams(scene.params);

      const camDist = json.camera?.distance || 6;
      const camTarget = json.camera?.target || [0, 0.5, 0];

      const images = [];
      for (const angle of CAMERA_ANGLES) {
        stinkyfishRenderer.cameraDistance = camDist;
        stinkyfishRenderer.cameraTarget = camTarget;
        stinkyfishRenderer.cameraTheta = angle.theta;
        stinkyfishRenderer.cameraPhi = angle.phi;
        stinkyfishRenderer.render(0);
        images.push(stinkyfishRenderer.canvas.toDataURL('image/png'));
      }
      return images;
    }

    function setViewImages(views, images, angles) {
      images.forEach((dataUrl, i) => {
        views[i].innerHTML = `
          <img src="${dataUrl}" alt="${angles[i].name} view">
          <span class="view-label">${angles[i].name}</span>
        `;
      });
    }

    function setViewError(views, msg) {
      views.forEach(v => {
        v.innerHTML = `<div class="placeholder error">${msg}</div>`;
      });
    }

    window.captureAllScenes = async function() {
      const btn = document.getElementById('captureBtn');
      const progress = document.getElementById('progress');
      btn.disabled = true;

      const scenes = document.querySelectorAll('.scene');
      let completed = 0;

      for (const sceneDiv of scenes) {
        const path = sceneDiv.dataset.path;
        progress.textContent = `Capturing ${completed + 1}/${scenes.length}: ${path}`;

        const mayflyViews = sceneDiv.querySelectorAll('.mayfly-views .view');
        const stinkyfishViews = sceneDiv.querySelectorAll('.stinkyfish-views .view');

        // Capture Mayfly
        try {
          const images = await Promise.race([
            captureMayfly(path),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 8000))
          ]);
          setViewImages(mayflyViews, images, CAMERA_ANGLES);
        } catch (e) {
          console.error(`Mayfly failed for ${path}:`, e);
          setViewError(mayflyViews, e.message);
        }

        // Capture Stinkyfish
        if (webgpuSupported) {
          try {
            const images = await Promise.race([
              captureStinkyfish(path),
              new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 8000))
            ]);
            if (images) {
              setViewImages(stinkyfishViews, images, CAMERA_ANGLES);
            } else {
              setViewError(stinkyfishViews, 'N/A');
            }
          } catch (e) {
            console.error(`Stinkyfish failed for ${path}:`, e);
            setViewError(stinkyfishViews, e.message);
          }
        }

        completed++;
      }

      progress.textContent = `Done! Captured ${completed} scenes. Click "Print / Save PDF" to export.`;
      btn.disabled = false;
    };

    init();
  </script>
</body>
</html>
