<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>iOS WebGPU SDF</title>
  <style>
    html,body{margin:0;padding:0;background:#000;overflow:hidden;}
    canvas{display:block;margin:auto;background:#000;}
    #msg{position:fixed;bottom:10px;left:0;right:0;text-align:center;
         color:#ccc;font-family:system-ui;}
  </style>
</head>
<body>
<canvas id="c" width="512" height="288"></canvas>
<div id="msg">WebGPU SDF running…</div>

<script type="module">
(async () => {
  const canvas = document.getElementById('c');
  const msg = document.getElementById('msg');

  if (!navigator.gpu) {
    msg.textContent = "WebGPU missing";
    return;
  }

  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const context = canvas.getContext("webgpu");
  const format = navigator.gpu.getPreferredCanvasFormat();
  context.configure({device, format});

  // Uniforms: time + aspect + padding
  const ubuf = device.createBuffer({
    size: 16,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
  });

  // iOS-safe WGSL: no mat3x3, no break loops
  const shader = device.createShaderModule({
    code: /* wgsl */`
struct U { time:f32; aspect:f32; pad0:f32; pad1:f32; };
@group(0) @binding(0) var<uniform> uni : U;

struct VS {
  @builtin(position) pos: vec4<f32>,
  @location(0) uv: vec2<f32>
};

@vertex
fn vs_main(@builtin(vertex_index) vid: u32) -> VS {
  var P = array<vec2<f32>,3>(
    vec2(-1.0,-3.0),
    vec2(-1.0, 1.0),
    vec2( 3.0, 1.0)
  );
  var UV = array<vec2<f32>,3>(
    vec2(0.0,0.0),
    vec2(0.0,1.0),
    vec2(1.0,1.0)
  );
  var o:VS;
  o.pos = vec4(P[vid],0,1);
  o.uv  = UV[vid];
  return o;
}

fn sdfScene(p: vec3<f32>) -> f32 {
  let dSphere = length(p - vec3<f32>(0.0,0.0,3.0)) - 0.7;
  let dPlane  = p.y + 0.8;
  return min(dSphere, dPlane);
}

fn estimateNormal(p: vec3<f32>) -> vec3<f32> {
  let e = 0.001;
  let dx = vec3<f32>(e,0,0);
  let dy = vec3<f32>(0,e,0);
  let dz = vec3<f32>(0,0,e);
  return normalize(vec3<f32>(
    sdfScene(p+dx)-sdfScene(p-dx),
    sdfScene(p+dy)-sdfScene(p-dy),
    sdfScene(p+dz)-sdfScene(p-dz)
  ));
}

@fragment
fn fs_main(in:VS) -> @location(0) vec4<f32> {
  let uv = in.uv * 2.0 - vec2(1.0,1.0);
  let asp = uni.aspect;

  let ro = vec3<f32>(0,0,-3);
  let rd0 = vec3<f32>(uv.x*asp, uv.y, 1.8);

  // iOS-safe rotation around Y
  let a = uni.time * 0.3;
  let ct = cos(a);
  let st = sin(a);
  let rd = normalize(vec3<f32>(
      rd0.x*ct + rd0.z*st,
      rd0.y,
     -rd0.x*st + rd0.z*ct
  ));

  var t = 0.0;
  var p = ro;

  // Fixed loop (no breaks) — iOS safe
  for (var i = 0; i < 80; i++) {
    p = ro + rd * t;
    let d = sdfScene(p);
    t = t + max(d, 0.001);
  }

  let n = estimateNormal(p);
  let light = normalize(vec3<f32>(0.4,0.7,-0.3));
  let diff = max(dot(n, light), 0.0);

  var col = vec3<f32>(0.02,0.03,0.06);
  if (t < 20.0) {
    let base = vec3<f32>(0.2,0.6,1.0);
    col = base*(0.2+0.8*diff);
  }

  return vec4<f32>(col,1);
}
`
  });

  const bindLayout = device.createBindGroupLayout({
    entries:[{binding:0, visibility:GPUShaderStage.FRAGMENT, buffer:{type:"uniform"}}]
  });

  const pipeline = device.createRenderPipeline({
    layout: device.createPipelineLayout({bindGroupLayouts:[bindLayout]}),
    vertex:{module:shader, entryPoint:"vs_main"},
    fragment:{module:shader, entryPoint:"fs_main", targets:[{format}]},
    primitive:{topology:"triangle-list"}
  });

  const bindGroup = device.createBindGroup({
    layout: bindLayout,
    entries:[{binding:0, resource:{buffer:ubuf}}]
  });

  let t0 = performance.now();
  function frame(){
    const t = (performance.now()-t0)/1000;
    const u = new Float32Array([t, canvas.width/canvas.height, 0,0]);
    device.queue.writeBuffer(ubuf,0,u);

    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments:[{
        view: context.getCurrentTexture().createView(),
        loadOp:"clear",
        clearValue:{r:0,g:0,b:0,a:1},
        storeOp:"store"
      }]
    });
    pass.setPipeline(pipeline);
    pass.setBindGroup(0,bindGroup);
    pass.draw(3);
    pass.end();

    device.queue.submit([encoder.finish()]);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
