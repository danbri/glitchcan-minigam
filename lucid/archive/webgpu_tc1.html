<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WebGPU SDF Raymarch (iOS-safe)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #ccc;
      font-family: system-ui, sans-serif;
      height: 100%;
      overflow: hidden;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 0.5rem;
    }
    canvas {
      border-radius: 8px;
      image-rendering: pixelated;
      background: #000;
    }
    #msg {
      font-size: 0.9rem;
      text-align: center;
      max-width: 480px;
    }
  </style>
</head>
<body>
<div id="container">
  <canvas id="gfx" width="512" height="288"></canvas>
  <div id="msg">Initializing WebGPU SDF raymarch…</div>
</div>

<script type="module">
(async () => {
  const msg = document.getElementById("msg");
  const canvas = document.getElementById("gfx");

  // --- Feature detect ---
  if (!("gpu" in navigator)) {
    msg.textContent = "WebGPU not available (navigator.gpu is missing).";
    return;
  }

  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) {
    msg.textContent = "No suitable GPU adapter found.";
    return;
  }

  const device = await adapter.requestDevice();
  const context = canvas.getContext("webgpu");

  if (!context) {
    msg.textContent = "Failed to get 'webgpu' canvas context.";
    return;
  }

  const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
  context.configure({
    device,
    format: canvasFormat,
    alphaMode: "premultiplied"
  });

  // Internal resolution kept modest for iOS.
  const internalWidth  = 512;
  const internalHeight = 288;
  canvas.width  = internalWidth;
  canvas.height = internalHeight;

  function resizeCanvasCSS() {
    const scale = Math.min(
      (window.innerWidth  * 0.95) / internalWidth,
      (window.innerHeight * 0.75) / internalHeight
    );
    canvas.style.width  = `${internalWidth  * scale}px`;
    canvas.style.height = `${internalHeight * scale}px`;
  }
  window.addEventListener("resize", resizeCanvasCSS);
  resizeCanvasCSS();

  // --- Uniform buffer: time + aspect (padded to 16 bytes) ---
  // struct Uniforms { time: f32; aspect: f32; pad0: f32; pad1: f32; }
  const uniformBufferSize = 16;
  const uniformBuffer = device.createBuffer({
    size: uniformBufferSize,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
  });

  // --- WGSL shaders: fullscreen triangle + fragment SDF raymarch ---
  const shaderModule = device.createShaderModule({
    code: /* wgsl */`
struct Uniforms {
  time   : f32;
  aspect : f32;
  pad0   : f32;
  pad1   : f32;
};

@group(0) @binding(0)
var<uniform> uni : Uniforms;

struct VSOut {
  @builtin(position) pos : vec4<f32>;
  @location(0) uv : vec2<f32>;
};

@vertex
fn vs_main(@builtin(vertex_index) vid : u32) -> VSOut {
  // Big triangle covering screen.
  var positions = array<vec2<f32>, 3>(
    vec2<f32>(-1.0, -3.0),
    vec2<f32>(-1.0,  1.0),
    vec2<f32>( 3.0,  1.0)
  );

  var uvs = array<vec2<f32>, 3>(
    vec2<f32>(0.0, 0.0),
    vec2<f32>(0.0, 1.0),
    vec2<f32>(1.0, 1.0)
  );

  var out : VSOut;
  out.pos = vec4<f32>(positions[vid], 0.0, 1.0);
  out.uv  = uvs[vid];
  return out;
}

// Signed distance to a sphere at (0,0,3).
fn sdfSphere(p: vec3<f32>) -> f32 {
  let c = vec3<f32>(0.0, 0.0, 3.0);
  let r = 0.7;
  return length(p - c) - r;
}

// Scene: sphere + ground plane.
fn mapScene(p: vec3<f32>) -> f32 {
  let plane = p.y + 0.8;        // plane y = -0.8
  let sphere = sdfSphere(p);
  return min(plane, sphere);
}

fn estimateNormal(p: vec3<f32>) -> vec3<f32> {
  let eps = 0.001;
  let ex = vec3<f32>(eps, 0.0, 0.0);
  let ey = vec3<f32>(0.0, eps, 0.0);
  let ez = vec3<f32>(0.0, 0.0, eps);
  let n = vec3<f32>(
    mapScene(p + ex) - mapScene(p - ex),
    mapScene(p + ey) - mapScene(p - ey),
    mapScene(p + ez) - mapScene(p - ez)
  );
  return normalize(n);
}

@fragment
fn fs_main(in: VSOut) -> @location(0) vec4<f32> {
  // Normalized device coordinates.
  let uv = in.uv * 2.0 - vec2<f32>(1.0, 1.0);
  let aspect = uni.aspect;

  // Camera.
  let ro = vec3<f32>(0.0, 0.0, -3.0);
  var rd = normalize(vec3<f32>(uv.x * aspect, uv.y, 1.8));

  // Slow rotation around Y.
  let t = uni.time * 0.3;
  let ct = cos(t);
  let st = sin(t);
  let rotY = mat3x3<f32>(
    vec3<f32>( ct, 0.0, st),
    vec3<f32>(0.0, 1.0, 0.0),
    vec3<f32>(-st, 0.0, ct)
  );
  rd = rotY * rd;

  // Raymarch.
  var dist = 0.0;
  var p = ro;
  var hit = false;
  let maxDist = 20.0;
  let eps = 0.001;

  for (var i: i32 = 0; i < 80; i = i + 1) {
    p = ro + rd * dist;
    let d = mapScene(p);
    if (d < eps) {
      hit = true;
      break;
    }
    dist = dist + d;
    if (dist > maxDist) {
      break;
    }
  }

  // Background gradient.
  var col = vec3<f32>(0.02, 0.03, 0.06) + 0.2 * vec3<f32>(0.0, max(rd.y, 0.0), 0.2);

  if (hit) {
    let n = estimateNormal(p);
    let lightDir = normalize(vec3<f32>(0.5, 0.7, -0.2));
    let diff = max(dot(n, lightDir), 0.0);

    let base = vec3<f32>(0.2, 0.6, 1.0);
    col = base * (0.2 + 0.8 * diff);

    // Fake AO-ish depth term.
    let ao = 1.0 / (1.0 + 0.1 * dist * dist);
    col = col * ao;

    // Simple rim light.
    let rim = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
    col += rim * vec3<f32>(0.8, 0.9, 1.0) * 0.25;
  }

  return vec4<f32>(col, 1.0);
}
    `
  });

  // --- Pipeline and bind group layout ---
  const uniformBindGroupLayout = device.createBindGroupLayout({
    entries: [
      {
        binding: 0,
        visibility: GPUShaderStage.FRAGMENT,
        buffer: { type: "uniform" }
      }
    ]
  });

  const pipelineLayout = device.createPipelineLayout({
    bindGroupLayouts: [uniformBindGroupLayout]
  });

  const pipeline = device.createRenderPipeline({
    layout: pipelineLayout,
    vertex: {
      module: shaderModule,
      entryPoint: "vs_main"
    },
    fragment: {
      module: shaderModule,
      entryPoint: "fs_main",
      targets: [{ format: canvasFormat }]
    },
    primitive: { topology: "triangle-list" }
  });

  const uniformBindGroup = device.createBindGroup({
    layout: uniformBindGroupLayout,
    entries: [
      {
        binding: 0,
        resource: { buffer: uniformBuffer }
      }
    ]
  });

  msg.textContent = "WebGPU SDF raymarch running.";

  let startTime = performance.now();

  function frame() {
    const now = performance.now();
    const t = (now - startTime) / 1000.0;
    const aspect = internalWidth / internalHeight;

    // Update uniforms.
    const data = new Float32Array(4);
    data[0] = t;
    data[1] = aspect;
    device.queue.writeBuffer(uniformBuffer, 0, data.buffer);

    const commandEncoder = device.createCommandEncoder();
    const texture = context.getCurrentTexture();
    const view = texture.createView();

    const pass = commandEncoder.beginRenderPass({
      colorAttachments: [{
        view,
        clearValue: { r: 0, g: 0, b: 0, a: 1 },
        loadOp: "clear",
        storeOp: "store"
      }]
    });

    pass.setPipeline(pipeline);
    pass.setBindGroup(0, uniformBindGroup);
    pass.draw(3, 1, 0, 0);
    pass.end();

    device.queue.submit([commandEncoder.finish()]);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
