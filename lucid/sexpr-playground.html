<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucid — S-expression playground</title>
<style>
  :root { color-scheme: dark; --bg:#0a0f16; --panel:#111925; --edge:#1e2c3d; --ink:#cfe3ff; --dim:#7c93ac; --acc:#39c0ff; --err:#ff6b6b; --ok:#54e39a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  header { padding:10px 14px; border-bottom:1px solid var(--edge); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
  header .sub { color:var(--dim); font-size:12px; }
  header .status { margin-left:auto; font-size:12px; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  main { display:grid; grid-template-columns: minmax(280px, 1fr) minmax(300px, 1.1fr); gap:1px; background:var(--edge); height:calc(100% - 46px); }
  @media (max-width:820px){ main{ grid-template-columns:1fr; grid-template-rows:auto auto; height:auto; } }
  .col { background:var(--bg); display:flex; flex-direction:column; min-height:0; }
  .col.left { min-height:0; }
  textarea { flex:0 0 44%; min-height:180px; background:var(--panel); color:var(--ink); border:0; border-bottom:1px solid var(--edge);
             padding:12px; resize:vertical; font:13px/1.5 ui-monospace, Menlo, monospace; tab-size:2; }
  .presets { display:flex; gap:6px; padding:8px 12px; flex-wrap:wrap; border-bottom:1px solid var(--edge); }
  .presets button { background:var(--panel); color:var(--ink); border:1px solid var(--edge); border-radius:6px; padding:5px 10px; cursor:pointer; font:12px ui-monospace,monospace; }
  .presets button:hover { border-color:var(--acc); color:var(--acc); }
  .out { flex:1 1 auto; overflow:auto; min-height:120px; }
  .out .tabs { display:flex; gap:2px; padding:8px 12px 0; }
  .out .tabs button { background:transparent; color:var(--dim); border:0; border-bottom:2px solid transparent; padding:4px 8px; cursor:pointer; font:12px ui-monospace,monospace; }
  .out .tabs button.active { color:var(--acc); border-bottom-color:var(--acc); }
  pre { margin:0; padding:12px; white-space:pre-wrap; word-break:break-word; color:var(--dim); font-size:12px; }
  .col.right { position:relative; }
  #canvas { width:100%; height:100%; display:block; background:#05080d; }
  @media (max-width:820px){ #canvas{ height:60vw; } }
  .err-line { color:var(--err); padding:10px 12px; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Lucid · S-expression playground</h1>
  <span class="sub">S-expr → IR → GLSL → Mayfly (WebGL), live</span>
  <span class="status" id="status">booting…</span>
</header>
<main>
  <div class="col left">
    <div class="presets" id="presets"></div>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="out">
      <div class="tabs">
        <button type="button" data-tab="ir" class="active">IR (JSON)</button>
        <button type="button" data-tab="glsl">generated GLSL</button>
      </div>
      <pre id="ir"></pre>
      <pre id="glsl" hidden></pre>
    </div>
  </div>
  <div class="col right">
    <canvas id="canvas"></canvas>
  </div>
</main>

<script type="module">
  import { readOne, formToNode } from './core/sexpr.js';
  import { loadJsonScene } from './core/json-loader.js';
  import { generateGlslFromJson } from './core/json-codegen.js';
  import { SimpleRaymarcher } from './mayfly/raymarcher.js';

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');

  const PRESETS = {
    'snowman': `; a classic — three stacked spheres, smooth-unioned
(smoothUnion :k 0.08
  (sphere :r 0.5)
  (translate [0 0.62 0] (sphere :r 0.38))
  (translate [0 1.12 0] (sphere :r 0.28)))`,
    'cut box': `; a red sphere kissing a blue box
(union
  (material [0.95 0.2 0.15] (sphere :r 0.55))
  (translate [0.9 0 0]
    (material [0.2 0.5 0.95] (box :size [0.45 0.45 0.45]))))`,
    'torus + spin': `; rotate is a transform wrapper; time drives it
(rotate [0 45 0]
  (material [0.9 0.75 0.2]
    (torus :major 0.6 :minor 0.22)))`,
    'lattice': `(smoothUnion :k 0.14
  (translate [-0.5 0 0] (sphere :r 0.3))
  (translate [ 0.5 0 0] (sphere :r 0.3))
  (translate [0 0.6 0] (box :size [0.9 0.12 0.12]))
  (translate [0 -0.6 0] (box :size [0.9 0.12 0.12])))`
  };

  // build preset buttons
  const pbar = $('presets');
  for (const name of Object.keys(PRESETS)) {
    const b = document.createElement('button'); b.type = 'button';
    b.textContent = name;
    b.onclick = () => { $('src').value = PRESETS[name]; run(); };
    pbar.appendChild(b);
  }

  // tab switching
  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      $('ir').hidden = tab !== 'ir';
      $('glsl').hidden = tab !== 'glsl';
    };
  });

  // boot renderer
  const canvas = $('canvas');
  let renderer;
  try {
    renderer = new SimpleRaymarcher(canvas);
  } catch (e) {
    statusEl.textContent = 'WebGL unavailable';
    statusEl.className = 'status err';
    throw e;
  }
  function fit() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    if (renderer.resize) renderer.resize(canvas.width, canvas.height);
  }
  window.addEventListener('resize', fit);

  let ok = false;
  function run() {
    const text = $('src').value.trim();
    try {
      const root = formToNode(readOne(text));
      const json = { name: 'playground', root };
      const scene = loadJsonScene(json);
      const glsl = generateGlslFromJson(scene, {});
      renderer.updateScene(glsl);
      $('ir').textContent = JSON.stringify(root, null, 1);
      $('glsl').textContent = glsl;
      statusEl.textContent = 'rendered ✓';
      statusEl.className = 'status ok';
      ok = true;
    } catch (e) {
      statusEl.textContent = 'error: ' + e.message;
      statusEl.className = 'status err';
      $('ir').innerHTML = '<span class="err-line">' + String(e.message) + '</span>';
      ok = false;
    }
    // expose for headless verification
    window.__playground = { ok, lastError: ok ? null : statusEl.textContent };
  }

  // debounced live re-render on edit
  let t;
  $('src').addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 250); });

  // render loop
  function loop() { if (renderer.render) renderer.render(); requestAnimationFrame(loop); }

  fit();
  $('src').value = PRESETS['snowman'];
  run();
  loop();
</script>
</body>
</html>
