<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucid — GPU physics on clipclop (WebGPU)</title>
<style>
  :root { color-scheme: dark; --bg:#0a0f16; --panel:#111925; --edge:#1e2c3d; --ink:#cfe3ff; --dim:#7c93ac; --acc:#39c0ff; --ok:#54e39a; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.5 ui-monospace, Menlo, monospace; }
  header { padding:10px 14px; border-bottom:1px solid var(--edge); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  header .status { margin-left:auto; font-size:12px; color:var(--ok); }
  header .status.err { color:var(--err); }
  main { display:flex; flex-direction:column; height:calc(100% - 46px); }
  iframe { width:100%; flex:1 1 auto; min-height:220px; border:0; display:block; background:#05080d; }
  .panel { border-top:1px solid var(--edge); padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--panel); }
  .panel button { background:#0b1420; color:var(--ink); border:1px solid var(--edge); border-radius:8px; padding:6px 13px; cursor:pointer; font:12px ui-monospace,monospace; }
  .panel button.go { border-color:var(--acc); color:var(--acc); }
  .panel .lbl { color:var(--dim); font-size:12px; }
  input[type=range] { accent-color:var(--acc); }
</style>
</head>
<body>
<header>
  <h1>Lucid · GPU physics</h1>
  <span class="sub">bodies settle (CPU twin), then bake into clipclop (WebGPU)</span>
  <span class="status" id="status">booting…</span>
</header>
<main>
  <iframe id="frame" title="clipclop engine"></iframe>
  <div class="panel">
    <button type="button" class="go" id="drop">drop &amp; bake ⟳</button>
    <span class="lbl">bodies</span>
    <input type="range" id="count" min="4" max="48" step="1" value="24">
    <span class="lbl" id="countval">24</span>
    <span class="lbl" id="info"></span>
  </div>
</main>

<script type="module">
  import { spliceEngine } from './clipclop/splice-lib.js';
  import { defaultPhysicsConfig, initBodies, stepPhysics } from './core/gpu-physics.js';

  const $ = (id) => document.getElementById(id);
  const cfg = defaultPhysicsConfig();
  const ballColor = (i) => [0.4 + 0.5 * ((i * 0.37) % 1), 0.55, 0.85];

  // Settle N bodies on the CPU, then bake the resting pile as a Lucid scene.
  function buildScene(n) {
    const bodies = initBodies(n, cfg);
    for (let s = 0; s < 500; s++) stepPhysics(bodies, cfg, 4);
    const children = bodies.map((b, i) => ({
      type: 'sphere', params: { r: cfg.radius, color: ballColor(i) },
      transform: { translate: b.p.slice() }
    }));
    // scale/place the pile where the clipclop camera looks (world is metres)
    return { name: 'physics', root: { type: 'transform', transform: { translate: [0, 2, 5], scale: 2.4 },
      child: { type: 'union', children } } };
  }

  let engineHtml = null;
  async function boot() {
    const n = parseInt($('count').value, 10);
    $('status').textContent = 'settling ' + n + ' bodies…'; $('status').className = 'status';
    try {
      if (!engineHtml) engineHtml = await fetch('./clipclop/index.html', { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error('cannot fetch clipclop engine (' + r.status + ')'); return r.text();
      });
      const { html, bridge } = spliceEngine(engineHtml, buildScene(n), { mode: 'codegen' });
      $('frame').src = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      $('info').textContent = n + ' bodies · clipclop bake';
      $('status').textContent = 'baked ✓ — engine in frame';
      window.__physics = { ok: true, edits: bridge.count, n };
    } catch (e) {
      $('status').textContent = 'error: ' + e.message; $('status').className = 'status err';
      window.__physics = { ok: false, error: e.message };
    }
  }

  $('drop').onclick = boot;
  $('count').addEventListener('input', () => { $('countval').textContent = $('count').value; });
  boot();
</script>
</body>
</html>
