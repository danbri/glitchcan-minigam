<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucid — GPU physics (step 1&2)</title>
<style>
  :root { color-scheme: dark; --bg:#0a0f16; --panel:#111925; --edge:#1e2c3d; --ink:#cfe3ff; --dim:#7c93ac; --acc:#39c0ff; --ok:#54e39a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.5 ui-monospace, Menlo, monospace; }
  header { padding:10px 14px; border-bottom:1px solid var(--edge); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  header .status { margin-left:auto; font-size:12px; color:var(--ok); }
  main { display:flex; flex-direction:column; height:calc(100% - 46px); }
  #canvas { width:100%; flex:1 1 auto; min-height:220px; display:block; background:#05080d; }
  .panel { border-top:1px solid var(--edge); padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--panel); }
  .panel button { background:#0b1420; color:var(--ink); border:1px solid var(--edge); border-radius:8px; padding:7px 14px; cursor:pointer; font:13px ui-monospace,monospace; }
  .panel button.go { border-color:var(--acc); color:var(--acc); }
  .panel .lbl { color:var(--dim); font-size:12px; }
  input[type=range] { accent-color:var(--acc); }
</style>
</head>
<body>
<header>
  <h1>Lucid · GPU physics</h1>
  <span class="sub">gravity + ground bounce · CPU twin of the WGSL compute shader</span>
  <span class="status" id="status">booting…</span>
</header>
<main>
  <canvas id="canvas"></canvas>
  <div class="panel">
    <button type="button" class="go" id="drop">drop again ⟳</button>
    <span class="lbl">bodies</span>
    <input type="range" id="count" min="4" max="48" step="1" value="24">
    <span class="lbl" id="countval">24</span>
    <span class="lbl" id="restlbl"></span>
  </div>
</main>

<script type="module">
  import { loadJsonScene } from './core/json-loader.js';
  import { generateGlslFromJson } from './core/json-codegen.js';
  import { SimpleRaymarcher } from './mayfly/raymarcher.js';
  import { defaultPhysicsConfig, initBodies, stepPhysics, spheresUniformScene, spheresToUniforms } from './core/gpu-physics.js';

  const $ = (id) => document.getElementById(id);
  const cfg = defaultPhysicsConfig();
  let bodies = [];

  const canvas = $('canvas');
  let renderer;
  try { renderer = new SimpleRaymarcher(canvas); }
  catch (e) { $('status').textContent = 'WebGL unavailable'; throw e; }
  renderer.cameraDistance = 8.5;
  renderer.cameraTheta = 0.7;
  renderer.cameraPhi = 0.25;
  if ('cameraTarget' in renderer) renderer.cameraTarget = [0, 0.8, 0];

  function fit() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    if (renderer.resize) renderer.resize(canvas.width, canvas.height);
  }
  window.addEventListener('resize', fit);

  if (renderer.setQuality) renderer.setQuality('high');
  const ballColor = (i) => [0.4 + 0.5 * ((i * 0.37) % 1), 0.55, 0.85];

  // Recompile the shader ONLY when the body COUNT changes; per frame we just
  // setParam positions (no per-frame recompile — that was the jank).
  let compiledN = -1;
  function ensureScene(n) {
    if (compiledN === n) return;
    const scene = spheresUniformScene(n);
    // static ground slab baked into the compiled structure
    scene.root.children.push({ type: 'box', params: { size: [cfg.bound, 0.05, cfg.bound], color: [0.18, 0.2, 0.24] }, transform: { translate: [0, cfg.groundY - 0.05, 0] } });
    renderer.updateScene(generateGlslFromJson(loadJsonScene(scene), {}));
    compiledN = n;
  }

  function drop() {
    bodies = initBodies(parseInt($('count').value, 10), cfg);
  }
  $('drop').onclick = drop;
  $('count').addEventListener('input', () => { $('countval').textContent = $('count').value; drop(); });

  // drag to orbit
  let dr = null;
  canvas.addEventListener('pointerdown', (e) => { dr = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('pointermove', (e) => {
    if (!dr) return;
    renderer.cameraTheta -= (e.clientX - dr.x) * 0.01;
    renderer.cameraPhi = Math.max(-0.3, Math.min(1.3, renderer.cameraPhi + (e.clientY - dr.y) * 0.01));
    dr = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointerup', () => { dr = null; });

  // simulate (CPU twin — the same math the WGSL compute shader runs) + render
  let frame = 0;
  function loop() {
    stepPhysics(bodies, cfg, 4);        // integrate + 4 separation iterations
    ensureScene(bodies.length);         // compiles only when count changes
    const u = spheresToUniforms(bodies, cfg.radius, ballColor);
    for (const k in u) renderer.setParam(k, u[k]);
    if (renderer.render) renderer.render();
    if ((frame++ % 20) === 0) {
      const maxV = Math.max(...bodies.map(b => Math.hypot(...b.v)));
      $('status').textContent = maxV < 0.1 ? 'at rest' : 'falling…';
      $('restlbl').textContent = `max speed ${maxV.toFixed(2)}`;
      window.__physics = { ok: true, n: bodies.length, maxV };
    }
    requestAnimationFrame(loop);
  }
  fit(); drop(); loop();
</script>
</body>
</html>
