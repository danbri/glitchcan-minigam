<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucid — GPU physics on clipclop (WebGPU)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#05080d; color:#cfe3ff; font:14px/1.5 ui-monospace, Menlo, monospace; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #boot b { color:#39c0ff; }
  #boot.err { color:#ff6b6b; }
</style>
</head>
<body>
<div id="boot">settling the bodies and booting clipclop (WebGPU)…</div>

<!--
  Boots the clipclop engine TOP-LEVEL (document.write), not in a blob iframe, so
  one WebGPU device inits in the page context (reliable; the iframe path booted
  black intermittently). N bodies settle on the CPU, then fold through the exact
  culled edit-list field on the engine's real bake path. Body count via ?n=.
-->
<script type="module">
  import { bootSplicedTopLevel } from './clipclop/splice-lib.js';
  import { defaultPhysicsConfig, initBodies, stepPhysics } from './core/gpu-physics.js';

  const boot = document.getElementById('boot');
  const params = new URLSearchParams(location.search);
  let n = parseInt(params.get('n'), 10);
  if (!Number.isFinite(n)) n = 24;
  n = Math.max(4, Math.min(64, n));

  const cfg = defaultPhysicsConfig();
  const ballColor = (i) => [0.4 + 0.5 * ((i * 0.37) % 1), 0.55, 0.85];

  // Settle N bodies on the CPU, then place the resting pile where the clipclop
  // camera looks (world is metres; the view frames roughly (0,3.6,5)).
  const bodies = initBodies(n, cfg);
  for (let s = 0; s < 500; s++) stepPhysics(bodies, cfg, 4);
  const children = bodies.map((b, i) => ({
    type: 'sphere', params: { r: cfg.radius, color: ballColor(i) },
    transform: { translate: b.p.slice() }
  }));
  const scene = { name: 'physics', root: { type: 'transform', transform: { translate: [0, 2, 5], scale: 2.4 },
    child: { type: 'union', children } } };

  const links = [12, 24, 48].map((c) => ({ label: String(c), href: `?n=${c}`, on: c === n }));

  try {
    const engineHtml = await fetch('./clipclop/index.html', { cache: 'no-store' }).then((r) => {
      if (!r.ok) throw new Error('cannot fetch clipclop engine (' + r.status + ')');
      return r.text();
    });
    bootSplicedTopLevel(engineHtml, scene, { mode: 'editlist', title: `physics · ${n}`, links });
  } catch (e) {
    boot.className = 'err';
    boot.textContent = 'error: ' + e.message;
  }
</script>
</body>
</html>
