<!DOCTYPE html>
<!--
  Lucid SDF-CSG Test Viewer (Lightweight Entry Point)

  Loads scenes from scenes/toc.json - no embedded demos.
  Used for testing scene files and development.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lucid Test Viewer</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #22d3ee;
      --accent-alt: #f472b6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header with scene selector */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 0.9rem;
      color: var(--accent);
      white-space: nowrap;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    select:focus { outline: 1px solid var(--accent); }
    button {
      background: var(--panel-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    button:hover { background: var(--border); }
    button.primary { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Main canvas area */
    main {
      flex: 1;
      position: relative;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* Info panel */
    .info {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      max-width: 300px;
    }
    .info h2 { color: var(--accent); font-size: 0.85rem; margin-bottom: 0.25rem; }
    .info p { color: var(--text-dim); font-size: 0.7rem; }
    .info .notes { margin-top: 0.5rem; font-style: italic; border-top: 1px solid var(--border); padding-top: 0.5rem; }

    /* Animation controls */
    .anim-controls {
      position: absolute;
      bottom: 0.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .anim-btn {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      padding: 0;
    }
    .time-display {
      font-family: monospace;
      font-size: 0.75rem;
      min-width: 4rem;
      text-align: center;
    }

    /* Status toast */
    .status {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
    }
    .status.visible { transform: translateY(0); opacity: 1; }
    .status.error { border-color: #f85149; color: #f85149; }
    .status.success { border-color: #3fb950; color: #3fb950; }
  </style>
</head>
<body>
  <header>
    <h1>Lucid Test Viewer</h1>
    <div class="controls">
      <select id="category-select">
        <option value="">-- Category --</option>
      </select>
      <select id="scene-select">
        <option value="">-- Scene --</option>
      </select>
      <button id="btn-reload">Reload</button>
      <button id="btn-editor">Editor</button>
    </div>
  </header>

  <main>
    <canvas id="canvas"></canvas>
    <div class="info" id="info" style="display: none;">
      <h2 id="info-title">Scene Title</h2>
      <p id="info-subtitle">Subtitle</p>
      <p class="notes" id="info-notes" style="display: none;"></p>
    </div>
    <div class="anim-controls">
      <button class="anim-btn" id="btn-prev" title="Step back">&#x23EA;</button>
      <button class="anim-btn" id="btn-play" title="Play/Pause">&#x23F5;</button>
      <button class="anim-btn" id="btn-next" title="Step forward">&#x23E9;</button>
      <span class="time-display" id="time-display">0.00s</span>
    </div>
  </main>

  <div class="status" id="status"></div>

  <script type="module">
    import { SimpleRaymarcher } from './ui/raymarcher.js';
    import { loadJsonScene } from './core/json-loader.js';
    import { generateGlslFromJson } from './core/json-codegen.js';

    // ============================================
    // STATE
    // ============================================
    let toc = null;
    let currentScene = null;
    let raymarcher = null;
    let animationId = null;
    let time = 0;
    let playing = true;
    let lastFrameTime = 0;

    // ============================================
    // DOM ELEMENTS
    // ============================================
    const $ = id => document.getElementById(id);
    const canvas = $('canvas');
    const categorySelect = $('category-select');
    const sceneSelect = $('scene-select');
    const infoPanel = $('info');
    const infoTitle = $('info-title');
    const infoSubtitle = $('info-subtitle');
    const infoNotes = $('info-notes');
    const timeDisplay = $('time-display');
    const statusEl = $('status');

    // ============================================
    // STATUS MESSAGES
    // ============================================
    function showStatus(msg, type = 'info') {
      statusEl.textContent = msg;
      statusEl.className = 'status visible ' + type;
      setTimeout(() => statusEl.classList.remove('visible'), 3000);
    }

    // ============================================
    // TOC LOADING
    // ============================================
    async function loadToc() {
      try {
        const resp = await fetch('scenes/toc.json');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        toc = await resp.json();
        populateCategories();
        showStatus('TOC loaded: ' + toc.categories.length + ' categories', 'success');
      } catch (e) {
        console.error('Failed to load TOC:', e);
        showStatus('Failed to load scenes/toc.json', 'error');
      }
    }

    function populateCategories() {
      categorySelect.innerHTML = '<option value="">-- Category --</option>';
      for (const cat of toc.categories) {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = `${cat.title} (${cat.scenes.length})`;
        categorySelect.appendChild(opt);
      }
    }

    function populateScenes(categoryId) {
      sceneSelect.innerHTML = '<option value="">-- Scene --</option>';
      const cat = toc.categories.find(c => c.id === categoryId);
      if (!cat) return;

      for (const scene of cat.scenes) {
        const opt = document.createElement('option');
        opt.value = scene.path;
        opt.textContent = scene.title;
        sceneSelect.appendChild(opt);
      }
    }

    // ============================================
    // SCENE LOADING
    // ============================================
    async function loadScene(path) {
      try {
        showStatus('Loading ' + path + '...', 'info');
        const resp = await fetch('scenes/' + path);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        currentScene = await resp.json();

        // Update info panel
        infoTitle.textContent = currentScene.title || 'Untitled';
        infoSubtitle.textContent = currentScene.subtitle || '';
        if (currentScene.notes) {
          infoNotes.textContent = currentScene.notes;
          infoNotes.style.display = 'block';
        } else {
          infoNotes.style.display = 'none';
        }
        infoPanel.style.display = 'block';

        // Compile and render
        compileAndRender();
        showStatus('Loaded: ' + currentScene.title, 'success');
      } catch (e) {
        console.error('Failed to load scene:', e);
        showStatus('Failed to load scene: ' + e.message, 'error');
      }
    }

    // ============================================
    // RENDERING
    // ============================================
    function compileAndRender() {
      if (!currentScene || !currentScene.root) {
        console.error('No scene to render');
        return;
      }

      try {
        // Parse and generate GLSL
        const sceneData = loadJsonScene(currentScene);
        const glsl = generateGlslFromJson(sceneData);

        // Apply camera from scene if present
        if (currentScene.camera) {
          const cam = currentScene.camera;
          if (raymarcher) {
            if (cam.distance !== undefined) raymarcher.cameraDistance = cam.distance;
            if (cam.phi !== undefined) raymarcher.cameraPhi = cam.phi;
            if (cam.theta !== undefined) raymarcher.cameraTheta = cam.theta;
          }
        }

        // Update shader
        if (raymarcher) {
          raymarcher.updateSceneShader(glsl);
        }

        // Reset time
        time = 0;

      } catch (e) {
        console.error('Compilation error:', e);
        showStatus('Compile error: ' + e.message, 'error');
      }
    }

    // ============================================
    // ANIMATION LOOP
    // ============================================
    function animate(timestamp) {
      animationId = requestAnimationFrame(animate);

      if (playing) {
        const delta = lastFrameTime ? (timestamp - lastFrameTime) / 1000 : 0;
        time += delta;
      }
      lastFrameTime = timestamp;

      timeDisplay.textContent = time.toFixed(2) + 's';

      if (raymarcher) {
        raymarcher.render(time);
      }
    }

    // ============================================
    // EVENT HANDLERS
    // ============================================
    categorySelect.addEventListener('change', () => {
      populateScenes(categorySelect.value);
    });

    sceneSelect.addEventListener('change', () => {
      if (sceneSelect.value) {
        loadScene(sceneSelect.value);
      }
    });

    $('btn-reload').addEventListener('click', () => {
      if (sceneSelect.value) {
        loadScene(sceneSelect.value);
      }
    });

    $('btn-editor').addEventListener('click', () => {
      // Open main editor with current scene
      const path = sceneSelect.value;
      if (path) {
        window.open('index.html?scene=' + encodeURIComponent('scenes/' + path), '_blank');
      } else {
        window.open('index.html', '_blank');
      }
    });

    $('btn-play').addEventListener('click', () => {
      playing = !playing;
      $('btn-play').innerHTML = playing ? '&#x23F8;' : '&#x23F5;';
    });

    $('btn-prev').addEventListener('click', () => {
      time = Math.max(0, time - 0.5);
    });

    $('btn-next').addEventListener('click', () => {
      time += 0.5;
    });

    // Camera controls (mouse drag to rotate)
    let isDragging = false;
    let lastX = 0, lastY = 0;

    canvas.addEventListener('mousedown', e => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging || !raymarcher) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      raymarcher.cameraTheta -= dx * 0.01;
      raymarcher.cameraPhi = Math.max(-1.5, Math.min(1.5, raymarcher.cameraPhi - dy * 0.01));
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      if (raymarcher) {
        raymarcher.cameraDistance = Math.max(1, Math.min(20, raymarcher.cameraDistance + e.deltaY * 0.01));
      }
    }, { passive: false });

    // Touch controls
    let lastTouchDist = 0;
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        isDragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        lastTouchDist = Math.sqrt(dx * dx + dy * dy);
      }
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length === 1 && isDragging && raymarcher) {
        const dx = e.touches[0].clientX - lastX;
        const dy = e.touches[0].clientY - lastY;
        raymarcher.cameraTheta -= dx * 0.01;
        raymarcher.cameraPhi = Math.max(-1.5, Math.min(1.5, raymarcher.cameraPhi - dy * 0.01));
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      } else if (e.touches.length === 2 && raymarcher) {
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const delta = lastTouchDist - dist;
        raymarcher.cameraDistance = Math.max(1, Math.min(20, raymarcher.cameraDistance + delta * 0.02));
        lastTouchDist = dist;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      isDragging = false;
    });

    // ============================================
    // INITIALIZATION
    // ============================================
    async function init() {
      // Initialize raymarcher
      raymarcher = new SimpleRaymarcher(canvas);
      await raymarcher.init();

      // Load TOC
      await loadToc();

      // Check URL params for initial scene
      const params = new URLSearchParams(window.location.search);
      const scenePath = params.get('scene');
      if (scenePath) {
        // Find category and scene
        for (const cat of toc.categories) {
          const scene = cat.scenes.find(s => s.path === scenePath);
          if (scene) {
            categorySelect.value = cat.id;
            populateScenes(cat.id);
            sceneSelect.value = scenePath;
            loadScene(scenePath);
            break;
          }
        }
      } else {
        // Load first scene by default
        if (toc.categories.length > 0 && toc.categories[0].scenes.length > 0) {
          const firstCat = toc.categories[0];
          const firstScene = firstCat.scenes[0];
          categorySelect.value = firstCat.id;
          populateScenes(firstCat.id);
          sceneSelect.value = firstScene.path;
          loadScene(firstScene.path);
        }
      }

      // Start animation loop
      animate(0);
    }

    init();
  </script>
</body>
</html>
