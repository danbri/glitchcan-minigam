<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Stinkyfish WebGPU Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 0.75rem 1rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
      display: flex;
      gap: 0.75rem;
      align-items: center;
      pointer-events: none;
    }
    header > * { pointer-events: auto; }
    h1 {
      font-size: 1rem;
      font-weight: 500;
      color: #888;
    }
    button {
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      border: 1px solid #333;
      background: rgba(30,30,40,0.9);
      color: #ccc;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover {
      background: rgba(50,50,60,0.9);
      border-color: #555;
    }
    #status {
      margin-left: auto;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      background: rgba(30,30,40,0.9);
      font-size: 0.85rem;
      color: #888;
    }
    #status.error { background: rgba(100,30,30,0.9); color: #faa; }
    #status.ok { background: rgba(30,80,40,0.9); color: #afa; }

    #canvasContainer {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #pickerOverlay {
      display: none;
      position: absolute;
      top: 60px;
      left: 1rem;
      right: 1rem;
      max-width: 400px;
      z-index: 200;
    }
    #pickerOverlay.show { display: block; }

    #fallback {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 2rem;
      text-align: center;
      background: rgba(20,20,30,0.95);
      border-radius: 8px;
      border: 1px solid #333;
    }
    #fallback.show { display: block; }
    #fallback h2 { margin-bottom: 1rem; color: #f55; }

    #sceneTitle {
      font-size: 0.85rem;
      color: #aaa;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #renderControlsOverlay {
      display: none;
      position: absolute;
      top: 60px;
      right: 1rem;
      z-index: 200;
    }
    #renderControlsOverlay.show { display: block; }

    #sceneParamsOverlay {
      display: none;
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
    }
    #sceneParamsOverlay.show { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Stinkyfish</h1>
      <button id="browseBtn">📦 Browse</button>
      <button id="animBtn">🎬</button>
      <button id="settingsBtn">⚙️</button>
      <span id="sceneTitle">Sphere</span>
      <div id="status">Loading...</div>
    </header>
    <div id="canvasContainer">
      <canvas id="canvas"></canvas>
      <div id="pickerOverlay">
        <lucid-scene-picker base-url="../scenes/"></lucid-scene-picker>
      </div>
      <div id="renderControlsOverlay">
        <lucid-render-controls></lucid-render-controls>
      </div>
      <div id="sceneParamsOverlay">
        <lucid-scene-params></lucid-scene-params>
      </div>
      <div id="fallback">
        <h2>WebGPU Not Available</h2>
        <p>Your browser doesn't support WebGPU.<br>Try Chrome 113+, Edge 113+, or Safari 18+.</p>
      </div>
    </div>
  </div>

  <script type="module">
    import '../components/scene-picker.js';
    import '../components/render-controls.js';
    import '../components/scene-params.js';
    import { StinkyfishRenderer } from './raymarcher.js';
    import { loadJsonScene } from '../core/json-loader.js';
    import { generateWgslFromJson } from '../core/wgsl-codegen.js';
    import { PhysicsBridge } from '../core/physics/physics-bridge.js';

    const canvas = document.getElementById('canvas');
    const container = document.getElementById('canvasContainer');
    const status = document.getElementById('status');
    const sceneTitle = document.getElementById('sceneTitle');
    const browseBtn = document.getElementById('browseBtn');
    const animBtn = document.getElementById('animBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const pickerOverlay = document.getElementById('pickerOverlay');
    const renderControlsOverlay = document.getElementById('renderControlsOverlay');
    const sceneParamsOverlay = document.getElementById('sceneParamsOverlay');
    const picker = document.querySelector('lucid-scene-picker');
    const renderControls = document.querySelector('lucid-render-controls');
    const sceneParams = document.querySelector('lucid-scene-params');
    const fallback = document.getElementById('fallback');

    // Animation time state
    let animationTime = 0;
    let lastFrameTime = 0;
    let timeScale = 1.0;
    let isPaused = false;

    // Resolution scaling - lower on mobile for performance
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                     (window.innerWidth < 768);
    const dpr = isMobile ? 1 : Math.min(window.devicePixelRatio || 1, 2);

    let renderer = null;
    let physicsBridge = null;

    function closeAllOverlays() {
      pickerOverlay.classList.remove('show');
      renderControlsOverlay.classList.remove('show');
      sceneParamsOverlay.classList.remove('show');
    }

    // Toggle picker
    browseBtn.addEventListener('click', () => {
      closeAllOverlays();
      pickerOverlay.classList.toggle('show');
    });

    // Toggle animation controls
    animBtn.addEventListener('click', () => {
      closeAllOverlays();
      sceneParamsOverlay.classList.toggle('show');
    });

    // Toggle render settings
    settingsBtn.addEventListener('click', () => {
      closeAllOverlays();
      renderControlsOverlay.classList.toggle('show');
    });

    // Handle render settings change
    renderControls.addEventListener('settings-change', (e) => {
      if (renderer) {
        renderer.setRenderSettings(e.detail);
      }
    });

    // Handle time control changes
    sceneParams.addEventListener('time-control', (e) => {
      isPaused = e.detail.paused;
      timeScale = e.detail.scale;
      if (e.detail.reset) {
        animationTime = 0;
        lastFrameTime = performance.now();
      }
    });

    // Handle scene param changes - update renderer uniforms
    sceneParams.addEventListener('param-change', (e) => {
      console.log('Param changed:', e.detail.name, '=', e.detail.value);
      if (renderer) {
        renderer.setSceneParam(e.detail.name, e.detail.value);
      }
    });

    // Handle scene selection from picker
    picker.addEventListener('scene-select', async (e) => {
      closeAllOverlays();
      await loadSceneFromPath(e.detail.path, e.detail.title);
    });

    // Close overlays when clicking canvas
    canvas.addEventListener('click', () => {
      closeAllOverlays();
    });

    async function loadSceneFromPath(path, title) {
      status.textContent = `Loading...`;
      status.className = '';
      sceneTitle.textContent = title || path;

      try {
        const response = await fetch(`../scenes/${path}`);
        if (!response.ok) throw new Error(`Failed to load ${path}`);
        const json = await response.json();
        const scene = loadJsonScene(json);

        // Use scene's camera settings or defaults
        const cam = json.camera || { distance: 8, target: [0, 0.5, 0], theta: 0.3, phi: 1.0 };
        renderer.setCamera(cam.distance, cam.target, cam.theta || 0.3, cam.phi || 1.0);

        // Update scene params component and renderer
        sceneParams.setSceneParams(json.params || {});
        renderer.setSceneParams(json.params || {});

        // Reset animation time for new scene
        animationTime = 0;
        lastFrameTime = performance.now();

        // Initialize physics if enabled
        physicsBridge = new PhysicsBridge(json); // Pre-parse initial positions
        if (json.physics?.enabled) {
          await physicsBridge.init(json);
          console.log(`Physics initialized: ${physicsBridge.isGPU() ? 'WebGPU' : 'CPU'} mode`);
        }

        // Generate WGSL and extract uniform layout
        const wgsl = generateWgslFromJson(scene, { inlineDefaults: false });
        console.log(`Generated ${wgsl.length} chars of WGSL for ${path}`);

        // Extract scene uniform layout from WGSL
        const uniformLayout = extractUniformLayout(wgsl);
        console.log('Scene uniform layout:', uniformLayout);

        // Compile with uniform layout
        await renderer.compileScene(wgsl, uniformLayout);

        // Initial render with physics defaults
        const sceneParamValues = physicsBridge?.getParamValues() || {};
        renderer.render(0, sceneParamValues);

        status.textContent = title || path.split('/').pop();
        status.className = 'ok';
      } catch (err) {
        console.error(err);
        status.textContent = `Error: ${err.message}`;
        status.className = 'error';
      }
    }

    /**
     * Extract uniform layout from generated WGSL
     * Returns { u_phys_ball: 'vec3f', u_customParam: 'f32', ... }
     */
    function extractUniformLayout(wgsl) {
      const layout = {};
      const structMatch = wgsl.match(/struct SceneUniforms \{([^}]+)\}/);
      if (!structMatch) return layout;

      const structBody = structMatch[1];
      const lines = structBody.split('\n');
      for (const line of lines) {
        const match = line.match(/^\s*(\w+):\s*(\w+),?\s*$/);
        if (match) {
          layout[match[1]] = match[2]; // e.g. u_phys_ball: vec3f
        }
      }
      return layout;
    }

    async function init() {
      if (!navigator.gpu) {
        fallback.classList.add('show');
        status.textContent = 'WebGPU not supported';
        status.className = 'error';
        return;
      }

      // Size canvas
      const resize = () => {
        const rect = container.getBoundingClientRect();
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        if (renderer?.pipeline) renderer.render();
      };
      window.addEventListener('resize', resize);
      requestAnimationFrame(resize);

      try {
        renderer = new StinkyfishRenderer(canvas);
        await renderer.init();

        // Load a simple default scene
        await loadSceneFromPath('prim/catalogue.json', 'Shape Catalogue');

        // Custom render loop with time control
        lastFrameTime = performance.now();
        startCustomRenderLoop();

      } catch (err) {
        console.error(err);
        status.textContent = `Init error: ${err.message}`;
        status.className = 'error';
      }
    }

    function startCustomRenderLoop() {
      let isVisible = true;
      let animationId = null;

      // Pause when tab is hidden
      document.addEventListener('visibilitychange', () => {
        isVisible = document.visibilityState === 'visible';
        if (isVisible && !animationId) {
          lastFrameTime = performance.now();
          animationId = requestAnimationFrame(loop);
        }
      });

      // Pause when scrolled off-screen
      const observer = new IntersectionObserver((entries) => {
        isVisible = entries[0].isIntersecting;
        if (isVisible && !animationId) {
          lastFrameTime = performance.now();
          animationId = requestAnimationFrame(loop);
        }
      }, { threshold: 0.1 });
      observer.observe(canvas);

      async function loop(frameTime) {
        if (!isVisible) {
          animationId = null;
          return;
        }

        // Update animation time based on pause state and time scale
        let deltaTime = 0;
        if (!isPaused) {
          deltaTime = (frameTime - lastFrameTime) / 1000;
          animationTime += deltaTime * timeScale;
        }
        lastFrameTime = frameTime;

        // Step physics if enabled
        if (physicsBridge?.enabled && !isPaused && deltaTime > 0) {
          await physicsBridge.step(Math.min(deltaTime, 1/30)); // Cap dt to avoid instability
        }

        // Get physics param values
        const sceneParamValues = physicsBridge?.getParamValues() || {};

        // Render with controlled time and physics params
        if (renderer?.pipeline) {
          renderer.render(animationTime, sceneParamValues);
        }

        animationId = requestAnimationFrame(loop);
      }

      animationId = requestAnimationFrame(loop);
    }

    init();
  </script>
</body>
</html>
