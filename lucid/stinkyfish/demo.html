<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Stinkyfish WebGPU Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 0.75rem 1rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
      display: flex;
      gap: 0.75rem;
      align-items: center;
      pointer-events: none;
    }
    header > * { pointer-events: auto; }
    h1 {
      font-size: 1rem;
      font-weight: 500;
      color: #888;
    }
    select, button {
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      border: 1px solid #333;
      background: rgba(30,30,40,0.9);
      color: #ccc;
      cursor: pointer;
      font-size: 0.9rem;
    }
    select:hover, button:hover {
      background: rgba(50,50,60,0.9);
      border-color: #555;
    }
    #status {
      margin-left: auto;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      background: rgba(30,30,40,0.9);
      font-size: 0.85rem;
      color: #888;
    }
    #status.error { background: rgba(100,30,30,0.9); color: #faa; }
    #status.ok { background: rgba(30,80,40,0.9); color: #afa; }

    #canvasContainer {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #fallback {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 2rem;
      text-align: center;
      background: rgba(20,20,30,0.95);
      border-radius: 8px;
      border: 1px solid #333;
    }
    #fallback.show { display: block; }
    #fallback h2 { margin-bottom: 1rem; color: #f55; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Stinkyfish</h1>
      <select id="sceneSelect">
        <option value="sphere" selected>Sphere</option>
        <option value="csg">CSG</option>
        <option value="smoothblob">Smooth Blob</option>
        <option value="wolf">Wolf</option>
        <option value="wolf-simple">Wolf (Simple)</option>
      </select>
      <button id="recompile">↻</button>
      <div id="status">Loading...</div>
    </header>
    <div id="canvasContainer">
      <canvas id="canvas"></canvas>
      <div id="fallback">
        <h2>WebGPU Not Available</h2>
        <p>Your browser doesn't support WebGPU.<br>Try Chrome 113+, Edge 113+, or Safari 18+.</p>
      </div>
    </div>
  </div>

  <script type="module">
    // Global error handler
    window.onerror = (msg, src, line, col, err) => {
      console.error('Global error:', msg, src, line, col, err);
      const status = document.getElementById('status');
      if (status) {
        status.textContent = `Error: ${msg}`;
        status.className = 'error';
      }
    };
    window.addEventListener('unhandledrejection', (e) => {
      console.error('Unhandled rejection:', e.reason);
      const status = document.getElementById('status');
      if (status) {
        status.textContent = `Error: ${e.reason?.message || e.reason}`;
        status.className = 'error';
      }
    });

    import { StinkyfishRenderer } from './raymarcher.js';
    import { loadJsonScene } from '../core/json-loader.js';
    import { generateWgslFromJson } from '../core/wgsl-codegen.js';

    const canvas = document.getElementById('canvas');
    const container = document.getElementById('canvasContainer');
    const status = document.getElementById('status');
    const sceneSelect = document.getElementById('sceneSelect');
    const recompileBtn = document.getElementById('recompile');
    const fallback = document.getElementById('fallback');

    // High-DPI canvas sizing
    const dpr = Math.min(window.devicePixelRatio || 1, 2); // Cap at 2x for performance

    let renderer = null;

    // Built-in simple scenes for testing (raw JSON format)
    const builtinScenes = {
      sphere: {
        root: {
          type: 'sphere',
          params: { r: 1.0, color: [0.8, 0.2, 0.2] }
        }
      },
      csg: {
        root: {
          type: 'subtract',
          children: [
            { type: 'sphere', params: { r: 1.0, color: [0.2, 0.6, 0.9] } },
            { type: 'box', params: { size: [0.6, 1.5, 0.6], color: [1, 0, 0] } },
            { type: 'box', params: { size: [1.5, 0.6, 0.6], color: [0, 1, 0] } }
          ]
        }
      },
      smoothblob: {
        root: {
          type: 'smoothUnion',
          k: 0.3,
          children: [
            { type: 'sphere', params: { r: 0.8, color: [0.9, 0.3, 0.1] } },
            { type: 'sphere', params: { r: 0.6, color: [0.1, 0.8, 0.3] }, transform: { translate: [1, 0.3, 0] } },
            { type: 'sphere', params: { r: 0.5, color: [0.2, 0.4, 0.9] }, transform: { translate: [-0.8, 0.5, 0.5] } }
          ]
        }
      },
      // Simplified wolf-like quadruped for testing (no displacement)
      'wolf-simple': {
        camera: { distance: 8, target: [0, 0.5, 0] },
        root: {
          type: 'smoothUnion',
          k: 0.25,
          children: [
            // Body
            { type: 'ellipsoid', params: { r: [1.5, 0.6, 0.7], color: [0.5, 0.4, 0.35] } },
            // Neck
            { type: 'ellipsoid', params: { r: [0.35, 0.45, 0.35], color: [0.5, 0.4, 0.35] }, transform: { translate: [1.2, 0.3, 0] } },
            // Head
            { type: 'ellipsoid', params: { r: [0.4, 0.35, 0.35], color: [0.55, 0.45, 0.4] }, transform: { translate: [1.8, 0.4, 0] } },
            // Snout
            { type: 'ellipsoid', params: { r: [0.35, 0.18, 0.18], color: [0.55, 0.45, 0.4] }, transform: { translate: [2.3, 0.25, 0] } },
            // Front legs
            { type: 'ellipsoid', params: { r: [0.12, 0.5, 0.1], color: [0.5, 0.4, 0.35] }, transform: { translate: [0.8, -0.3, 0.35] } },
            { type: 'ellipsoid', params: { r: [0.12, 0.5, 0.1], color: [0.5, 0.4, 0.35] }, transform: { translate: [0.8, -0.3, -0.35] } },
            // Back legs
            { type: 'ellipsoid', params: { r: [0.15, 0.5, 0.12], color: [0.5, 0.4, 0.35] }, transform: { translate: [-1.0, -0.3, 0.35] } },
            { type: 'ellipsoid', params: { r: [0.15, 0.5, 0.12], color: [0.5, 0.4, 0.35] }, transform: { translate: [-1.0, -0.3, -0.35] } },
            // Tail
            { type: 'ellipsoid', params: { r: [0.6, 0.12, 0.12], color: [0.5, 0.4, 0.35] }, transform: { translate: [-2.0, 0.2, 0], rotateZ: -0.3 } }
          ]
        }
      }
    };

    async function loadScene(name) {
      status.textContent = `Loading ${name}...`;
      status.className = '';

      try {
        let scene;
        let json = null;

        if (builtinScenes[name]) {
          json = builtinScenes[name];
          scene = loadJsonScene(json);
        } else {
          // Load from file
          const response = await fetch(`../scenes/creatures/${name}.json`);
          if (!response.ok) throw new Error(`Failed to load ${name}.json`);
          json = await response.json();
          scene = loadJsonScene(json);
        }

        // Set camera based on scene or use scene's camera settings
        let cam;
        if (json.camera) {
          cam = json.camera;
        } else {
          const cameraPresets = {
            sphere: { distance: 5, target: [0, 0, 0], theta: 0.3, phi: 0.4 },
            csg: { distance: 5, target: [0, 0, 0], theta: 0.3, phi: 0.4 },
            smoothblob: { distance: 6, target: [0, 0.2, 0], theta: 0.3, phi: 0.4 },
            wolf: { distance: 12, target: [0, 0.65, 0], theta: 0.25, phi: 0.3 },
          };
          cam = cameraPresets[name] || { distance: 8, target: [0, 0.5, 0], theta: 0.3, phi: 0.4 };
        }
        renderer.setCamera(cam.distance, cam.target, cam.theta || 0.3, cam.phi || 0.4);

        // Generate WGSL (inlineDefaults to avoid needing scene uniform buffer)
        const wgsl = generateWgslFromJson(scene, { inlineDefaults: true });
        console.log(`Generated ${wgsl.length} chars of WGSL for ${name}`);

        // Compile
        console.log('Compiling shader...');
        await renderer.compileScene(wgsl);
        console.log('Shader compiled, rendering...');
        renderer.render();
        console.log('Render complete');

        status.textContent = `${name} loaded`;
        status.className = 'ok';
      } catch (err) {
        console.error(err);
        status.textContent = `Error: ${err.message}`;
        status.className = 'error';
      }
    }

    async function init() {
      if (!navigator.gpu) {
        fallback.classList.add('show');
        status.textContent = 'WebGPU not supported';
        status.className = 'error';
        return;
      }

      // Size canvas to fill container at proper resolution
      const resize = () => {
        const rect = container.getBoundingClientRect();
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        if (renderer?.pipeline) {
          renderer.render();
        }
      };
      window.addEventListener('resize', resize);
      // Initial sizing with slight delay for layout
      requestAnimationFrame(resize);

      try {
        renderer = new StinkyfishRenderer(canvas);
        await renderer.init();

        // Load default scene
        await loadScene(sceneSelect.value);
        renderer.startRenderLoop();

      } catch (err) {
        console.error(err);
        status.textContent = `Init error: ${err.message}`;
        status.className = 'error';
      }
    }

    sceneSelect.addEventListener('change', () => loadScene(sceneSelect.value));
    recompileBtn.addEventListener('click', () => loadScene(sceneSelect.value));

    init();
  </script>
</body>
</html>
