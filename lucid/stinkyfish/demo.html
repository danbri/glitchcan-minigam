<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stinkyfish WebGPU Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem;
      background: #222;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    h1 { font-size: 1.2rem; }
    select, button {
      padding: 0.5rem 1rem;
      border-radius: 4px;
      border: 1px solid #444;
      background: #333;
      color: #fff;
      cursor: pointer;
    }
    select:hover, button:hover { background: #444; }
    #status {
      margin-left: auto;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      background: #333;
    }
    #status.error { background: #633; }
    #status.ok { background: #363; }
    main { flex: 1; display: flex; }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #fallback {
      display: none;
      padding: 2rem;
      text-align: center;
    }
    #fallback.show { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Stinkyfish WebGPU</h1>
    <select id="sceneSelect">
      <option value="sphere" selected>Simple Sphere</option>
      <option value="csg">CSG Demo</option>
      <option value="smoothblob">Smooth Blob</option>
      <option value="wolf">Wolf</option>
      <option value="wolf-simple">Wolf (Simple Test)</option>
    </select>
    <button id="recompile">Recompile</button>
    <div id="status">Loading...</div>
  </header>
  <main>
    <canvas id="canvas"></canvas>
    <div id="fallback">
      <h2>WebGPU Not Available</h2>
      <p>Your browser doesn't support WebGPU. Try Chrome 113+ or Edge 113+.</p>
    </div>
  </main>

  <script type="module">
    // Global error handler
    window.onerror = (msg, src, line, col, err) => {
      console.error('Global error:', msg, src, line, col, err);
      const status = document.getElementById('status');
      if (status) {
        status.textContent = `Error: ${msg}`;
        status.className = 'error';
      }
    };
    window.addEventListener('unhandledrejection', (e) => {
      console.error('Unhandled rejection:', e.reason);
      const status = document.getElementById('status');
      if (status) {
        status.textContent = `Error: ${e.reason?.message || e.reason}`;
        status.className = 'error';
      }
    });

    import { StinkyfishRenderer } from './raymarcher.js';
    import { loadJsonScene } from '../core/json-loader.js';
    import { generateWgslFromJson } from '../core/wgsl-codegen.js';

    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const sceneSelect = document.getElementById('sceneSelect');
    const recompileBtn = document.getElementById('recompile');
    const fallback = document.getElementById('fallback');

    let renderer = null;

    // Built-in simple scenes for testing (raw JSON format)
    const builtinScenes = {
      sphere: {
        root: {
          type: 'sphere',
          params: { r: 1.0, color: [0.8, 0.2, 0.2] }
        }
      },
      csg: {
        root: {
          type: 'subtract',
          children: [
            { type: 'sphere', params: { r: 1.0, color: [0.2, 0.6, 0.9] } },
            { type: 'box', params: { size: [0.6, 1.5, 0.6], color: [1, 0, 0] } },
            { type: 'box', params: { size: [1.5, 0.6, 0.6], color: [0, 1, 0] } }
          ]
        }
      },
      smoothblob: {
        root: {
          type: 'smoothUnion',
          k: 0.3,
          children: [
            { type: 'sphere', params: { r: 0.8, color: [0.9, 0.3, 0.1] } },
            { type: 'sphere', params: { r: 0.6, color: [0.1, 0.8, 0.3] }, transform: { translate: [1, 0.3, 0] } },
            { type: 'sphere', params: { r: 0.5, color: [0.2, 0.4, 0.9] }, transform: { translate: [-0.8, 0.5, 0.5] } }
          ]
        }
      },
      // Simplified wolf-like quadruped for testing (no displacement)
      'wolf-simple': {
        camera: { distance: 8, target: [0, 0.5, 0] },
        root: {
          type: 'smoothUnion',
          k: 0.25,
          children: [
            // Body
            { type: 'ellipsoid', params: { r: [1.5, 0.6, 0.7], color: [0.5, 0.4, 0.35] } },
            // Neck
            { type: 'ellipsoid', params: { r: [0.35, 0.45, 0.35], color: [0.5, 0.4, 0.35] }, transform: { translate: [1.2, 0.3, 0] } },
            // Head
            { type: 'ellipsoid', params: { r: [0.4, 0.35, 0.35], color: [0.55, 0.45, 0.4] }, transform: { translate: [1.8, 0.4, 0] } },
            // Snout
            { type: 'ellipsoid', params: { r: [0.35, 0.18, 0.18], color: [0.55, 0.45, 0.4] }, transform: { translate: [2.3, 0.25, 0] } },
            // Front legs
            { type: 'ellipsoid', params: { r: [0.12, 0.5, 0.1], color: [0.5, 0.4, 0.35] }, transform: { translate: [0.8, -0.3, 0.35] } },
            { type: 'ellipsoid', params: { r: [0.12, 0.5, 0.1], color: [0.5, 0.4, 0.35] }, transform: { translate: [0.8, -0.3, -0.35] } },
            // Back legs
            { type: 'ellipsoid', params: { r: [0.15, 0.5, 0.12], color: [0.5, 0.4, 0.35] }, transform: { translate: [-1.0, -0.3, 0.35] } },
            { type: 'ellipsoid', params: { r: [0.15, 0.5, 0.12], color: [0.5, 0.4, 0.35] }, transform: { translate: [-1.0, -0.3, -0.35] } },
            // Tail
            { type: 'ellipsoid', params: { r: [0.6, 0.12, 0.12], color: [0.5, 0.4, 0.35] }, transform: { translate: [-2.0, 0.2, 0], rotateZ: -0.3 } }
          ]
        }
      }
    };

    async function loadScene(name) {
      status.textContent = `Loading ${name}...`;
      status.className = '';

      try {
        let scene;
        let json = null;

        if (builtinScenes[name]) {
          json = builtinScenes[name];
          scene = loadJsonScene(json);
        } else {
          // Load from file
          const response = await fetch(`../scenes/creatures/${name}.json`);
          if (!response.ok) throw new Error(`Failed to load ${name}.json`);
          json = await response.json();
          scene = loadJsonScene(json);
        }

        // Set camera based on scene or use scene's camera settings
        let cam;
        if (json.camera) {
          cam = json.camera;
        } else {
          const cameraPresets = {
            sphere: { distance: 5, target: [0, 0, 0], theta: 0.3, phi: 0.4 },
            csg: { distance: 5, target: [0, 0, 0], theta: 0.3, phi: 0.4 },
            smoothblob: { distance: 6, target: [0, 0.2, 0], theta: 0.3, phi: 0.4 },
            wolf: { distance: 12, target: [0, 0.65, 0], theta: 0.25, phi: 0.3 },
          };
          cam = cameraPresets[name] || { distance: 8, target: [0, 0.5, 0], theta: 0.3, phi: 0.4 };
        }
        renderer.setCamera(cam.distance, cam.target, cam.theta || 0.3, cam.phi || 0.4);

        // Generate WGSL (inlineDefaults to avoid needing scene uniform buffer)
        const wgsl = generateWgslFromJson(scene, { inlineDefaults: true });
        console.log(`Generated ${wgsl.length} chars of WGSL for ${name}`);

        // Compile
        console.log('Compiling shader...');
        await renderer.compileScene(wgsl);
        console.log('Shader compiled, rendering...');
        renderer.render();
        console.log('Render complete');

        status.textContent = `${name} loaded`;
        status.className = 'ok';
      } catch (err) {
        console.error(err);
        status.textContent = `Error: ${err.message}`;
        status.className = 'error';
      }
    }

    async function init() {
      if (!navigator.gpu) {
        fallback.classList.add('show');
        status.textContent = 'WebGPU not supported';
        status.className = 'error';
        return;
      }

      // Size canvas
      const resize = () => {
        canvas.width = canvas.clientWidth * devicePixelRatio;
        canvas.height = canvas.clientHeight * devicePixelRatio;
        if (renderer?.pipeline) renderer.render();
      };
      window.addEventListener('resize', resize);
      resize();

      try {
        renderer = new StinkyfishRenderer(canvas);
        await renderer.init();

        // Load default scene
        await loadScene(sceneSelect.value);
        renderer.startRenderLoop();

      } catch (err) {
        console.error(err);
        status.textContent = `Init error: ${err.message}`;
        status.className = 'error';
      }
    }

    sceneSelect.addEventListener('change', () => loadScene(sceneSelect.value));
    recompileBtn.addEventListener('click', () => loadScene(sceneSelect.value));

    init();
  </script>
</body>
</html>
