<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABCD Parliament Log Viewer</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --text: #eee;
      --muted: #888;
      --accent: #0f3460;
      --commit: #22c55e;
      --no-commit: #ef4444;
      --p0: #dc2626;
      --p1: #f59e0b;
      --p2: #3b82f6;
      --p3: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #fff;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .review-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 16px;
      border-left: 4px solid var(--accent);
    }
    .review-card.commit { border-left-color: var(--commit); }
    .review-card.no-commit { border-left-color: var(--no-commit); }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .version {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .timestamp {
      color: var(--muted);
      font-size: 0.8rem;
    }
    .verdict {
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .verdict.commit { background: var(--commit); color: #000; }
    .verdict.no-commit { background: var(--no-commit); color: #fff; }
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .agent-box {
      background: var(--accent);
      border-radius: 6px;
      padding: 10px;
    }
    .agent-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .agent-score {
      font-size: 1.4rem;
      font-weight: bold;
    }
    .agent-verdict {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .issues-list {
      margin-top: 12px;
    }
    .issues-title {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .issue {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.75rem;
      margin: 2px;
    }
    .issue.P0 { background: var(--p0); color: #fff; }
    .issue.P1 { background: var(--p1); color: #000; }
    .issue.P2 { background: var(--p2); color: #fff; }
    .issue.P3 { background: var(--p3); color: #fff; }
    .showstoppers {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid var(--p0);
      border-radius: 6px;
      padding: 10px;
      margin-top: 12px;
    }
    .showstoppers-title {
      color: var(--p0);
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    .showstopper-item {
      font-size: 0.8rem;
      padding: 4px 0;
      border-bottom: 1px solid rgba(220, 38, 38, 0.3);
    }
    .showstopper-item:last-child { border-bottom: none; }
    .note {
      font-style: italic;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 10px;
    }
    .timings {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 8px;
    }
    .next-fix {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid var(--p2);
      border-radius: 6px;
      padding: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
    }
    .next-fix-title {
      color: var(--p2);
      font-weight: bold;
      margin-bottom: 4px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
    .error {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid var(--p0);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .expand-btn {
      background: var(--accent);
      border: none;
      color: var(--text);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 10px;
    }
    .expand-btn:hover { background: #1a4a7a; }
    .details {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--accent);
    }
    .details.open { display: block; }
    .raw-json {
      background: #0d1117;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .captures-gallery {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0;
      margin-top: 12px;
    }
    .captures-gallery img {
      height: 120px;
      border-radius: 6px;
      border: 2px solid var(--accent);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .captures-gallery img:hover {
      transform: scale(1.05);
      border-color: var(--commit);
    }
    .captures-title {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 12px;
    }
    .no-captures {
      font-size: 0.8rem;
      color: var(--muted);
      font-style: italic;
    }
    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .stat {
      background: var(--card-bg);
      padding: 12px 20px;
      border-radius: 6px;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <h1>ABCD Parliament Log Viewer</h1>
  <p class="subtitle">Model evaluation history from git</p>

  <div class="stats-bar" id="stats"></div>
  <div class="timeline" id="timeline">
    <div class="loading">Loading reviews...</div>
  </div>

  <script>
    const REVIEWS_PATH = 'reviews/';

    async function loadReviews() {
      const timeline = document.getElementById('timeline');
      const stats = document.getElementById('stats');

      try {
        // Load index
        const indexResp = await fetch(REVIEWS_PATH + 'index.json');
        if (!indexResp.ok) throw new Error('Could not load reviews index');
        const index = await indexResp.json();

        // Load all reviews
        const reviews = await Promise.all(
          index.reviews.map(async (file) => {
            const resp = await fetch(REVIEWS_PATH + file);
            return resp.json();
          })
        );

        // Sort by timestamp (newest first)
        reviews.sort((a, b) => new Date(b.timestamp || b.session_id) - new Date(a.timestamp || a.session_id));

        // Calculate stats
        const totalReviews = reviews.length;
        const commits = reviews.filter(r => r.agents?.D?.verdict === 'COMMIT').length;
        const noCommits = reviews.filter(r => r.agents?.D?.verdict === 'DO NOT COMMIT').length;

        stats.innerHTML = `
          <div class="stat">
            <div class="stat-value">${totalReviews}</div>
            <div class="stat-label">Total Reviews</div>
          </div>
          <div class="stat">
            <div class="stat-value" style="color: var(--commit)">${commits}</div>
            <div class="stat-label">Commits</div>
          </div>
          <div class="stat">
            <div class="stat-value" style="color: var(--no-commit)">${noCommits}</div>
            <div class="stat-label">Blocked</div>
          </div>
        `;

        // Render timeline
        timeline.innerHTML = reviews.map((review, idx) => renderReview(review, idx)).join('');

        // Add expand handlers
        document.querySelectorAll('.expand-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const details = btn.nextElementSibling;
            details.classList.toggle('open');
            btn.textContent = details.classList.contains('open') ? 'Hide Details' : 'Show Details';
          });
        });

        // Load captures for each review
        reviews.forEach((review, idx) => {
          if (review.captures_folder) {
            loadCaptures(review.captures_folder, idx);
          }
        });

      } catch (err) {
        timeline.innerHTML = `<div class="error">Error loading reviews: ${err.message}</div>`;
      }
    }

    function renderReview(review, idx) {
      const verdict = review.agents?.D?.verdict || 'UNKNOWN';
      const verdictClass = verdict === 'COMMIT' ? 'commit' : 'no-commit';

      const agentA = review.agents?.A || {};
      const agentB = review.agents?.B || {};
      const agentC = review.agents?.C || {};
      const agentD = review.agents?.D || {};

      // Extract issues from Agent C
      const issues = agentC.issues || [];
      const p0Issues = issues.filter(i => i.severity === 'P0');
      const p1Issues = issues.filter(i => i.severity === 'P1');
      const p2Issues = issues.filter(i => i.severity === 'P2');

      // Build showstoppers from P0 issues
      const showstoppers = p0Issues.map(i => i.name + (i.evidence ? ': ' + i.evidence : ''));

      const timings = review.timings || {};
      const totalMs = (timings.abc_parallel_wall_ms || 0) + (timings.agent_d_ms || 0);

      return `
        <div class="review-card ${verdictClass}">
          <div class="review-header">
            <div>
              <div class="version">v${review.model_version || '?'}</div>
              <div class="timestamp">${review.session_id || review.timestamp}</div>
            </div>
            <div class="verdict ${verdictClass}">${verdict}</div>
          </div>

          <div class="agents-grid">
            <div class="agent-box">
              <div class="agent-label">Agent A (Blanked)</div>
              <div class="agent-score">${agentA.confidence || '?'}%</div>
              <div class="agent-verdict">${agentA.primary || ''}</div>
            </div>
            <div class="agent-box">
              <div class="agent-label">Agent B (Informed)</div>
              <div class="agent-score">${agentB.score || '?'}/100</div>
              <div class="agent-verdict">${truncate(agentB.verdict || '', 40)}</div>
            </div>
            <div class="agent-box">
              <div class="agent-label">Agent C (Skeptic)</div>
              <div class="agent-score">${agentC.verdict ? agentC.verdict.split(' ')[0] : '?'}</div>
              <div class="agent-verdict">${truncate(agentC.marine_biologist_test || '', 40)}</div>
            </div>
          </div>

          ${review.captures_folder ? `
            <div class="captures-title">Captures</div>
            <div class="captures-gallery" id="gallery-${idx}">
              <span class="no-captures">Loading...</span>
            </div>
          ` : ''}

          ${showstoppers.length > 0 ? `
            <div class="showstoppers">
              <div class="showstoppers-title">SHOWSTOPPERS (${showstoppers.length})</div>
              ${showstoppers.map(s => `<div class="showstopper-item">${s}</div>`).join('')}
            </div>
          ` : ''}

          ${issues.length > 0 ? `
            <div class="issues-list">
              <div class="issues-title">Issues</div>
              ${p0Issues.map(i => `<span class="issue P0">P0: ${i.name}</span>`).join('')}
              ${p1Issues.map(i => `<span class="issue P1">P1: ${i.name}</span>`).join('')}
              ${p2Issues.map(i => `<span class="issue P2">P2: ${i.name}</span>`).join('')}
            </div>
          ` : ''}

          ${agentD.next_fix ? `
            <div class="next-fix">
              <div class="next-fix-title">Next Fix</div>
              ${agentD.next_fix}
            </div>
          ` : ''}

          ${review.note ? `<div class="note">${review.note}</div>` : ''}

          ${totalMs > 0 ? `
            <div class="timings">
              ABC: ${Math.round((timings.abc_parallel_wall_ms || 0) / 1000)}s |
              D: ${Math.round((timings.agent_d_ms || 0) / 1000)}s |
              Total: ${Math.round(totalMs / 1000)}s
            </div>
          ` : ''}

          <button class="expand-btn">Show Details</button>
          <div class="details">
            <div class="raw-json">${JSON.stringify(review, null, 2)}</div>
          </div>
        </div>
      `;
    }

    function truncate(str, len) {
      return str.length > len ? str.slice(0, len) + '...' : str;
    }

    async function loadCaptures(folder, idx) {
      const gallery = document.getElementById(`gallery-${idx}`);
      if (!gallery) return;

      // Try common image names
      const imageNames = [
        'view-01.png', 'view-02.png', 'view-03.png',
        'view-04.png', 'view-05.png', 'view-06.png',
        '01-front-side.png', '02-quarter-right.png', '03-above-right.png',
        '04-side-left.png', '05-low-front.png', '06-high-quarter.png'
      ];

      const basePath = `captures/${folder}/`;
      const loadedImages = [];

      for (const name of imageNames) {
        const img = new Image();
        const src = basePath + name;

        try {
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = src;
          });
          img.title = name;
          img.onclick = () => window.open(src, '_blank');
          loadedImages.push(img);
        } catch (e) {
          // Image doesn't exist, skip
        }
      }

      if (loadedImages.length > 0) {
        gallery.innerHTML = '';
        loadedImages.forEach(img => gallery.appendChild(img));
      } else {
        gallery.innerHTML = '<span class="no-captures">No captures found</span>';
      }
    }

    loadReviews();
  </script>
</body>
</html>
