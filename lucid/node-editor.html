<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucid Node Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      background: #16213e;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    .sidebar h2 {
      padding: 12px;
      font-size: 14px;
      border-bottom: 1px solid #333;
      background: #0f3460;
    }
    .node-palette {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .palette-section {
      margin-bottom: 12px;
    }
    .palette-section h3 {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .palette-item {
      padding: 6px 10px;
      margin: 2px 0;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 4px;
      cursor: grab;
      font-size: 12px;
      transition: background 0.15s;
    }
    .palette-item:hover {
      background: #2a2a4e;
      border-color: #4a9eff;
    }
    .palette-item .icon { margin-right: 6px; }

    /* Main area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      padding: 8px 12px;
      background: #0f3460;
      border-bottom: 1px solid #333;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .toolbar button {
      padding: 6px 12px;
      background: #1a1a2e;
      border: 1px solid #333;
      color: #eee;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .toolbar button:hover { background: #2a2a4e; }
    .toolbar .spacer { flex: 1; }

    /* Canvas */
    .canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #nodeCanvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Properties panel */
    .properties {
      width: 250px;
      background: #16213e;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    .properties h2 {
      padding: 12px;
      font-size: 14px;
      border-bottom: 1px solid #333;
      background: #0f3460;
    }
    .prop-content {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }
    .prop-group {
      margin-bottom: 12px;
    }
    .prop-group label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    .prop-group input, .prop-group select {
      width: 100%;
      padding: 6px 8px;
      background: #1a1a2e;
      border: 1px solid #333;
      color: #eee;
      border-radius: 4px;
      font-size: 12px;
    }
    .prop-group input:focus {
      outline: none;
      border-color: #4a9eff;
    }
    #jsonOutput {
      width: 100%;
      height: 150px;
      background: #0a0a1a;
      border: 1px solid #333;
      color: #8f8;
      font-family: monospace;
      font-size: 10px;
      padding: 8px;
      resize: vertical;
    }

    /* Preview */
    .preview {
      height: 200px;
      border-top: 1px solid #333;
      background: #0a0a1a;
    }
    .preview h3 {
      padding: 8px 12px;
      font-size: 12px;
      background: #0f3460;
      border-bottom: 1px solid #333;
    }
    #previewCanvas {
      width: 100%;
      height: calc(100% - 32px);
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Node Palette</h2>
    <div class="node-palette">
      <div class="palette-section">
        <h3>Primitives</h3>
        <div class="palette-item" data-type="sphere"><span class="icon">●</span>Sphere</div>
        <div class="palette-item" data-type="box"><span class="icon">■</span>Box</div>
        <div class="palette-item" data-type="torus"><span class="icon">◯</span>Torus</div>
        <div class="palette-item" data-type="cylinder"><span class="icon">▮</span>Cylinder</div>
        <div class="palette-item" data-type="capsule"><span class="icon">◠</span>Capsule</div>
      </div>
      <div class="palette-section">
        <h3>CSG Operations</h3>
        <div class="palette-item" data-type="union"><span class="icon">∪</span>Union</div>
        <div class="palette-item" data-type="subtract"><span class="icon">−</span>Subtract</div>
        <div class="palette-item" data-type="intersect"><span class="icon">∩</span>Intersect</div>
        <div class="palette-item" data-type="smoothUnion"><span class="icon">⊎</span>Smooth Union</div>
      </div>
      <div class="palette-section">
        <h3>Transforms</h3>
        <div class="palette-item" data-type="transform"><span class="icon">↔</span>Transform</div>
        <div class="palette-item" data-type="material"><span class="icon">🎨</span>Material</div>
        <div class="palette-item" data-type="mirror"><span class="icon">⬍</span>Mirror</div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">
      <button onclick="graph.clear()">Clear</button>
      <button onclick="loadExample()">Load Example</button>
      <button onclick="exportJSON()">Export JSON</button>
      <span class="spacer"></span>
      <span style="font-size:11px;color:#888">Drag nodes • Click to select • Drag sockets to connect</span>
    </div>
    <div class="canvas-container">
      <canvas id="nodeCanvas"></canvas>
    </div>
  </div>

  <div class="properties">
    <h2>Properties</h2>
    <div class="prop-content" id="propContent">
      <p style="color:#666;font-size:12px">Select a node to edit properties</p>
    </div>
    <h2>JSON Output</h2>
    <textarea id="jsonOutput" readonly></textarea>
    <div class="preview">
      <h3>Preview</h3>
      <canvas id="previewCanvas"></canvas>
    </div>
  </div>

  <script type="module">
    // Node schemas
    const NODE_SCHEMAS = {
      // Primitives
      sphere: { category: 'primitive', color: '#4a9eff', inputs: 0, outputs: 1, defaults: { r: 1 } },
      box: { category: 'primitive', color: '#4a9eff', inputs: 0, outputs: 1, defaults: { size: [1, 1, 1] } },
      torus: { category: 'primitive', color: '#4a9eff', inputs: 0, outputs: 1, defaults: { major: 1, minor: 0.3 } },
      cylinder: { category: 'primitive', color: '#4a9eff', inputs: 0, outputs: 1, defaults: { r: 0.5, h: 1 } },
      capsule: { category: 'primitive', color: '#4a9eff', inputs: 0, outputs: 1, defaults: { r: 0.3, h: 1 } },
      // CSG
      union: { category: 'csg', color: '#ff9f4a', inputs: 2, outputs: 1, defaults: {} },
      subtract: { category: 'csg', color: '#ff9f4a', inputs: 2, outputs: 1, defaults: {} },
      intersect: { category: 'csg', color: '#ff9f4a', inputs: 2, outputs: 1, defaults: {} },
      smoothUnion: { category: 'csg', color: '#ff9f4a', inputs: 2, outputs: 1, defaults: { k: 0.3 } },
      // Wrappers
      transform: { category: 'wrapper', color: '#9f4aff', inputs: 1, outputs: 1, defaults: { translate: [0, 0, 0] } },
      material: { category: 'wrapper', color: '#9f4aff', inputs: 1, outputs: 1, defaults: { color: [0.8, 0.3, 0.2] } },
      mirror: { category: 'wrapper', color: '#9f4aff', inputs: 1, outputs: 1, defaults: { axis: 'x' } },
    };

    class NodeGraph {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.nodes = [];
        this.connections = [];
        this.selected = null;
        this.dragging = null;
        this.connecting = null;
        this.pan = { x: 0, y: 0 };
        this.zoom = 1;
        this.dragStart = null;
        this.nodeWidth = 140;
        this.nodeHeight = 60;
        this.socketRadius = 6;

        this.resize();
        this.setupEvents();
        this.render();
      }

      resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.canvas.width = rect.width * devicePixelRatio;
        this.canvas.height = rect.height * devicePixelRatio;
        this.canvas.style.width = rect.width + 'px';
        this.canvas.style.height = rect.height + 'px';
        this.ctx.scale(devicePixelRatio, devicePixelRatio);
        this.render();
      }

      setupEvents() {
        window.addEventListener('resize', () => this.resize());

        this.canvas.addEventListener('mousedown', e => this.onMouseDown(e));
        this.canvas.addEventListener('mousemove', e => this.onMouseMove(e));
        this.canvas.addEventListener('mouseup', e => this.onMouseUp(e));
        this.canvas.addEventListener('wheel', e => this.onWheel(e));
        this.canvas.addEventListener('dblclick', e => this.onDoubleClick(e));
      }

      getMousePos(e) {
        const rect = this.canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left - this.pan.x) / this.zoom,
          y: (e.clientY - rect.top - this.pan.y) / this.zoom
        };
      }

      getNodeAt(pos) {
        for (let i = this.nodes.length - 1; i >= 0; i--) {
          const n = this.nodes[i];
          if (pos.x >= n.x && pos.x <= n.x + this.nodeWidth &&
              pos.y >= n.y && pos.y <= n.y + this.nodeHeight) {
            return n;
          }
        }
        return null;
      }

      getSocketAt(pos) {
        for (const node of this.nodes) {
          const schema = NODE_SCHEMAS[node.type];
          // Input sockets (left side)
          for (let i = 0; i < schema.inputs; i++) {
            const sy = node.y + 30 + i * 20;
            const sx = node.x;
            if (Math.hypot(pos.x - sx, pos.y - sy) < this.socketRadius + 4) {
              return { node, type: 'input', index: i, x: sx, y: sy };
            }
          }
          // Output socket (right side)
          if (schema.outputs > 0) {
            const sy = node.y + 30;
            const sx = node.x + this.nodeWidth;
            if (Math.hypot(pos.x - sx, pos.y - sy) < this.socketRadius + 4) {
              return { node, type: 'output', index: 0, x: sx, y: sy };
            }
          }
        }
        return null;
      }

      onMouseDown(e) {
        const pos = this.getMousePos(e);
        const socket = this.getSocketAt(pos);

        if (socket && socket.type === 'output') {
          this.connecting = { from: socket, to: pos };
          return;
        }

        const node = this.getNodeAt(pos);
        if (node) {
          this.selected = node;
          this.dragging = { node, offsetX: pos.x - node.x, offsetY: pos.y - node.y };
          // Move to front
          this.nodes = this.nodes.filter(n => n !== node);
          this.nodes.push(node);
          this.updateProperties();
        } else {
          this.selected = null;
          this.dragStart = { x: e.clientX - this.pan.x, y: e.clientY - this.pan.y };
          this.updateProperties();
        }
        this.render();
      }

      onMouseMove(e) {
        const pos = this.getMousePos(e);

        if (this.connecting) {
          this.connecting.to = pos;
          this.render();
          return;
        }

        if (this.dragging) {
          this.dragging.node.x = pos.x - this.dragging.offsetX;
          this.dragging.node.y = pos.y - this.dragging.offsetY;
          this.render();
          this.updateJSON();
          return;
        }

        if (this.dragStart) {
          this.pan.x = e.clientX - this.dragStart.x;
          this.pan.y = e.clientY - this.dragStart.y;
          this.render();
        }
      }

      onMouseUp(e) {
        if (this.connecting) {
          const pos = this.getMousePos(e);
          const socket = this.getSocketAt(pos);
          if (socket && socket.type === 'input' && socket.node !== this.connecting.from.node) {
            // Remove existing connection to this input
            this.connections = this.connections.filter(c =>
              !(c.toNode === socket.node.id && c.toIndex === socket.index));
            // Add new connection
            this.connections.push({
              fromNode: this.connecting.from.node.id,
              toNode: socket.node.id,
              toIndex: socket.index
            });
            this.updateJSON();
          }
          this.connecting = null;
          this.render();
        }
        this.dragging = null;
        this.dragStart = null;
      }

      onWheel(e) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        this.zoom = Math.max(0.3, Math.min(2, this.zoom * delta));
        this.render();
      }

      onDoubleClick(e) {
        const pos = this.getMousePos(e);
        const node = this.getNodeAt(pos);
        if (node) {
          // Delete node
          this.nodes = this.nodes.filter(n => n !== node);
          this.connections = this.connections.filter(c =>
            c.fromNode !== node.id && c.toNode !== node.id);
          if (this.selected === node) this.selected = null;
          this.render();
          this.updateJSON();
          this.updateProperties();
        }
      }

      addNode(type, x, y) {
        const schema = NODE_SCHEMAS[type];
        if (!schema) return;
        const node = {
          id: crypto.randomUUID(),
          type,
          x, y,
          params: { ...schema.defaults }
        };
        this.nodes.push(node);
        this.selected = node;
        this.render();
        this.updateJSON();
        this.updateProperties();
      }

      clear() {
        this.nodes = [];
        this.connections = [];
        this.selected = null;
        this.render();
        this.updateJSON();
        this.updateProperties();
      }

      render() {
        const ctx = this.ctx;
        const w = this.canvas.width / devicePixelRatio;
        const h = this.canvas.height / devicePixelRatio;

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, w, h);

        // Grid
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.translate(this.pan.x, this.pan.y);
        ctx.scale(this.zoom, this.zoom);

        // Grid lines
        ctx.strokeStyle = '#252540';
        ctx.lineWidth = 1;
        const gridSize = 30;
        const startX = Math.floor(-this.pan.x / this.zoom / gridSize) * gridSize;
        const startY = Math.floor(-this.pan.y / this.zoom / gridSize) * gridSize;
        for (let x = startX; x < w / this.zoom - this.pan.x / this.zoom; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, -this.pan.y / this.zoom);
          ctx.lineTo(x, h / this.zoom - this.pan.y / this.zoom);
          ctx.stroke();
        }
        for (let y = startY; y < h / this.zoom - this.pan.y / this.zoom; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(-this.pan.x / this.zoom, y);
          ctx.lineTo(w / this.zoom - this.pan.x / this.zoom, y);
          ctx.stroke();
        }

        // Connections
        ctx.lineWidth = 2;
        for (const conn of this.connections) {
          const fromNode = this.nodes.find(n => n.id === conn.fromNode);
          const toNode = this.nodes.find(n => n.id === conn.toNode);
          if (!fromNode || !toNode) continue;

          const x1 = fromNode.x + this.nodeWidth;
          const y1 = fromNode.y + 30;
          const x2 = toNode.x;
          const y2 = toNode.y + 30 + conn.toIndex * 20;

          ctx.strokeStyle = '#4a9eff';
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.bezierCurveTo(x1 + 50, y1, x2 - 50, y2, x2, y2);
          ctx.stroke();
        }

        // Connecting line
        if (this.connecting) {
          ctx.strokeStyle = '#4a9eff80';
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(this.connecting.from.x, this.connecting.from.y);
          ctx.lineTo(this.connecting.to.x, this.connecting.to.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Nodes
        for (const node of this.nodes) {
          this.renderNode(node);
        }

        ctx.restore();
      }

      renderNode(node) {
        const ctx = this.ctx;
        const schema = NODE_SCHEMAS[node.type];
        const isSelected = node === this.selected;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(node.x + 3, node.y + 3, this.nodeWidth, this.nodeHeight);

        // Body
        ctx.fillStyle = '#2a2a4e';
        ctx.strokeStyle = isSelected ? '#fff' : schema.color;
        ctx.lineWidth = isSelected ? 2 : 1;
        ctx.beginPath();
        ctx.roundRect(node.x, node.y, this.nodeWidth, this.nodeHeight, 6);
        ctx.fill();
        ctx.stroke();

        // Header
        ctx.fillStyle = schema.color;
        ctx.beginPath();
        ctx.roundRect(node.x, node.y, this.nodeWidth, 22, [6, 6, 0, 0]);
        ctx.fill();

        // Title
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px system-ui';
        ctx.fillText(node.type, node.x + 8, node.y + 15);

        // Input sockets
        for (let i = 0; i < schema.inputs; i++) {
          const sy = node.y + 30 + i * 20;
          ctx.fillStyle = '#1a1a2e';
          ctx.strokeStyle = '#4a9eff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(node.x, sy, this.socketRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // Output socket
        if (schema.outputs > 0) {
          const sy = node.y + 30;
          ctx.fillStyle = '#1a1a2e';
          ctx.strokeStyle = '#4a9eff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(node.x + this.nodeWidth, sy, this.socketRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // Params preview
        ctx.fillStyle = '#888';
        ctx.font = '10px system-ui';
        const paramStr = Object.entries(node.params).map(([k, v]) =>
          `${k}=${Array.isArray(v) ? '[...]' : v}`).join(' ');
        ctx.fillText(paramStr.slice(0, 20), node.x + 8, node.y + 45);
      }

      updateProperties() {
        const container = document.getElementById('propContent');
        if (!this.selected) {
          container.innerHTML = '<p style="color:#666;font-size:12px">Select a node to edit properties</p>';
          return;
        }

        const node = this.selected;
        let html = `<div class="prop-group"><label>Type</label><input value="${node.type}" disabled></div>`;

        for (const [key, value] of Object.entries(node.params)) {
          if (Array.isArray(value)) {
            html += `<div class="prop-group"><label>${key}</label>
              <input type="text" value="${value.join(', ')}" data-param="${key}" data-array="true"></div>`;
          } else if (typeof value === 'number') {
            html += `<div class="prop-group"><label>${key}</label>
              <input type="number" step="0.1" value="${value}" data-param="${key}"></div>`;
          } else {
            html += `<div class="prop-group"><label>${key}</label>
              <input type="text" value="${value}" data-param="${key}"></div>`;
          }
        }

        container.innerHTML = html;

        // Wire up inputs
        container.querySelectorAll('input[data-param]').forEach(input => {
          input.addEventListener('input', () => {
            const param = input.dataset.param;
            if (input.dataset.array) {
              node.params[param] = input.value.split(',').map(v => parseFloat(v.trim()) || 0);
            } else if (input.type === 'number') {
              node.params[param] = parseFloat(input.value) || 0;
            } else {
              node.params[param] = input.value;
            }
            this.render();
            this.updateJSON();
          });
        });
      }

      updateJSON() {
        const json = this.toJSON();
        document.getElementById('jsonOutput').value = JSON.stringify(json, null, 2);
        this.updatePreview(json);
      }

      toJSON() {
        // Find root node (node with output not connected to anything)
        const connectedOutputs = new Set(this.connections.map(c => c.fromNode));
        const roots = this.nodes.filter(n => {
          const schema = NODE_SCHEMAS[n.type];
          return schema.outputs > 0 && !connectedOutputs.has(n.id);
        });

        if (roots.length === 0 && this.nodes.length > 0) {
          // Just use last node
          return this.nodeToJSON(this.nodes[this.nodes.length - 1]);
        }

        if (roots.length === 1) {
          return { root: this.nodeToJSON(roots[0]) };
        }

        // Multiple roots - wrap in union
        return {
          root: {
            type: 'union',
            children: roots.map(r => this.nodeToJSON(r))
          }
        };
      }

      nodeToJSON(node) {
        const schema = NODE_SCHEMAS[node.type];
        const result = { type: node.type, ...node.params };

        // Get connected inputs
        const inputs = this.connections
          .filter(c => c.toNode === node.id)
          .sort((a, b) => a.toIndex - b.toIndex)
          .map(c => {
            const fromNode = this.nodes.find(n => n.id === c.fromNode);
            return fromNode ? this.nodeToJSON(fromNode) : null;
          })
          .filter(Boolean);

        if (schema.category === 'csg' && inputs.length > 0) {
          result.children = inputs;
        } else if (schema.category === 'wrapper' && inputs.length > 0) {
          result.child = inputs[0];
        }

        return result;
      }

      async updatePreview(json) {
        // TODO: Wire to Mayfly renderer
      }
    }

    // Initialize
    const canvas = document.getElementById('nodeCanvas');
    const graph = new NodeGraph(canvas);
    window.graph = graph;

    // Drag from palette
    document.querySelectorAll('.palette-item').forEach(item => {
      item.addEventListener('dragstart', e => {
        e.dataTransfer.setData('nodeType', item.dataset.type);
      });
      item.draggable = true;
    });

    canvas.addEventListener('dragover', e => e.preventDefault());
    canvas.addEventListener('drop', e => {
      e.preventDefault();
      const type = e.dataTransfer.getData('nodeType');
      if (type) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left - graph.pan.x) / graph.zoom;
        const y = (e.clientY - rect.top - graph.pan.y) / graph.zoom;
        graph.addNode(type, x, y);
      }
    });

    // Export
    window.exportJSON = () => {
      const json = graph.toJSON();
      const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'scene.json';
      a.click();
    };

    // Load example
    window.loadExample = () => {
      graph.clear();
      graph.addNode('sphere', 100, 100);
      graph.addNode('box', 100, 200);
      graph.addNode('smoothUnion', 300, 150);
      // Connect
      const sphere = graph.nodes[0];
      const box = graph.nodes[1];
      const union = graph.nodes[2];
      graph.connections.push({ fromNode: sphere.id, toNode: union.id, toIndex: 0 });
      graph.connections.push({ fromNode: box.id, toNode: union.id, toIndex: 1 });
      graph.render();
      graph.updateJSON();
    };
  </script>
</body>
</html>
