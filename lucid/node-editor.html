<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucid Node Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; }

    /* Canvas takes full screen */
    #nodeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; }
    #nodeCanvas:active { cursor: grabbing; }

    /* Floating toolbar */
    .toolbar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid #30363d;
      border-radius: 8px;
      z-index: 100;
    }
    .toolbar button {
      padding: 6px 12px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }
    .toolbar button:hover { background: #30363d; }
    .toolbar button.active { background: #238636; border-color: #238636; }

    /* Collapsible panels */
    .panel {
      position: fixed;
      background: rgba(22, 27, 34, 0.98);
      border: 1px solid #30363d;
      z-index: 90;
      transition: transform 0.2s ease;
    }

    /* Left panel - node palette */
    .panel-left {
      top: 60px;
      left: 0;
      bottom: 60px;
      width: 160px;
      border-radius: 0 8px 8px 0;
      overflow-y: auto;
      padding: 8px;
    }
    .panel-left.hidden { transform: translateX(-170px); }

    .palette-section { margin-bottom: 12px; }
    .palette-title { font-size: 9px; text-transform: uppercase; color: #6e7681; margin-bottom: 6px; }
    .palette-item {
      padding: 5px 8px;
      margin: 2px 0;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      font-size: 11px;
      cursor: grab;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .palette-item:hover { border-color: #58a6ff; }

    /* Right panel - preview & props */
    .panel-right {
      top: 60px;
      right: 0;
      bottom: 60px;
      width: 240px;
      border-radius: 8px 0 0 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-right.hidden { transform: translateX(250px); }

    .panel-header {
      padding: 8px 10px;
      background: #21262d;
      font-size: 11px;
      font-weight: 600;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }

    .scene-picker {
      max-height: 150px;
      overflow-y: auto;
      padding: 6px;
      border-bottom: 1px solid #30363d;
    }
    .scene-item {
      padding: 4px 8px;
      margin: 2px 0;
      background: #21262d;
      border: 1px solid transparent;
      border-radius: 3px;
      font-size: 10px;
      cursor: pointer;
    }
    .scene-item:hover { border-color: #58a6ff; }
    .scene-item.active { background: #238636; }

    .preview-area {
      height: 160px;
      border-bottom: 1px solid #30363d;
    }
    .preview-area lucid-renderer { width: 100%; height: 100%; }

    .props-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .prop-row { margin-bottom: 6px; }
    .prop-row label { display: block; font-size: 9px; color: #8b949e; margin-bottom: 2px; }
    .prop-row input, .prop-row select {
      width: 100%;
      padding: 4px 6px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 3px;
      color: #c9d1d9;
      font-size: 10px;
    }

    /* Bottom panel - timeline */
    .panel-bottom {
      left: 0;
      right: 0;
      bottom: 0;
      height: 50px;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }
    .panel-bottom.expanded { height: 120px; flex-direction: column; align-items: stretch; padding: 8px 12px; }
    .panel-bottom.hidden { transform: translateY(130px); }

    .tl-controls { display: flex; align-items: center; gap: 8px; }
    .tl-btn {
      width: 28px;
      height: 28px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #c9d1d9;
      cursor: pointer;
      font-size: 12px;
    }
    .tl-btn:hover { background: #30363d; }
    .tl-btn.active { background: #238636; }

    .scrubber {
      flex: 1;
      height: 20px;
      background: #21262d;
      border-radius: 4px;
      position: relative;
      cursor: pointer;
    }
    .scrubber-fill { position: absolute; left: 0; top: 0; height: 100%; background: #58a6ff33; border-radius: 4px; }
    .scrubber-handle { position: absolute; top: 2px; width: 3px; height: 16px; background: #58a6ff; border-radius: 2px; }

    .time-display { font-family: monospace; font-size: 11px; color: #58a6ff; min-width: 50px; }

    .wiggler-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .wiggler-chip {
      padding: 3px 8px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      font-size: 9px;
      cursor: pointer;
    }
    .wiggler-chip:hover { border-color: #58a6ff; }

    /* Edge toggles */
    .edge-toggle {
      position: fixed;
      width: 24px;
      height: 48px;
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      color: #8b949e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 95;
    }
    .edge-toggle:hover { color: #c9d1d9; }
    .toggle-left { left: 0; top: 50%; transform: translateY(-50%); border-radius: 0 6px 6px 0; border-left: none; }
    .toggle-right { right: 0; top: 50%; transform: translateY(-50%); border-radius: 6px 0 0 6px; border-right: none; }
    .toggle-bottom { bottom: 0; left: 50%; transform: translateX(-50%); width: 48px; height: 24px; border-radius: 6px 6px 0 0; border-bottom: none; }

    .no-selection { color: #6e7681; font-size: 10px; font-style: italic; }
  </style>
</head>
<body>
  <canvas id="nodeCanvas"></canvas>

  <!-- Floating toolbar - minimal actions only; panels use edge toggles -->
  <div class="toolbar">
    <select id="backendSelect" title="Renderer Backend" style="padding:6px 10px;background:#21262d;border:1px solid #30363d;color:#c9d1d9;border-radius:4px;font-size:11px;">
      <option value="mayfly">Mayfly (WebGL)</option>
      <option value="stinkyfish">Stinkyfish (WebGPU)</option>
    </select>
    <button id="btnClear" title="Clear All">✕ Clear</button>
    <button id="btnExport" title="Export JSON">↓ Export</button>
  </div>

  <!-- Left panel - Node Palette -->
  <div class="panel panel-left" id="panelLeft">
    <div class="palette-section">
      <div class="palette-title">Primitives</div>
      <div class="palette-item" draggable="true" data-type="sphere">● Sphere</div>
      <div class="palette-item" draggable="true" data-type="box">■ Box</div>
      <div class="palette-item" draggable="true" data-type="torus">◎ Torus</div>
      <div class="palette-item" draggable="true" data-type="cylinder">▮ Cylinder</div>
      <div class="palette-item" draggable="true" data-type="ellipsoid">⬭ Ellipsoid</div>
    </div>
    <div class="palette-section">
      <div class="palette-title">CSG Ops</div>
      <div class="palette-item" draggable="true" data-type="union">∪ Union</div>
      <div class="palette-item" draggable="true" data-type="subtract">− Subtract</div>
      <div class="palette-item" draggable="true" data-type="smoothUnion">⊎ Smooth</div>
    </div>
    <div class="palette-section">
      <div class="palette-title">Modify</div>
      <div class="palette-item" draggable="true" data-type="transform">↔ Move</div>
      <div class="palette-item" draggable="true" data-type="material">◐ Color</div>
      <div class="palette-item" draggable="true" data-type="mirror">⇆ Mirror</div>
    </div>
  </div>
  <button class="edge-toggle toggle-left" id="toggleLeft">▶</button>

  <!-- Right panel - Preview & Properties -->
  <div class="panel panel-right hidden" id="panelRight">
    <div class="panel-header">Load Scene ▼</div>
    <div class="scene-picker" id="scenePicker">Loading...</div>
    <div class="panel-header">Preview</div>
    <div class="preview-area">
      <lucid-renderer id="preview" backend="auto" quality="medium"></lucid-renderer>
    </div>
    <div class="panel-header">Properties</div>
    <div class="props-area" id="propsArea"><p class="no-selection">Select a node</p></div>
  </div>
  <button class="edge-toggle toggle-right" id="toggleRight">◀</button>

  <!-- Bottom panel - Timeline -->
  <div class="panel panel-bottom hidden" id="panelBottom">
    <div class="tl-controls">
      <button class="tl-btn" id="btnRewind">⏮</button>
      <button class="tl-btn" id="btnPlay">▶</button>
      <button class="tl-btn active" id="btnLoop">🔁</button>
      <span class="time-display" id="timeDisplay">0.00s</span>
    </div>
    <div class="scrubber" id="scrubber">
      <div class="scrubber-fill" id="scrubberFill"></div>
      <div class="scrubber-handle" id="scrubberHandle"></div>
    </div>
    <div class="wiggler-row">
      <span class="wiggler-chip" data-fn="sin">∿ sin</span>
      <span class="wiggler-chip" data-fn="bounce">⌢ bounce</span>
      <span class="wiggler-chip" data-fn="pulse">⎍ pulse</span>
      <span class="wiggler-chip" data-fn="spring">🌀 spring</span>
    </div>
  </div>
  <button class="edge-toggle toggle-bottom" id="toggleBottom">▲</button>

  <script type="module">
    import './components/lucid-renderer.js';

    const NODE_SCHEMAS = {
      sphere: { cat: 'prim', color: '#58a6ff', ins: 0, outs: 1, defaults: { r: 1 } },
      box: { cat: 'prim', color: '#58a6ff', ins: 0, outs: 1, defaults: { size: [1, 1, 1] } },
      torus: { cat: 'prim', color: '#58a6ff', ins: 0, outs: 1, defaults: { major: 1, minor: 0.3 } },
      cylinder: { cat: 'prim', color: '#58a6ff', ins: 0, outs: 1, defaults: { r: 0.5, h: 1 } },
      ellipsoid: { cat: 'prim', color: '#58a6ff', ins: 0, outs: 1, defaults: { radii: [1, 0.6, 0.8] } },
      union: { cat: 'csg', color: '#f0883e', ins: 2, outs: 1, defaults: {} },
      subtract: { cat: 'csg', color: '#f0883e', ins: 2, outs: 1, defaults: {} },
      smoothUnion: { cat: 'csg', color: '#f0883e', ins: 2, outs: 1, defaults: { k: 0.3 } },
      transform: { cat: 'wrap', color: '#a371f7', ins: 1, outs: 1, defaults: { translate: [0, 0, 0] } },
      material: { cat: 'wrap', color: '#a371f7', ins: 1, outs: 1, defaults: { color: [0.8, 0.3, 0.2] } },
      mirror: { cat: 'wrap', color: '#a371f7', ins: 1, outs: 1, defaults: { axis: 'x' } },
    };

    // ============ NODE GRAPH ============
    class NodeGraph {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.nodes = [];
        this.connections = [];
        this.selected = null;
        this.dragging = null;
        this.connecting = null;
        this.pan = { x: 100, y: 100 };
        this.zoom = 1;
        this.dragStart = null;
        this.W = 110; this.H = 48; this.SR = 5;
        this.resize();
        this.setupEvents();
        this.render();
      }

      resize() {
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = window.innerWidth * dpr;
        this.canvas.height = window.innerHeight * dpr;
        this.canvas.style.width = window.innerWidth + 'px';
        this.canvas.style.height = window.innerHeight + 'px';
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.render();
      }

      setupEvents() {
        window.addEventListener('resize', () => this.resize());
        this.canvas.addEventListener('mousedown', e => this.onDown(e));
        this.canvas.addEventListener('mousemove', e => this.onMove(e));
        this.canvas.addEventListener('mouseup', e => this.onUp(e));
        this.canvas.addEventListener('wheel', e => {
          e.preventDefault();
          this.zoom = Math.max(0.3, Math.min(3, this.zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
          this.render();
        }, { passive: false });
        this.canvas.addEventListener('dblclick', e => this.onDbl(e));
        this.canvas.addEventListener('touchstart', e => { e.preventDefault(); this.onDown(e.touches[0]); }, { passive: false });
        this.canvas.addEventListener('touchmove', e => { e.preventDefault(); this.onMove(e.touches[0]); }, { passive: false });
        this.canvas.addEventListener('touchend', e => this.onUp(e));
      }

      pos(e) {
        return {
          x: (e.clientX - this.pan.x) / this.zoom,
          y: (e.clientY - this.pan.y) / this.zoom
        };
      }

      nodeAt(p) {
        for (let i = this.nodes.length - 1; i >= 0; i--) {
          const n = this.nodes[i];
          if (p.x >= n.x && p.x <= n.x + this.W && p.y >= n.y && p.y <= n.y + this.H) return n;
        }
        return null;
      }

      socketAt(p) {
        for (const n of this.nodes) {
          const s = NODE_SCHEMAS[n.type];
          for (let i = 0; i < s.ins; i++) {
            const sy = n.y + 24 + i * 12;
            if (Math.hypot(p.x - n.x, p.y - sy) < 10) return { node: n, dir: 'in', idx: i, x: n.x, y: sy };
          }
          if (s.outs) {
            const sy = n.y + 24;
            if (Math.hypot(p.x - (n.x + this.W), p.y - sy) < 10) return { node: n, dir: 'out', idx: 0, x: n.x + this.W, y: sy };
          }
        }
        return null;
      }

      onDown(e) {
        const p = this.pos(e);
        const sock = this.socketAt(p);
        if (sock?.dir === 'out') { this.connecting = { from: sock, to: p }; return; }
        const node = this.nodeAt(p);
        if (node) {
          this.selected = node;
          this.dragging = { node, ox: p.x - node.x, oy: p.y - node.y };
          this.nodes = [...this.nodes.filter(n => n !== node), node];
          updateProps();
        } else {
          this.selected = null;
          this.dragStart = { x: e.clientX - this.pan.x, y: e.clientY - this.pan.y };
          updateProps();
        }
        this.render();
      }

      onMove(e) {
        const p = this.pos(e);
        if (this.connecting) { this.connecting.to = p; this.render(); return; }
        if (this.dragging) {
          this.dragging.node.x = p.x - this.dragging.ox;
          this.dragging.node.y = p.y - this.dragging.oy;
          this.render();
          return;
        }
        if (this.dragStart) {
          this.pan.x = e.clientX - this.dragStart.x;
          this.pan.y = e.clientY - this.dragStart.y;
          this.render();
        }
      }

      onUp(e) {
        if (this.connecting) {
          const p = this.pos(e.changedTouches?.[0] || e);
          const sock = this.socketAt(p);
          if (sock?.dir === 'in' && sock.node !== this.connecting.from.node) {
            this.connections = this.connections.filter(c => !(c.to === sock.node.id && c.ti === sock.idx));
            this.connections.push({ from: this.connecting.from.node.id, to: sock.node.id, ti: sock.idx });
            updatePreview();
          }
          this.connecting = null;
          this.render();
        }
        this.dragging = null;
        this.dragStart = null;
      }

      onDbl(e) {
        const node = this.nodeAt(this.pos(e));
        if (node) {
          this.nodes = this.nodes.filter(n => n !== node);
          this.connections = this.connections.filter(c => c.from !== node.id && c.to !== node.id);
          if (this.selected === node) this.selected = null;
          this.render();
          updatePreview();
          updateProps();
        }
      }

      addNode(type, x, y) {
        const s = NODE_SCHEMAS[type];
        if (!s) return;
        const node = { id: crypto.randomUUID(), type, x, y, params: JSON.parse(JSON.stringify(s.defaults)) };
        this.nodes.push(node);
        this.selected = node;
        this.render();
        updatePreview();
        updateProps();
      }

      clear() {
        this.nodes = [];
        this.connections = [];
        this.selected = null;
        this.render();
        updatePreview();
        updateProps();
      }

      render() {
        const ctx = this.ctx;
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth, h = window.innerHeight;

        // Reset transform with DPR scaling
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#0d1117';
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        ctx.translate(this.pan.x, this.pan.y);
        ctx.scale(this.zoom, this.zoom);

        // Grid
        ctx.strokeStyle = '#161b22';
        ctx.lineWidth = 1;
        const gs = 40;
        const sx = Math.floor(-this.pan.x / this.zoom / gs) * gs - gs;
        const sy = Math.floor(-this.pan.y / this.zoom / gs) * gs - gs;
        const ex = w / this.zoom + gs;
        const ey = h / this.zoom + gs;
        for (let x = sx; x < ex; x += gs) { ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x, ey); ctx.stroke(); }
        for (let y = sy; y < ey; y += gs) { ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(ex, y); ctx.stroke(); }

        // Connections
        ctx.lineWidth = 2;
        for (const c of this.connections) {
          const fn = this.nodes.find(n => n.id === c.from);
          const tn = this.nodes.find(n => n.id === c.to);
          if (!fn || !tn) continue;
          const fx = fn.x + this.W, fy = fn.y + 24;
          const tx = tn.x, ty = tn.y + 24 + c.ti * 12;
          ctx.strokeStyle = '#58a6ff';
          ctx.beginPath();
          ctx.moveTo(fx, fy);
          ctx.bezierCurveTo(fx + 40, fy, tx - 40, ty, tx, ty);
          ctx.stroke();
        }

        // Connecting line
        if (this.connecting) {
          ctx.strokeStyle = '#58a6ff80';
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(this.connecting.from.x, this.connecting.from.y);
          ctx.lineTo(this.connecting.to.x, this.connecting.to.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Nodes
        for (const n of this.nodes) this.drawNode(n);
        ctx.restore();
      }

      drawNode(n) {
        const ctx = this.ctx;
        const s = NODE_SCHEMAS[n.type];
        const sel = n === this.selected;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.roundRect(n.x + 3, n.y + 3, this.W, this.H, 6);
        ctx.fill();

        // Body
        ctx.fillStyle = '#21262d';
        ctx.strokeStyle = sel ? '#fff' : s.color;
        ctx.lineWidth = sel ? 2 : 1;
        ctx.beginPath();
        ctx.roundRect(n.x, n.y, this.W, this.H, 6);
        ctx.fill();
        ctx.stroke();

        // Header
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.roundRect(n.x, n.y, this.W, 18, [6, 6, 0, 0]);
        ctx.fill();

        // Title
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px system-ui';
        ctx.fillText(n.type, n.x + 6, n.y + 13);

        // Input sockets
        for (let i = 0; i < s.ins; i++) {
          const sy = n.y + 24 + i * 12;
          ctx.fillStyle = '#0d1117';
          ctx.strokeStyle = '#58a6ff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(n.x, sy, this.SR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // Output socket
        if (s.outs) {
          ctx.fillStyle = '#0d1117';
          ctx.strokeStyle = '#58a6ff';
          ctx.beginPath();
          ctx.arc(n.x + this.W, n.y + 24, this.SR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // Params preview
        ctx.fillStyle = '#6e7681';
        ctx.font = '8px system-ui';
        const preview = Object.entries(n.params).map(([k, v]) => `${k}=${Array.isArray(v) ? '[…]' : v}`).join(' ').slice(0, 18);
        ctx.fillText(preview, n.x + 6, n.y + 36);
      }

      toJSON() {
        const outs = new Set(this.connections.map(c => c.from));
        const roots = this.nodes.filter(n => NODE_SCHEMAS[n.type]?.outs && !outs.has(n.id));
        if (!roots.length && this.nodes.length) return { root: this.nodeJSON(this.nodes.at(-1)) };
        if (roots.length === 1) return { root: this.nodeJSON(roots[0]) };
        return { root: { type: 'union', children: roots.map(r => this.nodeJSON(r)) } };
      }

      nodeJSON(n) {
        const s = NODE_SCHEMAS[n.type];
        const r = { type: n.type, ...n.params };
        const ins = this.connections.filter(c => c.to === n.id).sort((a, b) => a.ti - b.ti)
          .map(c => this.nodes.find(x => x.id === c.from)).filter(Boolean).map(x => this.nodeJSON(x));
        if (s.cat === 'csg' && ins.length) r.children = ins;
        else if (s.cat === 'wrap' && ins.length) r.child = ins[0];
        return r;
      }

      fromJSON(scene) {
        this.clear();
        if (scene.root) this._fromNode(scene.root, 300, 150);
        this.render();
        updatePreview();
      }

      _fromNode(node, x, y) {
        const s = NODE_SCHEMAS[node.type];
        if (!s) return null;
        const id = crypto.randomUUID();
        const params = {};
        for (const k of Object.keys(s.defaults)) params[k] = node[k] ?? s.defaults[k];
        this.nodes.push({ id, type: node.type, x, y, params });
        let cy = y;
        const children = node.children || (node.child ? [node.child] : []);
        for (let i = 0; i < children.length; i++) {
          const cid = this._fromNode(children[i], x - 150, cy);
          if (cid) this.connections.push({ from: cid, to: id, ti: i });
          cy += 80;
        }
        return id;
      }
    }

    // ============ INIT ============
    const canvas = document.getElementById('nodeCanvas');
    const graph = new NodeGraph(canvas);
    const previewEl = document.getElementById('preview');
    const backendSelect = document.getElementById('backendSelect');

    // Check WebGPU support and sync dropdown
    if (!navigator.gpu) {
      backendSelect.querySelector('option[value="stinkyfish"]').disabled = true;
      backendSelect.querySelector('option[value="stinkyfish"]').textContent = 'Stinkyfish (no WebGPU)';
      backendSelect.value = 'mayfly';
    } else {
      // Default to stinkyfish if WebGPU available
      backendSelect.value = 'stinkyfish';
    }

    // Sync dropdown when renderer reports its actual backend
    previewEl.addEventListener('renderer-ready', (e) => {
      if (e.detail?.backend) {
        backendSelect.value = e.detail.backend;
      }
    });

    // Backend switching
    backendSelect.addEventListener('change', () => {
      previewEl.backend = backendSelect.value;
      updatePreview();
    });

    // Panel toggles
    const panelLeft = document.getElementById('panelLeft');
    const panelRight = document.getElementById('panelRight');
    const panelBottom = document.getElementById('panelBottom');

    // Edge toggles for panels
    document.getElementById('toggleLeft').addEventListener('click', () => panelLeft.classList.toggle('hidden'));
    document.getElementById('toggleRight').addEventListener('click', () => panelRight.classList.toggle('hidden'));
    document.getElementById('toggleBottom').addEventListener('click', () => panelBottom.classList.toggle('hidden'));

    document.getElementById('btnClear').addEventListener('click', () => graph.clear());
    document.getElementById('btnExport').addEventListener('click', () => {
      const json = graph.toJSON();
      const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'lucid-scene.json';
      a.click();
    });

    // Drag from palette
    document.querySelectorAll('.palette-item').forEach(item => {
      item.addEventListener('dragstart', e => e.dataTransfer.setData('nodeType', item.dataset.type));
    });
    canvas.addEventListener('dragover', e => e.preventDefault());
    canvas.addEventListener('drop', e => {
      e.preventDefault();
      const type = e.dataTransfer.getData('nodeType');
      if (type) {
        const p = graph.pos(e);
        graph.addNode(type, p.x, p.y);
      }
    });

    // Preview
    function updatePreview() {
      const json = graph.toJSON();
      if (!json.root) return;
      json.camera = { distance: 6, theta: 0.4, phi: 0.5 };
      try { previewEl.loadSceneJson(json); } catch (e) { console.error(e); }
    }

    // Properties
    function updateProps() {
      const area = document.getElementById('propsArea');
      if (!graph.selected) {
        area.innerHTML = '<p class="no-selection">Select a node</p>';
        return;
      }
      const n = graph.selected;
      let h = '';
      for (const [k, v] of Object.entries(n.params)) {
        if (Array.isArray(v)) {
          h += `<div class="prop-row"><label>${k}</label><input value="${v.join(', ')}" data-p="${k}" data-arr></div>`;
        } else if (k === 'axis') {
          h += `<div class="prop-row"><label>${k}</label><select data-p="${k}">
            <option ${v === 'x' ? 'selected' : ''}>x</option>
            <option ${v === 'y' ? 'selected' : ''}>y</option>
            <option ${v === 'z' ? 'selected' : ''}>z</option>
          </select></div>`;
        } else {
          h += `<div class="prop-row"><label>${k}</label><input type="number" step="0.1" value="${v}" data-p="${k}"></div>`;
        }
      }
      area.innerHTML = h;
      area.querySelectorAll('[data-p]').forEach(inp => {
        inp.addEventListener('input', () => {
          if (inp.dataset.arr !== undefined) {
            n.params[inp.dataset.p] = inp.value.split(',').map(x => parseFloat(x.trim()) || 0);
          } else if (inp.type === 'number') {
            n.params[inp.dataset.p] = parseFloat(inp.value) || 0;
          } else {
            n.params[inp.dataset.p] = inp.value;
          }
          graph.render();
          updatePreview();
        });
      });
    }

    // Scene picker - load ALL scenes
    async function loadScenes() {
      try {
        const resp = await fetch('./scenes/toc.json');
        const toc = await resp.json();
        const picker = document.getElementById('scenePicker');
        let html = '';
        for (const cat of toc.categories) {
          if (cat.id === 'recent') continue; // Skip recent (duplicates)
          for (const s of cat.scenes) {
            html += `<div class="scene-item" data-path="${s.path}">${s.title}</div>`;
          }
        }
        picker.innerHTML = html;
        picker.querySelectorAll('.scene-item').forEach(el => {
          el.addEventListener('click', async () => {
            picker.querySelectorAll('.scene-item').forEach(x => x.classList.remove('active'));
            el.classList.add('active');
            try {
              const resp = await fetch(`./scenes/${el.dataset.path}`);
              const json = await resp.json();
              graph.fromJSON(json);
            } catch (e) { console.error(e); }
          });
        });
      } catch (e) {
        document.getElementById('scenePicker').innerHTML = '<p class="no-selection">Failed to load</p>';
      }
    }

    // Timeline
    const timeline = { time: 0, duration: 10, playing: false, loop: true };
    const scrubber = document.getElementById('scrubber');
    const scrubberFill = document.getElementById('scrubberFill');
    const scrubberHandle = document.getElementById('scrubberHandle');
    const timeDisplay = document.getElementById('timeDisplay');

    function updateScrubber() {
      const pct = (timeline.time / timeline.duration) * 100;
      scrubberFill.style.width = pct + '%';
      scrubberHandle.style.left = pct + '%';
      timeDisplay.textContent = timeline.time.toFixed(2) + 's';
    }

    let lastFrame = 0;
    function animate(ts) {
      if (timeline.playing) {
        timeline.time += (ts - lastFrame) / 1000;
        if (timeline.time >= timeline.duration) {
          timeline.time = timeline.loop ? 0 : timeline.duration;
        }
        updateScrubber();
      }
      lastFrame = ts;
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    document.getElementById('btnPlay').addEventListener('click', function() {
      timeline.playing = !timeline.playing;
      this.textContent = timeline.playing ? '⏸' : '▶';
      this.classList.toggle('active', timeline.playing);
    });
    document.getElementById('btnRewind').addEventListener('click', () => { timeline.time = 0; updateScrubber(); });
    document.getElementById('btnLoop').addEventListener('click', function() {
      timeline.loop = !timeline.loop;
      this.classList.toggle('active', timeline.loop);
    });

    let scrubbing = false;
    scrubber.addEventListener('mousedown', e => { scrubbing = true; scrubTo(e); });
    window.addEventListener('mousemove', e => { if (scrubbing) scrubTo(e); });
    window.addEventListener('mouseup', () => { scrubbing = false; });
    function scrubTo(e) {
      const rect = scrubber.getBoundingClientRect();
      timeline.time = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * timeline.duration;
      updateScrubber();
    }

    loadScenes();
  </script>
</body>
</html>
