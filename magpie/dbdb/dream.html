<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#010204">
<title>THE STATIC DREAM</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; overflow:hidden; background:#010204;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    font-family:"Courier New",ui-monospace,monospace; color:#9fe8b0;
  }
  #stage { position:fixed; inset:0; }
  #stage canvas { width:100%; height:100%; display:block; }
  /* phosphor dressing: the whole page IS the terminal's screen */
  #phos {
    position:fixed; inset:0; pointer-events:none; z-index:6;
    background:
      radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,20,8,.55) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, rgba(0,0,0,0) 1px 3px);
  }
  #head {
    position:fixed; top:0; left:0; right:0; z-index:8; display:flex;
    justify-content:space-between; padding:10px 110px 8px 14px; pointer-events:none;
    font-size:11px; letter-spacing:.3em; color:rgba(159,232,176,.75);
    text-shadow:0 0 8px rgba(80,255,140,.5);
  }
  #clueTally { pointer-events:none; }
  #loadLine {
    position:fixed; left:14%; right:14%; top:52%; z-index:7; text-align:center;
    font-size:12px; letter-spacing:.28em; color:rgba(159,232,176,.8);
    text-shadow:0 0 10px rgba(80,255,140,.6);
  }
  /* THE TERMINAL: screen-filling, NOT in the world — pure ink UI */
  #panel {
    position:fixed; left:4vw; right:4vw; top:9vh; z-index:22;
    max-height:76vh; overflow-y:auto; padding:16px 16px 14px;
    background:rgba(1,10,5,.96); border:2px solid rgba(159,232,176,.55);
    border-radius:10px; box-shadow:0 0 60px rgba(80,255,140,.28), inset 0 0 40px rgba(0,0,0,.7);
    font-size:17px; line-height:1.55;
  }
  #panel .crest { font-size:10px; letter-spacing:.3em; opacity:.65; margin-bottom:8px; }
  #panel p { margin:0 0 9px; animation:inkIn .7s ease both;
    text-shadow:0 0 6px rgba(80,255,140,.35); }
  @keyframes inkIn { from{opacity:0; transform:translateY(6px); filter:blur(4px);}
                     to{opacity:1; transform:none; filter:none;} }
  #panel .choice {
    display:block; width:100%; margin-top:8px; padding:12px 14px; text-align:left;
    background:rgba(80,255,140,.08); border:1px solid rgba(159,232,176,.45);
    border-radius:4px; color:#c9ffd6; font-family:inherit; font-size:15.5px;
    letter-spacing:.06em; cursor:pointer; animation:inkIn .7s ease both;
  }
  #panel .choice:active { background:rgba(80,255,140,.28); }
  /* dbdb2's controls, verbatim paradigm: floating stick + spin + snaps */
  #stickBase, #stickNub {
    position:fixed; z-index:8; border-radius:50%; pointer-events:none; display:none; }
  #stickBase { width:110px; height:110px; border:3px solid; opacity:.55; }
  #stickNub  { width:48px;  height:48px;  border:3px solid; opacity:.8; }
  #rotL, #rotR { position:fixed; bottom:12px; z-index:9;
    background:rgba(2,16,8,.72); border:1px solid; border-radius:6px;
    font:bold 15px monospace; padding:8px 12px; }
  #rotR { right:10px; } #rotL { right:64px; }
  body.edit #rotL, body.edit #rotR { bottom:64px; }
  #err { position:fixed; inset:auto 0 0 0; z-index:50; color:#ff9a9a; background:rgba(30,0,0,.92); padding:8px; font-size:11px; display:none; white-space:pre-wrap; }
  #menuBtn { position:fixed; bottom:12px; left:10px; z-index:9;
    background:rgba(2,16,8,.72); border:1px solid; border-radius:6px;
    font:bold 14px monospace; padding:8px 13px; }
  #menu { position:fixed; bottom:58px; left:10px; z-index:21;
    background:rgba(1,10,5,.95); border:1px solid; border-radius:8px;
    padding:10px; font:12px monospace; display:flex; flex-direction:column;
    gap:8px; max-width:80vw; }
  #menu button { background:none; border:1px solid currentColor; color:inherit;
    font:12px monospace; padding:8px 10px; border-radius:4px; text-align:left; }
  #menu .prow { display:flex; flex-wrap:wrap; gap:6px; }
  #menu .prow button { padding:6px 8px; font-size:11px; }
  #menu .mLbl { opacity:.6; font-size:10px; letter-spacing:.2em; }
  #menu .mCred { opacity:.5; font-size:9px; max-width:260px; }
  /* the edit bar docks at the very bottom: lift the corner buttons over it */
  body.edit #menuBtn { bottom:64px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="phos"></div>
<div id="head"><span id="hudLoc">PORT/7 · DREAM SHELL</span><span id="clueTally">◆ 0 · ◇ 0</span></div>
<div id="loadLine">TUNING THE STATIC…</div>
<div id="stickBase"></div><div id="stickNub"></div>
<button type="button" id="rotL" aria-label="spin left">⟲</button>
<button type="button" id="rotR" aria-label="spin right">⟳</button>
<div id="panel" class="hidden"><div class="crest">PORT/7 TERMINAL</div><div class="inkText"></div><div class="choices"></div></div>
<pre id="err"></pre>

<script src="../../third_party/ink/ink-full.min.js"></script>
<script type="module">
const errBox=document.getElementById('err');
window.addEventListener('error', e=>{ errBox.style.display='block';
  errBox.textContent += (e.message||e.error)+'\n'; });
window.addEventListener('unhandledrejection', e=>{ errBox.style.display='block';
  errBox.textContent += 'async: '+(e.reason&&e.reason.message||e.reason)+'\n'; });

const Q=new URLSearchParams(location.search);
/* each candy PET tints the dream shell its own phosphor */
const TINTS={ bondi:'#8fd8e8', strawberry:'#ffa8b6', tangerine:'#ffc896',
              lime:'#c8f0a0', grape:'#cfaef5' };
const tint=TINTS[Q.get('tint')]||'#9fe8b0';
for(const id of ['head','loadLine']){
  const el=document.getElementById(id); if(el) el.style.color=tint;
}
for(const id of ['stickBase','stickNub','rotL','rotR']){
  const el=document.getElementById(id);
  el.style.borderColor=tint; el.style.color=tint;
}
if(parent!==window)                        // framed in dbdb2: clear its EJECT button
  document.getElementById('head').style.paddingLeft='104px';

/* (The html-in-canvas probe and the in-world DOM billboard eco-system
   were retired 2026-08-11: the ink UI is a screen-filling terminal now,
   plain DOM, and the world holds GEMS instead of pages of text.) */

/* =========================================================
   THE PORTS — every scan CC-permissive, every scan shown
   upright: the scene root is rotated so the scan's own up
   becomes world +y, and everything else lives in y-up space.
   ========================================================= */
const SCENES={
  tree:  { names:['HEARTH','TINSEL','ROOTS','STARWARD'], ply:'splats/christmas-tree-150k.compressed.ply',
           code:'MOONFALL',
           /* walls: flat surfaces catalogued by tools/wall-scout.mjs
              (RANSAC over the scan points, visually reviewed) */
           walls:[{p:[0.52,0.52,0.52], yaw:-117.1, w:1.3},
                  {p:[0,0,1.04],       yaw:-115.5, w:1.3}],
           /* st: hand-placed stations (owner, via ?edit=1) — each overrides
              the computed TOUR corner of the same index: name, world pos,
              arrival camera bearing */
           st:[{n:'SHED WINDOW', p:[5.302,0.581,-1.589], yaw:103.9},
               {n:'THE CAR',     p:[-4.278,0.118,1.979], yaw:-47.7},
               {n:'GREENZONE',   p:[1.248,0.295,-0.039], yaw:55.9}],
           hq:'splats/christmas-tree-400k.compressed.ply',
           raw:'splats/christmas-tree-150k.splat',
           up:[-0.522,0.836,0.168], c:[-0.4,-0.1,0.9], r:2.6,
           pal:['#d8d8d8','#f0f0f0','#a8a8a8','#55a049','#b83932','#e8b48c'],
           what:"a pine tree standing in somebody's scanned-in winter, holding its breath",
           credit:'ChristmasTree · keijiro-tk/splat-data · The Unlicense' },
  guitar:{ ply:'splats/guitar.compressed.ply',
           up:[0,-1,0], c:[0.15,-1.62,0.22], r:2.0,
           pal:['#a87848','#d8a878','#784818','#a8a8a8','#e8d8b0','#787878'],
           what:'a guitar, still holding its last chord',
           credit:'guitar · playcanvas/engine examples · MIT' },
  skull: { ply:'splats/skull-120k.compressed.ply',
           up:[0,-1,0], c:[-0.05,-0.82,-0.10], r:1.4,
           pal:['#d8a878','#a87848','#f0e0c0','#784818','#484818','#181818'],
           what:'a skull, grinning politely at the drift',
           credit:'skull · playcanvas/engine examples · MIT' },
  biker: { ply:'splats/biker.compressed.ply',
           up:[0,-1,0], c:[-0.03,-1.60,0.02], r:1.8,
           pal:['#a8a8a8','#d8d8d8','#787878','#784848','#f0e8d8','#484848'],
           what:'a motorcycle, parked forever in the static',
           credit:'biker · playcanvas/engine examples · MIT' },
  garden:{ names:['LILYPAD','CANOPY','BRICKPATH','MANGROVE'], ply:'splats/garden-sog/meta.json',
           code:'VICTORIA',
           walls:[{p:[-8.4,1.68,0],      yaw:59.6,   w:2.1},
                  {p:[4.2,0.84,0],       yaw:-178.7, w:2.1},
                  {p:[-1.68,2.52,7.56],  yaw:-179.5, w:2.1}],
           /* st: scouted by tools/view-scout.mjs (density anchors ->
              scored shots -> visual review), 2026-08-11 */
           st:[{n:'LILY POND', p:[3.5,0.7,3.5], yaw:-135, pit:-4.5, d:0.239},
               {n:'BRICK PATH', p:[-2.1,1.4,0.7], yaw:108.4, pit:-4.5, d:0.239},
               {n:'THE LABEL', p:[-10.5,1.4,3.5], yaw:108.4, pit:-4.5, d:0.239},
               {n:'SUNWALK', p:[7.7,0,-1.4], yaw:-79.7, pit:-4.5, d:0.239}],
           up:[0,-1,0], c:[0,0,0], r:4.2,
           pal:['#7da05a','#a8c878','#d8e8c0','#8a9a78','#c8b890','#587048'],
           what:'a tropical glasshouse, breathing green in the static',
           credit:'Botanical Garden Kiel, Victoria House · Simon Bethke · superspl.at/scene/6f697c4d · CC BY 4.0' },
  forest:{ names:['TRAILHEAD','UNDERWOOD','CLEARING','MOSSBANK'], ply:'splats/forest.sog',
           up:[0,-1,0], c:[-0.63,-0.57,0.74], r:4.0,
           pal:['#487818','#184818','#787818','#a8c878','#484818','#8a9a58'],
           what:'a forest path, mid-stride, holding the light between trunks',
           credit:'Forest path · Pavel Tanhauser · superspl.at/scene/2be1a75a · CC BY 4.0' },
  carshop:{ names:['OILCAN','WORKBENCH','TINROOF','YARD'], ply:'splats/carshop.sog',
           up:[0,-1,0], c:[0.42,-1.21,-0.26], r:3.6,
           pal:['#a87848','#784818','#d8a878','#787878','#484848','#c8b890'],
           what:'a ghost-town car shop, dust settling on old machines',
           credit:'Nelson Ghost Town Car Shop · Paolo Tosolini · superspl.at/scene/dd8d9c8b · CC BY 4.0' },
  museum:{ names:['PORTICO','GALLERY','LAWN','COLONNADE'], ply:'splats/museum.sog',
           up:[0,-1,0], c:[0.11,-0.9,-0.03], r:15.0,
           pal:['#181818', '#484818', '#484848', '#787848', '#184818', '#787878'],
           what:'an art museum after hours, the paintings listening',
           credit:'Buffalo AKG Art Museum · Justin Eastman · superspl.at/scene/fadf93a0 · CC BY 4.0' },
  pool:{ names:['DEEPEND','SUNDECK','LADDER','SHALLOWS'], ply:'splats/pool.sog',
           up:[0,-1,0], c:[-4.43,-4.59,-2.64], r:11.41,
           pal:['#181818', '#484818', '#787848', '#184818', '#787818', '#784818'],
           what:'an apartment pool, holding its blue perfectly still',
           credit:'Apartment Pool · paul · superspl.at/scene/9d145adb · CC BY 4.0' },
  watertower:{ names:['TANK','RUNGS','SHADOWSIDE','GHOSTYARD'], ply:'splats/watertower.sog',
           up:[0,-1,0], c:[-13.59,-1.1,-13.78], r:14.7,
           pal:['#181818', '#a8a8a8', '#787878', '#484848', '#ffffff', '#181848'],
           what:'a ghost-town water tower, tall against the static',
           credit:'Nelson Ghost Town Water Tower · Paolo Tosolini · superspl.at/scene/fb3b5ed5 · CC BY 4.0' },
  calico:{ names:['REDROCK','SANDWASH','OVERLOOK','CAIRN'], ply:'splats/calico.sog',
           up:[0,-1,0], c:[57.7,-1.11,1.97], r:41.41,
           pal:['#a8a8a8', '#787878', '#484848', '#d8d8d8', '#181818', '#ffffff'],
           what:'a red-rock desert trail, wind fossilised mid-gust',
           credit:'Calico Tanks Trail, Red Rock Canyon · Paolo Tosolini · superspl.at/scene/19312f07 · CC BY 4.0' },
};
/* places only (owner, Aug 2026): objects render fine but make no game
   sense; every PET dials the winter-tree ROOM until more place-scans
   arrive. Objects stay reachable via ?scene= for testing. */
const TINT2SCENE={ bondi:'carshop', grape:'museum', strawberry:'forest',
                   lime:'garden', tangerine:'pool' };
const PLACES=['tree','garden','carshop','forest','museum','pool','watertower','calico'];
const SCENE=SCENES[Q.get('scene')] || SCENES[TINT2SCENE[Q.get('tint')]] || SCENES.tree;
const SCENEKEY=Object.keys(SCENES).find(k=>SCENES[k]===SCENE)||'tree';

/* ---- ☰ THE MENU — mode switches live here, not in URL paths ---- */
const menuBtn=document.createElement('button');
menuBtn.type='button'; menuBtn.id='menuBtn'; menuBtn.textContent='☰';
menuBtn.setAttribute('aria-label','menu');
document.body.appendChild(menuBtn);
const menu=document.createElement('div');
menu.id='menu'; menu.classList.add('hidden');
menu.innerHTML='<button type="button" id="mExit">\u2715 SURFACE</button>'
 +'<button type="button" id="mTerm">OPEN TERMINAL</button>'
 +'<button type="button" id="mEdit">EDIT PLACEMENT: OFF</button>'
 +'<div class="mLbl">FAST PORT</div><div class="prow" id="mPorts"></div>'
 +'<div class="mCred"></div>';
document.body.appendChild(menu);
menuBtn.style.color=tint; menuBtn.style.borderColor=tint;
menu.style.color=tint; menu.style.borderColor=tint;
{ const row=menu.querySelector('#mPorts');
  for(const k of PLACES){
    const b=document.createElement('button'); b.type='button';
    b.textContent=k.toUpperCase();
    if(k===SCENEKEY){ b.style.opacity='0.4'; b.disabled=true; }
    b.addEventListener('click',()=>{
      const u=new URL(location.href);
      u.searchParams.set('scene',k);
      u.searchParams.delete('far'); u.searchParams.delete('st');
      u.searchParams.set('g',String(vs('gems')));       // the economy
      u.searchParams.set('di',String(vs('diamonds')));  // rides along
      location.href=u.toString();      // tint + edit ride along too
    });
    row.appendChild(b);
  }
  menu.querySelector('.mCred').textContent=SCENE.credit;
}
menuBtn.addEventListener('click',()=>menu.classList.toggle('hidden'));
menu.querySelector('#mEdit').addEventListener('click',()=>setEdit(!editOn));
menu.querySelector('#mTerm').addEventListener('click',()=>{
  menu.classList.add('hidden');
  if(inkStory){ try{ inkStory.ChoosePathString('hub'); }catch(e){}
    renderInk(); termOpen(); }
});
const SPLAT_PATH=(Q.has('hq') && SCENE.hq) ? SCENE.hq : SCENE.ply;

/* =========================================================
   PlayCanvas — REAL gaussian splatting, including on iOS.
   CDN first, vendored third_party/ fallback (house pattern).
   ========================================================= */
async function loadPC(){
  const CDN='https://cdn.jsdelivr.net/npm/playcanvas@2.21.3/build/playcanvas.min.mjs';
  const LOCAL='../../third_party/playcanvas/playcanvas.min.mjs';
  try{ return await Promise.race([ import(CDN),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('cdn timeout')),3500)) ]); }
  catch(e){ console.warn('playcanvas CDN unavailable, using vendored copy'); return import(LOCAL); }
}
const pc = await loadPC();

const canvas=document.createElement('canvas');
document.getElementById('stage').appendChild(canvas);
const app=new pc.Application(canvas, { graphicsDeviceOptions:{ antialias:false } });
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
app.setCanvasResolution(pc.RESOLUTION_AUTO);
app.graphicsDevice.maxPixelRatio=Math.min(devicePixelRatio,2);
app.start();
/* distance fog: the scan's frayed edge dissolves into the night
   instead of ending in ragged space (set once R is known, below) */
function setFog(rr){
  try{
    const fc=new pc.Color(0.004,0.008,0.016);
    const f=app.scene.fog;
    if(f && typeof f==='object'){ f.type='linear'; f.start=2.1*rr; f.end=4.2*rr; f.color=fc; }
    else { app.scene.fog=pc.FOG_LINEAR||'linear';
      app.scene.fogStart=2.1*rr; app.scene.fogEnd=4.2*rr; app.scene.fogColor=fc; }
  }catch(e){ console.warn('fog unsupported:', e.message); }
}

/* scene root: rotate scan-up onto world +y — up is up, always */
function rotationTo(a,b){                      // quat rotating unit vec a -> b
  const d=a.dot(b);
  if(d>0.9999) return new pc.Quat();
  if(d<-0.9999) return new pc.Quat().setFromAxisAngle(new pc.Vec3(1,0,0),180);
  const axis=new pc.Vec3().cross(a,b).normalize();
  return new pc.Quat().setFromAxisAngle(axis, Math.acos(d)*180/Math.PI);
}
const upQ=rotationTo(new pc.Vec3(...SCENE.up).normalize(), new pc.Vec3(0,1,0));
const sceneRoot=new pc.Entity('sceneRoot');
sceneRoot.setRotation(upQ);
app.root.addChild(sceneRoot);
/* the scan centre, in upright world space */
const C=new pc.Vec3(); upQ.transformVector(new pc.Vec3(...SCENE.c), C);
const R=SCENE.r;
setFog(R);
let WALKMAX=1.05*R;   // hand-placed stations may extend this

/* camera: y-up, orbiting the scan centre */
const CAM_TGT=C.clone();
const CAM_POS=new pc.Vec3(C.x+0.35*R, C.y+0.42*R, C.z-2.1*R);
const camE=new pc.Entity('cam');
camE.addComponent('camera', { clearColor:new pc.Color(0.004,0.008,0.016),
  fov:60, nearClip:0.05, farClip:200 });
app.root.addChild(camE);
camE.setPosition(CAM_POS); camE.lookAt(CAM_TGT, pc.Vec3.UP);

/* CONTROLS — the Jet Set Ducky 2 paradigm, verbatim: a floating
   joystick where the LEFT thumb lands walks you; the RIGHT half spins
   (drag: yaw, vertical: look); ⟲⟳ (or Q/E) snap the view a quarter
   turn. Same hands, same habits, both worlds. */
let dragging=null, yaw=0, pitch=0, distF=1, idle=0;
const TGT_CUR=CAM_TGT.clone();
let tgtGoal=CAM_TGT.clone();
const input={ jx:0, jy:0 };
const keys={};
const KEYMAP={ ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
               ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };
addEventListener('keydown',e=>{
  if(KEYMAP[e.code]!==undefined){ e.preventDefault(); keys[KEYMAP[e.code]]=true; }
  if(e.code==='KeyQ') snapYaw(90);
  if(e.code==='KeyE') snapYaw(-90);
});
addEventListener('keyup',e=>{ if(KEYMAP[e.code]!==undefined) keys[KEYMAP[e.code]]=false; });
const stickBase=document.getElementById('stickBase'), stickNub=document.getElementById('stickNub');
let stickId=null, stickOrigin=[0,0];
const touchVec=[0,0];
function showStick(x,y){ stickBase.style.display=stickNub.style.display='block';
  stickBase.style.left=(x-55)+'px'; stickBase.style.top=(y-55)+'px'; moveNub(x,y); }
function moveNub(x,y){ stickNub.style.left=(x-24)+'px'; stickNub.style.top=(y-24)+'px'; }
function hideStick(){ stickBase.style.display=stickNub.style.display='none'; touchVec[0]=touchVec[1]=0; }
const CTL_GUARD='#ebCopy,#panel,#menuBtn,#menu,#ebar,#rotL,#rotR,#mEdit';
let rotId=null, rotLast=[0,0];
addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
    if(t.target && t.target.closest && t.target.closest(CTL_GUARD)) continue;
    if(t.clientX < innerWidth*0.55 && stickId===null){
      stickId=t.identifier; stickOrigin=[t.clientX,t.clientY]; showStick(t.clientX,t.clientY);
    } else if(t.clientX >= innerWidth*0.55 && rotId===null){
      rotId=t.identifier; rotLast=[t.clientX,t.clientY];
    }
  }
},{passive:true});
addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===rotId){
      yaw-=(t.clientX-rotLast[0])*0.28; pitch+=(t.clientY-rotLast[1])*0.22;
      pitch=Math.max(-45,Math.min(60,pitch));
      rotLast=[t.clientX,t.clientY]; flight=null; idle=0;
    }
    if(t.identifier===stickId){
      let dx=t.clientX-stickOrigin[0], dy=t.clientY-stickOrigin[1];
      const len=Math.hypot(dx,dy);
      if(len>46){ dx*=46/len; dy*=46/len; }
      moveNub(stickOrigin[0]+dx, stickOrigin[1]+dy);
      touchVec[0]=Math.abs(dx)>7?dx/46:0;
      touchVec[1]=Math.abs(dy)>7?-dy/46:0;
    }
  }
},{passive:true});
function touchEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===stickId){ stickId=null; hideStick(); }
    if(t.identifier===rotId) rotId=null;
  }
}
addEventListener('touchend',touchEnd,{passive:true});
addEventListener('touchcancel',touchEnd,{passive:true});
/* desktop mouse: drag spins (dbdb2's mouse path) */
let mouseDrag=null;
addEventListener('mousedown',e=>{
  if(e.target.closest && e.target.closest(CTL_GUARD)) return;
  mouseDrag=[e.clientX,e.clientY]; });
addEventListener('mousemove',e=>{ if(!mouseDrag) return;
  yaw-=(e.clientX-mouseDrag[0])*0.28; pitch+=(e.clientY-mouseDrag[1])*0.22;
  pitch=Math.max(-45,Math.min(60,pitch));
  mouseDrag=[e.clientX,e.clientY]; flight=null; idle=0; });
addEventListener('mouseup',()=>{ mouseDrag=null; });
function readInput(){
  let jx=touchVec[0], jy=touchVec[1];
  if(keys.left) jx-=1; if(keys.right) jx+=1;
  if(keys.up) jy+=1; if(keys.down) jy-=1;

/* ambient drink: a ring of frame pixels around each gem, every ~1.5s
   (WebGL path; on WebGPU the palette colours simply remain) */
const glDev=app.graphicsDevice.gl||null;
let sampT=0; const _px=new Uint8Array(4);
app.on('postrender',()=>{
  if(!glDev||!loaded) return;
  if(++sampT%90) return;
  const gd=app.graphicsDevice;
  const kx=gd.width/innerWidth, ky=gd.height/innerHeight;
  for(const g of gems){
    if(g.found) continue;
    camE.camera.worldToScreen(g.grp.getPosition(), _scr);
    if(_scr.z<0) continue;
    let r=0,gg=0,b=0,n=0;
    for(const [ox,oy] of [[-38,0],[38,0],[0,-38],[0,38]]){
      const dx=Math.round((_scr.x+ox)*kx), dy=Math.round(gd.height-(_scr.y+oy)*ky);
      if(dx<0||dy<0||dx>=gd.width||dy>=gd.height) continue;
      try{ glDev.readPixels(dx,dy,1,1,glDev.RGBA,glDev.UNSIGNED_BYTE,_px); }
      catch(e){ return; }
      if(_px[0]+_px[1]+_px[2]<24) continue;      // the night void is not a colour
      r+=_px[0]; gg+=_px[1]; b+=_px[2]; n++;
    }
    if(!n) continue;
    const inv=1.35/(255*n);                       // a little brighter than life
    g.amb.r=g.amb.r*0.7+r*inv*0.3;
    g.amb.g=g.amb.g*0.7+gg*inv*0.3;
    g.amb.b=g.amb.b*0.7+b*inv*0.3;
  }
});

function splatHit(cx,cy){
  if(!editPts) return null;
  const ro=camE.getPosition(), rd=new pc.Vec3();
  const scale=1;  // pc 2.x worldToScreen/screenToWorld speak CSS px (dpr bug, diagnosed on iPhone)
  camE.camera.screenToWorld(cx*scale,cy*scale,camE.camera.farClip,rd);
  rd.sub(ro).normalize();
  const rad2=0.018*R*R;
  let best=Infinity;
  for(let i=0;i<editPts.length;i+=9){          // every 3rd splat: plenty
    const px2=editPts[i]-ro.x, py2=editPts[i+1]-ro.y, pz2=editPts[i+2]-ro.z;
    const t3=px2*rd.x+py2*rd.y+pz2*rd.z;
    if(t3<0.2*R||t3>=best) continue;
    const dx=px2-rd.x*t3, dy=py2-rd.y*t3, dz=pz2-rd.z*t3;
    if(dx*dx+dy*dy+dz*dz<rad2) best=t3;
  }
  if(best===Infinity) return null;
  return new pc.Vec3().copy(rd).mulScalar(best).add(ro);
}
let lastYaw=0, lastPit=0, lastD=0.68;
function editPlace(cx,cy){
  const h=splatHit(cx,cy);
  if(!h) return false;
  lastPlace=h;
  const cp=camE.getPosition();
  lastYaw=Math.atan2(cp.x-h.x, cp.z-h.z)*180/Math.PI;
  /* pitch and distance of the CURRENT view of the placed point, in the
     orbit rig's own terms — so arrival reproduces the owner's exact view */
  const baseElev=Math.atan2(base.y, Math.hypot(base.x,base.z))*180/Math.PI;
  /* positive pitch LOWERS the camera in this rig, so store the flip */
  lastPit=baseElev - Math.atan2(cp.y-h.y, Math.hypot(cp.x-h.x,cp.z-h.z))*180/Math.PI;
  lastD=Math.min(1.5, Math.max(0.2, cp.distance(h)/base.length()));
  if(!ghost) ghost=makePETmarker([h.x,h.y,h.z]);
  ghost.setPosition(h.x,h.y,h.z);
  ghost.setEulerAngles(0,lastYaw,0);
  document.getElementById('ebInfo').textContent=
    'PET at '+h.x.toFixed(2)+', '+h.y.toFixed(2)+', '+h.z.toFixed(2)+' — COPY DATA when happy';
  return true;
}

/* one update hook: orbit, flights, gem shimmer, motes *//* one update hook: orbit, flights, clue pulse, motes, panel */
let t=0;
app.on('update', dt=>{
  t+=dt; idle+=dt;
  upSparks(dt);
  if(flight){
    flight.t+=dt;
    const k=ease(Math.min(1,flight.t/flight.dur));
    yaw=flight.yaw0+(flight.yaw1-flight.yaw0)*k;
    pitch=flight.p0+(flight.p1-flight.p0)*k;
    distF=flight.d0+(flight.d1-flight.d0)*k;
    idle=0;
    if(flight.t>=flight.dur){ const f=flight.onDone; flight=null; if(f) f(); }
  } else if(idle>2.5) yaw+=dt*3.5;              // the dream drifts
  /* the stick walks the drift, dbdb2-style: screen-relative, rotating
     with the CURRENT camera bearing (last frame's offset is fine) */
  readInput();
  if(input.jx||input.jy){
    flight=null; idle=0;
    const fl=Math.hypot(_off.x,_off.z)||1;
    const fx=-_off.x/fl, fz=-_off.z/fl;
    const rx=-fz, rz=fx;
    const sp=0.5*R*dt;
    TGT_CUR.x += (rx*input.jx + fx*input.jy)*sp;
    TGT_CUR.z += (rz*input.jx + fz*input.jy)*sp;
    tgtGoal=TGT_CUR.clone();
  }
  TGT_CUR.lerp(TGT_CUR, tgtGoal, Math.min(1,dt*2.5));
  /* stay inside the scan's dense core (R is the per-scene 70th-pct
     density radius — our heuristic for "the realistic zone"): the
     ragged digitisation fringe stays at arm's length */
  { const dx0=TGT_CUR.x-C.x, dz0=TGT_CUR.z-C.z, d0=Math.hypot(dx0,dz0);
    const MAXW=WALKMAX;
    if(d0>MAXW){
      TGT_CUR.x=C.x+dx0/d0*MAXW; TGT_CUR.z=C.z+dz0/d0*MAXW;
      tgtGoal.x=TGT_CUR.x; tgtGoal.z=TGT_CUR.z;
    } }
  distF=Math.max(MINDF,Math.min(1.5,distF));
  _q1.setFromAxisAngle(pc.Vec3.UP, yaw);
  _q2.setFromAxisAngle(side, pitch);
  /* pitch FIRST (about the boot side axis, in the boot frame), THEN yaw
     about world-up: pitch is a true elevation at every bearing. The old
     order (yaw then boot-side pitch) tilted sideways once yawed far. */
  _q2.transformVector(base,_off); _q1.transformVector(_off,_off);
  _off.mulScalar(distF);
  _pos.add2(TGT_CUR,_off);
  camE.setPosition(_pos);
  camE.lookAt(TGT_CUR, pc.Vec3.UP);
  gems.forEach((g,i)=>{
    g.grp.setEulerAngles(0,(t*(26+i*8))%360,0);
    const p=g.grp.getPosition();
    g.grp.setPosition(p.x, g.baseY+Math.sin(t*1.3+i*1.9)*0.02*R, p.z);
    if(g.found) return;
    const s=1+Math.sin(t*2.7+i*1.7)*0.16;
    g.core.setLocalScale(0.06*R*s,0.10*R*s,0.06*R*s);
    const hh=1+Math.sin(t*2.1+i)*0.35;
    g.halo.setLocalScale(0.13*R*hh,0.20*R*hh,0.13*R*hh);
    /* shimmer: the drunk ambient colour, breathing, with a white glint */
    const w=0.62+0.5*Math.sin(t*3.1+i*2.3);
    const gl2=Math.max(0,Math.sin(t*5.3+i*4.1)-0.92)*9;
    g.core.render.meshInstances[0].setParameter('material_emissive',
      [Math.min(1,g.amb.r*w+gl2), Math.min(1,g.amb.g*w+gl2), Math.min(1,g.amb.b*w+gl2)]);
  });
  for(const m of motes){
    m.a+=dt*m.sp;
    m.e.setPosition(C.x+Math.cos(m.a)*m.rr,
      C.y+m.h+Math.sin(t*0.4+m.ph)*0.06*R,
      C.z+Math.sin(m.a)*m.rr);
  }
});

if(inkStory){
  try{
    inkStory.variablesState.$('gems', Math.max(0,parseInt(Q.get('g')||'0',10)||0));
    inkStory.variablesState.$('diamonds', Math.max(0,parseInt(Q.get('di')||'0',10)||0));
  }catch(e){}
}
function updateTally(){
  document.getElementById('clueTally').textContent='\u25c6 '+vs('gems')+' \u00b7 \u25c7 '+vs('diamonds');
  if(typeof WRITINGS!=='undefined')
    for(const W of WRITINGS) if(W.type==='score') drawWriting(W);
}

/* choices choreograph the camera */
/* the tour: four stations around the scan — ink choices carry you
   from area to area, showing the place off on the way */
const TOUR=[[0.55,0.05,0],[0,0.02,0.55],[-0.55,0.08,0],[0,0.05,-0.55]]
  .map(o=>new pc.Vec3(C.x+o[0]*R, C.y+o[1]*R, C.z+o[2]*R));
/* curated stations may sit closer than the generic 0.45 zoom floor */
let MINDF=0.45;
STN.forEach(s=>{ if(s.d) MINDF=Math.min(MINDF, s.d); });
STN.forEach((s,i)=>{ if(i>=TOUR.length) return;
  TOUR[i]=new pc.Vec3(s.p[0],s.p[1],s.p[2]);
  /* a curated point is authoritative: the walk fence grows to reach it */
  WALKMAX=Math.max(WALKMAX, Math.hypot(s.p[0]-C.x,s.p[2]-C.z)+0.15*R);
});
/* every station IS a gem: the pretty places are the collectibles.
   Two wild gems drift off the beaten track. */
TOUR.forEach(p=>spawnGem(p.x,p.y,p.z));
for(const o of GEM_WILD) spawnGem(C.x+o[0]*R, C.y+o[1]*R, C.z+o[2]*R);

/* =========================================================
   WRITINGS — clues, clocks, scores, codes, written onto the
   scan's own flat surfaces (walls catalogued semi-automatedly
   by tools/wall-scout.mjs, then reviewed by eye). The plates
   write depth, so the gaussians occlude them naturally.
   ========================================================= */
const WRITINGS=[];
const W_TYPES=['code','clock','score','note'];
function drawWriting(W){
  const g=W.ctx;
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle='rgba(2,10,5,0.94)'; g.fillRect(0,0,256,128);
  g.strokeStyle=tint; g.lineWidth=2; g.strokeRect(3,3,250,122);
  g.fillStyle=tint; g.textAlign='center';
  if(W.type==='code'){
    g.font='bold 30px monospace';
    g.fillText(SCENE.code||SCENEKEY.toUpperCase(),128,58);
    g.font='11px monospace'; g.globalAlpha=.6;
    g.fillText('REMEMBER THE WORD',128,96); g.globalAlpha=1;
  } else if(W.type==='clock'){
    const d=new Date();
    g.font='bold 40px monospace';
    g.fillText(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),128,66);
    g.font='11px monospace'; g.globalAlpha=.6;
    g.fillText('THE DRIFT KEEPS TIME',128,100); g.globalAlpha=1;
  } else if(W.type==='score'){
    g.font='bold 28px monospace';
    g.fillText('\u25c6 '+vs('gems')+'   \u25c7 '+vs('diamonds'),128,58);
    g.font='11px monospace'; g.globalAlpha=.6;
    g.fillText('GEMS \u00b7 DIAMONDS',128,96); g.globalAlpha=1;
  } else {
    g.font='13px monospace';
    g.fillText('THE STATIC WROTE THIS',128,52);
    g.fillText('WHILE YOU WERE AWAY',128,78);
  }
  W.tex.setSource(W.cv);
}
function spawnWriting(wd,i){
  const cv=document.createElement('canvas'); cv.width=256; cv.height=128;
  const ctx=cv.getContext('2d');
  const tex=new pc.Texture(app.graphicsDevice,{ width:256, height:128,
    format:pc.PIXELFORMAT_R8_G8_B8_A8, mipmaps:false });
  tex.minFilter=pc.FILTER_LINEAR; tex.magFilter=pc.FILTER_LINEAR;
  const m=new pc.StandardMaterial();
  m.useLighting=false; m.diffuse=new pc.Color(0,0,0);
  m.emissive=new pc.Color(1,1,1); m.emissiveMap=tex;
  m.update();
  const parent2=new pc.Entity('writing');
  const pl=new pc.Entity('pl');
  pl.addComponent('render',{ type:'plane' });
  pl.render.meshInstances[0].material=m;
  pl.setLocalEulerAngles(90,0,0);              // plane +y -> facing +z
  const w=wd.w||0.5*R;
  pl.setLocalScale(w,1,w*0.5);
  parent2.addChild(pl);
  const ar=wd.yaw*Math.PI/180;
  parent2.setPosition(wd.p[0]+Math.sin(ar)*0.04*R, wd.p[1], wd.p[2]+Math.cos(ar)*0.04*R);
  parent2.setEulerAngles(0,wd.yaw,0);
  app.root.addChild(parent2);
  const W={ cv, ctx, tex, type:W_TYPES[i%W_TYPES.length] };
  WRITINGS.push(W); drawWriting(W);
}
(SCENE.walls||[]).forEach((wd,i)=>spawnWriting(wd,i));
setInterval(()=>{ for(const W of WRITINGS) if(W.type==='clock') drawWriting(W); }, 30000);
let tourI=0;
/* the one true port flight: absolute per-station bearing (hand-placed
   yaw wins over the computed corner), so the same port always lands in
   the same pose. Already there? A slow full-circle flourish says so.
   opts.arrive: the quiet sweep-in when surfacing from another scan. */
function flyStation(sti, opts={}){
  document.getElementById('hudLoc').textContent='PORT/7 · '+NAMES[sti];
  const bAng=Math.atan2(base.x,base.z)*180/Math.PI;
  const aim=STN[sti]?STN[sti].yaw:(sti*90+40);
  let want=aim-bAng-yaw;
  while(want>180) want-=360; while(want<-180) want+=360;
  const s=STN[sti]||{};
  const pit=(s.pit!==undefined)?s.pit:(4+sti*3);
  const dst=s.d||0.68;
  const there = !opts.arrive && Math.abs(want)<12 && TGT_CUR.distance(TOUR[sti])<0.25*R;
  fly(there
    ? { dYaw:360, toPitch:pit, toDist:dst, tgt:TOUR[sti], dur:6 }
    : { dYaw:want+(opts.arrive?-360:0), toPitch:pit, toDist:dst,
        tgt:TOUR[sti], dur:opts.arrive?5.5:5, quiet:!!opts.arrive });
}
function choiceFlight(label){
  const L=label.toLowerCase();
  const sti=NAMES.findIndex(n=>label.includes(n));
  /* a grown port: leave the scans for a STAMPED world (splatpack) */
  if(L.startsWith('grown port')){
    const lay=label.includes('JUNGLE')?'jungle':'maze';
    termClose();
    fly({ dYaw:200, toPitch:26, toDist:1.9, tgt:CAM_TGT, dur:2.6, onDone:()=>{
      location.href='splatpack.html?lay='+lay+'&play=1&embed=1';
    }});
    return 'far';
  }
  /* a far station: "⇒ NAME · scenekey" — burn the gem, surface there */
  const fm=label.match(/^\u21d2 (.+) \u00b7 ([a-z]+)$/);
  if(fm && SCENES[fm[2]]){
    const k=fm[2];
    const fsti=Math.max(0,[0,1,2,3].map(i=>nameOf(k,i)).indexOf(fm[1]));
    termClose();
    fly({ dYaw:200, toPitch:26, toDist:1.9, tgt:CAM_TGT, dur:2.6, onDone:()=>{
      const u=new URL(location.href);
      u.searchParams.set('scene',k); u.searchParams.set('far','1');
      u.searchParams.set('st',String(fsti));
      u.searchParams.set('g',String(vs('gems')));       // post-burn values:
      u.searchParams.set('di',String(vs('diamonds')));  // the go knot ran first
      location.href=u.toString();
    }});
    return 'far';
  }
  if(L.startsWith('port') && sti>=0){ flyStation(sti); return 'close'; }
  if(L.includes('whisper')){
    const g=gems.find(g2=>!g2.found);
    if(g) fly({ dYaw:120, toPitch:8, toDist:0.6, tgt:g.grp.getPosition(), dur:4 });
    return 'close';
  }
  if(L.includes('wake')) return 'wake';
  if(L.includes('drift')||L.includes('keep the gem')||L.includes('pocket')) return 'close';
  return null;
}
function renderInk(){
  if(!inkStory) return;
  const out=[];
  while(inkStory.canContinue){
    const line=inkStory.Continue().trim();
    if(line) out.push(line);
  }
  if(out.length) panelLines=out;
  panelChoices=inkStory.currentChoices.map(c=>c.text);
  updateTally();
  domRender();
}
function chooseChoice(i){
  const c=inkStory && inkStory.currentChoices[i]; if(!c) return;
  const kind=choiceFlight(c.text);
  inkStory.ChooseChoiceIndex(i); renderInk();
  if(kind==='close') termClose();
  /* WAKE cashes out: needs the banked diamonds, ends the story */
  if(kind==='wake' && !inkStory.canContinue
     && inkStory.currentChoices.length===0 && vs('diamonds')>=3){
    termClose();
    fly({ dYaw:180, toPitch:42, toDist:2.4, tgt:CAM_TGT, dur:3.2, onDone:finish });
  }
}
function finish(){
  parent.postMessage({ jsdDream:'complete', clues:3, diamonds:vs('diamonds') }, '*');
}

/* =========================================================
   clue hunting — precise screen-space taps
   ========================================================= */
const _scr=new pc.Vec3(), _to=new pc.Vec3();
let downAt=null;
addEventListener('pointerdown', e=>{ downAt=[e.clientX,e.clientY]; });
addEventListener('pointerup', e=>{
  if(!downAt) return;
  const moved=Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]);
  downAt=null;
  if(moved>8 || !loaded) return;
  if(e.target.closest && e.target.closest(CTL_GUARD)) return;
  if(termIsOpen) return;                          // the terminal owns the screen
  if(editOn){ editPlace(e.clientX, e.clientY); return; }
  const scale=1;  // pc 2.x worldToScreen/screenToWorld speak CSS px (dpr bug, diagnosed on iPhone)
  let best=null, bd=52*scale;
  for(const g of gems){
    if(g.found) continue;
    _to.sub2(g.grp.getPosition(), camE.getPosition());
    if(_to.dot(camE.forward)<=0) continue;           // behind the camera
    camE.camera.worldToScreen(g.grp.getPosition(), _scr);
    const d=Math.hypot(_scr.x-e.clientX*scale, _scr.y-e.clientY*scale);
    if(d<bd){ bd=d; best=g; }
  }
  if(best) collect(best);
});
function collect(g){
  g.found=true;
  g.halo.enabled=false;
  g.core.render.meshInstances[0].setParameter('material_emissive',[1,1,1]);
  if(inkStory){ try{ inkStory.variablesState.$('gems', vs('gems')+1); }catch(e){} }
  updateTally();
  ping(vs('gems'));
  try{ navigator.vibrate && navigator.vibrate([18,26,40]); }catch(e){}
  starBurst(g.grp.getPosition());
  /* a short savouring flight, then the terminal takes the screen */
  fly({ dYaw:50, toDist:Math.max(MINDF,0.55), tgt:g.grp.getPosition(), dur:1.6, quiet:true,
    onDone:()=>{ if(inkStory){ try{ inkStory.ChoosePathString('gem'); }catch(e){}
      renderInk(); termOpen(); } } });
}

/* STAR BURST — a handful of glittering, SPINNING stars out of every
   claimed gem: canvas-glyph billboards with gravity, camera-facing
   with a roll, shrinking away as they die */
let starTex=null;
function starTexture(){
  if(starTex) return starTex;
  const cv=document.createElement('canvas'); cv.width=cv.height=64;
  const g=cv.getContext('2d');
  g.font='52px "Noto Color Emoji","Apple Color Emoji",sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText('\u2b50', 32, 36);
  starTex=new pc.Texture(app.graphicsDevice,{ width:64, height:64,
    format:pc.PIXELFORMAT_R8_G8_B8_A8, mipmaps:false });
  starTex.minFilter=pc.FILTER_LINEAR; starTex.magFilter=pc.FILTER_LINEAR;
  starTex.setSource(cv);
  return starTex;
}
const sparks=[];
function starBurst(at){
  for(let i=0;i<8;i++){
    const e=new pc.Entity('spark');
    const pl=new pc.Entity('pl');
    pl.addComponent('render',{ type:'plane' });
    const m=new pc.StandardMaterial();
    m.useLighting=false; m.diffuse=new pc.Color(0,0,0);
    m.emissive=new pc.Color(1,1,1);
    m.blendType=pc.BLEND_NONE; m.alphaTest=0.3; m.depthWrite=true;
    m.cull=pc.CULLFACE_NONE;
    m.emissiveMap=starTexture(); m.opacityMap=starTexture(); m.opacityMapChannel='a';
    m.update();
    pl.render.meshInstances[0].material=m;
    pl.setLocalEulerAngles(90,0,0);
    e.addChild(pl);
    app.root.addChild(e);
    e.setPosition(at.x,at.y,at.z);
    const a=Math.random()*6.2832, v=0.5+Math.random()*0.8;
    sparks.push({ e, x:at.x, y:at.y, z:at.z,
      vx:Math.sin(a)*v, vy:0.9+Math.random()*0.8, vz:Math.cos(a)*v,
      base:0.05+Math.random()*0.05, roll:Math.random()*360,
      rollV:520+Math.random()*400, life:0.8+Math.random()*0.35 });
  }
}
function upSparks(dt){
  if(!sparks.length) return;
  const cp=camE.getPosition();
  for(let i=sparks.length-1;i>=0;i--){
    const sp=sparks[i];
    sp.life-=dt;
    if(sp.life<=0){ sp.e.destroy(); sparks.splice(i,1); continue; }
    sp.vy-=2.6*dt;
    sp.x+=sp.vx*dt; sp.y+=sp.vy*dt; sp.z+=sp.vz*dt;
    sp.roll+=sp.rollV*dt;
    sp.e.setPosition(sp.x,sp.y,sp.z);
    const camB=Math.atan2(cp.x-sp.x,cp.z-sp.z)*180/Math.PI;
    sp.e.setEulerAngles(0,camB,sp.roll%360);        // the SPIN
    const sc=sp.base*Math.min(1,sp.life*3);
    sp.e.children[0].setLocalScale(sc,1,sc);
  }
}

/* audio: one chime per clue + a riser under each flight.
   Mobile-lean WebAudio: a handful of nodes, audio-rate ramps,
   no per-frame JS scheduling. The tap itself is the gesture. */
let actx=null;
function ping(n){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime+0.02;
    [76+n*3, 83+n*3].forEach((m,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='triangle'; o.frequency.value=440*Math.pow(2,(m-69)/12);
      g.gain.setValueAtTime(0.12, t0+i*0.09);
      g.gain.setTargetAtTime(0.0001, t0+i*0.09+0.04, 0.2);
      o.connect(g); g.connect(actx.destination);
      o.start(t0+i*0.09); o.stop(t0+i*0.09+0.8);
    });
  }catch(e){}
}
function riser(dur){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime+0.02;
    const o=actx.createOscillator(), f=actx.createBiquadFilter(), g=actx.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(55, t0);
    o.frequency.exponentialRampToValueAtTime(220, t0+dur*0.9);
    f.type='lowpass'; f.Q.value=6;
    f.frequency.setValueAtTime(180, t0);
    f.frequency.exponentialRampToValueAtTime(1400, t0+dur*0.9);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.05, t0+dur*0.35);
    g.gain.setTargetAtTime(0.0001, t0+dur*0.9, 0.2);
    o.connect(f); f.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0+dur+0.6);
  }catch(e){}
}

menu.querySelector('#mExit').addEventListener('click', ()=>{
  parent.postMessage({ jsdDream:'exit' }, '*');
});

/* headless-test hook */
window.__dream = {
  get loaded(){ return loaded; },
  get splatOk(){ return splatOk; },
  get mode(){ return mode; },
  get scene(){ return SCENE.credit; },
  get flying(){ return !!flight; },
  get panelText(){ return panelLines.join(' '); },
  get panelChoices(){ return panelChoices.slice(); },
  get termOpen(){ return termIsOpen; },
  get econ(){ return { gems:vs('gems'), diamonds:vs('diamonds') }; },
  get gemStates(){ return gems.map(g=>g.found); },
  tap(i){ collect(gems[i]); },
  proj(i){ const scale=1;  // pc 2.x worldToScreen/screenToWorld speak CSS px (dpr bug, diagnosed on iPhone)
    camE.camera.worldToScreen(gems[i].grp.getPosition(), _scr);
    return { x:_scr.x/scale, y:_scr.y/scale }; },
  choose(i){ chooseChoice(i); },
  openTerm(){ if(inkStory){ try{ inkStory.ChoosePathString('hub'); }catch(e){}
    renderInk(); termOpen(); } },
  closeTerm(){ termClose(); },
  editPlace(x,y){ return editPlace(x,y); },
  get lastPlace(){ return lastPlace?[+lastPlace.x.toFixed(3),+lastPlace.y.toFixed(3),+lastPlace.z.toFixed(3)]:null; },
  setCam(px,py,pz,tx,ty,tz){ CAM_POS.set(px,py,pz); CAM_TGT.set(tx,ty,tz);
    tgtGoal=CAM_TGT.clone(); TGT_CUR.copy(CAM_TGT);
    base.sub2(CAM_POS,CAM_TGT); side.cross(pc.Vec3.UP,base).normalize();
    /* a tool that places the camera means it: lift the walk fence to
       reach, or the per-frame clamp silently drags the target home and
       every recorded pose lies (the garden scout fell for this) */
    WALKMAX=Math.max(WALKMAX, Math.hypot(tx-C.x,tz-C.z)+0.05*R);
    yaw=0; pitch=0; distF=1; flight=null; },
  mats(){ return { cam:[...camE.getWorldTransform().data],
    proj:[...camE.camera.projectionMatrix.data] }; },
  get lastYaw(){ return +lastYaw.toFixed(1); },
  get centers(){ return editPts; },   // world-space scan points (edit mode)
  get frame(){ return { C:[C.x,C.y,C.z], R:R, baseLen:base.length(),
    baseElev:Math.atan2(base.y,Math.hypot(base.x,base.z))*180/Math.PI }; },
  exit(){ menu.querySelector('#mExit').click(); },
};
</script>
