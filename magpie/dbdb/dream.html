<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#010204">
<title>THE STATIC DREAM</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; overflow:hidden; background:#010204;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    font-family:"Courier New",ui-monospace,monospace; color:#9fe8b0;
  }
  #stage { position:fixed; inset:0; }
  #stage canvas { width:100%; height:100%; display:block; }
  /* phosphor dressing: the whole page IS the terminal's screen */
  #phos {
    position:fixed; inset:0; pointer-events:none; z-index:6;
    background:
      radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,20,8,.55) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, rgba(0,0,0,0) 1px 3px);
  }
  #head {
    position:fixed; top:0; left:0; right:0; z-index:8; display:flex;
    justify-content:space-between; padding:10px 110px 8px 14px; pointer-events:none;
    font-size:11px; letter-spacing:.3em; color:rgba(159,232,176,.75);
    text-shadow:0 0 8px rgba(80,255,140,.5);
  }
  #clueTally { pointer-events:none; }
  #exitBtn {
    position:fixed; top:6px; right:8px; z-index:9;
    background:rgba(0,30,12,.6); border:1px solid rgba(159,232,176,.5);
    color:#9fe8b0; font-family:inherit; font-size:11px; letter-spacing:.2em;
    padding:6px 10px; border-radius:4px; cursor:pointer;
  }
  #loadLine {
    position:fixed; left:14%; right:14%; top:52%; z-index:7; text-align:center;
    font-size:12px; letter-spacing:.28em; color:rgba(159,232,176,.8);
    text-shadow:0 0 10px rgba(80,255,140,.6);
  }
  /* the mini terminal IN the world (CSS matrix3d over the canvas) */
  #css3d { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:7; }
  #css3dCam { width:100%; height:100%; transform-style:preserve-3d; pointer-events:none; }
  #panel {
    position:fixed; left:0; top:0; transform-origin:50% 50%;
    width:300px; min-height:180px; max-height:340px; overflow-y:auto;
    padding:12px 14px;
    background:rgba(1,10,5,.9); border:2px solid rgba(159,232,176,.55);
    border-radius:8px; box-shadow:0 0 40px rgba(80,255,140,.22), inset 0 0 30px rgba(0,0,0,.7);
    font-size:13px; line-height:1.5; pointer-events:auto;
  }
  #panel .crest { font-size:9px; letter-spacing:.3em; opacity:.65; margin-bottom:6px; }
  #readBtn { position:fixed; bottom:12px; right:10px; z-index:9;
    background:rgba(0,30,12,.7); border:2px solid rgba(159,232,176,.6);
    color:#9fe8b0; font-family:inherit; font-size:15px; font-weight:bold;
    padding:9px 13px; border-radius:8px; cursor:pointer; }
  #panel.read { position:fixed !important; left:4vw !important; right:4vw !important;
    top:11vh !important; width:auto !important; max-height:72vh !important;
    transform:none !important; font-size:17px !important; }
  #panel.read .choice { font-size:16px; padding:12px 14px; }
  #panel.read p { font-size:17px; }
  #panel p { margin:0 0 8px; animation:inkIn .7s ease both;
    text-shadow:0 0 6px rgba(80,255,140,.35); }
  @keyframes inkIn { from{opacity:0; transform:translateY(6px); filter:blur(4px);}
                     to{opacity:1; transform:none; filter:none;} }
  #panel .choice {
    display:block; width:100%; margin-top:6px; padding:8px 10px; text-align:left;
    background:rgba(80,255,140,.08); border:1px solid rgba(159,232,176,.45);
    border-radius:4px; color:#c9ffd6; font-family:inherit; font-size:12.5px;
    letter-spacing:.06em; cursor:pointer; animation:inkIn .7s ease both;
  }
  #panel .choice:active { background:rgba(80,255,140,.28); }
  #err { position:fixed; inset:auto 0 0 0; z-index:50; color:#ff9a9a; background:rgba(30,0,0,.92); padding:8px; font-size:11px; display:none; white-space:pre-wrap; }
  #menuBtn { position:fixed; bottom:12px; left:10px; z-index:9;
    background:rgba(2,16,8,.72); border:1px solid; border-radius:6px;
    font:bold 14px monospace; padding:8px 13px; }
  #menu { position:fixed; bottom:58px; left:10px; z-index:21;
    background:rgba(1,10,5,.95); border:1px solid; border-radius:8px;
    padding:10px; font:12px monospace; display:flex; flex-direction:column;
    gap:8px; max-width:80vw; }
  #menu button { background:none; border:1px solid currentColor; color:inherit;
    font:12px monospace; padding:8px 10px; border-radius:4px; text-align:left; }
  #menu .prow { display:flex; flex-wrap:wrap; gap:6px; }
  #menu .prow button { padding:6px 8px; font-size:11px; }
  #menu .mLbl { opacity:.6; font-size:10px; letter-spacing:.2em; }
  #menu .mCred { opacity:.5; font-size:9px; max-width:260px; }
  /* the edit bar docks at the very bottom: lift the corner buttons over it */
  body.edit #readBtn, body.edit #menuBtn { bottom:64px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="phos"></div>
<div id="head"><span id="hudLoc">PORT/7 · DREAM SHELL</span><span id="clueTally">CLUES 0/3</span></div>
<button type="button" id="exitBtn">✕ SURFACE</button>
<div id="loadLine">TUNING THE STATIC…</div>
<button type="button" id="readBtn" aria-label="toggle large reading mode">⤢ READ</button>
<div id="css3d"><div id="css3dCam">
  <div id="panel"><div class="crest">PORT/7 TERMINAL</div><div class="inkText"></div><div class="choices"></div></div>
</div></div>
<pre id="err"></pre>

<script src="../../third_party/ink/ink-full.min.js"></script>
<script type="module">
const errBox=document.getElementById('err');
window.addEventListener('error', e=>{ errBox.style.display='block';
  errBox.textContent += (e.message||e.error)+'\n'; });
window.addEventListener('unhandledrejection', e=>{ errBox.style.display='block';
  errBox.textContent += 'async: '+(e.reason&&e.reason.message||e.reason)+'\n'; });

const Q=new URLSearchParams(location.search);
/* each candy PET tints the dream shell its own phosphor */
const TINTS={ bondi:'#8fd8e8', strawberry:'#ffa8b6', tangerine:'#ffc896',
              lime:'#c8f0a0', grape:'#cfaef5' };
const tint=TINTS[Q.get('tint')]||'#9fe8b0';
for(const id of ['head','exitBtn','loadLine']){
  const el=document.getElementById(id); if(el) el.style.color=tint;
}
document.getElementById('exitBtn').style.borderColor=tint;
const readBtn=document.getElementById('readBtn');
readBtn.style.color=tint; readBtn.style.borderColor=tint;
let readMode=false;
readBtn.addEventListener('click',()=>{
  readMode=!readMode;
  readBtn.textContent=readMode?'⤢ WORLD':'⤢ READ';
});
if(parent!==window)                        // framed in dbdb2: clear its EJECT button
  document.getElementById('head').style.paddingLeft='104px';

/* =========================================================
   HTML-IN-CANVAS probe — the emerging web API family that
   would retire our hand-drawn plate: 2D ctx.drawElement()
   and WebGPU queue.copyElementImageToTexture(). When either
   ships where we run, the live DOM renders INTO the scene.
   ?hic=1 shows the report on-screen and, if drawElement
   exists, uses it live for the plate texture.
   ========================================================= */
const HIC2D = typeof CanvasRenderingContext2D!=='undefined'
  && 'drawElement' in CanvasRenderingContext2D.prototype;
const HICGPU = !!(navigator.gpu && typeof GPUQueue!=='undefined'
  && 'copyElementImageToTexture' in GPUQueue.prototype);
let hicLive = HIC2D && Q.has('hic');   // opt-in until testable in the field
console.log('html-in-canvas: drawElement', HIC2D, '· copyElementImageToTexture', HICGPU);
if(Q.has('hic')){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;bottom:12px;left:10px;z-index:9;font:11px monospace;'
    +'color:'+tint+';background:rgba(0,20,8,.7);padding:6px 9px;border:1px solid '+tint+';border-radius:6px;';
  d.textContent='HIC drawElement:'+(HIC2D?'YES':'no')+' gpuCopy:'+(HICGPU?'YES':'no')
    +(hicLive?' · LIVE DOM PLATE':'');
  document.body.appendChild(d);
}

/* =========================================================
   THE PORTS — every scan CC-permissive, every scan shown
   upright: the scene root is rotated so the scan's own up
   becomes world +y, and everything else lives in y-up space.
   ========================================================= */
const SCENES={
  tree:  { names:['HEARTH','TINSEL','ROOTS','STARWARD'], ply:'splats/christmas-tree-150k.compressed.ply',
           /* st: hand-placed stations (owner, via ?edit=1) — each overrides
              the computed TOUR corner of the same index: name, world pos,
              arrival camera bearing */
           st:[{n:'SHED WINDOW', p:[5.302,0.581,-1.589], yaw:103.9},
               {n:'THE CAR',     p:[-4.278,0.118,1.979], yaw:-47.7},
               {n:'GREENZONE',   p:[1.248,0.295,-0.039], yaw:55.9}],
           hq:'splats/christmas-tree-400k.compressed.ply',
           raw:'splats/christmas-tree-150k.splat',
           up:[-0.522,0.836,0.168], c:[-0.4,-0.1,0.9], r:2.6,
           pal:['#d8d8d8','#f0f0f0','#a8a8a8','#55a049','#b83932','#e8b48c'],
           what:"a pine tree standing in somebody's scanned-in winter, holding its breath",
           credit:'ChristmasTree · keijiro-tk/splat-data · The Unlicense' },
  guitar:{ ply:'splats/guitar.compressed.ply',
           up:[0,-1,0], c:[0.15,-1.62,0.22], r:2.0,
           pal:['#a87848','#d8a878','#784818','#a8a8a8','#e8d8b0','#787878'],
           what:'a guitar, still holding its last chord',
           credit:'guitar · playcanvas/engine examples · MIT' },
  skull: { ply:'splats/skull-120k.compressed.ply',
           up:[0,-1,0], c:[-0.05,-0.82,-0.10], r:1.4,
           pal:['#d8a878','#a87848','#f0e0c0','#784818','#484818','#181818'],
           what:'a skull, grinning politely at the drift',
           credit:'skull · playcanvas/engine examples · MIT' },
  biker: { ply:'splats/biker.compressed.ply',
           up:[0,-1,0], c:[-0.03,-1.60,0.02], r:1.8,
           pal:['#a8a8a8','#d8d8d8','#787878','#784848','#f0e8d8','#484848'],
           what:'a motorcycle, parked forever in the static',
           credit:'biker · playcanvas/engine examples · MIT' },
  garden:{ names:['LILYPAD','CANOPY','BRICKPATH','MANGROVE'], ply:'splats/garden-sog/meta.json',
           up:[0,-1,0], c:[0,0,0], r:4.2,
           pal:['#7da05a','#a8c878','#d8e8c0','#8a9a78','#c8b890','#587048'],
           what:'a tropical glasshouse, breathing green in the static',
           credit:'Botanical Garden Kiel, Victoria House · Simon Bethke · superspl.at/scene/6f697c4d · CC BY 4.0' },
  forest:{ names:['TRAILHEAD','UNDERWOOD','CLEARING','MOSSBANK'], ply:'splats/forest.sog',
           up:[0,-1,0], c:[-0.63,-0.57,0.74], r:4.0,
           pal:['#487818','#184818','#787818','#a8c878','#484818','#8a9a58'],
           what:'a forest path, mid-stride, holding the light between trunks',
           credit:'Forest path · Pavel Tanhauser · superspl.at/scene/2be1a75a · CC BY 4.0' },
  carshop:{ names:['OILCAN','WORKBENCH','TINROOF','YARD'], ply:'splats/carshop.sog',
           up:[0,-1,0], c:[0.42,-1.21,-0.26], r:3.6,
           pal:['#a87848','#784818','#d8a878','#787878','#484848','#c8b890'],
           what:'a ghost-town car shop, dust settling on old machines',
           credit:'Nelson Ghost Town Car Shop · Paolo Tosolini · superspl.at/scene/dd8d9c8b · CC BY 4.0' },
  museum:{ names:['PORTICO','GALLERY','LAWN','COLONNADE'], ply:'splats/museum.sog',
           up:[0,-1,0], c:[0.11,-0.9,-0.03], r:15.0,
           pal:['#181818', '#484818', '#484848', '#787848', '#184818', '#787878'],
           what:'an art museum after hours, the paintings listening',
           credit:'Buffalo AKG Art Museum · Justin Eastman · superspl.at/scene/fadf93a0 · CC BY 4.0' },
  pool:{ names:['DEEPEND','SUNDECK','LADDER','SHALLOWS'], ply:'splats/pool.sog',
           up:[0,-1,0], c:[-4.43,-4.59,-2.64], r:11.41,
           pal:['#181818', '#484818', '#787848', '#184818', '#787818', '#784818'],
           what:'an apartment pool, holding its blue perfectly still',
           credit:'Apartment Pool · paul · superspl.at/scene/9d145adb · CC BY 4.0' },
  watertower:{ names:['TANK','RUNGS','SHADOWSIDE','GHOSTYARD'], ply:'splats/watertower.sog',
           up:[0,-1,0], c:[-13.59,-1.1,-13.78], r:14.7,
           pal:['#181818', '#a8a8a8', '#787878', '#484848', '#ffffff', '#181848'],
           what:'a ghost-town water tower, tall against the static',
           credit:'Nelson Ghost Town Water Tower · Paolo Tosolini · superspl.at/scene/fb3b5ed5 · CC BY 4.0' },
  calico:{ names:['REDROCK','SANDWASH','OVERLOOK','CAIRN'], ply:'splats/calico.sog',
           up:[0,-1,0], c:[57.7,-1.11,1.97], r:41.41,
           pal:['#a8a8a8', '#787878', '#484848', '#d8d8d8', '#181818', '#ffffff'],
           what:'a red-rock desert trail, wind fossilised mid-gust',
           credit:'Calico Tanks Trail, Red Rock Canyon · Paolo Tosolini · superspl.at/scene/19312f07 · CC BY 4.0' },
};
/* places only (owner, Aug 2026): objects render fine but make no game
   sense; every PET dials the winter-tree ROOM until more place-scans
   arrive. Objects stay reachable via ?scene= for testing. */
const TINT2SCENE={ bondi:'carshop', grape:'museum', strawberry:'forest',
                   lime:'garden', tangerine:'pool' };
const PLACES=['tree','garden','carshop','forest','museum','pool','watertower','calico'];
const SCENE=SCENES[Q.get('scene')] || SCENES[TINT2SCENE[Q.get('tint')]] || SCENES.tree;
const SCENEKEY=Object.keys(SCENES).find(k=>SCENES[k]===SCENE)||'tree';

/* ---- ☰ THE MENU — mode switches live here, not in URL paths ---- */
const menuBtn=document.createElement('button');
menuBtn.type='button'; menuBtn.id='menuBtn'; menuBtn.textContent='☰';
menuBtn.setAttribute('aria-label','menu');
document.body.appendChild(menuBtn);
const menu=document.createElement('div');
menu.id='menu'; menu.classList.add('hidden');
menu.innerHTML='<button type="button" id="mEdit">EDIT PLACEMENT: OFF</button>'
 +'<div class="mLbl">FAST PORT</div><div class="prow" id="mPorts"></div>'
 +'<div class="mCred"></div>';
document.body.appendChild(menu);
menuBtn.style.color=tint; menuBtn.style.borderColor=tint;
menu.style.color=tint; menu.style.borderColor=tint;
{ const row=menu.querySelector('#mPorts');
  for(const k of PLACES){
    const b=document.createElement('button'); b.type='button';
    b.textContent=k.toUpperCase();
    if(k===SCENEKEY){ b.style.opacity='0.4'; b.disabled=true; }
    b.addEventListener('click',()=>{
      const u=new URL(location.href);
      u.searchParams.set('scene',k);
      u.searchParams.delete('far'); u.searchParams.delete('st');
      location.href=u.toString();      // tint + edit ride along
    });
    row.appendChild(b);
  }
  menu.querySelector('.mCred').textContent=SCENE.credit;
}
menuBtn.addEventListener('click',()=>menu.classList.toggle('hidden'));
menu.querySelector('#mEdit').addEventListener('click',()=>setEdit(!editOn));
const SPLAT_PATH=(Q.has('hq') && SCENE.hq) ? SCENE.hq : SCENE.ply;

/* =========================================================
   PlayCanvas — REAL gaussian splatting, including on iOS.
   CDN first, vendored third_party/ fallback (house pattern).
   ========================================================= */
async function loadPC(){
  const CDN='https://cdn.jsdelivr.net/npm/playcanvas@2.21.3/build/playcanvas.min.mjs';
  const LOCAL='../../third_party/playcanvas/playcanvas.min.mjs';
  try{ return await Promise.race([ import(CDN),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('cdn timeout')),3500)) ]); }
  catch(e){ console.warn('playcanvas CDN unavailable, using vendored copy'); return import(LOCAL); }
}
const pc = await loadPC();

const canvas=document.createElement('canvas');
document.getElementById('stage').appendChild(canvas);
const app=new pc.Application(canvas, { graphicsDeviceOptions:{ antialias:false } });
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
app.setCanvasResolution(pc.RESOLUTION_AUTO);
app.graphicsDevice.maxPixelRatio=Math.min(devicePixelRatio,2);
app.start();
/* distance fog: the scan's frayed edge dissolves into the night
   instead of ending in ragged space (set once R is known, below) */
function setFog(rr){
  try{
    const fc=new pc.Color(0.004,0.008,0.016);
    const f=app.scene.fog;
    if(f && typeof f==='object'){ f.type='linear'; f.start=2.1*rr; f.end=4.2*rr; f.color=fc; }
    else { app.scene.fog=pc.FOG_LINEAR||'linear';
      app.scene.fogStart=2.1*rr; app.scene.fogEnd=4.2*rr; app.scene.fogColor=fc; }
  }catch(e){ console.warn('fog unsupported:', e.message); }
}

/* scene root: rotate scan-up onto world +y — up is up, always */
function rotationTo(a,b){                      // quat rotating unit vec a -> b
  const d=a.dot(b);
  if(d>0.9999) return new pc.Quat();
  if(d<-0.9999) return new pc.Quat().setFromAxisAngle(new pc.Vec3(1,0,0),180);
  const axis=new pc.Vec3().cross(a,b).normalize();
  return new pc.Quat().setFromAxisAngle(axis, Math.acos(d)*180/Math.PI);
}
const upQ=rotationTo(new pc.Vec3(...SCENE.up).normalize(), new pc.Vec3(0,1,0));
const sceneRoot=new pc.Entity('sceneRoot');
sceneRoot.setRotation(upQ);
app.root.addChild(sceneRoot);
/* the scan centre, in upright world space */
const C=new pc.Vec3(); upQ.transformVector(new pc.Vec3(...SCENE.c), C);
const R=SCENE.r;
setFog(R);
let WALKMAX=1.05*R;   // hand-placed stations may extend this

/* camera: y-up, orbiting the scan centre */
const CAM_TGT=C.clone();
const CAM_POS=new pc.Vec3(C.x+0.35*R, C.y+0.42*R, C.z-2.1*R);
const camE=new pc.Entity('cam');
camE.addComponent('camera', { clearColor:new pc.Color(0.004,0.008,0.016),
  fov:60, nearClip:0.05, farClip:200 });
app.root.addChild(camE);
camE.setPosition(CAM_POS); camE.lookAt(CAM_TGT, pc.Vec3.UP);

/* mansion-consistent controls: LEFT thumb walks the dream (translate),
   RIGHT thumb turns it (orbit) — the same split as dbdb2's stick+spin */
let dragging=null,lx=0,ly=0, yaw=0, pitch=0, distF=1, idle=0;
const TGT_CUR=CAM_TGT.clone();
let tgtGoal=CAM_TGT.clone();
addEventListener('pointerdown',e=>{
  dragging = e.clientX < innerWidth*0.45 ? 'walk' : 'orbit';
  lx=e.clientX; ly=e.clientY; });
addEventListener('pointermove',e=>{ if(!dragging) return;
  flight=null;                                  // your thumb outranks the choreography
  const dx=e.clientX-lx, dy=e.clientY-ly;
  if(dragging==='walk'){
    const yr=yaw*Math.PI/180;
    const fl=Math.hypot(base.x,base.z)||1;
    const f0x=-base.x/fl, f0z=-base.z/fl;        // boot forward, on the ground
    const fx=f0x*Math.cos(yr)+f0z*Math.sin(yr);
    const fz=f0z*Math.cos(yr)-f0x*Math.sin(yr);
    const rx=-fz, rz=fx;                         // camera-right on the ground
    const k=0.0022*R;
    TGT_CUR.x += rx*dx*k + fx*(-dy)*k;
    TGT_CUR.z += rz*dx*k + fz*(-dy)*k;
    tgtGoal=TGT_CUR.clone();
  } else {
    yaw-=dx*0.28; pitch+=dy*0.22;
    pitch=Math.max(-45,Math.min(60,pitch));
  }
  idle=0; lx=e.clientX; ly=e.clientY; });
addEventListener('pointerup',()=>{ dragging=null; });
const base=new pc.Vec3().sub2(CAM_POS,CAM_TGT);
const side=new pc.Vec3().cross(pc.Vec3.UP,base).normalize();
const _q1=new pc.Quat(), _q2=new pc.Quat(), _off=new pc.Vec3(), _pos=new pc.Vec3();

/* =========================================================
   choreographed flights: choices move the CAMERA through the
   world, eased, with a synth riser timed to the flight
   ========================================================= */
let flight=null;
function fly(o){  // {dYaw, toPitch, toDist, tgt, dur, onDone, quiet}
  flight={ t:0, dur:o.dur||3,
    yaw0:yaw, yaw1:yaw+(o.dYaw||0),
    p0:pitch, p1:(o.toPitch!==undefined?o.toPitch:pitch),
    d0:distF, d1:(o.toDist!==undefined?o.toDist:distF),
    onDone:o.onDone||null };
  if(o.tgt) tgtGoal=o.tgt.clone();
  if(!o.quiet) riser(flight.dur);
}
const ease=k=>k*k*(3-2*k);

/* =========================================================
   the three clues: low / heart / high along world-up, so the
   dream's hints stay true in every port
   ========================================================= */
const CLUES=[
  { off:[ 0.30,-0.36, 0.10], name:'a paper crown' },
  { off:[-0.24, 0.02, 0.18], name:'a brass key'   },
  { off:[ 0.12, 0.46,-0.22], name:'a working bulb'},
];
const clueMeshes=[];
function glowMat(hex, opacity){
  const m=new pc.StandardMaterial();
  m.emissive=new pc.Color().fromString(hex);
  m.diffuse=new pc.Color(0,0,0);
  m.useLighting=false;
  if(opacity<1){ m.opacity=opacity; m.blendType=pc.BLEND_NORMAL; m.depthWrite=false; }
  m.update(); return m;
}
for(const c of CLUES){
  const grp=new pc.Entity('clue');
  const core=new pc.Entity('core');
  core.addComponent('render',{ type:'box' });
  core.render.meshInstances[0].material=glowMat('#aaffc4',1);
  core.setLocalScale(0.1*R,0.1*R,0.1*R);
  core.setLocalEulerAngles(45,0,45);
  grp.addChild(core);
  const halo=new pc.Entity('halo');
  halo.addComponent('render',{ type:'box' });
  halo.render.meshInstances[0].material=glowMat('#66ff99',0.22);
  halo.setLocalScale(0.18*R,0.18*R,0.18*R);
  halo.setLocalEulerAngles(45,0,45);
  grp.addChild(halo);

let panelLines=['TUNING…'], panelChoices=[], choiceRects=[];
function wrapText(s, max){
  const words=s.split(' '), out=[]; let line='';
  for(const w of words){
    if((line+' '+w).trim().length>max){ out.push(line.trim()); line=w; }
    else line+=' '+w;
  }

  return out;
}
function panelDraw(){

  g.globalAlpha=1;

    for(const line of wrapText(para, 42)){

  choiceRects=[];

    g.fillStyle='#c9ffd6'; g.fillText('▸ '+c, 24, y+21);

       and take the button hit-rects from the DOM's own layout */
    try{

      g.drawElement(document.getElementById('panel'), 0, 0);
      const s2=PANEL_W/300;
      choiceRects=[...document.querySelectorAll('#panel .choice')].map(b2=>({
        x:b2.offsetLeft*s2, y:b2.offsetTop*s2,

  }

/* =========================================================

/* ---- EDIT MODE — a runtime TOGGLE in the ☰ menu, not a separate
   page: the dream with and without edit is the same dream, READ and
   all. ?edit=1 merely presets the toggle ON, and the toggle keeps the
   URL in sync so ports and reloads carry it. ---- */
let editOn=false;
let editPts=null, ghost=null, lastPlace=null, ebar=null;
function setEdit(on){
  editOn=on;
  document.body.classList.toggle('edit', on);
  if(on) buildEditBar();
  if(ebar) ebar.style.display=on?'flex':'none';
  const u=new URL(location.href);
  if(on) u.searchParams.set('edit','1'); else u.searchParams.delete('edit');
  history.replaceState(null,'',u.toString());
  const t2=document.getElementById('mEdit');
  if(t2) t2.textContent='EDIT PLACEMENT: '+(on?'ON':'OFF');
}
function buildEditBar(){
  if(ebar) return;
  ebar=document.createElement('div');
  ebar.id='ebar';
  ebar.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px;background:rgba(1,10,5,.92);border-top:1px solid '+tint+';color:'+tint+';font:11px monospace;';
  ebar.innerHTML='<button type="button" id="ebCopy" style="background:none;border:1px solid '+tint+';color:'+tint+';font:bold 12px monospace;padding:8px 12px;border-radius:4px;">COPY DATA</button><span id="ebInfo" style="word-break:break-all;">EDIT: loading hit mesh…</span>';
  document.body.appendChild(ebar);
  /* hit mesh: the loaded resource caches scan-space centers for EVERY
     splat format (ply / compressed.ply / SOG) — so edit works in any scene */
  const tryPts=()=>{
    const a=app.assets.find('scan');
    const res=a&&a.resource;
    let cs=res&&res.centers;
    if((!cs||!cs.length) && res&&res.gsplatData&&res.gsplatData.getCenters)
      try{ cs=res.gsplatData.getCenters(); }catch(e2){}
    if(!cs||!cs.length){ setTimeout(tryPts,600); return; }
    const n=Math.floor(cs.length/3);
    const pts=new Float32Array(n*3); const v=new pc.Vec3();
    for(let i=0;i<n;i++){
      v.set(cs[i*3],cs[i*3+1],cs[i*3+2]);
      upQ.transformVector(v,v);
      pts[i*3]=v.x; pts[i*3+1]=v.y; pts[i*3+2]=v.z;
    }
    editPts=pts;
    document.getElementById('ebInfo').textContent='EDIT ['+SCENEKEY+']: tap the scan to place a PET';
  };
  tryPts();
  document.getElementById('ebCopy').addEventListener('click',()=>{
    if(!lastPlace) return;
    const data=JSON.stringify({ scene:SCENEKEY, label:'NEW PORT',
      pos:[+lastPlace.x.toFixed(3),+lastPlace.y.toFixed(3),+lastPlace.z.toFixed(3)],
      yaw:+lastYaw.toFixed(1), pit:+lastPit.toFixed(1), d:+lastD.toFixed(3) });
    if(navigator.clipboard) navigator.clipboard.writeText(data).catch(()=>{});
    document.getElementById('ebInfo').textContent=data;
  });
}
if(Q.has('edit')) setEdit(true);
function splatHit(cx,cy){
  if(!editPts) return null;
  const ro=camE.getPosition(), rd=new pc.Vec3();
  const scale=1;  // pc 2.x worldToScreen/screenToWorld speak CSS px (dpr bug, diagnosed on iPhone)
  camE.camera.screenToWorld(cx*scale,cy*scale,camE.camera.farClip,rd);
  rd.sub(ro).normalize();
  const rad2=0.018*R*R;
  let best=Infinity;
  for(let i=0;i<editPts.length;i+=9){          // every 3rd splat: plenty
    const px2=editPts[i]-ro.x, py2=editPts[i+1]-ro.y, pz2=editPts[i+2]-ro.z;
    const t3=px2*rd.x+py2*rd.y+pz2*rd.z;
    if(t3<0.2*R||t3>=best) continue;
    const dx=px2-rd.x*t3, dy=py2-rd.y*t3, dz=pz2-rd.z*t3;
    if(dx*dx+dy*dy+dz*dz<rad2) best=t3;
  }
  if(best===Infinity) return null;
  return new pc.Vec3().copy(rd).mulScalar(best).add(ro);
}
let lastYaw=0, lastPit=0, lastD=0.68;
function editPlace(cx,cy){
  const h=splatHit(cx,cy);
  if(!h) return false;
  lastPlace=h;
  const cp=camE.getPosition();
  lastYaw=Math.atan2(cp.x-h.x, cp.z-h.z)*180/Math.PI;
  /* pitch and distance of the CURRENT view of the placed point, in the
     orbit rig's own terms — so arrival reproduces the owner's exact view */
  const baseElev=Math.atan2(base.y, Math.hypot(base.x,base.z))*180/Math.PI;
  lastPit=Math.atan2(cp.y-h.y, Math.hypot(cp.x-h.x,cp.z-h.z))*180/Math.PI - baseElev;
  lastD=Math.min(1.5, Math.max(0.45, cp.distance(h)/base.length()));
  if(!ghost) ghost=makePETmarker([h.x,h.y,h.z]);
  ghost.setPosition(h.x,h.y,h.z);
  ghost.setEulerAngles(0,lastYaw,0);
  document.getElementById('ebInfo').textContent=
    'PET at '+h.x.toFixed(2)+', '+h.y.toFixed(2)+', '+h.z.toFixed(2)+' — COPY DATA when happy';
  return true;
}

/* =========================================================
   HYBRID HTML: while the screen zone is mostly VISIBLE (facing
   us, on screen, not swallowed by the scan) the REAL html panel
   overlays the plate, matrix-matched — crisp text, native
   buttons. The moment the splat mostly covers it, the overlay
   yields to the engine plate, which the gaussians occlude
   per-splat. Occlusion is judged against the scan's own data:
   a ~30k-gaussian sample (HTTP range request, ~1MB).
   ========================================================= */
const css3d=document.getElementById('css3d'), css3dCam=document.getElementById('css3dCam');
const domPanel=document.getElementById('panel');
domPanel.style.color=tint; domPanel.style.borderColor=tint;
/* the real-HTML screen is the default (owner: "we want DOM on every
   billboard"); ?nohtml=1 falls back to the engine plate alone */
if(Q.has('nohtml')) css3d.remove();
let occPts=null, domVis=false, visTick=0, domForce=null, lastMotion=0;
if(SCENE.raw){
  fetch(SCENE.raw, { headers:{ Range:'bytes=0-959999' } })
    .then(r2=>r2.arrayBuffer()).then(b2=>{
      const n=Math.min(30000, Math.floor(b2.byteLength/32));
      const dv=new DataView(b2), pts=new Float32Array(n*3);
      const v=new pc.Vec3();
      for(let i=0;i<n;i++){
        if(dv.getUint8(i*32+27)<90){ pts[i*3]=1e9; continue; }
        v.set(dv.getFloat32(i*32,true),dv.getFloat32(i*32+4,true),dv.getFloat32(i*32+8,true));
        upQ.transformVector(v,v);
        pts[i*3]=v.x; pts[i*3+1]=v.y; pts[i*3+2]=v.z;
      }
      occPts=pts;
    }).catch(()=>{});
}
/* a ray is blocked only by a DENSE cluster in front of the plate —
   stray dust motes in a room scan must not count as walls */
function rayBlockCount(ro,rd,pts,stride,maxT){
  const rad2=0.008*R*R; let hits=0;
  for(let i=0;i<pts.length;i+=stride){
    const px2=pts[i]-ro.x, py2=pts[i+1]-ro.y, pz2=pts[i+2]-ro.z;
    const t3=px2*rd.x+py2*rd.y+pz2*rd.z;
    if(t3<0.1*R||t3>maxT) continue;
    const dx=px2-rd.x*t3, dy=py2-rd.y*t3, dz=pz2-rd.z*t3;
    if(dx*dx+dy*dy+dz*dz<rad2 && ++hits>=4) return hits;
  }
  return hits;
}
const _vro=new pc.Vec3(), _vrd=new pc.Vec3(), _vp=new pc.Vec3();
function computeVis(){
  window.__visDbg={};
  if(domForce!==null) return domForce;
  if(Q.has('nohtml')) return false;
  if(!loaded) return (__visDbg.loaded=false);
  _vro.copy(camE.getPosition());
  /* facing: are we in front of the fixed screen? */
  const py=(activeTerm.yaw||0)*Math.PI/180;
  const nz=new pc.Vec3(Math.sin(py),0,Math.cos(py));
  _vp.sub2(_vro,PANEL_POS); _vp.y=0;
  __visDbg.facing=_vp.normalize().dot(nz);
  if(__visDbg.facing<0.3) return false;
  /* on screen? */
  const scale=1;  // pc 2.x worldToScreen/screenToWorld speak CSS px (dpr bug, diagnosed on iPhone)
  camE.camera.worldToScreen(PANEL_POS,_scr);
  __visDbg.scr=[Math.round(_scr.x/scale),Math.round(_scr.y/scale),+_scr.z.toFixed(2)];
  if(_scr.z<0 || _scr.x<-40*scale || _scr.x>(innerWidth+40)*scale
     || _scr.y<-40*scale || _scr.y>(innerHeight+40)*scale) return false;
  /* mostly unoccluded? sample centre + 4 corners against the scan */
  if(occPts){
    const rt=new pc.Vec3().cross(pc.Vec3.UP,nz).normalize();
    let blocked=0;
    for(const [ox,oy] of [[0,0],[-0.35,0.3],[0.35,0.3],[-0.35,-0.3],[0.35,-0.3]]){
      _vrd.copy(PANEL_POS);
      _vrd.x+=rt.x*ox*PW; _vrd.z+=rt.z*ox*PW; _vrd.y+=oy*PH;
      const dist=_vrd.distance(_vro);
      _vrd.sub(_vro).normalize();
      if(rayBlockCount(_vro,_vrd,occPts,9,dist-0.12*R)>=4) blocked++;
    }
    __visDbg.blocked=blocked; __visDbg.occ=occPts.length;
    if(blocked>=3) return false;
  }
  return true;
}
const _v2=new pc.Vec3(), _v3=new pc.Vec3();
function domUpdate(vis){
  if(!css3d.isConnected) return;
  if(readMode){                              // accessibility: big flat card
    css3d.style.display='block'; plate.enabled=true;
    domPanel.classList.add('read');
    return;
  }
  domPanel.classList.remove('read');
  if(!vis){ css3d.style.display='none'; plate.enabled=true; return; }
  css3d.style.display='block';
  plate.enabled=false;                    // one screen at a time: DOM speaks
  /* anchored by construction: position, scale and tilt all derive from
     the SAME worldToScreen projection the engine uses for the plate —
     the DOM cannot drift from the scene, at any bearing */
  const scale=1;  // pc 2.x worldToScreen/screenToWorld speak CSS px (dpr bug, diagnosed on iPhone)
  camE.camera.worldToScreen(PANEL_POS,_scr);
  if(_scr.z<0){ css3d.style.display='none'; return; }
  const sx=_scr.x/scale, sy=_scr.y/scale;
  const py2=(activeTerm.yaw||0)*Math.PI/180;
  const nz=new pc.Vec3(Math.sin(py2),0,Math.cos(py2));         // plate normal
  const rt=new pc.Vec3().cross(pc.Vec3.UP,nz).normalize();     // plate right
  _v3.set(PANEL_POS.x+rt.x*PW/2, PANEL_POS.y, PANEL_POS.z+rt.z*PW/2);
  camE.camera.worldToScreen(_v3,_v2);
  const halfPx=Math.hypot(_v2.x/scale-sx, _v2.y/scale-sy);
  const k=Math.max(0.05,(halfPx*2)/300);                       // dom width 300px
  _v3.sub2(camE.getPosition(),PANEL_POS); _v3.y=0; _v3.normalize();
  const angY=Math.atan2(_v3.dot(rt), _v3.dot(nz));             // signed bearing
  domPanel.style.transform='translate('+sx+'px,'+sy+'px) translate(-50%,-50%) '
    +'perspective(900px) rotateY('+(-angY)+'rad) scale('+k+')';
}
function domRender(){
  const domPanel=document.getElementById('panel');
  if(!domPanel) return;
  domPanel.querySelector('.inkText').innerHTML=
    panelLines.map(l=>'<p>'+l.replace(/</g,'&lt;')+'</p>').join('');
  const ch=domPanel.querySelector('.choices'); ch.innerHTML='';
  panelChoices.forEach((c,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='choice'; b.textContent='▸ '+c;
    b.addEventListener('click',()=>chooseChoice(i));
    ch.appendChild(b);
  });
}

/* raycast a css-pixel tap onto the plate; true = consumed */
const _rd=new pc.Vec3(), _hit=new pc.Vec3(), _nrm=new pc.Vec3(), _rt=new pc.Vec3();
function panelTap(cx,cy){
  const camPos=camE.getPosition();
  const scale=1;  // pc 2.x worldToScreen/screenToWorld speak CSS px (dpr bug, diagnosed on iPhone)
  camE.camera.screenToWorld(cx*scale, cy*scale, camE.camera.farClip, _rd);
  _rd.sub(camPos).normalize();
  _nrm.set(camPos.x-PANEL_POS.x, 0, camPos.z-PANEL_POS.z).normalize();
  const den=_rd.dot(_nrm); if(Math.abs(den)<1e-5) return false;
  const t2=new pc.Vec3().sub2(PANEL_POS,camPos).dot(_nrm)/den;
  if(t2<=0) return false;
  _hit.copy(_rd).mulScalar(t2).add(camPos).sub(PANEL_POS);
  _rt.cross(_nrm, pc.Vec3.UP).normalize();       // viewer-right on the plate
  const lx=_hit.dot(_rt), ly=_hit.y;
  if(Math.abs(lx)>PW/2 || Math.abs(ly)>PH/2) return false;
  const px=(0.5 - lx/PW)*PANEL_W, py=(0.5 - ly/PH)*PANEL_H;
  choiceRects.forEach((r,i)=>{
    if(px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h) chooseChoice(i);
  });
  return true;                                    // the plate soaks the tap
}

/* one update hook: orbit, flights, clue pulse, motes, panel */
let t=0;
app.on('update', dt=>{
  t+=dt; idle+=dt;
  if(flight){
    flight.t+=dt;
    const k=ease(Math.min(1,flight.t/flight.dur));
    yaw=flight.yaw0+(flight.yaw1-flight.yaw0)*k;
    pitch=flight.p0+(flight.p1-flight.p0)*k;
    distF=flight.d0+(flight.d1-flight.d0)*k;
    idle=0;
    if(flight.t>=flight.dur){ const f=flight.onDone; flight=null; if(f) f(); }
  } else if(idle>2.5) yaw+=dt*3.5;              // the dream drifts
  TGT_CUR.lerp(TGT_CUR, tgtGoal, Math.min(1,dt*2.5));
  /* stay inside the scan's dense core (R is the per-scene 70th-pct
     density radius — our heuristic for "the realistic zone"): the
     ragged digitisation fringe stays at arm's length */
  { const dx0=TGT_CUR.x-C.x, dz0=TGT_CUR.z-C.z, d0=Math.hypot(dx0,dz0);
    const MAXW=WALKMAX;
    if(d0>MAXW){
      TGT_CUR.x=C.x+dx0/d0*MAXW; TGT_CUR.z=C.z+dz0/d0*MAXW;
      tgtGoal.x=TGT_CUR.x; tgtGoal.z=TGT_CUR.z;
    } }
  distF=Math.max(0.45,Math.min(1.5,distF));
  _q1.setFromAxisAngle(pc.Vec3.UP, yaw);
  _q2.setFromAxisAngle(side, pitch);
  _q1.transformVector(base,_off); _q2.transformVector(_off,_off);
  _off.mulScalar(distF);
  _pos.add2(TGT_CUR,_off);
  camE.setPosition(_pos);
  camE.lookAt(TGT_CUR, pc.Vec3.UP);
  clueMeshes.forEach((c,i)=>{
    if(c.found) return;
    const s=1+Math.sin(t*3+i*2.1)*0.25;
    c.core.setLocalScale(0.1*R*s,0.1*R*s,0.1*R*s);
    const hh=1+Math.sin(t*2.2+i)*0.4;
    c.halo.setLocalScale(0.18*R*hh,0.18*R*hh,0.18*R*hh);
    c.grp.setEulerAngles(0,(t*(40+i*12))%360,0);
  });
  for(const m of motes){
    m.a+=dt*m.sp;
    m.e.setPosition(C.x+Math.cos(m.a)*m.rr,
      C.y+m.h+Math.sin(t*0.4+m.ph)*0.06*R,
      C.z+Math.sin(m.a)*m.rr);
  }
  if(dragging||flight) lastMotion=t;
  if(++visTick>=10){ visTick=0;
    /* the DOM twin only speaks when the camera has SETTLED — during a
       drag or flight the engine plate carries the screen, because it is
       scene geometry and cannot lag or skew apart from the splat (the
       CSS layer composites a frame behind WebGL on iOS and only
       approximates the tilt: visibly a sticker while moving) */
    domVis = (domForce!==null) ? domForce
           : (dragging||flight||t-lastMotion<0.7) ? false
           : computeVis();
  }
  domUpdate(domVis);
});

/* =========================================================
   the splat itself
   ========================================================= */
let loaded=false, splatOk=false, mode='none';
const loadLine=document.getElementById('loadLine');
function boot(){
  if(loaded) return;
  loaded=true; loadLine.classList.add('hidden');
  console.log('dream renderer:', mode, '· scene:', SCENE.credit);
  renderInk();
  if(Q.has('far')){                    // arriving from another splat: sweep
    const sti=Math.min(3,Math.max(0,parseInt(Q.get('st')||'0',10)||0));
    flyStation(sti,{arrive:true});       // …down into the CHOSEN station
  }
}
function loadSplat(attempt=0){
  const bust = attempt>0 ? '?r='+attempt+'-'+Date.now() : '';
  const asset=new pc.Asset('scan','gsplat',{ url:SPLAT_PATH+bust });
  asset.on('load', ()=>{
    const e=new pc.Entity('scan');
    e.addComponent('gsplat',{ asset });
    sceneRoot.addChild(e);
    splatOk=true; mode='playcanvas-gsplat'; boot();
  });
  asset.on('error', err=>{
    if(attempt<2){ loadLine.textContent='RE-TUNING ('+(attempt+2)+'/3)…';
      setTimeout(()=>loadSplat(attempt+1), 1500*(attempt+1)); return; }
    console.warn('splat load failed, dreaming without the scan:', err);
    mode='no-splat'; boot();
  });
  app.assets.add(asset);
  app.assets.load(asset);
}
loadSplat();

/* =========================================================
   ink — the dream narrates the hunt (REAL inkjs compile)
   ========================================================= */
const STN=SCENE.st||[];
const NAMES=(SCENE.names||['NORTH','EAST','SOUTH','WEST'])
  .map((n,i)=>STN[i]?STN[i].n:n);
/* far ports: EVERY other place, EVERY named station in it — the port
   map is a directory of the whole dreamt world, not a lucky dip */
const FKEYS=PLACES.filter(k=>SCENES[k]&&SCENES[k]!==SCENE);
const nameOf=(k,i)=>{ const s=SCENES[k], st=s.st||[];
  return st[i]?st[i].n:(s.names||['NORTH','EAST','SOUTH','WEST'])[i]; };
const GO_LINES=['The whole scan folds shut behind you.',
  'The static thickens. Another place entirely takes the screen.',
  'You let go of this place. It lets go of you.',
  'The drift carries you out past the last gaussian.'];
let farMenu='', farKnots='', goKnots='';
FKEYS.forEach((k,ki)=>{
  farMenu+='+ [FAR PORT \u2192 '+k.toUpperCase()+'] -> far_'+k+'\n';
  farKnots+='== far_'+k+' ==\nThe static tunes toward '+k.toUpperCase()+': '+SCENES[k].what+'.\n';
  for(let i=0;i<4;i++)
    farKnots+='+ [\u21d2 '+nameOf(k,i)+' \u00b7 '+k+'] -> go_'+k+'_'+i+'\n';
  farKnots+='+ [Back to the far ports] -> farhub\n';
  for(let i=0;i<4;i++)
    goKnots+='== go_'+k+'_'+i+' ==\n'+GO_LINES[(ki+i)%GO_LINES.length]+'\n-> DONE\n';
});
const INK_SOURCE = `
VAR clues = 0
-> port
== port ==
The terminal dreamed you a place: ${SCENE.what}.
Its named corners: ${NAMES.join(', ')}. You drift here without a body — LEFT thumb walks, RIGHT thumb turns. Three bright lights hide in the drift: tap them when you see them.
+ [Open the port map] -> hub
== hub ==
{clues == 0: Nothing found yet. The lights are out there.}
{clues == 1: One found. Two lights still out there.}
{clues == 2: Two found. One light still out there.}
{clues == 3: All three found. The key is warm in your hand.}
+ [Port → ${NAMES[0]}] -> st_0
+ [Port → ${NAMES[1]}] -> st_1
+ [Port → ${NAMES[2]}] -> st_2
+ [Port → ${NAMES[3]}] -> st_3
+ [FAR PORTS — the other scans] -> farhub
+ [Ask the dream for a hint] -> hint
== farhub ==
${FKEYS.length} other places hum behind the static. Pick one; then pick where in it to surface.
${farMenu}+ [Back to this place] -> hub
== st_0 ==
The dream slides you along the drift to ${NAMES[0]}.
-> hub
== st_1 ==
${NAMES[1]} assembles itself around you, point by point.
-> hub
== st_2 ==
The static parts. ${NAMES[2]}.
-> hub
== st_3 ==
You arrive at ${NAMES[3]} before the sound of leaving fades.
-> hub
${farKnots}${goKnots}== hint ==
{clues == 0: "Low, near the base," the static says. "Something that once sat on a head."}
{clues == 1: "At the heart of the scan," it hums. "Small, brass, patient."}
{clues == 2: "Higher," it crackles. "Up past the top, out in the drift. It still has light in it."}
{clues == 3: "You have them all. WAKE when ready — or keep porting."}
-> hub
== found_1 ==
ONE. A paper crown, folded by somebody's grandmother. The scan remembers being loved.
-> hub
== found_2 ==
TWO. A brass key on red thread. It opens nothing here. It opens something THERE.
-> hub
== found_3 ==
THREE. A bulb that still works. The dream lights from the inside, once, just for you.
+ [WAKE] -> wake
+ [Keep drifting] -> hub
== wake ==
You surface through the static, grinning like a fool.
-> END
`;
let inkStory=null;
try{ inkStory=new inkjs.Compiler(INK_SOURCE).Compile(); }
catch(e){ console.warn('ink compile failed', e); }

/* choices choreograph the camera */
/* the tour: four stations around the scan — ink choices carry you
   from area to area, showing the place off on the way */
const TOUR=[[0.55,0.05,0],[0,0.02,0.55],[-0.55,0.08,0],[0,0.05,-0.55]]
  .map(o=>new pc.Vec3(C.x+o[0]*R, C.y+o[1]*R, C.z+o[2]*R));
STN.forEach((s,i)=>{ if(i>=TOUR.length) return;
  TOUR[i]=new pc.Vec3(s.p[0],s.p[1],s.p[2]);
  /* a curated point is authoritative: the walk fence grows to reach it */
  WALKMAX=Math.max(WALKMAX, Math.hypot(s.p[0]-C.x,s.p[2]-C.z)+0.15*R);
});
/* every station is also a BILLBOARD spot: a PET marker stands there,
   and porting there (or tapping the PET) brings the one screen to it —
   still a single unified screen, with several places it can live */
NAMES.forEach((n,i)=>{
  const T={ id:'st'+i, label:n,
    pos:[TOUR[i].x, TOUR[i].y, TOUR[i].z],
    yaw:(STN[i]&&STN[i].yaw!==undefined)?STN[i].yaw:(i*90+40) };
  T.marker=makePETmarker(T.pos);
  TERMINALS.push(T);
});
let tourI=0;
/* the one true port flight: absolute per-station bearing (hand-placed
   yaw wins over the computed corner), so the same port always lands in
   the same pose. Already there? A slow full-circle flourish says so.
   opts.arrive: the quiet sweep-in when surfacing from another scan. */
function flyStation(sti, opts={}){
  document.getElementById('hudLoc').textContent='PORT/7 · '+NAMES[sti];
  const TT=TERMINALS.find(t2=>t2.id==='st'+sti);
  if(TT){ activeTerm=TT; applyTermPose(TT); }   // the screen ports with you
  const bAng=Math.atan2(base.x,base.z)*180/Math.PI;
  const aim=STN[sti]?STN[sti].yaw:(sti*90+40);
  let want=aim-bAng-yaw;
  while(want>180) want-=360; while(want<-180) want+=360;
  const s=STN[sti]||{};
  const pit=(s.pit!==undefined)?s.pit:(4+sti*3);
  const dst=s.d||0.68;
  const there = !opts.arrive && Math.abs(want)<12 && TGT_CUR.distance(TOUR[sti])<0.25*R;
  fly(there
    ? { dYaw:360, toPitch:pit, toDist:dst, tgt:TOUR[sti], dur:6 }
    : { dYaw:want+(opts.arrive?-360:0), toPitch:pit, toDist:dst,
        tgt:TOUR[sti], dur:opts.arrive?5.5:5, quiet:!!opts.arrive });
}
function choiceFlight(label){
  const L=label.toLowerCase();
  const sti=NAMES.findIndex(n=>label.includes(n));
  /* a far station: "⇒ NAME · scenekey" — leave this scan, surface at
     that exact station of the other one */
  const fm=label.match(/^\u21d2 (.+) \u00b7 ([a-z]+)$/);
  if(fm && SCENES[fm[2]]){
    const k=fm[2];
    const fsti=Math.max(0,[0,1,2,3].map(i=>nameOf(k,i)).indexOf(fm[1]));
    fly({ dYaw:200, toPitch:26, toDist:1.9, tgt:CAM_TGT, dur:2.6, onDone:()=>{
      const u=new URL(location.href);
      u.searchParams.set('scene',k); u.searchParams.set('far','1');
      u.searchParams.set('st',String(fsti));
      location.href=u.toString();
    }});
    return 'far';
  }
  if(L.startsWith('port') && sti>=0){ flyStation(sti); return null; }
  if(L.includes('hint')){
    const c=clueMeshes.find(cm=>!cm.found);
    if(c) fly({ dYaw:120, toPitch:10, toDist:0.55, tgt:c.grp.getPosition(), dur:3.8 });
  }
  else if(L.includes('map')) fly({ dYaw:45, toPitch:18, toDist:1.25, tgt:CAM_TGT, dur:3 });
  else if(L.includes('drifting')) fly({ dYaw:150, toPitch:6, toDist:0.8, tgt:CAM_TGT, dur:5 });
  else if(L.includes('wake')) return 'wake';    // handled by the caller
  return null;
}
function renderInk(){
  if(!inkStory) return;
  const out=[];
  while(inkStory.canContinue){
    const line=inkStory.Continue().trim();
    if(line) out.push(line);
  }
  if(out.length) panelLines=out;
  panelChoices=inkStory.currentChoices.map(c=>c.text);
  panelDraw();
}
function chooseChoice(i){
  const c=inkStory && inkStory.currentChoices[i]; if(!c) return;
  const kind=choiceFlight(c.text);
  inkStory.ChooseChoiceIndex(i); renderInk();
  /* completion ONLY when the hunt is done AND the story has ended —
     the WAKE flight pulls up and away, then surfaces you */
  if(kind==='wake' && !inkStory.canContinue
     && inkStory.currentChoices.length===0 && found()===3)
    fly({ dYaw:180, toPitch:42, toDist:2.4, tgt:CAM_TGT, dur:3.2, onDone:finish });
}
function finish(){
  parent.postMessage({ jsdDream:'complete', clues:found() }, '*');
}
function found(){ return clueMeshes.filter(c=>c.found).length; }

/* =========================================================
   clue hunting — precise screen-space taps
   ========================================================= */
const _scr=new pc.Vec3(), _to=new pc.Vec3();
let downAt=null;
addEventListener('pointerdown', e=>{ downAt=[e.clientX,e.clientY]; });
addEventListener('pointerup', e=>{
  if(!downAt) return;
  const moved=Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]);
  downAt=null;
  if(moved>8 || !loaded) return;
  if(e.target.closest && e.target.closest('#exitBtn,#ebCopy,#panel,#readBtn,#menuBtn,#menu,#ebar')) return;
  if(editOn){ editPlace(e.clientX, e.clientY); return; }
  if(termTap(e.clientX, e.clientY)) return;       // PET markers zoom their screen
  if(panelTap(e.clientX, e.clientY)) return;      // the terminal soaks its taps
  const scale=1;  // pc 2.x worldToScreen/screenToWorld speak CSS px (dpr bug, diagnosed on iPhone)   // css px -> device px
  let best=null, bd=48*scale;
  for(const c of clueMeshes){
    if(c.found) continue;
    _to.sub2(c.grp.getPosition(), camE.getPosition());
    if(_to.dot(camE.forward)<=0) continue;           // behind the camera
    camE.camera.worldToScreen(c.grp.getPosition(), _scr);
    const d=Math.hypot(_scr.x-e.clientX*scale, _scr.y-e.clientY*scale);
    if(d<bd){ bd=d; best=c; }
  }
  if(best) collect(best);
});
function collect(c){
  c.found=true;
  c.halo.enabled=false;
  c.core.render.meshInstances[0].material=glowMat('#ffffff',1);
  const n=found();
  document.getElementById('clueTally').textContent='CLUES '+n+'/3';
  ping(n);
  fly({ dYaw:70, toDist:0.85, tgt:c.grp.getPosition(), dur:2.0, quiet:true });
  if(inkStory){
    inkStory.variablesState.$('clues', n);
    try{ inkStory.ChoosePathString('found_'+n); }catch(e){}
    renderInk();
  }
  setTimeout(()=>{ c.grp.enabled=false; tgtGoal=CAM_TGT.clone(); }, 1400);
}

/* audio: one chime per clue + a riser under each flight.
   Mobile-lean WebAudio: a handful of nodes, audio-rate ramps,
   no per-frame JS scheduling. The tap itself is the gesture. */
let actx=null;
function ping(n){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime+0.02;
    [76+n*3, 83+n*3].forEach((m,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='triangle'; o.frequency.value=440*Math.pow(2,(m-69)/12);
      g.gain.setValueAtTime(0.12, t0+i*0.09);
      g.gain.setTargetAtTime(0.0001, t0+i*0.09+0.04, 0.2);
      o.connect(g); g.connect(actx.destination);
      o.start(t0+i*0.09); o.stop(t0+i*0.09+0.8);
    });
  }catch(e){}
}
function riser(dur){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime+0.02;
    const o=actx.createOscillator(), f=actx.createBiquadFilter(), g=actx.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(55, t0);
    o.frequency.exponentialRampToValueAtTime(220, t0+dur*0.9);
    f.type='lowpass'; f.Q.value=6;
    f.frequency.setValueAtTime(180, t0);
    f.frequency.exponentialRampToValueAtTime(1400, t0+dur*0.9);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.05, t0+dur*0.35);
    g.gain.setTargetAtTime(0.0001, t0+dur*0.9, 0.2);
    o.connect(f); f.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0+dur+0.6);
  }catch(e){}
}

document.getElementById('exitBtn').addEventListener('click', ()=>{
  parent.postMessage({ jsdDream:'exit' }, '*');
});

/* headless-test hook */
window.__dream = {
  get loaded(){ return loaded; },
  get splatOk(){ return splatOk; },
  get mode(){ return mode; },
  get hic(){ return { drawElement:HIC2D, gpuCopy:HICGPU, live:hicLive }; },
  get scene(){ return SCENE.credit; },
  get flying(){ return !!flight; },
  get found(){ return found(); },
  get panelText(){ return panelLines.join(' '); },
  get panelChoices(){ return panelChoices.slice(); },
  tap(i){ collect(clueMeshes[i]); },
  proj(i){ const scale=1;  // pc 2.x worldToScreen/screenToWorld speak CSS px (dpr bug, diagnosed on iPhone)
    camE.camera.worldToScreen(clueMeshes[i].grp.getPosition(), _scr);
    return { x:_scr.x/scale, y:_scr.y/scale }; },
  panelRect(){ const scale=1;  // pc 2.x worldToScreen/screenToWorld speak CSS px (dpr bug, diagnosed on iPhone)
    camE.camera.worldToScreen(PANEL_POS, _scr);
    return { x:Math.round(_scr.x/scale), y:Math.round(_scr.y/scale) }; },
  btnScreen(i){ const r=choiceRects[i]; if(!r) return null;
    _nrm.set(camE.getPosition().x-PANEL_POS.x,0,camE.getPosition().z-PANEL_POS.z).normalize();
    _rt.cross(_nrm, pc.Vec3.UP).normalize();
    const lx=(0.5-(r.x+r.w/2)/PANEL_W)*PW, ly=(0.5-(r.y+r.h/2)/PANEL_H)*PH;
    const wp=new pc.Vec3().copy(_rt).mulScalar(lx); wp.y+=ly; wp.add(PANEL_POS);
    const scale=1;  // pc 2.x worldToScreen/screenToWorld speak CSS px (dpr bug, diagnosed on iPhone)
    camE.camera.worldToScreen(wp,_scr);
    return { x:_scr.x/scale, y:_scr.y/scale }; },
  choose(i){ chooseChoice(i); },
  get terms(){ return TERMINALS.map(T=>T.label); },
  editPlace(x,y){ return editPlace(x,y); },
  get lastPlace(){ return lastPlace?[+lastPlace.x.toFixed(3),+lastPlace.y.toFixed(3),+lastPlace.z.toFixed(3)]:null; },
  flyToTerm(i){ flyToTerm(TERMINALS[i]); },
  get domVis(){ return domVis; },
  setDomForce(v){ domForce=v; domVis=(v===null)?domVis:v; },
  setCam(px,py,pz,tx,ty,tz){ CAM_POS.set(px,py,pz); CAM_TGT.set(tx,ty,tz);
    tgtGoal=CAM_TGT.clone(); TGT_CUR.copy(CAM_TGT);
    base.sub2(CAM_POS,CAM_TGT); side.cross(pc.Vec3.UP,base).normalize();
    yaw=0; pitch=0; distF=1; flight=null; },
  mats(){ return { cam:[...camE.getWorldTransform().data],
    proj:[...camE.camera.projectionMatrix.data],
    panel:[...panelE.getWorldTransform().data], pw:PW }; },
  get lastYaw(){ return +lastYaw.toFixed(1); },
  exit(){ document.getElementById('exitBtn').click(); },
};
</script>
