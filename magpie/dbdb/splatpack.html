<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#010204">
<title>SPLATPACK — the clone stamp for reality</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#010204;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    font-family:"Courier New",ui-monospace,monospace; color:#9fe8b0; }
  #stage { position:fixed; inset:0; }
  #stage canvas { width:100%; height:100%; display:block; }
  #phos { position:fixed; inset:0; pointer-events:none; z-index:6;
    background:
      radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,20,8,.55) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, rgba(0,0,0,0) 1px 3px); }
  #head { position:fixed; top:0; left:0; right:0; z-index:8; display:flex;
    justify-content:space-between; padding:10px 14px 8px; pointer-events:none;
    font-size:11px; letter-spacing:.3em; color:rgba(159,232,176,.75);
    text-shadow:0 0 8px rgba(80,255,140,.5); }
  #bar { position:fixed; bottom:0; left:0; right:0; z-index:9; display:flex;
    flex-wrap:wrap; gap:6px; padding:10px; align-items:center;
    background:rgba(1,10,5,.85); border-top:1px solid rgba(159,232,176,.4); }
  #bar button { background:none; border:1px solid #9fe8b0; color:#9fe8b0;
    font:12px monospace; padding:8px 10px; border-radius:4px; }
  #bar button.on { background:rgba(80,255,140,.22); }
  #elDrawer { position:fixed; bottom:52px; left:0; right:0; z-index:10;
    max-height:44vh; overflow-y:auto; padding:10px;
    background:rgba(1,10,5,.94); border-top:1px solid rgba(159,232,176,.4);
    display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:6px; }
  #elDrawer button { background:none; border:1px solid #9fe8b0; color:#9fe8b0;
    font:11px monospace; padding:9px 6px; border-radius:4px; }
  #cred { position:fixed; bottom:52px; left:10px; right:10px; z-index:8;
    font-size:8.5px; opacity:.55; pointer-events:none; line-height:1.5; }
  .hidden { display:none !important; }
  #err { position:fixed; inset:auto 0 0 0; z-index:50; color:#ff9a9a;
    background:rgba(30,0,0,.92); padding:8px; font-size:11px; display:none;
    white-space:pre-wrap; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="phos"></div>
<div id="head"><span>SPLATPACK · STAMP CATALOG</span><span id="hInfo"></span></div>
<div id="cred"></div>
<div id="elDrawer" class="hidden"></div>
<div id="bar"></div>
<pre id="err"></pre>

<script type="module">
const errBox=document.getElementById('err');
window.addEventListener('error', e=>{ errBox.style.display='block';
  errBox.textContent += (e.message||e.error)+'\n'; });
window.addEventListener('unhandledrejection', e=>{ errBox.style.display='block';
  errBox.textContent += 'async: '+(e.reason&&e.reason.message||e.reason)+'\n'; });

/* PlayCanvas — CDN first, vendored fallback (house pattern) */
async function loadPC(){
  const CDN='https://cdn.jsdelivr.net/npm/playcanvas@2.21.3/build/playcanvas.min.mjs';
  const LOCAL='../../third_party/playcanvas/playcanvas.min.mjs';
  try{ return await Promise.race([ import(CDN),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('cdn timeout')),3500)) ]); }
  catch(e){ console.warn('playcanvas CDN unavailable, using vendored copy'); return import(LOCAL); }
}
const pc = await loadPC();
const Q=new URLSearchParams(location.search);

const canvas=document.createElement('canvas');
document.getElementById('stage').appendChild(canvas);
const app=new pc.Application(canvas, { graphicsDeviceOptions:{ antialias:false } });
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
app.setCanvasResolution(pc.RESOLUTION_AUTO);
addEventListener('resize',()=>app.resizeCanvas());
app.start();

const camE=new pc.Entity('cam');
camE.addComponent('camera',{ clearColor:new pc.Color(0.004,0.008,0.016),
  fov:60, nearClip:0.05, farClip:400 });
app.root.addChild(camE);

const pack=await (await fetch('splats/pack/pack.json')).json();
const EL=Object.fromEntries(pack.elements.map(e=>[e.id,e]));
document.getElementById('cred').textContent=
  'clips: '+[...new Set(pack.elements.map(e=>e.credit))].join('  ·  ');

/* asset per element, shared by every stamp of it */
const assets={};
function assetFor(id){
  if(assets[id]) return assets[id];
  const a=new pc.Asset(id,'gsplat',{ url:'splats/pack/'+EL[id].file });
  app.assets.add(a); app.assets.load(a);
  assets[id]=a; return a;
}
/* stamps are POOLED, never destroyed: destroying a gsplat entity
   releases the shared asset's resource, and the next stamp of the
   same element reads a dead sorter (hasCenters of null). Disable
   and reuse instead. */
const pool={}, used={};
function stamp(id, x, z, yaw=0, s=1, y=0){
  used[id]=used[id]||0;
  const list=pool[id]=pool[id]||[];
  let e=list[used[id]++];
  if(!e){
    e=new pc.Entity('stamp-'+id);
    const a=assetFor(id);
    const attach=()=>{ e.addComponent('gsplat',{ asset:a }); };
    if(a.loaded) attach(); else a.on('load',attach);
    app.root.addChild(e);
    list.push(e);
  }
  e.enabled=true;
  e.setPosition(x,y,z);
  e.setEulerAngles(0,yaw,0);
  e.setLocalScale(s,s,s);
  return e;
}
function clearStamps(){
  for(const k in used) used[k]=0;
  for(const k in pool) for(const e of pool[k]) e.enabled=false;
}

/* ---- LAYOUTS ----
   catalog (default): every element side by side on the ground line.
   yard: a derived scene STAMPED from the pack — walls repeated like
   the Photoshop clone stamp, a pump on the corner, the car parked. */
/* seeded rng: the same maze grows the same hedges every boot */
const mulberry32=a=>()=>{ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; };
/* PAC-MAZE — hedge blocks grown from a handful of plant clips, each
   stamp varied in rotation, scale and colour-variant: a maze that
   exists in no scan, grown from one glasshouse's plants */
let MAZE_INFO=null;
function mazeLayout(){
  const M=[
    '###########',
    '#.........#',
    '#.##.#.##.#',
    '#.#..#..#.#',
    '#....P....#',
    '#.#..#..#.#',
    '#.##.#.##.#',
    '#....R....#',
    '###########'];
  const CS=1.15, W=M[0].length, H=M.length;
  const ox=-(W-1)/2*CS, oz=-(H-1)/2*CS;
  MAZE_INFO={ M, CS, ox, oz, W, H };      // the roamers read the bitmap
  const rnd=mulberry32(7261);
  const out=[];
  for(let gx=0; gx<=Math.ceil(W*CS/2.9); gx++)
    for(let gz=0; gz<=Math.ceil(H*CS/2.9); gz++)
      out.push({ el:'grass', at:[ox+gx*2.9-0.6, oz+gz*2.9-0.6],
                 yaw:[0,90,180,270][Math.floor(rnd()*4)] });
  const HEDGES=['hedge','hedge2'], TUFTS=['fern','fern2','plantbed'];
  for(let r=0;r<H;r++) for(let cc2=0;cc2<W;cc2++){
    const ch=M[r][cc2], x=ox+cc2*CS, z=oz+r*CS;
    if(ch==='#'){
      out.push({ el:HEDGES[Math.floor(rnd()*2)], at:[x,z],
                 yaw:rnd()*360, s:0.48+rnd()*0.16, y:0.08 });
      if(rnd()<0.4)
        out.push({ el:TUFTS[Math.floor(rnd()*3)],
                   at:[x+(rnd()-0.5)*0.45, z+(rnd()-0.5)*0.45],
                   yaw:rnd()*360, s:0.3+rnd()*0.18, y:0.12 });
    }
    if(ch==='P') out.push({ el:'pump', at:[x,z], yaw:180, s:0.55, y:0.1 });
    if(ch==='R') out.push({ el:'redtruck', at:[x,z], yaw:160, s:0.4, y:0.1 });
  }
  return out;
}
/* SABRE WULF JUNGLE — connected rooms walled with exuberant foliage,
   narrow doorways between them, a swamp corner, a ruin. Walls are
   double rows: big hedges behind, vivid tufts in front — the vivid
   tinted variants give the Spectrum-palette punch. */
function jungleLayout(){
  const rnd=mulberry32(1985);
  const out=[];
  const W2=6.4, H2=5.0;
  const BACK=['hedge','hedge2','hedge3','palmfan'];
  const FRONT=['fern','fern2','fern3','plantbed','plantbed2'];
  function wallRun(x0,z0,x1,z1,doors){
    const len=Math.hypot(x1-x0,z1-z0), n=Math.max(2,Math.round(len/1.1));
    for(let i=0;i<=n;i++){
      const t=i/n, x=x0+(x1-x0)*t, z=z0+(z1-z0)*t;
      if((doors||[]).some(d=>Math.abs(t-d)<0.11)) continue;   // a doorway
      const bk=BACK[Math.floor(rnd()*BACK.length)];
      out.push({ el:bk, at:[x+(rnd()-.5)*.25, z+(rnd()-.5)*.25],
                 yaw:rnd()*360, s:(bk==='palmfan'?0.42:0.55)+rnd()*0.18, y:0.05 });
      if(rnd()<0.45)
        out.push({ el:FRONT[Math.floor(rnd()*FRONT.length)],
                   at:[x+(rnd()-.5)*.6, z+(rnd()-.5)*.6],
                   yaw:rnd()*360, s:0.3+rnd()*0.18, y:0.1 });
    }
  }
  /* 2x2 rooms: outer hull (south door), inner cross with doorways */
  wallRun(-W2,-H2,  W2,-H2, []);            // north hull
  wallRun(-W2, H2,  W2, H2, [0.5]);         // south hull + entrance
  wallRun(-W2,-H2, -W2, H2, []);            // west hull
  wallRun( W2,-H2,  W2, H2, []);            // east hull
  wallRun(   0,-H2,   0, H2, [0.25,0.75]);  // inner vertical, 2 doors
  wallRun(-W2,  0,  W2,  0, [0.25,0.75]);   // inner horizontal, 2 doors
  /* floors: a trail patch in each room */
  for(const [rx,rz] of [[-W2/2,-H2/2],[W2/2,-H2/2],[-W2/2,H2/2],[W2/2,H2/2]])
    out.push({ el:'trail', at:[rx,rz], yaw:[0,90,180,270][Math.floor(rnd()*4)], s:0.85 });
  /* the swamp room and the ruin room */
  out.push({ el:'pond', at:[-W2/2, H2/2+0.6], yaw:0, s:0.9, y:0.02 });
  out.push({ el:'trestle', at:[ W2/2+0.8,-H2/2], yaw:225, s:0.42, y:0.05 });
  out.push({ el:'cistern', at:[-W2/2-0.8,-H2/2-0.4], yaw:45, s:0.5, y:0.05 });
  return out;
}
const LAYOUTS={
  maze: mazeLayout,
  jungle: jungleLayout,
  yard: [
    /* ground first: forest-moss tiles as FILLER between the stamps */
    { el:'grass', at:[-1.5,-1.5] }, { el:'grass', at:[ 1.5,-1.5] },
    { el:'grass', at:[-1.5, 1.5] }, { el:'grass', at:[ 1.5, 1.5] },
    /* the glasshouse facade at the back */
    { el:'windowwall', at:[-0.9,-2.7], yaw:0, s:0.8, y:0.08 },
    { el:'windowwall', at:[ 1.3,-2.7], yaw:0, s:0.8, y:0.08 },
    /* a hedge boundary on the west side (brickwall retired: it was
       a roof slab in denial — the turntable showed no good angle) */
    { el:'hedge',  at:[-2.9,-1.4], yaw:90, s:0.7, y:0.08 },
    { el:'hedge2', at:[-2.9, 0.1], yaw:270, s:0.72, y:0.08 },
    { el:'hedge',  at:[-2.9, 1.6], yaw:120, s:0.68, y:0.08 },
    /* furniture, oriented by their sides verdicts: rustcar shows its
       full profile south; redtruck hides its unscanned smear (0-45
       viewer arc) against the north facade */
    { el:'pump',    at:[-2.1,-1.9], yaw:30,  s:0.85, y:0.1 },
    { el:'rustcar', at:[ 0.5, 0.7], yaw:0,   s:0.5,  y:0.1 },
    { el:'redtruck',at:[ 2.3,-1.0], yaw:150, s:0.55, y:0.1 },
  ],
};
/* =========================================================
   ROAMERS — dbdb2 citizens as alpha-tested billboard sprites.
   Cutout alpha writes DEPTH, so the scan's gaussians occlude them
   per-leaf for free (the writings trick, walking). Sheets baked
   from the game's own rotoscope rigs by tools/sprite-bake.mjs.
   ========================================================= */
let SPR=null;
fetch('sprites/sprites.json').then(r=>r.json()).then(j=>{ SPR=j; }).catch(()=>{});
const sprAssets={};
function sprAsset(kind){
  if(sprAssets[kind]) return sprAssets[kind];
  const a=new pc.Asset('spr-'+kind,'texture',{ url:'sprites/'+kind+'.png' });
  app.assets.add(a); app.assets.load(a);
  sprAssets[kind]=a; return a;
}
const roamers=[];
function spawnRoamer(kind, x, z, ai){
  const e=new pc.Entity('roamer');
  const pl=new pc.Entity('pl');
  pl.addComponent('render',{ type:'plane' });
  const m=new pc.StandardMaterial();
  m.useLighting=false; m.diffuse=new pc.Color(0,0,0);
  m.emissive=new pc.Color(1,1,1);
  m.blendType=pc.BLEND_NONE; m.alphaTest=0.5; m.depthWrite=true;
  m.cull=pc.CULLFACE_NONE;
  m.update();
  pl.render.meshInstances[0].material=m;
  const a=sprAsset(kind);
  const apply=()=>{ if(!SPR) return setTimeout(apply,300);
    m.emissiveMap=a.resource; m.opacityMap=a.resource;
    m.opacityMapChannel='a';
    m.emissiveMapTiling=new pc.Vec2(1/SPR.phases, 1/SPR.bearings);
    m.opacityMapTiling=new pc.Vec2(1/SPR.phases, 1/SPR.bearings);
    m.update(); };
  if(a.loaded) apply(); else a.on('load',apply);
  pl.setLocalEulerAngles(90,0,0);            // plane +y -> facing +z
  pl.setLocalScale(1.6,1,1.6);               // the bake cell is 2.4u; ~1.2u person
  pl.setLocalPosition(0,0.83,0);
  e.addChild(pl);
  e.setPosition(x,0,z);
  app.root.addChild(e);
  const r={ e, m, kind, x, z, ai, heading:0, phase:Math.random()*4,
    dir:[0,1], speed: ai==='ghost'?0.85:0.32, cool:0 };
  roamers.push(r); return r;
}
function clearRoamers(){ for(const r of roamers) r.e.destroy(); roamers.length=0; }
function mazeOpen(cx,cz){
  const I=MAZE_INFO; if(!I) return false;
  if(cx<0||cz<0||cx>=I.W||cz>=I.H) return false;
  return I.M[cz][cx]!=='#';
}
function upRoamers(dt){
  if(!SPR || !roamers.length) return;
  const cp=camE.getPosition();
  for(const r of roamers){
    if(r.ai==='ghost' && MAZE_INFO){
      /* corridor wander: at each cell centre pick an open direction,
         never reversing unless dead-ended — the ghost habit */
      const I=MAZE_INFO;
      const cx=Math.round((r.x-I.ox)/I.CS), cz=Math.round((r.z-I.oz)/I.CS);
      const ctrX=I.ox+cx*I.CS, ctrZ=I.oz+cz*I.CS;
      if(Math.hypot(r.x-ctrX,r.z-ctrZ)<0.06){
        const opts=[[1,0],[-1,0],[0,1],[0,-1]]
          .filter(d=>mazeOpen(cx+d[0],cz+d[1]))
          .filter(d=>!(d[0]===-r.dir[0]&&d[1]===-r.dir[1]));
        if(opts.length) r.dir=opts[Math.floor(Math.random()*opts.length)];
        else r.dir=[-r.dir[0],-r.dir[1]];
        r.x=ctrX; r.z=ctrZ;
      }
      r.x+=r.dir[0]*r.speed*dt; r.z+=r.dir[1]*r.speed*dt;
      r.heading=Math.atan2(r.dir[0],r.dir[1]);
      r.phase+=dt*5.5;
    } else if(r.ai==='zombie'){
      /* the horde: shamble toward a slow-roving attractor, shoulder
         to shoulder but never stacking */
      const ax=Math.sin(t*0.11)*3.2, az=Math.cos(t*0.15)*2.4;
      let dx=ax-r.x, dz=az-r.z;
      const d=Math.hypot(dx,dz)||1; dx/=d; dz/=d;
      for(const o of roamers){ if(o===r) continue;
        const sx=r.x-o.x, sz=r.z-o.z, sd=Math.hypot(sx,sz);
        if(sd<0.55&&sd>0.001){ dx+=sx/sd*0.7; dz+=sz/sd*0.7; } }
      const l=Math.hypot(dx,dz)||1;
      const wob=Math.sin(t*1.7+r.phase*3)*0.35;   // the lurch
      r.x+=(dx/l)*r.speed*dt; r.z+=(dz/l)*r.speed*dt;
      r.heading=Math.atan2(dx/l,dz/l)+wob*0.3;
      r.phase+=dt*2.1;
    }
    /* billboard toward the camera; pick the sheet row for the
       viewer's bearing relative to the character's heading */
    const camB=Math.atan2(cp.x-r.x, cp.z-r.z)*180/Math.PI;
    r.e.setPosition(r.x,0,r.z);
    r.e.setEulerAngles(0,camB,0);
    let rel=camB - r.heading*180/Math.PI;
    rel=((rel%360)+360)%360;
    const row=Math.round(rel/45)%SPR.bearings;
    const col=Math.floor(r.phase)%SPR.phases;
    const u=col/SPR.phases, v=1-(row+1)/SPR.bearings;
    if(m0x(r.m,u,v)) r.m.update();
  }
}
function m0x(m,u,v){
  if(m.emissiveMapOffset.x===u && m.emissiveMapOffset.y===v) return false;
  m.emissiveMapOffset.set(u,v); m.opacityMapOffset.set(u,v);
  return true;
}

let bounds=6;
function build(name){
  clearStamps();
  clearRoamers();
  if(name==='catalog'){
    let x=-4;
    for(const el of pack.elements){
      stamp(el.id, x+el.dims[0]/2, 0, 0, 1);
      x+=el.dims[0]+1.2;
    }
    bounds=Math.max(6,(x+4)/2);
    document.getElementById('hInfo').textContent=pack.elements.length+' ELEMENTS';
  } else {
    const lay=typeof LAYOUTS[name]==='function' ? LAYOUTS[name]() : LAYOUTS[name];
    for(const s of lay) stamp(s.el, s.at[0], s.at[1], s.yaw||0, s.s||1, s.y||0);
    bounds=name==='maze'?7:(name==='jungle'?8:6);
    document.getElementById('hInfo').textContent='LAY · '+name.toUpperCase()
      +' · '+lay.length+' stamps';
    /* the citizens arrive: ghosts wander the maze corridors, the
       horde shambles the jungle */
    if(name==='maze'){
      spawnRoamer('walker1',-2.3,-1.15*3,'ghost');
      spawnRoamer('walker2', 2.3, 1.15*2,'ghost');
      spawnRoamer('walker3', 0,   1.15*3,'ghost');
    } else if(name==='jungle'){
      const rr=mulberry32(66);
      for(let i=0;i<6;i++)
        spawnRoamer('zombie', (rr()-0.5)*9, (rr()-0.5)*7, 'zombie');
    }
  }
}

/* orbit: drag spins, wheel/pinch zooms, idle drifts */
let yaw=25, pitch=14, dist=1.0, idle=0;
let drag=null, pinch0=0;
addEventListener('pointerdown',e=>{ if(e.target.closest('#bar')) return; drag=[e.clientX,e.clientY]; });
addEventListener('pointermove',e=>{ if(!drag) return;
  yaw-=(e.clientX-drag[0])*0.3; pitch+=(e.clientY-drag[1])*0.25;
  pitch=Math.max(2,Math.min(70,pitch)); drag=[e.clientX,e.clientY]; idle=0; });
addEventListener('pointerup',()=>{ drag=null; });
addEventListener('wheel',e=>{ dist*=e.deltaY>0?1.08:0.93; dist=Math.max(0.35,Math.min(2.5,dist)); idle=0; });
addEventListener('touchmove',e=>{ if(e.touches.length===2){
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                     e.touches[0].clientY-e.touches[1].clientY);
  if(pinch0) { dist*=pinch0/d; dist=Math.max(0.35,Math.min(2.5,dist)); }
  pinch0=d; idle=0; drag=null; } },{passive:true});
addEventListener('touchend',()=>{ pinch0=0; });

let t=0;
app.on('update',dt=>{
  t+=dt; idle+=dt;
  if(idle>4) yaw+=dt*4;
  const yr=yaw*Math.PI/180, pr=pitch*Math.PI/180;
  const d=bounds*2.2*dist;
  camE.setPosition(Math.sin(yr)*Math.cos(pr)*d, 1+Math.sin(pr)*d, Math.cos(yr)*Math.cos(pr)*d);
  camE.lookAt(0,0.9,0);
  upRoamers(dt);
});

/* bar: four scenes + one ELEMENTS drawer (the pack outgrew a
   button-per-element row) */
const bar=document.getElementById('bar');
const drawer=document.getElementById('elDrawer');
const mk=(label,fn)=>{ const b=document.createElement('button');
  b.type='button'; b.textContent=label;
  b.addEventListener('click',()=>{ [...bar.children].forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); fn(); });
  bar.appendChild(b); return b; };
const bCat=mk('CATALOG',()=>{ drawer.classList.add('hidden'); build('catalog'); });
mk('YARD',()=>{ drawer.classList.add('hidden'); build('yard'); });
mk('PAC-MAZE',()=>{ drawer.classList.add('hidden'); build('maze'); });
mk('JUNGLE',()=>{ drawer.classList.add('hidden'); build('jungle'); });
const bEl=mk('ELEMENTS \u25be',()=>{ drawer.classList.toggle('hidden'); });
for(const el of pack.elements){
  const b=document.createElement('button');
  b.type='button'; b.textContent=el.id.toUpperCase();
  b.addEventListener('click',()=>{
    drawer.classList.add('hidden');
    [...bar.children].forEach(x=>x.classList.remove('on'));
    bEl.classList.add('on');
    window.__pack.solo(el.id);
  });
  drawer.appendChild(b);
}

const start=Q.get('lay');
(start && LAYOUTS[start] ? mk : ()=>{})   // unknown lay -> ignore
const b0=({yard:1,maze:2,jungle:3})[start]!==undefined
  ? [...bar.children][({yard:1,maze:2,jungle:3})[start]] : bCat;
b0.classList.add('on');
build(start&&LAYOUTS[start]?start:'catalog');

/* headless hook */
window.__pack={ get ready(){ return Object.values(assets).every(a=>a.loaded)&&Object.keys(assets).length>0; },
  build, get els(){ return pack.elements.map(e=>e.id); },
  get roamers(){ return roamers.map(r=>({kind:r.kind,x:+r.x.toFixed(2),z:+r.z.toFixed(2)})); },
  solo(id){ clearStamps();
    const el=EL[id]; stamp(id,0,0,0,1);
    bounds=Math.max(2.2,Math.max(el.dims[0],el.dims[2])*0.9);
    if(el.sides){ yaw=el.sides.face; idle=-6; }   // open on the good side
    document.getElementById('hInfo').textContent=id.toUpperCase()
      +(el.sides&&el.sides.weak.length?' · weak '+el.sides.weak.map(w=>w.join('-')+'\u00b0').join(', '):''); },
  setCam(y2,p2,d2){ yaw=y2; pitch=p2; dist=d2; idle=0; } };
</script>
</body>
</html>
