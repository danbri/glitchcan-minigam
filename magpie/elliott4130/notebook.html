<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <title>Elliott 4130 LISP — Observable Notebook</title>
    <style>
        :root {
            --obs-blue: #3b5fc0;
            --obs-purple: #7b6fde;
            --obs-green: #2da44e;
            --obs-orange: #d97706;
            --obs-gray: #6e7781;
            --obs-light: #f6f8fa;
            --obs-border: #d0d7de;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.6;
            color: #24292f;
            background: white;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            -webkit-overflow-scrolling: touch;
        }

        .container {
            max-width: 840px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Header */
        .notebook-header {
            border-bottom: 1px solid var(--obs-border);
            padding: 20px 0;
            margin-bottom: 24px;
        }
        .notebook-header h1 { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
        .notebook-header .author { color: var(--obs-gray); font-size: 14px; }
        .notebook-header a { color: var(--obs-blue); text-decoration: none; }

        /* Cells */
        .cell {
            position: relative;
            margin-bottom: 16px;
            border-left: 3px solid transparent;
            padding-left: 12px;
            transition: border-color 0.15s;
        }
        .cell.stale { border-left-color: var(--obs-orange); }
        .cell.running { border-left-color: var(--obs-blue); }
        .cell.error { border-left-color: #cf222e; }
        .cell.fresh { border-left-color: var(--obs-green); }
        .cell.dirty { border-left-color: var(--obs-purple); }

        /* Cell name badge with toggle */
        .cell-header {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
        }
        .cell-toggle {
            width: 16px;
            height: 16px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            color: var(--obs-gray);
            transition: transform 0.15s;
        }
        .cell-toggle:hover { color: var(--obs-blue); }
        .cell-toggle.open { transform: rotate(90deg); }
        .cell-name {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--obs-purple);
            cursor: pointer;
        }
        .cell-name:hover { text-decoration: underline; }
        .cell-deps {
            font-size: 11px;
            color: var(--obs-gray);
            margin-left: 8px;
        }

        /* Collapsible code editor */
        .cell-code {
            display: none;
            margin-bottom: 8px;
        }
        .cell-code.open {
            display: block;
        }
        .cell-code textarea {
            width: 100%;
            min-height: 60px;
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid var(--obs-border);
            border-radius: 6px;
            background: white;
            resize: vertical;
            outline: none;
        }
        .cell-code textarea:focus {
            border-color: var(--obs-blue);
            box-shadow: 0 0 0 3px rgba(59, 95, 192, 0.1);
        }
        .cell-code-hint {
            font-size: 11px;
            color: var(--obs-gray);
            margin-top: 4px;
        }
        .cell-run-btn {
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            background: var(--obs-green);
            color: white;
            cursor: pointer;
            margin-left: auto;
        }
        .cell-run-btn:active { transform: scale(0.96); }

        /* Viewof input widget (like Observable Inputs.textarea) */
        .viewof-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .viewof-input {
            width: 100%;
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid var(--obs-border);
            border-radius: 6px;
            background: white;
            resize: vertical;
            outline: none;
        }
        .viewof-input:focus {
            border-color: var(--obs-blue);
            box-shadow: 0 0 0 3px rgba(59, 95, 192, 0.1);
        }
        .viewof-buttons {
            display: flex;
            gap: 8px;
        }
        .viewof-save, .viewof-reset {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .viewof-save {
            color: white;
            background: var(--obs-blue);
        }
        .viewof-save:hover { background: #2c4a9e; }
        .viewof-reset {
            color: #24292f;
            background: var(--obs-light);
            border: 1px solid var(--obs-border);
        }
        .viewof-reset:hover { background: #e8e8e8; }
        .viewof-save:active, .viewof-reset:active {
            transform: scale(0.98);
        }
        .cell.dirty .viewof-save {
            background: var(--obs-green);
        }

        /* Output */
        .cell-output {
            padding: 12px 16px;
            background: var(--obs-light);
            border: 1px solid var(--obs-border);
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 13px;
            overflow-x: auto;
        }
        .cell-output.error-output {
            background: #fff5f5;
            border-color: #cf222e;
            color: #cf222e;
        }

        /* Inspector formatting */
        .insp-obj { color: #24292f; }
        .insp-key { color: var(--obs-purple); }
        .insp-str { color: #0a3069; }
        .insp-num { color: #0550ae; }
        .insp-bool { color: #cf222e; }
        .insp-null { color: var(--obs-gray); }
        .insp-fn { color: #8250df; font-style: italic; }

        /* Markdown cells */
        .cell-md {
            padding: 8px 0;
        }
        .cell-md h2 {
            font-size: 20px;
            font-weight: 600;
            margin: 16px 0 8px;
            padding-top: 16px;
            border-top: 1px solid var(--obs-border);
        }
        .cell-md h2:first-child { border-top: none; padding-top: 0; margin-top: 0; }
        .cell-md p { color: #57606a; margin-bottom: 8px; }
        .cell-md code {
            font-family: var(--font-mono);
            background: var(--obs-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        /* Teleprinter */
        .teleprinter {
            font-family: var(--font-mono);
            font-size: 15px;
            background: #0d1117;
            color: #58a6ff;
            padding: 16px;
            border-radius: 8px;
            min-height: 80px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Registers table */
        .reg-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 14px;
        }
        .reg-table th {
            text-align: left;
            font-weight: 500;
            color: var(--obs-gray);
            padding: 8px;
            border-bottom: 1px solid var(--obs-border);
            font-size: 11px;
            text-transform: uppercase;
        }
        .reg-table td { padding: 8px; border-bottom: 1px solid var(--obs-border); }
        .reg-name { color: var(--obs-purple); font-weight: 600; }
        .reg-val { font-weight: 600; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            min-height: 44px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            border: 1px solid var(--obs-border);
            background: var(--obs-light);
            color: #24292f;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background: #e8e8e8; }
        .btn-primary { background: var(--obs-blue); border-color: var(--obs-blue); color: white; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

        @media (hover: hover) {
            .btn { padding: 8px 14px; min-height: 36px; }
            .btn:hover { background: #f3f4f6; }
            .btn-primary:hover { background: #2c4a9e; }
        }

        /* Footer */
        .notebook-footer {
            margin-top: 48px;
            padding: 24px 0;
            border-top: 1px solid var(--obs-border);
            color: var(--obs-gray);
            font-size: 13px;
        }

        /* Dependency graph styles */
        .dep-stale { color: var(--obs-orange); }
        .dep-error { color: #cf222e; }
    </style>
</head>
<body>

<div class="container">
    <header class="notebook-header">
        <h1>Elliott 4130 LISP</h1>
        <div class="author">
            A 1965 British minicomputer running McCarthy's LISP 1.5 —
            <a href="https://github.com/danbri/glitchcan-minigam/tree/main/magpie/elliott4130">View source</a>
        </div>
    </header>

    <div id="notebook"></div>

    <footer class="notebook-footer">
        Elliott 4130 Emulator — Based on CCS E6X Reference Manuals (1965) —
        <a href="elliott4130.html">Full Emulator UI</a>
    </footer>
</div>

<!-- Load Elliott 4130 modules -->
<script src="elliott4130-core.js"></script>
<script src="elliott4130-asm.js"></script>

<script>
// ============================================================================
// Reactive Notebook Runtime (Observable-style)
// ============================================================================

class Notebook {
    constructor(container) {
        this.container = container;
        this.cells = new Map();      // name -> Cell
        this.values = new Map();     // name -> current value
        this.order = [];             // cell names in definition order
        this.running = new Set();    // cells currently executing
    }

    // Define a cell
    define(name, deps, fn, options = {}) {
        const cell = {
            name,
            deps: deps || [],
            fn,
            type: options.type || 'code',  // 'code', 'md', 'viewof'
            hidden: options.hidden || false,
            editable: options.editable !== false,  // true by default for code
            el: null,
            outputEl: null,
            editorEl: null,
            stale: true,
            error: null,
            dirty: false  // for viewof cells: edited but not saved
        };

        this.cells.set(name, cell);
        this.order.push(name);

        if (!cell.hidden) {
            this.renderCell(cell);
        }

        // Queue initial evaluation
        this.invalidate(name);
        return this;
    }

    // Mark a cell and its dependents as stale
    invalidate(name) {
        const cell = this.cells.get(name);
        if (!cell) return;

        cell.stale = true;
        this.updateCellUI(cell);

        // Find and invalidate dependents
        for (const [depName, depCell] of this.cells) {
            if (depCell.deps.includes(name)) {
                this.invalidate(depName);
            }
        }

        // Schedule evaluation
        this.scheduleEval();
    }

    // Schedule evaluation of stale cells
    scheduleEval() {
        if (this._evalScheduled) return;
        this._evalScheduled = true;
        queueMicrotask(() => {
            this._evalScheduled = false;
            this.evalStale();
        });
    }

    // Evaluate all stale cells in dependency order
    async evalStale() {
        const ready = [];

        for (const name of this.order) {
            const cell = this.cells.get(name);
            if (!cell.stale) continue;

            // Check if all deps are ready
            const depsReady = cell.deps.every(dep => {
                const depCell = this.cells.get(dep);
                return depCell && !depCell.stale && !depCell.error;
            });

            if (depsReady) {
                ready.push(cell);
            }
        }

        for (const cell of ready) {
            await this.evalCell(cell);
        }

        // Check if more cells became ready
        const stillStale = [...this.cells.values()].some(c => c.stale && !c.error);
        if (stillStale) {
            this.scheduleEval();
        }
    }

    // Evaluate a single cell
    async evalCell(cell) {
        if (!cell.stale) return;

        this.running.add(cell.name);
        cell.error = null;
        this.updateCellUI(cell);

        try {
            // Gather dependency values
            const args = cell.deps.map(dep => this.values.get(dep));

            // Execute
            let result = cell.fn(...args);
            if (result instanceof Promise) {
                result = await result;
            }

            // Store result
            this.values.set(cell.name, result);
            cell.stale = false;

            // For viewof cells, populate the textarea with the value
            if (cell.type === 'viewof' && cell.editorEl) {
                cell.editorEl.value = result;
                cell.editorEl.rows = Math.min(20, Math.max(8, result.split('\n').length));
            }

            // Render output
            this.renderOutput(cell, result);

        } catch (e) {
            cell.error = e;
            this.renderError(cell, e);
        }

        this.running.delete(cell.name);
        this.updateCellUI(cell);
    }

    // Render a cell's DOM
    renderCell(cell) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.dataset.name = cell.name;

        // Markdown cell - just render HTML
        if (cell.type === 'md') {
            div.innerHTML = `<div class="cell-md">${cell.fn()}</div>`;
            cell.el = div;
            this.container.appendChild(div);
            return;
        }

        // Cell header with toggle triangle and run button
        const header = document.createElement('div');
        header.className = 'cell-header';

        const toggle = document.createElement('button');
        toggle.className = 'cell-toggle';
        toggle.innerHTML = '▶';
        toggle.title = 'Show/hide code';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'cell-name';
        nameSpan.textContent = cell.name;

        // Run button (mobile-friendly, always visible)
        const runBtn = document.createElement('button');
        runBtn.className = 'cell-run-btn';
        runBtn.textContent = '▶ Run';
        runBtn.onclick = (e) => {
            e.stopPropagation();
            if (cell.codeEl) {
                this.updateCellCode(cell.name, cell.codeEl.value);
            } else {
                this.invalidate(cell.name);
            }
        };

        header.appendChild(toggle);
        header.appendChild(nameSpan);
        header.appendChild(runBtn);
        div.appendChild(header);

        // Collapsible code editor (hidden by default)
        const codeDiv = document.createElement('div');
        codeDiv.className = 'cell-code';

        const codeArea = document.createElement('textarea');
        codeArea.value = this.fnToSource(cell.fn);
        codeArea.rows = Math.max(3, codeArea.value.split('\n').length);
        codeArea.spellcheck = false;

        // Shift+Enter to run
        codeArea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.shiftKey) {
                e.preventDefault();
                this.updateCellCode(cell.name, codeArea.value);
            }
        });

        const hint = document.createElement('div');
        hint.className = 'cell-code-hint';
        hint.textContent = 'Shift+Enter to run';

        codeDiv.appendChild(codeArea);
        codeDiv.appendChild(hint);
        div.appendChild(codeDiv);

        // Toggle click handler
        const toggleCode = () => {
            toggle.classList.toggle('open');
            codeDiv.classList.toggle('open');
        };
        toggle.onclick = toggleCode;
        nameSpan.onclick = toggleCode;

        // Viewof cell - widget that emits values (like Observable Inputs)
        if (cell.type === 'viewof') {
            const wrapper = document.createElement('div');
            wrapper.className = 'viewof-wrapper';

            const textarea = document.createElement('textarea');
            textarea.className = 'viewof-input';
            textarea.rows = 12;
            textarea.spellcheck = false;
            textarea.placeholder = 'Loading...';

            // Mark dirty on edit (no auto-propagate)
            textarea.addEventListener('input', () => {
                cell.dirty = true;
                this.updateCellUI(cell);
            });

            // Button group
            const btnGroup = document.createElement('div');
            btnGroup.className = 'viewof-buttons';

            // Save button - triggers control flow
            const saveBtn = document.createElement('button');
            saveBtn.className = 'viewof-save';
            saveBtn.textContent = 'Save & Run';
            saveBtn.onclick = () => this.saveViewof(cell.name, textarea.value);

            // Reset button - revert to last saved value
            const resetBtn = document.createElement('button');
            resetBtn.className = 'viewof-reset';
            resetBtn.textContent = 'Reset';
            resetBtn.onclick = () => {
                textarea.value = this.values.get(cell.name) || '';
                cell.dirty = false;
                this.updateCellUI(cell);
            };

            btnGroup.appendChild(saveBtn);
            btnGroup.appendChild(resetBtn);

            wrapper.appendChild(textarea);
            wrapper.appendChild(btnGroup);
            div.appendChild(wrapper);

            cell.el = div;
            cell.editorEl = textarea;
            cell.codeEl = codeArea;
            this.container.appendChild(div);
            return;
        }

        // Regular code cell - output below
        const output = document.createElement('div');
        output.className = 'cell-output';
        div.appendChild(output);

        cell.el = div;
        cell.outputEl = output;
        cell.codeEl = codeArea;
        this.container.appendChild(div);
    }

    // Save a viewof cell's value (called on Shift+Enter)
    saveViewof(name, value) {
        const cell = this.cells.get(name);
        if (!cell) return;

        cell.dirty = false;
        this.values.set(name, value);
        cell.stale = false;
        this.updateCellUI(cell);

        // Invalidate dependents
        for (const [depName, depCell] of this.cells) {
            if (depCell.deps.includes(name)) {
                this.invalidate(depName);
            }
        }
    }

    // Convert function to displayable source
    fnToSource(fn) {
        let src = fn.toString();

        // Arrow function with block body: () => { ... }
        let match = src.match(/^\s*(?:\([^)]*\)|[a-zA-Z_]\w*)\s*=>\s*\{([\s\S]*)\}\s*$/);
        if (match) {
            return match[1].trim();
        }

        // Arrow function with expression body: () => expr
        match = src.match(/^\s*(?:\([^)]*\)|[a-zA-Z_]\w*)\s*=>\s*(.+)$/);
        if (match) {
            return match[1].trim();
        }

        // Regular function: function() { ... }
        match = src.match(/^function[^{]*\{([\s\S]*)\}\s*$/);
        if (match) {
            return match[1].trim();
        }

        return src;
    }

    // Update cell code from editor
    updateCellCode(name, source) {
        const cell = this.cells.get(name);
        if (!cell) return;

        try {
            // Create new function from source
            const argNames = cell.deps.join(', ');
            const fn = new Function(argNames, `return (${source})`);
            cell.fn = fn;
            this.invalidate(name);
        } catch (e) {
            // Try as statements
            try {
                const argNames = cell.deps.join(', ');
                const fn = new Function(argNames, source);
                cell.fn = fn;
                this.invalidate(name);
            } catch (e2) {
                cell.error = e2;
                this.renderError(cell, e2);
            }
        }
    }

    // Update cell visual state
    updateCellUI(cell) {
        if (!cell.el) return;

        cell.el.classList.remove('stale', 'running', 'error', 'fresh', 'dirty');

        if (cell.error) {
            cell.el.classList.add('error');
        } else if (cell.dirty) {
            cell.el.classList.add('dirty');
        } else if (this.running.has(cell.name)) {
            cell.el.classList.add('running');
        } else if (cell.stale) {
            cell.el.classList.add('stale');
        } else {
            cell.el.classList.add('fresh');
        }
    }

    // Render output value
    renderOutput(cell, value) {
        if (!cell.outputEl) return;

        if (value === undefined) {
            cell.outputEl.innerHTML = '';
            return;
        }

        // Check for custom display
        if (value && typeof value._display === 'function') {
            cell.outputEl.innerHTML = '';
            const content = value._display();
            if (typeof content === 'string') {
                cell.outputEl.innerHTML = content;
            } else if (content instanceof Node) {
                cell.outputEl.appendChild(content);
            }
            return;
        }

        cell.outputEl.classList.remove('error-output');
        cell.outputEl.innerHTML = this.inspect(value);
    }

    // Render error
    renderError(cell, error) {
        if (!cell.outputEl) return;
        cell.outputEl.classList.add('error-output');
        cell.outputEl.textContent = `Error: ${error.message}`;
    }

    // Format value for display
    inspect(value, depth = 0) {
        if (depth > 3) return '<span class="insp-null">...</span>';

        if (value === null) return '<span class="insp-null">null</span>';
        if (value === undefined) return '<span class="insp-null">undefined</span>';

        const type = typeof value;

        if (type === 'string') {
            return `<span class="insp-str">"${this.escapeHtml(value)}"</span>`;
        }
        if (type === 'number') {
            return `<span class="insp-num">${value}</span>`;
        }
        if (type === 'boolean') {
            return `<span class="insp-bool">${value}</span>`;
        }
        if (type === 'function') {
            return `<span class="insp-fn">ƒ ${value.name || 'anonymous'}</span>`;
        }

        if (Array.isArray(value)) {
            if (value.length === 0) return '[]';
            if (value.length > 10) {
                return `Array(${value.length})`;
            }
            const items = value.map(v => this.inspect(v, depth + 1)).join(', ');
            return `[${items}]`;
        }

        if (value instanceof Int32Array || value instanceof Uint8Array) {
            return `${value.constructor.name}(${value.length})`;
        }

        if (type === 'object') {
            const name = value.constructor?.name;
            if (name && name !== 'Object') {
                // Custom object - show type and key properties
                const keys = Object.keys(value).slice(0, 5);
                if (keys.length === 0) return `<span class="insp-obj">${name} {}</span>`;
                const props = keys.map(k =>
                    `<span class="insp-key">${k}</span>: ${this.inspect(value[k], depth + 1)}`
                ).join(', ');
                return `<span class="insp-obj">${name}</span> { ${props}${Object.keys(value).length > 5 ? ', ...' : ''} }`;
            }

            const keys = Object.keys(value);
            if (keys.length === 0) return '{}';
            const props = keys.slice(0, 8).map(k =>
                `<span class="insp-key">${k}</span>: ${this.inspect(value[k], depth + 1)}`
            ).join(', ');
            return `{ ${props}${keys.length > 8 ? ', ...' : ''} }`;
        }

        return String(value);
    }

    escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Helper to get a value
    get(name) {
        return this.values.get(name);
    }

    // Helper to set a value (triggers dependents)
    set(name, value) {
        this.values.set(name, value);
        const cell = this.cells.get(name);
        if (cell) {
            cell.stale = false;
            this.renderOutput(cell, value);
        }
        // Invalidate dependents
        for (const [depName, depCell] of this.cells) {
            if (depCell.deps.includes(name)) {
                this.invalidate(depName);
            }
        }
    }
}

// --- Tape Encoder: converts text → tape data ---
nb.define('tapeEncoder', [], () => {
    return {
        // Encode text to Elliott tape format (7-bit ASCII + EOF)
        encode(text) {
            const data = [];
            for (const ch of text) {
                data.push(ch.charCodeAt(0) & 0x7F);
            }
            // EOF marker: 0 (LISP checks JZ for EOF, not 0xFF)
            data.push(0);
            return data;
        },
        _display: () => 'TapeEncoder { encode(text) → Uint8Array }'
    };
});

// --- CPU Factory: creates fresh E4130 instances ---
nb.define('cpuFactory', [], () => {
    return {
        create() {
            const cpu = new E4130();
            cpu.hardwareFPEnabled = true;
            return cpu;
        },
        _display: () => 'CPUFactory { create() → E4130 }'
    };
});

// --- Section: Load LISP ---
nb.define('section_load', [], () => `

    <p>Assemble <code>lisp4130.asm</code> — a native LISP 1.5 interpreter.</p>
`, { type: 'md' });

// --- LISP Source (viewof: edit and save to recompile) ---
nb.define('lispSource', [], async () => {
    try {
        const resp = await fetch('lisp4130.asm');
        if (!resp.ok) throw new Error('Not found');
        return await resp.text();
    } catch {
        return MINI_LISP_SRC;
    }
}, { type: 'viewof' });

// --- Assembled Program ---
nb.define('program', ['asm', 'lispSource'], (asm, src) => {
    const prog = asm.asm(src);
    return {
        words: prog,
        length: prog.length,
        _display: () => `Assembled ${prog.length} words`
    };
});

// --- Emulator: combines CPU + program + I/O ---
nb.define('emulator', ['cpuFactory', 'program', 'tapeEncoder'], (factory, prog, encoder) => {
    const cpu = factory.create();

    // Load program into memory
    for (const { addr, word } of prog.words) {
        cpu.mem[addr] = word;
    }

    // State
    let tapeData = [];
    let tapePos = 0;
    let output = '';
    let cycles = 0;

    // Setup I/O channels
    cpu.channels[1] = {
        read: () => tapePos < tapeData.length ? tapeData[tapePos++] : 0,  // 0 = EOF
        status: () => tapePos < tapeData.length ? 1 : 0
    };
    cpu.channels[2] = {
        write: (v) => { output += String.fromCharCode(v & 0x7F); },
        status: () => 1
    };

    const emu = {
        cpu,

        // Load LISP expressions onto tape
        loadTape(text) {
            tapeData = encoder.encode(text);
            tapePos = 0;
            return tapeData.length - 1;  // -1 for EOF marker
        },

        // Reset CPU and reload program
        reset() {
            cpu.reset();
            cpu.halted = false;
            for (const { addr, word } of prog.words) {
                cpu.mem[addr] = word;
            }
            tapePos = 0;
            output = '';
            cycles = 0;
        },

        // Run N cycles, returns { halted, reason, cycles }
        step(n = 1000) {
            for (let i = 0; i < n; i++) {
                const prevS = cpu.S;
                cpu.step();
                cycles++;
                if (cpu.halted) {
                    return { halted: true, reason: 'cpu.halted', cycles };
                }
                if (cpu.S === prevS) {
                    return { halted: true, reason: `loop at S=${cpu.S}`, cycles };
                }
            }
            return { halted: false, cycles };
        },

        // Getters
        get output() { return output; },
        get cycles() { return cycles; },
        get tapePos() { return tapePos; },
        get tapeLength() { return tapeData.length; },

        _display: () => `Emulator { cpu: E4130, program: ${prog.length} words, tape: ${tapeData.length} bytes }`
    };

    return emu;
});

// --- Section: Run LISP ---
nb.define('section_run', [], () => `<h2>Run LISP</h2>`, { type: 'md' });

// --- LISP Input (editable) ---

// --- Control Panel ---
nb.define('controls', ['emulator', 'lispInput'], (emu) => {
    const container = document.createElement('div');

    const btnGroup = document.createElement('div');
    btnGroup.className = 'btn-group';
    btnGroup.style.cssText = 'display:flex;flex-wrap:wrap;gap:12px;';

    const loadBtn = document.createElement('button');
    loadBtn.className = 'btn btn-primary';
    loadBtn.style.cssText = 'min-height:52px;font-size:16px;padding:12px 20px;';
    loadBtn.textContent = '📼 Load Tape';
    loadBtn.onclick = () => {
        const input = nb.get('lispInput') || '';
        const chars = emu.loadTape(input);
        nb.set('status', `Loaded ${chars} chars onto tape`);
    };

    const runBtn = document.createElement('button');
    runBtn.className = 'btn';
    runBtn.style.cssText = 'min-height:52px;font-size:16px;padding:12px 20px;';
    runBtn.textContent = '▶ Run';
    runBtn.onclick = async () => {
        runBtn.disabled = true;
        runBtn.textContent = 'Running...';

        const max = 1000000;
        let total = 0;

        const tick = () => {
            const result = emu.step(1000);
            total = result.cycles;
            nb.set('output', emu.output);
            nb.set('status', `Cycles: ${total.toLocaleString()}`);

            if (result.halted) {
                finish(`Halted: ${result.reason}`);
            } else if (total < max) {
                requestAnimationFrame(tick);
            } else {
                finish('Max cycles reached');
            }
        };

        const finish = (msg) => {
            runBtn.disabled = false;
            runBtn.textContent = '▶ Run';
            nb.set('status', `${msg} after ${total.toLocaleString()} cycles`);
        };

        tick();
    };

    const resetBtn = document.createElement('button');
    resetBtn.className = 'btn';
    resetBtn.style.cssText = 'min-height:52px;font-size:16px;padding:12px 20px;';
    resetBtn.textContent = '↺ Reset';
    resetBtn.onclick = () => {
        emu.reset();
        nb.set('output', '');
        nb.set('status', 'Reset');
    };

    btnGroup.append(loadBtn, runBtn, resetBtn);
    container.append(btnGroup);

    return { _display: () => container };
});
