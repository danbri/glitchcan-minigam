<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="edot — one browser office suite with a menu-driven shell: editor, data, slides, calendar, mail and maps over one shared kernel.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#efece6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2c2c2c" media="(prefers-color-scheme: dark)">
  <title>edot — office suite</title>
  <link rel="stylesheet" href="css/edot-tokens.css">
  <link rel="stylesheet" href="auth/css/auth.css">
  <link rel="stylesheet" href="places/css/place-input.css">
  <link rel="stylesheet" href="maps/vendor/maplibre-gl.css">
  <script src="maps/vendor/maplibre-gl.js"></script>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: var(--font-ui); background: var(--bg); color: var(--ink); display: flex; flex-direction: column; height: 100dvh; height: 100vh; height: 100dvh; }

    /* ---- application top bar: brand + menu bar + identity ---- */
    .topbar { flex: 0 0 auto; display: flex; align-items: stretch; background: var(--surface); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 0.4rem; padding: 0 0.7rem; font-weight: 600; color: var(--accent); white-space: nowrap; }
    .brand .dot { font-size: 1.1rem; }
    .doc-name { font-size: 0.8rem; color: var(--muted); margin-left: 0.2rem; }
    .menubar { display: flex; align-items: stretch; }
    .menubar > button { font: inherit; font-size: 0.85rem; background: transparent; border: 0; color: var(--ink); padding: 0 0.7rem; cursor: pointer; }
    .menubar > button:hover, .menubar > button[aria-expanded="true"] { background: var(--accent); color: var(--accent-fg); }
    .topbar .spacer { flex: 1; }
    .topbar .login { display: flex; align-items: center; padding: 0 0.5rem; }

    /* ---- dropdown menus ---- */
    .menu { position: fixed; z-index: 1000; min-width: 12rem; padding: 0.25rem; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.22); }
    .menu[hidden] { display: none; }
    .mi { display: flex; align-items: center; gap: 1rem; width: 100%; box-sizing: border-box; font: inherit; font-size: 0.85rem;
      text-align: left; background: transparent; border: 0; color: var(--ink); padding: 0.35rem 0.6rem; border-radius: calc(var(--radius) - 1px); cursor: pointer; }
    .mi:hover, .mi[aria-expanded="true"] { background: var(--accent); color: var(--accent-fg); }
    .mi[disabled] { opacity: 0.4; cursor: default; }
    .mi .lbl { flex: 1 1 auto; }
    .mi .accel { font-size: 0.72rem; opacity: 0.7; }
    .mi .arrow { font-size: 0.7rem; opacity: 0.7; }
    .mi .check { width: 1em; }
    .sep { height: 1px; background: var(--line); margin: 0.25rem 0.3rem; }

    /* ---- body: nav rail + stage ---- */
    .bodyrow { flex: 1 1 auto; min-height: 0; display: flex; }
    .rail { flex: 0 0 auto; width: 5.4rem; display: flex; flex-direction: column; gap: 0.1rem; background: var(--surface);
      border-right: 1px solid var(--line); padding: 0.35rem 0.3rem; overflow-y: auto; }
    .rail button { display: flex; flex-direction: column; align-items: center; gap: 0.1rem; font: inherit; font-size: 0.6rem;
      color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: var(--radius); padding: 0.4rem 0.15rem; cursor: pointer; }
    .rail button .ic { font-size: 1.15rem; line-height: 1; }
    .rail button:hover { background: var(--bg); color: var(--ink); }
    .rail button[aria-current="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

    .stage { flex: 1 1 auto; min-width: 0; position: relative; background: var(--bg); }
    .view { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
    .view[hidden] { display: none; }
    .view > * { flex: 1 1 auto; min-height: 0; }
    .wsview { flex-direction: column; }
    .ws-subtabs { display: none; flex: 0 0 auto; gap: 0.25rem; padding: 0.3rem 0.4rem; background: var(--surface); border-bottom: 1px solid var(--line); }
    .ws-subtab { font: inherit; font-size: 0.8rem; padding: 0.3em 0.9em; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--ink); cursor: pointer; }
    .ws-subtab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .ws-panes { flex: 1 1 auto; min-height: 0; display: flex; }
    .ws-pane { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); overflow: hidden; }
    .ws-pane:last-child { border-right: none; }
    .ws-pane > * { flex: 1 1 auto; min-height: 0; }
    .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

    @media (max-width: 700px) {
      .doc-name { display: none; }
      .rail { width: auto; flex-direction: row; overflow-x: auto; border-right: none; border-top: 1px solid var(--line); order: 2; }
      .bodyrow { flex-direction: column; }
      .stage { order: 1; }
      /* Workspace is a core surface — it must stay reachable on every device.
         On a phone it shows one pane at a time via its own sub-tabs (below). */
      .ws-subtabs { display: flex; }
      .ws-panes { flex-direction: column; }
      .ws-pane { border-right: none; }
      .ws-pane:not(.active) { display: none; }
      .menubar > button { padding: 0 0.5rem; }
    }
    /* Command palette (⌘K) — shell chrome, not an app stylesheet. */
    .cmdk { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; }
    .cmdk[hidden] { display: none; }
    .cmdk-box { margin-top: 12vh; width: min(92vw, 36rem); background: var(--bg, #fff); color: var(--ink, #1c1c1c); border: 1px solid var(--line, #ddd); border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,0.35); overflow: hidden; }
    .cmdk-input { width: 100%; box-sizing: border-box; font: inherit; font-size: 1.05rem; padding: 0.9rem 1rem; border: none; border-bottom: 1px solid var(--line, #eee); background: transparent; color: inherit; outline: none; }
    .cmdk-list { list-style: none; margin: 0; padding: 0.3rem; max-height: 50vh; overflow: auto; }
    .cmdk-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.7rem; border-radius: 8px; cursor: pointer; }
    .cmdk-item.active, .cmdk-item:hover { background: var(--sel, #ece6da); }
    .cmdk-ic { width: 1.4rem; text-align: center; opacity: 0.8; }
    .cmdk-empty { padding: 0.8rem; color: var(--muted, #888); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot">🟫</span> edot <span class="doc-name" id="doc-name"></span></div>
    <nav class="menubar" id="menubar" role="menubar" aria-label="Application"></nav>
    <span class="spacer"></span>
    <span class="login"><edot-login-button login-href="auth/login.html"></edot-login-button></span>
  </header>
  <div class="bodyrow">
    <nav class="rail" id="rail" aria-label="Apps"></nav>
    <main class="stage" id="stage"><div class="loading" id="loading">Loading…</div></main>
  </div>

  <script type="module">
    import './auth/js/login-ui.js';
    import { getKernel } from './js/edot-kernel.js';
    import { getRegistry } from './js/command-registry.js';
    import { FindReplace } from './js/find-replace.js';
    import * as IO from './js/io.js';

    // ---- CSS scoping (CSSOM) — each app stylesheet confined to its mount -----
    function scopeSelector(sel, scope) {
      const s = sel.trim();
      if (s === ':root' || s === 'html' || s === 'body' || s === 'html body' || s === 'html, body') return scope;
      if (s === '*') return `${scope}, ${scope} *`;
      const stripped = s.replace(/^(html|body)\b\s*/, '');
      return stripped ? `${scope} ${stripped}` : scope;
    }
    function scopeRule(rule, scope) {
      if (rule.type === CSSRule.STYLE_RULE) return `${rule.selectorText.split(',').map((p) => scopeSelector(p, scope)).join(', ')} { ${rule.style.cssText} }`;
      if (rule.type === CSSRule.MEDIA_RULE || rule.type === CSSRule.SUPPORTS_RULE) {
        const at = rule.type === CSSRule.MEDIA_RULE ? `@media ${rule.media.mediaText}` : `@supports ${rule.conditionText}`;
        return `${at} { ${[...rule.cssRules].map((r) => scopeRule(r, scope)).join('\n')} }`;
      }
      return rule.cssText;
    }
    const _scoped = new Set();
    async function injectScoped(href, scope, key) {
      if (_scoped.has(key + href)) return; _scoped.add(key + href);
      const css = await (await fetch(href)).text();
      const probe = document.createElement('style'); probe.textContent = css; document.head.appendChild(probe);
      const out = [...probe.sheet.cssRules].map((r) => scopeRule(r, scope)).join('\n'); probe.remove();
      const style = document.createElement('style'); style.dataset.scope = key; style.textContent = out; document.head.appendChild(style);
    }

    // ---- app registry -------------------------------------------------------
    const kernel = getKernel();
    const APPS = [
      { id: 'workspace', label: 'Workspace', icon: '🧩' },
      { id: 'editor',   label: 'Editor',   icon: '✍️', tag: 'edot-editor', css: ['css/edot-editor.css'], load: () => import('./js/edot-editor.js') },
      { id: 'data',     label: 'Data',     icon: '▦',  tag: 'edot-data', attrs: { 'geo-src': 'places/data/geo-demo.ndjson' }, css: ['data/data.css'], load: () => import('./data/data-workspace.js') },
      { id: 'slides',   label: 'Slides',   icon: '▤',  tag: 'edot-slides', css: ['slides/slides.css'], load: () => import('./slides/slides-app.js') },
      { id: 'calendar', label: 'Calendar', icon: '📅', tag: 'edot-calendar', css: ['calendar/css/calendar.css'], load: () => import('./calendar/js/calendar-app.js'), init: (el) => el.init() },
      { id: 'mail',     label: 'Mail',     icon: '✉️', tag: 'edot-mail', css: ['mail/mail.css'], load: () => import('./mail/js/edot-mail.js') },
      { id: 'maps',     label: 'Maps',     icon: '🗺️', tag: 'edot-maps', css: ['maps/css/maps.css'], load: () => import('./maps/js/maps-app.js'), init: (el) => el.init() },
      { id: 'backup',   label: 'Backup',   icon: '⤓',  tag: 'edot-backup', css: ['css/edot.css', 'backup/css/backup.css'], load: () => import('./backup/js/backup-ui.js') },
      { id: 'automations', label: 'Automations', icon: '⚙', tag: 'edot-automations', css: ['automations/automations.css'], load: () => import('./automations/js/automations-app.js') },
      { id: 'projects', label: 'Projects', icon: '📦', tag: 'edot-projects', css: ['projects/projects.css'], load: () => import('./projects/js/projects-app.js') },
      { id: 'groups', label: 'Groups', icon: '💬', tag: 'edot-groups', css: ['groups/groups.css'], load: () => import('./groups/js/groups-app.js') },
      { id: 'files', label: 'Files', icon: '🗂', tag: 'edot-files', css: ['files/files.css'], load: () => import('./files/js/files-app.js') },
      { id: 'connections', label: 'Connections', icon: '🔌', tag: 'edot-connections', css: ['connections/connections.css'], load: () => import('./connections/js/connections-app.js') },
    ];
    const byId = Object.fromEntries(APPS.map((a) => [a.id, a]));

    kernel.bus.subscribe('data:share', (p) => {
      try { kernel.capabilities.invoke('slides.addData', p); } catch (_) {}
      try { kernel.capabilities.invoke('editor.addData', p); } catch (_) {}
    });

    // ---- Projects: a .zip bundle hydrates the workspace (doc + data + deck) ----
    let activeProject = null;
    async function hydrateProject(project) {
      if (!project || !project.manifest) return;
      const { manifest, files } = project;
      activeProject = manifest;
      await ensureView('workspace');
      const ws = views.get('workspace');
      const fileOf = (entry) => entry && files && files[entry.file];
      // Document → Editor pane.
      const docHtml = fileOf((manifest.docs || [])[0]);
      const ed = ws && ws.querySelector('edot-editor');
      if (docHtml != null && ed && ed.setContent) { try { ed.setContent(docHtml); } catch (_) {} }
      // Deck → Slides pane.
      const deckText = fileOf((manifest.slides || [])[0]);
      const sl = ws && ws.querySelector('edot-slides');
      if (deckText != null && sl && sl.applyDeckData) { try { await sl.applyDeckData(JSON.parse(deckText)); } catch (_) {} }
      // Table → Data pane (under a folder named for the project).
      const dataEntry = (manifest.data || [])[0];
      const csvText = fileOf(dataEntry);
      const dt = ws && ws.querySelector('edot-data');
      if (dt && dt.setProjectFolder && manifest.name) { try { dt.setProjectFolder(manifest.name); } catch (_) {} }
      if (csvText != null && dt && dt.addCsvTable) { try { await dt.addCsvTable(dataEntry.title || dataEntry.id, csvText); } catch (_) {} }
      go('workspace');
    }
    kernel.bus.subscribe('project:open', (p) => { hydrateProject(p).catch((e) => console.error('project:open', e)); });

    // Snapshot the live workspace into a project { manifest, files } for saving.
    kernel.capabilities.provide('project.snapshot', async () => {
      await ensureView('workspace');
      const ws = views.get('workspace');
      const name = (activeProject && activeProject.name) || 'My Project';
      const manifest = { name, description: (activeProject && activeProject.description) || 'Saved from edot.', problemSpace: (activeProject && activeProject.problemSpace) || 'custom', apps: ['editor', 'data', 'slides'], docs: [], data: [], slides: [] };
      const files = {};
      const ed = ws && ws.querySelector('edot-editor');
      if (ed && ed.getContent) { files['docs/document.html'] = ed.getContent(); manifest.docs.push({ id: 'document', title: 'Document', file: 'docs/document.html' }); }
      const sl = ws && ws.querySelector('edot-slides');
      if (sl && sl.deck) { files['slides/deck.json'] = JSON.stringify(sl.deck, null, 2); manifest.slides.push({ id: 'deck', title: sl.deck.title || 'Deck', file: 'slides/deck.json' }); }
      const dt = ws && ws.querySelector('edot-data');
      const tbl = dt && dt.activeTableCsv && dt.activeTableCsv();
      if (tbl) { files['data/table.csv'] = tbl.csv; manifest.data.push({ id: 'table', title: tbl.title, file: 'data/table.csv', format: 'csv' }); }
      return { manifest, files };
    });

    const rail = document.getElementById('rail');
    const stage = document.getElementById('stage');
    const loading = document.getElementById('loading');
    const docName = document.getElementById('doc-name');
    const views = new Map();

    for (const a of APPS) {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.nav = a.id; b.title = a.label;
      b.innerHTML = `<span class="ic">${a.icon}</span><span>${a.label}</span>`;
      b.addEventListener('click', () => go(a.id));
      rail.appendChild(b);
    }

    async function mountComponent(app, host, scopeKey) {
      for (const href of (app.css || [])) await injectScoped(href, `[data-app="${scopeKey}"]`, scopeKey);
      await app.load();
      const el = document.createElement(app.tag);
      for (const [k, v] of Object.entries(app.attrs || {})) el.setAttribute(k, v);
      host.appendChild(el);
      if (app.init) { try { await app.init(el); } catch (e) { console.error(app.id, 'init', e); } }
      return el;
    }
    async function ensureView(id) {
      if (views.has(id)) return views.get(id);
      const section = document.createElement('section');
      section.className = 'view'; section.dataset.app = id; section.hidden = true;
      stage.appendChild(section); views.set(id, section);
      if (id === 'workspace') {
        // Data + Slides + Editor over one kernel. Side by side on wide screens;
        // on a phone, ONE pane at a time via sub-tabs (stacking three apps is the
        // cluttered mess this avoids).
        section.classList.add('wsview');
        const tabs = document.createElement('div'); tabs.className = 'ws-subtabs'; tabs.setAttribute('role', 'tablist');
        const panes = document.createElement('div'); panes.className = 'ws-panes';
        section.append(tabs, panes);
        for (const [key, app, label] of [['data', byId.data, 'Data'], ['slides', byId.slides, 'Slides'], ['editor', byId.editor, 'Editor']]) {
          const pane = document.createElement('div'); pane.className = 'ws-pane'; pane.dataset.ws = key; pane.dataset.app = key;
          panes.appendChild(pane);
          await mountComponent(app, pane, key);
          const t = document.createElement('button'); t.type = 'button'; t.className = 'ws-subtab'; t.textContent = label; t.dataset.ws = key;
          t.addEventListener('click', () => setWsPane(section, key));
          tabs.appendChild(t);
        }
        setWsPane(section, 'data');
      } else {
        const el = await mountComponent(byId[id], section, id);
        // The dedicated Editor app gets the full document host (My documents +
        // autosave, Open Examples/Research/URL, View source, Save to GitHub) —
        // the same features as the standalone page, sharing the same library.
        if (id === 'editor' && el) {
          try {
            const { EditorHost } = await import('./js/editor-host.js');
            section._host = new EditorHost(el, { section });
            await section._host.boot();
          } catch (e) { console.error('editor host', e); }
        }
      }
      return section;
    }
    function setWsPane(section, key) {
      section.querySelectorAll('.ws-pane').forEach((p) => p.classList.toggle('active', p.dataset.ws === key));
      section.querySelectorAll('.ws-subtab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.ws === key)));
    }
    // The primary mounted component for an app (for menu actions).
    function primaryEl(id) {
      const v = views.get(id); if (!v) return null;
      const a = byId[id];
      return a.tag ? v.querySelector(a.tag) : null;
    }

    let switching = false, pending = null;
    async function go(id) {
      if (!byId[id]) id = 'workspace';
      // Don't drop a switch requested while another is still mounting — remember
      // the latest and honour it once free (mounts like SQLite-WASM take a moment).
      if (switching) { pending = id; return; }
      switching = true; loading.hidden = false;
      try { await ensureView(id); } finally { loading.hidden = true; switching = false; }
      for (const [vid, v] of views) v.hidden = vid !== id;
      for (const b of rail.children) b.setAttribute('aria-current', String(b.dataset.nav === id));
      if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
      document.title = `edot — ${byId[id].label}`;
      docName.textContent = byId[id].label;
      renderMenubar(id);
      if (pending && pending !== id) { const p = pending; pending = null; go(p); }
    }

    // ===================== MENU BAR (File / Edit / View / …) ==================
    const TOP_ORDER = ['File', 'Edit', 'Insert', 'View', 'Actions', 'Help'];
    const menubar = document.getElementById('menubar');
    let openName = null, openEl = null;

    function pickFile(accept) {
      return new Promise((res) => {
        const i = document.createElement('input'); i.type = 'file'; if (accept) i.accept = accept;
        i.addEventListener('change', () => res(i.files[0] || null), { once: true });
        i.click();
      });
    }
    function editorFind(el) { el._find = el._find || new FindReplace(el.core, el.announce); el._find.open(); }
    const sw = (appId) => ({ label: 'Open app', submenu: APPS.map((a) => ({ label: a.label, checked: a.id === appId, action: () => go(a.id) })) });
    const help = [
      { label: 'About edot', action: () => alert('edot — a browser office suite, composable over one kernel. All client-side, no backend.') },
      { label: 'Source on GitHub', action: () => window.open('https://github.com/danbri/glitchcan-minigam/tree/master/magpie/edot', '_blank', 'noopener') },
    ];

    function buildMenus(id, el) {
      if (id === 'editor' && el) {
        const host = views.get('editor')?._host;
        const titleOf = () => `${(host && host.titleEl && host.titleEl.value.trim()) || 'document'}`;
        return {
          File: [
            { label: 'New document', accel: 'Ctrl+N', action: () => host ? host.newDocument() : el.setContent('') },
            { label: 'Open…', action: () => host ? host.openDialog() : pickFile(IO.importAccept?.()).then((f) => f && IO.importFile(f).then((h) => el.setContent(h)).catch((e) => alert(e.message))) },
            { label: 'My documents…', accel: 'Ctrl+Shift+O', action: () => host && host.myDocuments(), disabled: !host },
            { sep: true },
            { label: 'Save to GitHub…', action: () => host && host.saveToGitHub(), disabled: !host },
            { label: 'View source…', action: () => host && host.viewSource(), disabled: !host },
            { sep: true },
            { label: 'Export', submenu: IO.exportFormats().map((fmt) => ({ label: fmt.label, action: async () => { try { IO.downloadBlob(await IO.exportDocument(el.getContent(), titleOf(), fmt.ext), `${titleOf()}.${fmt.ext}`); } catch (e) { alert(e.message); } } })) },
            { sep: true },
            { label: 'Close document', action: () => host && host.closeDocument(), disabled: !host },
          ],
          Edit: [
            { label: 'Undo', accel: 'Ctrl+Z', action: () => el.exec('undo') },
            { label: 'Redo', accel: 'Ctrl+Y', action: () => el.exec('redo') },
            { sep: true },
            { label: 'Bold', accel: 'Ctrl+B', action: () => el.exec('bold') },
            { label: 'Italic', accel: 'Ctrl+I', action: () => el.exec('italic') },
            { label: 'Underline', accel: 'Ctrl+U', action: () => el.exec('underline') },
            { label: 'Clear formatting', action: () => el.exec('removeFormat') },
            { sep: true },
            { label: 'Find & replace…', accel: 'Ctrl+F', action: () => editorFind(el) },
          ],
          Insert: [
            { label: 'Link…', action: () => el.createLink() },
            { label: 'Bulleted list', action: () => el.exec('bulletList') },
            { label: 'Numbered list', action: () => el.exec('numberList') },
            { label: 'Block quote', action: () => el.exec('blockquote') },
            { label: 'Code block', action: () => el.exec('code') },
          ],
          View: [
            { label: 'Body text', action: () => el.setBlock('p') },
            { label: 'Heading 1', action: () => el.setBlock('h1') },
            { label: 'Heading 2', action: () => el.setBlock('h2') },
            { sep: true },
            { label: 'Align left', action: () => el.align('left') },
            { label: 'Align centre', action: () => el.align('center') },
            { label: 'Align right', action: () => el.align('right') },
            { sep: true }, sw(id),
          ],
          Help: help,
        };
      }
      if (id === 'data' && el) {
        return {
          File: [
            { label: 'Import file… (CSV / SQLite / N-Quads)', action: async () => { const f = await pickFile('.csv,.txt,.zip,.sqlite,.db,.nq,.nquads'); if (f) el.openAnyFile(f); } },
            { sep: true },
            { label: 'Export SQLite database', action: () => el.exportDb?.() },
            { label: 'Export CSVs (zip)', action: () => el.exportCsvsZip?.() },
            { label: 'Export N-Quads', action: () => el.exportNquads?.() },
          ],
          // The data "views" — datasheet (grid), spreadsheet, and the SQL query
          // workbench — the way Access exposes Datasheet / Form / Design.
          View: [
            { label: 'SQL query workbench', action: () => el.openQuery?.() },
            { label: 'New spreadsheet (formulas)', action: () => el.newSheet?.() },
            { label: 'New table (datasheet)', action: () => el.newTable?.() },
            { sep: true },
            { label: 'Load sample database (Chinook)', action: () => el.loadChinook?.() },
            { sep: true }, sw(id),
          ],
          Help: help,
        };
      }
      if (id === 'slides' && el) {
        return {
          File: [
            { label: 'New deck', action: () => el.newDeckPrompt?.() },
            { label: 'Open deck…', action: () => el.openLibrary?.() },
            { label: 'Sample decks…', action: () => el.openSamples?.() },
            { sep: true },
            { label: 'Import… (.edeck · .pptx · .odp)', action: () => el._fileInput?.click() },
            { sep: true },
            { label: 'Export', submenu: [
              { label: 'edeck (JSON)', action: () => el.exportJson?.() },
              { label: 'PowerPoint (.pptx)', action: () => el.exportPptx?.() },
              { label: 'OpenDocument (.odp)', action: () => el.exportOdp?.() },
              { label: 'PDF', action: () => el.exportPdf?.() },
              { label: 'HTML', action: () => el.exportHtml?.() },
              { label: 'PNG (current slide)', action: () => el.exportPng?.() },
            ] },
          ],
          View: [sw(id)],
          Help: help,
        };
      }
      // Generic apps: switch + help (their own toolbars provide app actions).
      return { View: [sw(id)], Help: help };
    }

    // Build an "Actions" menu from the active app's command-registry contributions
    // (grouped with separators). The menu and the ⌘K palette thus share one source.
    function registryActions(id) {
      // Only app-contextual commands (those with a when-gate) belong in an app's
      // Actions menu — global commands like nav.* live in the palette / Open app.
      const cmds = getRegistry().contributions({ app: id }).filter((c) => c.when && (c.where || ['palette']).includes('palette'));
      const items = []; let last = null;
      for (const c of cmds) {
        if (last !== null && c.group !== last) items.push({ sep: true });
        last = c.group;
        items.push({ label: c.title, action: () => getRegistry().run(c.id, { app: id }) });
      }
      return items;
    }
    // Apps with bespoke menus (they have a File menu) keep them; apps that only
    // had View+Help gain a registry-driven Actions menu.
    function appMenus(id, el) {
      const m = buildMenus(id, el);
      if (!m.File) { const acts = registryActions(id); if (acts.length) m.Actions = acts; }
      return m;
    }

    function closeMenu(restoreFocus) { document.querySelectorAll('.menu').forEach((m) => m.remove()); openEl = null; if (openName) { const b = menubar.querySelector(`[data-top="${openName}"]`); b?.setAttribute('aria-expanded', 'false'); if (restoreFocus && b) b.focus(); openName = null; } }

    // Keyboard navigation within an open menu (ARIA menu pattern): Up/Down move,
    // Home/End jump, Enter/Space activate (handled by the button), Esc closes and
    // returns focus to the menubar, Right/Left open/close submenus.
    function menuItemsOf(menu) { return [...menu.querySelectorAll(':scope > .mi:not([disabled])')]; }
    function focusItem(menu, i) { const items = menuItemsOf(menu); if (!items.length) return; const n = (i + items.length) % items.length; items.forEach((b, k) => b.tabIndex = k === n ? 0 : -1); items[n].focus(); }
    function onMenuKeydown(menu, e) {
      const items = menuItemsOf(menu); const i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { focusItem(menu, i + 1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { focusItem(menu, i - 1); e.preventDefault(); }
      else if (e.key === 'Home') { focusItem(menu, 0); e.preventDefault(); }
      else if (e.key === 'End') { focusItem(menu, items.length - 1); e.preventDefault(); }
      else if (e.key === 'Escape') { closeMenu(true); e.preventDefault(); }
    }

    function renderItems(items, container, parentMenu) {
      for (const it of items) {
        if (it.sep) { const s = document.createElement('div'); s.className = 'sep'; s.setAttribute('role', 'separator'); container.appendChild(s); continue; }
        const b = document.createElement('button'); b.type = 'button'; b.className = 'mi';
        b.setAttribute('role', 'menuitem'); b.tabIndex = -1;
        if (it.checked != null) b.setAttribute('aria-checked', String(!!it.checked));
        const check = it.checked ? '✓' : '';
        b.innerHTML = `<span class="check">${check}</span><span class="lbl"></span>` + (it.submenu ? '<span class="arrow">▸</span>' : `<span class="accel">${it.accel || ''}</span>`);
        b.querySelector('.lbl').textContent = it.label;
        if (it.disabled) b.disabled = true;
        if (it.submenu) {
          b.setAttribute('aria-haspopup', 'menu'); b.setAttribute('aria-expanded', 'false');
          let fly = null;
          const openFly = () => { if (fly) return; fly = document.createElement('div'); fly.className = 'menu'; fly.setAttribute('role', 'menu'); renderItems(it.submenu, fly, parentMenu); fly.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { closeFly(); b.focus(); e.preventDefault(); } else onMenuKeydown(fly, e); }); document.body.appendChild(fly); const r = b.getBoundingClientRect(); fly.style.left = r.right + 'px'; fly.style.top = r.top + 'px'; b.setAttribute('aria-expanded', 'true'); };
          const closeFly = () => { if (fly) { fly.remove(); fly = null; } b.setAttribute('aria-expanded', 'false'); };
          b.addEventListener('mouseenter', openFly);
          b.addEventListener('click', (e) => { e.stopPropagation(); openFly(); focusItem(fly, 0); }); // ensure-open
          b.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') { openFly(); focusItem(fly, 0); e.preventDefault(); } });
        } else if (it.action) {
          b.addEventListener('click', () => { closeMenu(); try { it.action(); } catch (e) { console.error(e); } });
        }
        container.appendChild(b);
      }
    }

    function openTop(name, btn) {
      closeMenu();
      const menus = appMenus(currentApp, primaryEl(currentApp));
      const items = menus[name]; if (!items) return;
      const menu = document.createElement('div'); menu.className = 'menu'; menu.setAttribute('role', 'menu'); menu.setAttribute('aria-label', name);
      renderItems(items, menu, menu);
      document.body.appendChild(menu);
      const r = btn.getBoundingClientRect(); menu.style.left = r.left + 'px'; menu.style.top = r.bottom + 'px';
      openEl = menu; openName = name; btn.setAttribute('aria-expanded', 'true');
      menu.addEventListener('keydown', (e) => onMenuKeydown(menu, e));
      focusItem(menu, 0); // ARIA: move focus into the opened menu
    }

    let currentApp = 'workspace';
    function renderMenubar(id) {
      currentApp = id;
      const menus = appMenus(id, primaryEl(id));
      menubar.innerHTML = '';
      const names = TOP_ORDER.filter((n) => menus[n]);
      names.forEach((name, idx) => {
        const b = document.createElement('button'); b.type = 'button'; b.dataset.top = name; b.textContent = name;
        b.setAttribute('role', 'menuitem'); b.setAttribute('aria-haspopup', 'menu'); b.setAttribute('aria-expanded', 'false');
        b.tabIndex = idx === 0 ? 0 : -1; // roving tabindex: one tab stop for the whole menubar
        b.addEventListener('click', (e) => { e.stopPropagation(); openName === name ? closeMenu(true) : openTop(name, b); });
        b.addEventListener('mouseenter', () => { if (openName && openName !== name) openTop(name, b); });
        b.addEventListener('keydown', (e) => {
          const tops = [...menubar.children]; const i = tops.indexOf(b);
          if (e.key === 'ArrowRight') { const n = tops[(i + 1) % tops.length]; n.tabIndex = 0; b.tabIndex = -1; n.focus(); if (openName) openTop(n.dataset.top, n); e.preventDefault(); }
          else if (e.key === 'ArrowLeft') { const n = tops[(i - 1 + tops.length) % tops.length]; n.tabIndex = 0; b.tabIndex = -1; n.focus(); if (openName) openTop(n.dataset.top, n); e.preventDefault(); }
          else if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') { openTop(name, b); e.preventDefault(); }
          else if (e.key === 'Home') { tops[0].tabIndex = 0; b.tabIndex = -1; tops[0].focus(); e.preventDefault(); }
          else if (e.key === 'End') { const last = tops[tops.length - 1]; last.tabIndex = 0; b.tabIndex = -1; last.focus(); e.preventDefault(); }
        });
        menubar.appendChild(b);
      });
    }
    document.addEventListener('click', (e) => { if (!e.target.closest('.menu') && !e.target.closest('.menubar')) closeMenu(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(true); });

    // ---- command registry (Phase 1): navigation commands, ⌘K palette, and an
    // Automations bridge so scripts can invoke any command by id. Apps (e.g.
    // Slides) register their own commands into this same shared registry. ----
    const registry = getRegistry();
    const activeApp = () => location.hash.slice(1) || (matchMedia('(max-width: 700px)').matches ? 'editor' : 'workspace');
    registry.registerAll(APPS.map((a) => ({
      id: `nav.${a.id}`, title: `Go to ${a.label}`, icon: a.icon, group: '0nav', keywords: 'navigate open switch app',
      run: () => go(a.id),
    })));
    // Automations / other apps can run any command by id through the kernel.
    kernel.capabilities.provide('command.run', ({ id, args } = {}) => registry.run(id, { app: activeApp() }, args));
    kernel.capabilities.provide('command.list', () => registry.contributions({ app: activeApp() }).map((c) => ({ id: c.id, title: c.title })));

    // ⌘K / Ctrl-K command palette — an additive surface over the registry.
    const cmdk = document.createElement('div'); cmdk.className = 'cmdk'; cmdk.hidden = true;
    cmdk.innerHTML = `<div class="cmdk-box" role="dialog" aria-modal="true" aria-label="Command palette">
      <input class="cmdk-input" type="text" placeholder="Type a command…" aria-label="Search commands"
        role="combobox" aria-expanded="true" aria-controls="cmdk-listbox" aria-autocomplete="list" autocomplete="off">
      <ul class="cmdk-list" id="cmdk-listbox" role="listbox" aria-label="Commands"></ul>
      <p class="cmdk-status" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p></div>`;
    document.body.appendChild(cmdk);
    const cmdkInput = cmdk.querySelector('.cmdk-input');
    const cmdkList = cmdk.querySelector('.cmdk-list');
    const cmdkStatus = cmdk.querySelector('.cmdk-status');
    let cmdkItems = [], cmdkActive = 0;
    function renderCmdk() {
      cmdkItems = registry.search(cmdkInput.value, { app: activeApp() });
      if (cmdkActive >= cmdkItems.length) cmdkActive = Math.max(0, cmdkItems.length - 1);
      cmdkList.innerHTML = '';
      cmdkStatus.textContent = `${cmdkItems.length} command${cmdkItems.length === 1 ? '' : 's'}`;
      if (!cmdkItems.length) { const li = document.createElement('li'); li.className = 'cmdk-empty'; li.textContent = 'No matching commands'; cmdkList.appendChild(li); cmdkInput.removeAttribute('aria-activedescendant'); return; }
      cmdkItems.forEach((c, i) => {
        const li = document.createElement('li'); li.id = `cmdk-opt-${i}`; li.className = 'cmdk-item' + (i === cmdkActive ? ' active' : ''); li.dataset.id = c.id;
        li.setAttribute('role', 'option'); li.setAttribute('aria-selected', String(i === cmdkActive));
        li.innerHTML = `<span class="cmdk-ic" aria-hidden="true">${c.icon || '▸'}</span><span class="cmdk-t"></span>`;
        li.querySelector('.cmdk-t').textContent = c.title;
        li.addEventListener('click', () => runCmdk(c.id));
        cmdkList.appendChild(li);
      });
      const active = cmdkList.children[cmdkActive];
      if (active) { cmdkInput.setAttribute('aria-activedescendant', active.id); active.scrollIntoView({ block: 'nearest' }); }
    }
    function openCmdk() { cmdk.hidden = false; cmdkInput.value = ''; cmdkActive = 0; renderCmdk(); cmdkInput.focus(); }
    function closeCmdk() { cmdk.hidden = true; }
    function runCmdk(id) { closeCmdk(); try { registry.run(id, { app: activeApp() }); } catch (e) { console.error('command', id, e); } }
    cmdkInput.addEventListener('input', () => { cmdkActive = 0; renderCmdk(); });
    cmdkInput.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { cmdkActive = Math.min(cmdkActive + 1, cmdkItems.length - 1); renderCmdk(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { cmdkActive = Math.max(cmdkActive - 1, 0); renderCmdk(); e.preventDefault(); }
      else if (e.key === 'Enter') { const c = cmdkItems[cmdkActive]; if (c) runCmdk(c.id); e.preventDefault(); }
      else if (e.key === 'Escape') { closeCmdk(); }
    });
    cmdk.addEventListener('click', (e) => { if (e.target === cmdk) closeCmdk(); });
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); cmdk.hidden ? openCmdk() : closeCmdk(); }
    });
    window.__cmdk = { open: openCmdk, registry }; // headless-test hook

    // Apps register commands asynchronously on mount; refresh the menubar (so the
    // Actions menu appears) when new commands arrive. Debounced to coalesce bursts.
    let _menubarTimer = null;
    registry.addEventListener('register', () => { clearTimeout(_menubarTimer); _menubarTimer = setTimeout(() => renderMenubar(currentApp), 0); });

    // Desktop opens the side-by-side Workspace; a phone opens a single app (the
    // Workspace's multi-pane is a wide-screen feature — see the mobile CSS).
    const mobile = matchMedia('(max-width: 700px)').matches;
    window.addEventListener('hashchange', () => go(location.hash.slice(1)));
    go(location.hash.slice(1) || (mobile ? 'editor' : 'workspace'));

    // Offline robustness: register the Service Worker (network-first + cache).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
