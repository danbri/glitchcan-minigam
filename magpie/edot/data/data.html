<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="edot data — a SQLite-WASM data layer with an Excel-like formula spreadsheet and Access-like SQL queries/views, all in the browser.">
  <meta name="color-scheme" content="light dark">
  <title>edot data — spreadsheet + database</title>
  <link rel="stylesheet" href="../css/edot-tokens.css">
  <link rel="stylesheet" href="../css/edot-chrome.css">
  <link rel="stylesheet" href="data.css">
  <style>
    /* App-shell chrome (.app-header/.login-slot/.alpha-badge) is shared in
       edot-chrome.css; only page-specific layout remains here. */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; font-family: var(--font-ui); background: var(--d-bg); color: var(--d-ink); }
    main { flex: 1 1 auto; min-height: 0; }
    edot-data { height: 100%; }
    .boot { padding: 2rem; color: var(--d-muted); }
  </style>
</head>
<body>
  <header class="app-header">
    <h1><span class="logo">▦ edot data</span></h1>
    <span class="spacer"></span>
    <a href="../edot.html">← back to editor</a>
    <span class="login-slot"><edot-login-button login-href="../auth/login.html"></edot-login-button><span class="alpha-badge" title="Experimental — sign-in is in alpha">alpha</span></span>
  </header>
  <main>
    <edot-data><div class="boot">Loading SQLite…</div></edot-data>
  </main>
  <script type="module" src="../auth/js/login-ui.js"></script>
  <script type="module" src="data-workspace.js"></script>
</body>
</html>
