<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="edot calendar — a mobile-first, accessible calendar with month/week/day/agenda views, layered calendars, ICS import/export/subscribe, recurrence and reminders. All local, in the browser.">
  <meta name="color-scheme" content="light dark">
  <title>edot calendar</title>
  <link rel="stylesheet" href="../css/edot-tokens.css">
  <link rel="stylesheet" href="../css/edot-chrome.css">
  <link rel="stylesheet" href="../places/css/place-input.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="../auth/css/auth.css">
  <style>
    /* App-shell chrome (.app-header/.login-slot/.alpha-badge) is shared in
       edot-chrome.css; only page-specific layout remains here. */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; font-family: var(--font-ui); background: var(--c-bg); color: var(--c-ink); }
    main { flex: 1 1 auto; min-height: 0; }
    edot-calendar { height: 100%; }
    .boot { padding: 2rem; color: var(--c-muted); }
  </style>
</head>
<body>
  <header class="app-header">
    <h1><span class="logo">📅 edot calendar</span></h1>
    <span class="spacer"></span>
    <a href="../data/data.html">data ▦</a>
    <a href="../index.html#calendar">← edot suite</a>
    <span class="login-slot"><edot-login-button login-href="../auth/login.html"></edot-login-button><span class="alpha-badge" title="Experimental — sign-in is in alpha">alpha</span></span>
  </header>
  <main>
    <edot-calendar><div class="boot">Loading calendar…</div></edot-calendar>
  </main>
  <!-- app-sdk FIRST when hosted by foafos: it stands in for localStorage
       before any app code runs. Harmless standalone (nothing sends it
       app.init, so the native APIs are left alone). -->
  <script src="../../../inklet/apps/app-sdk.js"></script>
  <script type="module" src="../auth/js/login-ui.js"></script>
  <script type="module">
    // Boot the component and expose a headless-test hook (mirrors window.__edot
    // / window.__cal conventions): the live instance plus a couple of helpers.
    import { EdotCalendar } from './js/calendar-app.js';
    const cal = document.querySelector('edot-calendar');
    await cal.init();
    window.__cal = {
      app: cal,
      store: cal.store,
      alarms: cal.alarms,
      ics: await import('./js/ics.js'),
      recurrence: await import('./js/recurrence.js'),
    };
  </script>
</body>
</html>
