<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="edot — a small, modular, accessible browser word processor with native DOCX/Markdown/HTML I/O and an optional LibreOffice WASM bridge.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#efece6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2c2c2c" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>edot — accessible word processor</title>
  <link rel="stylesheet" href="css/edot.css">
</head>
<body>
  <a class="skip-link" href="#editor">Skip to document</a>

  <header class="app-header">
    <h1><span class="logo">🖊️ edot</span></h1>

    <div class="menu">
      <button type="button" id="menu-button" class="tbtn" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-panel">
        File ▾
      </button>
      <div id="menu-panel" class="menu-panel" role="menu" aria-label="File" hidden>
        <button type="button" id="mi-new" class="menu-item" role="menuitem">
          <span>New document</span><span class="hint">Ctrl/⌘N</span>
        </button>
        <button type="button" id="mi-open" class="menu-item" role="menuitem">
          <span>Open file…</span><span class="hint">Ctrl/⌘O</span>
        </button>
        <button type="button" id="mi-url" class="menu-item" role="menuitem">
          <span>Open from URL…</span><span class="hint">git-aware</span>
        </button>
        <button type="button" id="mi-examples" class="menu-item" role="menuitem" aria-haspopup="dialog">
          <span>Examples…</span>
        </button>
        <button type="button" id="mi-docs" class="menu-item" role="menuitem">
          <span>My documents…</span><span class="hint">Ctrl/⌘⇧O</span>
        </button>
        <button type="button" id="mi-close" class="menu-item" role="menuitem">
          <span>Close document</span><span class="hint">Ctrl/⌘W</span>
        </button>
        <button type="button" id="mi-find" class="menu-item" role="menuitem">
          <span>Find &amp; replace…</span><span class="hint">Ctrl/⌘F</span>
        </button>
        <div class="menu-sep" role="separator"></div>
        <div id="export-list" role="group" aria-label="Save as"></div>
      </div>
    </div>

    <label class="visually-hidden" for="doc-title">Document title</label>
    <input id="doc-title" class="doc-title-input" type="text" autocomplete="off"
           spellcheck="false" placeholder="Untitled document">

    <span id="save-state" class="save-state" role="status" aria-live="polite">Autosaved locally</span>
  </header>

  <div id="toolbar" class="toolbar"><!-- built by toolbar.js --></div>

  <main class="app-main">
    <article id="editor" class="page" data-placeholder="Start writing…" aria-label="Document body">
      <!-- contenteditable; populated by edot-app.js -->
    </article>
  </main>

  <footer class="statusbar">
    <span id="stat-words">0 words</span>
    <span id="stat-chars">0 chars</span>
    <span class="spacer"></span>
    <span id="backend-state" class="visually-hidden"></span>
  </footer>

  <!-- Hidden native picker for File ▸ Open -->
  <input id="file-input" type="file" class="visually-hidden" aria-hidden="true" tabindex="-1">

  <!-- Open from URL (git-aware) -->
  <dialog id="url-dialog" class="dialog" aria-labelledby="url-dialog-title">
    <form method="dialog" class="dialog-head">
      <h2 id="url-dialog-title">Open from URL</h2>
      <button type="submit" class="tbtn" aria-label="Close">✕</button>
    </form>
    <div class="dialog-body">
      <label for="url-input" class="dialog-note">Paste a document URL. GitHub / GitLab / Bitbucket / gist “blob” links are rewritten to their raw file automatically.</label>
      <input id="url-input" type="url" class="find-input" placeholder="https://github.com/owner/repo/blob/main/doc.md" autocomplete="off" inputmode="url">
      <p id="url-error" class="dialog-error" role="alert" hidden></p>
    </div>
    <div class="dialog-foot">
      <button type="button" id="url-open" class="tbtn primary">Open</button>
    </div>
  </dialog>

  <!-- Examples -->
  <dialog id="examples-dialog" class="dialog" aria-labelledby="examples-dialog-title">
    <form method="dialog" class="dialog-head">
      <h2 id="examples-dialog-title">Examples</h2>
      <button type="submit" class="tbtn" aria-label="Close">✕</button>
    </form>
    <ul id="examples-list" class="docs-list"></ul>
  </dialog>

  <!-- Local document library -->
  <dialog id="docs-dialog" class="dialog" aria-labelledby="docs-dialog-title">
    <form method="dialog" class="dialog-head">
      <h2 id="docs-dialog-title">My documents</h2>
      <button type="submit" class="tbtn" aria-label="Close">✕</button>
    </form>
    <p id="docs-storage" class="dialog-note"></p>
    <ul id="docs-list" class="docs-list"></ul>
    <div class="dialog-foot">
      <button type="button" id="docs-new" class="tbtn primary">＋ New document</button>
    </div>
  </dialog>

  <script type="module" src="js/edot-app.js"></script>
</body>
</html>
