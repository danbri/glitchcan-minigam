<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LayerViz WebGPU - Multi-Layer Knowledge Graph</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #info {
            position: fixed;
            top: 10px;
            right: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            transform-origin: top right;
        }

        #info.collapsed {
            background: rgba(0, 0, 0, 0.6);
            width: 40px;
            height: 40px;
            border-radius: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 4px 25px rgba(102, 126, 234, 0.4); }
        }

        #info-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            cursor: pointer;
            user-select: none;
            border-radius: 10px;
            -webkit-tap-highlight-color: transparent;
        }

        #info.collapsed #info-header {
            padding: 12px;
            justify-content: center;
        }

        #info-header:hover {
            background: rgba(255,255,255,0.1);
        }

        #info-header:active {
            background: rgba(255,255,255,0.15);
        }

        #info h3 {
            margin: 0;
            font-size: 14px;
            color: #fff;
            flex-grow: 1;
            transition: opacity 0.3s ease;
        }

        #info.collapsed h3 {
            display: none;
        }

        #toggle-arrow {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #fff;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            pointer-events: none;
        }

        #info.collapsed #toggle-arrow {
            transform: rotate(-90deg);
            margin: 0;
        }

        #info-content {
            padding: 0 15px 15px 15px;
            max-height: 600px;
            overflow-y: auto;
            transition: all 0.3s ease;
            opacity: 1;
        }

        #info.collapsed #info-content {
            max-height: 0;
            padding: 0;
            opacity: 0;
            overflow: hidden;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .button-group button {
            flex: 1;
            min-width: 70px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .button-group button:hover, .button-group button:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        #info p {
            margin: 6px 0;
            font-size: 11px;
            color: #ddd;
            line-height: 1.4;
        }

        .layer-legend {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .layer-item {
            display: flex;
            align-items: center;
            margin: 2px 0;
            font-size: 11px;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-radius: 6px;
            padding: 3px 5px;
            color: #ddd;
            cursor: pointer;
            font-family: inherit;
        }

        .layer-item:hover { background: rgba(255,255,255,0.1); }

        .layer-item.focused {
            background: rgba(255,255,255,0.18);
            color: #fff;
            font-weight: 600;
        }

        .button-group button.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .layer-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            margin-right: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        #backend-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
        }

        @media (max-width: 768px) {
            #info {
                width: 250px;
                top: 5px;
                right: 5px;
            }

            #info.collapsed {
                width: 36px;
                height: 36px;
            }

            #info h3 {
                font-size: 12px;
            }

            #info p, .layer-item {
                font-size: 10px;
            }

            .button-group button {
                font-size: 10px;
                padding: 6px 10px;
                min-width: 60px;
            }
        }

        @media (max-width: 480px) {
            #info {
                width: 220px;
            }

            #info-content {
                max-height: 400px;
            }
        }
    </style>
    <script type="importmap">
    { "imports": { "three": "../../trees/vendor/three.module.min.js" } }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="info">
        <div id="info-header">
            <h3>Multi-Layer Knowledge Graph</h3>
            <div id="toggle-arrow"></div>
        </div>
        <div id="info-content">
            <div class="button-group">
                <button id="btn-animation">⏯️ Animation</button>
                <button id="btn-labels">🏷️ Labels</button>
                <button id="btn-reset">🎯 Reset</button>
            </div>

            <p><strong>Hover or tap nodes</strong> to see entity details</p>
            <p><strong>Green connections</strong> show shared entities across layers</p>
            <p><strong>Drag to rotate</strong> • <strong>Pinch or scroll to zoom</strong></p>

            <div class="layer-legend" id="layer-legend"></div>
            <span id="backend-badge">starting…</span>
        </div>
    </div>

    <script type="module">
        import { LayerViz, DEFAULT_GRAPH } from '../../layerviz/layerviz.js';
        import { makeDraggablePanel } from '../../layerviz/panel.js';

        const container = document.getElementById('canvas-container');
        const badge = document.getElementById('backend-badge');

        async function boot() {
            // Prefer WebGPU; fall back to the three.js/WebGL adapter.
            if (navigator.gpu && await navigator.gpu.requestAdapter().catch(() => null)) {
                const { createWebGPURenderer } = await import('./layerviz-webgpu.js');
                const viz = new LayerViz({
                    container,
                    createRenderer: createWebGPURenderer,
                    spec: DEFAULT_GRAPH
                });
                try {
                    await viz.renderer.ready;
                    badge.textContent = 'backend: WebGPU';
                    return viz;
                } catch (err) {
                    console.warn('WebGPU init failed, falling back to WebGL:', err);
                    viz.dispose();
                }
            }
            const { createThreeRenderer } = await import('../../layerviz/layerviz-three.js');
            badge.textContent = 'backend: WebGL (three.js fallback)';
            return new LayerViz({
                container,
                createRenderer: createThreeRenderer,
                spec: DEFAULT_GRAPH
            });
        }

        const viz = await boot();
        window.__layerviz = viz; // headless-playtest hook, like __tftt in trees/

        // Legend is generated from the graph spec, so data and legend agree.
        // Each entry is a button: activate to spotlight that layer (geometry
        // dimming needs the adapter's optional setLayerFocus — the three.js
        // fallback has it; the WebGPU adapter degrades to labels-only).
        const legend = document.getElementById('layer-legend');
        for (const layer of DEFAULT_GRAPH.layers) {
            const item = document.createElement('button');
            item.className = 'layer-item';
            item.type = 'button';
            item.setAttribute('aria-pressed', 'false');
            const swatch = document.createElement('div');
            swatch.className = 'layer-color';
            swatch.style.background = `#${layer.color.toString(16).padStart(6, '0')}`;
            const text = document.createElement('span');
            text.textContent = layer.label;
            item.append(swatch, text);
            item.addEventListener('click', () => {
                const focused = viz.focusLayer(layer.id);
                for (const el of legend.children) {
                    const on = focused !== null && el === item;
                    el.classList.toggle('focused', on);
                    el.setAttribute('aria-pressed', String(on));
                }
            });
            legend.appendChild(item);
        }

        document.getElementById('btn-animation')
            .addEventListener('click', e => e.target.classList.toggle(
                'active', !viz.toggleAnimation()));
        document.getElementById('btn-labels')
            .addEventListener('click', e => e.target.classList.toggle(
                'active', !viz.toggleLabels()));
        document.getElementById('btn-reset')
            .addEventListener('click', () => viz.resetCamera());

        // Collapsible info panel with persisted state.
        const infoPanel = document.getElementById('info');
        if (localStorage.getItem('infoPanelCollapsed') === 'true') {
            infoPanel.classList.add('collapsed');
        }
        document.getElementById('info-header').addEventListener('click', () => {
            infoPanel.classList.toggle('collapsed');
            localStorage.setItem('infoPanelCollapsed',
                infoPanel.classList.contains('collapsed'));
        });
        makeDraggablePanel(infoPanel, document.getElementById('info-header'));
    </script>
</body>
</html>
