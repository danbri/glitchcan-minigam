<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>splatweb demo 5 — critter room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
<link rel="stylesheet" href="demo.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; z-index: 0; }
  .hud { position: fixed; z-index: 10; background: rgba(10, 13, 20, 0.72);
    backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid rgba(110, 170, 255, 0.28); border-radius: 10px; }
  .chip { padding: 0.45rem 0.8rem; font-size: 0.8rem; }
  .tl { top: 14px; left: 14px; }
  .tr { top: 14px; right: 14px; display: flex; gap: 0.5rem; align-items: center; }
  .bl { bottom: 14px; left: 14px; }
  .br { bottom: 14px; right: 14px; cursor: pointer; user-select: none; }
  #creditsPanel { bottom: 56px; right: 14px; max-width: 360px; max-height: 42vh; overflow-y: auto;
    padding: 0.6rem 0.9rem; display: none; font-size: 0.72rem; color: #a7abbd; z-index: 11; }
  .tr button { background: #22304a; color: #cfe0ff; border: 1px solid #3a5580; border-radius: 6px;
    padding: 0.35rem 0.7rem; cursor: pointer; font-size: 0.8rem; }
  .tr button.on { background: #3563ad; }
  .tr input[type=range] { width: 90px; accent-color: #7fb4ff; }
  .drawer { position: fixed; top: 64px; right: 0; height: auto; max-height: calc(100vh - 90px);
    width: min(270px, 80vw); padding: 0.9rem 1rem; overflow-y: auto;
    border-radius: 10px 0 0 10px; z-index: 9; border-right: 0;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
  .drawer:not(.open) { transform: translateX(calc(100% + 2px)); }
  .drawer h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: #7fb4ff; margin: 0 0 0.5rem; font-weight: 600; }
  .tab { position: fixed; z-index: 11; top: 50%; right: 0; transform: translateY(-50%);
    writing-mode: vertical-rl; letter-spacing: 0.18em; font-size: 0.68rem; color: #cfe0ff;
    background: rgba(20, 30, 50, 0.85); border: 1px solid rgba(110, 170, 255, 0.4);
    border-right: 0; border-radius: 8px 0 0 8px; cursor: pointer; padding: 0.9rem 0.35rem;
    user-select: none; }
  .throw { width: 100%; padding: 0.6rem; font-size: 1rem; background: #3a2a55;
    color: #e8dcff; border: 1px solid #7a5ab0; border-radius: 8px; cursor: pointer; }
  .throw:active { background: #5a3f85; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud chip tl note" id="hint">jelly critters · drag to orbit · wheel to zoom</div>
<div class="hud chip tr">
  <button id="voicesBtn">🔇 voices off</button>
  <label class="note">critters <input type="range" id="countSl" min="2" max="16" value="10"></label>
  <span class="note" id="countOut">10</span>
</div>
<div class="hud chip bl stat" id="stats">loading room…</div>
<button class="tab" id="physTab">WORLD</button>
<div class="hud drawer open" id="physPanel">
  <h2>World</h2>
  <button class="throw" id="throwBtn">🌪 THROW THEM UP</button>
  <div class="ctl" style="margin-top:0.7rem"><label>gravity</label><input type="range" id="grav" min="15" max="120" value="48"><output id="gravOut">4.8</output></div>
  <div class="ctl"><label>weight</label><input type="range" id="weight" min="40" max="220" value="100"><output id="weightOut">1.0</output></div>
  <div class="ctl"><label>jump</label><input type="range" id="jump" min="50" max="230" value="135"><output id="jumpOut">1.35</output></div>
  <label class="note" style="display:block;margin-top:0.6rem"><input type="checkbox" id="heli"> 🚁 helicopter — fly the camera around the glade</label>
  <p class="note">The throw rides a perlin-style noise field — nearby
  critters catch similar gusts. Heavier (and bigger) critters fly less.
  Dragging the view lands the helicopter.</p>
</div>
<div class="hud chip br" id="shroomChip" style="right: 168px; display: none"
  title="on: critters stay in the glade · off: in XR they roam and hop onto detected tables and chairs">🍄</div>
<div class="hud chip br" id="xrChip" style="right: 118px; display: none"
  title="place the glade on your floor (WebXR)">🥽</div>
<div class="hud chip br" id="creditsChip">© credits</div>
<div class="hud" id="creditsPanel"></div>

<script type="module">
import { FLOATS_PER_SPLAT, SplatRenderer } from './lib/splat-renderer.js';
import { createSplatRenderer } from './lib/splat-renderer-auto.js';
import { loadCompressedPly } from './lib/cply.js';
import { Critter, SPLATS_PER_CRITTER, CRITTER_LINES, throwCritters, vnoise } from './lib/critters.js';
import { TextTalker } from './lib/text-talker.js';
import { ClipVoice, loadClipManifest } from './lib/clip-voice.js';
import { mulberry32 } from './lib/pose-math.js';

const $ = id => document.getElementById(id);
const canvas = $('gl'), statsEl = $('stats');
let renderer;
try { renderer = await createSplatRenderer(canvas, { background: [0.05, 0.06, 0.09] }); }
catch (e) { statsEl.textContent = 'no GPU backend: ' + e.message; throw e; }

// credits
const CREDITS = new Map();
function addCredit(k, lines) {
  CREDITS.set(k, Array.isArray(lines) ? lines : [lines]);
  $('creditsPanel').innerHTML = [...CREDITS.entries()].map(([k2, l]) =>
    `<div style="margin-bottom:0.4rem"><b style="color:#7fb4ff">${k2}</b><br>${l.join('<br>')}</div>`).join('');
  $('creditsChip').textContent = `© credits (${[...CREDITS.values()].reduce((a, l) => a + l.length, 0)})`;
}
$('creditsChip').addEventListener('click', () => {
  const p = $('creditsPanel');
  p.style.display = p.style.display === 'none' || !p.style.display ? 'block' : 'none';
});
addCredit('renderer', 'splatweb — WebGPU/WebGL2 Gaussian splat rasterizer');

// room: dbdb ghost-garden stamps; procedural ground disc as fallback
const DBDB = '../dbdb/splats/pack/';
async function loadRoom() {
  try {
    const parts = await Promise.all([
      loadCompressedPly(DBDB + 'grass.compressed.ply', { at: [0, 0.02, 0], yaw: 0.3, stride: 5 }),
      loadCompressedPly(DBDB + 'grass.compressed.ply', { at: [-1.7, 0.02, -2.1], yaw: 1.4, stride: 5 }),
      loadCompressedPly(DBDB + 'hedge.compressed.ply', { at: [0.2, 0, -3.1], yaw: 0, stride: 5 }),
      loadCompressedPly(DBDB + 'vine.compressed.ply', { at: [2.1, 0, -1.7], yaw: 0.3 }),
      loadCompressedPly(DBDB + 'fern.compressed.ply', { at: [-2.4, 0, -0.5], yaw: 0, stride: 6 }),
    ]);
    const meta = await fetch(DBDB + 'pack.json').then(r => r.json());
    const total = parts.reduce((a, x) => a + x.count, 0);
    const data = new Float32Array(total * FLOATS_PER_SPLAT);
    let off = 0;
    for (const pt of parts) { data.set(pt.data, off); off += pt.data.length; }
    const credits = [...new Set(['grass', 'hedge', 'vine', 'fern'].map(id =>
      (meta.elements.find(e => e.id === id) || {}).credit || id))];
    addCredit('room stamps', credits);
    return { data, count: total };
  } catch {
    // offline fallback: a soft ground disc
    const rnd = mulberry32(3);
    const n = 500, data = new Float32Array(n * FLOATS_PER_SPLAT);
    for (let i = 0; i < n; i++) {
      const o = i * FLOATS_PER_SPLAT, a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 3;
      const c = 0.2 + rnd() * 0.06;
      data.set([Math.cos(a) * r, -0.01, Math.sin(a) * r, 0, 0, 0, 1, 0.16, 0.02, 0.16, c * 0.8, c, c * 0.7, 1], o);
    }
    return { data, count: n };
  }
}
const room = await loadRoom();

// critters — each an entity: physics body + splat block + voice.
// Voices: pre-generated ElevenLabs clips when media/critter-voices/
// exists (run tools/gen-critter-voices.mjs once with an API key),
// otherwise the browser's speechSynthesis.
let xrSession = null, xrRend = null, xrRef = null, xrModel = null, xrLast = 0;
let shroomOn = true;
const clipManifest = await loadClipManifest('media/critter-voices/');
let critters = [];
let voicesOn = false;
function makeCritters(n) {
  for (const c of critters) { c.talker?.stop(); c.clip?.stop(); }
  critters = [];
  for (let i = 0; i < n; i++) {
    const c = new Critter(i * 7 + 3);
    if (clipManifest) {
      // adult source voices pitched into critter register: the deep British
      // premades (george=3, daniel=4) get the biggest lift; smaller critters
      // squeak higher still
      const base = [1.08, 1.18, 1.1, 1.32, 1.38][i % 5];
      const size = c.r / 0.18;               // ~0.6 small … ~1.2 big
      c.clip = new ClipVoice(clipManifest, i, 0.5, base * (1.28 - size * 0.22));
    }
    else c.talker = new TextTalker({ pitch: c.voicePitch, rate: c.voiceRate, volume: 0.55 });
    critters.push(c);
  }
  const data = new Float32Array((room.count + n * SPLATS_PER_CRITTER) * FLOATS_PER_SPLAT);
  data.set(room.data);
  sceneCount = room.count + n * SPLATS_PER_CRITTER;
  renderer.setData(data, sceneCount);
  if (xrRend) xrRend.setData(data.slice(), sceneCount);
  critterBlock = new Float32Array(n * SPLATS_PER_CRITTER * FLOATS_PER_SPLAT);
}
let sceneCount = 0;
let critterBlock;
makeCritters(10);

$('countSl').addEventListener('change', () => {
  $('countOut').textContent = $('countSl').value;
  makeCritters(+$('countSl').value);
});
$('voicesBtn').addEventListener('click', () => {
  voicesOn = !voicesOn;
  $('voicesBtn').textContent = voicesOn ? '🔊 voices on' : '🔇 voices off';
  $('voicesBtn').classList.toggle('on', voicesOn);
  if (!voicesOn) for (const c of critters) { c.talker?.stop(); c.clip?.stop(); }
});

// orbit
let theta = 0.3, phi = 1.15, radius = 5.2;
function applyCamera() {
  phi = Math.max(0.25, Math.min(1.5, phi));
  radius = Math.max(1, Math.min(12, radius));
  renderer.setCamera([
    radius * Math.sin(theta) * Math.sin(phi),
    0.6 + radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi),
  ], [0, 0.6, 0]);
}
applyCamera();
let heliOn = false, heliT = 0;
$('heli').addEventListener('change', () => { heliOn = $('heli').checked; });
let drag = null;
canvas.addEventListener('pointerdown', e => {
  if (heliOn) { heliOn = false; $('heli').checked = false; }
  drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  theta -= (e.clientX - drag[0]) * 0.005;
  phi -= (e.clientY - drag[1]) * 0.005;
  drag = [e.clientX, e.clientY]; applyCamera();
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); radius *= Math.exp(e.deltaY * 0.001); applyCamera(); }, { passive: false });

// physics environment: critters rest on TOP of the tall grass (its
// blades are ~0.4 m); the vine stump, fern clump and hedge line are
// bouncy cylinder colliders. Sliders mutate this live.
const ENV = {
  floorY: 0.12, gravity: 4.8, weight: 1, jumpMul: 1.35,
  obstacles: [
    { x: 2.1, z: -1.7, r: 1.0 },    // vine stump
    { x: -2.4, z: -0.5, r: 0.8 },   // fern
    { x: -0.6, z: -3.1, r: 0.95 }, { x: 1.0, z: -3.1, r: 0.95 },  // hedge
  ],
};
$('physTab').addEventListener('click', () => $('physPanel').classList.toggle('open'));
const wirePhys = (id, out, k, div) => {
  const el = $(id);
  const f = () => { ENV[k] = +el.value / div; $(out).textContent = ENV[k].toFixed(k === 'gravity' ? 1 : 2); };
  el.addEventListener('input', f); f();
};
wirePhys('grav', 'gravOut', 'gravity', 10);
wirePhys('weight', 'weightOut', 'weight', 100);
wirePhys('jump', 'jumpOut', 'jumpMul', 100);
$('throwBtn').addEventListener('click', () => {
  throwCritters(critters, 3.4, ENV.weight);
  if (voicesOn) for (const c of critters) {
    if (c.clip && Math.random() < 0.8) c.clip.say(Math.floor(Math.random() * 3), 't');
  }
});

let last = performance.now(), frames = 0, fpsT = last, fps = 0;
function simulate(dt) {
  for (const c of critters) {
    c.tick(dt, critters, ENV);
    // chirping: each critter occasionally says a line in its own voice
    c.chirpT -= dt;
    if (c.chirpT <= 0) {
      c.chirpT = 5 + Math.random() * 14;
      if (voicesOn) {
        const li = Math.floor(Math.random() * CRITTER_LINES.length);
        if (c.clip) c.clip.say(li, Math.random() < 0.3 ? 'k' : 'l');
        else { c.talker.feed(CRITTER_LINES[li] + ' '); c.talker.flush(); }
      }
    }
    if (c.justLanded) {
      c.justLanded = false;
      if (voicesOn && c.clip && Math.random() < 0.45) c.clip.say(Math.floor(Math.random() * 3), 'd');
    }
    if (c.clip) {
      c.jaw = c.clip.tick(dt);
    } else {
      const v = c.talker.tick(dt);
      c.jaw = v ? v.jaw : Math.max(0, c.jaw - dt * 3);
    }
  }
  for (let i = 0; i < critters.length; i++) {
    critters[i].build(critterBlock, i * SPLATS_PER_CRITTER * FLOATS_PER_SPLAT);
  }
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!xrSession) {
    if (heliOn) {
      // helicopter: a slow noisy orbit — radius, height, heading and the
      // look-at point all drift on value noise, so no two passes match;
      // height clamps keep the floor plane low in frame, radius keeps the
      // glade filling the screen without getting claustrophobic
      heliT += dt;
      const ang = heliT * 0.16 + (vnoise(heliT * 0.05, 3.7) - 0.5) * 1.4;
      const rad = 4.7 + (vnoise(heliT * 0.07, 11.1) - 0.5) * 2.0;
      const hgt = Math.max(1.0, 1.7 + (vnoise(heliT * 0.06, 27.4) - 0.5) * 1.8);
      renderer.setCamera(
        [Math.cos(ang) * rad, hgt, Math.sin(ang) * rad],
        [(vnoise(heliT * 0.045, 51.2) - 0.5) * 1.2, 0.55, (vnoise(heliT * 0.045, 63.9) - 0.5) * 1.2]);
    }
    simulate(dt);
    renderer.writeRegion(room.count, critterBlock);
    renderer.render();
    frames++;
    if (now - fpsT > 1000) {
      fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now;
      statsEl.textContent = `${critters.length} critters · ${(room.count + critters.length * SPLATS_PER_CRITTER).toLocaleString()} splats · ${fps.toFixed(0)} fps · ${renderer.backend}`;
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- WebXR: place the glade on the real floor, passthrough everywhere
// else. A separate WebGL2 renderer serves the session (the main canvas
// may be WebGPU, which WebXR does not take). 🍄 on = critters stay in
// the glade; 🍄 off = they roam and hop onto detected real-world
// horizontal surfaces (plane-detection: tables, chairs — whatever the
// device exposes).
const XR_SCALE = 0.8;
$('shroomChip').addEventListener('click', () => {
  shroomOn = !shroomOn;
  $('shroomChip').style.opacity = shroomOn ? '1' : '0.35';
  if (!shroomOn) addCredit('webxr', 'plane detection: your device\'s room scan, used live, never stored');
});
async function xrSetup() {
  if (!navigator.xr) return;
  let mode = null;
  for (const m of ['immersive-ar', 'immersive-vr']) {
    try { if (await navigator.xr.isSessionSupported(m)) { mode = m; break; } } catch { /* blocked */ }
  }
  if (!mode) return;
  $('xrChip').style.display = 'block';
  $('shroomChip').style.display = 'block';
  $('xrChip').addEventListener('click', () => enterXR(mode).catch(e => {
    statsEl.textContent = 'XR failed: ' + e.message;
  }));
}
async function enterXR(mode) {
  if (xrSession) { xrSession.end(); return; }
  if (!xrRend) {
    const c = document.createElement('canvas');
    xrRend = new SplatRenderer(c, { background: [0, 0, 0] });
    xrRend.setData(renderer.data ? renderer.data.slice() : new Float32Array(0), sceneCount);
    // the WebGPU backend keeps its own copy — rebuild from room + block
    if (!renderer.data) {
      const d = new Float32Array(sceneCount * FLOATS_PER_SPLAT);
      d.set(room.data); d.set(critterBlock, room.count * FLOATS_PER_SPLAT);
      xrRend.setData(d, sceneCount);
    }
  }
  await xrRend.gl.makeXRCompatible();
  xrSession = await navigator.xr.requestSession(mode, {
    requiredFeatures: ['local-floor'],
    optionalFeatures: ['plane-detection', 'dom-overlay'],
    domOverlay: { root: document.body },
  });
  const layer = new XRWebGLLayer(xrSession, xrRend.gl);
  xrSession.updateRenderState({ baseLayer: layer });
  xrRef = await xrSession.requestReferenceSpace('local-floor');
  xrModel = null; xrLast = 0;
  $('xrChip').style.opacity = '0.5';
  xrSession.addEventListener('end', () => {
    xrSession = null; xrModel = null;
    ENV.platforms = []; ENV.roamBounds = undefined;
    $('xrChip').style.opacity = '1';
  });
  xrSession.requestAnimationFrame(xrFrame);
}
function xrPlanes(frame) {
  // free-roam only: turn the device's detected horizontal surfaces into
  // landable platforms, in scene coordinates
  ENV.roamBounds = shroomOn ? undefined : 6;
  if (shroomOn || !frame.detectedPlanes) { ENV.platforms = []; return; }
  const plats = [];
  for (const plane of frame.detectedPlanes) {
    if (plane.orientation !== 'horizontal') continue;
    const pose = frame.getPose(plane.planeSpace, xrRef);
    if (!pose) continue;
    const wp = pose.transform.position;
    if (wp.y < 0.15) continue;               // the floor itself — already have it
    let r = 0;
    for (const pt of plane.polygon) r = Math.max(r, Math.hypot(pt.x, pt.z));
    plats.push({
      x: (wp.x - xrModel[12]) / XR_SCALE,
      z: (wp.z - xrModel[14]) / XR_SCALE,
      y: wp.y / XR_SCALE,
      r: Math.min(r, 1.5) / XR_SCALE,
    });
    if (plats.length >= 12) break;
  }
  ENV.platforms = plats;
}
function xrFrame(t, frame) {
  if (!xrSession) return;
  xrSession.requestAnimationFrame(xrFrame);
  const dt = xrLast ? Math.min(0.05, (t - xrLast) / 1000) : 0.016; xrLast = t;
  const pose = frame.getViewerPose(xrRef);
  if (!pose) return;
  if (!xrModel) {
    // place the glade ~2.2 m ahead of where the player looks on entry —
    // on the floor, clear of their feet
    const m = pose.transform.matrix;
    const fl = Math.hypot(m[8], m[10]) || 1;
    xrModel = new Float32Array([XR_SCALE, 0, 0, 0, 0, XR_SCALE, 0, 0, 0, 0, XR_SCALE, 0,
      pose.transform.position.x - m[8] / fl * 2.2, 0, pose.transform.position.z - m[10] / fl * 2.2, 1]);
  }
  xrPlanes(frame);
  simulate(dt);
  xrRend.writeRegion(room.count, critterBlock);
  const layer = xrSession.renderState.baseLayer;
  const views = pose.views.map(v => ({
    viewport: layer.getViewport(v),
    view: v.transform.inverse.matrix,
    proj: v.projectionMatrix,
  }));
  xrRend.renderXR(layer.framebuffer, views, xrModel);
}
xrSetup();
</script>
</body>
</html>
