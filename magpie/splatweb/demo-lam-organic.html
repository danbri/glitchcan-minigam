<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAM organic treatments (prototype, throwaway)</title>
<style>
html,body{margin:0;height:100%;background:#05060a;color:#d8dae2;font:13px monospace}
#gl{width:100%;height:100vh;display:block;touch-action:none}
.hud{position:fixed;top:10px;left:10px;background:rgba(10,13,20,.85);border:1px solid #3a5580;border-radius:8px;padding:0.6rem 0.8rem;max-width:min(340px,88vw);max-height:94vh;overflow:auto;transition:transform .25s ease;z-index:10}
.hud.collapsed{transform:translateX(-120%)}
#hudToggle{position:fixed;top:10px;left:10px;z-index:20;width:2.2rem;height:2.2rem;line-height:2.2rem;text-align:center;padding:0}
button{background:#22304a;color:#cfe0ff;border:1px solid #3a5580;border-radius:6px;padding:0.35rem 0.6rem;cursor:pointer;margin:2px 2px 0 0;font:13px monospace}
.carousel{margin-top:0.6rem;border-top:1px solid #2a3a56;padding-top:0.5rem}
.carousel .row{display:flex;align-items:center;gap:0.4rem;justify-content:space-between}
.carousel .label{flex:1;text-align:center;font-size:12px;color:#cfe0ff}
#stats{position:fixed;bottom:10px;left:10px;background:rgba(10,13,20,.8);border:1px solid #3a5580;border-radius:8px;padding:0.4rem 0.7rem;max-width:90vw;font-size:11px}
#credit{position:fixed;bottom:10px;right:10px;background:rgba(10,13,20,.8);border:1px solid #3a5580;border-radius:8px;padding:0.4rem 0.7rem;max-width:46vw;font-size:10px;color:#8fa2c4;line-height:1.4}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<button id="hudToggle">☰</button>
<div class="hud">
  <b>LAM organic treatments</b><br>
  <small>drag to orbit (clamped), wheel to zoom</small>

  <div class="carousel">
    <div style="font-size:11px;color:#7f93b8">FACE</div>
    <div class="row">
      <button id="facePrev">◀</button>
      <span class="label" id="faceLabel">—</span>
      <button id="faceNext">▶</button>
    </div>
  </div>

  <div class="carousel">
    <div style="font-size:11px;color:#7f93b8">TREATMENT</div>
    <div class="row">
      <button id="treatPrev">◀</button>
      <span class="label" id="treatLabel">—</span>
      <button id="treatNext">▶</button>
    </div>
  </div>

  <div style="margin-top:0.6rem">
    <button id="front">front</button><button id="wideside">wide side</button><button id="talk">talk burst</button>
  </div>
</div>
<div id="stats">loading…</div>
<div id="credit">
  Foliage: Botanical Garden Kiel, Victoria House · Simon Bethke · CC BY 4.0
  (fern/vine/hedge/canopy/pond, via magpie/dbdb splat pack)
</div>
<script type="module">
import { FLOATS_PER_SPLAT } from './lib/splat-renderer.js';
import { createSplatRenderer } from './lib/splat-renderer-auto.js';
import { loadLamAvatar } from './lib/lam-splats.js';
import { qMul, qNormalize } from './lib/pose-math.js';
import { ORGANIC_TREATMENTS, preloadAllOrganicElements } from './lib/lam-organic-treatments.js';

const $ = (id) => document.getElementById(id);
const canvas = $('gl'), statsEl = $('stats');

// mobile fix: a fixed-block controls panel ate ~90% of a phone screen in an
// earlier prototype — this is a slide-out drawer, collapsed by default
// under 640px, so the 3D view is the primary thing visible on a phone.
const hud = document.querySelector('.hud');
if (window.innerWidth < 640) hud.classList.add('collapsed');
$('hudToggle').onclick = () => hud.classList.toggle('collapsed');

canvas.width = canvas.clientWidth * devicePixelRatio;
canvas.height = canvas.clientHeight * devicePixelRatio;
const renderer = await createSplatRenderer(canvas, { background: [0.03, 0.05, 0.04] });
window.__renderer = renderer;

// --- camera: orbit CLAMPED so LAM's hollow/near-zero-thickness back-of-head
// shell (no real fix, only occlusion) is never exposed unobstructed.
const THETA_FRONT = Math.PI;
const THETA_CLAMP = 1.15;
let theta = THETA_FRONT, phi = 1.3, radius = 1.0, targetY = 0.15;
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function applyCamera() {
  renderer.setCamera([
    radius * Math.sin(theta) * Math.sin(phi),
    targetY + radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi),
  ], [0, targetY, 0]);
}
window.__setCam = (t, p, r, y) => { theta = t; phi = p; radius = r; if (y != null) targetY = y; applyCamera(); };
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  theta = clamp(theta - (e.clientX - drag[0]) * 0.006, THETA_FRONT - THETA_CLAMP, THETA_FRONT + THETA_CLAMP);
  phi = clamp(phi - (e.clientY - drag[1]) * 0.006, 0.7, 2.2);
  drag = [e.clientX, e.clientY]; applyCamera();
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); radius = clamp(radius * Math.exp(e.deltaY * 0.001), 0.35, 3); applyCamera(); }, { passive: false });

// --- idle rig demo (head sway + blink + mouth), same formula verified live
// in demo-lam-jar.html / demo-lam-jar-flame.html this session.
let talkBurstUntil = 0;
function idlePose(t) {
  const blinkPhase = (t % 3.4) / 3.4;
  const blink = blinkPhase < 0.06 ? Math.sin((blinkPhase / 0.06) * Math.PI) : 0;
  const yaw = Math.sin(t / 5.3) * 0.1;
  const pitch = Math.sin(t / 7.1 + 1) * 0.04;
  const qYaw = [0, Math.sin(yaw / 2), 0, Math.cos(yaw / 2)];
  const qPitch = [Math.sin(pitch / 2), 0, 0, Math.cos(pitch / 2)];
  const headQ = qNormalize(qMul(qYaw, qPitch));
  let talk = Math.max(0, Math.sin(t * 1.7)) * 0.16;
  if (t < talkBurstUntil) talk = Math.max(0, Math.sin(t * 9)) * 0.5;
  return { at: [0, 0, 0], bones: { head: headQ }, morph: { eyeBlinkLeft: blink, eyeBlinkRight: blink, jawOpen: talk } };
}
window.__talkBurst = () => { talkBurstUntil = performance.now() / 1000 + 2.5; };
$('talk').onclick = window.__talkBurst;

function fibonacciSphere(n) {
  const pts = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const yFrac = 1 - (i / Math.max(1, n - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - yFrac * yFrac));
    const th = golden * i;
    pts.push([Math.cos(th) * r, yFrac, Math.sin(th) * r]);
  }
  return pts;
}
function pushSplat(arr, o, x, y, z, r, g, b, a, s) {
  arr[o] = x; arr[o + 1] = y; arr[o + 2] = z;
  arr[o + 3] = 0; arr[o + 4] = 0; arr[o + 5] = 0; arr[o + 6] = 1;
  arr[o + 7] = s; arr[o + 8] = s; arr[o + 9] = s;
  arr[o + 10] = r; arr[o + 11] = g; arr[o + 12] = b; arr[o + 13] = a;
  return o + FLOATS_PER_SPLAT;
}
// Minimal occlusion dome — the ACTUAL safety mechanism against exposing
// LAM's hollow back, independent of which foliage treatment is layered on
// top. Smaller/simpler than the jar demos' dome since foliage usually
// covers most of it anyway; still guarantees no bare hollow geometry.
function buildOcclusionDome(bounds) {
  const { mnx, mxx, mny, mxy, mnz, mxz } = bounds;
  const cx = (mnx + mxx) / 2, cz = (mnz + mxz) / 2;
  const headW = mxx - mnx, headH = mxy - mny;
  const headR = Math.max(headW, headH) * 0.5 * 1.15;
  const midY = (mxy + mny) / 2;
  const depthPush = headR * 0.55;
  const domeCz = cz + depthPush, domeR = headR * 0.92;
  const faceFrontZ = mnz;
  const pts = fibonacciSphere(4000);
  const out = new Float32Array(pts.length * FLOATS_PER_SPLAT);
  let o = 0;
  for (const [px, py, pz] of pts) {
    const wx = cx + px * domeR, wy = midY + py * domeR * 1.05, wz = domeCz + pz * domeR * 0.85;
    if (wz < faceFrontZ + 0.012) continue;
    const shade = 0.35 + 0.15 * py;
    o = pushSplat(out, o, wx, wy, wz, shade, shade * 1.1, shade * 0.8, 1, 0.016);
  }
  return { data: out.subarray(0, o), count: o / FLOATS_PER_SPLAT, headR, midY, cx, cz };
}

// --- curated "timeless" face roster: screened (Sept 2026) to skip visibly
// modern styling markers (glasses, ballcaps, press/hi-vis context) — racial
// and ethnic variety is intentionally kept, this is ONLY about modern
// fashion/photography tells. See fork report for the exclusion list.
const TIMELESS_TPDNE = [1,2,4,5,6,7,8,9,10,14,16,17,20,23,24,26,27,28,29,30,31,32,34,35,36,37,39,40,41,42,44,45,46,47,48,50];
const FACES = [
  { id: 'lam-sample', label: 'LAM sample', base: 'third_party/lam-sample/', meshBase: 'third_party/lam-sample/' },
  { id: 'man2', label: 'man2', base: 'third_party/lam-synth-faces/man2/', meshBase: 'third_party/lam-sample/' },
  { id: 'lightbrownhairwoman', label: 'lightbrownhairwoman', base: 'third_party/lam-synth-faces/lightbrownhairwoman/', meshBase: 'third_party/lam-sample/' },
  ...TIMELESS_TPDNE.map((n) => ({
    id: `tpdne-${String(n).padStart(2, '0')}`,
    label: `tpdne-${String(n).padStart(2, '0')}`,
    base: `third_party/lam-synth-faces-tpdne/tpdne-${String(n).padStart(2, '0')}/`,
    meshBase: 'third_party/lam-sample/',
  })),
];

// --- state ---
let faceIdx = 0, treatIdx = 0;
let avatar = null, lamBuf = null, lastBounds = null, domeProps = null;

function setFaceLabel() { $('faceLabel').textContent = `${faceIdx + 1}/${FACES.length} — ${FACES[faceIdx].label}`; }
function setTreatLabel() { $('treatLabel').textContent = `${treatIdx + 1}/${ORGANIC_TREATMENTS.length} — ${ORGANIC_TREATMENTS[treatIdx].label}`; }
setFaceLabel(); setTreatLabel();

async function rebuild() {
  const face = FACES[faceIdx];
  statsEl.textContent = `loading ${face.label}…`;
  avatar = await loadLamAvatar(face.base, { meshBase: face.meshBase, yaw: Math.PI });
  lamBuf = new Float32Array(avatar.count * FLOATS_PER_SPLAT);
  avatar.pose({ at: [0, 0, 0], bones: {}, morph: {} }, lamBuf, 0);
  const n = avatar.lastCount;
  let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity, mnz = Infinity, mxz = -Infinity;
  for (let i = 0; i < n; i++) {
    const o = i * FLOATS_PER_SPLAT;
    const x = lamBuf[o], y = lamBuf[o + 1], z = lamBuf[o + 2];
    if (x < mnx) mnx = x; if (x > mxx) mxx = x;
    if (y < mny) mny = y; if (y > mxy) mxy = y;
    if (z < mnz) mnz = z; if (z > mxz) mxz = z;
  }
  lastBounds = { mnx, mxx, mny, mxy, mnz, mxz };
  domeProps = buildOcclusionDome(lastBounds);

  const treat = ORGANIC_TREATMENTS[treatIdx];
  const foliage = treat.recipe(lastBounds);

  const total = n + domeProps.count + foliage.count;
  const combined = new Float32Array(total * FLOATS_PER_SPLAT);
  combined.set(lamBuf.subarray(0, n * FLOATS_PER_SPLAT), 0);
  combined.set(domeProps.data, n * FLOATS_PER_SPLAT);
  combined.set(foliage.data, (n + domeProps.count) * FLOATS_PER_SPLAT);
  renderer.setData(combined, total);

  targetY = domeProps.midY - domeProps.headR * 0.1;
  radius = domeProps.headR * 2.2;
  applyCamera();
  statsEl.textContent = `face ${n.toLocaleString()} + dome ${domeProps.count.toLocaleString()} + foliage ${foliage.count.toLocaleString()} = ${total.toLocaleString()} splats · ${renderer.backend}`;
  window.__lamN = n;
}

$('facePrev').onclick = () => { faceIdx = (faceIdx - 1 + FACES.length) % FACES.length; setFaceLabel(); rebuild(); };
$('faceNext').onclick = () => { faceIdx = (faceIdx + 1) % FACES.length; setFaceLabel(); rebuild(); };
$('treatPrev').onclick = () => { treatIdx = (treatIdx - 1 + ORGANIC_TREATMENTS.length) % ORGANIC_TREATMENTS.length; setTreatLabel(); rebuild(); };
$('treatNext').onclick = () => { treatIdx = (treatIdx + 1) % ORGANIC_TREATMENTS.length; setTreatLabel(); rebuild(); };
$('front').onclick = () => window.__setCam(THETA_FRONT, 1.3, radius, targetY);
$('wideside').onclick = () => window.__setCam(THETA_FRONT - THETA_CLAMP, 1.3, radius, targetY);

await preloadAllOrganicElements();
await rebuild();

(function frame(t) {
  const tt = t / 1000;
  if (avatar) {
    const pose = idlePose(tt);
    avatar.pose(pose, lamBuf, 0);
    const n = avatar.lastCount;
    renderer.writeRegion(0, lamBuf.subarray(0, n * FLOATS_PER_SPLAT));
  }
  renderer.render();
  requestAnimationFrame(frame);
})(performance.now());
</script>
</body>
</html>
