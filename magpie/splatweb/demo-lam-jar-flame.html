<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAM head in a shimmering orb (prototype, throwaway)</title>
<style>html,body{margin:0;height:100%;background:#05060a;color:#d8dae2;font:13px monospace}
#gl{width:100%;height:100vh;display:block;touch-action:none}
.hud{position:fixed;top:10px;left:10px;background:rgba(10,13,20,.82);border:1px solid #3a5580;border-radius:8px;padding:2.7rem 0.8rem 0.6rem;max-width:min(300px,88vw);max-height:94vh;overflow:auto;transition:transform .25s ease;z-index:10}
.hud.collapsed{transform:translateX(-120%)}
#hudToggle{position:fixed;top:10px;left:10px;z-index:20;width:2.2rem;height:2.2rem;line-height:2.2rem;text-align:center;padding:0}
.hud select{width:100%;margin-top:0.2rem}
.hud label{display:block;margin-top:0.5rem;font-size:12px;color:#9fb3d8}
.hud input[type=range]{width:100%}
.hud .row{display:flex;justify-content:space-between;font-size:11px;color:#7f93b8}
.hud .grp{border-top:1px solid #2a3a56;margin-top:0.6rem;padding-top:0.4rem}
#stats{position:fixed;bottom:10px;left:10px;background:rgba(10,13,20,.8);border:1px solid #3a5580;border-radius:8px;padding:0.4rem 0.7rem;max-width:90vw}
button{background:#22304a;color:#cfe0ff;border:1px solid #3a5580;border-radius:6px;padding:0.3rem 0.5rem;cursor:pointer;margin:2px 2px 0 0}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<button id="hudToggle">☰</button>
<div class="hud">
  <b>head in a shimmering orb — prototype</b><br>
  <small>drag to orbit (clamped), wheel to zoom</small>
  <label>face
    <select id="face">
      <option value="boy1">boy1</option>
      <option value="man2">man2</option>
      <option value="woman1" selected>woman1</option>
      <option value="lightbrownhairwoman">lightbrownhairwoman</option>
    </select>
  </label>
  <div style="margin-top:0.5rem">
    <button id="front">front</button><button id="wideside">wide side</button><button id="talk">talk burst</button>
  </div>

  <div class="grp">
    <label>occlusion dome size <span id="vDomeScale"></span>
      <input type="range" id="domeScale" min="0.75" max="1.3" step="0.01" value="1.0">
    </label>
    <label>orb size <span id="vOrbScale"></span>
      <input type="range" id="orbScale" min="0.5" max="2.2" step="0.01" value="1.0">
    </label>
    <label>orb offset X <span id="vOffX"></span>
      <input type="range" id="offX" min="-1" max="1" step="0.01" value="0">
    </label>
    <label>orb offset Y <span id="vOffY"></span>
      <input type="range" id="offY" min="-1" max="1" step="0.01" value="0">
    </label>
    <label>orb offset Z (fwd/back) <span id="vOffZ"></span>
      <input type="range" id="offZ" min="-1" max="1" step="0.01" value="0">
    </label>
  </div>

  <div class="grp">
    <label>sway amplitude <span id="vSwayAmp"></span>
      <input type="range" id="swayAmp" min="0" max="0.4" step="0.005" value="0.12">
    </label>
    <label>sway speed <span id="vSwaySpeed"></span>
      <input type="range" id="swaySpeed" min="0.2" max="3" step="0.01" value="1.0">
    </label>
    <label>blink rate (per 10s) <span id="vBlinkRate"></span>
      <input type="range" id="blinkRate" min="0.5" max="6" step="0.1" value="2.9">
    </label>
    <label><input type="checkbox" id="manualMouth"> manual mouth
      <input type="range" id="mouth" min="0" max="1" step="0.01" value="0">
    </label>
  </div>
</div>
<div id="stats">loading…</div>
<script type="module">
import { FLOATS_PER_SPLAT } from './lib/splat-renderer.js';
import { createSplatRenderer } from './lib/splat-renderer-auto.js';
import { loadLamAvatar } from './lib/lam-splats.js';
import { qMul, qNormalize } from './lib/pose-math.js';

const $ = (id) => document.getElementById(id);
const canvas = $('gl'), statsEl = $('stats');

// mobile fix: the controls panel was eating ~90% of a phone screen — now a
// slide-out drawer, collapsed by default under 640px so the 3D view is what
// you actually see first.
const hud = document.querySelector('.hud');
if (window.innerWidth < 640) hud.classList.add('collapsed');
$('hudToggle').onclick = () => hud.classList.toggle('collapsed');
canvas.width = canvas.clientWidth * devicePixelRatio;
canvas.height = canvas.clientHeight * devicePixelRatio;
const renderer = await createSplatRenderer(canvas, { background: [0.02, 0.025, 0.04] });
window.__renderer = renderer;

// --- camera: orbit deliberately CLAMPED so the raw hollow back of the LAM
// head (a near-zero-thickness shell — real trained data only exists for
// what the source photo showed) can never be viewed unobstructed. Belt +
// braces with the opaque dome/collar/tubes geometry below, which is the
// real fix; the clamp is a second line of defence, not the fix itself.
const THETA_FRONT = Math.PI; // matches lam-splats' yaw=Math.PI convention
const THETA_CLAMP = 1.15;    // ~66 degrees either side of front
let theta = THETA_FRONT, phi = 1.3, radius = 1.0, targetY = 0.15;
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function applyCamera() {
  renderer.setCamera([
    radius * Math.sin(theta) * Math.sin(phi),
    targetY + radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi),
  ], [0, targetY, 0]);
}
window.__setCam = (t, p, r, y) => { theta = t; phi = p; radius = r; if (y != null) targetY = y; applyCamera(); };
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  theta = clamp(theta - (e.clientX - drag[0]) * 0.006, THETA_FRONT - THETA_CLAMP, THETA_FRONT + THETA_CLAMP);
  phi = clamp(phi - (e.clientY - drag[1]) * 0.006, 0.7, 2.2);
  drag = [e.clientX, e.clientY]; applyCamera();
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); radius = clamp(radius * Math.exp(e.deltaY * 0.001), 0.35, 3); applyCamera(); }, { passive: false });

// --- slider-driven idle rig demo. Same idlePose shape as demo-lam-jar.html
// but amplitude/speed/blink-rate/mouth are live-tunable instead of fixed
// constants, and mouth can be driven manually to prove the morph rig
// responds to arbitrary input, not just the canned idle formula.
const sliders = {};
for (const id of ['domeScale', 'orbScale', 'offX', 'offY', 'offZ', 'swayAmp', 'swaySpeed', 'blinkRate', 'mouth']) {
  sliders[id] = $(id);
  const vEl = $('v' + id[0].toUpperCase() + id.slice(1));
  if (vEl) {
    const upd = () => { vEl.textContent = Number(sliders[id].value).toFixed(2); };
    sliders[id].addEventListener('input', upd); upd();
  }
}
// talk burst now drives the rig's full mouth-shape range (funnel, pucker,
// stretch, smile, press, roll, lower-down, upper-up — not just jawOpen)
// via lib/lam-visemes.js's canned viseme sequencer. Manual-mouth override
// still wins over both idle and burst, unchanged.
let talkBurstStart = -1;
function idlePose(t) {
  const rate = Number(sliders.blinkRate.value); // blinks per 10s
  const period = rate > 0 ? 10 / rate : 1e9;
  const blinkPhase = (t % period) / period;
  const blink = blinkPhase < 0.06 ? Math.sin((blinkPhase / 0.06) * Math.PI) : 0;
  const swayAmp = Number(sliders.swayAmp.value), swaySpeed = Number(sliders.swaySpeed.value);
  const yaw = Math.sin(t * swaySpeed / 5.3) * swayAmp;
  const pitch = Math.sin(t * swaySpeed / 7.1 + 1) * swayAmp * 0.42;
  const qYaw = [0, Math.sin(yaw / 2), 0, Math.cos(yaw / 2)];
  const qPitch = [Math.sin(pitch / 2), 0, 0, Math.cos(pitch / 2)];
  const headQ = qNormalize(qMul(qYaw, qPitch));
  let morph;
  if ($('manualMouth').checked) {
    morph = { eyeBlinkLeft: blink, eyeBlinkRight: blink, jawOpen: Number(sliders.mouth.value) };
  } else {
    const idleJaw = Math.max(0, Math.sin(t * 1.7)) * 0.18;
    const talkMorph = talkBurstStart >= 0 ? sampleTalkBurst(t - talkBurstStart) : {};
    morph = { eyeBlinkLeft: blink, eyeBlinkRight: blink, jawOpen: idleJaw, ...talkMorph };
  }
  return { at: [0, 0, 0], bones: { head: headQ }, morph };
}
window.__talkBurst = () => { talkBurstStart = performance.now() / 1000; };
$('talk').onclick = window.__talkBurst;

function fibonacciSphere(n) {
  const pts = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const yFrac = 1 - (i / Math.max(1, n - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - yFrac * yFrac));
    const th = golden * i;
    pts.push([Math.cos(th) * r, yFrac, Math.sin(th) * r]);
  }
  return pts;
}
function pushSplat(arr, o, x, y, z, r, g, b, a, s) {
  arr[o] = x; arr[o + 1] = y; arr[o + 2] = z;
  arr[o + 3] = 0; arr[o + 4] = 0; arr[o + 5] = 0; arr[o + 6] = 1; // identity quat (x,y,z,w)
  arr[o + 7] = s; arr[o + 8] = s; arr[o + 9] = s;
  arr[o + 10] = r; arr[o + 11] = g; arr[o + 12] = b; arr[o + 13] = a;
  return o + FLOATS_PER_SPLAT;
}

// --- static occlusion geometry: brain-case dome + neck collar + life-
// support tubes. UNCHANGED from demo-lam-jar.html — this is the actual fix
// for the hollow-back problem, not the outer "jar" shell (which this file
// replaces with an animated particle effect below).
function buildStaticProps(bounds, domeScale = 1.0) {
  const { mnx, mxx, mny, mxy, mnz, mxz } = bounds;
  const cx = (mnx + mxx) / 2, cz = (mnz + mxz) / 2;
  const topY = mxy, botY = mny;
  const headW = mxx - mnx, headH = topY - botY;
  const headR = Math.max(headW, headH) * 0.5 * 1.15;
  const midY = (topY + botY) / 2;
  const depthPush = headR * 0.55;
  const domeCx = cx, domeCy = midY, domeCz = cz + depthPush, domeR = headR * 1.2 * domeScale;
  const faceFrontZ = mnz;

  const MAX = 9500 + 260 + 2 * 190;
  const out = new Float32Array(MAX * FLOATS_PER_SPLAT);
  let o = 0;

  const domePts = fibonacciSphere(9000);
  for (const [px, py, pz] of domePts) {
    const wx = domeCx + px * domeR, wy = domeCy + py * domeR * 1.05, wz = domeCz + pz * domeR * 0.85;
    if (wz < faceFrontZ + 0.012) continue;
    const shade = 0.75 + 0.18 * py;
    o = pushSplat(out, o, wx, wy, wz, 0.50 * shade, 0.53 * shade, 0.58 * shade, 1, 0.0125);
  }

  const collarR = headW * 0.58;
  for (const dy of [-0.018, 0, 0.014]) {
    const n = 46;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const wx = cx + Math.cos(a) * collarR, wz = cz + Math.sin(a) * collarR;
      o = pushSplat(out, o, wx, botY + dy, wz, 0.62, 0.55, 0.30, 1, 0.012);
    }
  }
  const capN = 220;
  for (let i = 0; i < capN; i++) {
    const rr = collarR * Math.sqrt((i + 0.5) / capN);
    const a = i * 2.399963;
    const wx = cx + Math.cos(a) * rr, wz = cz + Math.sin(a) * rr;
    o = pushSplat(out, o, wx, botY - 0.02, wz, 0.10, 0.11, 0.13, 1, 0.014);
  }

  const baseY = botY - headR * 3.1;
  const tubeDefs = [
    { a0: 0.7, col: [0.75, 0.35, 0.15] },
    { a0: -2.1, col: [0.20, 0.55, 0.30] },
  ];
  for (const { a0, col } of tubeDefs) {
    const steps = 26;
    for (let i = 0; i < steps; i++) {
      const t = i / (steps - 1);
      const y = botY - t * (botY - baseY);
      const wob = Math.sin(t * 3.1 + a0) * headR * 0.35;
      const wx = cx + Math.cos(a0) * collarR * 1.05 + wob;
      const wz = cz + Math.sin(a0) * collarR * 1.05;
      const ring = 6;
      for (let k = 0; k < ring; k++) {
        const ra = (k / ring) * Math.PI * 2;
        o = pushSplat(out, o, wx + Math.cos(ra) * 0.012, y, wz + Math.sin(ra) * 0.012, col[0], col[1], col[2], 1, 0.010);
      }
    }
  }

  const standY = domeCy - domeR * 1.7, standR = domeR * 0.75;
  for (let layer = 0; layer < 2; layer++) {
    const n = 250;
    for (let i = 0; i < n; i++) {
      const rr = standR * Math.sqrt((i + 0.5) / n);
      const a = i * 2.399963;
      const wx = cx + Math.cos(a) * rr, wz = cz + Math.sin(a) * rr;
      o = pushSplat(out, o, wx, standY - layer * 0.04, wz, 0.09, 0.10, 0.12, 1, 0.02);
    }
  }

  return { data: out.subarray(0, o), count: o / FLOATS_PER_SPLAT, headR, midY, domeR, cx, cz, depthPush };
}

// --- shimmering cold-flame orb: a VOLUME (not just a shell) of particles,
// each with a fixed base direction/radius-fraction/twinkle-phase/color-seed
// computed once, then re-evaluated every frame (position swirl + vertical
// wisp + independent-phase twinkle + slow cold-palette color drift) and
// pushed via renderer.writeRegion() — the same live-update mechanism the
// LAM face's own pose animation already uses, so this is genuinely
// per-frame animated, not a static "jar" shell like the baseline file.
const ORB_N = 1300;
function buildOrbParticles() {
  const dirs = fibonacciSphere(ORB_N);
  const meta = new Array(ORB_N);
  for (let i = 0; i < ORB_N; i++) {
    // cube-root radius fraction -> uniform-in-volume, not clustered at the
    // shell surface, so the orb reads as a fluffy cloud, not a hard ball
    const radFrac = Math.cbrt(0.25 + 0.75 * ((i * 0.61803399) % 1));
    meta[i] = {
      dir: dirs[i],
      radFrac,
      phaseTwinkle: (i * 12.9898) % (2 * Math.PI),
      phaseWisp: (i * 78.233) % (2 * Math.PI),
      colorSeed: (i * 0.3376) % 1,
      swirlOff: (i * 0.618) % (2 * Math.PI),
    };
  }
  return meta;
}
// cold palette: pale cyan -> white -> pale violet -> deep blue, NEVER warm
const COLD_STOPS = [
  [0.35, 0.85, 1.00], // cyan
  [0.85, 0.92, 1.00], // near-white
  [0.62, 0.55, 1.00], // pale violet
  [0.20, 0.45, 0.95], // deep blue
];
function coldColor(seed) {
  const f = seed * COLD_STOPS.length;
  const i0 = Math.floor(f) % COLD_STOPS.length, i1 = (i0 + 1) % COLD_STOPS.length, t = f - Math.floor(f);
  const a = COLD_STOPS[i0], b = COLD_STOPS[i1];
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

function writeOrbFrame(buf, meta, t, center, orbR) {
  const swirl = t * 0.18;
  let o = 0;
  for (let i = 0; i < meta.length; i++) {
    const m = meta[i];
    const r = orbR * m.radFrac * (1 + 0.05 * Math.sin(t * 1.3 + m.phaseTwinkle));
    // swirl rotation around Y
    const ang = swirl + m.swirlOff;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const dx = m.dir[0] * ca - m.dir[2] * sa;
    const dz = m.dir[0] * sa + m.dir[2] * ca;
    const wisp = Math.sin(t * 0.7 + m.phaseWisp) * orbR * 0.06; // flame-lick vertical drift
    const wx = center[0] + dx * r;
    const wy = center[1] + m.dir[1] * r + wisp;
    const wz = center[2] + dz * r;
    const twinkle = 0.35 + 0.65 * Math.max(0, Math.sin(t * 2.6 + m.phaseTwinkle * 3.1));
    const colorDrift = (m.colorSeed + t * 0.015) % 1;
    const [cr, cg, cb] = coldColor(colorDrift);
    const alpha = 0.05 + 0.16 * twinkle;
    const scale = 0.012 + 0.014 * twinkle; // twinkle peaks read as brighter AND slightly bigger sparkle
    o = pushSplat(buf, o, wx, wy, wz, cr, cg, cb, alpha, scale);
  }
}

// --- load / rebuild ---
let avatar = null, lamBuf = null, staticData = null, staticCount = 0, lamN = 0, lastBounds = null;
let orbMeta = null, orbBuf = null, orbStart = 0, orbCenter0 = [0, 0, 0], orbR0 = 0.1;

// Rebuilds the occlusion-dome/collar/tube region AND the orb (which anchors
// off the dome's radius/center). staticCount can change slightly with dome
// size (the front-face clip test admits a different point fraction), so
// this does a full setData() recombine rather than a fixed-offset
// writeRegion — correctness over the extra upload cost, which is trivial at
// ~25k splats. Wired to the dome-size slider so that sphere is no longer a
// fixed, unreachable constant.
function rebuildStatic() {
  if (!lastBounds) return;
  const props = buildStaticProps(lastBounds, Number(sliders.domeScale.value));
  staticData = props.data; staticCount = props.count;
  orbR0 = props.domeR + props.headR * 0.55;
  orbCenter0 = [props.cx, props.midY, props.cz + props.depthPush];
  orbStart = lamN + staticCount;

  const combined = new Float32Array((lamN + staticCount + ORB_N) * FLOATS_PER_SPLAT);
  combined.set(lamBuf.subarray(0, lamN * FLOATS_PER_SPLAT), 0);
  combined.set(staticData, lamN * FLOATS_PER_SPLAT);
  const orbScale = Number(sliders.orbScale.value);
  const center = [
    orbCenter0[0] + Number(sliders.offX.value) * orbR0,
    orbCenter0[1] + Number(sliders.offY.value) * orbR0,
    orbCenter0[2] + Number(sliders.offZ.value) * orbR0,
  ];
  writeOrbFrame(orbBuf, orbMeta, performance.now() / 1000, center, orbR0 * orbScale);
  combined.set(orbBuf, orbStart * FLOATS_PER_SPLAT);
  renderer.setData(combined, lamN + staticCount + ORB_N);
  statsEl.textContent = `face ${lamN.toLocaleString()} + occlusion ${staticCount.toLocaleString()} + orb ${ORB_N.toLocaleString()} = ${(lamN + staticCount + ORB_N).toLocaleString()} splats · ${renderer.backend}`;
}
sliders.domeScale.addEventListener('input', rebuildStatic);

async function loadFace(name) {
  statsEl.textContent = `loading ${name}…`;
  avatar = await loadLamAvatar(`third_party/lam-synth-faces/${name}/`, { yaw: Math.PI });
  lamBuf = new Float32Array(avatar.count * FLOATS_PER_SPLAT);

  avatar.pose({ at: [0, 0, 0], bones: {}, morph: {} }, lamBuf, 0);
  const n = avatar.lastCount;
  lamN = n;
  let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity, mnz = Infinity, mxz = -Infinity;
  for (let i = 0; i < n; i++) {
    const o = i * FLOATS_PER_SPLAT;
    const x = lamBuf[o], y = lamBuf[o + 1], z = lamBuf[o + 2];
    if (x < mnx) mnx = x; if (x > mxx) mxx = x;
    if (y < mny) mny = y; if (y > mxy) mxy = y;
    if (z < mnz) mnz = z; if (z > mxz) mxz = z;
  }
  lastBounds = { mnx, mxx, mny, mxy, mnz, mxz };
  const props = buildStaticProps(lastBounds, Number(sliders.domeScale.value));
  staticData = props.data; staticCount = props.count;

  orbMeta = buildOrbParticles();
  orbBuf = new Float32Array(ORB_N * FLOATS_PER_SPLAT);
  orbR0 = props.domeR + props.headR * 0.55;
  orbCenter0 = [props.cx, props.midY, props.cz + props.depthPush];
  orbStart = n + staticCount;

  const combined = new Float32Array((n + staticCount + ORB_N) * FLOATS_PER_SPLAT);
  combined.set(lamBuf.subarray(0, n * FLOATS_PER_SPLAT), 0);
  combined.set(staticData, n * FLOATS_PER_SPLAT);
  writeOrbFrame(orbBuf, orbMeta, 0, orbCenter0, orbR0 * Number(sliders.orbScale.value));
  combined.set(orbBuf, orbStart * FLOATS_PER_SPLAT);
  renderer.setData(combined, n + staticCount + ORB_N);

  targetY = props.midY;
  radius = (orbR0 * Number(sliders.orbScale.value)) * 2.0;
  applyCamera();
  statsEl.textContent = `face ${n.toLocaleString()} + occlusion ${staticCount.toLocaleString()} + orb ${ORB_N.toLocaleString()} = ${(n + staticCount + ORB_N).toLocaleString()} splats · ${renderer.backend}`;
  window.__lamLoaded = true;
}
$('face').addEventListener('change', () => loadFace($('face').value));
$('front').onclick = () => window.__setCam(THETA_FRONT, 1.3, radius, targetY);
$('wideside').onclick = () => window.__setCam(THETA_FRONT - THETA_CLAMP, 1.3, radius, targetY);

await loadFace($('face').value);

(function frame(t) {
  const tt = t / 1000;
  if (avatar) {
    const pose = idlePose(tt);
    window.__lastPose = pose;
    avatar.pose(pose, lamBuf, 0);
    const n = avatar.lastCount;
    renderer.writeRegion(0, lamBuf.subarray(0, n * FLOATS_PER_SPLAT));
  }
  if (orbMeta) {
    const orbScale = Number(sliders.orbScale.value);
    const center = [
      orbCenter0[0] + Number(sliders.offX.value) * orbR0,
      orbCenter0[1] + Number(sliders.offY.value) * orbR0,
      orbCenter0[2] + Number(sliders.offZ.value) * orbR0,
    ];
    writeOrbFrame(orbBuf, orbMeta, tt, center, orbR0 * orbScale);
    renderer.writeRegion(orbStart, orbBuf);
    window.__lastOrbSample = { t: tt, p0: [orbBuf[0], orbBuf[1], orbBuf[2]], a0: orbBuf[13] };
  }
  renderer.render();
  requestAnimationFrame(frame);
})(performance.now());
</script>
</body>
</html>
