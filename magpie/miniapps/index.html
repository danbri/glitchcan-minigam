<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniApp runner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23268bd2'/%3E%3C/svg%3E">
<meta name="description" content="A runner for W3C MiniApp packages (Manifest, Packaging, Lifecycle, Addressing drafts) under the foafos capability tree.">
<style>
  :root {
    --bg: #f6f4ef; --fg: #1d232a; --muted: #5b6570; --panel: #ffffff; --line: #d8d4ca;
    --accent: #1f6feb; --bad: #b42318; --phone: #111;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171b; --fg: #e6e8eb; --muted: #9aa4ae; --panel: #1d2127; --line: #333a43;
      --accent: #6aa7ff; --bad: #ff8a80; --phone: #000;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171b; --fg: #e6e8eb; --muted: #9aa4ae; --panel: #1d2127; --line: #333a43;
    --accent: #6aa7ff; --bad: #ff8a80; --phone: #000;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 1rem/1.45 system-ui, sans-serif; }
  header, main { padding: 0 1rem; max-width: 70rem; margin: 0 auto; }
  header h1 { font-size: 1.15rem; margin: 1rem 0 0.25rem; }
  header p { margin: 0 0 0.75rem; color: var(--muted); font-size: 0.9rem; }
  form#go { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  form#go input { flex: 1; min-width: 0; font: 0.85rem ui-monospace, monospace; padding: 0.5rem;
    border: 1px solid var(--line); border-radius: 0.4rem; background: var(--panel); color: var(--fg); }
  button { font: inherit; padding: 0.45rem 0.8rem; border-radius: 0.4rem; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  .layout { display: grid; gap: 1rem; grid-template-columns: 1fr; }
  @media (min-width: 52rem) { .layout { grid-template-columns: 24rem 1fr; } }
  .phone { background: var(--phone); border-radius: 1.4rem; padding: 0.6rem; width: 100%; max-width: 24rem; margin: 0 auto; }
  .screen { background: #fff; border-radius: 1rem; overflow: hidden; height: 36rem; display: flex; flex-direction: column; position: relative; }
  #navbar { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; min-height: 2.75rem; }
  #navbar button { background: transparent; color: inherit; border-color: currentColor; padding: 0.2rem 0.6rem; }
  #nav-title { font-weight: 600; flex: 1; text-align: center; margin-right: 3rem; }
  #stage { flex: 1; position: relative; }
  #stage iframe.miniapp-page { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #closed { position: absolute; inset: 0; display: grid; place-items: center; color: #555; background: #f2f2f2; }
  #toast { position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff;
    padding: 0.4rem 0.8rem; border-radius: 0.4rem; font-size: 0.9rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin: 0.75rem 0; }
  section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 0.6rem; padding: 0.75rem 1rem; margin-bottom: 1rem; overflow-x: auto; }
  section.panel h2 { font-size: 1rem; margin: 0 0 0.5rem; }
  #app-meta, #signing { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
  table { border-collapse: collapse; font-size: 0.85rem; width: 100%; }
  td { border-top: 1px solid var(--line); padding: 0.3rem 0.4rem; vertical-align: top; }
  td:first-child { overflow-wrap: anywhere; font-family: ui-monospace, monospace; font-size: 0.8rem; }
  ol#log { font: 0.8rem/1.4 ui-monospace, monospace; max-height: 22rem; overflow: auto; padding-left: 2rem; margin: 0; }
  .bad { color: var(--bad); }
  #error { color: var(--bad); font-weight: 600; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>MiniApp runner</h1>
  <p>Runs W3C MiniApp packages (<code>.ma</code>) in sandboxed frames under the foafos capability tree.
    The W3C drafts it follows were discontinued in August 2026: see <a href="README.md">README.md</a>.</p>
  <form id="go">
    <input id="uri" name="uri" spellcheck="false" autocomplete="off" aria-label="MiniApp URI">
    <button type="submit">Open</button>
  </form>
  <p id="error" role="alert" hidden></p>
</header>
<main class="layout">
  <div>
    <div class="phone">
      <div class="screen">
        <div id="navbar"><button id="back" type="button" disabled aria-label="Back">‹</button><span id="nav-title"></span></div>
        <div id="stage"></div>
        <div id="closed" hidden>App unloaded</div>
        <div id="toast" role="status" hidden></div>
      </div>
    </div>
    <div class="controls">
      <button id="hide" type="button">Home (hide app)</button>
      <button id="show" type="button">Return (show app)</button>
      <button id="close" type="button">Close app</button>
    </div>
  </div>
  <div>
    <section class="panel">
      <h2 id="app-name">…</h2>
      <p id="app-meta"></p>
      <p id="signing"></p>
    </section>
    <section class="panel">
      <h2>Permissions (req_permissions → foafos capabilities)</h2>
      <table><tbody id="grants"></tbody></table>
    </section>
    <section class="panel">
      <h2>Package warnings</h2>
      <ul id="warnings"></ul>
    </section>
    <section class="panel">
      <h2>Bus and lifecycle log</h2>
      <ol id="log"></ol>
    </section>
  </div>
</main>
<script type="module" src="runner.mjs"></script>
</body>
</html>
