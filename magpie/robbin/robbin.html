<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ROBBIN — an egg-and-ladders platformer</title>
<style>
  :root {
    --paper: #f2ecdd;
    --ink: #26221e;
    --red: #d94327;
    --green: #2e5e45;
    --ochre: #b98a2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--paper);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    text-align: center;
    background: rgba(242, 236, 221, 0.94);
    cursor: pointer;
    padding: 1.2rem;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: clamp(3rem, 13vmin, 5.5rem);
    letter-spacing: 0.12em;
    color: var(--ink);
  }
  .overlay h1 .r { color: var(--red); }
  .overlay .sub { font-style: italic; opacity: 0.75; font-size: clamp(0.95rem, 2.6vmin, 1.2rem); }
  #cast { display: flex; align-items: flex-end; gap: clamp(0.5rem, 3vmin, 1.4rem); margin: 0.5rem 0; }
  #cast svg { width: clamp(64px, 14vmin, 120px); height: auto; }
  .overlay .keys {
    font-size: clamp(0.8rem, 2.3vmin, 1rem);
    line-height: 1.55;
    opacity: 0.8;
  }
  .overlay .go {
    margin-top: 0.5rem;
    font-weight: bold;
    font-size: clamp(0.95rem, 2.8vmin, 1.2rem);
    letter-spacing: 0.08em;
    color: var(--green);
    animation: blink 1.2s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }
  .finalscore { font-size: clamp(1.1rem, 3.5vmin, 1.5rem); font-weight: bold; }

  #mute {
    position: absolute;
    top: calc(4px + env(safe-area-inset-top));
    right: calc(8px + env(safe-area-inset-right));
    width: 40px; height: 40px;
    border: none;
    border-radius: 50%;
    background: transparent;
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 5;
  }

  /* touch controls float over the play area — only on coarse pointers */
  #touch { display: none; }
  @media (pointer: coarse) {
    #touch {
      display: flex;
      position: absolute;
      left: 0; right: 0;
      bottom: calc(10px + env(safe-area-inset-bottom));
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 clamp(8px, 3vw, 24px);
      pointer-events: none;
    }
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, clamp(52px, 15vw, 66px));
      grid-template-rows: repeat(2, clamp(52px, 15vw, 66px));
      gap: 7px;
    }
    #touch button {
      pointer-events: auto;
      border: 2px solid rgba(242, 236, 221, 0.85);
      border-radius: 12px;
      background: rgba(38, 34, 30, 0.30);
      color: var(--paper);
      font-size: 1.5rem;
      touch-action: none;
    }
    #touch button:active { background: rgba(38, 34, 30, 0.55); }
    #btn-up   { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right{ grid-column: 3; grid-row: 2; }
    #btn-jump {
      width: clamp(88px, 26vw, 116px);
      height: clamp(88px, 26vw, 116px);
      border-radius: 50%;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" role="img" aria-label="Robbin game screen"></canvas>

  <button type="button" id="mute" aria-label="Mute music">&#128266;</button>

  <div id="title" class="overlay">
    <h1>R<span class="r">O</span>BBIN</h1>
    <div class="sub">an egg-and-ladders platformer</div>
    <div id="cast" aria-hidden="true"></div>
    <div class="keys">
      Gobble every grain pile. Pinch the cream before the flock does.<br>
      <b>&larr;&rarr;</b> run &nbsp; <b>&uarr;&darr;</b> ladders &nbsp; <b>space</b> jump &nbsp; <b>P</b> pause &nbsp; <b>M</b> music
    </div>
    <div class="go">PRESS ENTER / TAP TO START</div>
  </div>

  <div id="gameover" class="overlay hidden">
    <h1>PLUCKED!</h1>
    <div class="finalscore"></div>
    <div class="go">PRESS ENTER / TAP TO PLAY AGAIN</div>
  </div>

  <div id="touch">
    <div id="dpad">
      <button type="button" id="btn-up" data-k="up" aria-label="Climb up">&uarr;</button>
      <button type="button" id="btn-left" data-k="left" aria-label="Run left">&larr;</button>
      <button type="button" id="btn-down" data-k="down" aria-label="Climb down">&darr;</button>
      <button type="button" id="btn-right" data-k="right" aria-label="Run right">&rarr;</button>
    </div>
    <button type="button" id="btn-jump" data-k="jump" aria-label="Jump">JUMP</button>
  </div>
</div>
<script type="module" src="robbin-game.js"></script>
</body>
</html>
