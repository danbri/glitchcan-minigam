<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
>
<title>ROBBIN — two cut-paper birds in 3D</title>

<style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #171815;
    color: #f2ecdd;
    font-family: Georgia, "Times New Roman", serif;
  }

  canvas {
    display: block;
  }

  #ui {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }

  #heading {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top));
    left: 16px;
    text-shadow: 0 2px 8px #000;
  }

  #heading strong {
    display: block;
    font-size: clamp(21px, 5vw, 38px);
    letter-spacing: 0.035em;
  }

  #heading em {
    display: block;
    margin-top: 3px;
    opacity: 0.72;
    font-size: 13px;
  }

  #back {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top));
    right: 16px;
    pointer-events: auto;
    padding: 9px 13px;
    border: 1px solid #d5cdb8;
    border-radius: 999px;
    background: rgba(28, 29, 26, 0.84);
    color: #f2ecdd;
    font: 700 12px system-ui, sans-serif;
    text-decoration: none;
    backdrop-filter: blur(8px);
  }

  #controls {
    position: absolute;
    left: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    max-width: calc(100vw - 28px);
    pointer-events: auto;
  }

  button {
    padding: 9px 13px;
    border: 1px solid #d5cdb8;
    border-radius: 999px;
    background: rgba(28, 29, 26, 0.84);
    color: #f2ecdd;
    font: 700 12px system-ui, sans-serif;
    backdrop-filter: blur(8px);
  }

  button.active {
    background: #f2ecdd;
    color: #26221e;
  }

  #status {
    position: absolute;
    right: 16px;
    bottom: calc(18px + env(safe-area-inset-bottom));
    text-align: right;
    font: 12px system-ui, sans-serif;
    opacity: 0.72;
  }

  #fps {
    font-variant-numeric: tabular-nums;
  }
</style>
</head>

<body>

<div id="ui">
  <div id="heading">
    <strong>ROBBIN — TWO BIRDS IN 3D</strong>
    <em>original lino-cut paths, mounted as hinged paper layers</em>
  </div>

  <a id="back" href="robbin.html">&larr; ROBBIN</a>

  <div id="controls">
    <button id="blueButton" class="active">BLUE TIT</button>
    <button id="robinButton" class="active">ROBIN</button>
    <button id="flyButton" class="active">FLYING</button>
    <button id="spreadButton">SPREAD APART</button>
  </div>

  <div id="status">
    <span id="fps">— fps</span><br>
    drag to orbit · pinch or wheel to zoom<br>
    XR button appears when available
  </div>
</div>

<script type="module">
/*
  Ported from the CodePen prototype (danbri/pen/QwdBKbE, mirrored in
  codepen-backups/pens/QwdBKbE/). Same scene, same paths, two swaps to
  keep it self-contained on GitHub Pages with the repo's vendored three
  (no CDN): OrbitControls and VRButton are replaced by the small
  equivalents at the bottom of this file.
*/
import * as THREE from "./vendor/three.module.min.js";
import { makeBirdFactory } from "./robbin-birds3d.js";

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;

document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171815);
scene.fog = new THREE.Fog(0x171815, 7, 18);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.02,
  100
);

camera.position.set(0, 1.15, 5.4);

const hemisphere = new THREE.HemisphereLight(
  0xfff5dd,
  0x151712,
  2.15
);

scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xffe8c4, 3.2);
keyLight.position.set(-4, 7, 5);
keyLight.castShadow = true;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x7898d2, 2.1);
rimLight.position.set(5, 3, -4);
scene.add(rimLight);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x292a24,
  roughness: 1
});

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(8, 64),
  floorMaterial
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.62;
floor.receiveShadow = true;

scene.add(floor);

const { createBird } = makeBirdFactory(THREE, renderer);

const blueTit = createBird("bluetit", 1.45);
const robin = createBird("robin", 1.45);

blueTit.position.set(-0.95, 0.18, 0);
robin.position.set(0.95, 0.18, 0.05);

scene.add(blueTit);
scene.add(robin);

let blueVisible = true;
let robinVisible = true;
let flying = true;
let spreadApart = false;

const blueButton = document.querySelector("#blueButton");
const robinButton = document.querySelector("#robinButton");
const flyButton = document.querySelector("#flyButton");
const spreadButton = document.querySelector("#spreadButton");

blueButton.addEventListener("click", () => {
  blueVisible = !blueVisible;
  blueTit.visible = blueVisible;
  blueButton.classList.toggle("active", blueVisible);
});

robinButton.addEventListener("click", () => {
  robinVisible = !robinVisible;
  robin.visible = robinVisible;
  robinButton.classList.toggle("active", robinVisible);
});

flyButton.addEventListener("click", () => {
  flying = !flying;
  flyButton.classList.toggle("active", flying);
  flyButton.textContent = flying ? "FLYING" : "IDLE";
});

spreadButton.addEventListener("click", () => {
  spreadApart = !spreadApart;
  spreadButton.classList.toggle("active", spreadApart);
  spreadButton.textContent = spreadApart
    ? "BRING TOGETHER"
    : "SPREAD APART";
});

function animateBird(bird, time, index) {
  const parts = bird.userData.parts;
  const phase = time * 8 + bird.userData.animationOffset;

  const targetX = spreadApart
    ? index === 0 ? -1.55 : 1.55
    : index === 0 ? -0.95 : 0.95;

  bird.position.x += (targetX - bird.position.x) * 0.06;

  if (flying) {
    parts.wing.rotation.x =
      -0.22 +
      Math.sin(phase) * 1.05;

    parts.wing.rotation.z =
      Math.sin(phase * 0.5) * 0.13;

    parts.tail.rotation.z =
      -0.11 +
      Math.sin(phase * 0.45 - 0.8) * 0.09;

    parts.head.rotation.z =
      -Math.sin(phase - 1.1) * 0.04;

    parts.head.rotation.y =
      Math.sin(phase * 0.31) * 0.05;

    bird.rotation.z =
      Math.sin(time * 1.8 + index) * 0.025;

    bird.position.y =
      0.18 +
      Math.sin(time * 2.1 + index * 1.4) * 0.07;
  } else {
    parts.wing.rotation.x =
      0.05 +
      Math.sin(phase * 0.2) * 0.045;

    parts.wing.rotation.z =
      Math.sin(phase * 0.16) * 0.025;

    parts.tail.rotation.z =
      Math.sin(phase * 0.18) * 0.05;

    parts.head.rotation.z =
      Math.sin(phase * 0.22 + 1) * 0.055;

    parts.head.rotation.y =
      Math.sin(phase * 0.14) * 0.04;

    bird.rotation.z =
      Math.sin(phase * 0.12) * 0.012;

    bird.position.y = 0.18;
  }
}

/*
  A pocket OrbitControls: one-finger / mouse drag orbits, wheel or
  two-finger pinch zooms, with a little damping so it coasts to rest.
  Same public surface as the addon where this page uses it (target,
  min/maxDistance, update()).
*/
class PocketOrbit {
  constructor(cam, dom) {
    this.camera = cam;
    this.dom = dom;
    this.target = new THREE.Vector3();
    this.minDistance = 2;
    this.maxDistance = 10;
    this.sph = null;         // built lazily so target can be set first
    this.vTheta = 0; this.vPhi = 0; this.vZoom = 0;
    this.pointers = new Map();
    this.pinch = 0;
    dom.style.touchAction = "none";
    dom.addEventListener("pointerdown", e => {
      this.pointers.set(e.pointerId, [e.clientX, e.clientY]);
      dom.setPointerCapture(e.pointerId);
      if (this.pointers.size === 2) this.pinch = this.pinchDist();
    });
    dom.addEventListener("pointermove", e => {
      if (!this.pointers.has(e.pointerId)) return;
      const prev = this.pointers.get(e.pointerId);
      const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
      this.pointers.set(e.pointerId, [e.clientX, e.clientY]);
      if (this.pointers.size === 1) {
        this.vTheta = -dx * 0.006;
        this.vPhi = -dy * 0.006;
      } else if (this.pointers.size === 2) {
        const d = this.pinchDist();
        this.vZoom = (this.pinch - d) * 0.004;
        this.pinch = d;
      }
    });
    const drop = e => this.pointers.delete(e.pointerId);
    dom.addEventListener("pointerup", drop);
    dom.addEventListener("pointercancel", drop);
    dom.addEventListener("wheel", e => {
      e.preventDefault();
      this.vZoom = e.deltaY * 0.0015;
    }, { passive: false });
  }
  pinchDist() {
    const [a, b] = [...this.pointers.values()];
    return Math.hypot(a[0] - b[0], a[1] - b[1]);
  }
  update() {
    if (!this.sph) {
      this.sph = new THREE.Spherical().setFromVector3(
        this.camera.position.clone().sub(this.target)
      );
    }
    const s = this.sph;
    s.theta += this.vTheta;
    s.phi = Math.max(0.15, Math.min(Math.PI - 0.15, s.phi + this.vPhi));
    s.radius = Math.max(this.minDistance,
      Math.min(this.maxDistance, s.radius * (1 + this.vZoom)));
    this.vTheta *= 0.85; this.vPhi *= 0.85; this.vZoom *= 0.8;
    this.camera.position.setFromSpherical(s).add(this.target);
    this.camera.lookAt(this.target);
  }
}

const controls = new PocketOrbit(camera, renderer.domElement);
controls.target.set(0, 0.45, 0);

/*
  A pocket VRButton: only appears when immersive VR is really on offer.
  Headsets take over the camera; the paper birds are life-size-ish at
  arm's length, which is exactly the toy-theatre feeling wanted here.
*/
if (navigator.xr?.isSessionSupported) {
  navigator.xr.isSessionSupported("immersive-vr").then(supported => {
    if (!supported) return;
    const xrButton = document.createElement("button");
    xrButton.textContent = "ENTER VR";
    document.querySelector("#controls").appendChild(xrButton);
    let session = null;
    xrButton.addEventListener("click", async () => {
      if (session) { session.end(); return; }
      try {
        session = await navigator.xr.requestSession("immersive-vr",
          { optionalFeatures: ["local-floor"] });
      } catch { return; }
      session.addEventListener("end", () => {
        session = null;
        xrButton.textContent = "ENTER VR";
        xrButton.classList.remove("active");
      });
      await renderer.xr.setSession(session);
      xrButton.textContent = "EXIT VR";
      xrButton.classList.add("active");
    });
  }).catch(() => {});
}

let previousTime = performance.now();
let measuredFrames = 0;
let measuredDuration = 0;

const fpsElement = document.querySelector("#fps");

renderer.setAnimationLoop((currentTime) => {
  const delta = Math.min(
    0.04,
    (currentTime - previousTime) / 1000
  );

  previousTime = currentTime;

  const time = currentTime / 1000;

  controls.update();

  animateBird(blueTit, time, 0);
  animateBird(robin, time, 1);

  renderer.render(scene, camera);

  measuredFrames += 1;
  measuredDuration += delta;

  if (measuredDuration >= 0.5) {
    fpsElement.textContent =
      `${Math.round(measuredFrames / measuredDuration)} fps`;

    measuredFrames = 0;
    measuredDuration = 0;
  }
});

window.addEventListener("resize", () => {
  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});
</script>

</body>
</html>
