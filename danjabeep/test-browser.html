<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanjaBeep Browser Tests</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #e94560; }
        .test-result {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 4px;
            font-family: monospace;
        }
        .pass { background: rgba(46, 160, 67, 0.2); color: #7ee787; }
        .fail { background: rgba(248, 81, 73, 0.2); color: #f85149; }
        #summary {
            margin-top: 20px;
            padding: 16px;
            background: #16213e;
            border-radius: 8px;
            font-size: 1.2rem;
        }
        #run-btn {
            padding: 12px 24px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #run-btn:hover { background: #ff3355; }
    </style>
</head>
<body>
    <h1>DanjaBeep Browser Tests</h1>
    <p>WebBeep JavaScript Port - Browser Test Suite</p>
    <button id="run-btn">Run Tests</button>
    <div id="results"></div>
    <div id="summary"></div>

    <script type="module">
        import { Constants } from './constants.js';
        import { Maps } from './maps.js';
        import { WaveMaker } from './wavemaker.js';
        import { Goertzel } from './goertzel.js';
        import { Encoder } from './encoder.js';
        import { Decoder } from './decoder.js';

        // Export for Playwright
        window.Constants = Constants;
        window.Maps = Maps;
        window.WaveMaker = WaveMaker;
        window.Goertzel = Goertzel;
        window.Encoder = Encoder;
        window.Decoder = Decoder;

        let passed = 0;
        let failed = 0;
        const resultsDiv = document.getElementById('results');

        function logResult(name, success, error = null) {
            const div = document.createElement('div');
            div.className = `test-result ${success ? 'pass' : 'fail'}`;
            div.textContent = `${success ? '✓' : '✗'} ${name}`;
            if (error) div.textContent += ` - ${error}`;
            resultsDiv.appendChild(div);
            if (success) passed++; else failed++;
        }

        function test(name, fn) {
            try {
                fn();
                logResult(name, true);
            } catch (e) {
                logResult(name, false, e.message);
            }
        }

        function assert(condition, msg) {
            if (!condition) throw new Error(msg || 'Assertion failed');
        }

        function assertEquals(a, b, msg) {
            if (a !== b) throw new Error(msg || `Expected ${b}, got ${a}`);
        }

        async function runTests() {
            passed = 0;
            failed = 0;
            resultsDiv.innerHTML = '';

            // Constants tests
            test('Constants defined', () => {
                assert(typeof Constants.SAMPLE_RATE === 'number');
                assertEquals(Constants.SAMPLE_RATE, 22050);
            });

            // Maps tests
            test('Maps has correct frequency arrays', () => {
                assertEquals(Maps.LOW_FREQ.length, 8);
                assertEquals(Maps.HIGH_FREQ.length, 16);
            });

            test('Maps frequencies are pentatonic', () => {
                assert(Maps.LOW_FREQ[0] === 261.63, 'Should start with C4');
                assert(Maps.HIGH_FREQ[0] === 523.25, 'High should start with C5');
            });

            // WaveMaker tests
            test('WaveMaker makes silence', () => {
                const silence = WaveMaker.makeSilence(0.1);
                assert(silence.length > 0);
                assertEquals(silence[0], 0);
            });

            test('WaveMaker makes dual tone', () => {
                const tone = WaveMaker.makeDualTone(0, 0);
                assert(tone instanceof Float32Array);
                assert(tone.length > 0);
            });

            test('WaveMaker applies envelope', () => {
                const flat = new Float32Array(100).fill(1);
                const shaped = WaveMaker.applyEnvelope(flat);
                assert(shaped[0] < 0.5, 'Start should be faded');
            });

            // Goertzel tests
            test('Goertzel detects frequency', () => {
                const samples = new Float32Array(2048);
                for (let i = 0; i < samples.length; i++) {
                    samples[i] = Math.sin(2 * Math.PI * 440 * i / Constants.SAMPLE_RATE);
                }
                const mag = Goertzel.getMagnitude(samples, 440, Constants.SAMPLE_RATE);
                assert(mag > 0.1, 'Should detect 440 Hz');
            });

            test('Goertzel findPeak works', () => {
                const samples = new Float32Array(2048);
                for (let i = 0; i < samples.length; i++) {
                    samples[i] = Math.sin(2 * Math.PI * 880 * i / Constants.SAMPLE_RATE);
                }
                const result = Goertzel.findPeak(samples, [440, 880, 1320], Constants.SAMPLE_RATE);
                assertEquals(result.frequency, 880);
            });

            // Encoder tests
            test('Encoder calculates checksum', () => {
                const bytes = new Uint8Array([65, 66, 67]);
                const cs = Encoder.calculateChecksum(bytes);
                assert(cs >= 0 && cs <= 255);
            });

            test('Encoder verifies checksum', () => {
                const data = new Uint8Array([72, 101, 108, 108, 111]);
                const cs = Encoder.calculateChecksum(data);
                const withCs = new Uint8Array([...data, cs]);
                assert(Encoder.verifyChecksum(withCs));
            });

            test('Encoder encodes string', () => {
                const samples = Encoder.encode('test');
                assert(samples instanceof Float32Array);
                assert(samples.length > 0);
            });

            test('Encoder samples are normalized', () => {
                const samples = Encoder.encode('Hello');
                let max = 0;
                for (const s of samples) max = Math.max(max, Math.abs(s));
                assert(max <= 1.0, 'Should be normalized');
            });

            test('Encoder handles URL', () => {
                const samples = Encoder.encode('https://example.com');
                assert(samples.length > 0);
            });

            test('Encoder getStats works', () => {
                const stats = Encoder.getStats('test');
                assertEquals(stats.inputLength, 4);
                assert(stats.estimatedDurationMs > 0);
            });

            // WAV generation
            test('Encoder generates WAV blob', () => {
                const blob = Encoder.generateWav('Hi');
                assert(blob instanceof Blob);
                assert(blob.type === 'audio/wav');
                assert(blob.size > 44);
            });

            // Web Audio API tests
            if (typeof AudioContext !== 'undefined') {
                test('Encoder works with AudioContext', async () => {
                    const ctx = new AudioContext();
                    const buffer = Encoder.generateAudioBuffer('test', ctx);
                    assert(buffer instanceof AudioBuffer);
                    assert(buffer.length > 0);
                    await ctx.close();
                });
            }

            // Decoder tests
            test('Decoder normalizes samples', () => {
                const samples = new Float32Array([0.5, -0.5]);
                const norm = Decoder.normalize(samples);
                assertEquals(norm[0], 1.0);
            });

            test('Decoder decodes chunk', () => {
                const lowFreq = Maps.LOW_FREQ[0];
                const highFreq = Maps.HIGH_FREQ[0];
                const chunk = new Float32Array(1024);
                for (let i = 0; i < chunk.length; i++) {
                    const t = i / Constants.SAMPLE_RATE;
                    chunk[i] = (Math.sin(2 * Math.PI * lowFreq * t) +
                                Math.sin(2 * Math.PI * highFreq * t)) * 0.5;
                }
                const result = Decoder.decodeChunk(chunk, Constants.SAMPLE_RATE);
                assert(result.byte !== null, 'Should decode byte');
            });

            // Roundtrip test
            test('Single byte roundtrip', () => {
                const tone = Encoder.byteToDualTone(65);
                const result = Decoder.decodeChunk(tone, Constants.SAMPLE_RATE);
                assertEquals(result.byte, 65);
            });

            // Update summary
            document.getElementById('summary').textContent =
                `${passed} passed, ${failed} failed`;

            window.testResults = { passed, failed, total: passed + failed };
        }

        document.getElementById('run-btn').addEventListener('click', runTests);
        window.runTests = runTests;
    </script>
</body>
</html>
