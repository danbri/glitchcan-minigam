<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FINK Episode Rings</title>
    <style>
        :root {
            --accent: #4ecca3;
            --accent-dim: rgba(78, 204, 163, 0.3);
            --bg-dark: #0a0a12;
            --bg-mid: #1a1a2e;
            --text: #ccc;
            --text-dim: #666;
            --hub: #4ecca3;
            --entry: #ffc857;
            --exit: #e94560;
            --normal: #7b68ee;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-mid) 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* Header - compact on mobile */
        .header {
            padding: 12px 16px;
            text-align: center;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #fff;
        }
        .header .stats {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* Search bar */
        .search-container {
            padding: 0 16px 12px;
            flex-shrink: 0;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px; /* Prevents iOS zoom */
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            background: rgba(255,255,255,0.12);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .search-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        /* Controls - horizontal scroll on mobile */
        .controls {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .controls::-webkit-scrollbar { display: none; }
        .controls button {
            padding: 10px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-user-select: none;
            user-select: none;
        }
        .controls button:active {
            transform: scale(0.95);
        }
        .controls button.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* Main visualization area */
        .viz-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
            touch-action: none; /* Prevent all browser touch gestures */
            overscroll-behavior: contain;
        }
        .stack-container {
            position: absolute;
            inset: 0;
            perspective: 1000px;
            perspective-origin: 50% 40%;
            transform-style: preserve-3d;
        }

        /* Ring layers */
        .ring-layer {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(90vw, 500px);
            height: min(90vw, 500px);
            margin-left: calc(min(90vw, 500px) / -2);
            margin-top: calc(min(90vw, 500px) / -2);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            cursor: pointer;
            transform-style: preserve-3d;
        }
        .ring-layer svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .ring-layer.active {
            z-index: 100;
        }
        .ring-layer.dimmed {
            opacity: 0.25;
            pointer-events: none;
            filter: blur(4px);
        }

        /* Animated bokeh background for atmosphere */
        .bokeh-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.4;
        }
        .bokeh-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(20px);
            animation: bokeh-float 20s ease-in-out infinite;
        }
        .bokeh-orb:nth-child(1) {
            width: 120px; height: 120px;
            background: rgba(78, 204, 163, 0.3);
            top: 20%; left: 10%;
            animation-delay: 0s;
        }
        .bokeh-orb:nth-child(2) {
            width: 80px; height: 80px;
            background: rgba(123, 104, 238, 0.25);
            top: 60%; right: 15%;
            animation-delay: -5s;
        }
        .bokeh-orb:nth-child(3) {
            width: 150px; height: 150px;
            background: rgba(255, 200, 87, 0.2);
            bottom: 30%; left: 50%;
            animation-delay: -10s;
        }
        .bokeh-orb:nth-child(4) {
            width: 60px; height: 60px;
            background: rgba(244, 114, 182, 0.25);
            top: 40%; right: 30%;
            animation-delay: -15s;
        }
        @keyframes bokeh-float {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            25% { transform: translate(30px, -20px) scale(1.1); opacity: 0.5; }
            50% { transform: translate(-20px, 30px) scale(0.9); opacity: 0.4; }
            75% { transform: translate(10px, 10px) scale(1.05); opacity: 0.35; }
        }

        /* Episode label - large friendly letters with contrasting outlines */
        .episode-label {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.5s ease, color 0.3s, transform 0.3s;
            /* Contrasting outline using text-shadow */
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                -3px  0   0 #000,
                 3px  0   0 #000,
                 0   -3px 0 #000,
                 0    3px 0 #000,
                 0    0  8px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .ring-layer.active .episode-label {
            color: var(--accent);
            opacity: 1;
            transform: translateX(-50%) scale(1.1);
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                -3px  0   0 #000,
                 3px  0   0 #000,
                 0   -3px 0 #000,
                 0    3px 0 #000,
                 0    0  12px rgba(78, 204, 163, 0.6),
                 0    0  24px rgba(78, 204, 163, 0.3);
        }

        /* Arc segments */
        .arc {
            cursor: pointer;
            transition: opacity 0.3s, filter 0.3s, transform 0.2s;
            transform-origin: center;
        }
        .arc:active {
            transform: scale(1.08);
        }
        .arc.dimmed {
            opacity: 0.1;
        }
        .arc.selected {
            filter: brightness(1.4) drop-shadow(0 0 15px currentColor);
            animation: pulse-selected 1s ease-in-out infinite;
        }
        @keyframes pulse-selected {
            0%, 100% { filter: brightness(1.4) drop-shadow(0 0 15px currentColor); }
            50% { filter: brightness(1.6) drop-shadow(0 0 25px currentColor); }
        }
        .arc.connected {
            filter: brightness(1.2);
        }
        .arc.cross-highlight {
            filter: brightness(1.5) drop-shadow(0 0 20px var(--entry));
            animation: pulse-cross 0.6s ease-in-out infinite;
        }
        @keyframes pulse-cross {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Flow paths */
        .flow-path {
            fill: none;
            stroke-linecap: round;
            opacity: 0.6;
            stroke-width: 2px;
            stroke-dasharray: 6 4;
            animation: dash-flow 0.8s linear infinite;
        }
        @keyframes dash-flow {
            to { stroke-dashoffset: -10; }
        }
        .flow-path.dimmed {
            opacity: 0.05;
            animation: none;
        }
        .flow-path.active {
            opacity: 1;
            stroke-width: 3px;
        }

        /* Node labels in SVG */
        .node-label {
            font-size: 8px;
            fill: rgba(255,255,255,0.5);
            pointer-events: none;
            transition: all 0.2s;
        }
        .node-label.highlight {
            fill: rgba(255,255,255,0.8);
            font-weight: 600;
        }

        /* Tooltip - touch friendly */
        .tooltip {
            position: fixed;
            left: 50%;
            bottom: calc(80px + var(--safe-bottom));
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 16px 20px;
            max-width: calc(100vw - 32px);
            width: 320px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .tooltip.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .tooltip-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        .tooltip-type {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tooltip-type.hub { background: var(--hub); color: #000; }
        .tooltip-type.entry { background: var(--entry); color: #000; }
        .tooltip-type.exit { background: var(--exit); color: #fff; }
        .tooltip-type.normal { background: var(--normal); color: #fff; }
        .tooltip-body {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            line-height: 1.5;
        }
        .tooltip-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .tooltip-tag {
            font-size: 10px;
            padding: 3px 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            color: rgba(255,255,255,0.6);
        }
        .tooltip-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cross-episode beam */
        .cross-beam {
            position: absolute;
            left: 50%;
            width: 4px;
            margin-left: -2px;
            background: linear-gradient(180deg,
                transparent 0%,
                var(--entry) 20%,
                var(--entry) 80%,
                transparent 100%
            );
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            filter: blur(2px);
            box-shadow: 0 0 20px var(--entry), 0 0 40px var(--entry);
        }
        .cross-beam.visible {
            opacity: 0.8;
            animation: beam-pulse 1s ease-in-out infinite;
        }
        @keyframes beam-pulse {
            0%, 100% { opacity: 0.8; filter: blur(2px); }
            50% { opacity: 1; filter: blur(4px); }
        }

        /* Bottom nav / legend */
        .bottom-bar {
            padding: 12px 16px;
            padding-bottom: calc(12px + var(--safe-bottom));
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-dim);
        }
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .legend-dot.hub { background: var(--hub); }
        .legend-dot.entry { background: var(--entry); }
        .legend-dot.exit { background: var(--exit); }
        .legend-dot.normal { background: var(--normal); }

        /* Search results dropdown */
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(20, 20, 35, 0.98);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            margin-top: 8px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 100;
        }
        .search-results.visible {
            display: block;
        }
        .search-result {
            padding: 14px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.15s;
        }
        .search-result:last-child {
            border-bottom: none;
        }
        .search-result:active {
            background: rgba(255,255,255,0.1);
        }
        .search-result-title {
            font-size: 14px;
            color: #fff;
            font-weight: 500;
        }
        .search-result-episode {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        /* Swipe hint */
        .swipe-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--text-dim);
            opacity: 0.7;
            pointer-events: none;
            animation: fade-hint 3s ease-out forwards;
        }
        @keyframes fade-hint {
            0%, 80% { opacity: 0.7; }
            100% { opacity: 0; }
        }

        /* Keyboard focus indicator */
        .arc:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Desktop enhancements */
        @media (min-width: 768px) {
            .header h1 { font-size: 24px; }
            .search-input { max-width: 400px; margin: 0 auto; display: block; }
            .controls { justify-content: center; }
            .ring-layer {
                width: 550px;
                height: 550px;
                margin-left: -275px;
                margin-top: -275px;
            }
            .tooltip {
                bottom: 100px;
                width: 380px;
            }
            .node-label { font-size: 9px; }
        }

        @media (min-width: 1024px) {
            .ring-layer {
                width: 600px;
                height: 600px;
                margin-left: -300px;
                margin-top: -300px;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>FINK RINGS</h1>
        <div class="stats" id="stats">Loading...</div>
    </div>

    <div class="search-container" style="position: relative;">
        <input type="text" class="search-input" id="search" placeholder="🔍 Search knots..." autocomplete="off" autocorrect="off" autocapitalize="off">
        <div class="search-results" id="search-results"></div>
    </div>

    <div class="controls">
        <button id="btn-stack" class="active">Stack</button>
        <button id="btn-flat">Grid</button>
        <button id="btn-focus">Focus</button>
        <button id="btn-prev">◀</button>
        <button id="btn-next">▶</button>
    </div>

    <div class="viz-container">
        <div class="bokeh-layer" id="bokeh-layer">
            <div class="bokeh-orb"></div>
            <div class="bokeh-orb"></div>
            <div class="bokeh-orb"></div>
            <div class="bokeh-orb"></div>
        </div>
        <div class="stack-container" id="stack-container"></div>
        <div class="cross-beam" id="cross-beam"></div>
        <div class="swipe-hint" id="swipe-hint">Drag to spin • Flick for momentum • Pinch to focus</div>
    </div>

    <div class="tooltip" id="tooltip">
        <button class="tooltip-close" id="tooltip-close">×</button>
        <div class="tooltip-header">
            <span class="tooltip-title" id="tooltip-title">Knot Name</span>
            <span class="tooltip-type" id="tooltip-type">Hub</span>
        </div>
        <div class="tooltip-body" id="tooltip-body">
            Connections: 5 in, 3 out
        </div>
        <div class="tooltip-tags" id="tooltip-tags"></div>
    </div>

    <div class="bottom-bar">
        <div class="legend-item"><div class="legend-dot hub"></div> Hub</div>
        <div class="legend-item"><div class="legend-dot entry"></div> Entry</div>
        <div class="legend-item"><div class="legend-dot exit"></div> Exit</div>
        <div class="legend-item"><div class="legend-dot normal"></div> Node</div>
    </div>

    <script>
    // State
    const episodes = {};
    let activeEpisode = null;
    let selectedNode = null;
    let viewMode = 'stack';
    let idleTimer = null;
    let idleRotation = 0;

    // Carousel physics state
    let scrollPosition = 0;      // Continuous position (0 = first episode)
    let scrollVelocity = 0;      // Current velocity
    let isDragging = false;

    // Pinch gesture state
    let isPinching = false;
    let initialPinchDistance = 0;
    let pinchStartViewMode = null;
    let dragStartY = 0;
    let dragStartPosition = 0;
    let lastDragY = 0;
    let lastDragTime = 0;
    let momentumRAF = null;

    // Physics constants
    const DRAG_SENSITIVITY = 0.008;  // How much drag moves the carousel
    const FRICTION = 0.92;           // Velocity decay per frame
    const SNAP_STRENGTH = 0.15;      // How strongly it snaps to nearest
    const MIN_VELOCITY = 0.001;      // Stop threshold
    const VELOCITY_SCALE = 0.3;      // Scale touch velocity to scroll velocity

    const colorPalette = [
        '#4ecca3', '#7b68ee', '#f472b6', '#60a5fa', '#fbbf24',
        '#a78bfa', '#34d399', '#fb7185', '#38bdf8', '#facc15'
    ];

    const flowColors = {
        mainLoop: { stroke: "#4ecca3", glow: "#4ecca3" },
        external: { stroke: "#ffc857", glow: "#ffd700" },
        linear: { stroke: "#a78bfa", glow: "#c4b5fd" },
        ending: { stroke: "#f472b6", glow: "#ec4899" }
    };

    const crossEpisodePatterns = {
        'pool_bagend': 'bagend',
        'pool_mines': 'mudslidemines',
        'pool_manor': 'shane-manor',
        'pool_maple': 'maple-hollow',
        'pool_riverbend': 'riverbend',
        'world_between_worlds': null
    };

    // Load data
    async function loadData() {
        try {
            const response = await fetch('./fink-crawl-report.json');
            const data = await response.json();

            let colorIndex = 0;
            for (const file of data.files) {
                const basename = file.file.split('/').pop().replace('.fink.js', '');
                if (!file.graph || Object.keys(file.graph).length === 0) continue;

                const displayName = basename.replace(/-/g, ' ').replace(/tml-2025-/, '').toUpperCase();

                episodes[basename] = {
                    name: displayName,
                    color: colorPalette[colorIndex++ % colorPalette.length],
                    nodes: {},
                    edges: [],
                    nodeOrder: [],
                    externalEntries: new Set(file.islands || []),
                    exits: new Set(),
                    exitsTo: {},
                    entriesFrom: {}
                };

                for (const [knot, knotData] of Object.entries(file.graph)) {
                    episodes[basename].nodes[knot] = knotData;
                    if (!episodes[basename].nodeOrder.includes(knot)) {
                        episodes[basename].nodeOrder.push(knot);
                    }

                    for (const target of knotData.targets) {
                        const choiceDetail = knotData.choiceDetails?.find(c =>
                            target.toLowerCase().includes(c.text?.toLowerCase().replace(/\s+/g, '_').substring(0, 10) || '')
                        );
                        episodes[basename].edges.push({
                            from: knot,
                            to: target,
                            repeatable: choiceDetail?.repeatable ?? true,
                            sticky: choiceDetail?.sticky ?? false,
                            text: choiceDetail?.text || ''
                        });
                        if (!episodes[basename].nodeOrder.includes(target)) {
                            episodes[basename].nodeOrder.push(target);
                        }
                    }

                    if (knotData.targets.length === 0) {
                        episodes[basename].exits.add(knot);
                    }

                    if (crossEpisodePatterns[knot]) {
                        episodes[basename].exitsTo[knot] = crossEpisodePatterns[knot];
                    }
                    if (knot === 'world_between_worlds') {
                        episodes[basename].entriesFrom[knot] = Object.values(crossEpisodePatterns).filter(Boolean);
                    }
                }
            }

            const keys = Object.keys(episodes);
            activeEpisode = keys.includes('hampstead') ? 'hampstead' : keys[0];
            // Initialize scroll position to match active episode
            scrollPosition = keys.indexOf(activeEpisode);

            const totalKnots = Object.values(episodes).reduce((s, e) => s + e.nodeOrder.length, 0);
            document.getElementById('stats').textContent = `${keys.length} episodes • ${totalKnots} knots`;

            renderStack();
            parseHash();
            startIdleAnimation();
        } catch (err) {
            console.error('Failed to load:', err);
            document.getElementById('stats').textContent = 'Failed to load data';
        }
    }

    // Create ring SVG
    function createRingSVG(episodeKey, size = 500) {
        const episode = episodes[episodeKey];
        if (!episode?.nodeOrder.length) return null;

        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", `0 0 ${size} ${size}`);

        const cx = size / 2, cy = size / 2;
        const outerR = size * 0.42;
        const innerR = size * 0.34;

        // Defs
        const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
        Object.entries(flowColors).forEach(([type, colors]) => {
            const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
            marker.setAttribute("id", `arrow-${episodeKey}-${type}`);
            marker.setAttribute("viewBox", "0 0 10 10");
            marker.setAttribute("refX", "9");
            marker.setAttribute("refY", "5");
            marker.setAttribute("markerWidth", "5");
            marker.setAttribute("markerHeight", "5");
            marker.setAttribute("orient", "auto");
            marker.innerHTML = `<path d="M 0 0 L 10 5 L 0 10 L 3 5 z" fill="${colors.glow}"/>`;
            defs.appendChild(marker);
        });
        svg.appendChild(defs);

        // Calculate connectivity
        const conn = {};
        episode.edges.forEach(({from, to}) => {
            conn[from] = (conn[from] || 0) + 1;
            conn[to] = (conn[to] || 0) + 1;
        });

        const isHub = n => (conn[n] || 0) >= 6;

        // Calculate arcs
        const nodes = episode.nodeOrder;
        const totalWeight = nodes.reduce((s, n) => s + Math.max(2, conn[n] || 2), 0);
        const padding = 0.02;
        let angle = -Math.PI / 2;

        const arcs = nodes.map(node => {
            const w = Math.max(2, conn[node] || 2);
            const len = (w / totalWeight) * (2 * Math.PI - padding * nodes.length);
            const start = angle;
            const end = angle + len;
            angle = end + padding;
            return { node, start, end, mid: (start + end) / 2 };
        });

        const nodeIdx = {};
        arcs.forEach((a, i) => nodeIdx[a.node] = i);

        const toCart = (a, r) => ({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });

        // Flow paths
        const flowG = document.createElementNS("http://www.w3.org/2000/svg", "g");
        episode.edges.forEach(({from, to, sticky}) => {
            const fa = arcs[nodeIdx[from]], ta = arcs[nodeIdx[to]];
            if (!fa || !ta || from === to) return;

            let type = "linear";
            if (episode.externalEntries.has(from)) type = "external";
            else if (episode.exits.has(to)) type = "ending";
            else if (episode.edges.some(e => e.from === to && e.to === from)) type = "mainLoop";

            const p1 = toCart(fa.mid, innerR - 5);
            const p2 = toCart(ta.mid, innerR - 5);
            const ctrl = toCart((fa.mid + ta.mid) / 2, innerR * 0.25);

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M ${p1.x} ${p1.y} Q ${ctrl.x} ${ctrl.y} ${p2.x} ${p2.y}`);
            path.setAttribute("stroke", flowColors[type].glow);
            path.setAttribute("marker-end", `url(#arrow-${episodeKey}-${type})`);
            path.classList.add("flow-path");
            if (sticky) path.style.strokeDasharray = "2 6"; // Different pattern for sticky
            path.dataset.from = from;
            path.dataset.to = to;
            flowG.appendChild(path);
        });
        svg.appendChild(flowG);

        // Arcs
        const arcG = document.createElementNS("http://www.w3.org/2000/svg", "g");
        arcs.forEach(({ node, start, end, mid }) => {
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.classList.add("arc");
            g.dataset.node = node;
            g.dataset.episode = episodeKey;
            g.setAttribute("tabindex", "0");
            g.setAttribute("role", "button");
            g.setAttribute("aria-label", node.replace(/_/g, ' '));

            let color = "#7b68ee";
            if (episode.exits.has(node)) color = "#e94560";
            else if (episode.externalEntries.has(node)) color = "#ffc857";
            else if (isHub(node)) color = episode.color;

            const so = toCart(start, outerR), eo = toCart(end, outerR);
            const si = toCart(start, innerR), ei = toCart(end, innerR);
            const large = end - start > Math.PI ? 1 : 0;

            const arcPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
            arcPath.setAttribute("d", `
                M ${so.x} ${so.y}
                A ${outerR} ${outerR} 0 ${large} 1 ${eo.x} ${eo.y}
                L ${ei.x} ${ei.y}
                A ${innerR} ${innerR} 0 ${large} 0 ${si.x} ${si.y}
                Z
            `);
            arcPath.setAttribute("fill", color);
            g.appendChild(arcPath);

            // Label
            const lp = toCart(mid, outerR + 12);
            const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label.setAttribute("x", lp.x);
            label.setAttribute("y", lp.y);
            label.classList.add("node-label");
            if (isHub(node) || episode.externalEntries.has(node)) label.classList.add("highlight");

            let rot = (mid * 180 / Math.PI) + 90;
            if (mid > Math.PI / 2 && mid < 3 * Math.PI / 2) {
                rot += 180;
                label.setAttribute("text-anchor", "end");
            } else {
                label.setAttribute("text-anchor", "start");
            }
            label.setAttribute("transform", `rotate(${rot}, ${lp.x}, ${lp.y})`);
            label.setAttribute("dominant-baseline", "middle");
            label.textContent = node.replace(/_/g, " ").substring(0, 12);
            g.appendChild(label);

            // Events
            const handleSelect = (e) => {
                e.stopPropagation();
                handleNodeClick(episodeKey, node);
            };
            g.addEventListener("click", handleSelect);
            g.addEventListener("touchend", handleSelect);
            g.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") handleSelect(e);
            });

            arcG.appendChild(g);
        });
        svg.appendChild(arcG);

        // Center text
        const center = document.createElementNS("http://www.w3.org/2000/svg", "text");
        center.setAttribute("x", cx);
        center.setAttribute("y", cy);
        center.setAttribute("text-anchor", "middle");
        center.setAttribute("dominant-baseline", "middle");
        center.setAttribute("fill", episode.color);
        center.setAttribute("font-size", "11");
        center.setAttribute("font-weight", "600");
        center.setAttribute("letter-spacing", "0.08em");
        center.textContent = episode.name;
        svg.appendChild(center);

        return svg;
    }

    function renderStack() {
        const container = document.getElementById('stack-container');
        container.innerHTML = '';

        Object.keys(episodes).filter(k => episodes[k].nodeOrder?.length).forEach((key, i) => {
            const layer = document.createElement('div');
            layer.className = 'ring-layer';
            layer.dataset.episode = key;
            layer.dataset.index = i;

            const svg = createRingSVG(key);
            if (svg) layer.appendChild(svg);

            const label = document.createElement('div');
            label.className = 'episode-label';
            label.textContent = episodes[key].name;
            layer.appendChild(label);

            container.appendChild(layer);
        });

        updateLayout();
    }

    function updateLayout(useScrollPosition = false) {
        const layers = document.querySelectorAll('.ring-layer');
        const keys = Array.from(layers).map(l => l.dataset.episode);
        const activeIdx = keys.indexOf(activeEpisode);

        // Use continuous scroll position for smooth animation, or snap to active
        const centerPos = useScrollPosition ? scrollPosition : activeIdx;

        layers.forEach((layer, i) => {
            const isActive = layer.dataset.episode === activeEpisode;
            // Continuous distance from center for smooth scrolling
            const dist = i - centerPos;
            const absDist = Math.abs(dist);

            layer.classList.toggle('active', isActive && !isDragging);
            layer.classList.toggle('dimmed', !isActive && viewMode === 'focus');

            if (viewMode === 'stack') {
                // Smooth continuous positioning - symmetric cylinder
                const y = dist * 55;
                const z = -absDist * 50 - (absDist * absDist * 5); // Quadratic depth for drama
                const scale = Math.max(0.5, 1 - absDist * 0.12);
                const op = Math.max(0.2, 1 - absDist * 0.2);

                layer.style.transform = `
                    translateY(${y}px)
                    translateZ(${z}px)
                    rotateX(60deg)
                    scale(${scale})
                `;
                layer.style.opacity = op;
                // Z-index based on distance from center
                layer.style.zIndex = Math.round(100 - absDist * 10);
            } else if (viewMode === 'flat') {
                const cols = Math.min(3, keys.length);
                const row = Math.floor(i / cols);
                const col = i % cols;
                const gap = 10;
                const w = (100 - gap * (cols + 1)) / cols;
                const h = 33;

                layer.style.transform = `
                    translateX(${col * (w + gap) + gap - 50 + w/2}vw)
                    translateY(${row * (h + gap) - 50 + h/2}vh)
                    rotateX(0deg)
                    rotateY(0deg)
                    scale(0.45)
                `;
                layer.style.opacity = 1;
                layer.style.zIndex = isActive ? 100 : 50;
            } else if (viewMode === 'focus') {
                layer.style.transform = isActive
                    ? 'translateY(0) translateZ(0) rotateX(0deg) rotateY(0deg) scale(0.9)'
                    : 'translateY(0) translateZ(-100px) rotateX(0deg) rotateY(0deg) scale(0.6)';
                layer.style.opacity = isActive ? 1 : 0.15;
                layer.style.zIndex = isActive ? 100 : 10;
            }
        });

        if (!useScrollPosition) {
            updateHash();
        }
    }

    function handleNodeClick(episodeKey, node) {
        resetIdleTimer();

        if (activeEpisode !== episodeKey) {
            activeEpisode = episodeKey;
            updateLayout();
        }

        if (selectedNode === node) {
            closeTooltip();
            clearSelection();
            selectedNode = null;
        } else {
            selectedNode = node;
            highlightNode(episodeKey, node);
            showTooltip(episodeKey, node);
        }
    }

    function clearSelection() {
        document.querySelectorAll('.arc').forEach(el => {
            el.classList.remove('dimmed', 'selected', 'connected', 'cross-highlight');
        });
        document.querySelectorAll('.flow-path').forEach(el => {
            el.classList.remove('dimmed', 'active');
        });
        document.getElementById('cross-beam').classList.remove('visible');
    }

    function highlightNode(episodeKey, node) {
        clearSelection();

        const ep = episodes[episodeKey];
        const connected = new Set([node]);
        ep.edges.forEach(({from, to}) => {
            if (from === node || to === node) {
                connected.add(from);
                connected.add(to);
            }
        });

        // Staggered animation
        const arcs = document.querySelectorAll(`.ring-layer[data-episode="${episodeKey}"] .arc`);
        arcs.forEach((el, i) => {
            el.style.transitionDelay = `${i * 12}ms`;
            const n = el.dataset.node;
            if (n === node) el.classList.add('selected');
            else if (connected.has(n)) el.classList.add('connected');
            else el.classList.add('dimmed');
        });
        setTimeout(() => arcs.forEach(el => el.style.transitionDelay = '0ms'), arcs.length * 12 + 300);

        // Flows
        document.querySelectorAll(`.ring-layer[data-episode="${episodeKey}"] .flow-path`).forEach(el => {
            if (el.dataset.from === node || el.dataset.to === node) el.classList.add('active');
            else el.classList.add('dimmed');
        });

        // Cross-episode beam
        if (ep.exitsTo[node]) {
            showCrossBeam(episodeKey, ep.exitsTo[node]);
        }
    }

    function showCrossBeam(fromEp, toEp) {
        const layers = Array.from(document.querySelectorAll('.ring-layer'));
        const fromLayer = layers.find(l => l.dataset.episode === fromEp);
        const toLayer = layers.find(l => l.dataset.episode === toEp);

        if (!fromLayer || !toLayer) return;

        const fromIdx = parseInt(fromLayer.dataset.index);
        const toIdx = parseInt(toLayer.dataset.index);

        // Highlight target
        document.querySelectorAll(`.ring-layer[data-episode="${toEp}"] .arc`).forEach(el => {
            if (el.dataset.node.startsWith('pool_') || el.dataset.node === 'world_between_worlds' ||
                episodes[toEp].externalEntries.has(el.dataset.node)) {
                el.classList.add('cross-highlight');
            }
        });

        // Show beam
        const beam = document.getElementById('cross-beam');
        const container = document.querySelector('.stack-container');
        const rect = container.getBoundingClientRect();

        const startY = rect.height / 2 + (fromIdx - layers.findIndex(l => l.dataset.episode === activeEpisode)) * 50;
        const endY = rect.height / 2 + (toIdx - layers.findIndex(l => l.dataset.episode === activeEpisode)) * 50;

        beam.style.top = Math.min(startY, endY) + 'px';
        beam.style.height = Math.abs(endY - startY) + 'px';
        beam.classList.add('visible');
    }

    function showTooltip(episodeKey, node) {
        const ep = episodes[episodeKey];
        const nodeData = ep.nodes[node] || {};

        const tooltip = document.getElementById('tooltip');
        const title = document.getElementById('tooltip-title');
        const type = document.getElementById('tooltip-type');
        const body = document.getElementById('tooltip-body');
        const tags = document.getElementById('tooltip-tags');

        title.textContent = node.replace(/_/g, ' ');

        // Determine type
        const conn = {};
        ep.edges.forEach(({from, to}) => {
            conn[from] = (conn[from] || 0) + 1;
            conn[to] = (conn[to] || 0) + 1;
        });

        let typeName = 'normal', typeClass = 'normal';
        if (ep.exits.has(node)) { typeName = 'Exit'; typeClass = 'exit'; }
        else if (ep.externalEntries.has(node)) { typeName = 'Entry'; typeClass = 'entry'; }
        else if ((conn[node] || 0) >= 6) { typeName = 'Hub'; typeClass = 'hub'; }

        type.textContent = typeName;
        type.className = 'tooltip-type ' + typeClass;

        // Body
        const inCount = ep.edges.filter(e => e.to === node).length;
        const outCount = ep.edges.filter(e => e.from === node).length;
        const choices = nodeData.choiceDetails || [];

        let bodyText = `${inCount} incoming • ${outCount} outgoing`;
        if (choices.length) {
            bodyText += `\n${choices.length} choices`;
            const stickyCount = choices.filter(c => c.sticky).length;
            if (stickyCount) bodyText += ` (${stickyCount} one-time)`;
        }
        body.textContent = bodyText;

        // Tags
        tags.innerHTML = '';
        (nodeData.tags || []).forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tooltip-tag';
            span.textContent = `${tag.type}: ${tag.value.substring(0, 20)}`;
            tags.appendChild(span);
        });

        if (ep.exitsTo[node]) {
            const span = document.createElement('span');
            span.className = 'tooltip-tag';
            span.textContent = `→ ${ep.exitsTo[node]}`;
            span.style.background = 'rgba(255, 200, 87, 0.2)';
            span.style.color = '#ffc857';
            tags.appendChild(span);
        }

        tooltip.classList.add('visible');
    }

    function closeTooltip() {
        document.getElementById('tooltip').classList.remove('visible');
    }

    // Navigation
    function navigateEpisode(delta) {
        const keys = Object.keys(episodes);
        const idx = keys.indexOf(activeEpisode);
        const newIdx = Math.max(0, Math.min(keys.length - 1, idx + delta));

        // Use momentum physics for smooth navigation
        scrollVelocity = delta * 0.8; // Give it a push
        if (!momentumRAF) {
            startMomentum();
        }

        clearSelection();
        closeTooltip();
        selectedNode = null;
        resetIdleTimer();
    }

    // Search
    const searchInput = document.getElementById('search');
    const searchResults = document.getElementById('search-results');

    searchInput.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        searchResults.innerHTML = '';

        if (q.length < 2) {
            searchResults.classList.remove('visible');
            return;
        }

        const results = [];
        Object.entries(episodes).forEach(([epKey, ep]) => {
            ep.nodeOrder.forEach(node => {
                if (node.toLowerCase().includes(q)) {
                    results.push({ node, episode: epKey, name: ep.name });
                }
            });
        });

        if (results.length === 0) {
            searchResults.classList.remove('visible');
            return;
        }

        results.slice(0, 10).forEach(r => {
            const div = document.createElement('div');
            div.className = 'search-result';
            div.innerHTML = `
                <div class="search-result-title">${r.node.replace(/_/g, ' ')}</div>
                <div class="search-result-episode">${r.name}</div>
            `;
            div.addEventListener('click', () => {
                activeEpisode = r.episode;
                updateLayout();
                setTimeout(() => handleNodeClick(r.episode, r.node), 300);
                searchInput.value = '';
                searchResults.classList.remove('visible');
                searchInput.blur();
            });
            searchResults.appendChild(div);
        });

        searchResults.classList.add('visible');
    });

    searchInput.addEventListener('blur', () => {
        setTimeout(() => searchResults.classList.remove('visible'), 200);
    });

    // URL hash state
    function updateHash() {
        const hash = selectedNode
            ? `#${activeEpisode}/${selectedNode}`
            : `#${activeEpisode}`;
        if (location.hash !== hash) {
            history.replaceState(null, '', hash);
        }
    }

    function parseHash() {
        const hash = location.hash.slice(1);
        if (!hash) return;

        const [ep, node] = hash.split('/');
        if (episodes[ep]) {
            activeEpisode = ep;
            const keys = Object.keys(episodes);
            scrollPosition = keys.indexOf(ep);
            updateLayout();
            if (node && episodes[ep].nodeOrder.includes(node)) {
                setTimeout(() => handleNodeClick(ep, node), 400);
            }
        }
    }

    window.addEventListener('hashchange', parseHash);

    // Idle animation
    function startIdleAnimation() {
        resetIdleTimer();
    }

    function resetIdleTimer() {
        if (idleTimer) clearInterval(idleTimer);
        idleRotation = 0;

        // Start subtle rotation after 10s idle
        idleTimer = setInterval(() => {
            if (viewMode !== 'stack') return;
            idleRotation += 0.3;
            const container = document.getElementById('stack-container');
            container.style.transform = `rotateY(${Math.sin(idleRotation * 0.02) * 8}deg)`;
        }, 50);
    }

    // Momentum carousel physics
    const vizContainer = document.querySelector('.viz-container');

    function startDrag(clientY) {
        if (viewMode !== 'stack') return;

        isDragging = true;
        dragStartY = clientY;
        dragStartPosition = scrollPosition;
        lastDragY = clientY;
        lastDragTime = performance.now();
        scrollVelocity = 0;

        // Stop any ongoing momentum
        if (momentumRAF) {
            cancelAnimationFrame(momentumRAF);
            momentumRAF = null;
        }

        // Stop idle animation completely during drag
        if (idleTimer) {
            clearInterval(idleTimer);
            idleTimer = null;
        }
        // Reset container rotation to neutral
        const container = document.getElementById('stack-container');
        container.style.transform = '';
        idleRotation = 0;

        // Disable CSS transitions during drag for 60fps
        document.querySelectorAll('.ring-layer').forEach(l => {
            l.style.transition = 'none';
        });
    }

    function updateDrag(clientY) {
        if (!isDragging || viewMode !== 'stack') return;

        const now = performance.now();
        const deltaY = lastDragY - clientY;
        const deltaTime = now - lastDragTime;

        // Calculate velocity (pixels per ms)
        if (deltaTime > 0) {
            const instantVelocity = deltaY / deltaTime;
            // Smooth velocity with exponential moving average
            scrollVelocity = scrollVelocity * 0.7 + instantVelocity * VELOCITY_SCALE * 0.3;
        }

        // Update position
        const totalDelta = dragStartY - clientY;
        const keys = Object.keys(episodes);
        scrollPosition = dragStartPosition + totalDelta * DRAG_SENSITIVITY;

        // Rubber band at edges
        if (scrollPosition < 0) {
            scrollPosition = scrollPosition * 0.3;
        } else if (scrollPosition > keys.length - 1) {
            scrollPosition = keys.length - 1 + (scrollPosition - (keys.length - 1)) * 0.3;
        }

        lastDragY = clientY;
        lastDragTime = now;

        updateLayout(true);
    }

    function endDrag() {
        if (!isDragging) return;
        isDragging = false;

        // Re-enable CSS transitions
        document.querySelectorAll('.ring-layer').forEach(l => {
            l.style.transition = '';
        });

        // Start momentum animation
        startMomentum();
    }

    function startMomentum() {
        const keys = Object.keys(episodes);
        const maxPos = keys.length - 1;

        function animate() {
            // Apply friction
            scrollVelocity *= FRICTION;

            // Calculate target (nearest integer position)
            const target = Math.round(scrollPosition);

            // Add snap force toward target
            const snapForce = (target - scrollPosition) * SNAP_STRENGTH;
            scrollVelocity += snapForce * 0.1;

            // Update position
            scrollPosition += scrollVelocity;

            // Hard clamp at edges with bounce
            if (scrollPosition < 0) {
                scrollPosition = 0;
                scrollVelocity = Math.abs(scrollVelocity) * 0.3;
            } else if (scrollPosition > maxPos) {
                scrollPosition = maxPos;
                scrollVelocity = -Math.abs(scrollVelocity) * 0.3;
            }

            updateLayout(true);

            // Check if we should stop
            const atRest = Math.abs(scrollVelocity) < MIN_VELOCITY &&
                          Math.abs(scrollPosition - target) < 0.01;

            if (atRest) {
                // Snap to final position
                scrollPosition = target;
                activeEpisode = keys[Math.max(0, Math.min(maxPos, target))];
                updateLayout(false);
                momentumRAF = null;
                // Restart idle animation after settling
                startIdleAnimation();
            } else {
                momentumRAF = requestAnimationFrame(animate);
            }
        }

        momentumRAF = requestAnimationFrame(animate);
    }

    // Pinch gesture helpers
    function getPinchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function switchViewMode(newMode) {
        viewMode = newMode;
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + (newMode === 'flat' ? 'flat' : newMode)).classList.add('active');
        updateLayout();
    }

    // Touch events - handle both scroll and pinch gestures
    vizContainer.addEventListener('touchstart', (e) => {
        if (e.target.closest('.arc')) return; // Don't interfere with node taps

        if (e.touches.length === 2) {
            // Start pinch gesture
            isPinching = true;
            isDragging = false;
            initialPinchDistance = getPinchDistance(e.touches);
            pinchStartViewMode = viewMode;
        } else if (e.touches.length === 1) {
            startDrag(e.touches[0].clientY);
        }
    }, { passive: true });

    vizContainer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && isPinching) {
            e.preventDefault();
            const currentDistance = getPinchDistance(e.touches);
            const pinchRatio = currentDistance / initialPinchDistance;

            // Pinch out (spread) = Stack view, Pinch in = Focus view
            if (pinchRatio > 1.3 && viewMode !== 'stack') {
                switchViewMode('stack');
                isPinching = false; // Done with gesture
            } else if (pinchRatio < 0.7 && viewMode !== 'focus') {
                switchViewMode('focus');
                isPinching = false; // Done with gesture
            }
        } else if (isDragging && e.touches.length === 1) {
            e.preventDefault(); // Stop browser scroll
            updateDrag(e.touches[0].clientY);
        }
    }, { passive: false });

    vizContainer.addEventListener('touchend', (e) => {
        if (isPinching && e.touches.length < 2) {
            isPinching = false;
            initialPinchDistance = 0;
        }
        if (e.touches.length === 0) {
            endDrag();
        }
    }, { passive: true });

    vizContainer.addEventListener('touchcancel', () => {
        isPinching = false;
        endDrag();
    }, { passive: true });

    // Mouse events for desktop
    vizContainer.addEventListener('mousedown', (e) => {
        if (e.target.closest('.arc')) return;
        startDrag(e.clientY);
        e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
        if (isDragging) {
            updateDrag(e.clientY);
        }
    });

    document.addEventListener('mouseup', endDrag);

    // Wheel support
    vizContainer.addEventListener('wheel', (e) => {
        if (viewMode !== 'stack') return;
        e.preventDefault();

        scrollVelocity += e.deltaY * 0.002;

        if (!momentumRAF) {
            startMomentum();
        }

        resetIdleTimer();
    }, { passive: false });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        resetIdleTimer();

        if (e.target === searchInput) return;

        switch(e.key) {
            case 'ArrowUp':
            case 'ArrowLeft':
                e.preventDefault();
                navigateEpisode(-1);
                break;
            case 'ArrowDown':
            case 'ArrowRight':
                e.preventDefault();
                navigateEpisode(1);
                break;
            case 'Escape':
                clearSelection();
                closeTooltip();
                selectedNode = null;
                break;
            case '/':
                e.preventDefault();
                searchInput.focus();
                break;
        }
    });

    // Button events
    document.getElementById('btn-stack').addEventListener('click', () => {
        viewMode = 'stack';
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-stack').classList.add('active');
        updateLayout();
    });

    document.getElementById('btn-flat').addEventListener('click', () => {
        viewMode = 'flat';
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-flat').classList.add('active');
        updateLayout();
    });

    document.getElementById('btn-focus').addEventListener('click', () => {
        viewMode = 'focus';
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-focus').classList.add('active');
        updateLayout();
    });

    document.getElementById('btn-prev').addEventListener('click', () => navigateEpisode(-1));
    document.getElementById('btn-next').addEventListener('click', () => navigateEpisode(1));

    document.getElementById('tooltip-close').addEventListener('click', () => {
        closeTooltip();
        clearSelection();
        selectedNode = null;
    });

    document.getElementById('stack-container').addEventListener('click', (e) => {
        const layer = e.target.closest('.ring-layer');
        if (layer && !e.target.closest('.arc')) {
            activeEpisode = layer.dataset.episode;
            clearSelection();
            closeTooltip();
            selectedNode = null;
            updateLayout();
        }
    });

    // Hide swipe hint after first interaction
    vizContainer.addEventListener('touchstart', () => {
        document.getElementById('swipe-hint').style.display = 'none';
    }, { once: true });

    // Initialize
    loadData();
    </script>
</body>
</html>
