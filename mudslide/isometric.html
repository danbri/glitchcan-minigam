<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Mudslide Manor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
        body { background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, sans-serif; position: fixed; inset: 0; touch-action: none; }
        #game-container { width: 100%; height: 100%; position: relative; touch-action: none; }
        canvas { display: block; touch-action: none; }

        #ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; padding: max(12px, env(safe-area-inset-top)) 12px; }
        #top-bar { display: flex; justify-content: space-between; align-items: center; }
        #lives { font-size: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        #room-name { color: #fff; font-size: 16px; font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        #gems { color: #0ff; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #0ff; }

        #items-bar { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
        .item-slot { width: 44px; height: 44px; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; backdrop-filter: blur(8px); }

        #hint { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-size: 14px; text-align: center; transition: opacity 0.5s; }
        #hint.hidden { opacity: 0; }

        #title { position: absolute; inset: 0; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #title h1 { font-size: clamp(36px, 14vw, 72px); color: #ffd700; text-shadow: 0 0 30px #ffd700, 0 0 60px #ff8c00; margin-bottom: 8px; }
        #title h2 { font-size: clamp(14px, 4vw, 22px); color: #88f; margin-bottom: 50px; font-weight: 300; }
        #play-btn { padding: 20px 60px; font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #ffd700, #ff8c00); border: none; border-radius: 50px; color: #1a1a2e; box-shadow: 0 8px 40px rgba(255,215,0,0.5); touch-action: manipulation; }
        #play-btn:active { transform: scale(0.95); }

        .hidden { display: none !important; }
    </style>
</head>

    <div id="title">
        <h1>MUDSLIDE MANOR</h1>

        <button id="play-btn">PLAY</button>
    </div>
    <div id="ui" class="hidden">
        <div id="top-bar">
            <div id="lives">❤️❤️❤️</div>
            <div id="room-name">The Entrance</div>
            <div id="gems">💎 0</div>
        </div>
        <div id="items-bar">
            <div class="item-slot"></div>
            <div class="item-slot"></div>
            <div class="item-slot"></div>
            <div class="item-slot"></div>
        </div>
        <div id="hint">Tap where you want to go · Double-tap to jump</div>
    </div>
</div>

<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════════════════════════
// GAME CONFIG
// ═══════════════════════════════════════════════════════════════
const G = {
    lives: 3, gems: 0, room: 0, items: [], started: false,
    vel: new THREE.Vector3(), jumping: false, grounded: true,
    target: null, // tap-to-move target
    camTarget: new THREE.Vector3(),
    invincible: 0
};

// ═══════════════════════════════════════════════════════════════
// 10 MYSTERIOUS ROOMS
// ═══════════════════════════════════════════════════════════════
const ROOMS = [
    { name: "The Overgrown Entrance", w: 10, h: 10, floor: 0x3d5c3d, wall: 0x6b4423, sky: 0x4a7c59, fog: 0x2d4a2d,
      features: ['vines', 'moss'], gems: [{x:-2,z:2},{x:2,z:-2},{x:0,z:3}], rings: [{x:-3,z:0}],
      enemies: [{type:'snake',x:2,z:0}], exits: [{x:5,z:0,to:1}] },

    { name: "Crystal Cavern", w: 12, h: 8, floor: 0x2a3a4a, wall: 0x1a2a3a, sky: 0x0a1a2a, fog: 0x152535,
      features: ['crystals', 'glow'], gems: [{x:-4,z:2},{x:3,z:-2},{x:0,z:0},{x:-2,z:-1}], emeralds: [{x:4,z:1}],
      enemies: [{type:'bat',x:0,z:2},{type:'bat',x:-3,z:-1}], exits: [{x:-6,z:0,to:0},{x:6,z:0,to:2}] },

    { name: "The Throne Room", w: 14, h: 10, floor: 0x4a3a3a, wall: 0x8b4513, sky: 0x2a1a1a, fog: 0x1a0a0a,
      features: ['throne', 'torches'], gems: [{x:-5,z:3},{x:5,z:3},{x:0,z:-3}], coins: [{x:-2,z:0},{x:2,z:0}],
      enemies: [{type:'guard',x:0,z:2}], exits: [{x:-7,z:0,to:1},{x:7,z:0,to:3}] },

    { name: "Poison Garden", w: 10, h: 12, floor: 0x2a4a2a, wall: 0x3a2a1a, sky: 0x3a5a3a, fog: 0x1a3a1a,
      features: ['vines', 'flowers', 'glow'], gems: [{x:-3,z:4},{x:3,z:-4},{x:0,z:0}], emeralds: [{x:-2,z:-3},{x:2,z:3}],
      enemies: [{type:'snake',x:-2,z:2},{type:'snake',x:2,z:-2}], exits: [{x:0,z:-6,to:2},{x:0,z:6,to:4}] },

    { name: "The Flooded Crypt", w: 12, h: 10, floor: 0x1a3a4a, wall: 0x2a4a5a, sky: 0x0a2a3a, fog: 0x0a1a2a,
      features: ['water', 'glow'], gems: [{x:-4,z:-3},{x:4,z:3},{x:-2,z:2},{x:2,z:-2}], rings: [{x:0,z:0}],
      enemies: [{type:'ghost',x:3,z:0}], exits: [{x:0,z:-5,to:3},{x:6,z:0,to:5}] },

    { name: "Lava Bridge", w: 8, h: 14, floor: 0x3a2a1a, wall: 0x4a3a2a, sky: 0x4a1a0a, fog: 0x2a0a00,
      features: ['lava', 'bridge'], gems: [{x:0,z:-5},{x:0,z:0},{x:0,z:5}], coins: [{x:-2,z:-3},{x:2,z:3}],
      enemies: [{type:'fireball',x:0,z:-2},{type:'fireball',x:0,z:2}], exits: [{x:-4,z:0,to:4},{x:4,z:0,to:6}] },

    { name: "The Library", w: 12, h: 12, floor: 0x4a3a2a, wall: 0x3a2a1a, sky: 0x2a2a3a, fog: 0x1a1a2a,
      features: ['books', 'candles'], gems: [{x:-4,z:-4},{x:4,z:4},{x:-4,z:4},{x:4,z:-4}], scrolls: [{x:0,z:0}],
      enemies: [{type:'ghost',x:-2,z:0},{type:'ghost',x:2,z:0}], exits: [{x:-6,z:0,to:5},{x:6,z:0,to:7}] },

    { name: "Spider's Lair", w: 10, h: 10, floor: 0x1a1a2a, wall: 0x2a2a3a, sky: 0x0a0a1a, fog: 0x050510,
      features: ['webs', 'glow'], gems: [{x:-3,z:-3},{x:3,z:3},{x:-3,z:3},{x:3,z:-3},{x:0,z:0}],
      enemies: [{type:'spider',x:-2,z:0},{type:'spider',x:2,z:0},{type:'spider',x:0,z:2}], exits: [{x:-5,z:0,to:6},{x:5,z:0,to:8}] },

    { name: "The Observatory", w: 12, h: 12, floor: 0x2a2a4a, wall: 0x3a3a5a, sky: 0x0a0a2a, fog: 0x050515,
      features: ['stars', 'telescope'], gems: [{x:-4,z:0},{x:4,z:0},{x:0,z:-4},{x:0,z:4}], emeralds: [{x:0,z:0}],
      enemies: [{type:'bat',x:-3,z:-3},{type:'bat',x:3,z:3}], exits: [{x:0,z:-6,to:7},{x:0,z:6,to:9}] },

    { name: "The Treasure Vault", w: 14, h: 14, floor: 0x5a4a1a, wall: 0x6a5a2a, sky: 0x4a3a0a, fog: 0x2a1a00,
      features: ['gold', 'glow'], gems: [{x:-5,z:-5},{x:5,z:5},{x:-5,z:5},{x:5,z:-5},{x:0,z:0},{x:-3,z:0},{x:3,z:0},{x:0,z:-3},{x:0,z:3}],
      emeralds: [{x:-2,z:-2},{x:2,z:2}], rings: [{x:0,z:0}], coins: [{x:-4,z:0},{x:4,z:0},{x:0,z:-4},{x:0,z:4}],
      enemies: [{type:'guard',x:-3,z:-3},{type:'guard',x:3,z:3}], exits: [{x:0,z:-7,to:8}] }
];

// ═══════════════════════════════════════════════════════════════
// THREE.JS SETUP
// ═══════════════════════════════════════════════════════════════
let scene, camera, renderer, clock;
let player, roomGroup, particleSystem;
let enemies = [], collectibles = [], decorations = [];
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function init() {
    clock = new THREE.Clock();
    scene = new THREE.Scene();

    // Smooth camera
    const aspect = window.innerWidth / window.innerHeight;
    camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
    camera.position.set(0, 12, 12);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('game-container').appendChild(renderer.domElement);

    roomGroup = new THREE.Group();
    scene.add(roomGroup);

    createPlayer();
    createParticles();
    setupControls();

    document.getElementById('play-btn').onclick = startGame;
    window.onresize = onResize;

    animate();
}

function startGame() {
    if (G.started) return;
    G.started = true;
    document.getElementById('title').classList.add('hidden');
    document.getElementById('ui').classList.remove('hidden');
    loadRoom(0);
    setTimeout(() => document.getElementById('hint').classList.add('hidden'), 4000);
    if (navigator.vibrate) navigator.vibrate(30);
}

// ═══════════════════════════════════════════════════════════════
// PLAYER - Cute adventurer
// ═══════════════════════════════════════════════════════════════
function createPlayer() {
    player = new THREE.Group();

    // Body
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x44aaff });
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.25, 0.4, 8, 16), bodyMat);
    body.position.y = 0.55;
    body.castShadow = true;
    player.add(body);

    // Head
    const headMat = new THREE.MeshLambertMaterial({ color: 0xffddcc });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), headMat);
    head.position.y = 1.1;
    head.castShadow = true;
    player.add(head);

    // Hair
    const hairMat = new THREE.MeshLambertMaterial({ color: 0x553322 });
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), hairMat);
    hair.position.y = 1.2;
    player.add(hair);

    // Eyes
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
    [-0.1, 0.1].forEach(x => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), eyeMat);
        eye.position.set(x, 1.15, 0.22);
        player.add(eye);
        // Eye shine
        const shine = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        shine.position.set(x + 0.02, 1.17, 0.25);
        player.add(shine);
    });

    // Backpack
    const packMat = new THREE.MeshLambertMaterial({ color: 0x886644 });
    const pack = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.4, 0.2), packMat);
    pack.position.set(0, 0.6, -0.2);
    pack.castShadow = true;
    player.add(pack);

    scene.add(player);
}

// ═══════════════════════════════════════════════════════════════
// PARTICLES - Floating magical dust
// ═══════════════════════════════════════════════════════════════
function createParticles() {
    const geo = new THREE.BufferGeometry();
    const count = 200;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 20;
        positions[i * 3 + 1] = Math.random() * 5;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

        const c = new THREE.Color().setHSL(Math.random() * 0.2 + 0.5, 0.8, 0.6);
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, opacity: 0.6 });
    particleSystem = new THREE.Points(geo, mat);
    scene.add(particleSystem);
}

// ═══════════════════════════════════════════════════════════════
// ROOM LOADING
// ═══════════════════════════════════════════════════════════════
function loadRoom(idx) {
    const room = ROOMS[idx];
    G.room = idx;

    // Clear
    while (roomGroup.children.length) roomGroup.remove(roomGroup.children[0]);
    enemies = [];
    collectibles = [];
    decorations = [];

    document.getElementById('room-name').textContent = room.name;

    // Sky & fog
    scene.background = new THREE.Color(room.sky);
    scene.fog = new THREE.FogExp2(room.fog, 0.04);

    // Lights
    scene.children = scene.children.filter(c => !(c instanceof THREE.Light));
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    const sun = new THREE.DirectionalLight(0xffffee, 1.2);
    sun.position.set(8, 15, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 50;
    sun.shadow.camera.left = sun.shadow.camera.bottom = -15;
    sun.shadow.camera.right = sun.shadow.camera.top = 15;
    scene.add(sun);

    // Floor
    createFloor(room);

    // Walls
    createWalls(room);

    // Features
    createFeatures(room);

    // Collectibles
    (room.gems || []).forEach(p => createCollectible('gem', p.x, p.z, 0x00ffff));
    (room.emeralds || []).forEach(p => createCollectible('emerald', p.x, p.z, 0x00ff44));
    (room.rings || []).forEach(p => createCollectible('ring', p.x, p.z, 0xffdd00));
    (room.coins || []).forEach(p => createCollectible('coin', p.x, p.z, 0xffcc00));
    (room.scrolls || []).forEach(p => createCollectible('scroll', p.x, p.z, 0xffeecc));

    // Enemies
    (room.enemies || []).forEach(e => createEnemy(e));

    // Exits
    (room.exits || []).forEach(e => createExit(e));

    // Player spawn
    if (!player.parent) scene.add(player);
    player.position.set(0, 0, 0);
    G.camTarget.set(0, 0, 0);
}

function createFloor(room) {
    const mat1 = new THREE.MeshLambertMaterial({ color: room.floor });
    const mat2 = new THREE.MeshLambertMaterial({ color: new THREE.Color(room.floor).multiplyScalar(0.9) });

    for (let x = -room.w / 2; x < room.w / 2; x++) {
        for (let z = -room.h / 2; z < room.h / 2; z++) {
            const tile = new THREE.Mesh(
                new THREE.BoxGeometry(0.98, 0.2, 0.98),
                (x + z) % 2 === 0 ? mat1 : mat2
            );
            tile.position.set(x + 0.5, -0.1, z + 0.5);
            tile.receiveShadow = true;
            tile.userData.floor = true;
            roomGroup.add(tile);
        }
    }
}

function createWalls(room) {
    const mat = new THREE.MeshLambertMaterial({ color: room.wall });
    const h = 2.5;

    // Four walls with gaps for exits
    const exits = ROOMS[G.room].exits || [];

    [[-room.w/2 - 0.5, 0, 0, 1, room.h], [room.w/2 + 0.5, 0, 0, 1, room.h],
     [0, 0, -room.h/2 - 0.5, room.w, 1], [0, 0, room.h/2 + 0.5, room.w, 1]].forEach(([x, y, z, w, d]) => {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        wall.position.set(x, h/2, z);
        wall.castShadow = true;
        wall.receiveShadow = true;
        roomGroup.add(wall);
    });
}

function createFeatures(room) {
    const features = room.features || [];

    if (features.includes('vines')) {
        for (let i = 0; i < 8; i++) {
            const vine = createVine();
            vine.position.set(
                (Math.random() - 0.5) * room.w * 0.8,
                0,
                (Math.random() - 0.5) * room.h * 0.8
            );
            roomGroup.add(vine);
            decorations.push(vine);
        }
    }

    if (features.includes('crystals')) {
        for (let i = 0; i < 6; i++) {
            const crystal = createCrystal();
            crystal.position.set(
                (Math.random() - 0.5) * room.w * 0.7,
                0,
                (Math.random() - 0.5) * room.h * 0.7
            );
            roomGroup.add(crystal);
            decorations.push(crystal);
        }
    }

    if (features.includes('glow')) {
        for (let i = 0; i < 5; i++) {
            const light = new THREE.PointLight(
                new THREE.Color().setHSL(Math.random(), 0.8, 0.5),
                0.8, 6
            );
            light.position.set(
                (Math.random() - 0.5) * room.w * 0.6,
                1.5,
                (Math.random() - 0.5) * room.h * 0.6
            );
            roomGroup.add(light);

            // Glowing orb
            const orb = new THREE.Mesh(
                new THREE.SphereGeometry(0.15, 8, 8),
                new THREE.MeshBasicMaterial({ color: light.color })
            );
            orb.position.copy(light.position);
            roomGroup.add(orb);
            decorations.push({ orb, light, phase: Math.random() * Math.PI * 2 });
        }
    }

    if (features.includes('torches')) {
        [[-room.w/2 + 1, -room.h/2 + 1], [room.w/2 - 1, -room.h/2 + 1],
         [-room.w/2 + 1, room.h/2 - 1], [room.w/2 - 1, room.h/2 - 1]].forEach(([x, z]) => {
            const torch = createTorch();
            torch.position.set(x, 0, z);
            roomGroup.add(torch);
            decorations.push(torch);
        });
    }

    if (features.includes('webs')) {
        for (let i = 0; i < 4; i++) {
            const web = createWeb();
            web.position.set(
                (Math.random() - 0.5) * room.w * 0.7,
                1 + Math.random(),
                (Math.random() - 0.5) * room.h * 0.7
            );
            roomGroup.add(web);
        }
    }

    if (features.includes('water')) {
        const water = new THREE.Mesh(
            new THREE.PlaneGeometry(room.w * 0.8, room.h * 0.8),
            new THREE.MeshLambertMaterial({ color: 0x2288aa, transparent: true, opacity: 0.6 })
        );
        water.rotation.x = -Math.PI / 2;
        water.position.y = -0.05;
        roomGroup.add(water);
        decorations.push({ water, phase: 0 });
    }
}

function createVine() {
    const group = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: 0x228833 });

    for (let i = 0; i < 3; i++) {
        const height = 1 + Math.random() * 1.5;
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, height, 6), mat);
        stem.position.set((Math.random() - 0.5) * 0.3, height / 2, (Math.random() - 0.5) * 0.3);
        stem.rotation.set(Math.random() * 0.3, 0, Math.random() * 0.3);
        group.add(stem);

        // Leaves
        for (let j = 0; j < 4; j++) {
            const leaf = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 6, 4),
                new THREE.MeshLambertMaterial({ color: 0x33aa44 })
            );
            leaf.scale.set(1, 0.3, 0.7);
            leaf.position.set(
                stem.position.x + (Math.random() - 0.5) * 0.3,
                0.3 + j * 0.35,
                stem.position.z + (Math.random() - 0.5) * 0.3
            );
            group.add(leaf);
        }
    }
    return group;
}

function createCrystal() {
    const group = new THREE.Group();
    const colors = [0x88ddff, 0xaa88ff, 0xff88dd, 0x88ffaa];

    for (let i = 0; i < 3; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        const mat = new THREE.MeshLambertMaterial({ color, emissive: color, emissiveIntensity: 0.3 });
        const crystal = new THREE.Mesh(new THREE.ConeGeometry(0.15 + Math.random() * 0.1, 0.5 + Math.random() * 0.5, 6), mat);
        crystal.position.set((Math.random() - 0.5) * 0.4, 0.3 + Math.random() * 0.3, (Math.random() - 0.5) * 0.4);
        crystal.rotation.set(Math.random() * 0.3, Math.random() * Math.PI, Math.random() * 0.3);
        group.add(crystal);
    }
    return group;
}

function createTorch() {
    const group = new THREE.Group();

    // Bracket
    const bracket = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.8, 0.1),
        new THREE.MeshLambertMaterial({ color: 0x444444 })
    );
    bracket.position.y = 0.4;
    group.add(bracket);

    // Flame
    const flame = new THREE.Mesh(
        new THREE.ConeGeometry(0.12, 0.3, 8),
        new THREE.MeshBasicMaterial({ color: 0xff6600 })
    );
    flame.position.y = 0.95;
    group.add(flame);

    // Light
    const light = new THREE.PointLight(0xff6633, 1, 5);
    light.position.y = 1;
    group.add(light);

    group.userData.flame = flame;
    group.userData.light = light;
    group.userData.phase = Math.random() * Math.PI * 2;

    return group;
}

function createWeb() {
    const geo = new THREE.RingGeometry(0.1, 0.8, 8, 3);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
    const web = new THREE.Mesh(geo, mat);
    web.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.5;
    web.rotation.z = Math.random() * Math.PI;
    return web;
}

// ═══════════════════════════════════════════════════════════════
// COLLECTIBLES
// ═══════════════════════════════════════════════════════════════
function createCollectible(type, x, z, color) {
    const group = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color, emissive: color, emissiveIntensity: 0.4 });

    let mesh;
    if (type === 'gem') {
        mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.2, 0), mat);
    } else if (type === 'emerald') {
        mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.25, 0), mat);
        mesh.scale.y = 1.5;
    } else if (type === 'ring') {
        mesh = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.06, 8, 24), mat);
        mesh.rotation.x = Math.PI / 2;
    } else if (type === 'coin') {
        mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.05, 16), mat);
        mesh.rotation.x = Math.PI / 2;
    } else if (type === 'scroll') {
        mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8), mat);
        mesh.rotation.z = Math.PI / 2;
    }

    mesh.position.y = 0.5;
    mesh.castShadow = true;
    group.add(mesh);

    // Glow
    const glow = new THREE.PointLight(color, 0.5, 2);
    glow.position.y = 0.5;
    group.add(glow);

    group.position.set(x, 0, z);
    group.userData = { type, value: type === 'emerald' ? 3 : type === 'ring' ? 5 : 1, phase: Math.random() * Math.PI * 2 };

    collectibles.push(group);
    roomGroup.add(group);
}

// ═══════════════════════════════════════════════════════════════
// ENEMIES
// ═══════════════════════════════════════════════════════════════
function createEnemy(e) {
    const group = new THREE.Group();

    if (e.type === 'snake') {
        const mat = new THREE.MeshLambertMaterial({ color: 0x44aa44 });
        // Body segments
        for (let i = 0; i < 5; i++) {
            const seg = new THREE.Mesh(new THREE.SphereGeometry(0.15 - i * 0.02, 8, 6), mat);
            seg.position.z = -i * 0.2;
            seg.position.y = 0.15;
            group.add(seg);
        }
        // Eyes
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        [-0.08, 0.08].forEach(x => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), eyeMat);
            eye.position.set(x, 0.22, 0.1);
            group.add(eye);
        });
        group.userData = { type: 'snake', speed: 1.5, phase: Math.random() * Math.PI * 2, pattern: 'slither' };

    } else if (e.type === 'bat') {
        const mat = new THREE.MeshLambertMaterial({ color: 0x333344 });
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 6), mat);
        body.scale.set(1, 0.8, 1.2);
        group.add(body);
        // Wings
        [-1, 1].forEach(side => {
            const wing = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.3), mat);
            wing.position.set(side * 0.35, 0, 0);
            wing.rotation.y = side * 0.3;
            group.add(wing);
        });
        // Eyes
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        [-0.08, 0.08].forEach(x => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), eyeMat);
            eye.position.set(x, 0.05, 0.15);
            group.add(eye);
        });
        group.userData = { type: 'bat', speed: 2, phase: Math.random() * Math.PI * 2, pattern: 'swoop' };
        group.position.y = 1.5;

    } else if (e.type === 'spider') {
        const mat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 6), mat);
        body.position.y = 0.3;
        group.add(body);
        // Legs
        for (let i = 0; i < 8; i++) {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.01, 0.4, 4), mat);
            leg.position.set(Math.cos(i * Math.PI / 4) * 0.2, 0.15, Math.sin(i * Math.PI / 4) * 0.2);
            leg.rotation.z = Math.cos(i * Math.PI / 4) * 0.8;
            leg.rotation.x = Math.sin(i * Math.PI / 4) * 0.8;
            group.add(leg);
        }
        // Eyes
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        for (let i = 0; i < 4; i++) {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 4), eyeMat);
            eye.position.set((i % 2 === 0 ? -0.08 : 0.08), 0.35 + (i < 2 ? 0.05 : 0), 0.2);
            group.add(eye);
        }
        group.userData = { type: 'spider', speed: 1.2, phase: Math.random() * Math.PI * 2, pattern: 'crawl' };

    } else if (e.type === 'ghost') {
        const mat = new THREE.MeshLambertMaterial({ color: 0xaaccff, transparent: true, opacity: 0.7 });
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1, 8), mat);
        body.rotation.x = Math.PI;
        body.position.y = 0.8;
        group.add(body);
        // Eyes
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000033 });
        [-0.1, 0.1].forEach(x => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
            eye.position.set(x, 1, 0.2);
            group.add(eye);
        });
        group.userData = { type: 'ghost', speed: 0.8, phase: Math.random() * Math.PI * 2, pattern: 'float' };

    } else if (e.type === 'guard') {
        const mat = new THREE.MeshLambertMaterial({ color: 0x884422 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.4), mat);
        body.position.y = 0.6;
        body.castShadow = true;
        group.add(body);
        const head = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.4, 4), mat);
        head.position.y = 1.2;
        head.rotation.y = Math.PI / 4;
        group.add(head);
        const visor = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, 0.1), new THREE.MeshBasicMaterial({ color: 0xff3300 }));
        visor.position.set(0, 1.05, 0.2);
        group.add(visor);
        group.userData = { type: 'guard', speed: 1, phase: Math.random() * Math.PI * 2, pattern: 'patrol' };

    } else if (e.type === 'fireball') {
        const mat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
        const core = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), mat);
        group.add(core);
        const light = new THREE.PointLight(0xff4400, 1, 3);
        group.add(light);
        group.userData = { type: 'fireball', speed: 2.5, phase: Math.random() * Math.PI * 2, pattern: 'bounce' };
        group.position.y = 0.5;
    }

    group.position.set(e.x, group.position.y, e.z);
    group.userData.startX = e.x;
    group.userData.startZ = e.z;
    group.userData.startY = group.position.y;

    enemies.push(group);
    roomGroup.add(group);
}

// ═══════════════════════════════════════════════════════════════
// EXITS
// ═══════════════════════════════════════════════════════════════
function createExit(e) {
    const group = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: 0x44ff88, emissive: 0x22aa44, emissiveIntensity: 0.5 });

    // Arch
    const arch = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.1, 8, 24, Math.PI), mat);
    arch.position.y = 1.4;
    arch.rotation.x = Math.PI / 2;
    group.add(arch);

    // Pillars
    [-0.6, 0.6].forEach(x => {
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 1.4, 8), mat);
        pillar.position.set(x, 0.7, 0);
        pillar.castShadow = true;
        group.add(pillar);
    });

    // Glow
    const light = new THREE.PointLight(0x44ff88, 1, 4);
    light.position.y = 1;
    group.add(light);

    group.position.set(e.x, 0, e.z);
    group.userData = { isExit: true, to: e.to };

    roomGroup.add(group);
}

// ═══════════════════════════════════════════════════════════════
// CONTROLS - Tap to move, double tap to jump
// ═══════════════════════════════════════════════════════════════
function setupControls() {
    const canvas = renderer.domElement;
    let lastTap = 0;

    canvas.addEventListener('touchstart', e => {
        if (!G.started) return;
        e.preventDefault();

        const touch = e.touches[0];
        const now = Date.now();

        // Double tap = jump
        if (now - lastTap < 300) {
            if (G.grounded) {
                G.vel.y = 10;
                G.jumping = true;
                G.grounded = false;
                if (navigator.vibrate) navigator.vibrate(15);
            }
        } else {
            // Single tap = set target
            setMoveTarget(touch.clientX, touch.clientY);
        }
        lastTap = now;
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
        if (!G.started) return;
        e.preventDefault();
        setMoveTarget(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
        G.target = null;
    });

    // Keyboard
    window.addEventListener('keydown', e => {
        if (e.code === 'Space' && G.grounded) {
            G.vel.y = 10;
            G.jumping = true;
            G.grounded = false;
        }
    });
}

function setMoveTarget(screenX, screenY) {
    pointer.x = (screenX / window.innerWidth) * 2 - 1;
    pointer.y = -(screenY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(roomGroup.children.filter(c => c.userData.floor));

    if (hits.length > 0) {
        G.target = hits[0].point.clone();
        G.target.y = 0;
    }
}

// ═══════════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════════
function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.1);
    const time = clock.getElapsedTime();

    if (G.started) {
        updatePlayer(dt, time);
        updateCamera(dt);
        updateEnemies(dt, time);
        updateCollectibles(time);
        updateDecorations(time);
        updateParticles(time);
        checkCollisions();
    }

    renderer.render(scene, camera);
}

function updatePlayer(dt, time) {
    const speed = 5;
    const gravity = 25;

    // Move toward target
    if (G.target) {
        const dir = G.target.clone().sub(player.position);
        dir.y = 0;
        const dist = dir.length();

        if (dist > 0.2) {
            dir.normalize();
            player.position.x += dir.x * speed * dt;
            player.position.z += dir.z * speed * dt;
            player.rotation.y = Math.atan2(dir.x, dir.z);

            // Bob animation
            player.children[0].position.y = 0.55 + Math.sin(time * 12) * 0.03;
        }
    }

    // Keyboard movement
    let kx = 0, kz = 0;
    if (keys['ArrowUp'] || keys['KeyW']) { kx -= 1; kz -= 1; }
    if (keys['ArrowDown'] || keys['KeyS']) { kx += 1; kz += 1; }
    if (keys['ArrowLeft'] || keys['KeyA']) { kx -= 1; kz += 1; }
    if (keys['ArrowRight'] || keys['KeyD']) { kx += 1; kz -= 1; }

    if (kx || kz) {
        const len = Math.sqrt(kx * kx + kz * kz);
        player.position.x += (kx / len) * speed * dt;
        player.position.z += (kz / len) * speed * dt;
        player.rotation.y = Math.atan2(kx, kz);
        player.children[0].position.y = 0.55 + Math.sin(time * 12) * 0.03;
    }

    // Gravity
    G.vel.y -= gravity * dt;
    player.position.y += G.vel.y * dt;

    if (player.position.y <= 0) {
        player.position.y = 0;
        G.vel.y = 0;
        G.grounded = true;
        G.jumping = false;
    }

    // Room bounds
    const room = ROOMS[G.room];
    player.position.x = Math.max(-room.w / 2 + 0.5, Math.min(room.w / 2 - 0.5, player.position.x));
    player.position.z = Math.max(-room.h / 2 + 0.5, Math.min(room.h / 2 - 0.5, player.position.z));

    // Invincibility timer
    if (G.invincible > 0) {
        G.invincible -= dt;
        player.visible = Math.floor(time * 20) % 2 === 0;
    } else {
        player.visible = true;
    }
}

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function updateCamera(dt) {
    // Smooth follow
    G.camTarget.lerp(player.position, 0.08);

    camera.position.x = G.camTarget.x + 10;
    camera.position.y = G.camTarget.y + 12;
    camera.position.z = G.camTarget.z + 10;
    camera.lookAt(G.camTarget.x, G.camTarget.y, G.camTarget.z);
}

function updateEnemies(dt, time) {
    enemies.forEach(e => {
        const d = e.userData;
        const r = 2.5;

        if (d.pattern === 'slither') {
            e.position.x = d.startX + Math.sin(time * d.speed + d.phase) * r;
            e.position.z = d.startZ + Math.cos(time * d.speed * 0.7 + d.phase) * r * 0.5;
            e.rotation.y = Math.atan2(
                Math.cos(time * d.speed + d.phase),
                -Math.sin(time * d.speed * 0.7 + d.phase) * 0.5
            );
        } else if (d.pattern === 'swoop') {
            e.position.x = d.startX + Math.sin(time * d.speed + d.phase) * r;
            e.position.y = d.startY + Math.sin(time * d.speed * 2 + d.phase) * 0.5;
            e.position.z = d.startZ + Math.cos(time * d.speed + d.phase) * r;
            // Wing flap
            e.children[1].rotation.z = Math.sin(time * 15) * 0.5 - 0.3;
            e.children[2].rotation.z = -Math.sin(time * 15) * 0.5 + 0.3;
        } else if (d.pattern === 'crawl') {
            e.position.x = d.startX + Math.sin(time * d.speed + d.phase) * r;
            e.position.z = d.startZ + Math.cos(time * d.speed + d.phase) * r;
            e.rotation.y = time * d.speed + d.phase + Math.PI / 2;
        } else if (d.pattern === 'float') {
            e.position.y = d.startY + Math.sin(time * 2 + d.phase) * 0.5;
            e.position.x = d.startX + Math.sin(time * d.speed * 0.5 + d.phase) * r * 0.5;
            e.rotation.y = time * 0.5;
        } else if (d.pattern === 'patrol') {
            e.position.x = d.startX + Math.sin(time * d.speed + d.phase) * r;
            e.rotation.y = Math.sin(time * d.speed + d.phase) > 0 ? 0 : Math.PI;
        } else if (d.pattern === 'bounce') {
            e.position.x = d.startX + Math.sin(time * d.speed + d.phase) * r;
            e.position.y = d.startY + Math.abs(Math.sin(time * 4 + d.phase)) * 1.5;
            e.position.z = d.startZ + Math.cos(time * d.speed * 0.8 + d.phase) * r;
        }
    });
}

function updateCollectibles(time) {
    collectibles.forEach(c => {
        if (!c.visible) return;
        c.children[0].position.y = 0.5 + Math.sin(time * 3 + c.userData.phase) * 0.15;
        c.children[0].rotation.y = time * 2;
    });
}

function updateDecorations(time) {
    decorations.forEach(d => {
        if (d.userData?.flame) {
            // Torch flicker
            const f = d.userData.flame;
            const l = d.userData.light;
            const scale = 0.9 + Math.sin(time * 20 + d.userData.phase) * 0.1 + Math.random() * 0.1;
            f.scale.set(scale, scale, scale);
            l.intensity = 0.8 + Math.sin(time * 15 + d.userData.phase) * 0.2;
        } else if (d.orb) {
            // Floating orb
            d.orb.position.y = 1.5 + Math.sin(time * 2 + d.phase) * 0.3;
            d.light.position.copy(d.orb.position);
        } else if (d.water) {
            // Water ripple (subtle position change)
            d.water.position.y = -0.05 + Math.sin(time + d.phase) * 0.02;
        }
    });
}

function updateParticles(time) {
    const pos = particleSystem.geometry.attributes.position.array;
    for (let i = 0; i < pos.length; i += 3) {
        pos[i + 1] += 0.01;
        if (pos[i + 1] > 5) pos[i + 1] = 0;
        pos[i] += Math.sin(time + i) * 0.002;
    }
    particleSystem.geometry.attributes.position.needsUpdate = true;
    particleSystem.position.copy(player.position);
}

function checkCollisions() {
    // Enemies
    if (G.invincible <= 0) {
        enemies.forEach(e => {
            const dx = player.position.x - e.position.x;
            const dy = player.position.y - e.position.y;
            const dz = player.position.z - e.position.z;
            if (Math.sqrt(dx * dx + dy * dy + dz * dz) < 0.6) {
                hitPlayer();
            }
        });
    }

    // Collectibles
    collectibles.forEach(c => {
        if (!c.visible) return;
        const dx = player.position.x - c.position.x;
        const dy = player.position.y - c.position.y;
        const dz = player.position.z - c.position.z;
        if (Math.sqrt(dx * dx + dy * dy + dz * dz) < 0.6) {
            c.visible = false;
            G.gems += c.userData.value;
            G.items.push(c.userData.type);
            updateUI();
            if (navigator.vibrate) navigator.vibrate(20);
        }
    });

    // Exits
    roomGroup.children.forEach(c => {
        if (c.userData.isExit) {
            const dx = player.position.x - c.position.x;
            const dz = player.position.z - c.position.z;
            if (Math.sqrt(dx * dx + dz * dz) < 1) {
                loadRoom(c.userData.to);
                if (navigator.vibrate) navigator.vibrate([30, 30, 30]);
            }
        }
    });
}

function hitPlayer() {
    G.lives--;
    G.invincible = 2;
    G.vel.y = 6;
    updateUI();
    if (navigator.vibrate) navigator.vibrate([80, 40, 80]);

    if (G.lives <= 0) {
        G.lives = 3;
        G.gems = Math.max(0, G.gems - 10);
        loadRoom(0);
        updateUI();
    }
}

function updateUI() {
    document.getElementById('lives').textContent = '❤️'.repeat(G.lives);
    document.getElementById('gems').textContent = '💎 ' + G.gems;

    const slots = document.querySelectorAll('.item-slot');
    const icons = { gem: '💎', emerald: '💚', ring: '💍', coin: '🪙', scroll: '📜' };
    G.items.slice(-4).forEach((item, i) => {
        if (slots[i]) slots[i].textContent = icons[item] || '?';
    });
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
