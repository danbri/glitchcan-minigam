<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>Mudslide Manor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            position: fixed;
            inset: 0;
            touch-action: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            touch-action: none;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        /* Clean minimal UI */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #lives {
            font-size: clamp(20px, 5vw, 28px);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        #room-name {
            color: #fff;
            font-size: clamp(14px, 3.5vw, 20px);
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        #score {
            color: #90EE90;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        #items {
            position: absolute;
            top: max(50px, calc(env(safe-area-inset-top) + 40px));
            right: max(12px, env(safe-area-inset-right));
            display: flex;
            gap: 8px;
        }

        .item-slot {
            width: clamp(40px, 10vw, 50px);
            height: clamp(40px, 10vw, 50px);
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 5vw, 26px);
            backdrop-filter: blur(4px);
        }

        /* Touch hint */
        #touch-hint {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        #touch-hint.hidden {
            opacity: 0;
        }

        /* Touch indicator */
        #touch-indicator {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,215,0,0.6);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            transition: opacity 0.15s, transform 0.15s;
        }

        #touch-indicator.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Loading & Title */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: clamp(24px, 8vw, 36px);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #title-screen {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        #title-screen h1 {
            font-size: clamp(32px, 12vw, 64px);
            color: #ffd700;
            text-shadow: 0 4px 20px rgba(255,215,0,0.5);
            margin-bottom: 8px;
        }

        #title-screen h2 {
            font-size: clamp(14px, 4vw, 20px);
            color: #88aaff;
            margin-bottom: 50px;
            font-weight: normal;
        }

        #start-btn {
            min-width: 220px;
            min-height: 64px;
            padding: 20px 60px;
            font-size: clamp(20px, 5vw, 26px);
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            border: none;
            border-radius: 32px;
            color: #1a1a2e;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255,215,0,0.4);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">LOADING...</div>

        <div id="title-screen" class="hidden">
            <h1>MUDSLIDE MANOR</h1>
            <h2>An Isometric Adventure</h2>
            <button id="start-btn">TAP TO PLAY</button>
        </div>

        <div id="ui-overlay" class="hidden">
            <div id="top-bar">
                <div id="lives">❤️❤️❤️</div>
                <div id="room-name">The Grand Hall</div>
                <div id="score">0</div>
            </div>
            <div id="items">
                <div class="item-slot"></div>
                <div class="item-slot"></div>
                <div class="item-slot"></div>
            </div>
            <div id="touch-hint">Touch & drag to move · Double-tap to jump</div>
        </div>

        <div id="touch-indicator"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================
        // SETUP
        // ============================================
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        const gameState = {
            lives: 3,
            score: 0,
            currentRoom: 'hall',
            items: [],
            playerVelocity: { x: 0, y: 0, z: 0 },
            isJumping: false,
            keys: {},
            started: false,
            touchInput: { x: 0, z: 0 },
            touchActive: false
        };

        // ============================================
        // ROOMS - Brighter colors!
        // ============================================
        const rooms = {
            hall: {
                name: "The Grand Hall",
                width: 8, depth: 8,
                walls: [
                    { x: 0, z: -4, w: 8, d: 1 },
                    { x: 0, z: 4, w: 8, d: 1 },
                    { x: -4, z: 0, w: 1, d: 8 },
                    { x: 4, z: 0, w: 1, d: 6 }
                ],
                blocks: [
                    { x: -2, y: 0.5, z: -2, size: 1 },
                    { x: 2, y: 0.5, z: 2, size: 1 },
                    { x: 0, y: 0.5, z: 0, size: 0.8, type: 'pedestal' }
                ],
                enemies: [{ type: 'guardian', x: 2, z: -2, patrol: 'circle' }],
                items: [{ type: 'key', x: 0, y: 1.2, z: 0, color: 0xffd700 }],
                exits: [{ x: 4, z: 3, toRoom: 'dungeon', spawnX: -3, spawnZ: 0 }],
                floorColor: 0x4a6741,
                floorColor2: 0x5c7a52,
                wallColor: 0x8B7355,
                ambient: 0xffffff,
                light: 0xfffaf0,
                bgColor: 0x87CEEB
            },
            dungeon: {
                name: "The Dark Dungeon",
                width: 10, depth: 6,
                walls: [
                    { x: 0, z: -3, w: 10, d: 1 },
                    { x: 0, z: 3, w: 10, d: 1 },
                    { x: -5, z: 0, w: 1, d: 6 },
                    { x: 5, z: 0, w: 1, d: 4 }
                ],
                blocks: [
                    { x: -3, y: 0.5, z: 0, size: 1 },
                    { x: -3, y: 1.5, z: 0, size: 1 },
                    { x: 0, y: 0.5, z: -1, size: 1.2 },
                    { x: 3, y: 0.5, z: 1, size: 0.8 }
                ],
                enemies: [
                    { type: 'spider', x: 1, z: 0, patrol: 'horizontal' },
                    { type: 'spider', x: -2, z: 1, patrol: 'vertical' }
                ],
                items: [{ type: 'gem', x: 3, y: 1, z: 1, color: 0xff69b4 }],
                exits: [
                    { x: -4, z: 0, toRoom: 'hall', spawnX: 3, spawnZ: 3 },
                    { x: 5, z: 2, toRoom: 'tower', spawnX: -2, spawnZ: 0 }
                ],
                floorColor: 0x4a4a5a,
                floorColor2: 0x5a5a6a,
                wallColor: 0x6a5a7a,
                ambient: 0xddeeff,
                light: 0xaabbff,
                bgColor: 0x2a2a4a
            },
            tower: {
                name: "Wizard's Tower",
                width: 6, depth: 6,
                walls: [
                    { x: 0, z: -3, w: 6, d: 1 },
                    { x: 0, z: 3, w: 6, d: 1 },
                    { x: -3, z: 0, w: 1, d: 4 },
                    { x: 3, z: 0, w: 1, d: 6 }
                ],
                blocks: [
                    { x: -1, y: 0.3, z: -1, size: 0.8 },
                    { x: 0, y: 0.6, z: -1, size: 0.8 },
                    { x: 1, y: 0.9, z: -1, size: 0.8 },
                    { x: 1, y: 1.2, z: 0, size: 0.8 },
                    { x: 1, y: 1.5, z: 1, size: 0.8 },
                    { x: 0, y: 1.8, z: 1, size: 0.8, type: 'magic' }
                ],
                enemies: [{ type: 'ghost', x: 0, z: 0, patrol: 'float' }],
                items: [{ type: 'scroll', x: 0, y: 2.3, z: 1, color: 0x00ffff }],
                exits: [{ x: -3, z: 0, toRoom: 'dungeon', spawnX: 4, spawnZ: 2 }],
                floorColor: 0x4a5a8a,
                floorColor2: 0x5a6a9a,
                wallColor: 0x7a8aaa,
                ambient: 0xeeeeff,
                light: 0xaaddff,
                bgColor: 0x3a4a6a
            }
        };

        // ============================================
        // THREE.JS
        // ============================================
        let scene, camera, renderer;
        let player, roomGroup;
        let enemies = [], collectibles = [];
        let clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();

            // Bright sky background
            scene.background = new THREE.Color(0x87CEEB);

            // Isometric camera
            const aspect = window.innerWidth / window.innerHeight;
            const size = isMobile ? 9 : 11;
            camera = new THREE.OrthographicCamera(
                -size * aspect / 2, size * aspect / 2,
                size / 2, -size / 2, 0.1, 100
            );
            camera.position.set(12, 12, 12);
            camera.lookAt(0, 0, 0);

            // Renderer - no post processing, just clean bright render
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.getElementById('game-container').appendChild(renderer.domElement);

            roomGroup = new THREE.Group();
            scene.add(roomGroup);

            createPlayer();
            setupInput();

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');

            const startBtn = document.getElementById('start-btn');
            const startGame = () => {
                if (gameState.started) return;
                document.getElementById('title-screen').classList.add('hidden');
                document.getElementById('ui-overlay').classList.remove('hidden');
                gameState.started = true;
                loadRoom('hall');
                if (navigator.vibrate) navigator.vibrate(30);
                // Hide hint after 5 seconds
                setTimeout(() => {
                    document.getElementById('touch-hint').classList.add('hidden');
                }, 5000);
            };
            startBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });
            startBtn.addEventListener('click', startGame);

            window.addEventListener('resize', onResize);
            animate();
        }

        // ============================================
        // TOUCH CONTROLS - Direct screen touch
        // ============================================
        function setupInput() {
            const container = document.getElementById('game-container');
            const indicator = document.getElementById('touch-indicator');
            let touchId = null;
            let lastTap = 0;

            // Touch start
            container.addEventListener('touchstart', (e) => {
                if (!gameState.started) return;
                e.preventDefault();

                const touch = e.changedTouches[0];
                touchId = touch.identifier;

                // Double tap detection for jump
                const now = Date.now();
                if (now - lastTap < 300) {
                    if (!gameState.isJumping) {
                        gameState.playerVelocity.y = 8;
                        gameState.isJumping = true;
                        if (navigator.vibrate) navigator.vibrate(15);
                    }
                }
                lastTap = now;

                // Show indicator and start movement
                indicator.style.left = touch.clientX + 'px';
                indicator.style.top = touch.clientY + 'px';
                indicator.classList.add('active');

                updateTouchMovement(touch);
                gameState.touchActive = true;
            }, { passive: false });

            // Touch move
            container.addEventListener('touchmove', (e) => {
                if (!gameState.started || !gameState.touchActive) return;
                e.preventDefault();

                const touch = Array.from(e.changedTouches).find(t => t.identifier === touchId);
                if (touch) {
                    indicator.style.left = touch.clientX + 'px';
                    indicator.style.top = touch.clientY + 'px';
                    updateTouchMovement(touch);
                }
            }, { passive: false });

            // Touch end
            const endTouch = () => {
                gameState.touchActive = false;
                gameState.touchInput.x = 0;
                gameState.touchInput.z = 0;
                indicator.classList.remove('active');
                touchId = null;
            };
            container.addEventListener('touchend', endTouch, { passive: false });
            container.addEventListener('touchcancel', endTouch, { passive: false });

            function updateTouchMovement(touch) {
                // Convert screen position to movement direction
                // Touch position relative to screen center
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                const dx = (touch.clientX - cx) / (window.innerWidth / 3);
                const dy = (touch.clientY - cy) / (window.innerHeight / 3);

                // Clamp
                const clampedX = Math.max(-1, Math.min(1, dx));
                const clampedY = Math.max(-1, Math.min(1, dy));

                // Convert to isometric movement
                gameState.touchInput.x = (clampedY - clampedX) * 0.707;
                gameState.touchInput.z = (clampedY + clampedX) * 0.707;
            }

            // Keyboard
            window.addEventListener('keydown', (e) => {
                gameState.keys[e.code] = true;
                if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                    e.preventDefault();
                }
            });
            window.addEventListener('keyup', (e) => gameState.keys[e.code] = false);
        }

        // ============================================
        // PLAYER - Bright colorful character
        // ============================================
        function createPlayer() {
            player = new THREE.Group();

            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x4488ff });
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xffddbb });
            const legMat = new THREE.MeshLambertMaterial({ color: 0x2255aa });

            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.35), bodyMat);
            body.position.y = 0.5;
            body.castShadow = true;
            player.add(body);

            // Head
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 8), skinMat);
            head.position.y = 1.02;
            head.castShadow = true;
            player.add(head);

            // Eyes
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            [-0.08, 0.08].forEach(x => {
                const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), eyeMat);
                eye.position.set(x, 1.05, 0.17);
                player.add(eye);
            });

            // Legs
            [-0.12, 0.12].forEach(x => {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.3, 0.16), legMat);
                leg.position.set(x, 0.15, 0);
                leg.castShadow = true;
                player.add(leg);
            });

            // Arms
            [-0.33, 0.33].forEach(x => {
                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.35, 0.14), bodyMat);
                arm.position.set(x, 0.5, 0);
                arm.castShadow = true;
                player.add(arm);
            });

            scene.add(player);
        }

        // ============================================
        // ROOM LOADING - Bright and clear
        // ============================================
        function loadRoom(roomId) {
            const room = rooms[roomId];
            if (!room) return;

            gameState.currentRoom = roomId;

            while (roomGroup.children.length) roomGroup.remove(roomGroup.children[0]);
            enemies = [];
            collectibles = [];

            document.getElementById('room-name').textContent = room.name;

            // Bright background
            scene.background = new THREE.Color(room.bgColor);

            // Remove old lights
            scene.children = scene.children.filter(c => !(c instanceof THREE.Light));

            // Strong ambient light - no dark areas!
            const ambient = new THREE.AmbientLight(room.ambient, 0.8);
            scene.add(ambient);

            // Bright directional light
            const sun = new THREE.DirectionalLight(room.light, 1.5);
            sun.position.set(8, 15, 8);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 1024;
            sun.shadow.mapSize.height = 1024;
            sun.shadow.camera.near = 1;
            sun.shadow.camera.far = 40;
            sun.shadow.camera.left = -12;
            sun.shadow.camera.right = 12;
            sun.shadow.camera.top = 12;
            sun.shadow.camera.bottom = -12;
            sun.shadow.bias = -0.001;
            scene.add(sun);

            // Fill light from opposite side
            const fill = new THREE.DirectionalLight(0xffffff, 0.4);
            fill.position.set(-5, 8, -5);
            scene.add(fill);

            createFloor(room);
            room.walls.forEach(w => createWall(w, room));
            room.blocks.forEach(b => createBlock(b, room));
            room.enemies.forEach(e => createEnemy(e, room));
            room.items.forEach(i => createItem(i, room));
            room.exits.forEach(e => createExit(e, room));
        }

        function createFloor(room) {
            const g = new THREE.Group();
            const mat1 = new THREE.MeshLambertMaterial({ color: room.floorColor });
            const mat2 = new THREE.MeshLambertMaterial({ color: room.floorColor2 });

            for (let x = -room.width/2; x < room.width/2; x++) {
                for (let z = -room.depth/2; z < room.depth/2; z++) {
                    const tile = new THREE.Mesh(
                        new THREE.BoxGeometry(0.98, 0.15, 0.98),
                        (x + z) % 2 === 0 ? mat1 : mat2
                    );
                    tile.position.set(x + 0.5, -0.075, z + 0.5);
                    tile.receiveShadow = true;
                    g.add(tile);
                }
            }
            roomGroup.add(g);
        }

        function createWall(w, room) {
            const mat1 = new THREE.MeshLambertMaterial({ color: room.wallColor });
            const mat2 = new THREE.MeshLambertMaterial({ color: new THREE.Color(room.wallColor).multiplyScalar(0.85) });
            const g = new THREE.Group();
            const bh = 0.5;

            for (let y = 0; y < 2.5; y += bh) {
                const off = (Math.floor(y / bh) % 2) * 0.5;
                const mat = y % (bh * 2) < bh ? mat1 : mat2;

                if (w.w > w.d) {
                    for (let x = -w.w/2; x < w.w/2; x++) {
                        const brick = new THREE.Mesh(new THREE.BoxGeometry(0.95, bh - 0.03, w.d - 0.03), mat);
                        brick.position.set(w.x + x + 0.5 + off, y + bh/2, w.z);
                        brick.castShadow = true;
                        brick.receiveShadow = true;
                        g.add(brick);
                    }
                } else {
                    for (let z = -w.d/2; z < w.d/2; z++) {
                        const brick = new THREE.Mesh(new THREE.BoxGeometry(w.w - 0.03, bh - 0.03, 0.95), mat);
                        brick.position.set(w.x, y + bh/2, w.z + z + 0.5 + off);
                        brick.castShadow = true;
                        brick.receiveShadow = true;
                        g.add(brick);
                    }
                }
            }
            roomGroup.add(g);
        }

        function createBlock(b, room) {
            if (b.type === 'pedestal') {
                const mat = new THREE.MeshLambertMaterial({ color: 0xccaa88 });
                const g = new THREE.Group();
                g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(b.size*1.2, 0.2, b.size*1.2), mat), {position: new THREE.Vector3(0, 0.1, 0)}));
                g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(b.size*0.3, b.size*0.4, 0.6, 8), mat), {position: new THREE.Vector3(0, 0.5, 0)}));
                g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(b.size*1.1, 0.15, b.size*1.1), mat), {position: new THREE.Vector3(0, 0.85, 0)}));
                g.position.set(b.x, 0, b.z);
                g.children.forEach(c => { c.castShadow = true; c.receiveShadow = true; });
                roomGroup.add(g);
                return;
            }

            const mat = b.type === 'magic'
                ? new THREE.MeshLambertMaterial({ color: 0xaa77ff, emissive: 0x6644aa, emissiveIntensity: 0.3 })
                : new THREE.MeshLambertMaterial({ color: 0x88899a });

            const block = new THREE.Mesh(new THREE.BoxGeometry(b.size, b.size, b.size), mat);
            block.position.set(b.x, b.y, b.z);
            block.castShadow = true;
            block.receiveShadow = true;
            roomGroup.add(block);
        }

        function createEnemy(e, room) {
            const enemy = new THREE.Group();

            if (e.type === 'guardian') {
                const mat = new THREE.MeshLambertMaterial({ color: 0xcc4444 });
                enemy.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), mat), {position: new THREE.Vector3(0, 0.6, 0), castShadow: true}));
                enemy.add(Object.assign(new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.45, 4), mat), {position: new THREE.Vector3(0, 1.22, 0), castShadow: true}));
                enemy.children[1].rotation.y = Math.PI/4;
                const visor = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.1, 0.12), new THREE.MeshBasicMaterial({ color: 0xff3333 }));
                visor.position.set(0, 1.05, 0.22);
                enemy.add(visor);
            } else if (e.type === 'spider') {
                const mat = new THREE.MeshLambertMaterial({ color: 0x333333 });
                enemy.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 6), mat), {position: new THREE.Vector3(0, 0.3, -0.15), castShadow: true}));
                enemy.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 6), mat), {position: new THREE.Vector3(0, 0.3, 0.12), castShadow: true}));
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x44ff44 });
                [[-0.06, 0.38], [0.06, 0.38], [-0.04, 0.32], [0.04, 0.32]].forEach(([x, y]) => {
                    enemy.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 4), eyeMat), {position: new THREE.Vector3(x, y, 0.25)}));
                });
            } else if (e.type === 'ghost') {
                const mat = new THREE.MeshLambertMaterial({ color: 0xccddff, transparent: true, opacity: 0.8 });
                enemy.add(Object.assign(new THREE.Mesh(new THREE.ConeGeometry(0.4, 1, 8), mat), {position: new THREE.Vector3(0, 0.8, 0), castShadow: true}));
                enemy.children[0].rotation.x = Math.PI;
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x333366 });
                [-0.12, 0.12].forEach(x => enemy.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat), {position: new THREE.Vector3(x, 1.1, 0.25)})));
            }

            enemy.position.set(e.x, 0, e.z);
            enemy.userData = { type: e.type, patrol: e.patrol, startX: e.x, startZ: e.z, phase: Math.random() * Math.PI * 2, speed: 0.8 + Math.random() * 0.4 };
            enemies.push(enemy);
            roomGroup.add(enemy);
        }

        function createItem(i, room) {
            const item = new THREE.Group();
            const mat = new THREE.MeshLambertMaterial({ color: i.color, emissive: i.color, emissiveIntensity: 0.4 });

            if (i.type === 'key') {
                item.add(Object.assign(new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.035, 8, 16), mat), {rotation: new THREE.Euler(Math.PI/2, 0, 0)}));
                item.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.32, 0.05), mat), {position: new THREE.Vector3(0, -0.16, 0)}));
            } else if (i.type === 'gem') {
                item.add(new THREE.Mesh(new THREE.OctahedronGeometry(0.18, 0), mat));
            } else if (i.type === 'scroll') {
                item.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.35, 8), mat), {rotation: new THREE.Euler(0, 0, Math.PI/2)}));
            }

            item.position.set(i.x, i.y, i.z);
            item.userData = { type: i.type, collected: false };
            collectibles.push(item);
            roomGroup.add(item);
        }

        function createExit(e, room) {
            const g = new THREE.Group();
            const mat = new THREE.MeshLambertMaterial({ color: 0x66ff66, emissive: 0x33aa33, emissiveIntensity: 0.5 });

            g.add(Object.assign(new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.12, 8, 16, Math.PI), mat), {position: new THREE.Vector3(0, 1.2, 0), rotation: new THREE.Euler(Math.PI/2, 0, 0)}));
            [-0.5, 0.5].forEach(x => g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.2, 0.22), mat), {position: new THREE.Vector3(x, 0.6, 0), castShadow: true})));

            g.position.set(e.x, 0, e.z);
            g.userData = { toRoom: e.toRoom, spawnX: e.spawnX, spawnZ: e.spawnZ, isExit: true };
            roomGroup.add(g);
        }

        // ============================================
        // GAME LOOP
        // ============================================
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            if (gameState.started) {
                updatePlayer(delta, time);
                updateEnemies(time);
                updateCollectibles(time);
                checkCollisions();
            }

            renderer.render(scene, camera);
        }

        function updatePlayer(delta, time) {
            let mx = gameState.touchInput.x;
            let mz = gameState.touchInput.z;

            // Keyboard
            if (gameState.keys['ArrowUp'] || gameState.keys['KeyW']) { mx -= 1; mz -= 1; }
            if (gameState.keys['ArrowDown'] || gameState.keys['KeyS']) { mx += 1; mz += 1; }
            if (gameState.keys['ArrowLeft'] || gameState.keys['KeyA']) { mx -= 1; mz += 1; }
            if (gameState.keys['ArrowRight'] || gameState.keys['KeyD']) { mx += 1; mz -= 1; }

            const len = Math.sqrt(mx*mx + mz*mz);
            if (len > 1) { mx /= len; mz /= len; }
            if (len > 0.1) player.rotation.y = Math.atan2(mx, mz);

            // Keyboard jump
            if ((gameState.keys['Space'] || gameState.keys['KeyX']) && !gameState.isJumping) {
                gameState.playerVelocity.y = 8;
                gameState.isJumping = true;
            }

            gameState.playerVelocity.y -= 22 * delta;
            player.position.x += mx * 4.5 * delta;
            player.position.y += gameState.playerVelocity.y * delta;
            player.position.z += mz * 4.5 * delta;

            if (player.position.y < 0) {
                player.position.y = 0;
                gameState.playerVelocity.y = 0;
                gameState.isJumping = false;
            }

            // Bounds
            const room = rooms[gameState.currentRoom];
            player.position.x = Math.max(-room.width/2 + 0.5, Math.min(room.width/2 - 0.5, player.position.x));
            player.position.z = Math.max(-room.depth/2 + 0.5, Math.min(room.depth/2 - 0.5, player.position.z));

            // Check exits
            roomGroup.children.forEach(c => {
                if (c.userData.isExit) {
                    const dx = player.position.x - c.position.x;
                    const dz = player.position.z - c.position.z;
                    if (Math.sqrt(dx*dx + dz*dz) < 0.8) {
                        if (navigator.vibrate) navigator.vibrate([30, 30, 30]);
                        loadRoom(c.userData.toRoom);
                        player.position.set(c.userData.spawnX, 0, c.userData.spawnZ);
                    }
                }
            });
        }

        function updateEnemies(time) {
            enemies.forEach(e => {
                const d = e.userData;
                const r = 2;
                if (d.patrol === 'circle') {
                    e.position.x = d.startX + Math.cos(time * d.speed + d.phase) * r;
                    e.position.z = d.startZ + Math.sin(time * d.speed + d.phase) * r;
                    e.rotation.y = time * d.speed + d.phase + Math.PI/2;
                } else if (d.patrol === 'horizontal') {
                    e.position.x = d.startX + Math.sin(time * d.speed + d.phase) * r;
                } else if (d.patrol === 'vertical') {
                    e.position.z = d.startZ + Math.sin(time * d.speed + d.phase) * r;
                } else if (d.patrol === 'float') {
                    e.position.y = 0.5 + Math.sin(time * 2 + d.phase) * 0.4;
                    e.rotation.y = time * 0.5;
                }
            });
        }

        function updateCollectibles(time) {
            collectibles.forEach(i => {
                if (!i.userData.collected) {
                    if (!i.userData.oy) i.userData.oy = i.position.y;
                    i.position.y = i.userData.oy + Math.sin(time * 3) * 0.12;
                    i.rotation.y = time * 2;
                }
            });
        }

        function checkCollisions() {
            enemies.forEach(e => {
                const dx = player.position.x - e.position.x;
                const dz = player.position.z - e.position.z;
                if (Math.sqrt(dx*dx + dz*dz) < 0.55) hitPlayer();
            });

            collectibles.forEach(i => {
                if (!i.userData.collected) {
                    const dx = player.position.x - i.position.x;
                    const dy = player.position.y - i.position.y;
                    const dz = player.position.z - i.position.z;
                    if (Math.sqrt(dx*dx + dy*dy + dz*dz) < 0.5) {
                        i.userData.collected = true;
                        i.visible = false;
                        gameState.score += 50;
                        gameState.items.push(i.userData.type);
                        if (navigator.vibrate) navigator.vibrate(20);
                        updateUI();
                    }
                }
            });
        }

        function hitPlayer() {
            gameState.lives--;
            if (navigator.vibrate) navigator.vibrate([80, 40, 80]);

            player.children.forEach(c => {
                if (c.material && c.material.color) {
                    const orig = c.material.color.getHex();
                    c.material.color.setHex(0xff0000);
                    setTimeout(() => c.material.color.setHex(orig), 180);
                }
            });

            gameState.playerVelocity.y = 5;

            if (gameState.lives <= 0) {
                gameState.lives = 3;
                gameState.score = Math.max(0, gameState.score - 100);
                loadRoom('hall');
                player.position.set(0, 0, 0);
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('lives').textContent = '❤️'.repeat(gameState.lives);
            document.getElementById('score').textContent = gameState.score;
            const slots = document.querySelectorAll('.item-slot');
            const sym = { key: '🔑', gem: '💎', scroll: '📜' };
            gameState.items.slice(-3).forEach((it, i) => { if (slots[i]) slots[i].textContent = sym[it] || '?'; });
        }

        function onResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const size = isMobile ? 9 : 11;
            camera.left = -size * aspect / 2;
            camera.right = size * aspect / 2;
            camera.top = size / 2;
            camera.bottom = -size / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
