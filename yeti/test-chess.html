<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Physics Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #e6edf3;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    h1 { margin-bottom: 8px; font-weight: 300; font-size: 1.4rem; }
    p { color: #8b949e; margin-bottom: 12px; font-size: 0.85rem; text-align: center; max-width: 600px; }
    yeti-scene { width: 100%; max-width: 900px; }
  </style>
</head>
<body>

<h1>Chess Physics Arena</h1>
<p>SDF chess pieces on a checkered board. Select pieces and tap to throw! Tap to drop balls.</p>

<yeti-scene mode="physics" width="900" height="500" arena-size="10" checkered ball-colors="red,gold,blue">
  <!-- White pieces (back row) -->
  <yeti-rook pos="-3.5,0,-3"></yeti-rook>
  <yeti-knight pos="-2.5,0,-3"></yeti-knight>
  <yeti-bishop pos="-1.5,0,-3"></yeti-bishop>
  <yeti-queen pos="-0.5,0,-3"></yeti-queen>
  <yeti-king pos="0.5,0,-3"></yeti-king>
  <yeti-bishop pos="1.5,0,-3"></yeti-bishop>
  <yeti-knight pos="2.5,0,-3"></yeti-knight>
  <yeti-rook pos="3.5,0,-3"></yeti-rook>

  <!-- Black pieces (back row) -->
  <yeti-rook pos="-3.5,0,3" black></yeti-rook>
  <yeti-knight pos="-2.5,0,3" black></yeti-knight>
  <yeti-bishop pos="-1.5,0,3" black></yeti-bishop>
  <yeti-queen pos="-0.5,0,3" black></yeti-queen>
  <yeti-king pos="0.5,0,3" black></yeti-king>
  <yeti-bishop pos="1.5,0,3" black></yeti-bishop>
  <yeti-knight pos="2.5,0,3" black></yeti-knight>
  <yeti-rook pos="3.5,0,3" black></yeti-rook>
</yeti-scene>

<script type="module" src="yeti-creature.js"></script>
</body>
</html>
