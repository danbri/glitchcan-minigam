<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Shane Manor Playtest</title>
    <script type="module">
        import * as inkjs from './validation/vendor/ink-full.mjs';
        window.inkjs = inkjs;
        window.inkReady = true;
    </script>
    <style>
        body { font-family: Georgia, serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        #story-output { white-space: pre-wrap; line-height: 1.6; margin-bottom: 20px; }
        #choices { display: flex; flex-direction: column; gap: 10px; }
        #choices button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            border: 1px solid #333;
            background: #f5f5f5;
        }
        #choices button:hover { background: #e0e0e0; }
        .loading { color: #666; font-style: italic; }
        .error { color: red; }
    </style>
</head>
<body>
    <div id="story-output" class="loading">Loading story...</div>
    <div id="choices"></div>

    <script>
    // Wait for module to load, then run
    function waitForInk() {
        if (window.inkReady) {
            loadStory();
        } else {
            setTimeout(waitForInk, 100);
        }
    }

    // Hardcoded path to our enriched Shane Manor story
    const STORY_URL = '_tmp_shane-manor.fink.js';

    let story = null;
    const storyOutput = document.getElementById('story-output');
    const choicesDiv = document.getElementById('choices');

    // Extract INK content from FINK file
    function extractFinkContent(jsContent) {
        const match = jsContent.match(/oooOO`([\s\S]*?)`\s*$/);
        if (!match) throw new Error('No oooOO template literal found');
        return match[1];
    }

    // Display story content
    function showStory() {
        let text = '';
        while (story.canContinue) {
            text += story.Continue() + '\n';
        }

        // Add to output (append, don't replace)
        if (text.trim()) {
            if (storyOutput.classList.contains('loading')) {
                storyOutput.classList.remove('loading');
                storyOutput.textContent = '';
            }
            storyOutput.textContent += text;
        }

        // Show choices
        choicesDiv.innerHTML = '';
        story.currentChoices.forEach((choice, i) => {
            const button = document.createElement('button');
            button.textContent = choice.text;
            button.onclick = () => makeChoice(i);
            choicesDiv.appendChild(button);
        });

        // Scroll to bottom
        window.scrollTo(0, document.body.scrollHeight);
    }

    function makeChoice(index) {
        story.ChooseChoiceIndex(index);
        showStory();
    }

    // Load and compile the story
    async function loadStory() {
        try {
            const response = await fetch(STORY_URL);
            if (!response.ok) throw new Error(`Failed to fetch: ${response.status}`);

            const jsContent = await response.text();
            const inkContent = extractFinkContent(jsContent);

            const compiler = new inkjs.Compiler(inkContent);
            story = compiler.Compile();

            showStory();
        } catch (e) {
            storyOutput.classList.remove('loading');
            storyOutput.classList.add('error');
            storyOutput.textContent = 'Error: ' + e.message;
            console.error(e);
        }
    }

    waitForInk();
    </script>
</body>
</html>
