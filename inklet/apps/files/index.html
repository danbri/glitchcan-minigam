<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Files</title>
<link rel="stylesheet" href="../ui/panes.css">
<link rel="stylesheet" href="files.css">
</head>
<body>
<div class="app">
  <div class="toolbar">
    <button id="places" class="tool panes-toggle" type="button" aria-label="Show folders">☰</button>
    <button id="back" class="tool" type="button" aria-label="Back" title="Back">‹</button>
    <button id="forward" class="tool" type="button" aria-label="Forward" title="Forward">›</button>
    <button id="up" class="tool" type="button" aria-label="Enclosing folder" title="Enclosing folder">↑</button>
    <ol id="crumbs" class="crumbs grow" aria-label="Location"></ol>
    <input id="filter" type="search" aria-label="Filter this folder" placeholder="Filter">
    <select id="sort-pick" class="tool sort-pick" aria-label="Sort by" title="Sort by">
      <option value="name:1">Name A–Z</option><option value="name:-1">Name Z–A</option>
      <option value="modified:-1">Newest</option><option value="modified:1">Oldest</option>
      <option value="size:-1">Largest</option><option value="size:1">Smallest</option>
      <option value="kind:1">Kind</option>
    </select>
    <button id="view" class="tool" type="button" aria-label="Show as icons" aria-pressed="false" title="Show as icons">▦</button>
    <button id="space" class="tool" type="button" aria-pressed="false" title="Where the space goes" aria-label="Show where the space goes">◫</button>
    <button id="new-file" class="tool tool-main" type="button" title="New file">New file</button>
    <button id="new-folder" class="tool" type="button">New folder</button>
    <button id="upload" class="tool" type="button" title="Upload files from this device" aria-label="Upload files">Upload…</button>
    <button id="upload-dir" class="tool upload-dir" type="button" title="Add a folder from this computer">Upload a folder…</button>
    <input id="upload-input" type="file" multiple hidden>
    <input id="upload-dir-input" type="file" webkitdirectory multiple hidden>
  </div>
  <section id="where" class="where" aria-label="Where these files are"></section>
  <div id="panes" class="panes" data-show="items">
    <nav class="pane pane-places" aria-label="Locations and folders">
      <h2 class="side-title" id="favs-title" hidden>Favourites</h2>
      <ul id="favs" class="tree"></ul>
      <h2 class="side-title">Locations</h2>
      <ul id="locations" class="tree"></ul>
      <button id="add-folder" class="tool add-folder" type="button" hidden>Add a folder</button>
      <button id="recent" class="tool add-folder" type="button">🕘 Recent</button>
      <button id="trash" class="tool add-folder" type="button">🗑 Trash</button>
      <h2 class="side-title">Folders</h2>
      <ul id="tree" class="tree"></ul>
    </nav>
    <main class="pane pane-items" id="items-pane" tabindex="-1"><div id="items"></div></main>
    <aside class="pane pane-detail" id="detail" aria-label="Preview"></aside>
  </div>
  <p id="status" class="statusbar" role="status"></p>
</div>
<script src="../app-sdk.js"></script>
<script src="files.js"></script>
</body>
</html>
