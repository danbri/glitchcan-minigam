<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FINK Story Runner</title>
<link rel="stylesheet" href="storyrunner.css">
</head>
<body>
<!-- The narrative runtime, BOXED. This whole page is a foafos app in an
     opaque-origin frame: it compiles and plays a .fink.js entirely in its
     own document, renders prose and choices HERE, styles ITSELF, and
     reaches the shell only through the app protocol (foaf.storyRequest /
     foaf.bus). It has no `parent.FoafOS`, no host DOM — that is the point.
     The live host-side player (inklet/finkapp) is unchanged; this is the
     "sandboxed all the way up" runner proving containment. -->
<!-- THE BROWSER SURFACE IS AN API (owner, 2026-07-30). A non-visual reader, an
     agent, and a sighted reader all drive this same accessibility tree, so the
     names and roles below are a contract rather than decoration: you must be
     able to say WHERE YOU ARE, read WHAT WAS SAID, and find WHAT YOU MAY DO,
     without seeing anything. `inklet/finkapp/test/aria-audit.mjs` §11 holds it.

     The heading is visually hidden because the reading surface is deliberately
     untitled to look at — but with no heading at all there is no landmark to
     jump to, which is how a screen-reader user navigates. It names the story
     from the SHELL's session label, never from guest text. -->
<main id="stage" aria-live="off" aria-labelledby="story-title">
  <h1 id="story-title" class="visually-hidden">Story</h1>
  <!-- the beat's central media; role (hero/feature/accent) sets its size -->
  <div id="media" aria-hidden="false"></div>
  <!-- `tabindex="-1"` so focus can FOLLOW THE READING: after a beat the reader
       caused, the keyboard lands here, at the new prose, and the choices follow
       in DOM order. Without it every choice drops them at the document body. -->
  <div id="prose" role="log" aria-live="polite" aria-relevant="additions"
       tabindex="-1" aria-label="Story text"></div>
  <ul id="choices" aria-label="Choices"></ul>
  <!-- The story's own status line, built from its `# STATUS:` tags.
       Empty and hidden until a story declares something: this runner has
       no hardcoded economy to fall back on. -->
  <div id="statusbar" role="group" aria-label="Story status" hidden></div>
  <p id="status" role="status" aria-live="polite"></p>
</main>

<!-- WHAT THIS RUNNER HAS SEEN (level-1 observability). Its own subtree only,
     newest first, effects rather than state: sessions, dreams, nodes opened
     and closed, games returning. The shell decides what reaches this list;
     see its story.observe handler for why the filter cannot live here.
     `aria-live=off` on purpose — this is a log to consult, not an
     announcement to interrupt a reader with. -->
<details id="watch-panel">
  <summary>Subtree</summary>
  <ul id="watch" aria-label="What this runner has seen" aria-live="off"></ul>
</details>

<!-- app-sdk FIRST: opaque origin, so it stands in for localStorage and
     carries the verb/bus protocol before any runtime code runs. -->
<script src="../app-sdk.js"></script>
<!-- inkjs: the real compiler, global `inkjs`. NO hackparsing (CLAUDE.md). -->
<script src="../../../third_party/ink/ink-full.js"></script>
<script type="module" src="storyrunner.js"></script>
</body>
</html>
