<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notes</title>
<style>
  :root { color-scheme: light dark; --bg: #fdfcf8; --ink: #1d1d1b; --dim: #5c5b55; --line: #cfccc0; --accent: #1f5fa8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181c; --ink: #ecebe6; --dim: #a9a79f; --line: #3a3d44; --accent: #8db8ee; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
  main { height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; padding: 10px; }
  h1 { margin: 0; font-size: 1.05rem; }
  #status { margin: 0; color: var(--dim); min-height: 1.4em; }
  #status.bad { color: #b3261e; }
  .cols { display: grid; grid-template-columns: minmax(8rem, 1fr) 2.4fr; gap: 8px; min-height: 0; }
  @media (max-width: 30rem) { .cols { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }
  ul { list-style: none; margin: 0; padding: 0; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
  li button { width: 100%; text-align: left; padding: 8px; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; font: inherit; min-height: 44px; cursor: pointer; }
  li button[aria-current="true"] { font-weight: 600; color: var(--accent); }
  .editor { display: grid; grid-template-rows: auto 1fr; gap: 6px; min-height: 0; }
  input, textarea { width: 100%; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  textarea { resize: none; min-height: 8rem; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .bar button { min-height: 44px; padding: 0 14px; font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--accent); color: var(--bg); cursor: pointer; }
  .bar button.plain { background: none; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>🗒️ Notes</h1>
  <p id="status" role="status" aria-live="polite">Starting…</p>
  <div class="cols">
    <ul id="notes" aria-label="Notes in your pod"></ul>
    <div class="editor">
      <label><input id="name" placeholder="note name" aria-label="Note name" autocomplete="off"></label>
      <textarea id="text" aria-label="Note text" placeholder="Write here"></textarea>
    </div>
  </div>
  <div class="bar">
    <button type="button" id="save">Save</button>
    <button type="button" id="new" class="plain">New</button>
    <button type="button" id="del" class="plain">Delete</button>
    <button type="button" id="reload" class="plain">Reload</button>
  </div>
</main>
<!-- app-sdk FIRST: it stands in for the storage APIs this opaque-origin
     frame does not have, and gives it foafos.pod. -->
<script src="../app-sdk.js"></script>
<script src="podnotes.js"></script>
</body>
</html>
