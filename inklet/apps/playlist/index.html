<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Playlist</title>
<link rel="stylesheet" href="playlist.css">
</head>
<body>
<main id="playlist">
  <header>
    <h1>Playlist</h1>
    <p id="now" role="status" aria-live="polite">Nothing playing</p>
  </header>

  <div id="transport" role="group" aria-label="Transport">
    <button type="button" id="play" aria-label="Play">
      <span class="sym" aria-hidden="true">▶</span><span class="lbl">Play</span>
    </button>
    <button type="button" id="next" aria-label="Next track">
      <span class="sym" aria-hidden="true">⏭</span><span class="lbl">Next</span>
    </button>
  </div>

  <p id="msg" aria-live="polite"></p>

  <section id="queue-box" aria-labelledby="queue-h">
    <h2 id="queue-h">Queue</h2>
    <p id="empty">Nothing queued. Stories add music here.</p>
    <ol id="queue"></ol>
  </section>

  <form id="add">
    <label for="track">Add a track</label>
    <div class="row">
      <select id="track"></select>
      <button type="submit" id="add-btn">Add</button>
    </div>
  </form>
</main>
<!-- app-sdk FIRST: it stands in for localStorage before any app code
     runs. This app has no ambient authority (opaque origin), so the
     native API would throw SecurityError. -->
<script src="../app-sdk.js"></script>
<script src="../../minigames/guest-a11y.js"></script>
<script type="module" src="playlist.js"></script>
</body>
</html>
