<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Boidwars - Minigame</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0A0F28;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #pause-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: white;
            font-size: 2em;
        }
        #pause-overlay.visible {
            display: flex;
        }
    </style>
</head>
<body>
    <iframe id="game-frame" src="../../../thumbwar/battleboids.html"></iframe>
    <div id="pause-overlay">PAUSED</div>

    <script src="../guest-a11y.js"></script>
    <script src="../debug-clock.js"></script>
    <script src="../minigame-sdk.js"></script>
    <script>
        const sdk = new MinigameSDK();
        const gameFrame = document.getElementById('game-frame');
        let gameStarted = false;

        // The game lives in a nested frame. This wrapper is itself
        // sandboxed with an opaque origin, so contentDocument access to
        // it is BLOCKED — the previous version's auto-start and
        // completion polling were silent no-ops, which is why the game
        // sat on its splash screen and never reported a result. Talk to
        // it over postMessage (thumbwar/battleboids.html installs a
        // matching bridge when it has a parent).
        const toGame = (type) => {
            try { gameFrame.contentWindow?.postMessage({ type }, '*'); } catch (e) { /* not ready */ }
        };
        let bridged = false;
        let wantStart = false;
        let completed = false;

        sdk.onInit((config, variables) => {
            console.log('[Boidwars] Initialized');
            gameStarted = true;
            wantStart = true;
            if (bridged) toGame('boidwars-start');
        });

        sdk.onPause(() => {
            console.log('[Boidwars] Paused');
            document.getElementById('pause-overlay').classList.add('visible');
            toGame('boidwars-pause');
        });

        sdk.onResume(() => {
            console.log('[Boidwars] Resumed');
            document.getElementById('pause-overlay').classList.remove('visible');
            toGame('boidwars-resume');
        });

        sdk.onTerminate((reason) => {
            console.log('[Boidwars] Terminated:', reason);
            toGame('boidwars-pause');
        });

        // The shell resizes this frame for full / split / pip. The nested
        // canvas sizes itself from window.innerHeight, and a nested frame
        // gets no resize event of its own when only its parent's box
        // changed — so forward it, or the canvas keeps its first size.
        const relayResize = () => toGame('boidwars-resize');
        window.addEventListener('resize', relayResize);
        if (window.ResizeObserver) new ResizeObserver(relayResize).observe(document.body);

        window.addEventListener('message', (event) => {
            const d = event.data;
            if (!d || typeof d.type !== 'string') return;
            // The debug clock patches one document. The game is a frame
            // deeper, so pass the message on or slow-mo stops at this
            // wrapper (which has nothing to animate).
            if (d.type === 'debug' && event.source !== gameFrame.contentWindow) {
                try { gameFrame.contentWindow?.postMessage(d, '*'); } catch (e) { /* not ready */ }
            }
            switch (d.type) {
                case 'boidwars-ready':
                    bridged = true;
                    console.log('[Boidwars] game bridge up');
                    if (wantStart) toGame('boidwars-start');
                    break;
                case 'boidwars-state':
                    sdk.progress({ state: d.state });
                    break;
                case 'boidwars-over':
                    if (completed) break;      // gameOver persists; report once
                    completed = true;
                    console.log(`[Boidwars] over: won=${d.won} (${d.message})`);
                    sdk.complete({
                        success: !!d.won,
                        score: d.won ? 100 : 0,
                        variables: { battleboids_won: !!d.won },
                    });
                    break;
            }
        });

        // Route console logs to host
        if (window.parent !== window) {
            const originalLog = console.log;
            let logBatch = [];
            let logTimer = null;

            function flushLogs() {
                if (logBatch.length > 0) {
                    sdk._sendMessage({ type: 'log-batch', logs: logBatch });
                    logBatch = [];
                }
                logTimer = null;
            }

            console.log = function(...args) {
                originalLog.apply(console, args);
                logBatch.push({ level: 'info', message: args.map(String).join(' ') });
                if (!logTimer) logTimer = setTimeout(flushLogs, 1000);
            };
        }
    </script>
</body>
</html>
