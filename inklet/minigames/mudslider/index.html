<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mudslider Mines</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a2e1a;
            color: #e0e0e0;
            font-family: 'Arial', sans-serif;
            display: flex;
            touch-action: manipulation;
        }
        gc-minigam-slovib {
            flex-grow: 1;
            display: flex;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        #pause-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            font-size: 2.5rem;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        #pause-overlay.visible {
            display: flex;
        }
        #pause-overlay p {
            margin-top: 1rem;
            font-size: 1rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="pause-overlay">
        PAUSED
        <p>Waiting for story to resume...</p>
    </div>

    <!-- Load the SDK -->
    <script src="../minigame-sdk.js"></script>

    <!-- Load the game component -->
    <script src="game.js"></script>

    <!-- SDK Bridge and game instantiation -->
    <script>
        // Initialize SDK
        const sdk = new MinigameSDK();

        // Batched log routing (send at most once per second, errors immediately)
        if (window.parent !== window) {
            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;
            let logBatch = [];
            let logTimer = null;

            function flushLogs() {
                if (logBatch.length > 0) {
                    sdk._sendMessage({ type: 'log-batch', logs: logBatch });
                    logBatch = [];
                }
                logTimer = null;
            }

            function queueLog(level, message) {
                logBatch.push({ level, message });
                if (!logTimer) {
                    logTimer = setTimeout(flushLogs, 1000);
                }
            }

            console.log = function(...args) {
                originalLog.apply(console, args);
                queueLog('info', args.map(String).join(' '));
            };
            console.warn = function(...args) {
                originalWarn.apply(console, args);
                queueLog('warn', args.map(String).join(' '));
            };
            console.error = function(...args) {
                originalError.apply(console, args);
                // Errors sent immediately
                sdk._sendMessage({ type: 'log', level: 'error', message: args.map(String).join(' ') });
            };
        }

        // Game state tracking
        let gameState = {
            gemsCollected: 0,
            keysFound: { red: false, blue: false, yellow: false, green: false },
            roomsVisited: new Set(),
            startTime: null,
            gameElement: null
        };

        // Create and add the game element
        function createGame() {
            const game = document.createElement('gc-minigam-slovib');
            document.body.insertBefore(game, document.getElementById('pause-overlay'));
            gameState.gameElement = game;

            // Activate the game
            setTimeout(() => {
                if (game.activate) {
                    game.activate();
                } else {
                    game.classList.add('active');
                }
            }, 100);

            return game;
        }

        // SDK event handlers
        sdk.onInit((config, variables) => {
            console.log('[Mudslider] Initialized with config:', config);
            console.log('[Mudslider] Variables:', variables);
            gameState.startTime = Date.now();

            // Create the game if not already created
            if (!gameState.gameElement) {
                createGame();
            }
        });

        sdk.onPause(() => {
            console.log('[Mudslider] Paused');
            document.getElementById('pause-overlay').classList.add('visible');
            if (gameState.gameElement && gameState.gameElement.deactivate) {
                gameState.gameElement.deactivate();
            }
        });

        sdk.onResume(() => {
            console.log('[Mudslider] Resumed');
            document.getElementById('pause-overlay').classList.remove('visible');
            if (gameState.gameElement && gameState.gameElement.activate) {
                gameState.gameElement.activate();
            }
        });

        sdk.onTerminate((reason) => {
            console.log('[Mudslider] Terminated:', reason);
            if (gameState.gameElement && gameState.gameElement.deactivate) {
                gameState.gameElement.deactivate();
            }
        });

        // Listen for game events
        document.addEventListener('minigame-won', (event) => {
            console.log('[Mudslider] Won!', event.detail);
            const result = event.detail || {};

            sdk.complete({
                success: true,
                score: result.score || gameState.gemsCollected,
                variables: {
                    gems_collected: result.score || gameState.gemsCollected,
                    has_red_key: gameState.keysFound.red,
                    has_blue_key: gameState.keysFound.blue,
                    has_yellow_key: gameState.keysFound.yellow,
                    has_green_key: gameState.keysFound.green,
                    rooms_explored: gameState.roomsVisited.size,
                    minigame_won: true
                }
            });
        });

        document.addEventListener('minigame-lost', (event) => {
            console.log('[Mudslider] Lost!', event.detail);
            const result = event.detail || {};

            sdk.complete({
                success: false,
                score: result.score || gameState.gemsCollected,
                variables: {
                    gems_collected: result.score || gameState.gemsCollected,
                    rooms_explored: gameState.roomsVisited.size,
                    minigame_won: false
                }
            });
        });

        // Periodic progress sync (every 1 second)
        let progressInterval = null;
        function startProgressSync() {
            if (progressInterval) return;
            progressInterval = setInterval(() => {
                if (!gameState.gameElement) return;

                // Try to read score from game component
                const game = gameState.gameElement;
                if (game.playerState && game.playerState.score !== undefined) {
                    const currentGems = game.playerState.score;
                    if (currentGems !== gameState.gemsCollected) {
                        gameState.gemsCollected = currentGems;
                        sdk.progress({ gems: currentGems });
                    }
                }
            }, 1000);
        }

        function stopProgressSync() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        // Start progress sync when game is created
        const originalCreateGame = createGame;
        createGame = function() {
            const game = originalCreateGame();
            startProgressSync();
            return game;
        };

        // If running standalone (not in iframe), auto-create the game
        if (window.parent === window) {
            console.log('[Mudslider] Running standalone');
            document.addEventListener('DOMContentLoaded', () => {
                createGame();
            });
        }

        // When in iframe, hide the footer tabs (clutter) - inject CSS
        if (window.parent !== window) {
            const style = document.createElement('style');
            style.textContent = `
                /* Hide footer UI when running in iframe */
                #footer-ui { display: none !important; }
                /* Maximize play area */
                #game-area { flex: 1; height: 100%; }
            `;
            document.head.appendChild(style);
        }
    </script>
</body>
</html>
