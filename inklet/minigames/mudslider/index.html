<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mudslider Mines</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a2e1a;
            color: #e0e0e0;
            font-family: 'Arial', sans-serif;
            display: flex;
            touch-action: manipulation;
        }
        gc-minigam-slovib {
            flex-grow: 1;
            display: flex;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        #pause-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            font-size: 2.5rem;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        #pause-overlay.visible {
            display: flex;
        }
        #pause-overlay p {
            margin-top: 1rem;
            font-size: 1rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="pause-overlay">
        PAUSED
        <p>Waiting for story to resume...</p>
    </div>

    <!-- Load the SDK -->
    <script src="../guest-a11y.js"></script>
    <script src="../debug-clock.js"></script>
    <script src="../minigame-sdk.js"></script>

    <!-- Load the game component -->
    <script src="game.js"></script>

    <!-- SDK Bridge and game instantiation -->
    <script>
        // Initialize SDK
        const sdk = new MinigameSDK();

        // Batched log routing (send at most once per second, errors immediately)
        if (window.parent !== window) {
            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;
            let logBatch = [];
            let logTimer = null;

            function flushLogs() {
                if (logBatch.length > 0) {
                    sdk._sendMessage({ type: 'log-batch', logs: logBatch });
                    logBatch = [];
                }
                logTimer = null;
            }

            function queueLog(level, message) {
                logBatch.push({ level, message });
                if (!logTimer) {
                    logTimer = setTimeout(flushLogs, 1000);
                }
            }

            console.log = function(...args) {
                originalLog.apply(console, args);
                queueLog('info', args.map(String).join(' '));
            };
            console.warn = function(...args) {
                originalWarn.apply(console, args);
                queueLog('warn', args.map(String).join(' '));
            };
            console.error = function(...args) {
                originalError.apply(console, args);
                // Errors sent immediately
                sdk._sendMessage({ type: 'log', level: 'error', message: args.map(String).join(' ') });
            };
        }

        // Game state tracking
        let gameState = {
            gemsCollected: 0,
            keysFound: { red: false, blue: false, yellow: false, green: false },
            roomsVisited: new Set(),
            startTime: null,
            gameElement: null
        };

        // Create and add the game element
        function createGame() {
            const game = document.createElement('gc-minigam-slovib');
            document.body.insertBefore(game, document.getElementById('pause-overlay'));
            gameState.gameElement = game;

            // Activate the game
            setTimeout(() => {
                if (game.activate) {
                    game.activate();
                } else {
                    game.classList.add('active');
                }
                // Replay the shell's volume: it may have arrived (as part
                // of init) before this element existed.
                game.setMasterLevel?.(lastLevel);
            }, 100);

            return game;
        }

        // SDK event handlers
        // Input is a HOST service. Registering onControls both handles
        // the policy AND tells the shell we speak the contract — a guest
        // that stays silent gets the shell's pad retracted instead, and
        // keeps doing its own thing. This game is the reason: it used to
        // draw these four arrows underneath the shell's joystick.
        function applyControlPolicy(controls) {
            const hostOwnsInput = controls?.provider === 'host';
            const el = gameState.gameElement;
            const root = el && el.shadowRoot;
            if (!root) return;
            let style = root.getElementById('fink-control-policy');
            if (!style) {
                style = document.createElement('style');
                style.id = 'fink-control-policy';
                root.appendChild(style);
            }
            style.textContent = hostOwnsInput ? '#controls { display: none !important; }' : '';
        }
        sdk.onControls((controls) => {
            applyControlPolicy(controls);
            // the custom element may only just have upgraded
            setTimeout(() => applyControlPolicy(controls), 400);
        });

        // Audio is a HOST service too (spec §5.5). Registering onAudio
        // declares the contract, which is what moves this game out of the
        // volume control's "cannot be turned down" list — the shell was
        // telling the truth about that, it just had nothing to hold.
        // Remember the last level: the element may not exist yet when the
        // first one arrives, and a mute that is forgotten is worse than a
        // mute that is refused.
        let lastLevel = 1;
        function applyAudioLevel(level) {
            lastLevel = level;
            gameState.gameElement?.setMasterLevel?.(level);
        }
        window.__mudsliderLevel = () => lastLevel;   // headless probe hook
        sdk.onAudio(({ level }) => {
            applyAudioLevel(level);
            setTimeout(() => applyAudioLevel(level), 400);   // post-upgrade
        });

        sdk.onInit((config, variables) => {
            console.log('[Mudslider] Initialized with config:', config);
            console.log('[Mudslider] Variables:', variables);
            gameState.startTime = Date.now();

            // Create the game if not already created
            if (!gameState.gameElement) {
                createGame();
            }
            applyControlPolicy(config?.controls);

            // Auto-start the game (skip "Ready?" button)
            setTimeout(() => {
                if (gameState.gameElement) {
                    const startOverlay = gameState.gameElement.shadowRoot?.getElementById('start-overlay');
                    if (startOverlay) {
                        startOverlay.style.display = 'none';
                    }
                    // Start the game loop if it has that method
                    if (gameState.gameElement._startGameLoop) {
                        gameState.gameElement._startGameLoop();
                    }
                }
            }, 200);
        });

        sdk.onPause(() => {
            console.log('[Mudslider] Paused');
            document.getElementById('pause-overlay').classList.add('visible');
            if (gameState.gameElement && gameState.gameElement.deactivate) {
                gameState.gameElement.deactivate();
            }
        });

        sdk.onResume(() => {
            console.log('[Mudslider] Resumed');
            document.getElementById('pause-overlay').classList.remove('visible');
            if (gameState.gameElement && gameState.gameElement.activate) {
                gameState.gameElement.activate();
            }
        });

        sdk.onTerminate((reason) => {
            console.log('[Mudslider] Terminated:', reason);
            if (gameState.gameElement && gameState.gameElement.deactivate) {
                gameState.gameElement.deactivate();
            }
        });

        // Listen for game events
        document.addEventListener('minigame-won', (event) => {
            console.log('[Mudslider] Won!', event.detail);
            const result = event.detail || {};

            sdk.complete({
                success: true,
                score: result.score || gameState.gemsCollected,
                variables: {
                    mudslider_gems: result.score || gameState.gemsCollected,
                    has_red_key: gameState.keysFound.red,
                    has_blue_key: gameState.keysFound.blue,
                    has_yellow_key: gameState.keysFound.yellow,
                    has_green_key: gameState.keysFound.green,
                    mudslider_rooms: gameState.roomsVisited.size,
                    mudslider_won: true
                }
            });
        });

        document.addEventListener('minigame-lost', (event) => {
            console.log('[Mudslider] Lost!', event.detail);
            const result = event.detail || {};

            sdk.complete({
                success: false,
                score: result.score || gameState.gemsCollected,
                variables: {
                    mudslider_gems: result.score || gameState.gemsCollected,
                    mudslider_rooms: gameState.roomsVisited.size,
                    mudslider_won: false
                }
            });
        });

        // guest-a11y.js owns announcing: it writes the guest's own live
        // region AND forwards to the shell's pooled announcer. (The SDK
        // has no announce() — calling one would just throw.)
        const say = (t) => window.__mgA11y?.announce?.(t);

        // Periodic progress sync (every 1 second)
        let progressInterval = null;
        function startProgressSync() {
            if (progressInterval) return;
            progressInterval = setInterval(() => {
                if (!gameState.gameElement) return;

                // Try to read score from game component
                const game = gameState.gameElement;
                if (game.playerState && game.playerState.score !== undefined) {
                    const currentGems = game.playerState.score;
                    if (currentGems !== gameState.gemsCollected) {
                        gameState.gemsCollected = currentGems;
                        sdk.progress({ gems: currentGems });
                    }
                }
                // Speak the things a sighted player reads off the board.
                // The whole game is one canvas, so without this a screen
                // reader gets an unlabelled box — and the SHELL's
                // announcer is where the player's attention already is,
                // it survives this window closing, and with several
                // widgets running it is the only place that can say
                // WHICH one spoke. Only on change: a live region that
                // repeats itself is noise.
                const st = game.playerState;
                if (st) {
                    if (st.currentScreenId !== gameState.lastRoom) {
                        gameState.lastRoom = st.currentScreenId;
                        const name = game.shadowRoot?.getElementById('room-name')?.textContent?.trim();
                        say(name ? `Room: ${name}` : `Room ${st.currentScreenId}`);
                    }
                    if (st.lives !== gameState.lastLives) {
                        if (gameState.lastLives !== undefined) {
                            say(st.lives === 0 ? 'No lives left' : `${st.lives} lives left`);
                        }
                        gameState.lastLives = st.lives;
                    }
                    const held = Object.entries(st.keys || {})
                        .filter(([, v]) => v).map(([k]) => k).sort().join(',');
                    if (held !== gameState.lastKeys) {
                        if (gameState.lastKeys && held.length > gameState.lastKeys.length) {
                            say(`Picked up a ${held.split(',').pop()} key`);
                        }
                        gameState.lastKeys = held;
                    }
                }
            }, 1000);
        }

        function stopProgressSync() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        // Start progress sync when game is created
        const originalCreateGame = createGame;
        createGame = function() {
            const game = originalCreateGame();
            startProgressSync();
            return game;
        };

        // If running standalone (not in iframe), auto-create the game
        if (window.parent === window) {
            console.log('[Mudslider] Running standalone');
            document.addEventListener('DOMContentLoaded', () => {
                createGame();
            });
        }

        // When in iframe, hide the footer tabs (clutter) - inject CSS
        if (window.parent !== window) {
            const style = document.createElement('style');
            style.textContent = `
                /* Hide footer UI when running in iframe */
                #footer-ui { display: none !important; }
                /* Maximize play area */
                #game-area { flex: 1; height: 100%; }
            `;
            document.head.appendChild(style);
        }
    </script>
</body>
</html>
