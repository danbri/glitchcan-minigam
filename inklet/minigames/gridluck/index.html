<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GridLuck - Minigame</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        iframe {
            /* An iframe is inline-replaced by default, so it sits on the
               text baseline and the line box reserves descender space
               BELOW it — a 100%-tall iframe then makes the body 4px taller
               than its own frame. `display: block` removes the baseline. */
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
        #pause-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            color: #ff0;
            font-size: 2em;
        }
        #pause-overlay.visible {
            display: flex;
        }
    </style>
</head>
<body>
    <iframe id="game-frame" src="../../../thumbwar/gridluck.html"></iframe>
    <div id="pause-overlay">PAUSED</div>

    <script src="../guest-a11y.js"></script>
    <script src="../debug-clock.js"></script>
    <script src="../../../packages/finkgame/src/minigame-sdk.js"></script>
    <script>
        const sdk = new MinigameSDK();
        const gameFrame = document.getElementById('game-frame');
        let gameActive = false;
        let lastScore = 0;

        sdk.onInit((config, variables) => {
            console.log('[GridLuck] Initialized');
            gameActive = true;
        });

        // The game is a frame deeper: tell it, or it plays on under the
        // shell's frost (owner, September 2026: "pause on Gridluck feels
        // similar yet actually game continues in bg")
        const tellGame = (paused) => { try { gameFrame.contentWindow?.postMessage({ type: 'host-pause', paused }, '*'); } catch (e) { /* not ready */ } };
        sdk.onPause(() => {
            console.log('[GridLuck] Paused');
            document.getElementById('pause-overlay').classList.add('visible');
            tellGame(true);
        });

        sdk.onResume(() => {
            console.log('[GridLuck] Resumed');
            document.getElementById('pause-overlay').classList.remove('visible');
            tellGame(false);
        });

        sdk.onTerminate((reason) => {
            console.log('[GridLuck] Terminated:', reason);
        });

        // The SDK turns a host key press into a KeyboardEvent on THIS
        // document — but the game is a frame deeper, so it never sees it
        // and the shell's pad does nothing. Pass the raw message on;
        // host-keys.js replays it in the game's own frame.
        window.addEventListener('message', (event) => {
            const d = event.data;
            if (!d || d.type !== 'key') return;
            if (event.source === gameFrame.contentWindow) return;
            try { gameFrame.contentWindow?.postMessage(d, '*'); } catch (e) { /* not ready */ }
        });

        // The game's score and its end, as messages from the game's frame. (This page used to read the game's
        // document every second; the opaque sandbox forbids that, so the result never reached the story and the
        // only way out was the close button.)
        window.addEventListener('message', (event) => {
            if (event.source !== gameFrame.contentWindow) return;
            const d = event.data;
            if (!d || !gameActive) return;
            if (d.type === 'host-progress' && typeof d.score === 'number' && d.score !== lastScore) {
                lastScore = d.score;
                sdk.progress({ gems: lastScore, score: lastScore });
            } else if (d.type === 'host-result') {
                const won = !!d.won;
                if (typeof d.score === 'number') lastScore = d.score;
                sdk.complete({ success: won, score: lastScore, variables: { gridluck_won: won, gridluck_score: lastScore } });
                gameActive = false;
            }
        });

        // Route console logs to host
        if (window.parent !== window) {
            const originalLog = console.log;
            let logBatch = [];
            let logTimer = null;

            function flushLogs() {
                if (logBatch.length > 0) {
                    sdk._sendMessage({ type: 'log-batch', logs: logBatch });
                    logBatch = [];
                }
                logTimer = null;
            }

            console.log = function(...args) {
                originalLog.apply(console, args);
                logBatch.push({ level: 'info', message: args.map(String).join(' ') });
                if (!logTimer) logTimer = setTimeout(flushLogs, 1000);
            };
        }
    </script>
</body>
</html>
