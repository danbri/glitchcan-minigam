<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINK 2-Engine Demo: Ink + Minigame</title>
<script src="https://cdn.jsdelivr.net/npm/inkjs/dist/ink-full.min.js"></script>
<script src="fink-namespace-preprocessor.js"></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");
:root {
    --zx-blue: #0050e0; --zx-red: #d80000; --zx-mag: #d000d0;
    --zx-green: #00c000; --zx-cyan: #00c0c0; --zx-yellow: #ffff00;
    --zx-white: #f6f6f6;
}
* { box-sizing: border-box; }
html, body {
    height: 100vh; margin: 0; background: #000 radial-gradient(#111 2px, #000 2px);
    background-size: 4px 4px; display: flex; flex-direction: column;
    font: 14px/1.5 "Press Start 2P", Courier, monospace; color: var(--zx-white);
}
header {
    padding: .5em 1em; background: #000; border-bottom: 4px solid var(--zx-blue);
    display: flex; gap: 1em; align-items: center; flex-wrap: wrap;
}
header h1 { font-size: 14px; margin: 0; color: var(--zx-cyan); }
header button {
    font-family: inherit; font-size: 12px; padding: .5em 1em;
    border: none; cursor: pointer;
}
#restartBtn { background: var(--zx-green); color: #000; }
#viewToggle { background: var(--zx-mag); color: #fff; }
header button:hover { background: var(--zx-red); color: #fff; }
#statusDisplay {
    margin-left: auto; font-size: 10px; color: var(--zx-yellow);
    padding: 0.2em 0.5em; border: 1px dashed var(--zx-yellow);
}

/* Main container */
main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* View switching */
.view { flex: 1; display: none; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }

/* Narrative View */
#narrative-view { padding: 1em; }
#story-output {
    flex: 1; overflow-y: auto; padding: 1em;
    background: rgba(0,20,0,0.5); border: 2px solid var(--zx-green);
    margin-bottom: 1em;
}

/* Text animation styles */
#story-output .text-chunk {
    margin: 0.5em 0;
    animation: chunkAppear 0.6s ease-out forwards;
    opacity: 0;
    transform: translateY(10px) scale(0.95);
    filter: blur(4px);
}

#story-output .text-chunk.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
}

/* Latest chunk gets a glowing lozenge effect */
#story-output .text-chunk.latest {
    background: linear-gradient(90deg, rgba(0,255,255,0.15) 0%, rgba(0,255,0,0.1) 50%, rgba(0,255,255,0.15) 100%);
    border-left: 3px solid var(--zx-cyan);
    padding: 0.5em 0.8em;
    border-radius: 0 8px 8px 0;
    box-shadow: 0 0 15px rgba(0,255,255,0.3), inset 0 0 20px rgba(0,255,255,0.1);
    animation: lozengeGlow 2s ease-in-out infinite, chunkAppear 0.6s ease-out forwards;
}

@keyframes chunkAppear {
    0% { opacity: 0; transform: translateY(10px) scale(0.95); filter: blur(4px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes lozengeGlow {
    0%, 100% { box-shadow: 0 0 15px rgba(0,255,255,0.3), inset 0 0 20px rgba(0,255,255,0.1); }
    50% { box-shadow: 0 0 25px rgba(0,255,255,0.5), inset 0 0 30px rgba(0,255,255,0.2); }
}

/* Remove latest class after animation settles */
#story-output .text-chunk.settled {
    background: transparent;
    border-left: none;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
    animation: none;
    opacity: 1;
    transform: none;
    filter: none;
}

#choices { display: flex; flex-direction: column; gap: 0.5em; }
button.choice {
    padding: .8em; text-align: left; background: #070; color: #0ff;
    border: 2px solid var(--zx-green); font-family: inherit; font-size: 14px; cursor: pointer;
    animation: choiceAppear 0.4s ease-out forwards;
    opacity: 0;
    transform: translateX(-20px);
}
button.choice:nth-child(1) { animation-delay: 0.1s; }
button.choice:nth-child(2) { animation-delay: 0.2s; }
button.choice:nth-child(3) { animation-delay: 0.3s; }
button.choice:nth-child(4) { animation-delay: 0.4s; }

@keyframes choiceAppear {
    0% { opacity: 0; transform: translateX(-20px); }
    100% { opacity: 1; transform: translateX(0); }
}

button.choice:hover { background: var(--zx-red); color: #fff; border-color: var(--zx-red); }

/* Special styles for story content */
.success { color: var(--zx-green); text-shadow: 0 0 10px var(--zx-green); }
.danger { color: var(--zx-red); }
.info { color: var(--zx-cyan); }
.code { font-size: 10px; background: #111; padding: 0.5em; border: 1px solid var(--zx-blue); }
.mega { color: var(--zx-yellow); font-size: 1.2em; text-shadow: 0 0 20px var(--zx-yellow); }

/* Stats bar */
#stats-bar {
    padding: 0.5em 1em; background: #111; border-top: 2px solid var(--zx-blue);
    display: flex; gap: 2em; font-size: 12px; flex-wrap: wrap;
}
.stat { display: flex; align-items: center; gap: 0.5em; }
.stat-icon { font-size: 1.5em; }
.stat-value { color: var(--zx-yellow); }
.stat-value.mega { color: var(--zx-mag); text-shadow: 0 0 10px var(--zx-mag); }

/* Minigame View */
#minigame-view { padding: 1em; align-items: center; justify-content: center; }
#game-container {
    width: 100%; max-width: 400px; aspect-ratio: 1;
    background: #111; border: 4px solid var(--zx-mag);
    position: relative; overflow: hidden;
}
#game-container.mega-mode {
    border-color: var(--zx-yellow);
    box-shadow: 0 0 30px var(--zx-yellow), inset 0 0 50px rgba(255,255,0,0.1);
}
.gem {
    position: absolute; font-size: 2em; cursor: pointer;
    transition: transform 0.1s; user-select: none;
    animation: gemPulse 1s ease-in-out infinite;
}
.gem.mega-gem {
    font-size: 3em;
    animation: megaGemPulse 0.5s ease-in-out infinite;
    filter: drop-shadow(0 0 10px gold);
}
.gem:hover { transform: scale(1.3); }
.gem.collected { animation: gemCollect 0.3s ease-out forwards; pointer-events: none; }
@keyframes gemPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@keyframes megaGemPulse { 0%, 100% { transform: scale(1) rotate(-5deg); } 50% { transform: scale(1.2) rotate(5deg); } }
@keyframes gemCollect { to { transform: scale(2); opacity: 0; } }

#minigame-instructions {
    margin-top: 1em; text-align: center; color: var(--zx-cyan); font-size: 12px;
}
#minigame-score {
    font-size: 1.5em; color: var(--zx-yellow); margin-top: 0.5em;
}
#returnToStory {
    margin-top: 1em; padding: 1em 2em; font-family: inherit; font-size: 14px;
    background: var(--zx-green); color: #000; border: none; cursor: pointer;
}
#returnToStory:hover { background: var(--zx-cyan); }

/* Debug panel */
#debug-panel {
    max-height: 150px; overflow-y: auto; padding: 0.5em;
    background: rgba(0,0,50,0.5); border-top: 2px solid var(--zx-blue);
    font-size: 10px; color: #888; display: none;
}
#debug-panel.visible { display: block; }

/* Hidden sandbox iframe */
#fink-sandbox { display: none; }

/* Links in story */
#story-output a {
    color: var(--zx-cyan);
    text-decoration: underline;
}
#story-output a:hover {
    color: var(--zx-yellow);
}
</style>
</head>
<body>

<header>
    <h1>FINK 2-Engine Demo</h1>
    <button id="restartBtn">Restart</button>
    <button id="viewToggle">View: Story</button>
    <button id="debugToggle">Debug</button>
    <div id="statusDisplay">Ready</div>
</header>

<main>
    <!-- Narrative View -->
    <div id="narrative-view" class="view active">
        <div id="story-output"></div>
        <div id="choices"></div>
    </div>

    <!-- Minigame View -->
    <div id="minigame-view" class="view">
        <div id="game-container"></div>
        <div id="minigame-instructions">Click the gems to collect them!</div>
        <div id="minigame-score">Collected: <span id="gems-collected">0</span></div>
        <button id="returnToStory">Return to Story</button>
    </div>

    <!-- Stats Bar (always visible) -->
    <div id="stats-bar">
        <div class="stat"><span class="stat-icon">💎</span> Diamonds: <span class="stat-value" id="stat-diamonds">0</span></div>
        <div class="stat"><span class="stat-icon">👑</span> Mega: <span class="stat-value mega" id="stat-mega">0</span></div>
        <div class="stat"><span class="stat-icon">🗝️</span> Keys: <span class="stat-value" id="stat-keys">0</span></div>
        <div class="stat"><span class="stat-icon">⭐</span> Score: <span class="stat-value" id="stat-score">0</span></div>
    </div>
</main>

<div id="debug-panel"></div>

<!-- Hidden sandbox for FINK loading -->
<iframe id="fink-sandbox" sandbox="allow-scripts"></iframe>

<script id="ink-story" type="text/ink">
// FINK 2-Engine Demo Story
// Demonstrates Ink variables updated by minigame

VAR diamonds = 0
VAR mega_diamonds = 0
VAR keys = 0
VAR score = 0
VAR minigame_played = false
VAR cavern_explored = false
VAR tried_passage = false

-> intro

=== intro ===
You awaken in a shimmering underground cavern. Crystals gleam in the darkness, casting prismatic light across damp stone walls.

Your pockets are empty. No gems, no keys, nothing.

The only way out is through the locked passage ahead. You'll need to collect gems to escape.

+ [Look around carefully] -> look_around
+ [Call out into the darkness] -> call_out

=== look_around ===
{cavern_explored:
    You've already surveyed the cavern. The gem-studded alcove beckons - your only hope of escape.
    -> cavern_choices
}

~cavern_explored = true
Your eyes adjust to the gloom. You spot:
- A narrow passage with a heavy iron door - LOCKED
- An alcove filled with glittering gems
- Strange symbols carved into the floor

-> cavern_choices

=== cavern_choices ===
+ [Enter the gem alcove] -> gem_alcove
+ [Examine the symbols] -> examine_symbols
+ [Try the narrow passage] -> narrow_passage

=== call_out ===
"Hello?" Your voice echoes endlessly.

Something stirs in the darkness. Perhaps silence would have been wiser.

+ [Hide behind a boulder] -> hide
+ [Stand your ground] -> stand_ground

=== hide ===
You duck behind a large boulder, heart pounding.

The stirring fades. Whatever it was has moved on... for now.

-> look_around

=== stand_ground ===
You plant your feet firmly. A bat swoops past your head and disappears into the darkness.

Just a bat. You exhale with relief.

-> look_around

=== gem_alcove ===
The alcove sparkles with countless gems embedded in the walls!

{diamonds > 0:
    Your pouch holds {diamonds} diamond{diamonds > 1:s}.
}
{diamonds < 5:
    You need at least 5 diamonds to unlock the crystal door.
}

+ [Mine for gems!] -> start_minigame
+ {diamonds >= 5} [Use 5 diamonds to unlock the crystal door] -> crystal_door
+ [Return to the main cavern] -> cavern_choices

=== start_minigame ===
# MINIGAME: gems
You focus your attention on the gem-studded walls...

[The minigame will start - collect as many gems as you can!]

-> gem_alcove_return

=== gem_alcove_return ===
{minigame_played:
    {diamonds > 0:
        # CLASS: success
        Excellent work! You now have {diamonds} diamond{diamonds > 1:s} in your pouch.
        ~score = score + diamonds
    - else:
        # CLASS: danger
        You didn't manage to collect any gems. Try again - you NEED them to escape!
    }
}

-> gem_alcove

=== crystal_door ===
{diamonds < 5:
    # CLASS: danger
    The crystal door requires 5 diamonds to open. You only have {diamonds}.
    -> gem_alcove
}

You press 5 diamonds into the door's receptacles. They glow brilliantly!

~diamonds = diamonds - 5
~keys = keys + 1

# CLASS: success
The door slides open, revealing a golden key floating in mid-air!

You take the key. It feels warm in your hand.

+ [Take the key and head for the exit!] -> narrow_passage

=== examine_symbols ===
The symbols appear to be an ancient counting system.

{diamonds > 0:
    Curiously, the number {diamonds} seems highlighted.
}

The inscription reads: "Five gems open the crystal gate. Beyond lies the key to freedom."

{diamonds < 5:
    # CLASS: info
    You definitely need to collect more gems from the alcove.
}

+ [Understood.] -> cavern_choices

=== narrow_passage ===
{keys < 1:
    ~tried_passage = true
    The passage ends at a locked iron door. The lock looks complex.

    # CLASS: danger
    You need a key! The crystal door in the gem alcove might hold one...

    + [Return to the cavern] -> cavern_choices
}

Your golden key fits the lock perfectly!

~keys = keys - 1
~score = score + 100

# CLASS: success
The door swings open to reveal daylight streaming in from above!

-> victory

=== victory ===
# CLASS: success
You climb toward the light and emerge onto a hillside overlooking a peaceful valley.

ESCAPED! Final Score: {score} points

{mega_diamonds > 0:
    # CLASS: mega
    MEGA DIAMOND BONUS: {mega_diamonds * 1000} points!
    ~score = score + (mega_diamonds * 1000)
}

But wait... in the distance, you see a shimmering portal leading to deeper caverns. Legends speak of MEGA DIAMONDS worth 1000x more!

+ [Enter the Mega Diamond Dimension!] -> load_chapter2
+ [View how this demo works] -> how_it_works
+ [Play again?] -> restart

=== load_chapter2 ===
# FINK: hamfink2026-ch2.fink.js
# CLASS: mega
You step through the portal into a realm of pure crystalline energy...

-> external_loading

=== external_loading ===
Loading next chapter...

-> victory

=== how_it_works ===
# CLASS: info
--- HOW THIS 2-ENGINE DEMO WORKS ---

This demo shows Ink + JavaScript (minigame) integration:

1. Story declares variables (diamonds, keys, score)
2. MINIGAME tag triggers the JavaScript gem collector
3. When you return, JavaScript updates Ink's variablesState
4. Ink text responds: "You have X diamonds"

+ [View source code on GitHub] -> github_links
+ [Return to ending] -> victory

=== github_links ===
# CLASS: code
SOURCE CODE:

Story + Engine:
hamfink2026.html

Chapter 2 (FINK):
hamfink2026-ch2.fink.js

The # FINK: tag loads external .fink.js files using a JSONP-like sandbox approach - the same technique that powers the full FINK player.

+ [Back to ending] -> victory
+ [Play again?] -> restart

=== restart ===
~diamonds = 0
~mega_diamonds = 0
~keys = 0
~score = 0
~minigame_played = false
~cavern_explored = false
~tried_passage = false

-> intro

</script>

<script>
(function() {
    'use strict';

    // --- Configuration ---
    const GEM_SPAWN_COUNT = 8;
    const GEM_SPAWN_INTERVAL = 1500;
    const MAX_GEMS_PER_ROUND = 15;
    const GEM_EMOJIS = ['💎', '💠', '🔷', '🔹'];
    const MEGA_GEM_EMOJIS = ['👑', '💛', '🌟', '✨'];

    // --- State ---
    let story = null;
    let currentView = 'narrative';
    let minigameActive = false;
    let minigameMode = 'normal'; // 'normal' or 'mega'
    let gemsCollectedThisRound = 0;
    let gemSpawnTimer = null;
    let totalGemsSpawned = 0;
    let pendingFinkUrl = null;
    let currentLoadingFinkUrl = null;  // Track URL for namespace derivation

    // --- DOM Elements ---
    const storyOutput = document.getElementById('story-output');
    const choicesContainer = document.getElementById('choices');
    const narrativeView = document.getElementById('narrative-view');
    const minigameView = document.getElementById('minigame-view');
    const gameContainer = document.getElementById('game-container');
    const gemsCollectedDisplay = document.getElementById('gems-collected');
    const returnToStoryBtn = document.getElementById('returnToStory');
    const viewToggleBtn = document.getElementById('viewToggle');
    const restartBtn = document.getElementById('restartBtn');
    const debugToggleBtn = document.getElementById('debugToggle');
    const debugPanel = document.getElementById('debug-panel');
    const statusDisplay = document.getElementById('statusDisplay');
    const finkSandbox = document.getElementById('fink-sandbox');
    const minigameInstructions = document.getElementById('minigame-instructions');

    // Stats display
    const statDiamonds = document.getElementById('stat-diamonds');
    const statMega = document.getElementById('stat-mega');
    const statKeys = document.getElementById('stat-keys');
    const statScore = document.getElementById('stat-score');

    // --- Debug Logging ---
    function log(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.textContent = `[${timestamp}] ${type.toUpperCase()}: ${message}`;
        entry.style.color = type === 'error' ? '#f55' : type === 'warn' ? '#ff0' : '#8f8';
        debugPanel.appendChild(entry);
        debugPanel.scrollTop = debugPanel.scrollHeight;
        console.log(`[${type}] ${message}`);
    }

    function setStatus(text) {
        statusDisplay.textContent = text;
    }

    // --- View Management ---
    function switchView(viewName) {
        currentView = viewName;
        narrativeView.classList.toggle('active', viewName === 'narrative');
        minigameView.classList.toggle('active', viewName === 'minigame');
        viewToggleBtn.textContent = `View: ${viewName === 'narrative' ? 'Story' : 'Minigame'}`;
        log(`Switched to ${viewName} view`);
    }

    // --- Stats Update ---
    function updateStatsDisplay() {
        if (!story) return;
        try {
            statDiamonds.textContent = story.variablesState['diamonds'] || 0;
            statMega.textContent = story.variablesState['mega_diamonds'] || 0;
            statKeys.textContent = story.variablesState['keys'] || 0;
            statScore.textContent = story.variablesState['score'] || 0;
        } catch (e) {
            log(`Error updating stats: ${e.message}`, 'error');
        }
    }

    // --- Animated Text Display ---
    function displayTextWithAnimation(text, cssClass = '') {
        // Remove 'latest' class from previous chunks
        const previousLatest = storyOutput.querySelectorAll('.text-chunk.latest');
        previousLatest.forEach(el => {
            el.classList.remove('latest');
            el.classList.add('settled');
        });

        const chunk = document.createElement('div');
        chunk.className = `text-chunk latest ${cssClass}`.trim();

        // Handle links in text (for GitHub URLs)
        const linkPattern = /(https?:\/\/[^\s]+|hamfink2026[^\s]*\.(?:html|js))/g;
        const htmlText = text.replace(linkPattern, (match) => {
            if (match.startsWith('http')) {
                return `<a href="${match}" target="_blank">${match}</a>`;
            } else {
                // Local file reference
                const baseUrl = 'https://github.com/danbri/glitchcan-minigam/blob/main/inklet/demos/';
                return `<a href="${baseUrl}${match}" target="_blank">${match}</a>`;
            }
        });

        chunk.innerHTML = htmlText;
        storyOutput.appendChild(chunk);

        // Trigger animation
        requestAnimationFrame(() => {
            chunk.classList.add('visible');
        });

        // Remove latest highlight after a delay
        setTimeout(() => {
            chunk.classList.remove('latest');
            chunk.classList.add('settled');
        }, 3000);

        // Auto-scroll
        storyOutput.scrollTop = storyOutput.scrollHeight;
    }

    // --- Ink Story Engine ---
    function initStory(inkSource = null) {
        const source = inkSource || document.getElementById('ink-story').textContent;
        try {
            log('Compiling Ink story...');
            const compiler = new inkjs.Compiler(source);
            story = compiler.Compile();

            if (compiler.errors && compiler.errors.length > 0) {
                throw new Error('Compilation errors: ' + compiler.errors.join('\n'));
            }
            log('Story compiled successfully');
            setStatus('Story ready');
            continueStory();
        } catch (e) {
            log(`Compilation error: ${e.message}`, 'error');
            setStatus('Compile error!');
            displayTextWithAnimation(`Error: ${e.message}`, 'danger');
        }
    }

    function continueStory() {
        if (!story) return;

        let shouldStartMinigame = false;
        let minigameType = 'normal';

        while (story.canContinue) {
            const text = story.Continue();
            const tags = story.currentTags || [];

            log(`Text: "${text.trim()}" | Tags: ${tags.join(', ') || 'none'}`);

            let cssClass = '';

            // Process tags
            for (const tag of tags) {
                if (tag.startsWith('MINIGAME:')) {
                    shouldStartMinigame = true;
                    const type = tag.replace('MINIGAME:', '').trim();
                    minigameType = type === 'mega' ? 'mega' : 'normal';
                    log(`Minigame tag detected! Type: ${minigameType}`, 'warn');
                }
                if (tag.startsWith('CLASS:')) {
                    cssClass = tag.replace('CLASS:', '').trim();
                }
                if (tag.startsWith('FINK:')) {
                    pendingFinkUrl = tag.replace('FINK:', '').trim();
                    log(`FINK tag detected: ${pendingFinkUrl}`, 'warn');
                }
            }

            // Display text with animation
            if (text.trim()) {
                displayTextWithAnimation(text.trim(), cssClass);
            }
        }

        // Update stats
        updateStatsDisplay();

        // Handle FINK loading
        if (pendingFinkUrl && !shouldStartMinigame) {
            setTimeout(() => loadFinkFile(pendingFinkUrl), 500);
            pendingFinkUrl = null;
            return;
        }

        // Start minigame if triggered
        if (shouldStartMinigame) {
            setTimeout(() => startMinigame(minigameType), 800);
            return;
        }

        // Display choices
        displayChoices();
    }

    function displayChoices() {
        choicesContainer.innerHTML = '';

        if (!story || story.currentChoices.length === 0) {
            log('No choices available (story end or waiting)');
            return;
        }

        story.currentChoices.forEach((choice, index) => {
            const btn = document.createElement('button');
            btn.className = 'choice';
            btn.textContent = `${index + 1}. ${choice.text}`;
            btn.addEventListener('click', () => selectChoice(index));
            choicesContainer.appendChild(btn);
        });

        log(`Displayed ${story.currentChoices.length} choices`);
    }

    function selectChoice(index) {
        log(`Selected choice ${index}: ${story.currentChoices[index].text}`);
        story.ChooseChoiceIndex(index);
        continueStory();
    }

    // --- FINK External Loading ---
    function loadFinkFile(url) {
        log(`Loading FINK file: ${url}`);
        setStatus(`Loading ${url}...`);

        // Resolve relative URL
        const resolvedUrl = new URL(url, window.location.href).href;
        log(`Resolved URL: ${resolvedUrl}`);

        // Track URL for namespace derivation in handleFinkLoaded
        currentLoadingFinkUrl = resolvedUrl;

        // Create sandbox content
        const sandboxHtml = `
            <!DOCTYPE html>
            <html>
            <head><script>
                window.finkData = [];
                function oooOO(strings) {
                    const content = (typeof strings === 'object' && strings.raw)
                        ? strings.raw.join('')
                        : String(strings);
                    window.finkData.push(content);
                    return content;
                }
                window.addEventListener('message', function(e) {
                    if (e.data && e.data.type === 'load-script') {
                        const script = document.createElement('script');
                        script.onload = function() {
                            parent.postMessage({ type: 'fink-loaded', data: window.finkData }, '*');
                        };
                        script.onerror = function() {
                            parent.postMessage({ type: 'fink-error', error: 'Script load failed' }, '*');
                        };
                        script.src = e.data.url;
                        document.body.appendChild(script);
                    }
                });
                parent.postMessage({ type: 'sandbox-ready' }, '*');
            <\/script></head>
            <body></body>
            </html>
        `;

        // Set up message listener
        const messageHandler = function(e) {
            if (e.data.type === 'sandbox-ready') {
                finkSandbox.contentWindow.postMessage({ type: 'load-script', url: resolvedUrl }, '*');
            } else if (e.data.type === 'fink-loaded') {
                window.removeEventListener('message', messageHandler);
                handleFinkLoaded(e.data.data);
            } else if (e.data.type === 'fink-error') {
                window.removeEventListener('message', messageHandler);
                log(`FINK load error: ${e.data.error}`, 'error');
                setStatus('FINK load failed');
                displayTextWithAnimation(`Failed to load chapter: ${e.data.error}`, 'danger');
                displayChoices();
            }
        };

        window.addEventListener('message', messageHandler);
        finkSandbox.srcdoc = sandboxHtml;
    }

    function handleFinkLoaded(dataArray) {
        if (!dataArray || dataArray.length === 0) {
            log('FINK loaded but no content found', 'error');
            setStatus('FINK empty');
            return;
        }

        // Use only the first oooOO block (avoid duplicates if script runs twice)
        const finkContent = dataArray[0];
        log(`FINK content loaded: ${finkContent.length} chars (${dataArray.length} block(s))`);
        setStatus('Chapter loaded!');

        // Store current state for IMPORT injection
        const savedState = story ? {
            diamonds: story.variablesState['diamonds'],
            mega_diamonds: story.variablesState['mega_diamonds'],
            keys: story.variablesState['keys'],
            score: story.variablesState['score']
        } : null;

        // --- STRAWMAN: Namespace Preprocessor ---
        // Use FinkNamespacePreprocessor if available, fallback to legacy VAR stripping
        let processedContent = finkContent;
        let nsResult = null;

        if (typeof FinkNamespacePreprocessor !== 'undefined') {
            log('[NS] Using FinkNamespacePreprocessor (STRAWMAN)');
            nsResult = FinkNamespacePreprocessor.transform(
                finkContent,
                currentLoadingFinkUrl || 'unknown.fink.js',
                { debug: true }
            );
            processedContent = nsResult.content;
            log(`[NS] Namespace: ${nsResult.namespace}, Imports: [${nsResult.imports.join(', ')}]`);
        } else if (savedState) {
            // Legacy fallback: Strip VAR declarations for variables we're carrying over
            log('[NS] Preprocessor not loaded, using legacy VAR stripping');
            const varsToStrip = Object.keys(savedState);
            log(`Stripping VAR declarations for: ${varsToStrip.join(', ')}`);
            varsToStrip.forEach(varName => {
                const varPattern = new RegExp(`^\\s*VAR\\s+${varName}\\s*=.*$`, 'gm');
                processedContent = processedContent.replace(varPattern, `// [IMPORTED: ${varName}]`);
            });
        }

        // Clear output for new chapter
        storyOutput.innerHTML = '';
        choicesContainer.innerHTML = '';

        // Compile and run the new story
        initStory(processedContent);

        // Inject imported values from parent state
        if (savedState && story) {
            if (nsResult && nsResult.imports.length > 0) {
                // Use preprocessor's import list
                log(`[NS] Injecting imports: ${nsResult.imports.join(', ')}`);
                FinkNamespacePreprocessor.injectImports(story, nsResult.imports, savedState);
            } else {
                // Legacy: restore all saved state
                story.variablesState['diamonds'] = savedState.diamonds;
                story.variablesState['mega_diamonds'] = savedState.mega_diamonds;
                story.variablesState['keys'] = savedState.keys;
                story.variablesState['score'] = savedState.score;
            }
            updateStatsDisplay();
        }
    }

    // --- Minigame ---
    function startMinigame(mode = 'normal') {
        log(`Starting ${mode} gem minigame!`);
        setStatus(`${mode === 'mega' ? 'MEGA ' : ''}Minigame active!`);

        minigameActive = true;
        minigameMode = mode;
        gemsCollectedThisRound = 0;
        totalGemsSpawned = 0;
        gemsCollectedDisplay.textContent = '0';
        gameContainer.innerHTML = '';

        // Update UI for mega mode
        gameContainer.classList.toggle('mega-mode', mode === 'mega');
        minigameInstructions.textContent = mode === 'mega'
            ? 'Catch the MEGA GEMS! Each worth 1000x!'
            : 'Click the gems to collect them!';

        switchView('minigame');

        // Spawn initial gems
        const spawnCount = mode === 'mega' ? 4 : GEM_SPAWN_COUNT;
        for (let i = 0; i < spawnCount; i++) {
            spawnGem();
        }

        // Continue spawning
        const interval = mode === 'mega' ? 2000 : GEM_SPAWN_INTERVAL;
        const maxGems = mode === 'mega' ? 10 : MAX_GEMS_PER_ROUND;

        gemSpawnTimer = setInterval(() => {
            if (totalGemsSpawned < maxGems) {
                spawnGem();
            } else {
                clearInterval(gemSpawnTimer);
            }
        }, interval);
    }

    function spawnGem() {
        if (!minigameActive) return;

        totalGemsSpawned++;

        const gem = document.createElement('div');
        const isMega = minigameMode === 'mega';
        gem.className = isMega ? 'gem mega-gem' : 'gem';

        const emojis = isMega ? MEGA_GEM_EMOJIS : GEM_EMOJIS;
        gem.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        // Random position (with padding)
        const padding = 10;
        const size = isMega ? 60 : 40;
        const maxX = gameContainer.clientWidth - size;
        const maxY = gameContainer.clientHeight - size;
        gem.style.left = (padding + Math.random() * (maxX - padding)) + 'px';
        gem.style.top = (padding + Math.random() * (maxY - padding)) + 'px';

        gem.addEventListener('click', () => collectGem(gem));

        gameContainer.appendChild(gem);

        // Auto-remove after a while if not collected
        const timeout = isMega ? 3000 : 5000;
        setTimeout(() => {
            if (gem.parentNode && !gem.classList.contains('collected')) {
                gem.remove();
            }
        }, timeout);
    }

    function collectGem(gemElement) {
        if (!minigameActive || gemElement.classList.contains('collected')) return;

        gemElement.classList.add('collected');
        gemsCollectedThisRound++;
        gemsCollectedDisplay.textContent = gemsCollectedThisRound;

        // Play sound
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (minigameMode === 'mega') {
                // Epic sound for mega gems
                osc.frequency.value = 1200 + Math.random() * 400;
                gain.gain.value = 0.15;
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } else {
                osc.frequency.value = 800 + Math.random() * 400;
                gain.gain.value = 0.1;
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            }
        } catch (e) { /* Audio not available */ }

        setTimeout(() => gemElement.remove(), 300);

        log(`Collected ${minigameMode === 'mega' ? 'MEGA ' : ''}gem! Total: ${gemsCollectedThisRound}`);
    }

    function endMinigame() {
        log(`Minigame ended. Mode: ${minigameMode}, Collected: ${gemsCollectedThisRound}`);
        setStatus('Returning to story...');

        minigameActive = false;
        clearInterval(gemSpawnTimer);
        gameContainer.classList.remove('mega-mode');

        // UPDATE INK VARIABLES WITH MINIGAME RESULTS!
        if (story) {
            if (minigameMode === 'mega') {
                const oldMega = story.variablesState['mega_diamonds'] || 0;
                story.variablesState['mega_diamonds'] = oldMega + gemsCollectedThisRound;
                log(`Updated Ink: mega_diamonds ${oldMega} -> ${story.variablesState['mega_diamonds']}`, 'warn');
            } else {
                const oldDiamonds = story.variablesState['diamonds'] || 0;
                story.variablesState['diamonds'] = oldDiamonds + gemsCollectedThisRound;
                log(`Updated Ink: diamonds ${oldDiamonds} -> ${story.variablesState['diamonds']}`, 'warn');
            }
            story.variablesState['minigame_played'] = true;
        }

        // Switch back to narrative
        switchView('narrative');
        updateStatsDisplay();

        // Continue the story
        continueStory();
    }

    // --- Event Listeners ---
    returnToStoryBtn.addEventListener('click', endMinigame);

    viewToggleBtn.addEventListener('click', () => {
        if (!minigameActive) {
            switchView(currentView === 'narrative' ? 'minigame' : 'narrative');
        }
    });

    restartBtn.addEventListener('click', () => {
        log('Restarting story...');
        storyOutput.innerHTML = '';
        choicesContainer.innerHTML = '';
        minigameActive = false;
        minigameMode = 'normal';
        clearInterval(gemSpawnTimer);
        gameContainer.classList.remove('mega-mode');
        switchView('narrative');
        initStory();
    });

    debugToggleBtn.addEventListener('click', () => {
        debugPanel.classList.toggle('visible');
    });

    // --- Initialize ---
    log('FINK 2-Engine Demo initializing...');
    initStory();

})();
</script>
