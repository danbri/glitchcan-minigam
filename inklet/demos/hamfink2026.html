<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINK 2-Engine Demo: Ink + Minigame</title>
<script src="https://cdn.jsdelivr.net/npm/inkjs/dist/ink-full.min.js"></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");
:root {
    --zx-blue: #0050e0; --zx-red: #d80000; --zx-mag: #d000d0;
    --zx-green: #00c000; --zx-cyan: #00c0c0; --zx-yellow: #ffff00;
    --zx-white: #f6f6f6;
}
* { box-sizing: border-box; }
html, body {
    height: 100vh; margin: 0; background: #000 radial-gradient(#111 2px, #000 2px);
    background-size: 4px 4px; display: flex; flex-direction: column;
    font: 14px/1.5 "Press Start 2P", Courier, monospace; color: var(--zx-white);
}
header {
    padding: .5em 1em; background: #000; border-bottom: 4px solid var(--zx-blue);
    display: flex; gap: 1em; align-items: center; flex-wrap: wrap;
}
header h1 { font-size: 14px; margin: 0; color: var(--zx-cyan); }
header button {
    font-family: inherit; font-size: 12px; padding: .5em 1em;
    border: none; cursor: pointer;
}
#restartBtn { background: var(--zx-green); color: #000; }
#viewToggle { background: var(--zx-mag); color: #fff; }
header button:hover { background: var(--zx-red); color: #fff; }
#statusDisplay {
    margin-left: auto; font-size: 10px; color: var(--zx-yellow);
    padding: 0.2em 0.5em; border: 1px dashed var(--zx-yellow);
}

/* Main container */
main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* View switching */
.view { flex: 1; display: none; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }

/* Narrative View */
#narrative-view { padding: 1em; }
#story-output { flex: 1; overflow-y: auto; padding: 1em; background: rgba(0,20,0,0.5); border: 2px solid var(--zx-green); margin-bottom: 1em; }
#story-output p { margin: .5em 0; animation: flash .1s ease-out; }
@keyframes flash { from { outline: 1px solid var(--zx-cyan); } to { outline: none; } }
#choices { display: flex; flex-direction: column; gap: 0.5em; }
button.choice {
    padding: .8em; text-align: left; background: #070; color: #0ff;
    border: 2px solid var(--zx-green); font-family: inherit; font-size: 14px; cursor: pointer;
}
button.choice:hover { background: var(--zx-red); color: #fff; border-color: var(--zx-red); }

/* Stats bar */
#stats-bar {
    padding: 0.5em 1em; background: #111; border-top: 2px solid var(--zx-blue);
    display: flex; gap: 2em; font-size: 12px;
}
.stat { display: flex; align-items: center; gap: 0.5em; }
.stat-icon { font-size: 1.5em; }
.stat-value { color: var(--zx-yellow); }

/* Minigame View */
#minigame-view { padding: 1em; align-items: center; justify-content: center; }
#game-container {
    width: 100%; max-width: 400px; aspect-ratio: 1;
    background: #111; border: 4px solid var(--zx-mag);
    position: relative; overflow: hidden;
}
.gem {
    position: absolute; font-size: 2em; cursor: pointer;
    transition: transform 0.1s; user-select: none;
    animation: gemPulse 1s ease-in-out infinite;
}
.gem:hover { transform: scale(1.3); }
.gem.collected { animation: gemCollect 0.3s ease-out forwards; pointer-events: none; }
@keyframes gemPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@keyframes gemCollect { to { transform: scale(2); opacity: 0; } }

#minigame-instructions {
    margin-top: 1em; text-align: center; color: var(--zx-cyan); font-size: 12px;
}
#minigame-score {
    font-size: 1.5em; color: var(--zx-yellow); margin-top: 0.5em;
}
#returnToStory {
    margin-top: 1em; padding: 1em 2em; font-family: inherit; font-size: 14px;
    background: var(--zx-green); color: #000; border: none; cursor: pointer;
}
#returnToStory:hover { background: var(--zx-cyan); }

/* Debug panel */
#debug-panel {
    max-height: 150px; overflow-y: auto; padding: 0.5em;
    background: rgba(0,0,50,0.5); border-top: 2px solid var(--zx-blue);
    font-size: 10px; color: #888; display: none;
}
#debug-panel.visible { display: block; }
</style>
</head>
<body>

<header>
    <h1>FINK 2-Engine Demo</h1>
    <button id="restartBtn">Restart</button>
    <button id="viewToggle">View: Story</button>
    <button id="debugToggle">Debug</button>
    <div id="statusDisplay">Ready</div>
</header>

<main>
    <!-- Narrative View -->
    <div id="narrative-view" class="view active">
        <div id="story-output"></div>
        <div id="choices"></div>
    </div>

    <!-- Minigame View -->
    <div id="minigame-view" class="view">
        <div id="game-container"></div>
        <div id="minigame-instructions">Click the gems to collect them!</div>
        <div id="minigame-score">Collected: <span id="gems-collected">0</span></div>
        <button id="returnToStory">Return to Story</button>
    </div>

    <!-- Stats Bar (always visible) -->
    <div id="stats-bar">
        <div class="stat"><span class="stat-icon">💎</span> Diamonds: <span class="stat-value" id="stat-diamonds">0</span></div>
        <div class="stat"><span class="stat-icon">🗝️</span> Keys: <span class="stat-value" id="stat-keys">0</span></div>
        <div class="stat"><span class="stat-icon">⭐</span> Score: <span class="stat-value" id="stat-score">0</span></div>
    </div>
</main>

<div id="debug-panel"></div>

<script id="ink-story" type="text/ink">
// FINK 2-Engine Demo Story
// Demonstrates Ink variables updated by minigame

VAR diamonds = 0
VAR keys = 0
VAR score = 0
VAR minigame_played = false
VAR cavern_explored = false

-> intro

=== intro ===
You awaken in a shimmering underground cavern. Crystals gleam in the darkness, casting prismatic light across damp stone walls.

Your pockets are empty. No gems, no keys, nothing.

+ [Look around carefully] -> look_around
+ [Call out into the darkness] -> call_out

=== look_around ===
{cavern_explored:
    You've already surveyed the cavern. The gem-studded alcove still beckons.
    -> cavern_choices
}

~cavern_explored = true
Your eyes adjust to the gloom. You spot:
- A narrow passage leading deeper into the caves
- An alcove filled with glittering gems
- Strange symbols carved into the floor

-> cavern_choices

=== cavern_choices ===
+ [Enter the gem alcove] -> gem_alcove
+ [Examine the symbols] -> examine_symbols
+ [Take the narrow passage] -> narrow_passage

=== call_out ===
"Hello?" Your voice echoes endlessly.

Something stirs in the darkness. Perhaps silence would have been wiser.

+ [Hide behind a boulder] -> hide
+ [Stand your ground] -> stand_ground

=== hide ===
You duck behind a large boulder, heart pounding.

The stirring fades. Whatever it was has moved on... for now.

-> look_around

=== stand_ground ===
You plant your feet firmly. A bat swoops past your head and disappears into the darkness.

Just a bat. You exhale with relief.

-> look_around

=== gem_alcove ===
The alcove sparkles with countless gems embedded in the walls!

{diamonds > 0:
    You've already collected {diamonds} diamond{diamonds > 1:s} from your mining expedition.
}

+ [Play the gem mining minigame!] -> start_minigame
+ {diamonds >= 5} [Use diamonds to unlock the crystal door] -> crystal_door
+ [Return to the main cavern] -> cavern_choices

=== start_minigame ===
# MINIGAME: gems
You focus your attention on the gem-studded walls...

[The minigame will start - collect as many gems as you can!]

-> gem_alcove_return

=== gem_alcove_return ===
{minigame_played:
    {diamonds > 0:
        Excellent work! You now have {diamonds} diamond{diamonds > 1:s} in your pouch.
        ~score = score + diamonds
    - else:
        You didn't manage to collect any gems this time.
    }
}

-> gem_alcove

=== crystal_door ===
{diamonds < 5:
    The crystal door requires 5 diamonds to open. You only have {diamonds}.
    -> gem_alcove
}

You press 5 diamonds into the door's receptacles. They glow brilliantly!

~diamonds = diamonds - 5
~keys = keys + 1

The door slides open, revealing a golden key floating in mid-air!

You take the key. It feels warm in your hand.

+ [Excellent! Continue exploring] -> narrow_passage

=== examine_symbols ===
The symbols appear to be an ancient counting system.

{diamonds > 0:
    Curiously, the number {diamonds} seems highlighted.
}

Some text is legible: "Five gems open the crystal gate. Beyond lies the key to freedom."

+ [Interesting...] -> cavern_choices

=== narrow_passage ===
{keys < 1:
    The passage ends at a locked iron door. You need a key!
    + [Return to the cavern] -> cavern_choices
}

Your golden key fits the lock perfectly!

~keys = keys - 1
~score = score + 100

The door swings open to reveal daylight streaming in from above!

-> victory

=== victory ===
# CLASS: success
You climb toward the light and emerge onto a hillside overlooking a peaceful valley.

FINAL SCORE: {score} points
Diamonds collected: {diamonds}

You've escaped the cavern!

+ [Play again?] -> restart

=== restart ===
~diamonds = 0
~keys = 0
~score = 0
~minigame_played = false
~cavern_explored = false

-> intro

</script>

<script>
(function() {
    'use strict';

    // --- Configuration ---
    const GEM_SPAWN_COUNT = 8;
    const GEM_SPAWN_INTERVAL = 1500;
    const MAX_GEMS_PER_ROUND = 15;
    const GEM_EMOJIS = ['💎', '💠', '🔷', '🔹'];

    // --- State ---
    let story = null;
    let currentView = 'narrative';
    let minigameActive = false;
    let gemsCollectedThisRound = 0;
    let gemSpawnTimer = null;
    let totalGemsSpawned = 0;

    // --- DOM Elements ---
    const storyOutput = document.getElementById('story-output');
    const choicesContainer = document.getElementById('choices');
    const narrativeView = document.getElementById('narrative-view');
    const minigameView = document.getElementById('minigame-view');
    const gameContainer = document.getElementById('game-container');
    const gemsCollectedDisplay = document.getElementById('gems-collected');
    const returnToStoryBtn = document.getElementById('returnToStory');
    const viewToggleBtn = document.getElementById('viewToggle');
    const restartBtn = document.getElementById('restartBtn');
    const debugToggleBtn = document.getElementById('debugToggle');
    const debugPanel = document.getElementById('debug-panel');
    const statusDisplay = document.getElementById('statusDisplay');

    // Stats display
    const statDiamonds = document.getElementById('stat-diamonds');
    const statKeys = document.getElementById('stat-keys');
    const statScore = document.getElementById('stat-score');

    // --- Debug Logging ---
    function log(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.textContent = `[${timestamp}] ${type.toUpperCase()}: ${message}`;
        entry.style.color = type === 'error' ? '#f55' : type === 'warn' ? '#ff0' : '#8f8';
        debugPanel.appendChild(entry);
        debugPanel.scrollTop = debugPanel.scrollHeight;
        console.log(`[${type}] ${message}`);
    }

    function setStatus(text) {
        statusDisplay.textContent = text;
    }

    // --- View Management ---
    function switchView(viewName) {
        currentView = viewName;
        narrativeView.classList.toggle('active', viewName === 'narrative');
        minigameView.classList.toggle('active', viewName === 'minigame');
        viewToggleBtn.textContent = `View: ${viewName === 'narrative' ? 'Story' : 'Minigame'}`;
        log(`Switched to ${viewName} view`);
    }

    // --- Stats Update ---
    function updateStatsDisplay() {
        if (!story) return;
        try {
            statDiamonds.textContent = story.variablesState['diamonds'] || 0;
            statKeys.textContent = story.variablesState['keys'] || 0;
            statScore.textContent = story.variablesState['score'] || 0;
        } catch (e) {
            log(`Error updating stats: ${e.message}`, 'error');
        }
    }

    // --- Ink Story Engine ---
    function initStory() {
        const inkSource = document.getElementById('ink-story').textContent;
        try {
            log('Compiling Ink story...');
            const compiled = new inkjs.Compiler(inkSource).Compile();
            story = new inkjs.Story(compiled);
            log('Story compiled successfully');
            setStatus('Story ready');
            continueStory();
        } catch (e) {
            log(`Compilation error: ${e.message}`, 'error');
            setStatus('Compile error!');
            storyOutput.innerHTML = `<p style="color:#f55">Error: ${e.message}</p>`;
        }
    }

    function continueStory() {
        if (!story) return;

        // Check for minigame tag
        let shouldStartMinigame = false;

        while (story.canContinue) {
            const text = story.Continue();
            const tags = story.currentTags || [];

            log(`Text: "${text.trim()}" | Tags: ${tags.join(', ') || 'none'}`);

            // Check for minigame trigger
            for (const tag of tags) {
                if (tag.startsWith('MINIGAME:')) {
                    shouldStartMinigame = true;
                    log('Minigame tag detected!', 'warn');
                }
            }

            // Display text
            if (text.trim()) {
                const p = document.createElement('p');
                // Apply CSS class from tags
                for (const tag of tags) {
                    if (tag.startsWith('CLASS:')) {
                        p.className = tag.replace('CLASS:', '').trim();
                    }
                }
                p.textContent = text;
                storyOutput.appendChild(p);
            }
        }

        // Auto-scroll
        storyOutput.scrollTop = storyOutput.scrollHeight;

        // Update stats
        updateStatsDisplay();

        // Start minigame if triggered
        if (shouldStartMinigame) {
            setTimeout(() => startMinigame(), 500);
            return;
        }

        // Display choices
        displayChoices();
    }

    function displayChoices() {
        choicesContainer.innerHTML = '';

        if (!story || story.currentChoices.length === 0) {
            log('No choices available (story end or waiting)');
            return;
        }

        story.currentChoices.forEach((choice, index) => {
            const btn = document.createElement('button');
            btn.className = 'choice';
            btn.textContent = `${index + 1}. ${choice.text}`;
            btn.addEventListener('click', () => selectChoice(index));
            choicesContainer.appendChild(btn);
        });

        log(`Displayed ${story.currentChoices.length} choices`);
    }

    function selectChoice(index) {
        log(`Selected choice ${index}: ${story.currentChoices[index].text}`);
        story.ChooseChoiceIndex(index);
        continueStory();
    }

    // --- Minigame ---
    function startMinigame() {
        log('Starting gem minigame!');
        setStatus('Minigame active!');

        minigameActive = true;
        gemsCollectedThisRound = 0;
        totalGemsSpawned = 0;
        gemsCollectedDisplay.textContent = '0';
        gameContainer.innerHTML = '';

        switchView('minigame');

        // Spawn initial gems
        for (let i = 0; i < GEM_SPAWN_COUNT; i++) {
            spawnGem();
        }

        // Continue spawning
        gemSpawnTimer = setInterval(() => {
            if (totalGemsSpawned < MAX_GEMS_PER_ROUND) {
                spawnGem();
            } else {
                clearInterval(gemSpawnTimer);
            }
        }, GEM_SPAWN_INTERVAL);
    }

    function spawnGem() {
        if (!minigameActive) return;

        totalGemsSpawned++;

        const gem = document.createElement('div');
        gem.className = 'gem';
        gem.textContent = GEM_EMOJIS[Math.floor(Math.random() * GEM_EMOJIS.length)];

        // Random position (with padding)
        const padding = 10;
        const maxX = gameContainer.clientWidth - 40;
        const maxY = gameContainer.clientHeight - 40;
        gem.style.left = (padding + Math.random() * (maxX - padding)) + 'px';
        gem.style.top = (padding + Math.random() * (maxY - padding)) + 'px';

        gem.addEventListener('click', () => collectGem(gem));

        gameContainer.appendChild(gem);

        // Auto-remove after a while if not collected
        setTimeout(() => {
            if (gem.parentNode && !gem.classList.contains('collected')) {
                gem.remove();
            }
        }, 5000);
    }

    function collectGem(gemElement) {
        if (!minigameActive || gemElement.classList.contains('collected')) return;

        gemElement.classList.add('collected');
        gemsCollectedThisRound++;
        gemsCollectedDisplay.textContent = gemsCollectedThisRound;

        // Play a simple beep (optional)
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 800 + Math.random() * 400;
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } catch (e) { /* Audio not available */ }

        setTimeout(() => gemElement.remove(), 300);

        log(`Collected gem! Total: ${gemsCollectedThisRound}`);
    }

    function endMinigame() {
        log(`Minigame ended. Collected: ${gemsCollectedThisRound}`);
        setStatus('Returning to story...');

        minigameActive = false;
        clearInterval(gemSpawnTimer);

        // UPDATE INK VARIABLES WITH MINIGAME RESULTS!
        if (story) {
            const oldDiamonds = story.variablesState['diamonds'] || 0;
            story.variablesState['diamonds'] = oldDiamonds + gemsCollectedThisRound;
            story.variablesState['minigame_played'] = true;

            log(`Updated Ink: diamonds ${oldDiamonds} -> ${story.variablesState['diamonds']}`, 'warn');
        }

        // Switch back to narrative
        switchView('narrative');
        updateStatsDisplay();

        // Continue the story
        continueStory();
    }

    // --- Event Listeners ---
    returnToStoryBtn.addEventListener('click', endMinigame);

    viewToggleBtn.addEventListener('click', () => {
        if (!minigameActive) {
            switchView(currentView === 'narrative' ? 'minigame' : 'narrative');
        }
    });

    restartBtn.addEventListener('click', () => {
        log('Restarting story...');
        storyOutput.innerHTML = '';
        choicesContainer.innerHTML = '';
        minigameActive = false;
        clearInterval(gemSpawnTimer);
        switchView('narrative');
        initStory();
    });

    debugToggleBtn.addEventListener('click', () => {
        debugPanel.classList.toggle('visible');
    });

    // --- Initialize ---
    log('FINK 2-Engine Demo initializing...');
    initStory();

})();
</script>

</body>
</html>
