<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FINK Player - Interactive Fiction Engine</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- INK Engine -->
    <script src="https://cdn.jsdelivr.net/npm/inkjs@2.2.3/dist/ink-full.js"></script>

    <!-- Modular CSS -->
    <link rel="stylesheet" href="fink-theme.css">
    <link rel="stylesheet" href="fink-player.css">
    <link rel="stylesheet" href="fink-minigames.css">
    <link rel="stylesheet" href="fink-breadcrumb.css">
</head>
<body>

<!-- Breadcrumb navigation widget -->
<div class="breadcrumb-container" id="breadcrumb-container">
    <button class="breadcrumb-toggle" id="breadcrumb-toggle" title="Show navigation path">▶</button>
    <div class="breadcrumb-content" id="breadcrumb-content">
        <span class="breadcrumb-url" id="breadcrumb-url">No story loaded</span>
        <div class="breadcrumb-knots" id="breadcrumb-knots">
            <span class="breadcrumb-empty">Start navigating...</span>
        </div>
    </div>
</div>

<header class="fink-header">
    <button id="homeBtn" title="Back to main menu">🏠</button>
    <button id="restartBtn" title="Restart story">↺</button>
</header>

<main>
    <!-- Narrative View -->
    <div id="narrative-view" class="view active">
        <div id="image-container" class="hidden">
            <img id="story-image" class="hidden" alt="">
            <video id="story-video" style="display:none;" controls></video>
        </div>
        <div id="story-output"></div>
        <div id="choices"></div>
    </div>

    <!-- Minigame View -->
    <div id="minigame-view" class="view">
        <!-- Minigame control bar -->
        <div id="minigame-controls">
            <button id="minigame-pause" title="Pause">⏸</button>
            <button id="minigame-pin" title="Pin (keep visible while reading)">📌</button>
            <button id="minigame-minimize" title="Minimize">−</button>
            <button id="minigame-maximize" title="Maximize">□</button>
            <button id="returnToStory" title="Exit minigame">✕</button>
        </div>

        <!-- Minigame content area -->
        <div id="minigame-content">
            <div id="game-container"></div>
            <div id="chess-container" style="display:none; width:100%; height:100%;"></div>
            <!-- Sandboxed iframe for external minigames -->
            <div id="iframe-minigame-container" style="display:none; width:100%; height:100%;"></div>

            <!-- Frosted panes overlay for pause state -->
            <div id="minigame-frost-overlay">
                <div class="frost-pane frost-pane-top"></div>
                <div class="frost-pane frost-pane-bottom"></div>
                <div class="frost-status">PAUSED</div>
            </div>
        </div>
    </div>
</main>

<!-- Status Overlay -->
<div id="status-overlay">
    <div class="status-spinner"></div>
    <div id="status-text">Loading...</div>
</div>

<!-- Modular JavaScript (load order matters) -->
<script src="fink-config.js"></script>
<script src="fink-utils.js"></script>
<script src="fink-sandbox.js"></script>
<script src="fink-foley.js"></script>
<script src="fink-audio.js"></script>
<script src="fink-navigation.js"></script>
<script src="fink-breadcrumb.js"></script>
<script src="fink-ui.js"></script>
<script src="gems.minigam.js"></script>
<script src="chess.minigam.js"></script>
<script src="../minigames/minigame-host.js"></script>
<script src="fink-minigames.js"></script>
<script src="fink-ink-engine.js"></script>
<script src="fink-player.js"></script>

</body>
</html>
