<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FINK Player - Interactive Fiction Engine</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>&#128037;</text></svg>">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Modular CSS -->
    <link rel="stylesheet" href="fink-theme.css">
    <link rel="stylesheet" href="fink-player.css">
    <link rel="stylesheet" href="fink-minigames.css">
    <link rel="stylesheet" href="fink-breadcrumb.css">
    <link rel="stylesheet" href="foafos-shell.css">
    <!-- skins last: they express every surface through the token contract -->
    <link rel="stylesheet" href="fink-skins.css">
    <script>
      // Apply the chosen skin BEFORE first paint (no flash of retro).
      // Default is broadsheet (owner's call, July 2026): the readable
      // newsprint identity greets first-time readers; ?skin= and a saved
      // choice still win, so nobody who picked a skin loses it.
      (function () {
        var q = new URLSearchParams(location.search).get('skin');
        var saved = null;
        try { saved = localStorage.getItem('foafos.skin'); } catch (e) {}
        document.documentElement.dataset.skin = q || saved || 'broadsheet';
      })();
    </script>
</head>
<body>

<!-- Breadcrumb navigation widget -->
<div class="breadcrumb-container" id="breadcrumb-container">
    <button class="breadcrumb-toggle" id="breadcrumb-toggle" aria-label="Show navigation path" aria-expanded="false" title="Show navigation path">▶</button>
    <div class="breadcrumb-content" id="breadcrumb-content">
        <span class="breadcrumb-url" id="breadcrumb-url">No story loaded</span>
        <div class="breadcrumb-knots" id="breadcrumb-knots">
            <span class="breadcrumb-empty">Start navigating...</span>
        </div>
    </div>
</div>

<!-- Menubar: a chrome strip that gathers small "dashboard" widgets (a
     clock, and whatever running apps publish as app.<id>.status) and
     groups them by the app-tree HIERARCHY — a story's readouts, and its
     running minigame's nested beneath. Empty in markup: foafos-menubar.js
     is the one source of truth. Mounts only if the root offers it. -->
<div id="foaf-menubar" role="group" aria-label="Menubar"></div>

<main>
    <!-- The story's share of the column. Stories play in the story runner's
         window; this empty pane is what FinkWM sizes against the game in split. -->
    <div id="narrative-view" class="view active" aria-hidden="true"></div>

    <!-- FinkWM chrome: the game window's controls. Lives at body level so it
         survives every window mode; draggable by its grip, docks to a screen
         edge, collapses to the grip alone. -->
    <div id="wm-chrome" class="wm-hidden collapsed" role="toolbar" aria-label="Game window controls">
        <button type="button" id="wm-handle" aria-label="Window controls" aria-expanded="false">▦</button>
        <!-- Which pane do these buttons act on? In split there are two,
             and a floating toolbar answers that for nobody. The chip
             names its target; the pane it governs gets an accent edge. -->
        <span id="wm-target" aria-hidden="true"></span>
        <div id="wm-buttons">
            <button type="button" id="wm-full" title="Full screen" aria-label="Full screen" aria-pressed="false">▣</button>
            <button type="button" id="wm-split" title="Split with story" aria-label="Split with story" aria-pressed="false">◫</button>
            <button type="button" id="wm-pip" title="Picture-in-picture" aria-label="Picture-in-picture" aria-pressed="false">◰</button>
            <button type="button" id="minigame-pause" title="Pause" aria-label="Pause game" aria-pressed="false">⏸</button>
            <button type="button" id="returnToStory" title="Exit minigame" aria-label="Exit minigame">✕</button>
        </div>
    </div>

    <!-- Minigame View -->
    <div id="minigame-view" class="view">
        <!-- Minigame content area -->
        <div id="minigame-content">
            <div id="game-container"></div>
            <div id="chess-container" style="display:none; width:100%; height:100%;"></div>
            <!-- Sandboxed iframe for external minigames -->
            <div id="iframe-minigame-container" style="display:none; width:100%; height:100%;"></div>

            <!-- Frosted panes overlay for pause state -->
            <div id="minigame-frost-overlay">
                <div class="frost-pane frost-pane-top"></div>
                <div class="frost-pane frost-pane-bottom"></div>
                <div class="frost-status">PAUSED</div>
            </div>
        </div>

        <!-- Mobile D-Pad Controls -->
        <!-- legacy pad: superseded by the shell-owned FoafInput surface
             (#foaf-pad, injected by foafos-shell.js) -->
        <div id="game-dpad" class="game-dpad" hidden>
            <div class="game-dpad-grid">
                <div class="dpad-empty"></div>
                <button class="dpad-btn" data-dir="up">▲</button>
                <div class="dpad-empty"></div>
                <button class="dpad-btn" data-dir="left">◀</button>
                <div class="dpad-center"></div>
                <button class="dpad-btn" data-dir="right">▶</button>
                <div class="dpad-empty"></div>
                <button class="dpad-btn" data-dir="down">▼</button>
                <div class="dpad-empty"></div>
            </div>
        </div>

        <!-- Mobile Action Buttons (legacy, superseded by #foaf-pad) -->
        <div id="game-action-btns" class="game-action-btns" hidden>
            <button class="action-btn" id="action-btn-a" title="Action">A</button>
            <button class="action-btn action-btn-secondary" id="action-btn-b" title="Secondary">B</button>
        </div>
    </div>
</main>

<!-- Modular JavaScript (load order matters) -->
<script src="fink-config.js"></script>
<script src="fink-links.js"></script>
<script src="fink-foley.js"></script>
<script src="fink-audio.js"></script>
<script src="fink-breadcrumb.js"></script>
<script src="gems.minigam.js"></script>
<script src="chess.minigam.js"></script>
<script src="fink-minigames.js"></script>
<script src="fink-wm.js"></script>
<script src="foafos-menubar.js"></script>
<script type="module" src="foafos-shell.js"></script>
<script src="foafos-boot.js"></script>

</body>
</html>
