<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FINK Player - Interactive Fiction Engine</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- INK Engine -->
    <script src="https://cdn.jsdelivr.net/npm/inkjs@2.2.3/dist/ink-full.js"></script>

    <!-- Modular CSS -->
    <link rel="stylesheet" href="fink-theme.css">
    <link rel="stylesheet" href="fink-player.css">
    <link rel="stylesheet" href="fink-devpanel.css">
    <link rel="stylesheet" href="fink-minigames.css">
    <link rel="stylesheet" href="fink-breadcrumb.css">
</head>
<body>

<!-- Breadcrumb navigation widget -->
<div class="breadcrumb-container" id="breadcrumb-container">
    <button class="breadcrumb-toggle" id="breadcrumb-toggle" title="Show navigation path">▶</button>
    <div class="breadcrumb-content" id="breadcrumb-content">
        <span class="breadcrumb-url" id="breadcrumb-url">No story loaded</span>
        <div class="breadcrumb-knots" id="breadcrumb-knots">
            <span class="breadcrumb-empty">Start navigating...</span>
        </div>
    </div>
</div>

<header class="fink-header">
    <button id="homeBtn" title="Back to main menu">🏠</button>
    <button id="restartBtn" title="Restart story">↺</button>
    <button id="settingsBtn" title="Developer panel">⚙️</button>
</header>

<!-- Developer Panel -->
<div id="dev-panel" class="dev-panel">
    <div id="dev-tabs" class="dev-tabs">
        <button class="active" data-tab="logs" title="Logs">📋</button>
        <button data-tab="swimlanes" title="Swimlanes">🏊</button>
        <button data-tab="state" title="Config">📊</button>
        <button data-tab="finks" title="FINK files">📂</button>
        <button data-tab="audio" title="Audio">🔊</button>
        <button id="copyLogsBtn" title="Copy logs">📄</button>
        <button id="closeDevPanel" title="Close" style="margin-left:auto;">✕</button>
    </div>
    <div id="logs-content" class="dev-tab-content active">
        <div id="log-filters">
            <label><input type="checkbox" data-filter="error" checked> ❌ Error</label>
            <label><input type="checkbox" data-filter="warn" checked> ⚠️ Warn</label>
            <label><input type="checkbox" data-filter="info" checked> ℹ️ Info</label>
            <label><input type="checkbox" data-filter="fink" checked> 📜 FINK</label>
            <label><input type="checkbox" data-filter="ink" checked> 🖋️ Ink</label>
            <label><input type="checkbox" data-filter="game" checked> 🎮 Game</label>
            <label><input type="checkbox" data-filter="debug"> 🔧 Debug</label>
        </div>
        <div id="log-output"></div>
    </div>
    <div id="swimlanes-content" class="dev-tab-content">
        <div class="swimlane"><div class="swimlane-header nav">🧭 NAV</div><div class="swimlane-body" id="swim-nav"></div></div>
        <div class="swimlane"><div class="swimlane-header ink">🖋️ INK</div><div class="swimlane-body" id="swim-ink"></div></div>
        <div class="swimlane"><div class="swimlane-header fink">📜 FINK</div><div class="swimlane-body" id="swim-fink"></div></div>
        <div class="swimlane"><div class="swimlane-header game">🎮 GAME</div><div class="swimlane-body" id="swim-game"></div></div>
    </div>
    <div id="state-content" class="dev-tab-content"><pre id="state-display">Loading...</pre></div>
    <div id="finks-content" class="dev-tab-content">
        <div id="local-finks" style="display:flex; flex-direction:column; gap:0.3em; font-size:12px;"></div>
    </div>
    <div id="audio-content" class="dev-tab-content">
        <div style="display:flex; gap:0.5em; flex-wrap:wrap;">
            <button class="synth-btn" data-sound="water">💧</button>
            <button class="synth-btn" data-sound="wind">🌬️</button>
            <button class="synth-btn" data-sound="fire">🔥</button>
            <button id="stopSynthBtn" style="background:#522;">⏹️</button>
        </div>
    </div>
</div>

<main>
    <!-- Narrative View -->
    <div id="narrative-view" class="view active">
        <div id="image-container" class="hidden">
            <img id="story-image" class="hidden" alt="">
            <video id="story-video" style="display:none;" controls></video>
        </div>
        <div id="story-output"></div>
        <div id="choices"></div>
    </div>

    <!-- Minigame View -->
    <div id="minigame-view" class="view">
        <!-- Game Window Slider Control -->
        <div id="game-slider" class="game-slider hidden">
            <div class="game-slider-track">
                <div class="game-slider-snap" data-state="full" style="left: 0%"></div>
                <div class="game-slider-snap" data-state="embed" style="left: 33%"></div>
                <div class="game-slider-snap" data-state="mini-live" style="left: 66%"></div>
                <div class="game-slider-snap" data-state="mini-paused" style="left: 100%"></div>
                <div class="game-slider-thumb" id="game-slider-thumb"></div>
            </div>
            <div class="game-slider-labels">
                <span>FULL</span><span>EMBED</span><span>MINI</span><span>⏸</span>
            </div>
        </div>

        <!-- Minigame control bar -->
        <div id="minigame-controls">
            <button id="minigame-pause" title="Pause">⏸</button>
            <button id="minigame-pin" title="Pin (keep visible while reading)">📌</button>
            <button id="minigame-minimize" title="Minimize">−</button>
            <button id="minigame-maximize" title="Maximize">□</button>
            <button id="returnToStory" title="Exit minigame">✕</button>
        </div>

        <!-- Minigame content area -->
        <div id="minigame-content">
            <div id="game-container"></div>
            <div id="chess-container" style="display:none; width:100%; height:100%;"></div>
            <!-- Sandboxed iframe for external minigames -->
            <div id="iframe-minigame-container" style="display:none; width:100%; height:100%;"></div>

            <!-- Frosted panes overlay for pause state -->
            <div id="minigame-frost-overlay">
                <div class="frost-pane frost-pane-top"></div>
                <div class="frost-pane frost-pane-bottom"></div>
                <div class="frost-status">PAUSED</div>
            </div>
        </div>
    </div>
</main>

<!-- Status Overlay -->
<div id="status-overlay">
    <div class="status-spinner"></div>
    <div id="status-text">Loading...</div>
</div>

<!-- Modular JavaScript (load order matters) -->
<script src="fink-config.js"></script>
<script src="fink-utils.js"></script>
<script src="fink-sandbox.js"></script>
<script src="fink-foley.js"></script>
<script src="fink-audio.js"></script>
<script src="fink-navigation.js"></script>
<script src="fink-breadcrumb.js"></script>
<script src="fink-devpanel.js"></script>
<script src="fink-ui.js"></script>
<script src="gems.minigam.js"></script>
<script src="chess.minigam.js"></script>
<script src="../minigames/minigame-host.js"></script>
<script src="fink-minigames.js"></script>
<script src="fink-slider.js"></script>
<script src="fink-ink-engine.js"></script>
<script src="fink-player.js"></script>

</body>
</html>
