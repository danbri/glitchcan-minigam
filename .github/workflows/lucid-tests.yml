name: Lucid Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'lucid/**'
      - 'tests/**'
      - 'package.json'
  pull_request:
    paths:
      - 'lucid/**'
      - 'tests/**'
      - 'package.json'

jobs:
  test-tier1:
    name: Tier 1 - Core Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Tier 1 tests (Vitest)
        run: npx vitest run tests/lucid-core.test.js --reporter=verbose

      - name: Test Summary
        if: always()
        run: echo "Tier 1 tests completed"

  test-tier2:
    name: Tier 2 - Integration Tests
    runs-on: ubuntu-latest
    needs: test-tier1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Tier 2 tests (Playwright)
        run: npm run test:tier2

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pr-check:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [test-tier1, test-tier2]
    steps:
      - name: All tests passed
        run: echo "✅ All Lucid tests passed - PR is ready for review"
