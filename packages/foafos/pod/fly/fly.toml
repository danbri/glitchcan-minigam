# foafos-proto. Deploy from packages/foafos/pod:
#   fly deploy --config fly/fly.toml --dockerfile fly/Dockerfile --remote-only --build-arg FACTOIDAL_VERSION=x.y.z
app = "foafos-proto"
primary_region = "lhr"

[env]
  XMPP_DOMAIN = "foafos-proto.fly.dev"
  PUBLIC_HOST = "foafos-proto.fly.dev"

[[mounts]]
  source = "proto_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
