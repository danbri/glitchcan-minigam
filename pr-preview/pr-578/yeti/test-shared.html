<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeti Shared Scene Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    h1 { margin-bottom: 12px; font-weight: 300; font-size: 1.5rem; }
    p { color: #8b949e; margin-bottom: 16px; font-size: 0.9rem; }
    yeti-scene { width: 100%; max-width: 900px; }
  </style>
</head>
<body>

<h1>🦊 Shared Scene Test</h1>
<p>Single canvas with multiple creatures</p>

<yeti-scene mode="shared" width="900" height="400" spin="0.2">
  <yeti-dog pos="-4,0,0"></yeti-dog>
  <yeti-cat pos="-1,0,2"></yeti-cat>
  <yeti-horse pos="2,0,-1"></yeti-horse>
  <yeti-elephant pos="6,0,0" color="pink"></yeti-elephant>
</yeti-scene>

<script type="module" src="yeti-creature.js"></script>
</body>
</html>
