<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFI Zoo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: white;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🦊 Yeti Creatures</h1>

  <!-- Shared scene with multiple creatures -->
  <yeti-scene mode="shared" width="800" height="400" spin="0.2">
    <yeti-dog pos="-3,0,0"></yeti-dog>
    <yeti-cat pos="0,0,1" color="orange"></yeti-cat>
    <yeti-elephant pos="4,0,0" color="pink"></yeti-elephant>
  </yeti-scene>

  <script type="module" src="https://danbri.github.io/glitchcan-minigam/yeti/yeti-creature.js"></script>
</body>
</html>
