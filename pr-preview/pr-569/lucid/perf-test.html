<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stinkyfish Performance Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #16213e;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 1.2rem; color: #4ade80; }
    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button {
      background: #0f3460;
      color: #eee;
      border: 1px solid #4ade80;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    select:hover, button:hover { background: #1a4980; }
    label { font-size: 0.85rem; color: #aaa; }
    main {
      flex: 1;
      display: flex;
      position: relative;
    }
    #canvas-container {
      flex: 1;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #metrics-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #4ade80;
      pointer-events: none;
      white-space: pre;
      min-width: 200px;
    }
    #metrics-overlay.hidden { display: none; }
    .metric-value { color: #facc15; }
    .metric-label { color: #94a3b8; }
    #sidebar {
      width: 280px;
      background: #16213e;
      padding: 15px;
      overflow-y: auto;
      border-left: 1px solid #333;
    }
    .section {
      margin-bottom: 20px;
    }
    .section h3 {
      font-size: 0.9rem;
      color: #4ade80;
      margin-bottom: 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }
    .option-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .option-row label {
      flex: 1;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: #0f3460;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
    }
    .stat-box .value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #4ade80;
    }
    .stat-box .label {
      font-size: 0.7rem;
      color: #888;
    }
    #scene-list {
      max-height: 300px;
      overflow-y: auto;
      background: #0f3460;
      border-radius: 4px;
      padding: 5px;
    }
    .scene-item {
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 0.85rem;
    }
    .scene-item:hover { background: #1a4980; }
    .scene-item.active { background: #4ade80; color: #000; }
    #error-msg {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(220, 38, 38, 0.9);
      color: white;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
    #error-msg.show { display: block; }
    @media (max-width: 768px) {
      #sidebar { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Stinkyfish Performance Test</h1>
    <div class="controls">
      <label>
        Quality:
        <select id="quality-select">
          <option value="low">Low (100 steps)</option>
          <option value="medium" selected>Medium (150 steps)</option>
          <option value="high">High (200 steps)</option>
        </select>
      </label>
      <button id="toggle-metrics">Toggle Metrics</button>
      <button id="clear-cache">Clear Cache</button>
    </div>
  </header>

  <main>
    <div id="canvas-container">
      <canvas id="render-canvas"></canvas>
      <div id="metrics-overlay">Loading...</div>
      <div id="error-msg"></div>
    </div>

    <div id="sidebar">
      <div class="section">
        <h3>Live Stats</h3>
        <div class="stat-grid">
          <div class="stat-box">
            <div class="value" id="stat-fps">--</div>
            <div class="label">FPS</div>
          </div>
          <div class="stat-box">
            <div class="value" id="stat-frame">--</div>
            <div class="label">Frame (ms)</div>
          </div>
          <div class="stat-box">
            <div class="value" id="stat-shader">--</div>
            <div class="label">Shader (KB)</div>
          </div>
          <div class="stat-box">
            <div class="value" id="stat-cache">--</div>
            <div class="label">Cache H/M</div>
          </div>
        </div>
      </div>

      <div class="section">
        <h3>Scenes</h3>
        <div id="scene-list">
          <!-- Populated dynamically -->
        </div>
      </div>

      <div class="section">
        <h3>Display Options</h3>
        <div class="option-row">
          <label>Ground Plane</label>
          <input type="checkbox" id="opt-ground">
        </div>
        <div class="option-row">
          <label>Axes</label>
          <input type="checkbox" id="opt-axes">
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { StinkyfishRenderer, DebugModes } from './stinkyfish/raymarcher.js';
    import { loadJsonScene } from './core/json-loader.js';
    import { generateWgslFromJson } from './core/wgsl-codegen.js';
    import { getAllParamNames } from './core/rig-evaluator.js';

    // Test scenes for performance comparison
    const TEST_SCENES = [
      { name: 'Simple Sphere', path: 'primitives/sphere.json' },
      { name: 'CSG Operations', path: 'csg/operations.json' },
      { name: 'Smooth Union', path: 'csg/smooth-union.json' },
      { name: 'Chunky Animals', path: 'csg/chunky-animals.json' },
      { name: 'Wolf', path: 'creatures/wolf.json' },
      { name: 'Dragon', path: 'creatures/draggo5.json' },
      { name: 'Invaders', path: 'creatures/invaders.json' },
      { name: 'Radial Flower', path: 'patterns/radial-flower.json' },
      { name: 'Infinite Field', path: 'patterns/infinite-field.json' },
      { name: 'Bouncing Balls', path: 'physics/bouncing-balls.json' },
    ];

    let renderer = null;
    let currentScene = null;

    // DOM elements
    const canvas = document.getElementById('render-canvas');
    const metricsOverlay = document.getElementById('metrics-overlay');
    const errorMsg = document.getElementById('error-msg');
    const qualitySelect = document.getElementById('quality-select');
    const sceneList = document.getElementById('scene-list');

    // Stats elements
    const statFps = document.getElementById('stat-fps');
    const statFrame = document.getElementById('stat-frame');
    const statShader = document.getElementById('stat-shader');
    const statCache = document.getElementById('stat-cache');

    // Initialize
    async function init() {
      try {
        // Create renderer with metrics enabled
        renderer = new StinkyfishRenderer(canvas, {
          enableMetrics: true,
          enableShaderCache: true,
          adaptiveStepping: true,
          onStats: updateStats
        });

        await renderer.init();

        // Setup canvas size
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Populate scene list
        populateSceneList();

        // Load initial scene
        await loadScene(TEST_SCENES[0].path);

        // Start render loop
        renderer.startRenderLoop();

        // Update metrics overlay periodically
        setInterval(updateMetricsOverlay, 100);

      } catch (err) {
        showError(`Initialization failed: ${err.message}`);
        console.error(err);
      }
    }

    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = container.clientWidth * dpr;
      canvas.height = container.clientHeight * dpr;
      if (renderer) {
        renderer.resize(canvas.width, canvas.height);
      }
    }

    function populateSceneList() {
      TEST_SCENES.forEach((scene, idx) => {
        const item = document.createElement('div');
        item.className = 'scene-item' + (idx === 0 ? ' active' : '');
        item.textContent = scene.name;
        item.addEventListener('click', () => {
          document.querySelectorAll('.scene-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
          loadScene(scene.path);
        });
        sceneList.appendChild(item);
      });
    }

    async function loadScene(path) {
      try {
        const fullPath = `./scenes/${path}`;
        const response = await fetch(fullPath);
        if (!response.ok) throw new Error(`Failed to load ${path}`);

        const json = await response.json();
        currentScene = loadJsonScene(json);

        // Generate WGSL
        const wgsl = generateWgslFromJson(currentScene, {});

        // Build uniform layout
        const uniformLayout = {};
        const allParams = getAllParamNames(currentScene.params || {}, currentScene.rig);
        for (const [name, info] of Object.entries(allParams)) {
          if (info.type === 'color3' || info.type === 'position3' || info.type === 'radii3' || info.type === 'direction3') {
            uniformLayout[`u_${name}`] = 'vec3f';
          } else {
            uniformLayout[`u_${name}`] = 'f32';
          }
        }

        // Compile scene
        await renderer.compileScene(wgsl, uniformLayout);

        // Set scene params
        renderer.setSceneParams(currentScene.params);

        // Apply camera from scene
        if (currentScene.camera) {
          const cam = currentScene.camera;
          renderer.setCamera(
            cam.distance || 4,
            cam.target || [0, 0.5, 0],
            cam.theta || 0.3,
            cam.phi || 0.4
          );
        }

        hideError();
        console.log(`[PerfTest] Loaded: ${path}`);

      } catch (err) {
        showError(`Failed to load scene: ${err.message}`);
        console.error(err);
      }
    }

    function updateStats(stats) {
      statFps.textContent = stats.fps.toFixed(1);
      statFrame.textContent = stats.avgFrameTimeMs.toFixed(1);
      statShader.textContent = (stats.shaderSizeBytes / 1024).toFixed(1);
    }

    function updateMetricsOverlay() {
      if (!renderer || !renderer.metrics) return;

      const stats = renderer.getMetrics();
      if (!stats) return;

      const cacheStats = renderer.shaderCache ? renderer.shaderCache.getStats() : { size: 0 };

      metricsOverlay.innerHTML = [
        `<span class="metric-label">FPS:</span> <span class="metric-value">${stats.fps.toFixed(1)}</span>`,
        `<span class="metric-label">Frame:</span> <span class="metric-value">${stats.avgFrameTimeMs.toFixed(2)}ms</span> (${stats.minFrameTimeMs.toFixed(1)}-${stats.maxFrameTimeMs.toFixed(1)})`,
        `<span class="metric-label">Steps:</span> <span class="metric-value">${stats.maxSteps}</span>`,
        `<span class="metric-label">Shader:</span> <span class="metric-value">${(stats.shaderSizeBytes/1024).toFixed(1)}KB</span>`,
        `<span class="metric-label">Uniforms:</span> <span class="metric-value">${stats.uniformCount}</span>`,
        `<span class="metric-label">Helpers:</span> <span class="metric-value">${stats.helperFunctionCount}</span>`,
        `<span class="metric-label">Cache:</span> <span class="metric-value">${cacheStats.size}/${renderer.shaderCache?.maxEntries || 0}</span> (${(stats.cacheHitRate * 100).toFixed(0)}% hits)`,
        `<span class="metric-label">Compile:</span> <span class="metric-value">${stats.shaderCompileTimeMs.toFixed(0)}ms</span>`,
      ].join('\n');

      // Update sidebar stats
      statCache.textContent = `${cacheStats.size}`;
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }

    function hideError() {
      errorMsg.classList.remove('show');
    }

    // Event handlers
    qualitySelect.addEventListener('change', () => {
      if (renderer) {
        renderer.setQuality(qualitySelect.value);
      }
    });

    document.getElementById('toggle-metrics').addEventListener('click', () => {
      metricsOverlay.classList.toggle('hidden');
    });

    document.getElementById('clear-cache').addEventListener('click', () => {
      if (renderer) {
        renderer.clearShaderCache();
      }
    });

    document.getElementById('opt-ground').addEventListener('change', (e) => {
      if (renderer) renderer.showGroundPlane = e.target.checked;
    });

    document.getElementById('opt-axes').addEventListener('change', (e) => {
      if (renderer) renderer.showAxes = e.target.checked;
    });

    // Start
    init();
  </script>
</body>
</html>
