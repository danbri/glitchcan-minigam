<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JSON SDF Renderer Test – Lucid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .info {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 10;
    }

    .info h1 {
      font-size: 16px;
      color: #22d3ee;
      margin-bottom: 4px;
    }

    .info p {
      font-size: 12px;
      color: #9ca3af;
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: #22d3ee;
      z-index: 1000;
    }

    .error {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.9);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      max-width: 80%;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="loading">Loading JSON scene...</div>

  <div class="info">
    <h1>JSON SDF Renderer</h1>
    <p>Loading: invader.sdf.json</p>
  </div>

  <canvas id="canvas"></canvas>

  <script type="module">
    import { SimpleRaymarcher } from './ui/raymarcher.js';
    import { loadJsonScene } from './core/json-loader.js';
    import { generateGlslFromJson } from './core/json-codegen.js';

    async function init() {
      try {
        console.log('📂 Loading JSON scene...');

        // Fetch JSON scene
        const response = await fetch('./invader.sdf.json');
        if (!response.ok) {
          throw new Error(`Failed to load scene: ${response.statusText}`);
        }

        const jsonData = await response.json();
        console.log('✅ JSON loaded:', jsonData);

        // Parse JSON to IR
        console.log('🔄 Parsing scene...');
        const scene = loadJsonScene(jsonData);
        console.log('✅ Scene parsed:', scene);

        // Generate GLSL
        console.log('🔄 Generating GLSL...');
        const glslCode = generateGlslFromJson(scene);
        console.log('✅ GLSL generated, length:', glslCode.length);
        console.log('GLSL code:\n', glslCode);

        // Create renderer
        const canvas = document.getElementById('canvas');
        const renderer = new SimpleRaymarcher(canvas);

        // Update scene
        renderer.updateScene(glslCode);

        // Render loop
        function renderLoop() {
          renderer.render();
          requestAnimationFrame(renderLoop);
        }
        renderLoop();

        // Hide loading
        document.querySelector('.loading').style.display = 'none';

        console.log('✅ JSON scene rendering');

      } catch (error) {
        console.error('❌ Failed to load scene:', error);
        console.error('Stack:', error.stack);

        // Show error
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error';
        errorDiv.textContent = `Error: ${error.message}`;
        document.body.appendChild(errorDiv);

        document.querySelector('.loading').textContent = 'Failed to load scene';
      }
    }

    init();
  </script>
</body>
</html>
