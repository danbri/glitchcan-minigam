<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hand-Controlled Splat Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a12;
            color: #fff;
            overflow: hidden;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        /* Minimal camera feed */
        #video-container {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 140px;
            height: 105px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 100;
            background: #000;
        }

        #video-container.hidden { display: none; }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #hand-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Minimal status */
        #status {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(20, 25, 45, 0.9);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            font-size: 11px;
            min-width: 150px;
        }

        #status h3 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: rgba(255,255,255,0.7);
        }

        .status-value {
            color: #00d9ff;
            font-family: monospace;
        }

        /* Hand indicators */
        .hand-bars {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .hand-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .hand-bar span { font-size: 14px; }

        .bar-track {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #00d9ff;
            transition: width 0.1s;
        }

        /* Controls hint */
        #hint {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(20, 25, 45, 0.9);
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            z-index: 100;
        }

        #hint strong { color: #00d9ff; }

        /* Loading */
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #loading.hidden { display: none; }

        .loader {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #loading p {
            margin-top: 15px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="hand-overlay"></canvas>
    </div>

    <div id="status">
        <h3>Radial Invaders</h3>
        <div class="status-row">
            <span>Splats</span>
            <span class="status-value" id="splat-count">-</span>
        </div>
        <div class="status-row">
            <span>FPS</span>
            <span class="status-value" id="fps">-</span>
        </div>
        <div class="hand-bars">
            <div class="hand-bar">
                <span>🤚</span>
                <div class="bar-track"><div class="bar-fill" id="left-bar" style="width: 0%"></div></div>
            </div>
            <div class="hand-bar">
                <span>✋</span>
                <div class="bar-track"><div class="bar-fill" id="right-bar" style="width: 0%"></div></div>
            </div>
        </div>
    </div>

    <div id="hint">
        <strong>Hands:</strong> rotate &amp; zoom | <strong>Drag:</strong> orbit | <strong>Scroll:</strong> zoom
    </div>

    <div id="loading">
        <div class="loader"></div>
        <p>Loading scene...</p>
    </div>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>

    <script type="module">
        // Import splat infrastructure
        import { InstancedSplatRenderer, GPUSampler, QuickTrainer, GaussianCloud } from '../splats/index.js';
        import { SimpleRaymarcher } from '../ui/raymarcher.js';
        import { generateGlslFromJson } from '../core/json-codegen.js';
        import { loadJsonScene } from '../core/json-loader.js';

        // ============================================
        // HAND-CONTROLLED SPLAT VIEWER
        // ============================================

        class HandSplatViewer {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.renderer = null;

                // Hand tracking state
                this.leftTension = 0;
                this.rightTension = 0;
                this.handsDetected = 0;

                // Camera state controlled by hands
                this.camTheta = 0;        // Horizontal angle
                this.camPhi = 0.3;        // Vertical angle (starts slightly above)
                this.camDist = 8;         // Distance from origin
                this.targetTheta = 0;
                this.targetPhi = 0.3;
                this.targetDist = 8;

                // Hand position for rotation
                this.leftHandX = 0.5;
                this.leftHandY = 0.5;
                this.rightHandX = 0.5;
                this.rightHandY = 0.5;

                // Mouse/touch fallback
                this.isDragging = false;
                this.lastX = 0;
                this.lastY = 0;

                // FPS tracking
                this.frameCount = 0;
                this.fpsTime = 0;

                this.init();
            }

            async init() {
                await this.loadScene();
                this.setupControls();
                await this.setupHandTracking();
                this.startAnimation();
                document.getElementById('loading').classList.add('hidden');
            }

            async loadScene() {
                // Load radial invaders scene
                const resp = await fetch('../scenes/creatures/radial-invaders.json');
                const sceneJson = await resp.json();

                // Generate GLSL
                const hiddenCanvas = document.createElement('canvas');
                hiddenCanvas.width = hiddenCanvas.height = 1;
                const raymarcher = new SimpleRaymarcher(hiddenCanvas);

                const processedScene = loadJsonScene(sceneJson);
                const glslCode = generateGlslFromJson(processedScene);
                raymarcher.updateScene(glslCode);
                raymarcher.overrideTime = 0;

                // Sample with GPU
                const gpuSampler = new GPUSampler({
                    resolution: 128,
                    maxDistance: 30.0,
                    hitThreshold: 0.001,
                    maxSteps: 200
                });

                const bounds = {
                    min: [-4, -2, -4],
                    max: [4, 2, 4]
                };

                const sampleResult = gpuSampler.sample(glslCode, bounds, {
                    numDirections: 10,
                    deduplicationRadius: 0.015
                });

                // Convert to point cloud
                const baseScale = 0.04;
                const pointCloud = gpuSampler.toPointCloud(sampleResult, { baseScale });

                // Train Gaussians
                const trainer = new QuickTrainer({
                    targetCount: 8000,
                    scaleMultiplier: 1.2
                });
                const cloud = await trainer.train(pointCloud);

                gpuSampler.dispose();

                // Setup renderer
                this.renderer = new InstancedSplatRenderer(this.canvas);
                this.renderer.addTemplate('invaders', cloud);
                this.renderer.addInstance('invaders', {
                    id: 'main',
                    template: 'invaders',
                    transform: { translate: [0, 0, 0], rotate: [0, 0, 0], scale: [1, 1, 1] }
                });

                document.getElementById('splat-count').textContent = cloud.count.toLocaleString();
            }

            setupControls() {
                // Mouse controls
                this.canvas.addEventListener('mousedown', (e) => {
                    this.isDragging = true;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;
                });

                document.addEventListener('mousemove', (e) => {
                    if (!this.isDragging) return;
                    const dx = e.clientX - this.lastX;
                    const dy = e.clientY - this.lastY;
                    this.targetTheta += dx * 0.008;
                    this.targetPhi = Math.max(-0.2, Math.min(1.5, this.targetPhi + dy * 0.008));
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;
                });

                document.addEventListener('mouseup', () => this.isDragging = false);

                // Scroll zoom
                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    this.targetDist = Math.max(3, Math.min(20, this.targetDist + e.deltaY * 0.015));
                }, { passive: false });

                // Touch controls
                let lastTouch = null;
                this.canvas.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    }
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1 && lastTouch) {
                        const dx = e.touches[0].clientX - lastTouch.x;
                        const dy = e.touches[0].clientY - lastTouch.y;
                        this.targetTheta += dx * 0.008;
                        this.targetPhi = Math.max(-0.2, Math.min(1.5, this.targetPhi + dy * 0.008));
                        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    }
                });

                this.canvas.addEventListener('touchend', () => lastTouch = null);

                // Resize
                window.addEventListener('resize', () => {
                    this.canvas.width = window.innerWidth * window.devicePixelRatio;
                    this.canvas.height = window.innerHeight * window.devicePixelRatio;
                });

                this.canvas.width = window.innerWidth * window.devicePixelRatio;
                this.canvas.height = window.innerHeight * window.devicePixelRatio;
            }

            async setupHandTracking() {
                const video = document.getElementById('webcam');
                const canvas = document.getElementById('hand-overlay');
                const ctx = canvas.getContext('2d');

                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
                });

                hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults((results) => this.onHandResults(results, canvas, ctx));

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: 640, height: 480, facingMode: 'user' }
                    });
                    video.srcObject = stream;

                    const camera = new Camera(video, {
                        onFrame: async () => { await hands.send({ image: video }); },
                        width: 640,
                        height: 480
                    });
                    camera.start();
                } catch (err) {
                    console.warn('Camera not available:', err);
                    document.getElementById('video-container').classList.add('hidden');
                }
            }

            calculateHandTension(landmarks) {
                const palmBase = landmarks[0];
                const tips = [landmarks[4], landmarks[8], landmarks[12], landmarks[16], landmarks[20]];
                let totalDist = 0;
                tips.forEach(tip => {
                    const dx = tip.x - palmBase.x;
                    const dy = tip.y - palmBase.y;
                    totalDist += Math.sqrt(dx * dx + dy * dy);
                });
                const avgDist = totalDist / 5;
                return 1 - Math.min(1, Math.max(0, (avgDist - 0.08) / 0.25));
            }

            onHandResults(results, canvas, ctx) {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                let leftT = 0, rightT = 0;
                let leftX = 0.5, leftY = 0.5, rightX = 0.5, rightY = 0.5;

                if (results.multiHandLandmarks && results.multiHandedness) {
                    results.multiHandLandmarks.forEach((landmarks, index) => {
                        const handedness = results.multiHandedness[index].label;
                        const tension = this.calculateHandTension(landmarks);

                        // Get palm center position (landmark 0 = wrist, 9 = middle finger base)
                        const palmX = (landmarks[0].x + landmarks[9].x) / 2;
                        const palmY = (landmarks[0].y + landmarks[9].y) / 2;

                        // Mirror: Left in video is right hand
                        if (handedness === 'Left') {
                            rightT = tension;
                            rightX = 1 - palmX;  // Mirror
                            rightY = palmY;
                        } else {
                            leftT = tension;
                            leftX = 1 - palmX;
                            leftY = palmY;
                        }

                        // Draw hand landmarks
                        ctx.fillStyle = `rgba(0, 217, 255, ${0.4 + tension * 0.4})`;
                        landmarks.forEach(point => {
                            ctx.beginPath();
                            ctx.arc(
                                (1 - point.x) * canvas.width,
                                point.y * canvas.height,
                                2 + tension * 2,
                                0, Math.PI * 2
                            );
                            ctx.fill();
                        });
                    });
                }

                // Smooth updates
                this.leftTension = this.leftTension * 0.7 + leftT * 0.3;
                this.rightTension = this.rightTension * 0.7 + rightT * 0.3;
                this.leftHandX = this.leftHandX * 0.7 + leftX * 0.3;
                this.leftHandY = this.leftHandY * 0.7 + leftY * 0.3;
                this.rightHandX = this.rightHandX * 0.7 + rightX * 0.3;
                this.rightHandY = this.rightHandY * 0.7 + rightY * 0.3;
                this.handsDetected = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;

                // HAND CONTROLS:
                // - Hand X position -> horizontal rotation
                // - Hand Y position -> vertical rotation
                // - Tension (closed fist) -> zoom in, open hand -> zoom out
                if (this.handsDetected > 0) {
                    // Use average of detected hands for position
                    let avgX = 0, avgY = 0, avgTension = 0;
                    if (this.handsDetected === 2) {
                        avgX = (this.leftHandX + this.rightHandX) / 2;
                        avgY = (this.leftHandY + this.rightHandY) / 2;
                        avgTension = (this.leftTension + this.rightTension) / 2;
                    } else {
                        avgX = this.leftTension > this.rightTension ? this.leftHandX : this.rightHandX;
                        avgY = this.leftTension > this.rightTension ? this.leftHandY : this.rightHandY;
                        avgTension = Math.max(this.leftTension, this.rightTension);
                    }

                    // Map hand X (0-1) to rotation angle
                    // Center (0.5) = no change, edges = rotate
                    const rotationSpeed = 0.04;
                    this.targetTheta += (avgX - 0.5) * rotationSpeed;

                    // Map hand Y (0-1) to vertical angle
                    // Top = look from above, bottom = look from below
                    const targetPhiFromHand = avgY * 1.4;  // Range 0 to 1.4
                    this.targetPhi = this.targetPhi * 0.95 + targetPhiFromHand * 0.05;

                    // Tension controls zoom: closed = closer, open = farther
                    const zoomTarget = 5 + (1 - avgTension) * 10;  // Range 5-15
                    this.targetDist = this.targetDist * 0.95 + zoomTarget * 0.05;
                }

                // Update UI
                document.getElementById('left-bar').style.width = `${this.leftTension * 100}%`;
                document.getElementById('right-bar').style.width = `${this.rightTension * 100}%`;
            }

            startAnimation() {
                const animate = (time) => {
                    requestAnimationFrame(animate);

                    // FPS
                    this.frameCount++;
                    if (time - this.fpsTime > 1000) {
                        document.getElementById('fps').textContent = this.frameCount;
                        this.frameCount = 0;
                        this.fpsTime = time;
                    }

                    // Smooth camera interpolation
                    this.camTheta += (this.targetTheta - this.camTheta) * 0.1;
                    this.camPhi += (this.targetPhi - this.camPhi) * 0.1;
                    this.camDist += (this.targetDist - this.camDist) * 0.1;

                    if (this.renderer) {
                        this.renderer.setTime(time / 1000);

                        // Calculate camera position
                        const pos = [
                            Math.sin(this.camTheta) * Math.cos(this.camPhi) * this.camDist,
                            Math.sin(this.camPhi) * this.camDist,
                            Math.cos(this.camTheta) * Math.cos(this.camPhi) * this.camDist
                        ];

                        this.renderer.setCamera({
                            position: pos,
                            target: [0, 0, 0],
                            fov: 45
                        });

                        // Enable lighting effect
                        this.renderer.setEffects({
                            lighting: true,
                            colorShift: false,
                            jelly: false,
                            orbit: false
                        });

                        this.renderer.render();
                    }
                };

                animate(0);
            }
        }

        // Start
        new HandSplatViewer();
    </script>
</body>
</html>
