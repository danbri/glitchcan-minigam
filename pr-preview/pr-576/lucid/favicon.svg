<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Red balloon body -->
  <ellipse cx="50" cy="40" rx="28" ry="32" fill="#e53935"/>

  <!-- Balloon highlight -->
  <ellipse cx="40" cy="30" rx="8" ry="10" fill="#ef5350" opacity="0.6"/>
  <ellipse cx="38" cy="26" rx="4" ry="5" fill="#ffcdd2" opacity="0.5"/>

  <!-- Balloon knot -->
  <polygon points="50,72 46,75 54,75" fill="#c62828"/>

  <!-- String -->
  <path d="M50 75 Q45 82 50 88 Q55 94 50 100" stroke="#795548" stroke-width="1.5" fill="none"/>

  <!-- Subtle shadow on balloon -->
  <ellipse cx="58" cy="50" rx="6" ry="10" fill="#c62828" opacity="0.3"/>
</svg>
