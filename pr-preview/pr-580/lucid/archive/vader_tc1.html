<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Space Invaders Template Test – Lucid SDF</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }

    .demo-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* Code Panel */
    .code-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 400px;
      max-width: 90vw;
      height: 100vh;
      background: rgba(2, 6, 23, 0.95);
      backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      transition: right 0.3s ease;
      z-index: 50;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-panel.open {
      right: 0;
    }

    .code-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .code-title {
      font-size: 14px;
      font-weight: 600;
      color: #22d3ee;
    }

    .code-close {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .code-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .code-content {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .code-block {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .code-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #e5e7eb;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* Code Toggle Button */
    .code-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #22d3ee;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      transition: all 0.3s ease;
    }

    .code-toggle:hover {
      background: rgba(34, 211, 238, 0.2);
      transform: scale(1.1);
    }

    /* Edit Toggle Button */
    .edit-toggle {
      position: fixed;
      top: 80px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #a78bfa;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      transition: all 0.3s ease;
    }

    .edit-toggle:hover {
      background: rgba(167, 139, 250, 0.2);
      transform: scale(1.1);
    }

    /* Demo Title */
    .demo-title {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 60;
    }

    .demo-title h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 2px;
      color: #22d3ee;
    }

    .demo-title p {
      font-size: 12px;
      color: #9ca3af;
    }

    /* Edit Panel */
    .edit-panel {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .edit-panel.active {
      display: flex;
    }

    .edit-container {
      background: rgba(2, 6, 23, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 24px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .edit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .edit-header h2 {
      font-size: 18px;
      color: #a78bfa;
    }

    .edit-textarea {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px;
      color: #e5e7eb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      margin-bottom: 16px;
    }

    .edit-textarea:focus {
      outline: none;
      border-color: #a78bfa;
    }

    .edit-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .edit-button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .edit-button.primary {
      background: #a78bfa;
      color: #000;
    }

    .edit-button.primary:hover {
      background: #c4b5fd;
    }

    .edit-button.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .edit-button.secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .edit-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      color: #fca5a5;
      font-size: 13px;
      display: none;
    }

    .edit-error.visible {
      display: block;
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: #22d3ee;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="loading">Loading...</div>

  <div class="demo-container">
    <canvas id="canvas"></canvas>
  </div>

  <div class="demo-title">
    <h1>Space Invaders (Template)</h1>
    <p>Reusable template with 6 instances</p>
  </div>

  <button class="code-toggle" title="View Code (C)">{ }</button>
  <button class="edit-toggle" title="Edit DSL (E)">✎</button>

  <!-- Code Panel -->
  <div id="codePanel" class="code-panel">
    <div class="code-header">
      <div class="code-title">Code View</div>
      <button class="code-close">×</button>
    </div>
    <div class="code-content">
      <div class="code-block">
        <div class="code-label">DSL Source</div>
        <pre id="dslCode"></pre>
      </div>
      <div class="code-block">
        <div class="code-label">Generated GLSL</div>
        <pre id="glslCode"></pre>
      </div>
      <div class="code-block">
        <div class="code-label">Scene Graph IR</div>
        <pre id="sceneGraphCode"></pre>
      </div>
    </div>
  </div>

  <!-- Edit Panel -->
  <div id="editPanel" class="edit-panel">
    <div class="edit-container">
      <div class="edit-header">
        <h2>Edit DSL</h2>
      </div>
      <div id="editError" class="edit-error"></div>
      <textarea id="editTextarea" class="edit-textarea" spellcheck="false"></textarea>
      <div class="edit-actions">
        <button id="editCancel" class="edit-button secondary">Cancel (ESC)</button>
        <button id="editApply" class="edit-button primary">Apply Changes</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { SimpleRaymarcher } from './mayfly/raymarcher.js';
    import { DemoViewer } from './mayfly/demo-viewer.js';

    // Space Invaders template demo DSL
    const invaderDsl = `# Define a reusable invader template
template invader(x, y, color):
  body = box(size=[0.5, 0.4, 0.3], center=[x, y, 0], color=color)
  eye1 = sphere(r=0.1, center=[x-0.12, y+0.08, 0.2], color=[0.0, 0.0, 0.0])
  eye2 = sphere(r=0.1, center=[x+0.12, y+0.08, 0.2], color=[0.0, 0.0, 0.0])
  temp = subtract(a=body, b=eye1)
  return subtract(a=temp, b=eye2)

# Create invader instances - template generates GLSL function
i1 = invader(-1.5, 0.6, [0.0, 1.0, 0.5])
i2 = invader(0.0, 0.6, [0.0, 1.0, 0.5])
i3 = invader(1.5, 0.6, [0.0, 1.0, 0.5])
i4 = invader(-1.5, -0.6, [1.0, 0.3, 0.8])
i5 = invader(0.0, -0.6, [1.0, 0.3, 0.8])
i6 = invader(1.5, -0.6, [1.0, 0.3, 0.8])

# Combine into formation
formation = union(i1, i2, i3, i4, i5, i6)
out = formation`;

    // Initialize
    const canvas = document.getElementById('canvas');
    const renderer = new SimpleRaymarcher(canvas);
    const viewer = new DemoViewer({ renderer });

    // Load the invader demo
    viewer.loadDsl(invaderDsl);

    // Render loop
    function renderLoop() {
      renderer.render();
      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // Hide loading
    document.querySelector('.loading').style.display = 'none';

    console.log('✅ Space Invaders template demo loaded');
    console.log('📝 Press C to view code, E to edit DSL');
  </script>
</body>
</html>
