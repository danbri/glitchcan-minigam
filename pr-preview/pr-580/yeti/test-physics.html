<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeti Physics Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    h1 { margin-bottom: 8px; font-weight: 300; font-size: 1.4rem; }
    p { color: #8b949e; margin-bottom: 12px; font-size: 0.85rem; text-align: center; }
    yeti-scene { width: 100%; max-width: 900px; }
  </style>
</head>
<body>

<h1>🏟️ Yeti Physics Arena</h1>
<p>Select creatures and tap 🚀 to throw! Tap 🎾 to drop balls. Drag to orbit camera.</p>

<yeti-scene mode="physics" width="900" height="500" arena-size="12" ball-colors="pink,lime,cyan,yellow,orange,magenta">
  <yeti-dog pos="-3,0,0"></yeti-dog>
  <yeti-cat pos="0,0,3"></yeti-cat>
  <yeti-elephant pos="4,0,-2" color="pink"></yeti-elephant>
  <yeti-horse pos="-2,0,-3"></yeti-horse>
</yeti-scene>

<script type="module" src="yeti-creature.js"></script>
</body>
</html>
