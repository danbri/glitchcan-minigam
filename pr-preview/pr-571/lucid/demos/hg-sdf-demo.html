<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hg-sdf Demo - Lucid</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 8px;
      max-width: 400px;
      font-size: 13px;
      line-height: 1.5;
    }
    .info h1 { font-size: 18px; margin-bottom: 10px; }
    .info code { background: #333; padding: 2px 5px; border-radius: 3px; font-size: 12px; }
    .info a { color: #6cf; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="info">
    <h1>hg-sdf Demo</h1>
    <p>Mercury's <a href="https://mercury.sexy/hg_sdf/" target="_blank">hg_sdf</a> library functions:</p>
    <ul style="margin: 10px 0 10px 20px;">
      <li><code>fBox</code> - box primitive</li>
      <li><code>fTorus</code> - torus primitive</li>
      <li><code>pMod1</code> - 1D domain repetition</li>
      <li><code>fOpUnionRound</code> - smooth union</li>
    </ul>
    <p>Drag to rotate, scroll to zoom.</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('webgl2');

    // hg-sdf subset + raymarcher
    const vertexShader = `#version 300 es
      in vec2 a_position;
      out vec2 v_uv;
      void main() {
        v_uv = a_position;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fragmentShader = `#version 300 es
      precision highp float;
      in vec2 v_uv;
      out vec4 fragColor;

      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec3 u_camPos;
      uniform vec3 u_camTarget;

      // ========== hg-sdf primitives ==========
      // From Mercury's hg_sdf library (MIT license)

      // Box - exact SDF
      float fBox(vec3 p, vec3 b) {
        vec3 d = abs(p) - b;
        return length(max(d, vec3(0))) + min(max(d.x, max(d.y, d.z)), 0.0);
      }

      // Torus in XZ plane
      float fTorus(vec3 p, float smallRadius, float largeRadius) {
        return length(vec2(length(p.xz) - largeRadius, p.y)) - smallRadius;
      }

      // Cylinder - exact
      float fCylinder(vec3 p, float r, float height) {
        float d = length(p.xz) - r;
        return max(d, abs(p.y) - height);
      }

      // ========== hg-sdf domain operations ==========

      // Repeat in one dimension
      float pMod1(inout float p, float size) {
        float halfsize = size * 0.5;
        float c = floor((p + halfsize) / size);
        p = mod(p + halfsize, size) - halfsize;
        return c;
      }

      // Repeat in two dimensions
      vec2 pMod2(inout vec2 p, vec2 size) {
        vec2 halfsize = size * 0.5;
        vec2 c = floor((p + halfsize) / size);
        p = mod(p + halfsize, size) - halfsize;
        return c;
      }

      // Mirror at axis
      float pMirror(inout float p, float dist) {
        float s = sign(p);
        p = abs(p) - dist;
        return s;
      }

      // ========== hg-sdf combination operators ==========

      // Smooth union (round blend)
      float fOpUnionRound(float a, float b, float r) {
        vec2 u = max(vec2(r - a, r - b), vec2(0));
        return max(r, min(a, b)) - length(u);
      }

      // Smooth subtraction
      float fOpDifferenceRound(float a, float b, float r) {
        return fOpUnionRound(a, -b, r);
      }

      // ========== Scene using hg-sdf ==========

      vec4 sceneSDF(vec3 p) {
        // Ground plane
        float ground = p.y + 0.5;

        // Repeated boxes using pMod2
        vec3 q = p;
        pMod2(q.xz, vec2(3.0));
        float boxes = fBox(q - vec3(0, 0.5, 0), vec3(0.4, 0.5, 0.4));

        // Torus floating above, animated
        vec3 torusPos = p - vec3(0, 1.5 + 0.3 * sin(u_time), 0);
        float torus = fTorus(torusPos, 0.15, 0.6);

        // Central pillar with smooth union to ground
        float pillar = fCylinder(p, 0.3, 1.0);
        float pillarBlend = fOpUnionRound(ground, pillar, 0.2);

        // Combine all
        float d = min(pillarBlend, boxes);
        d = min(d, torus);

        // Color based on what we hit
        vec3 col = vec3(0.6, 0.6, 0.7); // default gray
        if (d == torus) col = vec3(1.0, 0.3, 0.2); // red torus
        else if (d == boxes) col = vec3(0.3, 0.7, 0.9); // blue boxes
        else if (d == pillarBlend) col = vec3(0.5, 0.8, 0.4); // green pillar

        return vec4(d, col);
      }

      // ========== Raymarcher ==========

      vec3 calcNormal(vec3 p) {
        const float e = 0.001;
        return normalize(vec3(
          sceneSDF(p + vec3(e,0,0)).x - sceneSDF(p - vec3(e,0,0)).x,
          sceneSDF(p + vec3(0,e,0)).x - sceneSDF(p - vec3(0,e,0)).x,
          sceneSDF(p + vec3(0,0,e)).x - sceneSDF(p - vec3(0,0,e)).x
        ));
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;

        // Camera
        vec3 ro = u_camPos;
        vec3 ta = u_camTarget;
        vec3 ww = normalize(ta - ro);
        vec3 uu = normalize(cross(ww, vec3(0,1,0)));
        vec3 vv = cross(uu, ww);
        vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.5 * ww);

        // Raymarch
        float t = 0.0;
        vec3 col = vec3(0.05, 0.05, 0.1);

        for (int i = 0; i < 100; i++) {
          vec3 p = ro + rd * t;
          vec4 hit = sceneSDF(p);

          if (hit.x < 0.001) {
            vec3 n = calcNormal(p);
            vec3 lightDir = normalize(vec3(1, 2, 1));
            float diff = max(dot(n, lightDir), 0.0);
            float amb = 0.2;
            col = hit.yzw * (amb + diff * 0.8);
            break;
          }

          t += hit.x;
          if (t > 50.0) break;
        }

        // Gamma
        col = pow(col, vec3(0.4545));
        fragColor = vec4(col, 1.0);
      }
    `;

    // Compile shaders
    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    const vs = createShader(gl, gl.VERTEX_SHADER, vertexShader);
    const fs = createShader(gl, gl.FRAGMENT_SHADER, fragmentShader);

    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(program));
    }

    // Fullscreen quad
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, 'a_position');
    const resolutionLoc = gl.getUniformLocation(program, 'u_resolution');
    const timeLoc = gl.getUniformLocation(program, 'u_time');
    const camPosLoc = gl.getUniformLocation(program, 'u_camPos');
    const camTargetLoc = gl.getUniformLocation(program, 'u_camTarget');

    // Camera
    let camDist = 8;
    let camTheta = 0.5;
    let camPhi = 0.4;
    let isDragging = false;
    let lastMouse = { x: 0, y: 0 };

    canvas.addEventListener('mousedown', e => {
      isDragging = true;
      lastMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      camTheta += (e.clientX - lastMouse.x) * 0.01;
      camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi + (e.clientY - lastMouse.y) * 0.01));
      lastMouse = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      camDist *= 1 + e.deltaY * 0.001;
      camDist = Math.max(2, Math.min(30, camDist));
    }, { passive: false });

    function resize() {
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    function render(time) {
      const t = time * 0.001;

      const camX = camDist * Math.sin(camPhi) * Math.sin(camTheta);
      const camY = camDist * Math.cos(camPhi);
      const camZ = camDist * Math.sin(camPhi) * Math.cos(camTheta);

      gl.useProgram(program);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.enableVertexAttribArray(positionLoc);
      gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

      gl.uniform2f(resolutionLoc, canvas.width, canvas.height);
      gl.uniform1f(timeLoc, t);
      gl.uniform3f(camPosLoc, camX, camY, camZ);
      gl.uniform3f(camTargetLoc, 0, 0.5, 0);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
