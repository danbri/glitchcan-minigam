<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alife games</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap');

  :root {
    --bg: #0a0a0a;
    --card-bg: #141414;
    --card-border: #222;
    --text: #d4d4d4;
    --text-dim: #666;
    --accent: #c8ff00;
    --danger: #ff3344;
    --success: #00cc88;
    --font-mono: 'DM Mono', monospace;
    --font-serif: 'Instrument Serif', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-weight: 300;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--card-border);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  header h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 24px;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  #stats {
    color: var(--text-dim);
    font-size: 11px;
    display: flex;
    gap: 16px;
  }

  #stats span { white-space: nowrap; }
  #stats .label { color: var(--text-dim); }
  #stats .value { color: var(--text); }

  #feed {
    max-width: 520px;
    margin: 0 auto;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
    transition: opacity 0.3s;
  }

  .game-card.paused {
    opacity: 0.45;
  }

  .game-card.paused .game-frame {
    pointer-events: none;
  }

  .game-card.dead {
    display: none;
  }

  .card-header {
    padding: 10px 14px 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .card-meta {
    flex: 1;
    min-width: 0;
  }

  .card-title {
    font-family: var(--font-serif);
    font-size: 17px;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 2px;
  }

  .card-desc {
    color: var(--text-dim);
    font-size: 11px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-gen {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    padding-top: 2px;
  }

  .game-frame-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: #000;
  }

  .game-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .paused-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
  }

  .game-card.paused .paused-overlay {
    display: flex;
  }

  .card-footer {
    padding: 8px 14px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .vote-buttons {
    display: flex;
    gap: 6px;
  }

  .vote-btn {
    background: none;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 4px 12px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .vote-btn:hover {
    border-color: var(--text-dim);
    color: var(--text);
  }

  .vote-btn.up:hover, .vote-btn.up.voted {
    border-color: var(--success);
    color: var(--success);
  }

  .vote-btn.down:hover, .vote-btn.down.voted {
    border-color: var(--danger);
    color: var(--danger);
  }

  .vote-btn.voted {
    pointer-events: none;
  }

  .card-lineage {
    font-size: 10px;
    color: var(--text-dim);
  }

  .card-lineage a {
    color: var(--text-dim);
    text-decoration: underline;
    text-decoration-style: dotted;
    cursor: pointer;
  }

  #empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }

  #empty-state h2 {
    font-family: var(--font-serif);
    font-size: 28px;
    color: var(--text);
    font-weight: 400;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>alife games</h1>
  <div id="stats">
    <span><span class="label">pop </span><span class="value" id="stat-pop">0</span></span>
    <span><span class="label">gen </span><span class="value" id="stat-gen">0</span></span>
    <span><span class="label">votes </span><span class="value" id="stat-votes">0</span></span>
  </div>
</header>

<div id="feed"></div>

<div id="empty-state">
  <h2>waiting for life</h2>
  <p>the evolution engine will seed the first organisms shortly.</p>
</div>

<script>
// ============================================================
// alife games - client-side state & automation API
// ============================================================

const DB_NAME = 'alife-games';
const DB_VERSION = 1;
const STORE = 'games';
const MAX_VISIBLE = 10;
const MAX_RUNNING = 2;

let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('created', 'created');
        store.createIndex('status', 'status');
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function txStore(mode) {
  return db.transaction(STORE, mode).objectStore(STORE);
}

function dbGet(id) {
  return new Promise((resolve, reject) => {
    const req = txStore('readonly').get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetAll() {
  return new Promise((resolve, reject) => {
    const req = txStore('readonly').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(game) {
  return new Promise((resolve, reject) => {
    const req = txStore('readwrite').put(game);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const req = txStore('readwrite').delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ============================================================
// Rendering
// ============================================================

function renderFeed(games) {
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty-state');

  const alive = games
    .filter(g => g.status === 'alive')
    .sort((a, b) => new Date(b.created) - new Date(a.created));

  empty.style.display = alive.length === 0 ? 'block' : 'none';

  const visible = alive.slice(0, MAX_VISIBLE);

  // Clear old cards
  feed.innerHTML = '';

  visible.forEach((game, i) => {
    const isRunning = i < MAX_RUNNING;
    const card = document.createElement('div');
    card.className = `game-card ${isRunning ? 'running' : 'paused'}`;
    card.dataset.id = game.id;

    const net = game.votes.up - game.votes.down;
    const parentInfo = game.parents && game.parents.length === 2
      ? `<span class="card-lineage">child of ${game.parents.map(p => `<a onclick="scrollToGame('${p}')">${p.slice(0,6)}</a>`).join(' + ')}</span>`
      : `<span class="card-lineage">spontaneous</span>`;

    card.innerHTML = `
      <div class="card-header">
        <div class="card-meta">
          <div class="card-title">${escapeHtml(game.title || game.id.slice(0,8))}</div>
          <div class="card-desc">${escapeHtml(game.description)}</div>
        </div>
        <div class="card-gen">g${game.generation}</div>
      </div>
      <div class="game-frame-container">
        ${isRunning ? `<iframe class="game-frame" sandbox="allow-scripts" srcdoc="${escapeAttr(game.blob)}"></iframe>` : ''}
        <div class="paused-overlay" onclick="activateGame('${game.id}')">scroll up or tap to play</div>
      </div>
      <div class="card-footer">
        <div class="vote-buttons">
          <button class="vote-btn up ${game.voted === 'up' ? 'voted' : ''}" onclick="vote('${game.id}','up')">+ ${game.votes.up}</button>
          <button class="vote-btn down ${game.voted === 'down' ? 'voted' : ''}" onclick="vote('${game.id}','down')">- ${game.votes.down}</button>
        </div>
        ${parentInfo}
      </div>
    `;

    feed.appendChild(card);
  });

  // Update stats
  document.getElementById('stat-pop').textContent = alive.length;
  document.getElementById('stat-gen').textContent = alive.length > 0 ? Math.max(...alive.map(g => g.generation)) : 0;
  document.getElementById('stat-votes').textContent = games.reduce((s, g) => s + g.votes.up + g.votes.down, 0);
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function escapeAttr(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function refreshFeed() {
  const games = await dbGetAll();
  renderFeed(games);
}

// ============================================================
// User actions
// ============================================================

async function vote(id, direction) {
  const game = await dbGet(id);
  if (!game || game.voted) return;
  game.votes[direction]++;
  game.voted = direction;
  await dbPut(game);
  await refreshFeed();
}

function scrollToGame(id) {
  const card = document.querySelector(`[data-id="${id}"]`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function activateGame(id) {
  // This just refreshes; in future could promote a paused game to running
  await refreshFeed();
}

// ============================================================
// Automation API - called by Claude Code via browser automation
// ============================================================

window.alife = {

  // Add a new game to the pool
  async addGame({ id, title, description, blob, parents, generation }) {
    const game = {
      id: id || crypto.randomUUID(),
      title: title || '',
      description: description || '',
      blob: blob || '<html><body style="background:#000;color:#fff;display:grid;place-items:center;height:100vh;font-family:monospace"><p>empty</p></body></html>',
      parents: parents || null,
      generation: generation || 0,
      created: new Date().toISOString(),
      votes: { up: 0, down: 0 },
      voted: null,
      status: 'alive'
    };
    await dbPut(game);
    await refreshFeed();
    return game.id;
  },

  // Get the full pool state
  async getPool() {
    return await dbGetAll();
  },

  // Get only alive games
  async getAlive() {
    const all = await dbGetAll();
    return all.filter(g => g.status === 'alive');
  },

  // Get thriving games (net positive votes, min 1 vote)
  async getThriving() {
    const all = await dbGetAll();
    return all.filter(g =>
      g.status === 'alive' &&
      (g.votes.up - g.votes.down) > 0 &&
      (g.votes.up + g.votes.down) >= 1
    );
  },

  // Get candidate parent pairs for crossover
  async getThrivingPairs() {
    const thriving = await window.alife.getThriving();
    if (thriving.length < 2) return [];
    const pairs = [];
    for (let i = 0; i < thriving.length; i++) {
      for (let j = i + 1; j < thriving.length; j++) {
        pairs.push([
          { id: thriving[i].id, description: thriving[i].description, generation: thriving[i].generation },
          { id: thriving[j].id, description: thriving[j].description, generation: thriving[j].generation }
        ]);
      }
    }
    return pairs;
  },

  // Kill a game
  async killGame(id) {
    const game = await dbGet(id);
    if (game) {
      game.status = 'dead';
      await dbPut(game);
      await refreshFeed();
    }
    return true;
  },

  // Hard delete a game
  async deleteGame(id) {
    await dbDelete(id);
    await refreshFeed();
    return true;
  },

  // Nuke everything (for reset)
  async reset() {
    const all = await dbGetAll();
    for (const g of all) await dbDelete(g.id);
    await refreshFeed();
    return true;
  },

  // Get summary stats
  async getStats() {
    const all = await dbGetAll();
    const alive = all.filter(g => g.status === 'alive');
    const thriving = alive.filter(g => (g.votes.up - g.votes.down) > 0);
    return {
      total: all.length,
      alive: alive.length,
      dead: all.length - alive.length,
      thriving: thriving.length,
      maxGeneration: alive.length > 0 ? Math.max(...alive.map(g => g.generation)) : 0,
      totalVotes: all.reduce((s, g) => s + g.votes.up + g.votes.down, 0)
    };
  }
};

// ============================================================
// Init
// ============================================================

(async () => {
  await openDB();
  await refreshFeed();
})();
</script>
</body>
</html>
