<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alife games</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap');

  :root {
    --bg: #0d1017;
    --card: #181d28;
    --border: #262d3d;
    --text: #e0e4ee;
    --text-dim: #9399b2;
    --accent: #b4e800;
    --accent-dim: #7a9f00;
    --success: #00d68f;
    --danger: #ff4070;
    --font-mono: 'DM Mono', monospace;
    --font-serif: 'Instrument Serif', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(30, 40, 60, 0.5) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(90, 116, 0, 0.03) 0%, transparent 40%);
    color: var(--text);
    font-family: var(--font-mono);
    font-weight: 300;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13, 16, 23, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px 0;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  header h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  #stats {
    color: var(--text-dim);
    font-size: 11px;
    display: flex;
    gap: 16px;
  }
  #stats .value { color: var(--text); }

  .tabs { display: flex; }

  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 6px 18px 8px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Tab switching: use ID selectors to match specificity */
  #feed, #lineage { display: none; }
  #feed.active { display: flex; }
  #lineage.active { display: block; }

  /* ---- FEED ---- */

  #feed {
    max-width: 700px;
    margin: 0 auto;
    padding: 16px 12px;
    flex-direction: column;
    gap: 12px;
  }

  .game-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: all 0.3s;
  }
  .game-card:hover { border-color: #363d55; }
  .game-card.paused { opacity: 0.85; }
  .game-card.paused:hover { opacity: 1; }
  .game-card.paused .game-frame { pointer-events: none; }
  .game-card.dead { display: none; }

  .card-header {
    padding: 10px 14px 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .card-meta { flex: 1; min-width: 0; }

  .card-title {
    font-family: var(--font-serif);
    font-size: 17px;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 2px;
  }

  .card-desc {
    color: var(--text-dim);
    font-size: 11px;
    line-height: 1.4;
  }

  .gen-badge {
    font-size: 10px;
    color: var(--accent-dim);
    background: rgba(180, 232, 0, 0.08);
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }

  .game-frame-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: #080a14;
  }

  .game-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .game-thumbnail {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .paused-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(8, 10, 20, 0.35);
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .paused-overlay:hover { background: rgba(8, 10, 20, 0.15); }
  .game-card.paused .paused-overlay { display: flex; }

  .card-footer {
    padding: 8px 14px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .vote-buttons { display: flex; gap: 6px; }

  .vote-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .vote-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .vote-btn.up:hover, .vote-btn.up.voted { border-color: var(--success); color: var(--success); }
  .vote-btn.down:hover, .vote-btn.down.voted { border-color: var(--danger); color: var(--danger); }
  .vote-btn.voted { pointer-events: none; }

  .card-lineage { font-size: 10px; color: var(--text-dim); }
  .card-lineage a { color: var(--text-dim); text-decoration: underline dotted; cursor: pointer; }

  /* ---- LINEAGE ---- */

  #lineage {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  .gen-section { margin-bottom: 32px; }

  .gen-label {
    font-size: 11px;
    color: var(--accent-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    padding-left: 12px;
    border-left: 2px solid var(--accent-dim);
  }

  .gen-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .tree-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 340px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .tree-card:hover { border-color: #464d6a; transform: translateY(-2px); }
  .tree-card.dead { opacity: 0.4; border-left: 2px solid var(--danger); }

  .tree-thumb {
    width: 100%;
    height: 200px;
    overflow: hidden;
    background: #080a14;
  }
  .tree-thumb iframe {
    width: 480px;
    height: 480px;
    border: none;
    pointer-events: none;
    display: block;
    transform: scale(0.417);
    transform-origin: top left;
  }
  .tree-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .tree-info { padding: 10px 12px 12px; }

  .tree-title {
    font-family: var(--font-serif);
    font-size: 16px;
    color: var(--text);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .tree-title .gen-badge { font-size: 9px; }

  .tree-origin {
    font-size: 11px;
    color: var(--accent-dim);
    margin-bottom: 8px;
  }

  .tree-genome {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
    font-style: italic;
    border-left: 2px solid var(--border);
    padding-left: 10px;
    margin-bottom: 8px;
  }

  .tree-parents {
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.4;
    border-left: 2px solid rgba(180, 232, 0, 0.15);
    padding-left: 10px;
    margin-bottom: 8px;
  }
  .tree-parents .parent-label {
    color: var(--accent-dim);
    font-weight: 400;
  }
  .tree-parents .parent-desc {
    display: block;
    margin-top: 2px;
    font-style: italic;
  }

  .tree-fitness {
    font-size: 11px;
    color: var(--text-dim);
  }
  .tree-fitness .alive { color: var(--success); }
  .tree-fitness .dead { color: var(--danger); }

  /* ---- EMPTY STATE ---- */

  #empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }
  #empty-state h2 {
    font-family: var(--font-serif);
    font-size: 28px;
    color: var(--text);
    font-weight: 400;
    margin-bottom: 8px;
  }

  @media (max-width: 420px) {
    .tree-card { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>alife games</h1>
    <div id="stats">
      <span><span class="label">pop </span><span class="value" id="stat-pop">0</span></span>
      <span><span class="label">gen </span><span class="value" id="stat-gen">0</span></span>
      <span><span class="label">votes </span><span class="value" id="stat-votes">0</span></span>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="feed">feed</button>
    <button class="tab-btn" data-tab="lineage">lineage</button>
  </nav>
</header>

<div id="feed" class="active"></div>
<div id="lineage"></div>

<div id="empty-state">
  <h2>waiting for life</h2>
  <p>the evolution engine will seed the first organisms shortly.</p>
</div>

<script>
// ============================================================
// IndexedDB
// ============================================================

const DB_NAME = 'alife-games';
const DB_VERSION = 2;
const STORE = 'games';
const MAX_VISIBLE = 10;
const MAX_RUNNING = 2;

let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('created', 'created');
        store.createIndex('status', 'status');
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function txStore(mode) { return db.transaction(STORE, mode).objectStore(STORE); }

function dbGet(id) {
  return new Promise((resolve, reject) => {
    const req = txStore('readonly').get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetAll() {
  return new Promise((resolve, reject) => {
    const req = txStore('readonly').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(game) {
  return new Promise((resolve, reject) => {
    const req = txStore('readwrite').put(game);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const req = txStore('readwrite').delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ============================================================
// Helpers
// ============================================================

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function escapeAttr(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// Thumbnail capture
// ============================================================

const CAPTURE_SCRIPT = `
<script>
(function() {
  var captured = false;
  function tryCapture() {
    if (captured) return;
    var canvas = document.querySelector('canvas');
    if (canvas) {
      try {
        var data = canvas.toDataURL('image/jpeg', 0.7);
        if (data && data.length > 100) {
          parent.postMessage({ type: 'alife-thumbnail', data: data }, '*');
          captured = true;
          return;
        }
      } catch(e) {}
    }
    // fallback: html2canvas-lite via svg foreignObject
    try {
      var body = document.body;
      var w = body.scrollWidth || 480;
      var h = body.scrollHeight || 480;
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
        + '<foreignObject width="100%" height="100%">'
        + '<div xmlns="http://www.w3.org/1999/xhtml"'
        + ' style="width:'+w+'px;height:'+h+'px;overflow:hidden">'
        + body.outerHTML
        + '</div></foreignObject></svg>';
      // Can't use foreignObject cross-origin in srcdoc, just send a colored rect
    } catch(e) {}
  }
  // try at multiple intervals to catch animations
  setTimeout(tryCapture, 800);
  setTimeout(tryCapture, 2000);
  setTimeout(tryCapture, 4000);
})();
<\/script>`;

// Listen for thumbnail messages from game iframes
window.addEventListener('message', async (e) => {
  if (e.data && e.data.type === 'alife-thumbnail' && e.data.data) {
    // Find which iframe sent this
    const iframes = document.querySelectorAll('.game-frame');
    for (const iframe of iframes) {
      if (iframe.contentWindow === e.source) {
        const card = iframe.closest('.game-card');
        if (card) {
          const id = card.dataset.id;
          const game = await dbGet(id);
          if (game && !game.thumbnail) {
            game.thumbnail = e.data.data;
            await dbPut(game);
          }
        }
        break;
      }
    }
  }
});

// Inject capture script into blob
function blobWithCapture(blob) {
  if (!blob) return blob;
  // Insert capture script before </body> or at end
  if (blob.includes('</body>')) {
    return blob.replace('</body>', CAPTURE_SCRIPT + '</body>');
  }
  return blob + CAPTURE_SCRIPT;
}

// ============================================================
// Tabs
// ============================================================

let treeStale = true;

document.querySelector('.tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  const tab = btn.dataset.tab;

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('feed').classList.remove('active');
  document.getElementById('lineage').classList.remove('active');
  document.getElementById(tab).classList.add('active');

  if (tab === 'lineage' && treeStale) {
    refreshTree();
    treeStale = false;
  }
});

// ============================================================
// Feed rendering
// ============================================================

function renderFeed(games) {
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty-state');

  const alive = games
    .filter(g => g.status === 'alive')
    .sort((a, b) => new Date(b.created) - new Date(a.created));

  empty.style.display = alive.length === 0 ? 'block' : 'none';
  const visible = alive.slice(0, MAX_VISIBLE);
  feed.innerHTML = '';

  visible.forEach((game, i) => {
    const isRunning = i < MAX_RUNNING;
    const card = document.createElement('div');
    card.className = `game-card ${isRunning ? 'running' : 'paused'}`;
    card.dataset.id = game.id;

    const parentInfo = game.parents && game.parents.length === 2
      ? `<span class="card-lineage">child of ${game.parents.map(p =>
          `<a onclick="scrollToGame('${p}')">${p.slice(0,6)}</a>`).join(' + ')}</span>`
      : `<span class="card-lineage">spontaneous</span>`;

    let frameContent;
    if (isRunning) {
      frameContent = `<iframe class="game-frame" sandbox="allow-scripts" srcdoc="${escapeAttr(blobWithCapture(game.blob))}"></iframe>`;
    } else if (game.thumbnail) {
      frameContent = `<img class="game-thumbnail" src="${escapeAttr(game.thumbnail)}" alt="${escapeAttr(game.title)}">`;
    } else {
      // no thumbnail yet: show the game briefly in a hidden iframe to capture
      frameContent = `<div style="width:100%;height:100%;display:grid;place-items:center;color:var(--text-dim);font-size:11px">${escapeHtml(game.title)}</div>`;
    }

    card.innerHTML = `
      <div class="card-header">
        <div class="card-meta">
          <div class="card-title">${escapeHtml(game.title || game.id.slice(0,8))}</div>
          <div class="card-desc">${escapeHtml(game.description)}</div>
        </div>
        <div class="gen-badge">g${game.generation}</div>
      </div>
      <div class="game-frame-container">
        ${frameContent}
        <div class="paused-overlay" onclick="activateGame('${game.id}')">scroll up or tap to play</div>
      </div>
      <div class="card-footer">
        <div class="vote-buttons">
          <button class="vote-btn up ${game.voted === 'up' ? 'voted' : ''}" onclick="vote('${game.id}','up')">+ ${game.votes.up}</button>
          <button class="vote-btn down ${game.voted === 'down' ? 'voted' : ''}" onclick="vote('${game.id}','down')">- ${game.votes.down}</button>
        </div>
        ${parentInfo}
      </div>
    `;
    feed.appendChild(card);
  });

  updateStats(games);

  // Kick off thumbnail capture for running games that don't have one yet
  captureRunningThumbnails(visible);
}

async function captureRunningThumbnails(visible) {
  // For games that are running (have iframes) and don't have thumbnails yet,
  // the CAPTURE_SCRIPT injected into their blob will postMessage back.
  // We also attempt capture for paused games without thumbnails
  // by briefly loading them in a hidden iframe
  for (let i = MAX_RUNNING; i < visible.length; i++) {
    const game = visible[i];
    if (!game.thumbnail) {
      attemptBackgroundCapture(game);
    }
  }
}

function attemptBackgroundCapture(game) {
  const iframe = document.createElement('iframe');
  iframe.sandbox = 'allow-scripts';
  iframe.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:480px;height:480px;opacity:0;pointer-events:none';
  iframe.srcdoc = blobWithCapture(game.blob);
  iframe.dataset.captureId = game.id;
  document.body.appendChild(iframe);

  // Clean up after 6 seconds
  setTimeout(() => {
    if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
  }, 6000);
}

// Handle thumbnail from background capture iframes
window.addEventListener('message', async function bgCapture(e) {
  if (e.data && e.data.type === 'alife-thumbnail' && e.data.data) {
    const hiddenFrames = document.querySelectorAll('iframe[data-capture-id]');
    for (const iframe of hiddenFrames) {
      if (iframe.contentWindow === e.source) {
        const id = iframe.dataset.captureId;
        const game = await dbGet(id);
        if (game && !game.thumbnail) {
          game.thumbnail = e.data.data;
          await dbPut(game);
          // Refresh to show the new thumbnail
          await refreshFeed();
        }
        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
        break;
      }
    }
  }
});

function updateStats(games) {
  const alive = games.filter(g => g.status === 'alive');
  document.getElementById('stat-pop').textContent = alive.length;
  document.getElementById('stat-gen').textContent = alive.length > 0
    ? Math.max(...alive.map(g => g.generation)) : 0;
  document.getElementById('stat-votes').textContent =
    games.reduce((s, g) => s + g.votes.up + g.votes.down, 0);
}

// ============================================================
// Lineage tree rendering
// ============================================================

function renderTree(games) {
  const container = document.getElementById('lineage');
  container.innerHTML = '';

  if (games.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:var(--text-dim);padding:60px">no organisms yet</p>';
    return;
  }

  const byId = {};
  games.forEach(g => byId[g.id] = g);

  const gens = {};
  games.forEach(g => {
    const gen = g.generation || 0;
    if (!gens[gen]) gens[gen] = [];
    gens[gen].push(g);
  });

  for (const gen of Object.keys(gens).sort((a, b) => a - b)) {
    const section = document.createElement('div');
    section.className = 'gen-section';

    const label = document.createElement('div');
    label.className = 'gen-label';
    label.textContent = gen === '0'
      ? 'generation 0 \u2014 spontaneous'
      : `generation ${gen} \u2014 bred`;
    section.appendChild(label);

    const cards = document.createElement('div');
    cards.className = 'gen-cards';

    const sorted = gens[gen].sort((a, b) =>
      new Date(a.created) - new Date(b.created));

    for (const game of sorted) {
      const card = document.createElement('div');
      card.className = `tree-card${game.status === 'dead' ? ' dead' : ''}`;

      let originHtml;
      if (game.parents && game.parents.length === 2) {
        const p1 = byId[game.parents[0]];
        const p2 = byId[game.parents[1]];
        originHtml = `${escapeHtml(p1?.title || '?')} \u00d7 ${escapeHtml(p2?.title || '?')}`;
      } else {
        originHtml = 'spontaneous';
      }

      const net = game.votes.up - game.votes.down;
      const netStr = net > 0 ? '+' + net : '' + net;
      const netColor = net > 0 ? 'var(--success)' : net < 0 ? 'var(--danger)' : 'var(--text-dim)';

      // Thumbnail or iframe
      let thumbHtml;
      if (game.thumbnail) {
        thumbHtml = `<img src="${escapeAttr(game.thumbnail)}" alt="${escapeAttr(game.title)}" loading="lazy">`;
      } else {
        thumbHtml = `<iframe sandbox="allow-scripts" srcdoc="${escapeAttr(game.blob)}" loading="lazy"></iframe>`;
      }

      // Parent descriptions for bred games
      let parentsHtml = '';
      if (game.parents && game.parents.length === 2) {
        const p1 = byId[game.parents[0]];
        const p2 = byId[game.parents[1]];
        parentsHtml = `<div class="tree-parents">
          <div><span class="parent-label">${escapeHtml(p1?.title || '?')}:</span>
          <span class="parent-desc">${escapeHtml(p1?.description || 'unknown')}</span></div>
          <div style="margin-top:6px"><span class="parent-label">${escapeHtml(p2?.title || '?')}:</span>
          <span class="parent-desc">${escapeHtml(p2?.description || 'unknown')}</span></div>
        </div>`;
      }

      card.innerHTML = `
        <div class="tree-thumb">
          ${thumbHtml}
        </div>
        <div class="tree-info">
          <div class="tree-title">
            <span>${escapeHtml(game.title)}</span>
            <span class="gen-badge">g${game.generation}</span>
          </div>
          <div class="tree-origin">${originHtml}</div>
          <div class="tree-genome">${escapeHtml(game.description)}</div>
          ${parentsHtml}
          <div class="tree-fitness">
            <span style="color:${netColor}">${netStr}</span>
            &middot;
            <span class="${game.status}">${game.status}</span>
          </div>
        </div>
      `;
      cards.appendChild(card);
    }

    section.appendChild(cards);
    container.appendChild(section);
  }
}

// ============================================================
// User actions
// ============================================================

async function vote(id, direction) {
  const game = await dbGet(id);
  if (!game || game.voted) return;
  game.votes[direction]++;
  game.voted = direction;
  await dbPut(game);
  treeStale = true;
  await refreshFeed();
}

function scrollToGame(id) {
  const card = document.querySelector(`[data-id="${id}"]`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function activateGame(id) { await refreshFeed(); }

// ============================================================
// Refresh
// ============================================================

async function refreshFeed() {
  const games = await dbGetAll();
  renderFeed(games);
}

async function refreshTree() {
  const games = await dbGetAll();
  renderTree(games);
}

// ============================================================
// Automation API
// ============================================================

window.alife = {

  async addGame({ id, title, description, blob, parents, generation }) {
    const game = {
      id: id || crypto.randomUUID(),
      title: title || '',
      description: description || '',
      blob: blob || '<html><body style="background:#000;color:#fff;display:grid;place-items:center;height:100vh;font-family:monospace"><p>empty</p></body></html>',
      parents: parents || null,
      generation: generation || 0,
      created: new Date().toISOString(),
      votes: { up: 0, down: 0 },
      voted: null,
      status: 'alive',
      thumbnail: null
    };
    await dbPut(game);
    treeStale = true;
    await refreshFeed();
    return game.id;
  },

  async getPool() { return await dbGetAll(); },

  async getAlive() {
    return (await dbGetAll()).filter(g => g.status === 'alive');
  },

  async getThriving() {
    return (await dbGetAll()).filter(g =>
      g.status === 'alive' &&
      (g.votes.up - g.votes.down) > 0 &&
      (g.votes.up + g.votes.down) >= 1
    );
  },

  async getThrivingPairs() {
    const thriving = await window.alife.getThriving();
    if (thriving.length < 2) return [];
    const pairs = [];
    for (let i = 0; i < thriving.length; i++)
      for (let j = i + 1; j < thriving.length; j++)
        pairs.push([
          { id: thriving[i].id, description: thriving[i].description, generation: thriving[i].generation },
          { id: thriving[j].id, description: thriving[j].description, generation: thriving[j].generation }
        ]);
    return pairs;
  },

  async killGame(id) {
    const game = await dbGet(id);
    if (game) { game.status = 'dead'; await dbPut(game); treeStale = true; await refreshFeed(); }
    return true;
  },

  async deleteGame(id) {
    await dbDelete(id);
    treeStale = true;
    await refreshFeed();
    return true;
  },

  async reset() {
    const all = await dbGetAll();
    for (const g of all) await dbDelete(g.id);
    treeStale = true;
    await refreshFeed();
    return true;
  },

  async getStats() {
    const all = await dbGetAll();
    const alive = all.filter(g => g.status === 'alive');
    const thriving = alive.filter(g => (g.votes.up - g.votes.down) > 0);
    return {
      total: all.length, alive: alive.length,
      dead: all.length - alive.length, thriving: thriving.length,
      maxGeneration: alive.length > 0 ? Math.max(...alive.map(g => g.generation)) : 0,
      totalVotes: all.reduce((s, g) => s + g.votes.up + g.votes.down, 0)
    };
  }
};

// ============================================================
// Init
// ============================================================

(async () => {
  await openDB();
  await refreshFeed();
})();
</script>
