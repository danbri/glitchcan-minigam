<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Lantern Cellar</title>
<style>
/* A graphic-novel page for Drift city, built on <novel-page> (novel-page.js). Panels are polygons in page pixels;
   the angled gutters are the gaps between them. Video sources: VP9 WebM first, H.264 MP4 for the rest.
   Caption boxes (.cap) hold owner-written text only; they are empty now and hidden while empty.
   The ink window below the page plays cellar.ink, in step with the view. */
html, body { margin: 0; height: 100%; background: #0a0908; overflow: hidden; }
novel-page { height: 100vh; height: 100dvh; padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
novel-page > section { background: #000; }
novel-page > section > img, novel-page > section > video {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
}
/* stills breathe a little until they are replaced by moving panels */
novel-page > section > img { animation: drift 22s ease-in-out infinite alternate; }
novel-page > section:nth-of-type(odd) > img { animation-duration: 27s; animation-direction: alternate-reverse; }
@keyframes drift { from { transform: scale(1.02) translate(0, 0); } to { transform: scale(1.09) translate(-1.5%, 1%); } }
@media (prefers-reduced-motion: reduce) { novel-page > section > img { animation: none; } }
.a > img { object-position: 50% 34%; }
.c > img { object-position: 50% 45%; }
.d > img { object-position: 50% 28%; }
.cap {
  position: absolute; z-index: 2; max-width: 62%; margin: 0; padding: 10px 14px 9px;
  background: #efe4c8; color: #1a1510; border: 3px solid #0a0908;
  font: 24px/1.25 "Courier New", monospace; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.55);
}
.cap:empty { display: none; }
.cap.tl { left: 0; top: 0; } .cap.br { right: 0; bottom: 0; } .cap.bl { left: 0; bottom: 0; }
.ink { box-sizing: border-box; height: clamp(170px, 31vh, 300px); overflow: auto; padding: 12px 16px 16px; font: 16px/1.45 system-ui, sans-serif; color: #efe4c8; border-top: 1px solid #2a2520; }
.ink p { margin: 0 0 8px; }
.ink .choice { display: block; width: 100%; margin: 6px 0 0; padding: 10px 12px; text-align: left; font: inherit;
  color: inherit; background: #1b1814; border: 1px solid #3a332b; border-radius: 8px; }
#hint {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  font: 13px/1.2 system-ui, sans-serif; color: rgba(239, 228, 200, 0.75); background: rgba(0, 0, 0, 0.55);
  padding: 6px 12px; border-radius: 999px; pointer-events: none; transition: opacity 1.2s;
}
#hint.gone { opacity: 0; }
</style>
</head>
<body>
<novel-page id="page" width="1080" height="1520" zoom="2.2" duration="1400" easing="cubic-bezier(0.7, 0, 0.25, 1)" knot="page"
            aria-label="The Lantern Cellar: a page of four panels">
  <section class="a" knot="door" points="26,26 1054,26 1054,448 26,490"
           aria-label="A man in a long coat stands in a brick cellar hung with red lanterns, looking toward a small stage.">
    <img src="media/cellar-arrival.jpg" alt="">
    <p class="cap tl"></p>
  </section>
  <section class="b" knot="stage" points="26,520 662,494 603,1161 26,1135"
           aria-label="On the stage, a woman in a green dress and fur-collared jacket plays a small drum kit with brushes under a red paper lantern.">
    <video poster="media/cellar-lantern-poster.jpg" autoplay muted loop playsinline preload="auto"><source src="media/cellar-lantern-loop.webm" type='video/webm; codecs="vp9"'><source src="media/cellar-lantern-loop.mp4" type="video/mp4"></video>
    <p class="cap br"></p>
  </section>
  <section class="c" knot="side" points="692,493 1054,478 1054,1181 633,1162"
           aria-label="The same woman, seen from the side, seated by a microphone in the haze.">
    <img src="media/cellar-singer-horn.jpg" alt="">
  </section>
  <section class="d" knot="street" points="26,1165 1054,1211 1054,1494 26,1494"
           aria-label="Outside at night on Titan: methane snow falls on an icy street under a glass traffic tube; three people in coat-cut pressure suits and bubble helmets walk apart.">
    <img src="media/street-snow.jpg" alt="">
    <p class="cap bl"></p>
  </section>
  <div slot="ink" class="ink"></div>
</novel-page>
<div id="hint">Tap a panel. Drag or throw to move. Tap again to see the page.</div>
<script src="../../third_party/ink/ink-full.js"></script>
<script type="module">
import "./novel-page.js";
const page = document.getElementById("page"), hint = document.getElementById("hint");
page.addEventListener("panelchange", () => hint.classList.add("gone"));
setTimeout(() => hint.classList.add("gone"), 5000);
// the story for this page: one knot per panel (cellar.ink), compiled here by the real ink compiler
try {
  const src = await (await fetch("cellar.ink")).text();
  page.play(new inkjs.Story(new inkjs.Compiler(src).Compile().ToJson()));
} catch (e) { console.error("cellar.ink:", e); }
</script>
</body>
</html>
